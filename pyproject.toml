# The DeepOps control-node environment. This file and uv.lock are the one place its
# Python and tool versions are set; uv provides the interpreter, so the host's own
# Python does not matter. Run everything through uv, which keeps .venv equal to
# uv.lock before each command:
#   uv run ansible-playbook ...      uv run scripts/check.sh
# Collections and Galaxy roles are pinned in roles/requirements.yml (ansible-core
# ships none); scripts/deepops/galaxy.py installs them. Kubespray pins its own
# Ansible and runs from .venv-kubespray (see scripts/setup.sh).
[project]
name = "deepops-control-node"
version = "0"
requires-python = "==3.14.*"
dependencies = [
  "ansible-core==2.22.0",
  "Jinja2==3.1.6",
  "MarkupSafe==3.0.4",
  "PyYAML==6.0.3",
  "jmespath==1.1.0",
  "netaddr==1.3.0",
  "packaging==26.2",
  "paramiko==5.0.0",
  "passlib==1.7.4",
  "PyMySQL==1.2.0",
  "ruamel.yaml==0.19.1",
  "selinux==0.3.0",
]

[dependency-groups]
dev = [
  "ansible-lint==26.11.0",
  "yamllint==1.38.0",
  "molecule==26.11.0",
  "molecule-plugins[docker]==26.11.0",
  "docker==7.2.0",
  "pre-commit==4.7.0",
]

[tool.uv]
package = false
required-version = "==0.12.9"
default-groups = ["dev"]
