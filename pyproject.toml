# The DeepOps control-node environment. This file and uv.lock are the one place its
# Python and tool versions are set; uv provides the interpreter, so the host's own
# Python does not matter. Run everything through uv, which keeps .venv equal to
# uv.lock before each command:
#   uv run ansible-playbook ...      uv run scripts/check.sh
# Collections and Galaxy roles are pinned in roles/requirements.yml (ansible-core
# ships none); scripts/deepops/galaxy.py installs them. Kubespray pins its own
# Ansible and runs from .venv-kubespray (see scripts/setup.sh).
[project]
name = "deepops-control-node"
version = "0"
requires-python = "==3.14.*"
dependencies = [
  "ansible-core==2.22.0",
  "Jinja2==3.1.6",
  "MarkupSafe==3.0.4",
  "PyYAML==6.0.3",
  "jmespath==1.1.0",
  "netaddr==1.3.0",
  "packaging==26.2",
  "paramiko==5.0.0",
  "passlib==1.7.4",
  "PyMySQL==1.2.0",
  "ruamel.yaml==0.19.1",
  "selinux==0.3.0",
]

[dependency-groups]
dev = [
  "ansible-lint==26.11.0",
  "yamllint==1.38.0",
  "molecule==26.11.0",
  "molecule-plugins[docker]==26.11.0",
  "docker==7.2.0",
  "pre-commit==4.7.0",
  "ruff==0.17.5",
]

[tool.uv]
package = false
required-version = "==0.12.9"
default-groups = ["dev"]

# Python lint and format. The excludes live here, not in check.sh, so a bare `ruff
# check` or `ruff format` covers what check.sh does. py39: several scripts run on nodes
# under the distro Python, RHEL 9's included. The formatter keeps ruff's defaults (the
# Black style); its one repo-wide pass is listed in .git-blame-ignore-revs.
[tool.ruff]
line-length = 110
target-version = "py39"
extend-exclude = ["submodules", "roles/galaxy", "collections", ".venv*"]

[tool.ruff.lint]
# ruff's defaults plus invalid escapes. Line length is the formatter's job; E501 would
# only flag the long strings, URLs and comments it rightly leaves whole.
select = ["E4", "E7", "E9", "F", "W6"]

[tool.ruff.lint.per-file-ignores]
# Ansible modules put DOCUMENTATION, EXAMPLES and RETURN before their imports.
"roles/*/library/*.py" = ["E402"]
