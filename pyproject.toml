# Python tools for the DeepOps control node. This file and uv.lock are the one place
# their versions are set: scripts/setup.sh, CI and the pre-commit hook all run
# `uv sync --locked`. uv also provides the interpreter, so the control node's own
# Python version does not matter. Kubespray runs from its own environment, built
# from submodules/kubespray/requirements.txt (see scripts/setup.sh).
[project]
name = "deepops-control-node"
version = "0"
requires-python = "==3.14.*"
dependencies = [
  "ansible==15.0.0",
  "ansible-core==2.22.0",
  "Jinja2==3.1.6",
  "MarkupSafe==3.0.4",
  "PyYAML==6.0.3",
  "jmespath==1.1.0",
  "netaddr==1.3.0",
  "packaging==26.2",
  "paramiko==5.0.0",
  "passlib==1.7.4",
  "PyMySQL==1.2.0",
  "ruamel.yaml==0.19.1",
  "selinux==0.3.0",
]

[dependency-groups]
dev = [
  "ansible-lint==26.11.0",
  "yamllint==1.38.0",
  "molecule==26.11.0",
  "molecule-plugins[docker]==26.11.0",
  "docker==7.2.0",
  "pre-commit==4.7.0",
]

[tool.uv]
package = false
required-version = "==0.12.9"
default-groups = ["dev"]
