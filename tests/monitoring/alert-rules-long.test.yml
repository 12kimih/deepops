---
# Cases that span days or weeks (backups, updates). promtool evaluates every rule at
# evaluation_interval over the whole span, so these run hourly; the minute-level cases
# are in alert-rules.test.yml.
rule_files:
  - ../../roles/prometheus/files/rules/*.yml
evaluation_interval: 1h

tests:
  - name: a failed backup pages; a stale one pages unless it already failed
    interval: 1h
    input_series:
      - series: 'slurm_backup_last_status{host="m", instance="m:9100", destination="/a"}'
        values: '0x48'
      - series: 'slurm_backup_last_success_timestamp_seconds{host="m", instance="m:9100", destination="/a"}'
        values: '0x48'
      - series: 'slurm_backup_last_status{host="m", instance="m:9100", destination="/b"}'
        values: '1x48'
      - series: 'slurm_backup_last_success_timestamp_seconds{host="m", instance="m:9100", destination="/b"}'
        values: '0x48'
    alert_rule_test:
      - eval_time: 1h
        alertname: SlurmBackupFailed
        exp_alerts:
          - exp_labels: {severity: critical, host: m, instance: "m:9100", destination: /a}
            exp_annotations:
              summary: "The last Slurm backup to /a failed"
              description: "`journalctl -u slurm-backup@backup` on m says why; the accounting database and controller state have no fresh copy there."
      - eval_time: 30h
        alertname: SlurmBackupStale
        exp_alerts: []
      - eval_time: 40h
        alertname: SlurmBackupStale
        exp_alerts:
          - exp_labels: {severity: critical, host: m, instance: "m:9100", destination: /b}
            exp_annotations:
              summary: "No Slurm backup to /b has succeeded for 36 hours"
              description: "The daily backup did not run or stopped before writing its result: `systemctl list-timers slurm-backup*` and `journalctl -u slurm-backup@backup` on m."

  - name: restore test failure warns; a stale or never-run test warns after 40 days
    interval: 1d
    input_series:
      - series: 'slurm_backup_restore_test_status{host="m", instance="m:9100"}'
        values: '0x45'
      - series: 'slurm_backup_restore_test_status{host="m2", instance="m2:9100"}'
        values: '1x45'
      - series: 'slurm_backup_restore_test_last_success_timestamp_seconds{host="m2", instance="m2:9100"}'
        values: '0x45'
      # Configured, the test never ran (m3), or ran and failed (m) or passed (m2) since.
      - series: 'slurm_backup_restore_test_configured_timestamp_seconds{host="m", instance="m:9100"}'
        values: '0x45'
      - series: 'slurm_backup_restore_test_configured_timestamp_seconds{host="m2", instance="m2:9100"}'
        values: '0x45'
      - series: 'slurm_backup_restore_test_configured_timestamp_seconds{host="m3", instance="m3:9100"}'
        values: '0x45'
    alert_rule_test:
      - eval_time: 1d
        alertname: SlurmBackupRestoreTestFailed
        exp_alerts:
          - exp_labels: {severity: warning, host: m, instance: "m:9100"}
            exp_annotations:
              summary: "The monthly Slurm backup restore test failed on m"
              description: "A backup that does not restore is no backup: `journalctl -u slurm-backup@restore-test`."
      - eval_time: 39d
        alertname: SlurmBackupRestoreTestStale
        exp_alerts: []
      - eval_time: 41d
        alertname: SlurmBackupRestoreTestStale
        exp_alerts:
          - exp_labels: {severity: warning, host: m2, instance: "m2:9100"}
            exp_annotations:
              summary: "No Slurm backup restore test has passed on m2 for 40 days"
              description: "The monthly restore test did not run, or never has: `systemctl list-timers slurm-backup*`."
          - exp_labels: {severity: warning, host: m3, instance: "m3:9100"}
            exp_annotations:
              summary: "No Slurm backup restore test has passed on m3 for 40 days"
              description: "The monthly restore test did not run, or never has: `systemctl list-timers slurm-backup*`."

  - name: long-pending security updates and reboots warn; stale update metrics warn
    interval: 1d
    input_series:
      - series: 'os_updates_security_pending_since_seconds{host="n1", instance="n1:9100"}'
        values: '86400x20'
      - series: 'os_updates_security_pending_since_seconds{host="n2", instance="n2:9100"}'
        values: '0x20'
      - series: 'os_updates_apt_ok{host="n1", instance="n1:9100"}'
        values: '1x20'
      - series: 'os_updates_reboot_required{host="n1", instance="n1:9100"}'
        values: '1x20'
      - series: 'os_updates_reboot_required_since_seconds{host="n1", instance="n1:9100"}'
        values: '86400x20'
      - series: 'os_updates_metrics_timestamp_seconds{host="n1", instance="n1:9100"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 14d
        alertname: OsSecurityUpdatesPending
        exp_alerts: []
      - eval_time: 16d
        alertname: OsSecurityUpdatesPending
        exp_alerts:
          - exp_labels: {severity: warning, host: n1, instance: "n1:9100"}
            exp_annotations:
              summary: "Security updates have waited on n1 for over 14 days"
              description: "Held-back packages need the rolling upgrade: `ansible-playbook -K playbooks/utilities/apt-upgrade.yml -e hostlist=n1`."
      - eval_time: 16d
        alertname: OsRebootPending
        exp_alerts:
          - exp_labels: {severity: warning, host: n1, instance: "n1:9100"}
            exp_annotations:
              summary: "n1 has waited over 14 days for a reboot an update asked for"
              description: "The update is not in effect until then: `ansible-playbook -K playbooks/utilities/apt-upgrade.yml -e hostlist=n1` drains the node, reboots it and puts it back."
      - eval_time: 2d
        alertname: OsUpdatesMetricsStale
        exp_alerts: []
      - eval_time: 4d
        alertname: OsUpdatesMetricsStale
        exp_alerts:
          - exp_labels: {severity: warning, host: n1, instance: "n1:9100"}
            exp_annotations:
              summary: "Update status from n1 is over 3 days old"
              description: "The os-updates metrics timer stopped: `systemctl status os-updates-metrics.timer` on the host."

  - name: hosts that stay apart for over a day warn, a difference that passes does not
    interval: 1h
    input_series:
      - series: 'os_updates_package_info{host="n1", instance="n1:9100", package="libfoo", source="repo", version="1.1"}'
        values: '1x40'
      - series: 'os_updates_package_info{host="n2", instance="n2:9100", package="libfoo", source="repo", version="1.0"}'
        values: '1x40'
      - series: 'os_updates_package_info{host="n1", instance="n1:9100", package="libbar", source="repo", version="2.1"}'
        values: '1x40'
      - series: 'os_updates_package_info{host="n2", instance="n2:9100", package="libbar", source="repo", version="2.0"}'
        values: '1x10 stale'
      - series: 'os_updates_package_info{host="n2", instance="n2:9100", package="libbar", source="repo", version="2.1"}'
        values: '_x11 1x29'
      - series: 'os_updates_package_info{host="n1", instance="n1:9100", package="vendortool", source="local", version="4.2"}'
        values: '1x40'
      - series: 'os_updates_package_info{host="n2", instance="n2:9100", package="vendortool", source="local", version="4.1"}'
        values: '1x40'
      - series: 'node_uname_info{host="n1", instance="n1:9100", release="6.8.0-149-generic"}'
        values: '1x40'
      - series: 'node_uname_info{host="n2", instance="n2:9100", release="6.8.0-147-generic"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 20h
        alertname: OsPackageVersionsDiffer
        exp_alerts: []
      - eval_time: 30h
        alertname: OsPackageVersionsDiffer
        exp_alerts:
          - exp_labels: {severity: warning, package: libfoo, source: repo}
            exp_annotations:
              summary: "libfoo is installed at 2 different versions across the hosts"
              description: "n1: 1.1; n2: 1.0; `ansible-playbook -K playbooks/utilities/apt-upgrade.yml` brings them level."
          - exp_labels: {severity: warning, package: vendortool, source: local}
            exp_annotations:
              summary: "vendortool is installed at 2 different versions across the hosts"
              description: "n1: 4.2; n2: 4.1; No apt source offers it, so an upgrade cannot change it: no host's component record names what installed it (a .deb installed by hand?)."
      - eval_time: 30h
        alertname: OsKernelsDiffer
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "The hosts run 2 different kernels"
              description: "n1: 6.8.0-149-generic; n2: 6.8.0-147-generic;  A node left out of the last maintenance reboot runs the old one. `ansible-playbook -K playbooks/utilities/apt-upgrade.yml` reboots each into the installed kernel."

  - name: a local package names the component that installs it; a component's own drift is its alert alone
    interval: 1h
    input_series:
      # enroot on n1 (no record: installed before records) and n2 (recorded at 4.2.1-1)
      - series: 'os_updates_package_info{host="n1", instance="n1:9100", package="enroot", source="local", version="4.2.0-1"}'
        values: '1x40'
      - series: 'os_updates_package_info{host="n2", instance="n2:9100", package="enroot", source="local", version="4.2.1-1"}'
        values: '1x40'
      - series: 'os_updates_package_component_info{host="n2", instance="n2:9100", package="enroot", component="enroot"}'
        values: '1x40'
      - series: 'os_updates_component_info{host="n2", instance="n2:9100", component="enroot", version="4.2.1-1"}'
        values: '1x40'
      # pyxis recorded at two versions, its package too: one alert, the component's
      - series: 'os_updates_package_info{host="n1", instance="n1:9100", package="pyxis", source="local", version="0.20"}'
        values: '1x40'
      - series: 'os_updates_package_info{host="n2", instance="n2:9100", package="pyxis", source="local", version="0.21"}'
        values: '1x40'
      - series: 'os_updates_package_component_info{host="n1", instance="n1:9100", package="pyxis", component="pyxis"}'
        values: '1x40'
      - series: 'os_updates_package_component_info{host="n2", instance="n2:9100", package="pyxis", component="pyxis"}'
        values: '1x40'
      - series: 'os_updates_component_info{host="n1", instance="n1:9100", component="pyxis", version="0.20"}'
        values: '1x40'
      - series: 'os_updates_component_info{host="n2", instance="n2:9100", component="pyxis", version="0.21"}'
        values: '1x40'
      # versionless components never differ
      - series: 'os_updates_component_info{host="n1", instance="n1:9100", component="cluster_tools", version=""}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 30h
        alertname: OsPackageVersionsDiffer
        exp_alerts:
          - exp_labels: {severity: warning, package: enroot, source: local}
            exp_annotations:
              summary: "enroot is installed at 2 different versions across the hosts"
              description: "n1: 4.2.0-1; n2: 4.2.1-1; No apt source offers it, so an upgrade cannot change it: enroot installs it, and `ansible-playbook -K playbooks/container/enroot.yml` brings its hosts level."
      - eval_time: 30h
        alertname: ComponentVersionsDiffer
        exp_alerts:
          - exp_labels: {severity: warning, component: pyxis}
            exp_annotations:
              summary: "pyxis is at 2 different versions across the hosts"
              description: "n1: 0.20; n2: 0.21; A run limited to some of its hosts left the others behind: `ansible-playbook -K playbooks/container/pyxis.yml` converges every host it belongs on (one already there changes nothing)."

  - name: a host behind the version the repository and config pin warns after a day
    interval: 1h
    input_series:
      # Both hosts agree (no ComponentVersionsDiffer), but the pin moved to 4.2.2-1.
      - series: 'os_updates_component_info{host="n1", instance="n1:9100", component="enroot", version="4.2.1-1"}'
        values: '1x40'
      - series: 'os_updates_component_info{host="n2", instance="n2:9100", component="enroot", version="4.2.1-1"}'
        values: '1x40'
      # the expected state, from the textfile on the Prometheus host m (for_host: whose)
      - series: 'deepops_component_expected_version_info{host="m", instance="m:9100", for_host="n1", component="enroot", version="4.2.2-1"}'
        values: '1x40'
      - series: 'deepops_component_expected_version_info{host="m", instance="m:9100", for_host="n2", component="enroot", version="4.2.1-1"}'
        values: '1x40'
      # n2 pins it at what it has; a component with no pin (unchecked) never alerts
      - series: 'os_updates_component_info{host="n1", instance="n1:9100", component="dcgm", version="datacenter-gpu-manager-4-cuda12"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 25h
        alertname: ComponentVersionNotPinned
        exp_alerts: []
      - eval_time: 30h
        alertname: ComponentVersionNotPinned
        exp_alerts:
          - exp_labels: {severity: warning, host: n1, component: enroot, version: 4.2.1-1}
            exp_annotations:
              summary: "n1 has enroot 4.2.1-1, not the version the repository and config pin"
              description: "Expected 4.2.2-1. `ansible-playbook -K playbooks/container/enroot.yml -l n1` installs it."

  - name: a fix that only limited runs since reached warns on the hosts it missed, after 3 days
    interval: 1h
    input_series:
      # 2026-11-26: a role fix landed; since then only n3 had a whole run of it. All three
      # report the same version, so only the source digest tells n1 and n2 apart.
      - series: 'os_updates_component_source_info{host="n1", instance="n1:9100", component="nvidia_power_limit", source="aaaa"}'
        values: '1x80'
      - series: 'os_updates_component_source_info{host="n2", instance="n2:9100", component="nvidia_power_limit", source="aaaa"}'
        values: '1x80'
      - series: 'os_updates_component_source_info{host="n3", instance="n3:9100", component="nvidia_power_limit", source="aaaa"}'
        values: '1x10 _x70'
      - series: 'os_updates_component_source_info{host="n3", instance="n3:9100", component="nvidia_power_limit", source="bbbb"}'
        values: '_x10 1x70'
      # an unrelated component, deployed from what the checkouts hold: quiet
      - series: 'os_updates_component_source_info{host="n1", instance="n1:9100", component="chrony", source="cccc"}'
        values: '1x80'
      # n4 has no digest yet (deployed before digests were recorded): not compared
      - series: 'os_updates_component_info{host="n4", instance="n4:9100", component="nvidia_power_limit", version="1"}'
        values: '1x80'
      - series: 'deepops_component_expected_source_info{host="m", instance="m:9100", for_host="n1", component="nvidia_power_limit", source="bbbb", playbook="playbooks/nvidia-software/nvidia-power-limit.yml"}'
        values: '1x80'
      - series: 'deepops_component_expected_source_info{host="m", instance="m:9100", for_host="n2", component="nvidia_power_limit", source="bbbb", playbook="playbooks/nvidia-software/nvidia-power-limit.yml"}'
        values: '1x80'
      - series: 'deepops_component_expected_source_info{host="m", instance="m:9100", for_host="n3", component="nvidia_power_limit", source="bbbb", playbook="playbooks/nvidia-software/nvidia-power-limit.yml"}'
        values: '1x80'
      - series: 'deepops_component_expected_source_info{host="m", instance="m:9100", for_host="n4", component="nvidia_power_limit", source="bbbb", playbook="playbooks/nvidia-software/nvidia-power-limit.yml"}'
        values: '1x80'
      - series: 'deepops_component_expected_source_info{host="m", instance="m:9100", for_host="n1", component="chrony", source="cccc"}'
        values: '1x80'
    alert_rule_test:
      - eval_time: 71h
        alertname: ComponentNotDeployed
        exp_alerts: []
      - eval_time: 78h
        alertname: ComponentNotDeployed
        exp_alerts:
          - exp_labels: {severity: warning, host: n1, component: nvidia_power_limit, source: aaaa}
            exp_annotations:
              summary: "n1 runs nvidia_power_limit as deployed from older code or config"
              description: "The checkouts now decide nvidia_power_limit differently on n1 than its last whole deploy there. `ansible-playbook -K playbooks/nvidia-software/nvidia-power-limit.yml -l n1` deploys it (scripts/deepops/component_expected.py changes --from REV says what moved)."
          - exp_labels: {severity: warning, host: n2, component: nvidia_power_limit, source: aaaa}
            exp_annotations:
              summary: "n2 runs nvidia_power_limit as deployed from older code or config"
              description: "The checkouts now decide nvidia_power_limit differently on n2 than its last whole deploy there. `ansible-playbook -K playbooks/nvidia-software/nvidia-power-limit.yml -l n2` deploys it (scripts/deepops/component_expected.py changes --from REV says what moved)."

  - name: a broken dpkg or apt warns after an hour
    interval: 1h
    input_series:
      - series: 'os_updates_dpkg_problems{host="n1", instance="n1:9100"}'
        values: '3x5'
      - series: 'os_updates_apt_ok{host="n2", instance="n2:9100"}'
        values: '0x5'
      - series: 'os_updates_security_pending_since_seconds{host="n2", instance="n2:9100"}'
        values: '0x5'
    alert_rule_test:
      - eval_time: 2h
        alertname: OsDpkgBroken
        exp_alerts:
          - exp_labels: {severity: warning, host: n1, instance: "n1:9100"}
            exp_annotations:
              summary: "dpkg on n1 has 3 half-installed packages and refuses every package change"
              description: "Security updates included. `dpkg --configure -a` on the host repairs it; the maintenance role's apt health step runs it."
      - eval_time: 2h
        alertname: OsAptBroken
        exp_alerts:
          - exp_labels: {severity: warning, host: n2, instance: "n2:9100"}
            exp_annotations:
              summary: "apt on n2 cannot plan an upgrade, so its pending-update counts mean nothing"
              description: "`apt-get -s dist-upgrade` on the host shows why (broken sources, held or conflicting packages)."

  - name: a TLS certificate warns 30 days before it lapses, and pages once it has
    interval: 1h
    input_series:
      # notAfter 40 days after the test starts
      - series: 'open_ondemand_tls_cert_not_after_seconds{host="ctl", instance="ctl:9100"}'
        values: '3456000x1100'
    alert_rule_test:
      - eval_time: 9d
        alertname: TlsCertificateExpiring
        exp_alerts: []
      - eval_time: 11d
        alertname: TlsCertificateExpiring
        exp_alerts:
          - exp_labels: {severity: warning, service: open_ondemand, host: ctl, instance: "ctl:9100"}
            exp_annotations:
              summary: "The open_ondemand TLS certificate on ctl expires in 29d 0h 0m 0s"
              description: "Renew it in the site config's vault and deploy the role that installs it before it lapses."
      - eval_time: 41d
        alertname: TlsCertificateExpired
        exp_alerts:
          - exp_labels: {severity: critical, service: open_ondemand, host: ctl, instance: "ctl:9100"}
            exp_annotations:
              summary: "The open_ondemand TLS certificate on ctl has expired"
              description: "Clients refuse the service. Renew it in the site config's vault and deploy the role that installs it."

  - name: a configured backup destination that never succeeds pages 36 hours after it was configured
    interval: 1h
    input_series:
      # /backup/a never ran; /backup/b succeeds every hour; /backup/c fails (SlurmBackupFailed).
      - series: 'slurm_backup_destination_configured_timestamp_seconds{host="m", instance="m:9100", destination="/backup/a"}'
        values: '0x50'
      - series: 'slurm_backup_destination_configured_timestamp_seconds{host="m", instance="m:9100", destination="/backup/b"}'
        values: '0x50'
      - series: 'slurm_backup_last_success_timestamp_seconds{host="m", instance="m:9100", destination="/backup/b"}'
        values: '0+3600x50'
      - series: 'slurm_backup_destination_configured_timestamp_seconds{host="m", instance="m:9100", destination="/backup/c"}'
        values: '0x50'
      - series: 'slurm_backup_last_status{host="m", instance="m:9100", destination="/backup/c"}'
        values: '0x50'
    alert_rule_test:
      - eval_time: 30h
        alertname: SlurmBackupStale
        exp_alerts: []
      - eval_time: 40h
        alertname: SlurmBackupStale
        exp_alerts:
          - exp_labels: {severity: critical, host: m, instance: "m:9100", destination: /backup/a}
            exp_annotations:
              summary: "No Slurm backup to /backup/a has succeeded for 36 hours"
              description: "The daily backup did not run or stopped before writing its result: `systemctl list-timers slurm-backup*` and `journalctl -u slurm-backup@backup` on m."

  - name: container storage cleanup that stopped warns after 3 days
    interval: 1h
    input_series:
      - series: 'container_storage_gc_last_success_timestamp_seconds{host="n1", instance="n1:9100"}'
        values: '0x80'
      - series: 'container_storage_gc_last_success_timestamp_seconds{host="n2", instance="n2:9100"}'
        values: '0+3600x80'
    alert_rule_test:
      - eval_time: 70h
        alertname: ContainerStorageCleanupStale
        exp_alerts: []
      - eval_time: 74h
        alertname: ContainerStorageCleanupStale
        exp_alerts:
          - exp_labels: {severity: warning, host: n1, instance: "n1:9100"}
            exp_annotations:
              summary: "Container image stores on n1 have not been cleaned up for 3 days"
              description: "The daily cleanup failed or did not run, so podman storage and the enroot cache can fill the local disk: `journalctl -u container-storage-gc` and `systemctl list-timers container-storage-gc.timer` on the host."

  - name: a scratch space cleanup that stopped warns after 3 days; one that never reported too
    interval: 1h
    input_series:
      - series: 'scratch_space_last_success_timestamp_seconds{host="s", instance="s:9100"}'
        values: '0x80'
      - series: 'node_systemd_unit_state{host="t", instance="t:9100", name="scratch-space-purge.service", state="inactive"}'
        values: '1x80'
      - series: 'scratch_space_purge_truncated{host="s", instance="s:9100"}'
        values: '1x80'
    alert_rule_test:
      - eval_time: 70h
        alertname: ScratchSpaceCleanupStale
        exp_alerts: []
      - eval_time: 74h
        alertname: ScratchSpaceCleanupStale
        exp_alerts:
          - exp_labels: {severity: warning, host: s, instance: "s:9100"}
            exp_annotations:
              summary: "The scratch space on s has not been cleaned up for 3 days"
              description: "The daily cleanup failed or did not run, so files unused past their date stay and people's purge lists go stale: `journalctl -u scratch-space-purge` and `systemctl list-timers scratch-space-purge.timer` on the host."
      - eval_time: 74h
        alertname: ScratchSpaceCleanupNeverReported
        exp_alerts:
          - exp_labels: {severity: warning, host: t, instance: "t:9100"}
            exp_annotations:
              summary: "The scratch space cleanup on t has reported no success for 3 days"
              description: "`journalctl -u scratch-space-purge` and `systemctl list-timers scratch-space-purge.timer` on the host."
      - eval_time: 47h
        alertname: ScratchSpaceCleanupTruncated
        exp_alerts: []
      - eval_time: 49h
        alertname: ScratchSpaceCleanupTruncated
        exp_alerts:
          - exp_labels: {severity: warning, host: s, instance: "s:9100"}
            exp_annotations:
              summary: "The scratch space cleanup on s stops at its entry bound"
              description: "Each run looked at scratch_space_purge_max_entries entries and stopped: raise it (roles/scratch_space) or find who holds the files (`quota -s`, disk report)."

  - name: the shared data's usage export and the bot's cleanup rounds warn when they stop
    interval: 1h
    input_series:
      - series: 'shared_data_last_success_timestamp_seconds{host="h", instance="h:9100"}'
        values: '0x10'
      - series: 'node_systemd_unit_state{host="g", instance="g:9100", name="shared-data-metrics.service", state="inactive"}'
        values: '1x10'
      - series: 'shared_data_bot_last_success_timestamp_seconds{host="h", instance="h:9100"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 2h
        alertname: SharedDataUsageStale
        exp_alerts: []
      - eval_time: 4h
        alertname: SharedDataUsageStale
        exp_alerts:
          - exp_labels: {severity: warning, host: h, instance: "h:9100"}
            exp_annotations:
              summary: "The shared data's usage on h has not been exported for 3 hours"
              description: "The disk report and the budget alert show old figures: `journalctl -u shared-data-metrics` and `systemctl list-timers shared-data-metrics.timer` on the host."
      - eval_time: 4h
        alertname: SharedDataUsageNeverReported
        exp_alerts:
          - exp_labels: {severity: warning, host: g, instance: "g:9100"}
            exp_annotations:
              summary: "The shared data's usage on g has never been exported"
              description: "`journalctl -u shared-data-metrics` and `systemctl list-timers shared-data-metrics.timer` on the host."
      - eval_time: 2h
        alertname: SharedDataCleanupStale
        exp_alerts: []
      - eval_time: 4h
        alertname: SharedDataCleanupStale
        exp_alerts:
          - exp_labels: {severity: warning, host: h, instance: "h:9100"}
            exp_annotations:
              summary: "The cluster bot has not checked the shared data on h for 3 hours"
              description: "Downloads are not told and unused entries get no notice nor removal: `systemctl status cluster-bot` and `journalctl -u cluster-bot` on the bot's host (its SSH to the home server's shared-data service)."

  - name: a periodic job installed on a host that never reports warns after its window
    interval: 1h
    input_series:
      - series: 'node_systemd_unit_state{host="n1", instance="n1:9100", name="container-storage-gc.service", state="inactive"}'
        values: '1x80'
      - series: 'node_systemd_unit_state{host="n2", instance="n2:9100", name="container-storage-gc.service", state="inactive"}'
        values: '1x80'
      - series: 'container_storage_gc_last_success_timestamp_seconds{host="n2", instance="n2:9100"}'
        values: '0+3600x80'
      - series: 'node_systemd_unit_state{host="n1", instance="n1:9100", name="os-updates-metrics.service", state="inactive"}'
        values: '1x80'
      - series: 'node_systemd_unit_state{host="n2", instance="n2:9100", name="os-updates-metrics.service", state="inactive"}'
        values: '1x80'
      - series: 'os_updates_metrics_timestamp_seconds{host="n2", instance="n2:9100"}'
        values: '0+3600x80'
    alert_rule_test:
      - eval_time: 70h
        alertname: ContainerStorageCleanupNeverReported
        exp_alerts: []
      - eval_time: 74h
        alertname: ContainerStorageCleanupNeverReported
        exp_alerts:
          - exp_labels: {severity: warning, host: n1, instance: "n1:9100"}
            exp_annotations:
              summary: "The container storage cleanup on n1 has reported no success for 3 days"
              description: "`journalctl -u container-storage-gc` and `systemctl list-timers container-storage-gc.timer` on the host."
      - eval_time: 70h
        alertname: OsUpdatesMetricsNeverReported
        exp_alerts: []
      - eval_time: 74h
        alertname: OsUpdatesMetricsNeverReported
        exp_alerts:
          - exp_labels: {severity: warning, host: n1, instance: "n1:9100"}
            exp_annotations:
              summary: "n1 has reported no update status for 3 days"
              description: "`systemctl status os-updates-metrics.timer` and `journalctl -u os-updates-metrics` on the host."

  - name: a user or a shared directory past its warn level for an hour is reported, one under it is not
    interval: 1h
    input_series:
      - series: 'disk_quota_used_bytes{host="login", instance="login:9100", filesystem="/", user="alice"}'
        values: '15x30'
      - series: 'disk_quota_limit_bytes{host="login", instance="login:9100", filesystem="/", user="alice", kind="warn"}'
        values: '10x30'
      - series: 'disk_quota_used_bytes{host="login", instance="login:9100", filesystem="/", user="bob"}'
        values: '5x30'
      - series: 'disk_quota_limit_bytes{host="login", instance="login:9100", filesystem="/", user="bob", kind="warn"}'
        values: '10x30'
      - series: 'disk_quota_project_used_bytes{host="nfs", instance="nfs:9100", filesystem="/home", project="/home/shared/datasets", project_id="101"}'
        values: '20x30'
      - series: 'disk_quota_project_limit_bytes{host="nfs", instance="nfs:9100", filesystem="/home", project="/home/shared/datasets", project_id="101", kind="warn"}'
        values: '15x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: DiskQuotaOverWarnLevel
        exp_alerts: []
      - eval_time: 2h
        alertname: DiskQuotaOverWarnLevel
        exp_alerts:
          - exp_labels: {severity: info, host: login, instance: "login:9100", filesystem: /, user: alice}
            exp_annotations:
              summary: "alice is past their disk warn level on login:/"
              description: "Nothing is refused yet: only the hard limit stops writes (a limit announced for a later day, disk_quota_limit_from_timestamp_seconds, from that day). `quota -s alice` on the host shows it; the person frees space, or gets a larger disk_quota in people.yml."
      - eval_time: 2h
        alertname: DiskQuotaProjectOverWarnLevel
        exp_alerts:
          - exp_labels: {severity: info, host: nfs, instance: "nfs:9100", filesystem: /home, project: /home/shared/datasets, project_id: "101"}
            exp_annotations:
              summary: "/home/shared/datasets on nfs is past its warn level"
              description: "Nothing is refused yet: only the hard limit stops writes. Free space there, or raise its block_hard in disk_quota_projects."
  - name: a GPU node not diagnosed for four weeks of running diagnostics is overdue
    interval: 1d
    input_series:
      - series: 'slurm_gpu_configured{host="m1",instance="m1:9100",node="g1",gpu_type="a10"}'
        values: '8x40'
      - series: 'slurm_gpu_configured{host="m1",instance="m1:9100",node="g2",gpu_type="a10"}'
        values: '8x40'
      - series: 'gpu_diag_idle_node_last_success_timestamp_seconds{host="m1",instance="m1:9100",node="g2"}'
        values: '3369600x40'
      - series: 'gpu_diag_idle_since_seconds{host="m1",instance="m1:9100"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 20d
        alertname: GpuDiagOverdue
      - eval_time: 40d
        alertname: GpuDiagOverdue
        exp_alerts:
          - exp_labels: {node: g1, severity: warning}
            exp_annotations:
              summary: "g1's GPUs have not been diagnosed for four weeks"
              description: >-
                No weekly pass found it idle. Run the diagnostics in a quiet hour
                (playbooks/utilities/gpu-diag.yml -e hostlist=g1 drains it first).
  - name: the weekly pass stopping is reported; before the first pass nothing is
    interval: 1d
    input_series:
      - series: 'gpu_diag_idle_last_success_timestamp_seconds{host="m1",instance="m1:9100"}'
        values: '1x12'
      - series: 'gpu_diag_idle_last_success_timestamp_seconds{host="m2",instance="m2:9100"}'
        values: '0x12'
    alert_rule_test:
      - eval_time: 5d
        alertname: GpuDiagNotRunning
      - eval_time: 10d
        alertname: GpuDiagNotRunning
        exp_alerts:
          - exp_labels: {host: m1, instance: "m1:9100", severity: warning}
            exp_annotations:
              summary: "The weekly DCGM diagnostics have not run for 8 days on m1"
              description: "`systemctl list-timers gpu-diag-idle*` and `journalctl -u gpu-diag-idle` on m1."

  - name: the bot's scopes unread for two days warn
    interval: 1h
    input_series:
      - series: 'cluster_bot_scopes_last_success_timestamp_seconds{host="ctl", instance="ctl:9100"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 47h
        alertname: ClusterBotScopesUnchecked
        exp_alerts: []
      - eval_time: 49h
        alertname: ClusterBotScopesUnchecked
        exp_alerts:
          - exp_labels: {severity: warning, host: ctl, instance: "ctl:9100"}
            exp_annotations:
              summary: "The cluster bot's Slack scopes on ctl have not been read"
              description: "A missing scope would go unseen: `journalctl -u cluster-bot-scopes` and `systemctl list-timers cluster-bot-scopes.timer` on the host (the token, or Slack unreachable)."
