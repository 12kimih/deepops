---
# promtool test rules: each case feeds synthetic series to the shipped alert rules.
rule_files:
  - ../../roles/prometheus/files/rules/*.yml
evaluation_interval: 1m

tests:
  - name: host down fires and hides that host's exporter alerts
    interval: 1m
    input_series:
      - series: 'up{module="node-exporter", host="n1", instance="n1:9100"}'
        values: '0x15'
      - series: 'up{module="dcgm-exporter", host="n1", instance="n1:9400"}'
        values: '0x15'
    alert_rule_test:
      - eval_time: 2m
        alertname: HostDown
        exp_alerts: []
      - eval_time: 4m
        alertname: HostDown
        exp_alerts:
          - exp_labels: {severity: critical, host: n1}
            exp_annotations:
              summary: "n1 is unreachable"
              description: "No exporter on n1 has answered for 3 minutes. The host is down, hung or off the network."
      - eval_time: 15m
        alertname: ExporterDown
        exp_alerts: []

  - name: exporter down on a live host
    interval: 1m
    input_series:
      - series: 'up{module="node-exporter", host="n1", instance="n1:9100"}'
        values: '1x15'
      - series: 'up{module="dcgm-exporter", host="n1", instance="n1:9400"}'
        values: '0x15'
    alert_rule_test:
      - eval_time: 11m
        alertname: ExporterDown
        exp_alerts:
          - exp_labels: {severity: warning, module: dcgm-exporter, host: n1, instance: "n1:9400"}
            exp_annotations:
              summary: "dcgm-exporter down on n1"
              description: "The dcgm-exporter target has failed to scrape for 10 minutes while other targets on n1 answer."

  - name: node-exporter alone down is an exporter problem, not a host outage
    interval: 1m
    input_series:
      - series: 'up{module="node-exporter", host="n1", instance="n1:9100"}'
        values: '0x15'
      - series: 'up{module="dcgm-exporter", host="n1", instance="n1:9400"}'
        values: '1x15'
    alert_rule_test:
      - eval_time: 11m
        alertname: HostDown
        exp_alerts: []
      - eval_time: 11m
        alertname: ExporterDown
        exp_alerts:
          - exp_labels: {severity: warning, module: node-exporter, host: n1, instance: "n1:9100"}
            exp_annotations:
              summary: "node-exporter down on n1"
              description: "The node-exporter target has failed to scrape for 10 minutes while other targets on n1 answer. A hung collector is the usual cause: check that systemd answers with `timeout 5 systemctl is-system-running`."

  - name: HostSystemdUnresponsive fires when the systemd collector fails
    interval: 1m
    input_series:
      - series: 'node_scrape_collector_success{host="n1", instance="n1:9100", collector="systemd"}'
        values: '1x3 0x12'
      - series: 'node_scrape_collector_success{host="n1", instance="n1:9100", collector="cpu"}'
        values: '1x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: HostSystemdUnresponsive
        exp_alerts: []
      - eval_time: 15m
        alertname: HostSystemdUnresponsive
        exp_alerts:
          - exp_labels: {severity: warning, host: n1, instance: "n1:9100", collector: systemd}
            exp_annotations:
              summary: "systemd on n1 is not answering"
              description: "node-exporter cannot read unit states from systemd (PID 1), so units cannot be started or stopped and failed-unit alerts are blind. Drain the node and reboot it."

  - name: chassis fault states are inverted (1 = no fault)
    interval: 1m
    input_series:
      - series: 'ipmi_chassis_cooling_fault_state{host="n1"}'
        values: '1x5 0x5'
      - series: 'ipmi_chassis_drive_fault_state{host="n1"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 4m
        alertname: ChassisFault
        exp_alerts: []
      - eval_time: 9m
        alertname: ChassisFault
        exp_alerts:
          - exp_labels: {severity: critical, host: n1}
            exp_annotations:
              summary: "Cooling or drive fault reported by the BMC of n1"
              description: "`ipmitool chassis status` and `ipmitool sel elist last 20` on n1 say which fault and since when."

  - name: BMC sensors of every type, PSU and chassis intrusion separately
    interval: 1m
    input_series:
      - series: 'ipmi_temperature_state{host="n1", name="CPU1 Temp"}'
        values: '2x10'
      - series: 'ipmi_sensor_state{host="n1", name="PS1 Status", type="Power Supply"}'
        values: '2x10'
      - series: 'ipmi_sensor_state{host="n1", name="Chassis Intru", type="Physical Security"}'
        values: '2x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: BmcSensorCritical
        exp_alerts:
          - exp_labels: {severity: critical, host: n1, name: "CPU1 Temp"}
            exp_annotations:
              summary: "BMC sensor CPU1 Temp on n1 is critical"
              description: "`ipmitool sdr elist` on n1 (or its BMC's web page) shows the reading and its limits: a fan, power supply or airflow problem."
      - eval_time: 3m
        alertname: PowerSupplyFault
        exp_alerts:
          - exp_labels: {severity: critical, host: n1, name: "PS1 Status", type: "Power Supply"}
            exp_annotations:
              summary: "Power supply PS1 Status on n1 reports a fault"
              description: "A failed or unplugged PSU leaves the server without redundancy."
      - eval_time: 6m
        alertname: ChassisIntrusion
        exp_alerts:
          - exp_labels: {severity: warning, host: n1, name: "Chassis Intru", type: "Physical Security"}
            exp_annotations:
              summary: "Chassis intrusion reported by the BMC of n1"
              description: "The cover was opened, or an old intrusion event was never cleared. Check the node, then clear the event in the BMC."

  - name: a GPU disappearing keeps alerting, also when a host's GPUs all vanish, not when its exporter is down
    interval: 1m
    input_series:
      - series: 'DCGM_FI_DEV_GPU_TEMP_CELSIUS{instance="n1:9400", host="n1", gpu="0"}'
        values: '40x300'
      - series: 'DCGM_FI_DEV_GPU_TEMP_CELSIUS{instance="n1:9400", host="n1", gpu="1"}'
        values: '40x30 _x270'
      - series: 'up{instance="n1:9400", host="n1"}'
        values: '1x300'
      - series: 'DCGM_FI_DEV_GPU_TEMP_CELSIUS{instance="n2:9400", host="n2", gpu="0"}'
        values: '40x30 _x270'
      - series: 'up{instance="n2:9400", host="n2"}'
        values: '1x300'
      - series: 'DCGM_FI_DEV_GPU_TEMP_CELSIUS{instance="n3:9400", host="n3", gpu="0"}'
        values: '40x30 _x270'
      - series: 'up{instance="n3:9400", host="n3"}'
        values: '1x30 0x270'
    alert_rule_test:
      - eval_time: 20m
        alertname: GpuMissing
        exp_alerts: []
      - eval_time: 5h
        alertname: GpuMissing
        exp_alerts:
          - exp_labels: {severity: critical, instance: "n1:9400", host: n1}
            exp_annotations:
              summary: "n1 reports 1 fewer GPUs than it did in the last 7 days"
              description: "`lspci -d 10de:` on n1 counts the GPUs the bus sees: all of them means the driver lost some (see `journalctl -k | grep -E 'NVRM|Xid'`), fewer means hardware. Drain the node, then power-cycle it through its BMC (playbooks/utilities/power.yml)."
          - exp_labels: {severity: critical, instance: "n2:9400", host: n2}
            exp_annotations:
              summary: "n2 reports 1 fewer GPUs than it did in the last 7 days"
              description: "`lspci -d 10de:` on n2 counts the GPUs the bus sees: all of them means the driver lost some (see `journalctl -k | grep -E 'NVRM|Xid'`), fewer means hardware. Drain the node, then power-cycle it through its BMC (playbooks/utilities/power.yml)."

  - name: disk alerts skip network filesystems
    interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{host="n1", mountpoint="/", fstype="ext4"}'
        values: '1x10'
      - series: 'node_filesystem_size_bytes{host="n1", mountpoint="/", fstype="ext4"}'
        values: '100x10'
      - series: 'node_filesystem_readonly{host="n1", mountpoint="/", fstype="ext4"}'
        values: '0x10'
      - series: 'node_filesystem_avail_bytes{host="n1", mountpoint="/home", fstype="nfs4"}'
        values: '1x10'
      - series: 'node_filesystem_size_bytes{host="n1", mountpoint="/home", fstype="nfs4"}'
        values: '100x10'
      - series: 'node_filesystem_readonly{host="n1", mountpoint="/home", fstype="nfs4"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: HostDiskFull
        exp_alerts:
          - exp_labels: {severity: critical, host: n1, mountpoint: "/", fstype: ext4}
            exp_annotations:
              summary: "/ on n1 is over 97% full"
              description: "1% free. Writes will start failing."

  - name: XIDs from user programs are ignored, hardware XIDs alert, a repeat too
    interval: 1m
    input_series:
      # The windowed count (5 minutes): an XID appears as a series labelled with it.
      - series: 'DCGM_EXP_XID_ERRORS_COUNT{host="n1", instance="n1:9400", gpu="1", xid="48"}'
        values: '_x15 1x5 0x15'
      - series: 'DCGM_EXP_XID_ERRORS_COUNT{host="n2", instance="n2:9400", gpu="2", xid="79"}'
        values: '0x15 2x4 0x15'
      - series: 'DCGM_EXP_XID_ERRORS_COUNT{host="n2", instance="n2:9400", gpu="2", xid="31"}'
        values: '0x15 5x4 0x15'
    alert_rule_test:
      - eval_time: 18m
        alertname: GpuXidError
        exp_alerts:
          - exp_labels: {severity: warning, host: n1, instance: "n1:9400", gpu: "1", xid: "48"}
            exp_annotations:
              summary: "XID 48 on n1 GPU 1"
              description: "What it needs is in the action column of NVIDIA's XID catalog (docs.nvidia.com/deploy/xid-errors); NHC drains the node itself on the XIDs that need a GPU reset or a reboot (nhc_gpu_drain_xids) and on an Xid 154 asking for one."
          - exp_labels: {severity: warning, host: n2, instance: "n2:9400", gpu: "2", xid: "79"}
            exp_annotations:
              summary: "XID 79 on n2 GPU 2"
              description: "What it needs is in the action column of NVIDIA's XID catalog (docs.nvidia.com/deploy/xid-errors); NHC drains the node itself on the XIDs that need a GPU reset or a reboot (nhc_gpu_drain_xids) and on an Xid 154 asking for one."
      - eval_time: 30m
        alertname: GpuXidError
        exp_alerts: []

  - name: GPU temperature uses the device slowdown limit, else a fixed one
    interval: 1m
    input_series:
      - series: 'DCGM_FI_DEV_GPU_TEMP_CELSIUS{host="n1", instance="n1:9400", gpu="0"}'
        values: '86x15'
      - series: 'DCGM_FI_DEV_GPU_TEMP_SLOWDOWN_CELSIUS{host="n1", instance="n1:9400", gpu="0"}'
        values: '95x15'
      - series: 'DCGM_FI_DEV_GPU_TEMP_CELSIUS{host="n1", instance="n1:9400", gpu="1"}'
        values: '91x15'
      - series: 'DCGM_FI_DEV_GPU_TEMP_SLOWDOWN_CELSIUS{host="n1", instance="n1:9400", gpu="1"}'
        values: '95x15'
      - series: 'DCGM_FI_DEV_GPU_TEMP_CELSIUS{host="n2", instance="n2:9400", gpu="0"}'
        values: '86x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: GpuTemperatureHigh
        exp_alerts:
          - exp_labels: {severity: warning, host: n1, instance: "n1:9400", gpu: "1"}
            exp_annotations:
              summary: "GPU 1 on n1 at 91C, near its slowdown temperature"
              description: "Near its slowdown temperature the GPU throttles. Check the node's fans and inlet air (`ipmitool sdr type Temperature` on n1, the BmcSensor alerts) and whether its neighbours run hot too (the room's cooling)."
          - exp_labels: {severity: warning, host: n2, instance: "n2:9400", gpu: "0"}
            exp_annotations:
              summary: "GPU 0 on n2 at 86C, near its slowdown temperature"
              description: "Near its slowdown temperature the GPU throttles. Check the node's fans and inlet air (`ipmitool sdr type Temperature` on n2, the BmcSensor alerts) and whether its neighbours run hot too (the room's cooling)."

  - name: hardware slowdown clock events alert, power capping does not
    interval: 1m
    input_series:
      - series: 'DCGM_EXP_CLOCK_EVENTS_COUNT{host="n1", instance="n1:9400", gpu="0", clock_event="power_cap"}'
        values: '4x20'
      - series: 'DCGM_EXP_CLOCK_EVENTS_COUNT{host="n1", instance="n1:9400", gpu="1", clock_event="hw_thermal"}'
        values: '2x20'
      - series: 'DCGM_EXP_CLOCK_EVENTS_COUNT{host="n1", instance="n1:9400", gpu="1", clock_event="gpu_idle"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 16m
        alertname: GpuHardwareSlowdown
        exp_alerts:
          - exp_labels: {severity: warning, host: n1, instance: "n1:9400", gpu: "1", clock_event: hw_thermal}
            exp_annotations:
              summary: "GPU 1 on n1 is held down by hw_thermal"
              description: "Thermal or power-brake slowdown; check cooling, fans and power supplies."

  - name: GpuFallenOffBus fires
    interval: 1m
    input_series:
      - series: 'DCGM_FI_DEV_XID_ERROR{host="n1",instance="n1:9400",gpu="2"}'
        values: '79x5'
    alert_rule_test:
      - eval_time: 1m
        alertname: GpuFallenOffBus
        exp_alerts:
          - exp_labels: {gpu: "2", host: "n1", instance: "n1:9400", severity: "critical"}
            exp_annotations:
              summary: "GPU 2 on n1 fell off the bus (XID 79)"
              description: "The GPU is gone until the node is power-cycled; NHC drains the node on XID 79. Once its jobs end, power-cycle it through its BMC (playbooks/utilities/power.yml); a GPU still missing after that is hardware (the GPU, its riser or PCIe switch)."

  - name: GpuRowRemapFailure fires
    interval: 1m
    input_series:
      - series: 'DCGM_FI_DEV_ROW_REMAP_FAILED{host="n1",instance="n1:9400",gpu="2"}'
        values: '1x5'
    alert_rule_test:
      - eval_time: 1m
        alertname: GpuRowRemapFailure
        exp_alerts:
          - exp_labels: {gpu: "2", host: "n1", instance: "n1:9400", severity: "critical"}
            exp_annotations:
              description: "The GPU has run out of spare rows; RMA it."
              summary: "Row remapping failed on n1 GPU 2"

  - name: GpuUncorrectableRemappedRows fires
    interval: 1m
    input_series:
      - series: 'DCGM_FI_DEV_ROW_REMAP_UNCORRECTABLE_TOTAL{host="n1",instance="n1:9400",gpu="2"} 0x5'
        values: '1x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: GpuUncorrectableRemappedRows
        exp_alerts:
          - exp_labels: {gpu: "2", host: "n1", instance: "n1:9400", severity: "warning"}
            exp_annotations:
              description: "Reset the GPU (drain the node first) so the remap takes effect."
              summary: "New uncorrectable remapped rows on n1 GPU 2"

  - name: GpuMemoryTemperatureHigh fires
    interval: 1m
    input_series:
      - series: 'DCGM_FI_DEV_MEMORY_TEMP_CELSIUS{host="n1",instance="n1:9400",gpu="2"}'
        values: '92x15'
      - series: 'DCGM_FI_DEV_MEMORY_MAX_OP_TEMP_CELSIUS{host="n1",instance="n1:9400",gpu="2"}'
        values: '95x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: GpuMemoryTemperatureHigh
        exp_alerts:
          - exp_labels: {gpu: "2", host: "n1", instance: "n1:9400", severity: "warning"}
            exp_annotations:
              summary: "GPU 2 memory on n1 at 92C, near its limit"
              description: "Memory near its limit throttles and raises ECC errors. Check the node's fans and inlet air (`ipmitool sdr type Temperature` on n1) as for a hot GPU."

  - name: GpuPcieReplaysHigh fires
    interval: 1m
    input_series:
      - series: 'DCGM_FI_DEV_PCIE_REPLAY_TOTAL{host="n1",instance="n1:9400",gpu="2"}'
        values: '0+100x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: GpuPcieReplaysHigh
        exp_alerts:
          - exp_labels: {gpu: "2", host: "n1", instance: "n1:9400", severity: "warning"}
            exp_annotations:
              description: "3000 in 1h; check the riser, slot or cabling."
              summary: "PCIe replays on n1 GPU 2"

  - name: HostDiskAlmostFull fires
    interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{host="n1",instance="n1:9100",mountpoint="/scratch",fstype="xfs",device="/dev/md0"}'
        values: '5x15'
      - series: 'node_filesystem_size_bytes{host="n1",instance="n1:9100",mountpoint="/scratch",fstype="xfs",device="/dev/md0"}'
        values: '100x15'
      - series: 'node_filesystem_readonly{host="n1",instance="n1:9100",mountpoint="/scratch",fstype="xfs",device="/dev/md0"}'
        values: '0x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: HostDiskAlmostFull
        exp_alerts:
          - exp_labels: {device: "/dev/md0", fstype: "xfs", host: "n1", instance: "n1:9100", mountpoint: "/scratch", severity: "warning"}
            exp_annotations:
              description: "5% free."
              summary: "/scratch on n1 is over 90% full"

  - name: HostDiskFillingUp fires
    interval: 5m
    input_series:
      - series: 'node_filesystem_avail_bytes{host="n1",instance="n1:9100",mountpoint="/",fstype="ext4",device="/dev/sda1"}'
        values: '20-0.1x100'
      - series: 'node_filesystem_size_bytes{host="n1",instance="n1:9100",mountpoint="/",fstype="ext4",device="/dev/sda1"}'
        values: '100x100'
      - series: 'node_filesystem_readonly{host="n1",instance="n1:9100",mountpoint="/",fstype="ext4",device="/dev/sda1"}'
        values: '0x100'
    alert_rule_test:
      - eval_time: 7h
        alertname: HostDiskFillingUp
        exp_alerts:
          - exp_labels: {device: "/dev/sda1", fstype: "ext4", host: "n1", instance: "n1:9100", mountpoint: "/", severity: "warning"}
            exp_annotations:
              summary: "/ on n1 will fill within 24h"
              description: "`du -xh --max-depth=2 / 2>/dev/null | sort -h | tail` on n1 finds what grows."

  # A one-time allocation (a job scratch image) is a step, not a trend: flat an hour after.
  - name: HostDiskFillingUp stays quiet after one large allocation
    interval: 5m
    input_series:
      - series: 'node_filesystem_avail_bytes{host="n1",instance="n1:9100",mountpoint="/",fstype="ext4",device="/dev/sda1"}'
        values: '80x12 20x60'
      - series: 'node_filesystem_size_bytes{host="n1",instance="n1:9100",mountpoint="/",fstype="ext4",device="/dev/sda1"}'
        values: '100x72'
      - series: 'node_filesystem_readonly{host="n1",instance="n1:9100",mountpoint="/",fstype="ext4",device="/dev/sda1"}'
        values: '0x72'
    alert_rule_test:
      - eval_time: 1h30m
        alertname: HostDiskFillingUp
        exp_alerts: []
      - eval_time: 4h
        alertname: HostDiskFillingUp
        exp_alerts: []

  - name: HostInodesAlmostExhausted fires
    interval: 1m
    input_series:
      - series: 'node_filesystem_files_free{host="n1",instance="n1:9100",mountpoint="/",fstype="ext4",device="/dev/sda1"}'
        values: '2x15'
      - series: 'node_filesystem_files{host="n1",instance="n1:9100",mountpoint="/",fstype="ext4",device="/dev/sda1"}'
        values: '100x15'
      - series: 'node_filesystem_readonly{host="n1",instance="n1:9100",mountpoint="/",fstype="ext4",device="/dev/sda1"}'
        values: '0x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: HostInodesAlmostExhausted
        exp_alerts:
          - exp_labels: {device: "/dev/sda1", fstype: "ext4", host: "n1", instance: "n1:9100", mountpoint: "/", severity: "warning"}
            exp_annotations:
              summary: "/ on n1 has under 5% inodes left"
              description: "Many small files: `du --inodes -x --max-depth=2 / 2>/dev/null | sort -n | tail` on n1 finds where."

  - name: HostMemoryExhausted fires
    interval: 1m
    input_series:
      - series: 'node_memory_MemAvailable_bytes{host="n1",instance="n1:9100"}'
        values: '2x20'
      - series: 'node_memory_MemTotal_bytes{host="n1",instance="n1:9100"}'
        values: '100x20'
    alert_rule_test:
      - eval_time: 16m
        alertname: HostMemoryExhausted
        exp_alerts:
          - exp_labels: {host: "n1", instance: "n1:9100", severity: "warning"}
            exp_annotations:
              summary: "n1 has under 3% memory available"
              description: "The kernel's OOM killer is next. `ps -eo pid,user,rss,comm --sort=-rss | head` on n1 shows who holds the memory; work on a login node belongs in a Slurm job."

  - name: HostClockNotSynchronised fires
    interval: 1m
    input_series:
      - series: 'node_timex_sync_status{host="n1",instance="n1:9100"}'
        values: '0x20'
      - series: 'node_timex_maxerror_seconds{host="n1",instance="n1:9100"}'
        values: '16x20'
    alert_rule_test:
      - eval_time: 16m
        alertname: HostClockNotSynchronised
        exp_alerts:
          - exp_labels: {host: "n1", instance: "n1:9100", severity: "warning"}
            exp_annotations:
              description: "Munge and Slurm reject credentials when clocks drift apart."
              summary: "Clock on n1 is not synchronised"

  - name: HostSystemdUnitFailed fires
    interval: 1m
    input_series:
      - series: 'node_systemd_unit_state{host="n1",instance="n1:9100",name="nfs-server.service",state="failed",type="simple"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: HostSystemdUnitFailed
        exp_alerts:
          - exp_labels: {host: "n1", instance: "n1:9100", name: "nfs-server.service", severity: "warning", state: "failed", type: "simple"}
            exp_annotations:
              summary: "nfs-server.service failed on n1"
              description: "`systemctl status nfs-server.service` and `journalctl -b -u nfs-server.service` on n1 say why; once fixed, `systemctl reset-failed nfs-server.service` clears the alert. A user@<uid>.service is that person's own systemd manager."

  - name: HostMemoryUncorrectableErrors fires
    interval: 1m
    input_series:
      - series: 'node_edac_uncorrectable_errors_total{host="n1",instance="n1:9100",controller="0"} 0x5'
        values: '1x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: HostMemoryUncorrectableErrors
        exp_alerts:
          - exp_labels: {controller: "0", host: "n1", instance: "n1:9100", severity: "critical"}
            exp_annotations:
              description: "Drain the node and replace the DIMM on controller 0."
              summary: "Uncorrectable ECC memory error on n1"

  - name: HostMemoryCorrectableErrorsHigh fires
    interval: 10m
    input_series:
      - series: 'node_edac_correctable_errors_total{host="n1",instance="n1:9100",controller="1"}'
        values: '0+20x30'
    alert_rule_test:
      - eval_time: 3h
        alertname: HostMemoryCorrectableErrorsHigh
        exp_alerts:
          - exp_labels: {controller: "1", host: "n1", instance: "n1:9100", severity: "warning"}
            exp_annotations:
              description: "360 in 24h on controller 1; the DIMM is likely failing."
              summary: "Many correctable ECC memory errors on n1"

  - name: HostRaidDegraded fires
    interval: 1m
    input_series:
      - series: 'node_md_disks_required{host="n1",instance="n1:9100",device="md0"}'
        values: '6x10'
      - series: 'node_md_disks{host="n1",instance="n1:9100",device="md0",state="active"}'
        values: '5x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: HostRaidDegraded
        exp_alerts:
          - exp_labels: {device: "md0", host: "n1", instance: "n1:9100", severity: "critical"}
            exp_annotations:
              summary: "RAID md0 on n1 is degraded"
              description: "`cat /proc/mdstat` and `mdadm --detail /dev/md0` on n1 show the missing member: replace that disk and add it back before a second one fails."

  - name: HostRaidDiskFailed fires
    interval: 1m
    input_series:
      - series: 'node_md_disks{host="n1",instance="n1:9100",device="md0",state="failed"}'
        values: '1x5'
    alert_rule_test:
      - eval_time: 1m
        alertname: HostRaidDiskFailed
        exp_alerts:
          - exp_labels: {device: "md0", host: "n1", instance: "n1:9100", severity: "critical", state: "failed"}
            exp_annotations:
              summary: "A disk in RAID md0 on n1 has failed"
              description: "`mdadm --detail /dev/md0` on n1 names the failed disk: check it with `smartctl -a`, replace it and add the new one (`mdadm --add`)."

  - name: HostNetworkErrors fires
    interval: 1m
    input_series:
      - series: 'node_network_receive_errs_total{host="n1",instance="n1:9100",device="ens3f0np0"}'
        values: '0+120x30'
      - series: 'node_network_transmit_errs_total{host="n1",instance="n1:9100",device="ens3f0np0"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: HostNetworkErrors
        exp_alerts:
          - exp_labels: {device: "ens3f0np0", host: "n1", instance: "n1:9100", severity: "warning"}
            exp_annotations:
              summary: "Network errors on ens3f0np0 of n1"
              description: "`ip -s link show ens3f0np0` and `ethtool -S ens3f0np0` on n1 show which counters grow; a cable, transceiver or switch port is the usual cause."

  - name: PrometheusRuleEvaluationFailing fires
    interval: 1m
    input_series:
      - series: 'prometheus_rule_evaluation_failures_total{host="m",instance="localhost:9090",job="prometheus",rule_group="/etc/prometheus/rules/gpu.yml;gpu"} 0 1 2 3 4 5'
        values: '6'
    alert_rule_test:
      - eval_time: 5m
        alertname: PrometheusRuleEvaluationFailing
        exp_alerts:
          - exp_labels: {host: "m", instance: "localhost:9090", job: "prometheus", rule_group: "/etc/prometheus/rules/gpu.yml;gpu", severity: "warning"}
            exp_annotations:
              summary: "Prometheus rule group /etc/prometheus/rules/gpu.yml;gpu fails to evaluate"
              description: "The alerts of that group are blind meanwhile: `journalctl -u docker.prometheus.service` on the monitoring host names the rule and its error."

  - name: PrometheusNotificationsFailing fires
    interval: 1m
    input_series:
      - series: 'prometheus_notifications_errors_total{host="m",instance="localhost:9090",job="prometheus",alertmanager="http://localhost:9093/api/v2/alerts"}'
        values: '0+1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: PrometheusNotificationsFailing
        exp_alerts:
          - exp_labels: {alertmanager: "http://localhost:9093/api/v2/alerts", host: "m", instance: "localhost:9090", job: "prometheus", severity: "critical"}
            exp_annotations:
              summary: "Prometheus cannot deliver alerts to Alertmanager"
              description: "No alert reaches anyone: check Alertmanager on the monitoring host (`systemctl status docker.alertmanager.service`) and Prometheus' log (`journalctl -u docker.prometheus.service`)."

  - name: AlertmanagerNotificationsFailing fires
    interval: 1m
    input_series:
      - series: 'alertmanager_notifications_failed_total{host="m",instance="localhost:9093",job="alertmanager",integration="slack",reason="other"}'
        values: '0+1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: AlertmanagerNotificationsFailing
        exp_alerts:
          - exp_labels: {host: "m", instance: "localhost:9093", integration: "slack", job: "alertmanager", reason: "other", severity: "critical"}
            exp_annotations:
              summary: "Alertmanager fails to send to slack"
              description: "Alerts reach Alertmanager but not slack: `journalctl -u docker.alertmanager.service` on the monitoring host says why (an expired webhook or token, the bot not in the channel)."

  - name: PrometheusTsdbCompactionsFailing fires
    interval: 1m
    input_series:
      - series: 'prometheus_tsdb_compactions_failed_total{host="m",instance="localhost:9090",job="prometheus"} 0x5'
        values: '1x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: PrometheusTsdbCompactionsFailing
        exp_alerts:
          - exp_labels: {host: "m", instance: "localhost:9090", job: "prometheus", severity: "warning"}
            exp_annotations:
              summary: "Prometheus TSDB compactions are failing"
              description: "The metrics database stops shrinking and may fill its disk: `journalctl -u docker.prometheus.service` on the monitoring host; a full disk or a corrupt block is the usual cause."

  - name: BmcSensorWarning fires
    interval: 1m
    input_series:
      - series: 'ipmi_fan_speed_state{host="n1",instance="n1:9290",id="1009",name="FAN2"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 16m
        alertname: BmcSensorWarning
        exp_alerts:
          - exp_labels: {host: "n1", id: "1009", instance: "n1:9290", name: "FAN2", severity: "warning"}
            exp_annotations:
              summary: "BMC sensor FAN2 on n1 is in warning"
              description: "`ipmitool sdr elist` on n1 (or its BMC's web page) shows the reading and its limits."

  - name: BmcUnreadable fires
    interval: 1m
    input_series:
      - series: 'ipmi_up{host="n1",instance="n1:9290",collector="ipmi"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 16m
        alertname: BmcUnreadable
        exp_alerts:
          - exp_labels: {collector: "ipmi", host: "n1", instance: "n1:9290", severity: "warning"}
            exp_annotations:
              summary: "ipmi-exporter cannot read the ipmi data of n1"
              description: "The BMC alerts are blind for this host: `ipmitool mc info` on n1 tests the BMC (the ipmi_devintf module must be loaded); `ipmitool mc reset cold` restarts a hung one."

  - name: watchdog always fires
    interval: 1m
    alert_rule_test:
      - eval_time: 1m
        alertname: Watchdog
        exp_alerts:
          - exp_labels: {severity: none}
            exp_annotations:
              summary: "Heartbeat of the alerting pipeline; not a problem"

  # NVML order and device minor numbers swapped: NVML GPU 0 is /dev/nvidia1, the one
  # Slurm's IDX 1 holds. The busy GPU no job holds is NVML 1, Slurm's nvidia0.
  - name: a busy GPU no Slurm job holds fires; a held one does not
    interval: 1m
    input_series:
      - series: 'DCGM_FI_DEV_GPU_UTIL_RATIO{host="n1", instance="n1:9400", gpu="0", device="nvidia0"}'
        values: '1x30'
      - series: 'DCGM_FI_DEV_GPU_UTIL_RATIO{host="n1", instance="n1:9400", gpu="1", device="nvidia1"}'
        values: '1x30'
      - series: 'DCGM_FI_DEV_GPU_MINOR_NUMBER{host="n1", instance="n1:9400", gpu="0", device="nvidia0"}'
        values: '1x30'
      - series: 'DCGM_FI_DEV_GPU_MINOR_NUMBER{host="n1", instance="n1:9400", gpu="1", device="nvidia1"}'
        values: '0x30'
      - series: 'slurm_gpu_allocated{host="m", instance="m:9100", node="n1", gpu="1", gpu_type="t", user="u", account="a", partition="p", job_id="7"}'
        values: '1x30'
      # Any file name: the rules read the timestamp the writer puts in the file.
      - series: 'slurm_metrics_updated_timestamp_seconds{host="m", instance="m:9100"}'
        values: '0+60x30'
    alert_rule_test:
      - eval_time: 10m
        alertname: GpuBusyWithoutJob
        exp_alerts: []
      - eval_time: 20m
        alertname: GpuBusyWithoutJob
        exp_alerts:
          - exp_labels: {severity: warning, host: n1, gpu: "1", device: nvidia0}
            exp_annotations:
              summary: "GPU nvidia0 on n1 is 100% busy with no Slurm job holding it"
              description: >-
                A process outside Slurm, or one left behind by a finished job. As root on
                the host, `fuser -v /dev/nvidia*` finds it; a GPU reset or reboot clears a
                hung one.
      - eval_time: 20m
        alertname: SlurmGpuMetricsStale
        exp_alerts: []

  # NVML GPU 0 is /dev/nvidia1, the one Slurm's IDX 1 holds for job 7: the job's usage
  # is NVML 0's, never NVML 1's (no job holds it).
  - name: a job's GPU usage is the GPU its allocation names
    interval: 1m
    input_series:
      - series: 'DCGM_FI_DEV_GPU_UTIL_RATIO{host="n1", instance="n1:9400", gpu="0", device="nvidia0"}'
        values: '0.25x10'
      - series: 'DCGM_FI_DEV_GPU_UTIL_RATIO{host="n1", instance="n1:9400", gpu="1", device="nvidia1"}'
        values: '1x10'
      - series: 'DCGM_FI_DEV_FB_USED_BYTES{host="n1", instance="n1:9400", gpu="0", device="nvidia0"}'
        values: '1024x10'
      - series: 'DCGM_FI_DEV_FB_USED_BYTES{host="n1", instance="n1:9400", gpu="1", device="nvidia1"}'
        values: '4096x10'
      - series: 'DCGM_FI_DEV_GPU_MINOR_NUMBER{host="n1", instance="n1:9400", gpu="0", device="nvidia0"}'
        values: '1x10'
      - series: 'DCGM_FI_DEV_GPU_MINOR_NUMBER{host="n1", instance="n1:9400", gpu="1", device="nvidia1"}'
        values: '0x10'
      - series: 'slurm_gpu_allocated{host="m", instance="m:9100", node="n1", gpu="1", gpu_type="t", user="u", account="a", partition="p", job_id="7"}'
        values: '1x10'
    promql_expr_test:
      - expr: job_device:dcgm_gpu_util_ratio:max
        eval_time: 5m
        exp_samples:
          - labels: 'job_device:dcgm_gpu_util_ratio:max{host="n1", device="nvidia1", node="n1", gpu="1", gpu_type="t", user="u", account="a", partition="p", job_id="7"}'
            value: 0.25
      - expr: job_device:dcgm_fb_used_bytes:max
        eval_time: 5m
        exp_samples:
          - labels: 'job_device:dcgm_fb_used_bytes:max{host="n1", device="nvidia1", node="n1", gpu="1", gpu_type="t", user="u", account="a", partition="p", job_id="7"}'
            value: 1024

  # NVML order swapped as above. Both unheld GPUs are fully busy; NVML 1 (Slurm's nvidia0)
  # holds no memory (hung), NVML 0 (nvidia1) is held by job 7, and a third (NVML 2,
  # nvidia2) has memory in use (a process outside Slurm, not a hang).
  - name: a busy GPU no job holds with no memory in use is hung; one with memory is not
    interval: 1m
    input_series:
      - series: 'DCGM_FI_DEV_GPU_UTIL_RATIO{host="n1", instance="n1:9400", gpu="0", device="nvidia0"}'
        values: '1x30'
      - series: 'DCGM_FI_DEV_GPU_UTIL_RATIO{host="n1", instance="n1:9400", gpu="1", device="nvidia1"}'
        values: '1x30'
      - series: 'DCGM_FI_DEV_GPU_UTIL_RATIO{host="n1", instance="n1:9400", gpu="2", device="nvidia2"}'
        values: '1x30'
      - series: 'DCGM_FI_DEV_FB_USED_BYTES{host="n1", instance="n1:9400", gpu="0", device="nvidia0"}'
        values: '0x30'
      - series: 'DCGM_FI_DEV_FB_USED_BYTES{host="n1", instance="n1:9400", gpu="1", device="nvidia1"}'
        values: '500x30'
      - series: 'DCGM_FI_DEV_FB_USED_BYTES{host="n1", instance="n1:9400", gpu="2", device="nvidia2"}'
        values: '40000x30'
      - series: 'DCGM_FI_DEV_FB_CAPACITY_BYTES{host="n1", instance="n1:9400", gpu="0", device="nvidia0"}'
        values: '48000x30'
      - series: 'DCGM_FI_DEV_FB_CAPACITY_BYTES{host="n1", instance="n1:9400", gpu="1", device="nvidia1"}'
        values: '48000x30'
      - series: 'DCGM_FI_DEV_FB_CAPACITY_BYTES{host="n1", instance="n1:9400", gpu="2", device="nvidia2"}'
        values: '48000x30'
      - series: 'DCGM_FI_DEV_GPU_MINOR_NUMBER{host="n1", instance="n1:9400", gpu="0", device="nvidia0"}'
        values: '1x30'
      - series: 'DCGM_FI_DEV_GPU_MINOR_NUMBER{host="n1", instance="n1:9400", gpu="1", device="nvidia1"}'
        values: '0x30'
      - series: 'DCGM_FI_DEV_GPU_MINOR_NUMBER{host="n1", instance="n1:9400", gpu="2", device="nvidia2"}'
        values: '2x30'
      - series: 'slurm_gpu_allocated{host="m", instance="m:9100", node="n1", gpu="1", gpu_type="t", user="u", account="a", partition="p", job_id="7"}'
        values: '1x30'
      - series: 'slurm_metrics_updated_timestamp_seconds{host="m", instance="m:9100"}'
        values: '0+60x30'
    alert_rule_test:
      - eval_time: 5m
        alertname: GpuStuck
        exp_alerts: []
      - eval_time: 15m
        alertname: GpuStuck
        exp_alerts:
          - exp_labels: {severity: critical, host: n1, gpu: "1", device: nvidia0}
            exp_annotations:
              summary: "GPU nvidia0 on n1 is busy with no job and no memory in use: hung"
              description: >-
                Drain the node (`scontrol update nodename=n1 state=drain
                reason="gpu hung"`), then reset the GPU or reboot once its jobs end, and run
                playbooks/utilities/gpu-diag.yml before resuming it.

  # A job's SM activity and power are those of the GPU its allocation names (NVML 0 is
  # Slurm's nvidia1, held by job 7).
  - name: a job's SM activity and power are the GPU its allocation names
    interval: 1m
    input_series:
      - series: 'DCGM_FI_PROF_SM_UTIL_RATIO{host="n1", instance="n1:9400", gpu="0", device="nvidia0"}'
        values: '0.4x10'
      - series: 'DCGM_FI_PROF_SM_UTIL_RATIO{host="n1", instance="n1:9400", gpu="1", device="nvidia1"}'
        values: '0.9x10'
      - series: 'DCGM_FI_DEV_BOARD_POWER_WATTS{host="n1", instance="n1:9400", gpu="0", device="nvidia0"}'
        values: '250x10'
      - series: 'DCGM_FI_DEV_BOARD_POWER_WATTS{host="n1", instance="n1:9400", gpu="1", device="nvidia1"}'
        values: '60x10'
      - series: 'DCGM_FI_DEV_GPU_MINOR_NUMBER{host="n1", instance="n1:9400", gpu="0", device="nvidia0"}'
        values: '1x10'
      - series: 'DCGM_FI_DEV_GPU_MINOR_NUMBER{host="n1", instance="n1:9400", gpu="1", device="nvidia1"}'
        values: '0x10'
      - series: 'slurm_gpu_allocated{host="m", instance="m:9100", node="n1", gpu="1", gpu_type="t", user="u", account="a", partition="p", job_id="7"}'
        values: '1x10'
    promql_expr_test:
      - expr: job_device:dcgm_sm_util_ratio:max
        eval_time: 5m
        exp_samples:
          - labels: 'job_device:dcgm_sm_util_ratio:max{host="n1", device="nvidia1", node="n1", gpu="1", gpu_type="t", user="u", account="a", partition="p", job_id="7"}'
            value: 0.4
      - expr: job_device:dcgm_power_watts:max
        eval_time: 5m
        exp_samples:
          - labels: 'job_device:dcgm_power_watts:max{host="n1", device="nvidia1", node="n1", gpu="1", gpu_type="t", user="u", account="a", partition="p", job_id="7"}'
            value: 250

  # Only an exported filesystem warns at 80%; the root filesystem at the same fill does not.
  - name: an exported filesystem over 80% full warns once, an unexported one not at all
    interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{host="m", instance="m:9100", mountpoint="/home", fstype="ext4", device="/dev/sdb1"}'
        values: '15x40'
      - series: 'node_filesystem_size_bytes{host="m", instance="m:9100", mountpoint="/home", fstype="ext4", device="/dev/sdb1"}'
        values: '100x40'
      - series: 'node_filesystem_readonly{host="m", instance="m:9100", mountpoint="/home", fstype="ext4", device="/dev/sdb1"}'
        values: '0x40'
      - series: 'node_filesystem_avail_bytes{host="m", instance="m:9100", mountpoint="/", fstype="ext4", device="/dev/sda4"}'
        values: '15x40'
      - series: 'node_filesystem_size_bytes{host="m", instance="m:9100", mountpoint="/", fstype="ext4", device="/dev/sda4"}'
        values: '100x40'
      - series: 'node_filesystem_readonly{host="m", instance="m:9100", mountpoint="/", fstype="ext4", device="/dev/sda4"}'
        values: '0x40'
      - series: 'nfs_export_info{host="m", instance="m:9100", path="/home", mountpoint="/home"}'
        values: '1x40'
      - series: 'nfs_export_info{host="m", instance="m:9100", path="/home/data", mountpoint="/home"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 20m
        alertname: NfsExportFilling
        exp_alerts: []
      - eval_time: 35m
        alertname: NfsExportFilling
        exp_alerts:
          - exp_labels: {severity: warning, host: m, instance: "m:9100", mountpoint: /home, fstype: ext4, device: /dev/sdb1}
            exp_annotations:
              summary: "/home on m, exported over NFS, is over 80% full"
              description: "15% free. Ask the largest users to clean up before it slows every job."

  - name: a leaver's files past their due time warn, one alert per directory
    interval: 1m
    input_series:
      - series: 'people_purge_due_timestamp_seconds{host="m", instance="m:9100", login="olda", path="/home/olda", ends="2026-01-01"}'
        values: '600x120'
      - series: 'people_purge_due_timestamp_seconds{host="m", instance="m:9100", login="newb", path="/home/newb", ends="2027-01-01"}'
        values: '99999999x120'
    alert_rule_test:
      - eval_time: 30m
        alertname: PeopleFilesDue
        exp_alerts: []
      - eval_time: 80m
        alertname: PeopleFilesDue
        exp_alerts:
          - exp_labels: {severity: warning, host: m, instance: "m:9100", login: olda, path: /home/olda, ends: "2026-01-01"}
            exp_annotations:
              summary: "/home/olda on m is due for removal"
              description: >-
                olda's membership ended on 2026-01-01. Preview with
                playbooks/utilities/people-purge.yml --check, then run it with
                -e people_purge_confirm=<the logins due>.

  - name: an NFS share the retry cannot mount warns after 15 minutes
    interval: 1m
    input_series:
      - series: 'nfs_client_mount_missing{host="n1", instance="n1:9100", mountpoint="/home"}'
        values: '1x30'
      - series: 'nfs_client_mount_missing{host="n2", instance="n2:9100", mountpoint="/home"}'
        values: '1x5 0x25'
    alert_rule_test:
      - eval_time: 10m
        alertname: NfsMountMissing
        exp_alerts: []
      - eval_time: 20m
        alertname: NfsMountMissing
        exp_alerts:
          - exp_labels: {severity: warning, host: n1, instance: "n1:9100", mountpoint: /home}
            exp_annotations:
              summary: "/home is not mounted on n1"
              description: "Retried every minute for 15 minutes. Check its NFS server; journalctl -u nfs-client-retry on the node shows each attempt."

  - name: stale allocation data warns and silences the busy-GPU alert
    interval: 1m
    input_series:
      - series: 'DCGM_FI_DEV_GPU_UTIL_RATIO{host="n1", instance="n1:9400", gpu="0", device="nvidia0"}'
        values: '1x30'
      - series: 'DCGM_FI_DEV_GPU_MINOR_NUMBER{host="n1", instance="n1:9400", gpu="0", device="nvidia0"}'
        values: '0x30'
      - series: 'slurm_metrics_updated_timestamp_seconds{host="m", instance="m:9100"}'
        values: '0x30'
      - series: 'node_textfile_scrape_error{host="m", instance="m:9100"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: GpuBusyWithoutJob
        exp_alerts: []
      - eval_time: 25m
        alertname: SlurmGpuMetricsStale
        exp_alerts:
          - exp_labels: {severity: warning, host: m, instance: m:9100}
            exp_annotations:
              summary: "Slurm GPU allocation data on m is stale or unreadable"
              description: >-
                `systemctl status slurm-gpu-metrics` and `journalctl -u slurm-gpu-metrics`
                on the host say why; GpuBusyWithoutJob is off meanwhile.

  - name: a GPU node whose DCGM lacks the minor number warns; one with it does not
    interval: 1m
    input_series:
      - series: 'DCGM_FI_DEV_GPU_UTIL_RATIO{host="n1", instance="n1:9400", gpu="0"}'
        values: '0x40'
      - series: 'DCGM_FI_DEV_GPU_UTIL_RATIO{host="n2", instance="n2:9400", gpu="0"}'
        values: '0x40'
      - series: 'DCGM_FI_DEV_GPU_MINOR_NUMBER{host="n2", instance="n2:9400", gpu="0"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 35m
        alertname: DcgmFieldsMissing
        exp_alerts:
          - exp_labels: {severity: warning, host: n1}
            exp_annotations:
              summary: "DCGM on n1 does not export the fields the Slurm GPU join needs"
              description: "Its metrics file lacks DCGM_FI_DEV_GPU_MINOR_NUMBER. `ansible-playbook -K -l n1 playbooks/slurm-cluster/nvidia-dcgm-exporter.yml` installs the current one."

  - name: a textfile error elsewhere does not call the Slurm allocation data stale
    interval: 1m
    input_series:
      - series: 'slurm_metrics_updated_timestamp_seconds{host="ctl", instance="ctl:9100"}'
        values: '0+60x15'
      - series: 'node_textfile_scrape_error{host="ctl", instance="ctl:9100"}'
        values: '0x15'
      - series: 'node_textfile_scrape_error{host="n1", instance="n1:9100"}'
        values: '1x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: SlurmGpuMetricsStale
        exp_alerts: []

  - name: the egress policy gone missing, and its metrics stale
    interval: 1m
    input_series:
      - series: 'egress_policy_loaded{host="n1", instance="n1:9100"}'
        values: '1 1 0x10'
      - series: 'egress_policy_metrics_timestamp_seconds{host="n1", instance="n1:9100"}'
        values: '0x20'
      - series: 'egress_policy_loaded{host="n2", instance="n2:9100"}'
        values: '1x20'
      - series: 'egress_policy_metrics_timestamp_seconds{host="n2", instance="n2:9100"}'
        values: '0+60x20'
    alert_rule_test:
      - eval_time: 6m
        alertname: EgressPolicyNotLoaded
        exp_alerts: []
      - eval_time: 8m
        alertname: EgressPolicyNotLoaded
        exp_alerts:
          - exp_labels: {severity: warning, host: n1, instance: "n1:9100"}
            exp_annotations:
              summary: "The egress policy is not loaded on n1, so users' connections are not limited"
              description: "Something removed the nftables table (a `flush ruleset`, a stopped unit). `systemctl restart egress-policy` on the host loads it again; `journalctl -u egress-policy` shows why it is missing."
      - eval_time: 15m
        alertname: EgressPolicyMetricsStale
        exp_alerts: []
      - eval_time: 16m
        alertname: EgressPolicyMetricsStale
        exp_alerts:
          - exp_labels: {severity: warning, host: n1, instance: "n1:9100"}
            exp_annotations:
              summary: "Egress policy metrics from n1 are over 15 minutes old"
              description: "The metrics timer stopped: `systemctl status egress-policy-metrics.timer` on the host."

  - name: a tunnel program that keeps running warns; a brief one does not
    interval: 1m
    input_series:
      - series: 'egress_policy_tunnel_processes{host="n1", instance="n1:9100", user="bob", process="cloudflared"}'
        values: '1x10'
      - series: 'egress_policy_tunnel_processes{host="n2", instance="n2:9100", user="dave", process="ngrok"}'
        values: '1 1 1 _x7'
    alert_rule_test:
      - eval_time: 10m
        alertname: EgressTunnelRunning
        exp_alerts:
          - exp_labels: {severity: warning, host: n1, instance: "n1:9100", user: bob, process: cloudflared}
            exp_annotations:
              summary: "bob runs the tunnel program cloudflared on n1"
              description: "Tunnels are not allowed on the cluster: ask bob to stop it (`pgrep -u bob -a` on the host shows it)."

  - name: a user's service open to the outside warns after 30 minutes; a filtered one never
    interval: 1m
    input_series:
      - series: 'egress_policy_user_listener{host="n1", instance="n1:9100", user="bob", process="python3", proto="tcp", address="0.0.0.0", port="8888", exposed="true"}'
        values: '1x40'
      - series: 'egress_policy_user_listener{host="n2", instance="n2:9100", user="dave", process="torchrun", proto="tcp", address="::", port="29500", exposed="false"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 20m
        alertname: EgressListenerExposed
        exp_alerts: []
      - eval_time: 35m
        alertname: EgressListenerExposed
        exp_alerts:
          - exp_labels: {severity: warning, host: n1, instance: "n1:9100", user: bob, process: python3, proto: tcp, address: "0.0.0.0", port: "8888", exposed: "true"}
            exp_annotations:
              summary: "bob's python3 on n1 listens on 0.0.0.0 port 8888/tcp, open from outside the cluster"
              description: "No inbound filter keeps this port from the internet. Ask the user to bind to 127.0.0.1 and reach it through an SSH tunnel, or turn on the ingress policy (slurm_enable_ingress_policy) for the host."

  - name: outbound SSH over a limit warns per host and limit; other rejections do not
    interval: 1m
    input_series:
      - series: 'egress_policy_rejected_packets_total{host="n1", instance="n1:9100", reason="ssh_node"}'
        values: '0 0 0 5 9 9 9 9 9 9 9 9 9 9 9 9 9 9 9 9'
      - series: 'egress_policy_rejected_packets_total{host="n1", instance="n1:9100", reason="port"}'
        values: '0+10x19'
      - series: 'egress_policy_rejected_packets_total{host="n2", instance="n2:9100", reason="ssh_user"}'
        values: '0x19'
    alert_rule_test:
      - eval_time: 5m
        alertname: EgressSshRejected
        exp_alerts:
          - exp_labels: {severity: warning, host: n1, reason: ssh_node}
            exp_annotations:
              summary: "n1 rejected outbound SSH connections over the ssh_node limit"
              description: "A client is connecting faster than the policy allows, often a loop retrying a failing login; left alone, the remote site blocks the cluster's address. `journalctl -k --grep egress-policy` on the host names the uid and destination."
      - eval_time: 19m
        alertname: EgressSshRejected
        exp_alerts: []

  - name: a busy GPU on a drained node is maintenance, not an alert
    interval: 1m
    input_series:
      - series: 'DCGM_FI_DEV_GPU_UTIL_RATIO{host="n1", instance="n1:9400", gpu="0", device="nvidia0"}'
        values: '1x30'
      - series: 'DCGM_FI_DEV_GPU_MINOR_NUMBER{host="n1", instance="n1:9400", gpu="0", device="nvidia0"}'
        values: '0x30'
      - series: 'slurm_node_drain{host="m", instance="m:9100", node="n1"}'
        values: '1x30'
      - series: 'slurm_metrics_updated_timestamp_seconds{host="m", instance="m:9100"}'
        values: '0+60x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: GpuBusyWithoutJob
        exp_alerts: []

  - name: a frequent metrics job installed on a host that never reports warns after its window
    interval: 1m
    input_series:
      - series: 'node_systemd_unit_state{host="n1", instance="n1:9100", name="slurm-gpu-metrics.service", state="inactive"}'
        values: '1x30'
      - series: 'node_systemd_unit_state{host="n2", instance="n2:9100", name="slurm-gpu-metrics.service", state="inactive"}'
        values: '1x30'
      - series: 'slurm_metrics_updated_timestamp_seconds{host="n2", instance="n2:9100"}'
        values: '0+60x30'
      - series: 'node_systemd_unit_state{host="n1", instance="n1:9100", name="egress-policy-metrics.service", state="inactive"}'
        values: '1x30'
      - series: 'node_systemd_unit_state{host="n2", instance="n2:9100", name="egress-policy-metrics.service", state="inactive"}'
        values: '1x30'
      - series: 'egress_policy_metrics_timestamp_seconds{host="n2", instance="n2:9100"}'
        values: '0+60x30'
    alert_rule_test:
      - eval_time: 4m
        alertname: SlurmGpuMetricsNeverReported
        exp_alerts: []
      - eval_time: 7m
        alertname: SlurmGpuMetricsNeverReported
        exp_alerts:
          - exp_labels: {severity: warning, host: n1, instance: "n1:9100"}
            exp_annotations:
              summary: "n1 has written no Slurm GPU allocation data for 5 minutes"
              description: "`systemctl status slurm-gpu-metrics` and `journalctl -u slurm-gpu-metrics` on the host; GpuBusyWithoutJob is off meanwhile."
      - eval_time: 14m
        alertname: EgressPolicyMetricsNeverReported
        exp_alerts: []
      - eval_time: 17m
        alertname: EgressPolicyMetricsNeverReported
        exp_alerts:
          - exp_labels: {severity: warning, host: n1, instance: "n1:9100"}
            exp_annotations:
              summary: "n1 has reported no egress policy metrics for 15 minutes"
              description: "`systemctl status egress-policy-metrics.timer` and `journalctl -u egress-policy-metrics` on the host."

  - name: an unreadable TLS certificate warns, and never reads as expired
    interval: 1m
    input_series:
      - series: 'open_ondemand_tls_cert_readable{host="ctl", instance="ctl:9100"}'
        values: '0x15'
    alert_rule_test:
      - eval_time: 5m
        alertname: TlsCertificateUnreadable
        exp_alerts: []
      - eval_time: 12m
        alertname: TlsCertificateUnreadable
        exp_alerts:
          - exp_labels: {severity: warning, service: open_ondemand, host: ctl, instance: "ctl:9100"}
            exp_annotations:
              summary: "The open_ondemand TLS certificate on ctl cannot be read"
              description: "Its expiry is unknown, so the expiry alerts are blind. Check the file the role installs (missing, unreadable or not PEM) and deploy the role again."
      - eval_time: 12m
        alertname: TlsCertificateExpired
        exp_alerts: []

  - name: submission holds not worked out for 15 minutes warn
    interval: 1m
    input_series:
      - series: 'submit_holds_last_success_timestamp_seconds{host="ctl", instance="ctl:9100"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 14m
        alertname: SubmitHoldsStale
        exp_alerts: []
      - eval_time: 16m
        alertname: SubmitHoldsStale
        exp_alerts:
          - exp_labels: {severity: warning, host: ctl, instance: "ctl:9100"}
            exp_annotations:
              summary: "The submission holds on ctl have not been worked out for 15 minutes"
              description: "After 30 minutes job_submit.lua holds no one. `journalctl -u submit-holds` and `systemctl list-timers submit-holds.timer` on the host (Prometheus reachable?)."

  - name: disk quota usage that stops, or never starts, being reported warns
    interval: 1m
    input_series:
      - series: 'disk_quota_last_success_timestamp_seconds{host="login", instance="login:9100"}'
        values: '0x80'
      - series: 'node_systemd_unit_state{host="n1", instance="n1:9100", name="disk-quota.service", state="inactive"}'
        values: '1x80'
    alert_rule_test:
      - eval_time: 59m
        alertname: DiskQuotaMetricsStale
        exp_alerts: []
      - eval_time: 62m
        alertname: DiskQuotaMetricsStale
        exp_alerts:
          - exp_labels: {severity: warning, host: login, instance: "login:9100"}
            exp_annotations:
              summary: "Disk quota usage on login has not been reported for an hour"
              description: "`journalctl -u disk-quota` and `systemctl list-timers disk-quota.timer` on the host."
      - eval_time: 58m
        alertname: DiskQuotaMetricsNeverReported
        exp_alerts: []
      - eval_time: 62m
        alertname: DiskQuotaMetricsNeverReported
        exp_alerts:
          - exp_labels: {severity: warning, host: n1, instance: "n1:9100"}
            exp_annotations:
              summary: "n1 has reported no disk quota usage for an hour"
              description: "`journalctl -u disk-quota` and `systemctl list-timers disk-quota.timer` on the host."

  - name: a power setting refused, one kept being reset, and the runs stopping
    interval: 1m
    input_series:
      - series: 'power_policy_refused{host="n1", instance="n1:9100", setting="module/pcie_aspm/parameters/policy"}'
        values: '1x40'
      - series: 'power_policy_off{host="n1", instance="n1:9100", setting="devices/system/cpu/cpu*/cpufreq/scaling_governor"}'
        values: '0x10 1x60'
      - series: 'power_policy_last_success_timestamp_seconds{host="n1", instance="n1:9100"}'
        values: '0x80'
    alert_rule_test:
      - eval_time: 29m
        alertname: PowerPolicyRefused
        exp_alerts: []
      - eval_time: 31m
        alertname: PowerPolicyRefused
        exp_alerts:
          - exp_labels: {severity: warning, host: n1, instance: "n1:9100", setting: module/pcie_aspm/parameters/policy}
            exp_annotations:
              summary: "n1 will not hold module/pcie_aspm/parameters/policy at full performance"
              description: >-
                `power-policy check /etc/power-policy.json` on n1 lists what each holds. A gpu/
                setting: gpu/persistence is nvidia-persistenced's (`systemctl status
                nvidia-persistenced`), the others are what nvidia-smi refused (`journalctl -u
                power-policy` says which call). A sysfs setting the kernel refuses is the firmware's
                (ASPM, a BIOS power profile): set its performance profile in the BIOS or BMC.
      - eval_time: 55m
        alertname: PowerPolicyKeepsBeingReset
        exp_alerts: []
      - eval_time: 62m
        alertname: PowerPolicyKeepsBeingReset
        exp_alerts:
          - exp_labels: {severity: warning, host: n1, instance: "n1:9100", setting: "devices/system/cpu/cpu*/cpufreq/scaling_governor"}
            exp_annotations:
              summary: "Something keeps changing devices/system/cpu/cpu*/cpufreq/scaling_governor on n1"
              description: >-
                Every run of power-policy sets it back (`journalctl -u power-policy` on n1 lists
                each). Find what writes it: a job script (nvidia-smi -pl, -ac, -lgc in a job), a
                tuned or power-profiles daemon, a package's unit.
      - eval_time: 59m
        alertname: PowerPolicyStale
        exp_alerts: []
      - eval_time: 61m
        alertname: PowerPolicyStale
        exp_alerts:
          - exp_labels: {severity: warning, host: n1, instance: "n1:9100"}
            exp_annotations:
              summary: "The power policy on n1 has not run for an hour"
              description: "`journalctl -u power-policy` and `systemctl list-timers power-policy.timer` on the host."

  - name: a container outside Slurm past the grace period warns; a stopped or new one does not
    interval: 1m
    input_series:
      - series: 'container_storage_gc_docker_unmanaged_stale{host="n1", instance="n1:9100", state="running"}'
        values: '1x5'
      - series: 'container_storage_gc_docker_unmanaged_stale{host="n2", instance="n2:9100", state="running"}'
        values: '0x5'
      - series: 'container_storage_gc_docker_unmanaged_stale{host="n2", instance="n2:9100", state="stopped"}'
        values: '3x5'
    alert_rule_test:
      - eval_time: 2m
        alertname: ContainerOutsideSlurm
        exp_alerts:
          - exp_labels: {severity: warning, host: n1, instance: "n1:9100"}
            exp_annotations:
              summary: "1 container(s) on n1 run outside Slurm past the grace period"
              description: "Docker containers deepops did not start have run on the node longer than the cleanup grace period, outside Slurm's limits and cleanup: `docker ps --filter label!=deepops.unit` on the host. Stop them, and run the work as a job (pyxis, or podman in a job; docs/container/podman.md)."

  - name: a confirmed GPU diagnostics failure pages; flaky and tool errors warn; a pass is quiet
    interval: 1m
    input_series:
      - series: 'gpu_diag_idle_result{host="m1",instance="m1:9100",node="g1",result="fail",tests="memory",drained="yes"}'
        values: '1x5'
      - series: 'gpu_diag_idle_result{host="m1",instance="m1:9100",node="g2",result="flaky",tests="pcie",drained="no"}'
        values: '1x5'
      - series: 'gpu_diag_idle_result{host="m1",instance="m1:9100",node="g3",result="error",tests="",drained="no"}'
        values: '1x5'
      - series: 'gpu_diag_idle_result{host="m1",instance="m1:9100",node="g4",result="pass",tests="",drained="no"}'
        values: '1x5'
    alert_rule_test:
      - eval_time: 1m
        alertname: GpuDiagFailed
        exp_alerts:
          - exp_labels: {host: m1, instance: "m1:9100", node: g1, result: fail, tests: memory, drained: "yes", severity: critical}
            exp_annotations:
              summary: "DCGM diagnostics failed twice on g1: memory"
              description: >-
                The node is drained. The raw result is /var/lib/gpu-diag-idle/raw/g1.json on m1.
                Run the diagnostics again (playbooks/utilities/gpu-diag.yml -e hostlist=g1); once
                they pass, `scontrol update nodename=g1 state=resume`.
      - eval_time: 1m
        alertname: GpuDiagFlaky
        exp_alerts:
          - exp_labels: {host: m1, instance: "m1:9100", node: g2, result: flaky, tests: pcie, drained: "no", severity: warning}
            exp_annotations:
              summary: "DCGM diagnostics on g2 failed (pcie), then passed on the rerun"
              description: >-
                The node stays in service. A repeat next week points at the hardware: the raw
                result is /var/lib/gpu-diag-idle/raw/g2.json on m1.
      - eval_time: 1m
        alertname: GpuDiagError
        exp_alerts:
          - exp_labels: {host: m1, instance: "m1:9100", node: g3, result: error, drained: "no", severity: warning}
            exp_annotations:
              summary: "The weekly DCGM diagnostics could not run on g3"
              description: >-
                A problem of the tool (the host engine, a timeout, output it cannot read), not a
                GPU verdict, so the node was not drained: `journalctl -u gpu-diag-idle` on m1.

  - name: a GPU node not diagnosed for four weeks of running diagnostics is overdue
    interval: 1d
    input_series:
      - series: 'slurm_gpu_configured{host="m1",instance="m1:9100",node="g1",gpu_type="a10"}'
        values: '8x40'
      - series: 'slurm_gpu_configured{host="m1",instance="m1:9100",node="g2",gpu_type="a10"}'
        values: '8x40'
      - series: 'gpu_diag_idle_node_last_success_timestamp_seconds{host="m1",instance="m1:9100",node="g2"}'
        values: '3369600x40'
      - series: 'gpu_diag_idle_since_seconds{host="m1",instance="m1:9100"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 20d
        alertname: GpuDiagOverdue
      - eval_time: 40d
        alertname: GpuDiagOverdue
        exp_alerts:
          - exp_labels: {node: g1, severity: warning}
            exp_annotations:
              summary: "g1's GPUs have not been diagnosed for four weeks"
              description: >-
                No weekly pass found it idle. Run the diagnostics in a quiet hour
                (playbooks/utilities/gpu-diag.yml -e hostlist=g1 drains it first).

  - name: the weekly pass stopping is reported; before the first pass nothing is
    interval: 1d
    input_series:
      - series: 'gpu_diag_idle_last_success_timestamp_seconds{host="m1",instance="m1:9100"}'
        values: '1x12'
      - series: 'gpu_diag_idle_last_success_timestamp_seconds{host="m2",instance="m2:9100"}'
        values: '0x12'
    alert_rule_test:
      - eval_time: 5d
        alertname: GpuDiagNotRunning
      - eval_time: 10d
        alertname: GpuDiagNotRunning
        exp_alerts:
          - exp_labels: {host: m1, instance: "m1:9100", severity: warning}
            exp_annotations:
              summary: "The weekly DCGM diagnostics have not run for 8 days on m1"
              description: "`systemctl list-timers gpu-diag-idle*` and `journalctl -u gpu-diag-idle` on m1."

  - name: I/O usage that stopped counting warns after 10 minutes; one that never counted after 30
    interval: 1m
    input_series:
      - series: 'io_usage_last_success_timestamp_seconds{host="n1", instance="n1:9100"}'
        values: '0x40'
      - series: 'node_systemd_unit_state{host="n2", instance="n2:9100", name="io-usage.service", state="inactive"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 9m
        alertname: IoUsageStale
        exp_alerts: []
      - eval_time: 11m
        alertname: IoUsageStale
        exp_alerts:
          - exp_labels: {severity: warning, host: n1, instance: "n1:9100"}
            exp_annotations:
              summary: "I/O usage on n1 has not been counted for 10 minutes"
              description: "Which jobs and logins do I/O on the node is not known, so the I/O notices cannot name them: `journalctl -u io-usage` and `systemctl list-timers io-usage.timer` on the host."
      - eval_time: 31m
        alertname: IoUsageNeverReported
        exp_alerts:
          - exp_labels: {severity: warning, host: n2, instance: "n2:9100"}
            exp_annotations:
              summary: "I/O usage on n2 has reported no success for 30 minutes"
              description: "`journalctl -u io-usage` and `systemctl list-timers io-usage.timer` on the host."

  - name: a node's NFS traffic is recorded by the mountpoint the host gives the export
    interval: 1m
    input_series:
      - series: 'node_mountstats_nfs_total_read_bytes_total{host="n1", instance="n1:9100", export="srv:/home", mountaddr="10.0.0.1", protocol="tcp"}'
        values: '0+6000x10'
      - series: 'node_mountstats_nfs_total_write_bytes_total{host="n1", instance="n1:9100", export="srv:/home", mountaddr="10.0.0.1", protocol="tcp"}'
        values: '0+600x10'
      - series: 'node_mountstats_nfs_mountpoint_info{host="n1", instance="n1:9100", export="srv:/home", mountaddr="10.0.0.1", protocol="tcp", mountpoint="/home"}'
        values: '1x10'
    promql_expr_test:
      - expr: host_mount:nfs_read_bytes:rate5m
        eval_time: 10m
        exp_samples:
          - labels: 'host_mount:nfs_read_bytes:rate5m{host="n1", mountpoint="/home"}'
            value: 100
      - expr: host_mount:nfs_write_bytes:rate5m
        eval_time: 10m
        exp_samples:
          - labels: 'host_mount:nfs_write_bytes:rate5m{host="n1", mountpoint="/home"}'
            value: 10
