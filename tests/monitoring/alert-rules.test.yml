---
# promtool test rules: each case feeds synthetic series to the shipped alert rules.
rule_files:
  - ../../roles/prometheus/files/rules/*.yml
evaluation_interval: 1m

tests:
  - name: host down fires and hides that host's exporter alerts
    interval: 1m
    input_series:
      - series: 'up{module="node-exporter", host="n1", instance="n1:9100"}'
        values: '0x15'
      - series: 'up{module="dcgm-exporter", host="n1", instance="n1:9400"}'
        values: '0x15'
    alert_rule_test:
      - eval_time: 2m
        alertname: HostDown
        exp_alerts: []
      - eval_time: 4m
        alertname: HostDown
        exp_alerts:
          - exp_labels: {severity: critical, host: n1}
            exp_annotations:
              summary: "n1 is unreachable"
              description: "No exporter on n1 has answered for 3 minutes. The host is down, hung or off the network."
      - eval_time: 15m
        alertname: ExporterDown
        exp_alerts: []

  - name: exporter down on a live host
    interval: 1m
    input_series:
      - series: 'up{module="node-exporter", host="n1", instance="n1:9100"}'
        values: '1x15'
      - series: 'up{module="dcgm-exporter", host="n1", instance="n1:9400"}'
        values: '0x15'
    alert_rule_test:
      - eval_time: 11m
        alertname: ExporterDown
        exp_alerts:
          - exp_labels: {severity: warning, module: dcgm-exporter, host: n1, instance: "n1:9400"}
            exp_annotations:
              summary: "dcgm-exporter down on n1"
              description: "The dcgm-exporter target has failed to scrape for 10 minutes while other targets on n1 answer."

  - name: node-exporter alone down is an exporter problem, not a host outage
    interval: 1m
    input_series:
      - series: 'up{module="node-exporter", host="n1", instance="n1:9100"}'
        values: '0x15'
      - series: 'up{module="dcgm-exporter", host="n1", instance="n1:9400"}'
        values: '1x15'
    alert_rule_test:
      - eval_time: 11m
        alertname: HostDown
        exp_alerts: []
      - eval_time: 11m
        alertname: ExporterDown
        exp_alerts:
          - exp_labels: {severity: warning, module: node-exporter, host: n1, instance: "n1:9100"}
            exp_annotations:
              summary: "node-exporter down on n1"
              description: "The node-exporter target has failed to scrape for 10 minutes while other targets on n1 answer. A hung collector is the usual cause: check that systemd answers with `timeout 5 systemctl is-system-running`."

  - name: HostSystemdUnresponsive fires when the systemd collector fails
    interval: 1m
    input_series:
      - series: 'node_scrape_collector_success{host="n1", instance="n1:9100", collector="systemd"}'
        values: '1x3 0x12'
      - series: 'node_scrape_collector_success{host="n1", instance="n1:9100", collector="cpu"}'
        values: '1x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: HostSystemdUnresponsive
        exp_alerts: []
      - eval_time: 15m
        alertname: HostSystemdUnresponsive
        exp_alerts:
          - exp_labels: {severity: warning, host: n1, instance: "n1:9100", collector: systemd}
            exp_annotations:
              summary: "systemd on n1 is not answering"
              description: "node-exporter cannot read unit states from systemd (PID 1), so units cannot be started or stopped and failed-unit alerts are blind. Drain the node and reboot it."

  - name: chassis fault states are inverted (1 = no fault)
    interval: 1m
    input_series:
      - series: 'ipmi_chassis_cooling_fault_state{host="n1"}'
        values: '1x5 0x5'
      - series: 'ipmi_chassis_drive_fault_state{host="n1"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 4m
        alertname: ChassisFault
        exp_alerts: []
      - eval_time: 9m
        alertname: ChassisFault
        exp_alerts:
          - exp_labels: {severity: critical, host: n1}
            exp_annotations:
              summary: "Cooling or drive fault reported by the BMC of n1"

  - name: BMC sensors of every type, PSU and chassis intrusion separately
    interval: 1m
    input_series:
      - series: 'ipmi_temperature_state{host="n1", name="CPU1 Temp"}'
        values: '2x10'
      - series: 'ipmi_sensor_state{host="n1", name="PS1 Status", type="Power Supply"}'
        values: '2x10'
      - series: 'ipmi_sensor_state{host="n1", name="Chassis Intru", type="Physical Security"}'
        values: '2x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: BmcSensorCritical
        exp_alerts:
          - exp_labels: {severity: critical, host: n1, name: "CPU1 Temp"}
            exp_annotations:
              summary: "BMC sensor CPU1 Temp on n1 is critical"
      - eval_time: 3m
        alertname: PowerSupplyFault
        exp_alerts:
          - exp_labels: {severity: critical, host: n1, name: "PS1 Status", type: "Power Supply"}
            exp_annotations:
              summary: "Power supply PS1 Status on n1 reports a fault"
              description: "A failed or unplugged PSU leaves the server without redundancy."
      - eval_time: 6m
        alertname: ChassisIntrusion
        exp_alerts:
          - exp_labels: {severity: warning, host: n1, name: "Chassis Intru", type: "Physical Security"}
            exp_annotations:
              summary: "Chassis intrusion reported by the BMC of n1"
              description: "The cover was opened, or an old intrusion event was never cleared. Check the node, then clear the event in the BMC."

  - name: a GPU disappearing keeps alerting
    interval: 1m
    input_series:
      - series: 'DCGM_FI_DEV_GPU_TEMP{instance="n1:9400", host="n1", gpu="0"}'
        values: '40x300'
      - series: 'DCGM_FI_DEV_GPU_TEMP{instance="n1:9400", host="n1", gpu="1"}'
        values: '40x30 _x270'
    alert_rule_test:
      - eval_time: 20m
        alertname: GpuMissing
        exp_alerts: []
      - eval_time: 5h
        alertname: GpuMissing
        exp_alerts:
          - exp_labels: {severity: critical, instance: "n1:9400", host: n1}
            exp_annotations:
              summary: "n1 reports fewer GPUs than it did in the last 7 days"

  - name: disk alerts skip network filesystems
    interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{host="n1", mountpoint="/", fstype="ext4"}'
        values: '1x10'
      - series: 'node_filesystem_size_bytes{host="n1", mountpoint="/", fstype="ext4"}'
        values: '100x10'
      - series: 'node_filesystem_readonly{host="n1", mountpoint="/", fstype="ext4"}'
        values: '0x10'
      - series: 'node_filesystem_avail_bytes{host="n1", mountpoint="/home", fstype="nfs4"}'
        values: '1x10'
      - series: 'node_filesystem_size_bytes{host="n1", mountpoint="/home", fstype="nfs4"}'
        values: '100x10'
      - series: 'node_filesystem_readonly{host="n1", mountpoint="/home", fstype="nfs4"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: HostDiskFull
        exp_alerts:
          - exp_labels: {severity: critical, host: n1, mountpoint: "/", fstype: ext4}
            exp_annotations:
              summary: "/ on n1 is over 97% full"
              description: "1% free. Writes will start failing."

  - name: XIDs from user programs are ignored, hardware XIDs alert
    interval: 1m
    input_series:
      - series: 'DCGM_FI_DEV_XID_ERRORS{host="n1", instance="n1:9400", gpu="0"}'
        values: '0x5 43x10'
      - series: 'DCGM_FI_DEV_XID_ERRORS{host="n1", instance="n1:9400", gpu="1"}'
        values: '0x5 48x10'
    alert_rule_test:
      - eval_time: 8m
        alertname: GpuXidError
        exp_alerts:
          - exp_labels: {severity: warning, host: n1, instance: "n1:9400", gpu: "1"}
            exp_annotations:
              summary: "XID 48 on n1 GPU 1"
              description: "XID 48/63/64/74/79/92/94/95 usually need a drain and reset; see the NVIDIA XID catalogue."

  - name: GPU temperature uses the device slowdown limit, else a fixed one
    interval: 1m
    input_series:
      - series: 'DCGM_FI_DEV_GPU_TEMP{host="n1", instance="n1:9400", gpu="0"}'
        values: '86x15'
      - series: 'DCGM_FI_DEV_SLOWDOWN_TEMP{host="n1", instance="n1:9400", gpu="0"}'
        values: '95x15'
      - series: 'DCGM_FI_DEV_GPU_TEMP{host="n1", instance="n1:9400", gpu="1"}'
        values: '91x15'
      - series: 'DCGM_FI_DEV_SLOWDOWN_TEMP{host="n1", instance="n1:9400", gpu="1"}'
        values: '95x15'
      - series: 'DCGM_FI_DEV_GPU_TEMP{host="n2", instance="n2:9400", gpu="0"}'
        values: '86x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: GpuTemperatureHigh
        exp_alerts:
          - exp_labels: {severity: warning, host: n1, instance: "n1:9400", gpu: "1"}
            exp_annotations:
              summary: "GPU 1 on n1 at 91C, near its slowdown temperature"
          - exp_labels: {severity: warning, host: n2, instance: "n2:9400", gpu: "0"}
            exp_annotations:
              summary: "GPU 0 on n2 at 86C, near its slowdown temperature"

  - name: hardware slowdown bits alert, power capping does not
    interval: 1m
    input_series:
      - series: 'DCGM_FI_DEV_CLOCKS_EVENT_REASONS{host="n1", instance="n1:9400", gpu="0"}'
        values: '4x20'
      - series: 'DCGM_FI_DEV_CLOCKS_EVENT_REASONS{host="n1", instance="n1:9400", gpu="1"}'
        values: '68x20'
    alert_rule_test:
      - eval_time: 16m
        alertname: GpuHardwareSlowdown
        exp_alerts:
          - exp_labels: {severity: warning, host: n1, instance: "n1:9400", gpu: "1"}
            exp_annotations:
              summary: "GPU 1 on n1 is held down by a hardware slowdown"
              description: "Thermal or power-brake slowdown; check cooling, fans and power supplies."

  - name: GpuFallenOffBus fires
    interval: 1m
    input_series:
      - series: 'DCGM_FI_DEV_XID_ERRORS{host="n1",instance="n1:9400",gpu="2"}'
        values: '79x5'
    alert_rule_test:
      - eval_time: 1m
        alertname: GpuFallenOffBus
        exp_alerts:
          - exp_labels: {gpu: "2", host: "n1", instance: "n1:9400", severity: "critical"}
            exp_annotations:
              summary: "GPU 2 on n1 fell off the bus (XID 79)"

  - name: GpuRowRemapFailure fires
    interval: 1m
    input_series:
      - series: 'DCGM_FI_DEV_ROW_REMAP_FAILURE{host="n1",instance="n1:9400",gpu="2"}'
        values: '1x5'
    alert_rule_test:
      - eval_time: 1m
        alertname: GpuRowRemapFailure
        exp_alerts:
          - exp_labels: {gpu: "2", host: "n1", instance: "n1:9400", severity: "critical"}
            exp_annotations:
              description: "The GPU has run out of spare rows; RMA it."
              summary: "Row remapping failed on n1 GPU 2"

  - name: GpuUncorrectableRemappedRows fires
    interval: 1m
    input_series:
      - series: 'DCGM_FI_DEV_UNCORRECTABLE_REMAPPED_ROWS{host="n1",instance="n1:9400",gpu="2"} 0x5'
        values: '1x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: GpuUncorrectableRemappedRows
        exp_alerts:
          - exp_labels: {gpu: "2", host: "n1", instance: "n1:9400", severity: "warning"}
            exp_annotations:
              description: "Reset the GPU (drain the node first) so the remap takes effect."
              summary: "New uncorrectable remapped rows on n1 GPU 2"

  - name: GpuMemoryTemperatureHigh fires
    interval: 1m
    input_series:
      - series: 'DCGM_FI_DEV_MEMORY_TEMP{host="n1",instance="n1:9400",gpu="2"}'
        values: '92x15'
      - series: 'DCGM_FI_DEV_MEM_MAX_OP_TEMP{host="n1",instance="n1:9400",gpu="2"}'
        values: '95x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: GpuMemoryTemperatureHigh
        exp_alerts:
          - exp_labels: {gpu: "2", host: "n1", instance: "n1:9400", severity: "warning"}
            exp_annotations:
              summary: "GPU 2 memory on n1 at 92C, near its limit"

  - name: GpuPcieReplaysHigh fires
    interval: 1m
    input_series:
      - series: 'DCGM_FI_DEV_PCIE_REPLAY_COUNTER{host="n1",instance="n1:9400",gpu="2"}'
        values: '0+100x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: GpuPcieReplaysHigh
        exp_alerts:
          - exp_labels: {gpu: "2", host: "n1", instance: "n1:9400", severity: "warning"}
            exp_annotations:
              description: "3000 in 1h; check the riser, slot or cabling."
              summary: "PCIe replays on n1 GPU 2"

  - name: HostDiskAlmostFull fires
    interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{host="n1",instance="n1:9100",mountpoint="/scratch",fstype="xfs",device="/dev/md0"}'
        values: '5x15'
      - series: 'node_filesystem_size_bytes{host="n1",instance="n1:9100",mountpoint="/scratch",fstype="xfs",device="/dev/md0"}'
        values: '100x15'
      - series: 'node_filesystem_readonly{host="n1",instance="n1:9100",mountpoint="/scratch",fstype="xfs",device="/dev/md0"}'
        values: '0x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: HostDiskAlmostFull
        exp_alerts:
          - exp_labels: {device: "/dev/md0", fstype: "xfs", host: "n1", instance: "n1:9100", mountpoint: "/scratch", severity: "warning"}
            exp_annotations:
              description: "5% free."
              summary: "/scratch on n1 is over 90% full"

  - name: HostDiskFillingUp fires
    interval: 5m
    input_series:
      - series: 'node_filesystem_avail_bytes{host="n1",instance="n1:9100",mountpoint="/",fstype="ext4",device="/dev/sda1"}'
        values: '20-0.1x100'
      - series: 'node_filesystem_size_bytes{host="n1",instance="n1:9100",mountpoint="/",fstype="ext4",device="/dev/sda1"}'
        values: '100x100'
      - series: 'node_filesystem_readonly{host="n1",instance="n1:9100",mountpoint="/",fstype="ext4",device="/dev/sda1"}'
        values: '0x100'
    alert_rule_test:
      - eval_time: 7h
        alertname: HostDiskFillingUp
        exp_alerts:
          - exp_labels: {device: "/dev/sda1", fstype: "ext4", host: "n1", instance: "n1:9100", mountpoint: "/", severity: "warning"}
            exp_annotations:
              summary: "/ on n1 will fill within 24h"

  - name: HostInodesAlmostExhausted fires
    interval: 1m
    input_series:
      - series: 'node_filesystem_files_free{host="n1",instance="n1:9100",mountpoint="/",fstype="ext4",device="/dev/sda1"}'
        values: '2x15'
      - series: 'node_filesystem_files{host="n1",instance="n1:9100",mountpoint="/",fstype="ext4",device="/dev/sda1"}'
        values: '100x15'
      - series: 'node_filesystem_readonly{host="n1",instance="n1:9100",mountpoint="/",fstype="ext4",device="/dev/sda1"}'
        values: '0x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: HostInodesAlmostExhausted
        exp_alerts:
          - exp_labels: {device: "/dev/sda1", fstype: "ext4", host: "n1", instance: "n1:9100", mountpoint: "/", severity: "warning"}
            exp_annotations:
              summary: "/ on n1 has under 5% inodes left"

  - name: HostMemoryExhausted fires
    interval: 1m
    input_series:
      - series: 'node_memory_MemAvailable_bytes{host="n1",instance="n1:9100"}'
        values: '2x20'
      - series: 'node_memory_MemTotal_bytes{host="n1",instance="n1:9100"}'
        values: '100x20'
    alert_rule_test:
      - eval_time: 16m
        alertname: HostMemoryExhausted
        exp_alerts:
          - exp_labels: {host: "n1", instance: "n1:9100", severity: "warning"}
            exp_annotations:
              summary: "n1 has under 3% memory available"

  - name: HostClockNotSynchronised fires
    interval: 1m
    input_series:
      - series: 'node_timex_sync_status{host="n1",instance="n1:9100"}'
        values: '0x20'
      - series: 'node_timex_maxerror_seconds{host="n1",instance="n1:9100"}'
        values: '16x20'
    alert_rule_test:
      - eval_time: 16m
        alertname: HostClockNotSynchronised
        exp_alerts:
          - exp_labels: {host: "n1", instance: "n1:9100", severity: "warning"}
            exp_annotations:
              description: "Munge and Slurm reject credentials when clocks drift apart."
              summary: "Clock on n1 is not synchronised"

  - name: HostSystemdUnitFailed fires
    interval: 1m
    input_series:
      - series: 'node_systemd_unit_state{host="n1",instance="n1:9100",name="nfs-server.service",state="failed",type="simple"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: HostSystemdUnitFailed
        exp_alerts:
          - exp_labels: {host: "n1", instance: "n1:9100", name: "nfs-server.service", severity: "warning", state: "failed", type: "simple"}
            exp_annotations:
              summary: "nfs-server.service failed on n1"

  - name: HostMemoryUncorrectableErrors fires
    interval: 1m
    input_series:
      - series: 'node_edac_uncorrectable_errors_total{host="n1",instance="n1:9100",controller="0"} 0x5'
        values: '1x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: HostMemoryUncorrectableErrors
        exp_alerts:
          - exp_labels: {controller: "0", host: "n1", instance: "n1:9100", severity: "critical"}
            exp_annotations:
              description: "Drain the node and replace the DIMM on controller 0."
              summary: "Uncorrectable ECC memory error on n1"

  - name: HostMemoryCorrectableErrorsHigh fires
    interval: 10m
    input_series:
      - series: 'node_edac_correctable_errors_total{host="n1",instance="n1:9100",controller="1"}'
        values: '0+20x30'
    alert_rule_test:
      - eval_time: 3h
        alertname: HostMemoryCorrectableErrorsHigh
        exp_alerts:
          - exp_labels: {controller: "1", host: "n1", instance: "n1:9100", severity: "warning"}
            exp_annotations:
              description: "360 in 24h on controller 1; the DIMM is likely failing."
              summary: "Many correctable ECC memory errors on n1"

  - name: HostRaidDegraded fires
    interval: 1m
    input_series:
      - series: 'node_md_disks_required{host="n1",instance="n1:9100",device="md0"}'
        values: '6x10'
      - series: 'node_md_disks{host="n1",instance="n1:9100",device="md0",state="active"}'
        values: '5x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: HostRaidDegraded
        exp_alerts:
          - exp_labels: {device: "md0", host: "n1", instance: "n1:9100", severity: "critical"}
            exp_annotations:
              summary: "RAID md0 on n1 is degraded"

  - name: HostRaidDiskFailed fires
    interval: 1m
    input_series:
      - series: 'node_md_disks{host="n1",instance="n1:9100",device="md0",state="failed"}'
        values: '1x5'
    alert_rule_test:
      - eval_time: 1m
        alertname: HostRaidDiskFailed
        exp_alerts:
          - exp_labels: {device: "md0", host: "n1", instance: "n1:9100", severity: "critical", state: "failed"}
            exp_annotations:
              summary: "A disk in RAID md0 on n1 has failed"

  - name: HostNetworkErrors fires
    interval: 1m
    input_series:
      - series: 'node_network_receive_errs_total{host="n1",instance="n1:9100",device="ens3f0np0"}'
        values: '0+120x30'
      - series: 'node_network_transmit_errs_total{host="n1",instance="n1:9100",device="ens3f0np0"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: HostNetworkErrors
        exp_alerts:
          - exp_labels: {device: "ens3f0np0", host: "n1", instance: "n1:9100", severity: "warning"}
            exp_annotations:
              summary: "Network errors on ens3f0np0 of n1"

  - name: PrometheusRuleEvaluationFailing fires
    interval: 1m
    input_series:
      - series: 'prometheus_rule_evaluation_failures_total{host="m",instance="localhost:9090",job="prometheus",rule_group="/etc/prometheus/rules/gpu.yml;gpu"} 0 1 2 3 4 5'
        values: '6'
    alert_rule_test:
      - eval_time: 5m
        alertname: PrometheusRuleEvaluationFailing
        exp_alerts:
          - exp_labels: {host: "m", instance: "localhost:9090", job: "prometheus", rule_group: "/etc/prometheus/rules/gpu.yml;gpu", severity: "warning"}
            exp_annotations:
              summary: "Prometheus rule group /etc/prometheus/rules/gpu.yml;gpu fails to evaluate"

  - name: PrometheusNotificationsFailing fires
    interval: 1m
    input_series:
      - series: 'prometheus_notifications_errors_total{host="m",instance="localhost:9090",job="prometheus",alertmanager="http://localhost:9093/api/v2/alerts"}'
        values: '0+1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: PrometheusNotificationsFailing
        exp_alerts:
          - exp_labels: {alertmanager: "http://localhost:9093/api/v2/alerts", host: "m", instance: "localhost:9090", job: "prometheus", severity: "critical"}
            exp_annotations:
              summary: "Prometheus cannot deliver alerts to Alertmanager"

  - name: AlertmanagerNotificationsFailing fires
    interval: 1m
    input_series:
      - series: 'alertmanager_notifications_failed_total{host="m",instance="localhost:9093",job="alertmanager",integration="slack",reason="other"}'
        values: '0+1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: AlertmanagerNotificationsFailing
        exp_alerts:
          - exp_labels: {host: "m", instance: "localhost:9093", integration: "slack", job: "alertmanager", reason: "other", severity: "critical"}
            exp_annotations:
              summary: "Alertmanager fails to send to slack"

  - name: PrometheusTsdbCompactionsFailing fires
    interval: 1m
    input_series:
      - series: 'prometheus_tsdb_compactions_failed_total{host="m",instance="localhost:9090",job="prometheus"} 0x5'
        values: '1x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: PrometheusTsdbCompactionsFailing
        exp_alerts:
          - exp_labels: {host: "m", instance: "localhost:9090", job: "prometheus", severity: "warning"}
            exp_annotations:
              summary: "Prometheus TSDB compactions are failing"

  - name: BmcSensorWarning fires
    interval: 1m
    input_series:
      - series: 'ipmi_fan_speed_state{host="n1",instance="n1:9290",id="1009",name="FAN2"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 16m
        alertname: BmcSensorWarning
        exp_alerts:
          - exp_labels: {host: "n1", id: "1009", instance: "n1:9290", name: "FAN2", severity: "warning"}
            exp_annotations:
              summary: "BMC sensor FAN2 on n1 is in warning"

  - name: BmcUnreadable fires
    interval: 1m
    input_series:
      - series: 'ipmi_up{host="n1",instance="n1:9290",collector="ipmi"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 16m
        alertname: BmcUnreadable
        exp_alerts:
          - exp_labels: {collector: "ipmi", host: "n1", instance: "n1:9290", severity: "warning"}
            exp_annotations:
              summary: "ipmi-exporter cannot read the ipmi data of n1"

  - name: watchdog always fires
    interval: 1m
    alert_rule_test:
      - eval_time: 1m
        alertname: Watchdog
        exp_alerts:
          - exp_labels: {severity: none}
            exp_annotations:
              summary: "Heartbeat of the alerting pipeline; not a problem"

  - name: a busy GPU no Slurm job holds fires; a held one does not
    interval: 1m
    input_series:
      - series: 'DCGM_FI_DEV_GPU_UTIL{host="n1", instance="n1:9400", gpu="0", device="nvidia0"}'
        values: '100x30'
      - series: 'DCGM_FI_DEV_GPU_UTIL{host="n1", instance="n1:9400", gpu="1", device="nvidia1"}'
        values: '100x30'
      - series: 'slurm_gpu_allocated{host="m", instance="m:9100", node="n1", gpu="1", gpu_type="t", user="u", account="a", partition="p", job_id="7"}'
        values: '1x30'
      - series: 'node_textfile_mtime_seconds{host="m", instance="m:9100", file="/run/prometheus/slurm-gpu.prom"}'
        values: '0+60x30'
    alert_rule_test:
      - eval_time: 10m
        alertname: GpuBusyWithoutJob
        exp_alerts: []
      - eval_time: 20m
        alertname: GpuBusyWithoutJob
        exp_alerts:
          - exp_labels: {severity: warning, host: n1, gpu: "0", device: nvidia0}
            exp_annotations:
              summary: "GPU 0 on n1 is 100% busy with no Slurm job holding it"
              description: >-
                A process outside Slurm, or one left behind by a finished job. As root on
                the host, `fuser -v /dev/nvidia*` finds it; a GPU reset or reboot clears a
                hung one.
      - eval_time: 20m
        alertname: SlurmGpuMetricsStale
        exp_alerts: []

  - name: stale allocation data warns and silences the busy-GPU alert
    interval: 1m
    input_series:
      - series: 'DCGM_FI_DEV_GPU_UTIL{host="n1", instance="n1:9400", gpu="0", device="nvidia0"}'
        values: '100x30'
      - series: 'node_textfile_mtime_seconds{host="m", instance="m:9100", file="/run/prometheus/slurm-gpu.prom"}'
        values: '0x30'
      - series: 'node_textfile_scrape_error{host="m", instance="m:9100"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: GpuBusyWithoutJob
        exp_alerts: []
      - eval_time: 25m
        alertname: SlurmGpuMetricsStale
        exp_alerts:
          - exp_labels: {severity: warning, host: m, instance: m:9100, file: /run/prometheus/slurm-gpu.prom}
            exp_annotations:
              summary: "Slurm GPU allocation data on m is stale or unreadable"
              description: >-
                `systemctl status slurm-gpu-metrics` and `journalctl -u slurm-gpu-metrics`
                on the host say why; GpuBusyWithoutJob is off meanwhile.

  - name: a failed backup pages; a stale one pages unless it already failed
    interval: 1h
    input_series:
      - series: 'slurm_backup_last_status{host="m", instance="m:9100", destination="/a"}'
        values: '0x48'
      - series: 'slurm_backup_last_success_timestamp_seconds{host="m", instance="m:9100", destination="/a"}'
        values: '0x48'
      - series: 'slurm_backup_last_status{host="m", instance="m:9100", destination="/b"}'
        values: '1x48'
      - series: 'slurm_backup_last_success_timestamp_seconds{host="m", instance="m:9100", destination="/b"}'
        values: '0x48'
    alert_rule_test:
      - eval_time: 1h
        alertname: SlurmBackupFailed
        exp_alerts:
          - exp_labels: {severity: critical, host: m, instance: "m:9100", destination: /a}
            exp_annotations:
              summary: "The last Slurm backup to /a failed"
              description: "`journalctl -u slurm-backup@backup` on m says why; the accounting database and controller state have no fresh copy there."
      - eval_time: 30h
        alertname: SlurmBackupStale
        exp_alerts: []
      - eval_time: 40h
        alertname: SlurmBackupStale
        exp_alerts:
          - exp_labels: {severity: critical, host: m, instance: "m:9100", destination: /b}
            exp_annotations:
              summary: "No Slurm backup to /b has succeeded for 36 hours"
              description: "The daily backup did not run or stopped before writing its result: `systemctl list-timers slurm-backup*` and `journalctl -u slurm-backup@backup` on m."

  - name: restore test failure warns; a stale test warns after 40 days
    interval: 1d
    input_series:
      - series: 'slurm_backup_restore_test_status{host="m", instance="m:9100"}'
        values: '0x45'
      - series: 'slurm_backup_restore_test_status{host="m2", instance="m2:9100"}'
        values: '1x45'
      - series: 'slurm_backup_restore_test_last_success_timestamp_seconds{host="m2", instance="m2:9100"}'
        values: '0x45'
    alert_rule_test:
      - eval_time: 1d
        alertname: SlurmBackupRestoreTestFailed
        exp_alerts:
          - exp_labels: {severity: warning, host: m, instance: "m:9100"}
            exp_annotations:
              summary: "The monthly Slurm backup restore test failed on m"
              description: "A backup that does not restore is no backup: `journalctl -u slurm-backup@restore-test`."
      - eval_time: 39d
        alertname: SlurmBackupRestoreTestStale
        exp_alerts: []
      - eval_time: 41d
        alertname: SlurmBackupRestoreTestStale
        exp_alerts:
          - exp_labels: {severity: warning, host: m2, instance: "m2:9100"}
            exp_annotations:
              summary: "No Slurm backup restore test has passed on m2 for 40 days"
              description: "The monthly restore test did not run: `systemctl list-timers slurm-backup*`."

  - name: long-pending security updates and reboots warn; stale update metrics warn
    interval: 1d
    input_series:
      - series: 'os_updates_security_pending_since_seconds{host="n1", instance="n1:9100"}'
        values: '86400x20'
      - series: 'os_updates_security_pending_since_seconds{host="n2", instance="n2:9100"}'
        values: '0x20'
      - series: 'os_updates_reboot_required{host="n1", instance="n1:9100"}'
        values: '1x20'
      - series: 'os_updates_reboot_required_since_seconds{host="n1", instance="n1:9100"}'
        values: '86400x20'
      - series: 'os_updates_metrics_timestamp_seconds{host="n1", instance="n1:9100"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 14d
        alertname: OsSecurityUpdatesPending
        exp_alerts: []
      - eval_time: 16d
        alertname: OsSecurityUpdatesPending
        exp_alerts:
          - exp_labels: {severity: warning, host: n1, instance: "n1:9100"}
            exp_annotations:
              summary: "Security updates have waited on n1 for over 14 days"
              description: "Held-back packages need the rolling upgrade: `ansible-playbook -K playbooks/utilities/apt-upgrade.yml -e hostlist=n1`."
      - eval_time: 16d
        alertname: OsRebootPending
        exp_alerts:
          - exp_labels: {severity: warning, host: n1, instance: "n1:9100"}
            exp_annotations:
              summary: "n1 has waited over 14 days for a reboot an update asked for"
              description: "The update is not in effect until then: `ansible-playbook -K playbooks/utilities/apt-upgrade.yml -e hostlist=n1` drains the node, reboots it and puts it back."
      - eval_time: 2d
        alertname: OsUpdatesMetricsStale
        exp_alerts: []
      - eval_time: 4d
        alertname: OsUpdatesMetricsStale
        exp_alerts:
          - exp_labels: {severity: warning, host: n1, instance: "n1:9100"}
            exp_annotations:
              summary: "Update status from n1 is over 3 days old"
              description: "The os-updates metrics timer stopped: `systemctl status os-updates-metrics.timer` on the host."
