# A site's own slurm.conf, as a site kept one before the role rendered its settings: the
# fixture of the equivalence test (test_render.py), with settings.yml saying the same.
ClusterName=example
SlurmctldHost=ctl01
StateSaveLocation=/var/spool/slurmctld
AuthType=auth/munge
JobSubmitPlugins=lua
MpiDefault=pmix
ProctrackType=proctrack/cgroup
Prolog=/etc/slurm/prolog.sh
Epilog=/etc/slurm/epilog.sh
PrologFlags=Alloc,Serial,Contain
PrologEpilogTimeout=600
PropagateResourceLimits=NONE
RebootProgram="/bin/systemctl reboot"
ReturnToService=2
SlurmctldPidFile=/var/run/slurmctld/slurmctld.pid
SlurmctldPort=6817
SlurmdPidFile=/var/run/slurm/slurmd.pid
SlurmdPort=6818
SlurmdSpoolDir=/var/spool/slurmd
SlurmUser=slurm
SwitchType=switch/none
TaskProlog=/etc/slurm/task-prolog.sh
TaskPlugin=task/affinity,task/cgroup
BatchStartTimeout=600
HealthCheckProgram=/usr/sbin/nhc
HealthCheckInterval=300
HealthCheckNodeState=ANY,CYCLE
InactiveLimit=0
KillWait=120
MinJobAge=120
SlurmctldTimeout=120
SlurmdTimeout=300
UnkillableStepTimeout=180
Waittime=0
SlurmctldParameters=enable_configless,rl_enable
MetricsType=metrics/openmetrics
SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory,CR_CORE_DEFAULT_DIST_BLOCK,CR_ONE_TASK_PER_CORE
PriorityType=priority/multifactor
PriorityWeightFairshare=1000
AccountingStorageEnforce=associations,limits,qos
AccountingStorageHost=ctl01
AccountingStoragePass=/var/run/munge/munge.socket.2
AccountingStoragePort=6819
AccountingStorageTRES=gres/gpu,gres/gpu:gtype
AccountingStorageType=accounting_storage/slurmdbd
JobCompType=jobcomp/none
JobAcctGatherType=jobacct_gather/cgroup
SlurmctldDebug=info
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdDebug=info
SlurmdLogFile=/var/log/slurm/slurmd.log
ResumeTimeout=900
GresTypes=gpu
NodeName=gpu01 NodeAddr=192.0.2.1 CPUs=8 CoreSpecCount=1 Boards=1 SocketsPerBoard=1 CoresPerSocket=4 ThreadsPerCore=2 RealMemory=1024 Gres=gpu:gtype:2 Weight=10
NodeName=gpu02 NodeAddr=192.0.2.2 CPUs=8 CoreSpecCount=1 Boards=1 SocketsPerBoard=1 CoresPerSocket=4 ThreadsPerCore=2 RealMemory=1024 Gres=gpu:gtype:2 Weight=20
PartitionName=gpu Nodes=gpu[01-02] Default=YES DefCpuPerGPU=4 TRESBillingWeights="CPU=0,Mem=0,GRES/gpu:gtype=1.0" State=UP OverSubscribe=NO MaxTime=7-00:00:00
