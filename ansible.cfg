[defaults]
collections_path = ./collections
roles_path = ./roles/galaxy:./roles:./submodules/kubespray/roles
library = ./submodules/kubespray/library
# Code the in-tree modules share (plugins/module_utils/deepops_marks.py).
module_utils = ./plugins/module_utils
filter_plugins = ./plugins/filter
inventory = ./config/inventory,./scripts/maas_inventory.py
host_key_checking = True
gathering = smart
fact_caching = jsonfile
# The cached facts feed templates root renders (/etc/hosts, slurm.conf), so they live
# in the operator's own home, never a world-writable directory anyone could fill first.
fact_caching_connection = ~/.cache/deepops/ansible-facts
fact_caching_timeout = 86400
# private_role_vars stays unset on purpose: then a play's roles and import_role are
# public (deploy_defaults, Kubespray's kubespray_defaults) and include_role is private.
# Setting it to either value makes every include follow it and hides private-include
# bugs that break under any other ansible.cfg (lib/ansible/playbook/role/__init__.py).
# Deprecations stay visible: a silenced one is how a removed setting goes unnoticed.
deprecation_warnings = True
vault_password_file = ./config/.vault-pass
timeout=60
stdout_callback = ansible.builtin.default
callback_result_format = yaml
display_skipped_hosts = False
# Temporary files under /tmp, not ~/.ansible/tmp, on both ends: homes are often NFS with
# root_squash, where root (become) cannot read what the login user wrote there. Ansible
# makes a private (0700, randomly named) directory per run, and pipelining (below)
# spares most remote files anyway.
local_tmp=/tmp
remote_tmp=/tmp
forks = 25
force_valid_group_names = ignore
# auto-discover the remote Python and don't warn about it (ansible_python_interpreter
# is a host var, NOT a valid ansible.cfg key -- the correct cfg key is interpreter_python).
interpreter_python = auto_silent

[ssh_connection]
pipelining = True
# One attempt per connection (the cluster's rule: no SSH retry loops; a retry storm once
# got the cluster's address blocked). Host keys are learned on first contact and then
# checked (accept-new), so a changed key stops the run. Keepalives drop a control
# master that a reboot left stale.
ssh_args = -o ControlMaster=auto -o ControlPersist=5m -o ConnectionAttempts=1 -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=accept-new
control_path = ~/.ssh/ansible-%%r@%%h:%%p
