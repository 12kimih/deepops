---
################################################################################
# DeepOps Ansible Config                                                       #
################################################################################
#
# Configuration common to all hosts
# Define per-group or per-host values in the other configuration files
#

################################################################################
# Ansible                                                                      #
################################################################################
# Pin the Python Ansible uses on the managed nodes to the system interpreter, instead
# of letting it auto-discover a per-user Python (e.g. a uv or pip --user install that
# happens to be first on the SSH login's PATH). Keeps module deps in one predictable
# place -- community.docker tasks (registry, monitoring) need requests + docker there.
#ansible_python_interpreter: /usr/bin/python3  # example

################################################################################
# /etc/hosts                                                                   #
################################################################################
# When generating /etc/hosts (the hosts role, run by hosts.yml), an interface with
# several addresses is listed by the one inside cluster_networks (NETWORK below).

################################################################################
# PROXY
################################################################################
# Proxy Variables needed for scripts, ansible, etc.
#http_proxy: http://10.0.2.5:3128  # example
#https_proxy: http://10.0.2.5:3128  # example
#no_proxy: localhost,cluster.local,127.0.0.1,::1,10.0.2.10,10.0.2.20,10.0.2.30  # example

#proxy_env:  # example
#  http_proxy: '{{ http_proxy }}'
#  https_proxy: '{{ https_proxy }}'
#  no_proxy: '{{ no_proxy }}'


################################################################################
# NODE USER POLICY                                                             #
################################################################################
# What users may leave running outside a Slurm job (roles/node_user_policy). Lingering
# (loginctl enable-linger) starts a user's services outside any job, so on a compute
# node they escape its cgroup: only the admins keep it, and only root may enable it.
# Crontabs stay open on the login node (jobs there run under the per-user limits) and
# are closed on compute nodes, where they would run outside every job.
#node_user_policy_manage_linger: true  # example
#node_user_policy_linger_users: "{{ cluster_admins }}"  # example
#node_user_policy_cron_users: "{{ none if inventory_hostname in groups['slurm-login'] | default([]) else cluster_admins }}"  # example

################################################################################
# NETWORK                                                                      #
################################################################################
# The cluster's own networks (CIDRs, roles/network_defaults): the one place they are
# written. Every network the hosts talk over, never one they share with others. NFS
# exports are offered to them, fail2ban never bans them, rsyslog takes their logs, the
# ingress and egress policies let them through, and each host's cluster_address (for
# /etc/hosts and host-based SSH) is its address in them.
#cluster_networks: []
#cluster_networks: [10.0.0.0/16]  # example

# Egress policy (roles/egress_policy, docs/slurm-cluster/egress-policy.md): outside
# the cluster, users reach only web, DNS, NTP and rate-limited SSH; the administrators
# and system accounts are exempt. Switched on by slurm_enable_egress_policy.
#egress_policy_exempt_uids: "{{ people | people_uids('admin') }}"  # example
#egress_policy_ssh_rate: 20/minute
#egress_policy_ssh_burst: 30
# The node-wide SSH bucket defaults to 600/minute, burst 1200 on [slurm-login] hosts
# and 60/minute, burst 120 elsewhere.
#egress_policy_ssh_node_rate: 600/minute  # example
#egress_policy_ssh_node_burst: 1200  # example

# Ingress policy (roles/ingress_policy, slurm_enable_ingress_policy; replaces ufw): only
# the cluster's networks (cluster_networks), trusted interfaces and the open ports reach
# a host. Open the SSH port on the login node.
#ingress_policy_tcp_ports: "{{ [cluster_info.ssh_port] if inventory_hostname in groups['slurm-login'] | default([]) else [] }}"  # example
#ingress_policy_udp_ports: []
#ingress_policy_trusted_interfaces: [tailscale0]  # example
#ingress_policy_lockout_check: true

# Local resolver (roles/dns_resolver, slurm_enable_dns_resolver): unbound on loopback,
# forwarding to the site's resolvers, answering NXDOMAIN for tunnel services.
#dns_resolver_upstreams: [192.0.2.53, 198.51.100.53]  # example
#dns_resolver_blocked_domains_site: [tunnel.example.net]  # example

# DNS config
# Playbook: dns-config
#dns_config_servers: [8.8.8.8]  # example
#dns_config_search: [example.com]  # example

# Time sync (roles/deepops_chrony, playbooks/generic/chrony-client.yml). chrony_upstream
# are chrony.conf source lines. With chrony_serve_hosts set, only those hosts take time
# from upstream and serve it to chrony_serve_networks; every other host takes time from
# them, so the cluster keeps one time even while the outside is unreachable.
#chrony_install: true
#chrony_service_state: "started"
#chrony_service_enabled: true
#chrony_upstream:
#  - pool 0.pool.ntp.org iburst maxsources 2
#  - pool 1.pool.ntp.org iburst maxsources 2
#  - pool 2.pool.ntp.org iburst maxsources 2
#chrony_serve_hosts: []
#chrony_serve_hosts: "{{ groups['slurm-master'][:1] }}"  # example
#chrony_serve_networks: "{{ cluster_networks }}"

# Set hostname based on inventory file
#deepops_set_hostname: true

# Local filesystems' mount options (roles/host_baseline, playbooks/generic/host-baseline.yml):
# mount point: options, for the entries already in /etc/fstab; the device stays as the
# installer wrote it, changed filesystems are remounted. Network filesystems take
# nfs_mount_options. Set per host group: a mount point named must be local on each host.
#host_baseline_mount_options: {}
#host_baseline_mount_options: {"/": "defaults,noatime,errors=remount-ro"}  # example

# Every host's locale (LANG) and time zone (roles/locale, playbooks/generic/locale.yml).
#locale_lang: "en_US.UTF-8"
#locale_timezone: "Etc/UTC"

# The systemd target each host boots into (roles/default_target); a host that needs a
# desktop sets graphical.target in its host_vars.
#default_target: multi-user.target

################################################################################
# SOFTWARE                                                                     #
################################################################################
# The OpenSSH server (roles/sshd): with sshd_manage, sshd_config is the package's own and
# the site's settings are one drop-in, checked by sshd before it is kept. Other files in
# sshd_config.d (cloud-init's) are moved to sshd_backup_dir and reported.
#sshd_manage: false
#sshd_ports: [22]
#sshd_settings: {}  # e.g. {LoginGraceTime: 20}
# Host-based authentication among the hosts of one group: users reach the others as
# themselves without keys of their own (never root); retires the login scripts that made
# every user a key. Needs cluster_networks.
#sshd_hostbased_group: ""
#sshd_hostbased_group: slurm-cluster  # example

# fail2ban (roles/fail2ban; switch slurm_enable_fail2ban / kube_enable_fail2ban): the
# site's [DEFAULT] settings over the distribution's, and addresses never banned.
#fail2ban_settings: {}  # e.g. {bantime: 1h, findtime: 10m, maxretry: 5}
#fail2ban_ignoreip: "{{ cluster_networks }}"

# The shells people log in with: installed on every host, each reading /etc/profile.d
# (roles/login_shells). Default: every shell people.yml gives an active person, and bash.
# Lmod hooks into every installed shell.
#login_shells: "{{ (['bash'] + people | people_shells(people_default_shell) | map('basename') | list) | unique | list }}"

# Extra software to install (removal: HOST BASELINE below)
# Playbook: software
#software_extra_packages:  # example
#  - curl
#  - git
#  - rsync
#  - screen
#  - tmux
#  - vim
#  - wget
#  - build-essential
#  - linux-tools-generic
#  - "{{ 'linux-headers-' + ansible_facts.kernel }}"


################################################################################
# HOST BASELINE                                                                #
################################################################################
# Packages that must not be on a host (roles/host_baseline, playbooks/generic/
# host-baseline.yml): services once installed by hand and no longer used, which nothing
# else would ever remove. A --check run lists what apt would remove with them.
# The controller keeps its database (slurmdbd) and web server (Open OnDemand).
#host_baseline_absent_packages: "{{ ['avahi-daemon', 'iperf3', 'samba', 'mysql-server*']  # example
#  + ([] if inventory_hostname in groups['slurm-master'] | default([]) else ['apache2*']) }}"
# A removal never takes along a package a component records or one of these (it stops
# instead, before anything goes): extend the list for the site's own essentials.
#host_baseline_protected_packages: [apt, dpkg, sudo, systemd, ..., slurm-smd*, munge]  # example
# The site's own leftovers for roles/stale_files (what a person installed by hand and the
# site retired); nothing a package owns is taken.
#stale_files_site_rules:  # example
#  - {name: a hand-copied code-server, type: files, dirs: [/usr/local/bin], pattern: code-server}
# A switch turned off, or a host that left a component's group, removes the component
# (docs/deepops/component-state.md). The driver, authentication, Slurm, MUNGE and the
# NFS server are kept then; name one here to remove it where nothing wants it.
#deepops_component_removals: []

# How long users have to clean up before the cluster removes their data (unused
# container stores, ended scratch allocations, ...): one value for all of them.
#cluster_user_grace_days: 14

################################################################################
# STORAGE                                                                      #
################################################################################
# AutoFS configuration
# Playbook: authentication
#autofs_mount: "/home"  # example
#autofs_map: "auto.home_linux"  # example

# Fast scratch space per request (roles/scratch_alloc, slurm_enable_scratch_alloc, on
# [scratch-server]): docs/slurm-cluster/scratch-alloc.md. The filesystem needs prjquota
# in host_baseline_mount_options.
#scratch_alloc_mount: /scratch
#scratch_alloc_max_size: 20T
#scratch_alloc_max_days: 180
#scratch_alloc_auto_size: 2T
#scratch_alloc_auto_days: 30
#scratch_alloc_auto_extensions: 2

# NFS Server
# This config will create an NFS server and share the given exports. options are the
# exports(5) flags alone; every export is offered to nfs_export_clients.
# Playbook: nfs-server.yml
#nfs_exports:  # example
#  - path: /export/shared
#    options: "rw,sync,root_squash,no_subtree_check"
#nfs_export_clients: "{{ cluster_networks if cluster_networks | length > 0 else ['*'] }}"

# NFS Client
# This config will mount an NFS share on hosts. An entry without `options` is mounted
# with nfs_mount_options (see roles/nfs_client/defaults/main.yml).
# Playbook: nfs-client.yml
#nfs_mounts:  # example
#  - mountpoint: /mnt/shared
#    server: '{{ groups["slurm-master"][0] }}'
#    path: /export/shared

# Ubuntu's own archive from a mirror (roles/package_repos, tasks_from: ubuntu, run by
# playbooks/generic/os-updates.yml): ubuntu.sources points there, trusting the OS's
# archive key. Empty leaves the OS's sources alone. The -security suite comes from the
# same mirror unless package_repos_ubuntu_security_mirror names another.
#package_repos_ubuntu_mirror: ""
#package_repos_ubuntu_mirror: https://mirror.example.org/ubuntu/  # example
#package_repos_ubuntu_security_mirror: "{{ package_repos_ubuntu_mirror }}"
#package_repos_ubuntu_components: [main, restricted, universe, multiverse]

# Extra Packages for Enterprise Linux (roles/package_repos; set for a mirror)
#package_repos_epel_release: "https://dl.fedoraproject.org/pub/epel/epel-release-latest-{{ ansible_facts.distribution_major_version }}.noarch.rpm"
#package_repos_epel_key: "https://dl.fedoraproject.org/pub/epel/RPM-GPG-KEY-EPEL-{{ ansible_facts.distribution_major_version }}"

################################################################################
# PEOPLE                                                                       #
################################################################################
# Users and their access come from one roster, people.yml next to the inventory
# (format and rules: config.example/people.yml). Every per-person list (the admin
# netgroup and local sudo group, compute-node SSH, the Docker group, Slurm
# associations, chat IDs) is derived from it here and in slurm-cluster.yml. Change people.yml, check it, then apply it everywhere:
#   uv run scripts/deepops/people.py check
#   uv run ansible-playbook -K playbooks/slurm-cluster.yml --tags people
# people_check validates the roster wherever it is used.
#people_roster: "{{ lookup('ansible.builtin.file', inventory_dir ~ '/people.yml') | from_yaml | people_check }}"  # example
#people: "{{ people_roster.people }}"  # example
# Administrators: sudo on every node and SSH to compute nodes without a job.
#cluster_admins: "{{ people | people_with_role('admin') }}"  # example
# Service accounts (Slurm, its package builder, EasyBuild, ...) with UIDs and GIDs fixed on
# every host, none of them a person's (roles/system_accounts). Set the whole mapping
# only when this site needs other numbers.
#system_accounts:
#  slurm:
#    uid: 22078
#    home: /local/slurm
#    comment: Slurm
#  slurmbuild:
#    uid: 22079
#    home: "{{ deepops_cache_dir }}/build/slurm-deb"
#    comment: Slurm package builder
#  easybuild:
#    uid: 22080
#    home: /var/lib/easybuild
#    comment: EasyBuild
#  grafana:
#    uid: 472
#    home: /var/lib/grafana
#    comment: Grafana
#  clusterbot:
#    uid: 22081
#    home: /var/lib/clusterbot
#    shell: /bin/sh
#    comment: Cluster bot
#  shareddata:
#    uid: 22082
#    home: /var/lib/shareddata
#    comment: Shared data writer

################################################################################
# NVIDIA                                                                       #
################################################################################
# NVIDIA GPU configuration
# Playbook: nvidia-cuda
# cuda_version picks the package: by default the newest toolkit of the CUDA major the
# driver branch serves; a specific version looks like cuda-toolkit-13-2
#cuda_version: "cuda-toolkit-{{ nvidia_driver_cuda_major }}"
# The system-wide toolkit's switch is slurm_install_cuda (roles/deploy_defaults).

# DGX-specific vars may be used to target specific models,
# because available versions for DGX may differ from the generic repo
#cuda_dgx_1_version: "{{ cuda_version }}"
#cuda_dgx_2_version: "{{ cuda_version }}"
#cuda_dgx_a100_version: "{{ cuda_version }}"

# Playbook: nvidia-set-gpu-clocks (runtime only; GPU nodes)
# Reset the GPU clocks to their defaults (nvidia-smi --reset-gpu-clocks)
#gpu_clock_reset: false
# Lock the GPU clocks to "MIN,MAX" MHz (e.g. "1500,1500"; nvidia-smi --lock-gpu-clocks)
#gpu_clock_lock: ""

# Debugging var: force install NVIDIA driver even if GPU not detected
#nvidia_driver_force_install: false
# NVIDIA driver branch: R580 is a long-term support branch (to mid-2028); the CUDA
# toolkits, DCGM and their modules follow its CUDA major (roles/nvidia_versions).
# Change it with playbooks/utilities/nvidia-driver-switch.yml (one drained node at a time).
#nvidia_driver_branch: "580"
# Kernel module flavor: "open" (NVIDIA default since the 560 series, recommended
# for Turing and newer GPUs) or "proprietary" (Maxwell/Pascal/Volta).
#nvidia_driver_kernel_modules: "open"
# Ubuntu only: use the data-center "Enterprise Ready" (-server) branch. Set false
# for the desktop/latest branch (no -server suffix).
#nvidia_driver_server_branch: true
# Full override of the driver package name. Leave empty ("") to build it from the
# toggles above (e.g. "nvidia-driver-580-server-open"). Set explicitly for any
# other combination, e.g. "nvidia-driver-580" or "nvidia-driver-570-open".
#nvidia_driver_package: ""
# RHEL/Rocky package/stream overrides (empty = build from toggles):
#nvidia_driver_rhel_module_stream: ""
#nvidia_driver_rhel_package: ""
# Purge the NVIDIA packages that are not the target driver's (another branch, kernel
# module flavour or architecture before the install, the other userspace after it).
# Container Toolkit packages are never purged.
#nvidia_driver_purge_existing: true
# Ubuntu archive: the full driver (CUDA, OpenGL/EGL/Vulkan without a display, NVENC/
# NVDEC) on precompiled modules; true installs only CUDA and the tools
# (docs/slurm-cluster/gpu-graphics.md).
#nvidia_driver_headless: false


################################################################################
# CONTAINER RUNTIME                                                            #
################################################################################
# Docker configuration
# Playbook: docker, nvidia-docker, k8s_cluster
#
# docker_install gates the in-tree roles/docker, whose engine release is
# docker_engine_version. docker_version, docker_dns_servers_strict,
# docker_storage_options, docker_options and docker_iptables_enabled are kubespray's,
# read only when kubespray itself installs Docker.
#docker_install: true
#docker_version: '28.3'
#docker_dns_servers_strict: false
docker_storage_options: -s overlay2
#docker_options: "--bip=192.168.99.1/24"  # example
# Options of the logging driver (daemon.json log-opts); empty keeps the driver's own.
#docker_log_opts: {}
# Unit files or drop-ins for docker.service something else wrote (kubespray's full unit
# copy, its docker-options.conf passing DOCKER_OPTS): backed up and removed, so the
# package's unit and daemon.json decide. Move their flags into these settings first; a
# flag daemon.json also sets stops the deploy, naming the file.
#docker_retired_unit_files:  # example
#  - /etc/systemd/system/docker.service
#  - /etc/systemd/system/docker.service.d/docker-options.conf
# Enable docker iptables
# If this isn't set, containers won't have access to the outside net
# See https://github.com/kubernetes-sigs/kubespray/issues/2002
docker_iptables_enabled: true

# Daemon-wide options merged into /etc/docker/daemon.json (roles/docker), for the
# keys nvidia_container_toolkit and docker_socket_group do not already own.
#
# The usual reason to set this is the bridge-network address pool. Docker's built-in
# default is roughly 32 networks and every compose project claims one, so a host
# running many stacks at once fails with "all predefined address pools have been
# fully subnetted" long before it runs out of CPU or memory. A pool yields
# 2^(size - base prefix) networks: a /16 split at size 24 gives 256 of them with 254
# usable addresses each, and the same /16 at size 26 gives 1024 with 62 each.
#
# Pick the base from this site's own addressing plan. It must not overlap anything
# the host routes, and the role checks it against the live routing table and fails
# rather than write a colliding pool. Changing this restarts docker, which stops every
# running container on the node -- set docker_daemon_restart to false to stage
# the file for a maintenance window instead.
#docker_daemon_options:  # example
#  default-address-pools:
#    - base: "10.99.0.0/16"
#      size: 24

# Kernel ceilings a container host reaches before it runs out of CPU or memory:
# inotify instances per UID, and the three ARP table thresholds (all three have to
# move together). roles/docker raises these by default at values sized for a few
# hundred concurrent containers; the values below carry about a thousand.
#docker_sysctls:  # example
#  fs.inotify.max_user_instances: "8192"
#  net.ipv4.neigh.default.gc_thresh1: "4096"
#  net.ipv4.neigh.default.gc_thresh2: "8192"
#  net.ipv4.neigh.default.gc_thresh3: "16384"

# Cluster-wide group granting access to the Docker daemon socket.
# Playbook: slurm-cluster (container/docker-socket-group.yml), authentication
#
# Defined ONCE here because two places must agree on it exactly: the directory
# publishes it (directory_groups in AUTH below) and every node chowns /run/docker.sock
# to it (docker_socket_group in group_vars/slurm-cluster.yml).
#
# The package-default `docker` group cannot do this job. Slurm resolves a job's
# supplementary groups on the submit/controller node and ships the resulting NUMERIC
# GIDs into the job (send_gids, on by default since 20.11); the compute node renders
# those numbers through its own group database. `docker` gets a distro-assigned
# system GID that differs per node, in the OS's own range no directory publishes -- so
# the number that arrives means a different group on the compute node. Pick a GID of
# 1000 or more that no person's UID takes and is free on EVERY node, then verify before
# enabling:
#   for h in <all nodes>; do ssh $h "getent group <gid> || echo $h free"; done
#cluster_docker_group_name: dockerusers  # example
#cluster_docker_group_gid: 4000  # example

# Netgroup whose members get administrator sudo on every node.
# Playbook: slurm-cluster (generic/cluster-sudoers.yml), authentication
#
# A group cannot do this job. Slurm ships the numeric gid list resolved on the submit
# node into jobs (send_gids) while a direct SSH login resolves groups on the node, so
# `sudo` group membership gives two different answers depending on how you arrived --
# and `sudo` is gid 27, in the OS's own range, which no directory publishes. A netgroup
# is matched by NAME through innetgr(3), so neither problem applies. The members are
# cluster_admins (PEOPLE above), published by directory_netgroups in AUTH below.
#
# BEFORE ENABLING: confirm a LOCAL account exists that is in the local sudo group and
# has a local password, on every node. That is the break-glass path if the directory
# becomes unreachable; the stock `%sudo` rule is deliberately left in place for it.
# cluster_sudoers_local_group keeps that local group to exactly the administrators
# who have a local account on each node.
#cluster_sudoers_netgroup: cluster_admins  # example
# Require a password for sudo (the role default). Set true ONLY where a password
# cannot be checked at all -- confirm by behaviour with `sudo -v` on a compute node as
# the user, rather than by reasoning about which file holds the hash.
#cluster_sudoers_nopasswd: false
# Local sudo group and the administrators it is kept to.
#cluster_sudoers_local_group: sudo  # example
#cluster_sudoers_local_members: "{{ cluster_admins }}"  # example
# Remove sudoers drop-ins this role did not write. They are always reported; set this
# to actually delete them. bootstrap-sudo.yml (run by hand on a new node only) leaves
# one behind for whoever ran it, granting passwordless root that no group audit shows.
#cluster_sudoers_prune: false
# Files no package owns but that must still survive pruning (package-owned drop-ins
# are protected automatically -- ownership is asked of dpkg/rpm). Defaults cover the
# sudo package's README, root's own grant, and cloud-init's default-user grant.
#cluster_sudoers_keep:
#  - README
#  - root
#  - 90-cloud-init-users

# Break-glass root SSH (roles/root_access, playbooks/generic/root-access.yml): root on
# these hosts may SSH in as root everywhere else, and no other key may. Their keys are
# read live from /root/.ssh/*.pub there and pinned to their address with from=: a
# host's root_access_source (host_vars), else its ansible_host; it must be an IP.
#root_access_from_hosts: "{{ groups['slurm-master'][:1] }}"  # example
# Docker daemon logins (root's; keep the passwords in Ansible Vault), each
# {registry, username, password}, e.g. registry nvcr.io, username $oauthtoken. A
# registry dropped from the list is logged out on the next run.
#docker_login_registries: []

# Enroot configuration
# Playbook: slurm, slurm-cluster
#
# See: https://github.com/NVIDIA/pyxis/wiki/Setup#enroot-configuration-example
#
# IMPORTANT: keep enroot RUNTIME/CACHE/DATA on node-LOCAL disk/NVMe, never on NFS.
# Image import/unpack is heavy small-file random I/O; on NFS it crushes a single NFS
# head. The enroot ROLE sets local defaults (/run/enroot, /var/lib/enroot-cache,
# /tmp/enroot-data) AND provisions their sticky-1777 parents via tmpfiles.d so users
# can run enroot from the CLI and under Slurm without "permission denied". Uncomment
# below ONLY to override -- e.g. to put cache/data on a mounted NVMe (still local!).
# See docs/slurm-cluster/slurm-nfs.md.
#enroot_data_path: '/mnt/nvme/enroot-data/user-$(id -u)'  # example
#enroot_cache_path: '/mnt/nvme/enroot-cache/user-$(id -u)'  # example
#enroot_environ_config_files: '{{ enroot_environ_config_files_dgx if ansible_facts.product_name | default('''') is search(''DGX'') else [] }}'
#enroot_environ_config_files_dgx:
#  - filename: 50-mellanox.env
#    content: |
#      MELLANOX_VISIBLE_DEVICES=all
#  - filename: 50-mpi.env
#    content: |
#      OMPI_MCA_btl_tcp_if_exclude=lo,docker0,ib0,ib1,ib2,ib3

################################################################################
# AUTH                                                                         #
################################################################################
# Accounts come from one directory: NIS or the cluster's LDAP directory (OpenLDAP on
# the [ldap-server] host, SSSD on every node), both filled from the PEOPLE roster.
# Playbook: authentication (also runs inside slurm-cluster.yml). docs/deepops/accounts.md
# has the layout and the move from NIS to LDAP.
#
# Which directory each host reads accounts from: nis, ldap or none. The default is nis
# when nis_domain and nis_server are set, else none. Moving to LDAP: set it to ldap in
# one node's host_vars first, then here.
#directory_service: "{{ 'nis' if nis_domain | length > 0 and nis_server | length > 0 else 'none' }}"
#
# NIS: the domain, and the master clients bind to (the [nis-master] host serves it;
# group_vars/nis-master.yml).
#nis_domain: example.com  # example
#nis_server: 10.0.0.1  # example
#
# LDAP: the tree's suffix; set, the [ldap-server] host serves it
# (group_vars/ldap-server.yml).
#ldap_suffix: dc=example,dc=internal  # example
# The names the server's certificate carries; clients use the first. Default: its
# inventory name.
#ldap_server_names: ["{{ ldap_server_host }}"]
# Read-only accounts that search the directory: sssd, and dex while the Open OnDemand
# portal is on. Their passwords are files under ldap_secrets_dir, made (vaulted) when
# missing.
#ldap_readers: "{{ ['sssd'] + (['dex'] if slurm_install_open_ondemand | bool else []) }}"
#ldap_secrets_dir: "{{ inventory_dir }}/files/ldap"
#
# Groups every directory publishes under one GID on every node. Anything that has to
# mean the same inside a Slurm job belongs here: Slurm ships NUMERIC GIDs into jobs
# (send_gids), so a node-local group with a per-node GID silently grants a DIFFERENT
# group on the compute node instead of failing. GIDs are 1000 or more and no person's
# UID. Membership comes from the people roster and is the whole membership: taking the
# role away there revokes it on the next run (directory_groups_exclusive: false makes
# the list additive, for a group other tooling also fills).
#directory_groups:  # example
#  - name: "{{ cluster_docker_group_name }}"
#    gid: "{{ cluster_docker_group_gid }}"
#    members: "{{ people | people_with_role('docker') }}"
#directory_groups_exclusive: true
#
# Collaboration folders (roles/shared_space): <shared space>/projects/<name>, one group
# each, named as the project, published with the groups above. The lead asks for member
# changes; files count to their writer's quota.
#shared_projects: {}
#shared_projects:  # example
#  vision-benchmark: {gid: 5101, members: [alice, bob], lead: alice, purpose: shared eval set}
#
# Netgroups every directory publishes. Use these, not a group, for anything that must
# give the same answer inside a Slurm job and over a direct SSH login: a netgroup is
# matched by NAME, so neither the numeric GID list Slurm ships into jobs nor the OS's
# GID range applies. Administrator sudo is the main case (cluster_sudoers_netgroup).
#directory_netgroups:  # example
#  - name: "{{ cluster_sudoers_netgroup }}"
#    users: "{{ cluster_admins }}"

# Kerberos configuration
# Playbook: authentication
#kerberos_client_realm_name: "example.com"  # example
#kerberos_client_kdc_hostname: "kerberos"
#kerberos_client_admin_hostname: "kerberos"
#nfs_idmapd_domain: example.com  # example


