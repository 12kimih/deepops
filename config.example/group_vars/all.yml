---
################################################################################
# DeepOps Ansible Config                                                       #
################################################################################
#
# Configuration common to all hosts
# Define per-group or per-host values in the other configuration files
#

################################################################################
# Ansible                                                                      #
################################################################################
# Pin the Python Ansible uses on the managed nodes to the system interpreter, instead
# of letting it auto-discover a per-user Python (e.g. a uv or pip --user install that
# happens to be first on the SSH login's PATH). Keeps module deps in one predictable
# place -- community.docker tasks (registry, monitoring) need requests + docker there.
#ansible_python_interpreter: /usr/bin/python3  # example

################################################################################
# /etc/hosts                                                                   #
################################################################################
# When generating /etc/hosts (the hosts role, run by hosts.yml), prefer an address
# on this internal subnet prefix (e.g. "10.0.") -- useful when nodes have a secondary
# IP on the cluster network and hostnames should resolve to it, not a management/public
# NIC. Unset = use the interface's primary address.
#hosts_internal_subnet_prefix: "10.0."  # example

################################################################################
# PROXY
################################################################################
# Proxy Variables needed for scripts, ansible, etc.
#http_proxy: http://10.0.2.5:3128  # example
#https_proxy: http://10.0.2.5:3128  # example
#no_proxy: localhost,cluster.local,127.0.0.1,::1,10.0.2.10,10.0.2.20,10.0.2.30  # example

#proxy_env:  # example
#  http_proxy: '{{ http_proxy }}'
#  https_proxy: '{{ https_proxy }}'
#  no_proxy: '{{ no_proxy }}'


################################################################################
# NODE USER POLICY                                                             #
################################################################################
# What users may leave running outside a Slurm job (roles/node_user_policy). Lingering
# (loginctl enable-linger) starts a user's services outside any job, so on a compute
# node they escape its cgroup: only the admins keep it, and only root may enable it.
# Crontabs stay open on the login node (jobs there run under the per-user limits) and
# are closed on compute nodes, where they would run outside every job.
#node_user_policy_manage_linger: true  # example
#node_user_policy_linger_users: "{{ cluster_admins }}"  # example
#node_user_policy_cron_users: "{{ none if inventory_hostname in groups['slurm-login'] | default([]) else cluster_admins }}"  # example

################################################################################
# NETWORK                                                                      #
################################################################################
# The cluster's internal network (CIDR): the one place it is written. NFS exports are
# offered to it only (nfs_export_clients, STORAGE below).
#cluster_subnet: "10.0.0.0/16"  # example

# Egress policy (roles/egress_policy, docs/slurm-cluster/egress-policy.md): outside
# the cluster, users reach only web, DNS, NTP and rate-limited SSH; the administrators
# and system accounts are exempt. Switched on by slurm_enable_egress_policy.
#egress_policy_internal_networks: ["{{ cluster_subnet }}"]  # example
#egress_policy_exempt_uids: "{{ people | people_uids('admin') }}"  # example
#egress_policy_ssh_rate: 20/minute
#egress_policy_ssh_burst: 30
#egress_policy_ssh_node_rate: 60/minute
#egress_policy_ssh_node_burst: 120
# Inbound filtering (replaces ufw): the internal networks, plus the SSH port on the
# login node.
#egress_policy_inbound: true  # example
#egress_policy_inbound_tcp_ports: "{{ [cluster_info.ssh_port] if inventory_hostname in groups['slurm-login'] | default([]) else [] }}"  # example
#egress_policy_trusted_interfaces: [tailscale0]  # example

# DNS config
# Playbook: dns-config
#dns_config_servers: [8.8.8.8]  # example
#dns_config_search: [example.com]  # example

# NTP configuration
# Playbook: chrony-client
#chrony_install: true
#chrony_service_state: "started"
#chrony_service_enabled: true
#chrony_timezone: "Etc/UTC"
#chrony_config_server:
#  - 0.pool.ntp.org
#  - 1.pool.ntp.org
#  - 2.pool.ntp.org
#  - 3.pool.ntp.org

# Set hostname based on inventory file
#deepops_set_hostname: true

# Default system locale applied to every node by the locale role (sets LANG=).
#locale_lang: "en_US.UTF-8"

################################################################################
# SOFTWARE                                                                     #
################################################################################
# Extra software to install (removal: HOST BASELINE below)
# Playbook: software
#software_extra_packages:  # example
#  - curl
#  - git
#  - rsync
#  - screen
#  - tmux
#  - vim
#  - wget
#  - build-essential
#  - linux-tools-generic
#  - "{{ 'linux-headers-' + ansible_facts.kernel }}"


################################################################################
# HOST BASELINE                                                                #
################################################################################
# Packages that must not be on a host (roles/host_baseline, playbooks/generic/
# host-baseline.yml): services once installed by hand and no longer used, which nothing
# else would ever remove. A --check run lists what apt would remove with them.
# The controller keeps its database (slurmdbd) and web server (Open OnDemand).
#host_baseline_absent_packages: "{{ ['avahi-daemon', 'iperf3', 'samba', 'mysql-server*']  # example
#  + ([] if inventory_hostname in groups['slurm-master'] | default([]) else ['apache2*']) }}"

################################################################################
# STORAGE                                                                      #
################################################################################
# AutoFS configuration
# Playbook: authentication
#autofs_mount: "/home"  # example
#autofs_map: "auto.home_linux"  # example

# NFS Server
# This config will create an NFS server and share the given exports. options are the
# exports(5) flags alone; every export is offered to nfs_export_clients.
# Playbook: nfs-server.yml
#nfs_exports:  # example
#  - path: /export/shared
#    options: "rw,sync,root_squash,no_subtree_check"
#nfs_export_clients: ["{{ cluster_subnet }}"]  # example

# NFS Client
# This config will mount an NFS share on hosts. An entry without `options` is mounted
# with nfs_mount_options (see roles/nfs/defaults/main.yml).
# Playbook: nfs-client.yml
#nfs_mounts:  # example
#  - mountpoint: /mnt/shared
#    server: '{{ groups["slurm-master"][0] }}'
#    path: /export/shared

# Extra Packages for Enterprise Linux (roles/package_repos; set for a mirror)
#package_repos_epel_release: "https://dl.fedoraproject.org/pub/epel/epel-release-latest-{{ ansible_facts.distribution_major_version }}.noarch.rpm"
#package_repos_epel_key: "https://dl.fedoraproject.org/pub/epel/RPM-GPG-KEY-EPEL-{{ ansible_facts.distribution_major_version }}"

################################################################################
# PEOPLE                                                                       #
################################################################################
# Users and their access come from one roster, people.yml next to the inventory
# (format and rules: config.example/people.yml). Every per-person list (the admin
# netgroup and local sudo group, compute-node SSH, the Docker group, Slurm
# associations, chat IDs) is derived from it here, in nis-master.yml and in
# slurm-cluster.yml. Change people.yml, check it, then apply it everywhere:
#   uv run scripts/deepops/people.py check
#   uv run ansible-playbook -K playbooks/slurm-cluster.yml --tags people
# people_check validates the roster wherever it is used.
#people_roster: "{{ lookup('ansible.builtin.file', inventory_dir ~ '/people.yml') | from_yaml | people_check }}"  # example
#people: "{{ people_roster.people }}"  # example
# Administrators: sudo on every node and SSH to compute nodes without a job.
#cluster_admins: "{{ people | people_with_role('admin') }}"  # example

################################################################################
# NVIDIA                                                                       #
################################################################################
# NVIDIA GPU configuration
# Playbook: nvidia-cuda
# cuda_version picks the package: by default the newest toolkit of the CUDA major the
# driver branch serves; a specific version looks like cuda-toolkit-13-2
#cuda_version: "cuda-toolkit-{{ nvidia_driver_cuda_major }}"
# Set true to install the system-wide CUDA toolkit; leave false when CUDA is provided
# per-version through Lmod/environment modules.
#nvidia_cuda_install: false

# DGX-specific vars may be used to target specific models,
# because available versions for DGX may differ from the generic repo
#cuda_dgx_1_version: "{{ cuda_version }}"
#cuda_dgx_2_version: "{{ cuda_version }}"
#cuda_dgx_a100_version: "{{ cuda_version }}"

# Playbook: nvidia-set-gpu-clocks
# Resets the Gpu clocks to the default values. (see the `--reset-gpu-clocks` flag in nvidia-smi for more)
#gpu_clock_reset: false
# Specifies <minGpuClock,maxGpuClock> clocks as a pair (e.g. 1500,1500) that defines the range of desired locked GPU clock speed in MHz. Setting this will supersede application clocks and take effect regardless if an app is running. Input can also be a singular desired clock value. (see the `--lock-gpu-clocks` flag in nvidia-smi for more)
gpu_clock_lock: "1507,1507"

# Debugging var: force install NVIDIA driver even if GPU not detected
#nvidia_driver_force_install: false
# NVIDIA driver branch: R580 is a long-term support branch (to mid-2028); the CUDA
# toolkits, DCGM and their modules follow its CUDA major (roles/nvidia_versions).
# Change it with playbooks/utilities/nvidia-driver-switch.yml (one drained node at a time).
#nvidia_driver_branch: "580"
# Kernel module flavor: "open" (NVIDIA default since the 560 series, recommended
# for Turing and newer GPUs) or "proprietary" (Maxwell/Pascal/Volta).
#nvidia_driver_kernel_modules: "open"
# Ubuntu only: use the data-center "Enterprise Ready" (-server) branch. Set false
# for the desktop/latest branch (no -server suffix).
#nvidia_driver_server_branch: true
# Full override of the driver package name. Leave empty ("") to build it from the
# toggles above (e.g. "nvidia-driver-580-server-open"). Set explicitly for any
# other combination, e.g. "nvidia-driver-580" or "nvidia-driver-570-open".
#nvidia_driver_package: ""
# RHEL/Rocky package/stream overrides (empty = build from toggles):
#nvidia_driver_rhel_module_stream: ""
#nvidia_driver_rhel_package: ""
# Purge any pre-existing NVIDIA driver packages before installing (clean
# reinstall). Container Toolkit packages are excluded from the purge.
#nvidia_driver_purge_existing: true


################################################################################
# CONTAINER RUNTIME                                                            #
################################################################################
# Docker configuration
# Playbook: docker, nvidia-docker, k8s_cluster
#
# docker_install gates the in-tree roles/docker, whose engine release is
# docker_engine_version. docker_version, docker_dns_servers_strict,
# docker_storage_options, docker_options and docker_iptables_enabled are kubespray's,
# read only when kubespray itself installs Docker.
#docker_install: true
#docker_version: '28.3'
#docker_dns_servers_strict: false
docker_storage_options: -s overlay2
#docker_options: "--bip=192.168.99.1/24"  # example
# Enable docker iptables
# If this isn't set, containers won't have access to the outside net
# See https://github.com/kubernetes-sigs/kubespray/issues/2002
docker_iptables_enabled: true

# Daemon-wide options merged into /etc/docker/daemon.json (roles/docker), for the
# keys nvidia_container_toolkit and docker_socket_group do not already own.
#
# The usual reason to set this is the bridge-network address pool. Docker's built-in
# default is roughly 32 networks and every compose project claims one, so a host
# running many stacks at once fails with "all predefined address pools have been
# fully subnetted" long before it runs out of CPU or memory. A pool yields
# 2^(size - base prefix) networks: a /16 split at size 24 gives 256 of them with 254
# usable addresses each, and the same /16 at size 26 gives 1024 with 62 each.
#
# Pick the base from this site's own addressing plan. It must not overlap anything
# the host routes, and the role checks it against the live routing table and fails
# rather than write a colliding pool. Changing this restarts docker, which stops every
# running container on the node -- set docker_daemon_restart to false to stage
# the file for a maintenance window instead.
#docker_daemon_options:  # example
#  default-address-pools:
#    - base: "10.99.0.0/16"
#      size: 24

# Kernel ceilings a container host reaches before it runs out of CPU or memory:
# inotify instances per UID, and the three ARP table thresholds (all three have to
# move together). roles/docker raises these by default at values sized for a few
# hundred concurrent containers; the values below carry about a thousand.
#docker_sysctls:  # example
#  fs.inotify.max_user_instances: "8192"
#  net.ipv4.neigh.default.gc_thresh1: "4096"
#  net.ipv4.neigh.default.gc_thresh2: "8192"
#  net.ipv4.neigh.default.gc_thresh3: "16384"

# Cluster-wide group granting access to the Docker daemon socket.
# Playbook: slurm-cluster (container/docker-socket-group.yml), authentication
#
# Defined ONCE here because two places must agree on it exactly: the NIS master
# publishes it (nis_export_groups in group_vars/nis-master.yml) and every node chowns
# /run/docker.sock to it (docker_socket_group in group_vars/slurm-cluster.yml).
#
# The package-default `docker` group cannot do this job. Slurm resolves a job's
# supplementary groups on the submit/controller node and ships the resulting NUMERIC
# GIDs into the job (send_gids, on by default since 20.11); the compute node renders
# those numbers through its own group database. `docker` gets a distro-assigned
# system GID that differs per node, and system GIDs are below GID_MIN so /var/yp/Makefile
# never exports them -- so the number that arrives means a different group on the
# compute node. Pick a GID that is >= GID_MIN (so NIS exports it) and free on EVERY
# node, then verify before enabling:
#   for h in <all nodes>; do ssh $h "getent group <gid> || echo $h free"; done
#cluster_docker_group_name: dockerusers  # example
#cluster_docker_group_gid: 4000  # example

# NIS netgroup whose members get administrator sudo on every node.
# Playbook: slurm-cluster (generic/cluster-sudoers.yml), authentication
#
# A group cannot do this job. Slurm ships the numeric gid list resolved on the submit
# node into jobs (send_gids) while a direct SSH login resolves groups on the node, so
# `sudo` group membership gives two different answers depending on how you arrived --
# and `sudo` is gid 27, below GID_MIN, so NIS cannot make the number consistent
# either. A netgroup is matched by NAME through innetgr(3), so neither problem
# applies. The members are cluster_admins (PEOPLE above), published by
# nis_export_netgroups in group_vars/nis-master.yml.
#
# BEFORE ENABLING: confirm a LOCAL account exists that is in the local sudo group and
# has a local password, on every node. That is the break-glass path if NIS becomes
# unreachable; the stock `%sudo` rule is deliberately left in place for it.
# cluster_sudoers_local_group keeps that local group to exactly the administrators
# who have a local account on each node.
#cluster_sudoers_netgroup: cluster_admins  # example
# Require a password for sudo (the role default). Set true ONLY where a password
# cannot be checked at all -- confirm by behaviour with `sudo -v` on a compute node as
# the user, rather than by reasoning about which file holds the hash.
#cluster_sudoers_nopasswd: false
# Local sudo group and the administrators it is kept to.
#cluster_sudoers_local_group: sudo  # example
#cluster_sudoers_local_members: "{{ cluster_admins }}"  # example
# Remove sudoers drop-ins this role did not write. They are always reported; set this
# to actually delete them. bootstrap-sudo.yml (run by hand on a new node only) leaves
# one behind for whoever ran it, granting passwordless root that no group audit shows.
#cluster_sudoers_prune: false
# Files no package owns but that must still survive pruning (package-owned drop-ins
# are protected automatically -- ownership is asked of dpkg/rpm). Defaults cover the
# sudo package's README, root's own grant, and cloud-init's default-user grant.
#cluster_sudoers_keep:
#  - README
#  - root
#  - 90-cloud-init-users

# Break-glass root SSH (roles/root_access, playbooks/generic/root-access.yml): root on
# these hosts may SSH in as root everywhere else, and no other key may. Their keys are
# read live from /root/.ssh/*.pub there and pinned to their address with from=: a
# host's root_access_source (host_vars), else its ansible_host; it must be an IP.
#root_access_from_hosts: "{{ groups['slurm-master'][:1] }}"  # example
# Docker daemon logins
#   Note: example only! you should put these in an Ansible Vault file for security!
#
#docker_login_registries:  # example
#- registry: docker.io
#  username: myuser
#  password: mypassword
#- registry: nvcr.io
#  username: '$oauthtoken'
#  password: mypassword

# Enroot configuration
# Playbook: slurm, slurm-cluster
#
# See: https://github.com/NVIDIA/pyxis/wiki/Setup#enroot-configuration-example
#
# IMPORTANT: keep enroot RUNTIME/CACHE/DATA on node-LOCAL disk/NVMe, never on NFS.
# Image import/unpack is heavy small-file random I/O; on NFS it crushes a single NFS
# head. The enroot ROLE sets local defaults (/run/enroot, /var/lib/enroot-cache,
# /tmp/enroot-data) AND provisions their sticky-1777 parents via tmpfiles.d so users
# can run enroot from the CLI and under Slurm without "permission denied". Uncomment
# below ONLY to override -- e.g. to put cache/data on a mounted NVMe (still local!).
# See docs/slurm-cluster/slurm-nfs.md.
#enroot_data_path: '/mnt/nvme/enroot-data/user-$(id -u)'  # example
#enroot_cache_path: '/mnt/nvme/enroot-cache/user-$(id -u)'  # example
#enroot_environ_config_files: '{{ enroot_environ_config_files_dgx if ansible_facts.product_name | default('''') is search(''DGX'') else [] }}'
#enroot_environ_config_files_dgx:
#  - filename: 50-mellanox.env
#    content: |
#      MELLANOX_VISIBLE_DEVICES=all
#  - filename: 50-mpi.env
#    content: |
#      OMPI_MCA_btl_tcp_if_exclude=lo,docker0,ib0,ib1,ib2,ib3

################################################################################
# AUTH                                                                         #
################################################################################
# NIS configuration
# Playbook: authentication (also runs inside slurm-cluster.yml)
# CLIENTS: set nis_domain + nis_server (the master's hostname/IP) to bind nodes to NIS.
#nis_domain: example.com  # example
#nis_server: 10.0.0.1  # example
# MASTER SERVER (ypserv): configure it in group_vars/nis-master.yml (a one-host
# [nis-master] inventory group). See that file.

# Kerberos configuration
# Playbook: authentication
#kerberos_client_realm_name: "example.com"  # example
#kerberos_client_kdc_hostname: "kerberos"
#kerberos_client_admin_hostname: "kerberos"
#nfs_idmapd_domain: example.com  # example


################################################################################
# MAAS                                                                         #
################################################################################
# MAAS (Metal as a Service): Node provisioning/PXE service
# Playbook: provisioning/maas.yml
maas_adminusers:
  - username: 'admin'
    email: 'admin@{{ maas_dns_domain }}'
    password: 'admin'
maas_dns_domain: 'deepops.local'
maas_region_controller: '192.168.1.1'
maas_region_controller_url: 'http://{{ maas_region_controller }}:5240/MAAS'
# MAAS 3.7 is the current Ubuntu 24.04 line. Keep the 3.5 PPA when the MAAS
# controller itself still runs Ubuntu 22.04.
#maas_repo: "{{ 'ppa:maas/3.7' if ansible_facts.distribution_version is version('24.04', '>=') else 'ppa:maas/3.5' }}"

#maas_single_node_install: true

################################################################################
# NVIDIA Datacenter GPU Manager                                                #
################################################################################
#install_dcgm: true

################################################################################
# Misc.                                                                        #
################################################################################
# Set /etc/rc.local contents
# Playbook: rc-local
#rc_local_contents: |  # example
#  echo foo
#  echo bar
#
# DeepOps specific config
#deepops_dir: /opt/deepops

# Disable cloud-init
#deepops_disable_cloud_init: true

# Default profile when using NVIDIA MIG Manager: https://github.com/NVIDIA/mig-parted
#mig_manager_profile: all-disabled
#mig_manager_config_src: "{{ inventory_dir }}/nvidia-mig-config.yml"
#mig_manager_config: /etc/nvidia-mig-manager/config.yml
# The hooks file; the package's keeps the layout across reboots (roles/deploy_defaults).
#mig_manager_hooks: /etc/nvidia-mig-manager/hooks.yaml

################################################################################
# Node networking                                                              #
################################################################################
# netplan_config is per-host and belongs in host_vars; an empty one leaves the
# host's networking alone. netplan_conflicting_manager names the manager to mask
# so it cannot compete with the renderer. See docs/deepops/netplan.md.
#netplan_file: /etc/netplan/01-netcfg.yaml
#netplan_conflicting_manager: NetworkManager  # example

################################################################################
# Serial console                                                               #
################################################################################
# Puts the console on the BMC's serial-over-LAN so a node that stops before the
# network is up can still be driven remotely. Which port SOL is wired to is a
# BIOS setting: confirm by attaching during a boot. Takes effect at the next one.
#serial_console_port: ttyS1
#serial_console_speed: 115200
#serial_console_grub_timeout: 5

################################################################################
# BMC / IPMI                                                                   #
################################################################################
# Out-of-band management. The bmc role configures each host's own BMC over the
# in-band KCS interface, so the factory password is never needed to get started.
# bmc_ipaddr is per-host and belongs in host_vars. See docs/deepops/bmc.md.
#bmc_channel: 1
#bmc_user_name: ADMIN
#bmc_ipsrc: static
#bmc_netmask: 255.255.255.0  # example
#bmc_gateway: 10.0.0.1  # example
# Vault it: ansible-vault encrypt_string 'secret' --name bmc_password
# Same, for the SNMP community: v1/v2c sends it in clear and the shipped default is
# the first thing a scanner tries. Empty leaves it alone.
#bmc_snmp_community: ""
#bmc_password: ""

################################################################################
# Container registry                                                           #
################################################################################
standalone_container_registry_cache_enable: true
#standalone_container_registry_port: "5000"

# To configure some set of hosts as insecure registries, list them here.
# Slurm and K8s cluster playbooks will automatically use the master nodes for
# these if not specified.
#docker_insecure_registries: ["<host>:<port>"]  # example
#docker_registry_mirrors: ["http://<host>:<port>"]  # example

################################################################################
# Configuration for NGC-Ready playbook                                         #
################################################################################
#ngc_ready_cuda_container: "nvcr.io/nvidia/cuda:13.2.1-base-ubuntu24.04"
#ngc_ready_pytorch_container: "nvcr.io/nvidia/pytorch:26.05-py3"
#ngc_ready_tensorflow_container: "nvcr.io/nvidia/tensorflow:25.02-tf2-py3"

################################################################################
# Kubespray runtime defaults                                                   #
################################################################################
# Surface a few kubespray vars explicitly to avoid undefined-variable runtime
# errors on some kubespray releases. These are the standard defaults; override
# in your config/ if your cluster differs.
dns_domain: cluster.local
#is_fedora_coreos: false
etcd_deployment_type: kubeadm
