---
# Variables for the login nodes -- the hosts in [slurm-login].

# Per-user resource limits, applied to every login session through systemd's
# user-.slice (roles/cluster_tools). Keeps one user's editor, notebook or stray build
# from taking the whole login node; real work belongs in a Slurm job. Nodes outside
# this group have the drop-in removed. Keys are [Slice] directives -- see
# systemd.resource-control(5).
#cluster_tools_user_slice_limits:  # example
#  CPUQuota: "1200%"   # 12 cores
#  MemoryMax: 64G
#  TasksMax: 4096

# Per-user disk quotas on the login nodes' local disks (roles/disk_quota; switch
# slurm_enable_disk_quota): everyone in the roster, administrators too (their own
# accounts; sudo is root's), never root or the system accounts. {} only counts, for the
# disk_quota_* metrics to show how the space is used before you choose limits; a
# person's disk_quota in people.yml overrides these. The filesystem needs its quota
# mount options in host_baseline_mount_options (the role stops, naming them, without):
#host_baseline_mount_options: {"/": "defaults,noatime,errors=remount-ro,usrjquota=aquota.user,jqfmt=vfsv1"}  # example
#disk_quota_filesystems: {"/": {}}
#disk_quota_filesystems:  # example
#  /: {block_warn: 10G, block_hard: 20G, inode_warn: 200k, inode_hard: 500k}
#disk_quota_projects: {}
#disk_quota_projects:  # example
#  /home/shared/datasets: {id: 101, block_warn: 15T, block_hard: 20T}
