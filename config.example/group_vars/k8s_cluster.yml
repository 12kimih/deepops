---
ansible_become: true
#kube_api_anonymous_auth: true
kube_kubeadm_apiserver_extra_args:
  service-account-issuer: "kubernetes.default.svc"
  service-account-signing-key-file: "/etc/kubernetes/ssl/sa.key"
# Set to false due to kubespray bug: https://github.com/kubernetes-sigs/kubespray/issues/5059
#kubectl_localhost: false
kubeconfig_localhost: true
helm_enabled: true

## Container runtime
## docker for docker, crio for cri-o and containerd for containerd.
#container_manager: containerd

artifacts_dir: "{{ inventory_dir }}/artifacts"

# Point the kubelet's FlexVolume plugin directory at the upstream default path (Kubespray
# passes --volume-plugin-dir only when this is set). Older Rook releases looked for their
# FlexVolume driver there.
# see: https://github.com/kubernetes/community/blob/master/contributors/devel/sig-storage/flexvolume.md
#kubelet_flexvolumes_plugins_dir: /usr/libexec/kubernetes/kubelet-plugins/volume/exec

# Provide option to use GPU Operator instead of setting up NVIDIA driver and
# Docker configuration.
#deepops_gpu_operator_enabled: true

# Install the NVIDIA driver and Container Toolkit on the node (true), not as part of GPU Operator (driver container, nvidia-toolkit) (false)
#gpu_operator_preinstalled_nvidia_software: true

# Set the MIG labeling and use strategy to none, single, or mixed. See https://github.com/NVIDIA/k8s-device-plugin
#k8s_gpu_mig_strategy: "mixed"

# Kubernetes Dashboard is not included in the pinned Kubespray release.
# See docs/k8s-cluster/README.md for separate installation guidance.
# Ensure hosts file generation only runs across k8s cluster
hosts_add_ansible_managed_hosts_groups: ["k8s_cluster"]

# NFS Client Provisioner
# Playbook: nfs-client-provisioner.yml
# This convenience default creates a non-HA NFS export on the first control-plane
# node. For production clusters, point this at site-owned storage or disable it.
#k8s_nfs_client_provisioner: true
#k8s_deploy_nfs_server: true
#k8s_nfs_mkdir: true # Set to false if an export dir is already configured with proper permissions
k8s_nfs_server: '{{ groups["kube_control_plane"][0] }}'
#k8s_nfs_export_path: '/export/deepops_nfs'

# NFS Server
# This config will create an NFS server and share the given exports
# Playbooks: nfs-client-provisioner.yml, generic/nfs-server.yml
nfs_exports:
  - path: '{{ k8s_nfs_export_path }}'
    # no_root_squash: the NFS provisioner creates and chowns volume directories as root.
    options: "rw,sync,no_root_squash,no_subtree_check"

################################################################################
# Container registry                                                           #
################################################################################
#kube_enable_container_registry: false
docker_insecure_registries: "{{ groups['kube_control_plane'] | map('regex_replace', '^(.*)$', '\\1:5000') | list + ['registry.local:31500'] }}"
crio_insecure_registries: "{{ groups['kube_control_plane'] | map('regex_replace', '^(.*)$', '\\1:5000') | list + ['registry.local:31500'] }}"
docker_registry_mirrors: "{{ groups['kube_control_plane'] | map('regex_replace', '^(.*)$', 'http://\\1:5000') | list }}"
# containerd (Kubespray's default runtime) reaches the in-cluster registry over plain
# HTTP. This list replaces Kubespray's default, so its docker.io entry is kept.
containerd_registries_mirrors:
  - prefix: docker.io
    mirrors:
      - host: https://registry-1.docker.io
        capabilities: ["pull", "resolve"]
        skip_verify: false
  - prefix: registry.local:31500
    mirrors:
      - host: http://registry.local:31500
        capabilities: ["pull", "resolve"]
        skip_verify: true

# Use overlayfs snapshotter (kubespray default, works on ext4/xfs).
# The previous "native" workaround for cri-tools #436/#710 is no longer needed.
#containerd_snapshotter: "overlayfs"

# Pull images with crictl rather than Kubespray's containerd default, nerdctl
# (work-around for https://github.com/kubernetes-sigs/kubespray/issues/8529)
image_command_tool: "crictl"

# Kubespray's volume snapshot CRDs and controller, matched to its Kubernetes. CSI drivers
# that take snapshots need them (roles/netapp-trident checks for them).
#csi_snapshot_controller_enabled: false

# NVIDIA Network Operator (playbooks/k8s-cluster/nvidia-network-operator.yaml): SR-IOV
# virtual functions of these physical functions for pods. Defaults and the rest of its
# settings: roles/nvidia-network-operator/defaults/main.yml.
#nvidia_network_operator_interfaces: []
#nvidia_network_operator_interfaces:  # example
#  - if_name: ibp12s0
#    pf_name: ibp12s0
#    res_name: resibp12s0
#    ip_addr: 192.168.101.0/24
#nvidia_network_operator_num_vf: 8
#nvidia_network_operator_link_type: ib

################################################################################
# Logging with rsyslog                                                         #
################################################################################
#kube_enable_rsyslog_server: true
#kube_enable_rsyslog_client: true
# Crashes to systemd-coredump, cores only within ulimit -c (roles/coredump)
#kube_enable_coredump: true
# The server is kube_control_plane[0]; the clients are [k8s_cluster].
rsyslog_client_tcp_host: "{{ groups['kube_control_plane'][0] }}"

################################################################################
# Run:ai / KAI Scheduler (optional, off by default)                            #
################################################################################
# Playbook: playbooks/k8s-cluster/runai.yml   Docs: docs/k8s-cluster/runai.md
# Check:    python3 scripts/validation/validate_runai.py --json
#
#   off       do nothing (default)
#   kai       KAI Scheduler: queues, gang scheduling, fractional GPU requests
#   platform  Run:ai control plane + cluster, same Kubernetes cluster (experimental)
# The modes exclude each other: the platform's cluster chart ships its own KAI.
#runai_mode: "off"

# Hard GPU-memory limits for fractional pods (kai mode). Needs a GPU Operator and a
# driver at runai_gpu_operator_min_version and runai_gpu_fractioning_min_driver_major
# or newer, which you must set up first; DeepOps's default driver is not changed. Leave false unless you need enforced memory limits.
#runai_kai_gpu_fractioning: false

# Platform mode only. Keep the admin login in an Ansible vault.
#runai_platform_domain: "runai.example.com"  # example
#runai_platform_admin_user: "admin@example.com"
#runai_platform_admin_password: "{{ vault_runai_admin_password }}"  # example
# Lab without DNS: let the role add the hosts entry and a cluster DNS rewrite.
#runai_platform_manage_hosts_entry: true  # example
#runai_platform_coredns_rewrite: true  # example
# How the control plane is reached: ingress (HAProxy, default) or gateway (Kubernetes
# Gateway API with KGateway). With ingress and a LoadBalancer service the role waits for
# the external address (deploy a load balancer first: scripts/k8s/deploy_loadbalancer.sh).
#runai_platform_exposure: ingress
#runai_platform_ingress_service_type: LoadBalancer   # or NodePort
#runai_gateway_workload_routing: path               # gateway only: path or host
