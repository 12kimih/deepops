---
################################################################################
# Slurm                                                                        #
################################################################################
# Slurm job scheduler configuration
# Playbook: slurm, slurm-cluster, slurm-validation; changing slurm_version on a running
# cluster: slurm-upgrade.yml (docs/slurm-cluster/slurm-upgrade.md)
#slurm_version: 26.05.6
#slurm_manage_gpus: true
# ClusterName. Renaming a running cluster is its own playbook (slurm-cluster-rename.yml).
#slurm_cluster_name: my-cluster  # example
#slurm_username: slurm
#slurm_munge_key_file: "{{ inventory_dir }}/files/munge/munge.key"
#slurm_db_username: slurm
#slurm_db_password: AlsoReplaceWithASecurePasswordInTheVault
#slurm_max_job_timelimit: UNLIMITED  # example
#slurm_default_job_timelimit:  # example

# Slurm is installed from SchedMD's Debian packages, built on slurm-master[0] and
# published to a signed apt repository on shared storage that host writes as root.
# The MUNGE key and the repository key pair are files here, created vaulted by the
# first play when missing (roles/site_secrets); commit them.
#slurm_repo_dir: "{{ sm_prefix }}/.slurm-repo"
#slurm_repo_signing_key_file: "{{ inventory_dir }}/files/slurm/repo-signing.key"
#slurm_repo_signing_pubkey_file: "{{ inventory_dir }}/files/slurm/repo-signing.asc"
# The CUDA release whose NVML header the build uses (AutoDetect=nvml): the one the
# driver branch serves.
#slurm_nvml_cuda_version: '{{ nvidia_driver_cuda_release }}'

# Ensure hosts file generation only runs across slurm cluster
hosts_add_ansible_managed_hosts_groups: ["slurm-cluster"]

# Enable Slurm high-availability mode
# NOTE: The location for Slurm saved state needs to reside in a location shared by all Slurm controller nodes
#       Ideally this is on external NFS server and not the primary control node, since its failure
#       would also take down that NFS share
#slurm_enable_ha: false
slurm_ha_state_save_location: "/sw/slurm"

# Slurm's config files from settings (docs/slurm-cluster/slurm-conf.md): Slurm's own keys
# over deepops' defaults (roles/slurm/defaults/main.yml, slurm_conf_defaults and the
# like); null leaves a key out. Every key is checked against Slurm's parameter list.
#slurm_conf: {PriorityType: priority/multifactor, PriorityWeightFairshare: 1000}  # example
#slurm_cgroup_conf: {}
#slurm_gres_conf: {}
#slurm_dbd_conf: {}
# Every node's line beyond what the role measures (host_vars: slurm_node_conf, and the node's
# gres.conf lines in slurm_gres).
#slurm_node_policy: {NodeAddr: "{{ ansible_host }}", CoreSpecCount: 4}  # example
#slurm_partition_defaults: {}
#slurm_partitions: [{PartitionName: gpu, Nodes: "gpu[01-04]", Default: true, DefCpuPerGPU: 8}]  # example
#slurm_health_check_interval: 300
# A site's own complete template instead (the settings above then do not apply to that
# file); playbooks/slurm-cluster/slurm-conf-compare.yml lists how it differs from them.
#slurm_conf_template: "{{ inventory_dir }}/files/slurm/slurm.conf"  # example

# --- Slack (empty = disabled) -------------------------------------------------
# Vault secrets: ansible-vault encrypt_string --prompt --name <var>
# Alertmanager incoming webhook; it posts to the channel chosen when it was created.
#alertmanager_slack_api_url: "https://hooks.slack.com/services/T000/B000/XXXX"  # example
# Dead man's switch: ping URL of an external check (e.g. healthchecks.io) that alerts
# when the always-firing Watchdog alert stops arriving. Alertmanager pings about every
# minute; give the check a 2 minute period (headroom for jitter) and 5 minutes of grace.
#alertmanager_heartbeat_url: ""
# The cluster's Slack workspace (roles/slack_defaults): the one bot token (xoxb-, vault
# it) every feature that posts uses, the channels by purpose (Alertmanager posts to
# admin), and the administrators' user group (slack_admin_group, its @handle, and
# slack_admin_group_id, its S... ID; empty: each run looks it up by the handle), which
# critical alerts and the usage report's and the bot's notices mention.
#slack_bot_token: ""
#slack_channels:
#  status: "#gpu-usage"
#  admin: "#alerts"
#  help: "#help"
#  announce: "#announcements"
# Where the tools' and the cluster bot's DMs to people are logged for the administrators:
# a daily thread, mentioning no one (cluster_tools.slack.dm); "" logs none.
#slack_dm_log_channel: "{{ slack_channels.admin }}"
# The administrators' Slack user group: the @handle people tag in the help channel, and
# its ID (S..., the web client shows it), with which notices for them mention the group.
#slack_admin_group: ""
#slack_admin_group: "@sysadmin"  # example
#slack_admin_group_id: ""
# The cluster bot (roles/cluster_bot, slurm_enable_cluster_bot): the Socket Mode token
# (xapp-, vault it), its one slash command, the Slack app's name in the manifest each
# deploy writes (/etc/cluster-bot/slack-app-manifest.json), and the scopes the app
# keeps for other tools (incoming-webhook for Alertmanager's webhook).
#slack_app_token: ""
#cluster_bot_command: /cluster
#cluster_bot_app_name: cluster-bot
#cluster_bot_extra_scopes: []
# The integrations posting in the bot's channels, by bot_id, each with what it is:
# `cluster-bot tidy` names them in its survey and lists their leftover messages to delete
# by hand (Slack lets the bot delete only its own); its survey names each bot_id.
#cluster_bot_known_integrations: {}
#cluster_bot_known_integrations: {B0123ABCDEF: "the retired alert webhook"}  # example
# What a newcomer needs before the first login (the join reply and the account notice),
# each derived from the setting that holds it (cluster_info, open_ondemand_*).
#cluster_bot_connect:
#  login_host: "{{ cluster_info.login_host | default('') }}"
#  ssh_port: "{{ cluster_info.ssh_port | default(22) }}"
#  portal_url: "{{ open_ondemand_url if slurm_install_open_ondemand else '' }}"
#  dashboard_url: "{{ grafana_root_url }}"
#  docs_url: "{{ cluster_info.docs_url | default('') }}"

# Hourly GPU usage report (one message a day, edited hourly), a weekly summary of
# GPU-hours held and left idle, and a daily disk usage report (roles/slurm_usage_report),
# posted to slack_channels.status, naming people as text; each person is told by DM.
# cancel_after_hours 0 = never. user_map: Slurm user -> Slack member ID (profile > Copy
# member ID) or email; here from the people roster's slack attribute (PEOPLE in all.yml).
# Someone over both repeat_idle thresholds for repeat_weeks weeks running is reported to
# slack_channels.admin with what to do.
#slurm_usage_report_weekly_schedule: "Mon *-*-* 09:00:00"
#slurm_usage_report_repeat_idle_gpu_hours: 50
#slurm_usage_report_repeat_idle_share: 0.5
#slurm_usage_report_repeat_weeks: 2
#slurm_usage_report_cancel_after_hours: 0
#slurm_usage_report_user_map: "{{ slack_members }}"
# The daily disk usage report, from the disk quota metrics (slurm_enable_disk_quota):
# each counted filesystem, its people (every one, in the thread), the projects, and
# everyone past a warn level, told by DM at once, daily at a hard limit, and every
# disk_repeat_days while past the same warn level (0: every day).
#slurm_usage_report_disk_schedule: "*-*-* 09:00:00"
#slurm_usage_report_disk_repeat_days: 7
# The I/O notices: a node whose NFS traffic to a measured export (io_fairness_models)
# stays above io_share of the disk's throughput for io_minutes; the users of its top
# jobs by I/O get a DM ending in io_advice; the day message's hourly line names the node.
#slurm_usage_report_io_share: 0.4
#slurm_usage_report_io_minutes: 15
#slurm_usage_report_io_repeat_hours: 6
#slurm_usage_report_io_advice: "잡이 많이 읽고 쓰는 데이터는 /scratch에 두어 주세요."  # example

# AI coding agents (roles/ai_agent_rules): the site's agent rules file (Markdown
# starting with <!-- cluster-agent-rules -->), installed for Claude Code
# (/etc/claude-code/CLAUDE.md) and Codex (/etc/codex/requirements.toml); users' own
# agent files are not touched. Only the version whose SHA-256 is pinned here installs:
# review a new version, put its hash here and redeploy. Empty = off.
#ai_agent_rules_url: "https://docs.example.org/agents/AGENTS.md"  # example
#ai_agent_rules_sha256: ""

# --- job_submit.lua (optional Lua submit filter) -----------------------------
# Routes GPU jobs by type, stamps the type on every GPU request (typed QoS limits see
# it), sizes GPU jobs from the partition defaults and keeps interactive GPU sessions on a
# team QoS: roles/slurm's template, rendered from slurm_job_submit_policy (its [1] block
# explains each key). https://slurm.schedmd.com/job_submit_plugins.html
#slurm_job_submit_plugins: "lua"  # example
#slurm_job_submit_policy:  # example
#  cpu_partitions: cpu
#  gpu_partitions: {b200: [b200], h100: [h100, h100-short], h200: [h200]}
#  default_gpu_type: b200
#  strict_gpu_type: true
#  force_gpu_partition: true
#  gpu_jobs_use_defaults: true
#  gpus_per_node: [1, 2, 4, 8]
#  gpu_nodes_shared: true
#  interactive_gpu_qos: "^high_"

# --- Backups of the controller (roles/slurm_backup) --------------------------
# Daily: accounting database dump, StateSaveLocation and (where munge_key) the MUNGE
# key, with SHA256SUMS, kept 14 daily / 8 weekly per destination; a monthly restore
# test loads the dump into a scratch database. Use two disks: a local one (root only,
# holds the MUNGE key) and an NFS export, written as `owner` because root_squash maps
# this host's root to nobody there (its directory is made on prepare_host, the server).
# Off, or no destinations: the units, configuration and metrics go; the sets stay.
#slurm_enable_backup: true
#slurm_backup_destinations:  # example
#  - {path: /backup/slurm, munge_key: true}
#  - {path: /scratch/.slurm-backup, owner: slurm, prepare_host: nfs-server-host}

# Weekly DCGM diagnostics on the idle GPU nodes, from the first controller
# (roles/gpu_diag_idle): each idle node is held by a MAINT reservation, diagnosed as a
# job holding all its GPUs and freed; a node failing twice in a row is drained
# ("gpu-diag: <tests>"). Needs DCGM on the nodes (install_dcgm).
#slurm_enable_gpu_diag_idle: true
#gpu_diag_idle_schedule: "Sun *-*-* 04:00:00"
#gpu_diag_idle_drain_on_failure: true

# --- I/O sharing on the NFS server (roles/io_fairness) ----------------------
# iocost shares each mount's disk by cgroup weight with the disk's own measured model:
# run scripts/deepops/io-model.fio on the mount (docs/slurm-cluster/io-fairness.md)
# and paste what scripts/deepops/io_model.py prints. NFS traffic (nfsd, the root
# cgroup) is never throttled; logins on the server wait behind the services and it.
# io_fairness_enable: false writes the numbers with iocost off.
#slurm_enable_io_fairness: false
#io_fairness_models:  # example
#  /home:
#    measured: "2026-01-01T00:00+00:00"
#    command: "sudo fio --output-format=json --output=result.json io-model.fio"
#    model: {rbps: 1000000000, rseqiops: 50000, rrandiops: 1500, wbps: 800000000, wseqiops: 500, wrandiops: 450}
#    qos: {rpct: 95, rlat: 200000, wpct: 95, wlat: 400000, min: 50, max: 150}
#io_fairness_enable: false
#io_fairness_slice_weights: {system.slice: 100, user.slice: 50}
#io_fairness_user_weight: 100

# --- Accounting as code (QoS, accounts, members) ----------------------------
# Declare QoS and the account tree in one file; slurm.yml (tag accounting) applies it
# with sacctmgr, previewable with --check --diff. Who is in which account comes from
# the people roster (slurm_accounting_users below, merged into the file's users).
#slurm_accounting_file: "{{ inventory_dir }}/files/slurm/accounting.yml"  # example
#slurm_accounting_users: "{{ people | people_accounting }}"  # example

# --- Keeping server-specific settings out of git -----------------------------
# The outer deepops repo ignores config/ (.gitignore: /config*/), so site data and
# secrets live ONLY in your copy. Manage it as a separate PRIVATE repo:
#   scripts/setup.sh   (starts config/ from config.example)
#   cd config && git init && git remote add origin git@github.com:yourorg/deepops-config.git
#   ansible-vault encrypt_string --prompt --name slurm_db_password   # vault each secret inline

################################################################################
# Login on compute
################################################################################
# Restrict user SSH access to only allow users with a running job
#slurm_restrict_node_access: true

# List users who should always be able to SSH, even without a running job; here the
# administrators from the people roster (cluster_admins in all.yml).
#slurm_allow_ssh_user: []

# Enable a Slurm compute node to also function as a login node.
# This is needed for the "single node Slurm cluster" configuration.
# See docs/slurm-cluster/slurm-single-node.md
#slurm_login_on_compute: false

# Directories each job sees as its own, removed with the job (Slurm namespace/linux);
# [] turns it off. The base must be node-local disk.
# See docs/slurm-cluster/epilog-job-scoped-cleanup.md
#slurm_job_private_dirs: [/tmp, /var/tmp, /dev/shm]
#slurm_job_private_base: /var/spool/slurmd-private
# The base on an XFS filesystem of its own on every compute node (roles/job_scratch), an
# image preallocated on the root filesystem: a job that fills its /tmp no longer fills
# the OS's disk, and Slurm offers its size to --tmp (each node's TmpDisk). Deploy it
# while the nodes run no jobs; a larger size later grows it in place, never smaller.
#slurm_enable_job_scratch: false
#job_scratch_size: "70%"      # at most, of the root filesystem, or an absolute size (1200G, 3T)
#job_scratch_reserve: "15%"   # of the root filesystem left free beyond it

################################################################################
# Optional installs                                                            #
################################################################################
#slurm_configure_etc_hosts: true
#slurm_cluster_install_nvidia_driver: true
# A pull-through registry cache on [slurm-cache] for the compute nodes
#slurm_enable_nginx_docker_cache: false
# Where users may connect outside the cluster (egress_policy_* in group_vars/all.yml)
#slurm_enable_egress_policy: false
# A local resolver that blocks tunnel services by name (dns_resolver_* in all.yml)
#slurm_enable_dns_resolver: false
# Crashes to systemd-coredump, cores only within ulimit -c (coredump_* settings)
#slurm_enable_coredump: true
# Per-user disk quotas on the login nodes and /home (docs/deepops/disk-quota.md)
#slurm_enable_disk_quota: false
# Each person's own /tmp and /var/tmp at login on the login nodes (docs/slurm-cluster/login-private-dirs.md)
#slurm_enable_login_private_dirs: false
# Someone at a disk hard limit cannot submit Slurm jobs until they free space, once the
# limit is enforced (its from day in disk_quota_filesystems: the grace for those past it)
#slurm_enable_submit_holds: false
# Shared data and collaboration folders on the home server (docs/slurm-cluster/shared-space.md)
#slurm_enable_shared_space: false
# The shared data's one budget (the disk report warns at cluster_user_warn_fraction of it);
# true once its disk_quota project carries the budget as the kernel's limit.
#shared_space_data_budget: 20T
#shared_space_data_quota: false
# The hosts the bot's downloads may come from (each and below it); [] any public https host.
#shared_space_data_sources: []
# An entry nobody used for this long gets a cleanup notice, and goes the grace days after
# it unless used meanwhile: the cluster's one rule for unused files, as on /scratch.
#shared_space_data_stale_days: "{{ cluster_user_stale_days }}"
#shared_space_data_grace_days: "{{ cluster_user_grace_days }}"

################################################################################
# NFS                                                                          #
################################################################################
# NFS server exports (man 5 exports). Option notes:
# - no_subtree_check: modern recommended default (reliability; the man page advises it).
# - sync: data hits disk before the write is acked (crash-safe). Use async only for
#   scratch/temporary data where throughput matters more than durability.
# - root_squash: root on a client is nobody on the export, so one compromised node is
#   not root over everyone's files. These trees are written as root only on the server
#   itself (accounts, software installs), never through the mount.
# - Every export is offered to nfs_export_clients (cluster_networks, group_vars/all.yml).
nfs_exports:
  - path: /home    # shared home dirs
    options: "rw,sync,root_squash,no_subtree_check"
  - path: /sw      # shared software (EasyBuild / CUDA modules)
    options: "rw,sync,root_squash,no_subtree_check"
# Directories inside the exports the server keeps at a fixed owner and mode, e.g. a
# shared scratch [{path: /home/shared, mode: "1777"}] (sticky: each user deletes only
# their own files):
#nfs_shared_dirs: []
# Client mount options, applied to every nfs_mounts entry that does not set its own
# `options`. A starting point -- tune per your network and storage. nconnect (parallel
# TCP connections) is the main lever: ~4 on 10/25GbE, 8-16 on 100GbE+. On a NetApp/ONTAP
# filer cap rsize/wsize at 262144; on an InfiniBand fabric consider proto=rdma. Add
# ",fsc" for FS-Cache (cachefilesd role). Do not add x-systemd.automount for /home: a
# unit with ProtectHome= cannot namespace over an autofs /home and exits 226/NAMESPACE,
# which takes networkd, logind, polkit and timedated down with it.
# See docs/slurm-cluster/slurm-nfs.md and `man 5 nfs`.
#nfs_mount_options: rw,hard,vers=4.2,nconnect=16,rsize=1048576,wsize=1048576,proto=tcp,timeo=600,retrans=2,_netdev,nofail
nfs_mounts:
  - mountpoint: /home
    server: '{{ groups["slurm-master"][0] }}'
    path: /home
  - mountpoint: /sw
    server: '{{ groups["slurm-master"][0] }}'
    path: /sw

# Detach the NFS mounts at shutdown so a server rebooting alongside its clients cannot
# stall them. See roles/nfs_client/templates/nfs-detach-on-shutdown.service.j2.
#nfs_detach_on_shutdown: true

# NFS performance tuning (applies on server + clients). Defaults shown below;
# adjust for your hardware. Very high nfsd thread counts can fail to start with
# ENOMEM. See docs/slurm-cluster/slurm-nfs.md.
#nfs_server_threads: 128      # nfsd (kernel NFS server) thread count; lower on small servers, raise toward 256 on large busy ones
#nfs_tune_network: true      # raise TCP/socket buffers for high-bandwidth NFS (default true)

# Auto-recover nfs-server if a START fails (e.g. rpc.nfsd ENOMEM when a package
# upgrade bounces the NFS stack): retry every _delay s, up to _retries times, then stop.
#nfs_server_autorestart: true
#nfs_server_autorestart_retries: 10
#nfs_server_autorestart_delay: 30
#nfs_server_autorestart_interval: 600   # must exceed retries*delay

# Flags for enable/disable of NFS deployment: an NFS server on the NFS servers, and
# the NFS mounts on the NFS clients
#slurm_enable_nfs_server: true
#slurm_enable_nfs_client_nodes: true

# NFS servers and clients are the [slurm-nfs] and [slurm-nfs-client] inventory groups.
# To stop and remove an NFS server on every other host (one set up by hand once keeps
# exporting otherwise), list nfs in deepops_component_removals (group_vars/all.yml);
# nfs_client there takes the mounts out of fstab on every host outside [slurm-nfs-client].

################################################################################
# SOFTWARE MODULES (SM)                                                        #
#   Built with EasyBuild                                                       #
################################################################################
#slurm_install_lmod: true

# Note: the sm_prefix must be in an NFS-shared location
#sm_prefix: "/sw"

# The shared module tree (CUDA modules, the EasyBuild module) and its software:
#sm_module_root: "{{ sm_prefix }}/modules"
#sm_module_path: "{{ sm_module_root }}/all"
#sm_software_path: "{{ sm_prefix }}/software"
# Module trees Lmod searches on every node, in order:
#lmod_module_paths:
#  - "{{ sm_module_path }}"
#  - "{{ easybuild_module_path }}"

# EasyBuild (playbooks/slurm-cluster/easybuild-modules.yml): installed with pip into a
# root-owned venv, `module load EasyBuild/<version>`. Builds run as an unprivileged
# account that owns only EasyBuild's own tree. Opt-in; the first slurm-master installs
# it into the shared tree, and turning it off removes EasyBuild (what it built stays):
#slurm_install_easybuild: false
#easybuild_version: "5.4.2"
#easybuild_user: easybuild
#easybuild_prefix: "{{ sm_prefix }}/easybuild"
#easybuild_module_path: "{{ easybuild_prefix }}/modules/all"
# Easyconfigs to build with `eb --robot` (a shipped easyconfig's file name or a path):
#easybuild_packages: []
#easybuild_packages:  # example
#  - zlib-1.3.1-GCCcore-14.2.0.eb

# The shared software trees are installed once (roles/deploy_defaults): EasyBuild and
# the CUDA modules by the first slurm-master, the HPC SDK by the first slurm-login.

# CUDA toolkits as Lmod modules (playbooks/slurm-cluster/nvidia-cuda-toolkit.yml).
# Installs CUDA toolkits from the official runfiles into {{ sm_prefix }}/cuda and
# exposes each minor as `module load cuda/<major.minor>` (the full version loads too;
# a bare `module load cuda` takes the newest). Driver is never touched. Opt-in; the
# first slurm-master installs them into the shared tree, visible on every node, and
# turning it off removes them from there:
#slurm_install_cuda_toolkit: false
# Instead, one system-wide toolkit from NVIDIA's repository on every host (cuda_version
# in all.yml; playbooks/nvidia-software/nvidia-cuda.yml):
#slurm_install_cuda: false
# Offered: the newest patch of every CUDA minor from cuda_toolkit_oldest up to the
# newest the driver branch runs, from the role's catalog (regenerated with
# scripts/deepops/cuda_releases.py when NVIDIA releases). A minor that leaves the
# range is removed from the tree:
#cuda_toolkit_oldest: "11.8"
# Where the toolkits and their modulefiles land (default: alongside the Lmod tree
# so `module avail` finds them with no extra MODULEPATH wiring):
#cuda_prefix: "{{ sm_prefix }}"
#cuda_modroot: "{{ sm_module_path }}"
# Free space (GB) each toolkit install needs on the cache and install disks before it
# starts; the toolkits install one at a time and each runfile is removed after:
#cuda_install_free_gb: 30

################################################################################
# NVIDIA HPC SDK                                                               #
################################################################################
#slurm_install_hpcsdk: false

# Select the version of HPC SDK to download
#hpcsdk_major_version: '26'
#hpcsdk_minor_version: '9'
#hpcsdk_file_cuda: '13.3'
#hpcsdk_arch: "x86_64"
#hpcsdk_default_cuda: '13.3'

# In a Slurm cluster, default to setting up HPC SDK as modules rather than in
# the default user environment
hpcsdk_install_as_modules: true
hpcsdk_install_in_path: false

################################################################################
# OpenMPI build                                                                #
#                                                                              #
# The openmpi.yml playbook will build a custom-configured OpenMPI based on the #
# Slurm, PMIx, and hwloc on the cluster. In most cases you should be fine with #
# using the OpenMPI provided in the HPC SDK, but if you need a custom build,   #
# this can help you get started.
################################################################################
#slurm_cluster_install_openmpi: false
#openmpi_version: 5.0.11
#openmpi_install_prefix: "/usr/local"
# OpenMPI 5.0.x built against the distribution PMIx + hwloc that Slurm uses (SchedMD
# best practice; libpmix-dev and libhwloc-dev on the build host). v5 removed
# --with-pmi/--with-slurm; `srun --mpi=pmix` needs only --with-pmix. (On OpenMPI 4.x
# add back --with-pmi/--with-slurm and give the PMIx, hwloc and libevent paths.)
openmpi_configure: "./configure --prefix={{ openmpi_install_prefix }} --disable-dependency-tracking --disable-getpwuid --with-pmix=external --with-hwloc=external --with-libevent=external"

################################################################################
# GPU Power Limit                                                              #
################################################################################
# slurm-cluster.yml runs roles/nvidia_power_limit over [slurm-node]. It is declarative:
# a node whose GPU model has a cap here gets it (a systemd unit re-applies it at boot,
# before slurmd), every other node has any cap REMOVED and its GPUs put back on their
# default limit. The model is the name nvidia-smi reports. A node's own
# nvidia_power_limit_watts (host_vars) overrides its model's cap. The cap also bounds
# the Slurm prolog/epilog, so an exclusive job cannot raise a capped node to the card
# maximum. Set slurm_cluster_configure_gpu_power_limit false to remove every cap.
#slurm_cluster_configure_gpu_power_limit: true
#nvidia_power_limit_watts_by_model: {}
#nvidia_power_limit_watts_by_model:  # example
#  "NVIDIA A30": 150

# PCIe ACS off on the compute nodes at every boot, for GPU peer-to-peer (roles/pcie_acs;
# NHC drains a node where it is back on). Bare metal only: a host passing devices to
# virtual machines needs ACS.
#slurm_disable_pcie_acs: false
# The IOMMU beside it, as NCCL's guide pairs them: off, pt (pass-through) or "" (leave
# the kernel command line alone); a reboot applies it.
#pcie_acs_iommu: ""

# GPU ECC (roles/nvidia_ecc): "enabled" or "disabled" on every GPU of the nodes, ""
# leaves each GPU as it is. ECC reserves about a sixteenth of a GDDR GPU's memory; a
# change is applied by the next (drained) reboot, which the role requests.
#nvidia_ecc_mode: ""

################################################################################
# Cluster Tools (site commands, shell defaults, login banner)                  #
################################################################################
#slurm_install_cluster_tools: true
# roles/cluster_tools publishes your own commands into PATH on every node, shell
# defaults through /etc/profile.d, and a login banner through update-motd.d. Prefer
# all three to aliases in /etc/bash.bashrc: an alias exists only inside an interactive
# bash, so a job script and `ssh <node> <cmd>` never see it, and /etc/bash.bashrc
# belongs to the bash package so local edits there collide with every upgrade.
#
# dest is a bare command name. Do NOT reuse the name of a real command (squeue, sinfo):
# the role refuses a name that already resolves elsewhere in PATH, because a wrapper
# installed under that name makes the command behave differently from a script.
#cluster_tools_scripts: []

# The cluster commands to publish (Python, on the shared cluster_tools library): every
# command the role ships is cluster_tools_builtin, each described by its own --help.
#cluster_tools_commands: "{{ cluster_tools_builtin }}"  # example

# Commands and libraries published before the role recorded what it publishes, to remove
# from every host (for example a command a site has retired).
#cluster_tools_retired: []
#cluster_tools_retired_libs: []

# The users' environment beyond the defaults (roles/user_environment_defaults: HF_HOME,
# UV_CACHE_DIR and PIP_CACHE_DIR, the caches in the job's /tmp inside a job, and
# SHARED_HF_HUB_CACHE where a shared model cache is set; a cache variable stays per user,
# never on shared storage), by name; null
# drops a default. Change a Slurm command's default output through its own environment
# variable rather than by wrapping the command (see `man sinfo`, `man squeue`): the
# environment is inherited, so batch scripts and remote commands get the same output.
#user_environment:  # example
#  SINFO_FORMAT: '%9P %5t %12N %5D %21G'
#  # The name the commands print (sq, qos); without it they fall back to
#  # Slurm's ClusterName.
#  CLUSTER_TITLE: "{{ cluster_tools_motd_title }}"
#  # sq's default options for everyone, as if typed first; a user's own SQ_OPTIONS or
#  # command line overrides them (see `sq --help`).
#  #SQ_OPTIONS: "--no-users"
#  # COLORTERM is how a terminal advertises 24-bit colour, and sshd forwards nothing
#  # but LANG and LC_* -- so it is lost on every hop and colour-aware tools fall back
#  # to their 256-colour approximation on the compute nodes. Asserting it here is a
#  # claim made on the client's behalf: a terminal that cannot do 24-bit (macOS
#  # Terminal.app, a VT console) gets sequences it will drop, losing colour rather
#  # than gaining it. The honest fix is SendEnv/AcceptEnv COLORTERM on both ends,
#  # after which the client's own value wins and this line stops mattering.
#  COLORTERM: truecolor

# Site facts Slurm cannot know (roles/cluster_info_defaults), set once here and read by the
# cluster's commands, login banner and alerts; refer to them below rather than restating
# a value. A key left empty is left out. Two more are published with them, derived:
# dashboard_url (grafana_root_url) and prometheus_url (the prometheus component's host).
#cluster_info:  # example
#  name: "my-cluster"  # system ID, <org>-<kind>
#  docs_url: "https://docs.example.edu/cluster/"  # public user docs
#  login_host: "cluster.example.edu"  # what users ssh to
#  ssh_port: 22

# Login banner -- what people see when they SSH in. One short line each; the guide
# carries the detail.
#cluster_tools_motd_title: "my cluster"  # example
#cluster_tools_motd_commands: "{{ cluster_tools_commands }}"
#cluster_tools_motd_commands: "{{ cluster_tools_commands + [{'name': 'sinfo', 'text': 'partition and node state'}] }}"  # example
#cluster_tools_motd_links:  # example
#  - { name: "{{ cluster_info.docs_url }}", text: "the guide: getting started, recipes, policy" }
#  - { name: /sw/examples, text: "worked job examples, hello world to multi-node" }
#  - { name: dashboard,    text: "{{ grafana_root_url }}" }

# Ubuntu's motd-news fetches advertising from motd.ubuntu.com into the login banner. On
# hosts without internet access each run fails and stays a failed systemd unit, so
# switch it off there.
#cluster_tools_motd_news: false  # example

# Directories copied onto a shared filesystem for users to read and copy from. Set
# them on the one host that exports the share -- see config/host_vars/<head node>.
#cluster_tools_shared_dirs:  # example
#  - { src: "{{ inventory_dir }}/files/slurm/examples", dest: /sw/examples }
# Destinations published before and retired since, removed whole on the next run.
#cluster_tools_retired_shared_dirs: []

################################################################################
# Enroot & Pyxis                                                               #
################################################################################
#slurm_install_enroot: true
#slurm_install_pyxis: true
#slurm_pyxis_version: 0.24.0

# /run is default partition of pyxis runtime_path
#resize_run_partition: false

# /run tmpfs size. ubuntu default is 10%
#pyxis_run_tmpfs_size: 50%

################################################################################
# Rootless Podman (image builds)                                               #
################################################################################
# Rootless Podman on the compute nodes: users build an image from a Dockerfile in a
# CPU job and import it with `enroot import podman://IMAGE` (docs/container/podman.md).
#slurm_install_podman: true
# Who gets a subordinate UID/GID range, computed from the roster UID so every node
# agrees (start = base + (uid - 1000) * count). The base must exceed every roster UID.
#podman_people: "{{ people }}"
#podman_subid_base: 100000
#podman_subid_count: 65536
# Per-user image storage, on node-local disk (never NFS).
#podman_storage_root: /var/lib/podman-storage

# The daily cleanup of users' podman storage and enroot cache: a user's whole store
# goes when they left the roster, after it went unused, or least recently used first
# while the disk is above the limit; never while they use that tool.
#slurm_enable_container_storage_gc: true
#container_storage_gc_people: "{{ people }}"
#container_storage_gc_unused_days: "{{ cluster_user_grace_days }}"
#container_storage_gc_max_used_percent: 80
#container_storage_gc_on_calendar: "*-*-* 04:00:00"

# Each job user's runtime directory on a node, the job's XDG_RUNTIME_DIR (made by the
# prolog, exported by the task prolog, removed with the user's last job there).
#slurm_user_runtime_root: /run/slurm-users

################################################################################
# Node Health Check                                                            #
################################################################################
#slurm_install_nhc: true
# slurmd's health check follows it: NHC while installed, none otherwise.
#slurm_health_check_program: "{{ nhc_program if slurm_install_nhc | bool else '' }}"
# GPU faults that drain a node until it reboots (NVIDIA's XID catalog: RESET_GPU, and 79;
# an Xid 154 asking for a reset or reboot drains too); [] turns the check off. A pending
# or failed row remapping drains too. Each nvidia-smi try is bounded (seconds) and made
# once more on a timeout; NHC's own bound on a run follows from it.
#nhc_gpu_drain_xids: [46, 62, 64, 79, 95, 110, 119, 120, 140, 143, 155, 156, 158, 160, 166, 167, 169, 175, 179, 180, 181, 184]
#nhc_nvidia_smi_timeout: 10
#nhc_gpu_check_remapped_rows: true
# Network interfaces that drain the node when down, by name (none by default).
#nhc_check_interfaces: [eth0]  # example

# The health check configuration generated by default in DeepOps is pretty
# basic, and most cluster administrators will want to set up more extensive
# NHC configurations with their local site customizations.
# To set a custom file for Ansible to provision to /etc/nhc/nhc.conf, set the
# following var:
#
#nhc_config_template: "/path/to/custom/nhc.conf"  # example
#
# For documentation on the file format, see:
# https://github.com/mej/nhc/blob/master/README.md

################################################################################
# Container registry                                                           #
################################################################################
#slurm_enable_container_registry: true
docker_insecure_registries: "{{ groups['slurm-master'] | map('regex_replace', '^(.*)$', '\\1:5000') | list + ['registry.local:31500'] }}"
docker_registry_mirrors: "{{ groups['slurm-master'] | map('regex_replace', '^(.*)$', 'http://\\1:5000') | list }}"

# Group that owns /run/docker.sock on every node, so `docker` works from inside a
# Slurm job. Must be the SAME group the directory publishes (directory_groups in
# group_vars/all.yml) -- both read the values defined there.
# Leave unset to keep the package-default `docker` group, which does NOT work from
# inside a job; see cluster_docker_group_name in group_vars/all.yml for why.
#
# NOTE: docker grants root-equivalent access on the node, and containers started
# through dockerd live outside the job's cgroup -- they survive scancel and their
# GPU/CPU/memory are not charged to the allocation. Prefer enroot/pyxis
# (srun --container-image=...) for anything that fits in a single container.
#docker_socket_group: "{{ cluster_docker_group_name }}"  # example
#docker_socket_group_gid: "{{ cluster_docker_group_gid }}"  # example
# Applying the change restarts dockerd, which stops running containers on the node.
#docker_daemon_restart: true

################################################################################
# Monitoring stack                                                             #
################################################################################
#slurm_enable_monitoring: true

# The monitoring services (Prometheus, Grafana, exporters) run on the [slurm-metric]
# inventory group.

# Grafana web UI port. Override if it is taken.
#grafana_port: 3000
# Grafana admin password, enforced on every run. Vault it.
#grafana_cfg_pass: deepops
# Public URL Grafana uses in the links it generates.
#grafana_root_url: "http://cluster.example:3000/"  # example
# Grafana folder of the provisioned dashboards; name it after the cluster's system ID,
# one folder per cluster.
#grafana_dashboard_folder: cluster-name  # example

# Prometheus TSDB retention; whichever limit is hit first wins.
#prometheus_retention_time: 90d
#prometheus_retention_size: 50GB

# Slurm's metrics come from slurmctld itself (MetricsType=metrics/openmetrics, scraped by
# Prometheus); the former Slurm exporter is retired and a deploy removes it.

################################################################################
# Logging with rsyslog                                                         #
################################################################################
#slurm_enable_rsyslog_server: true
#slurm_enable_rsyslog_client: true
# The server is slurm-master[0]; the clients are [slurm-node].
rsyslog_client_tcp_host: "{{ groups['slurm-master'][0] }}"

################################################################################
# Open OnDemand (playbooks/slurm-cluster/open-ondemand.yml, roles/open_ondemand) #
################################################################################
#slurm_install_open_ondemand: false

# The portal's public name and its one port (Apache listens nowhere else).
#open_ondemand_servername: portal.example.com  # example
#open_ondemand_port: 443
# Derived: the portal's URL (roles/open_ondemand_defaults), 443 not written.
#open_ondemand_url: >-
#  {{ ('https://' ~ open_ondemand_servername ~ ('' if open_ondemand_port | int == 443
#      else ':' ~ (open_ondemand_port | int)) ~ '/') if open_ondemand_servername | length > 0 else '' }}

# Certificate chain and private key under the inventory; vault the key.
#open_ondemand_tls_cert_src: "{{ inventory_dir }}/files/tls/portal.fullchain.pem"  # example
#open_ondemand_tls_key_src: "{{ inventory_dir }}/files/tls/portal.key"  # example

# Login through Dex (required). With the cluster's own LDAP (ldap_suffix) the role
# connects to it by itself (roles/open_ondemand: open_ondemand_dex_ldap_connector, the
# dex reader's password made by roles/site_secrets); set connectors only for another
# identity source. Vault the passphrase (32+ random characters).
#open_ondemand_dex_connectors: "{{ [open_ondemand_dex_ldap_connector] if ldap_suffix | length > 0 else [] }}"
#open_ondemand_dex_ldap_name: "{{ open_ondemand_cluster_title }}"
#open_ondemand_oidc_crypto_passphrase: "{{ vault_open_ondemand_oidc_crypto_passphrase }}"  # example

# Directories the file browser and shell may open.
#open_ondemand_allowlist_paths:
#  - /home

# Local web services published under a path of the portal, behind its login.
#open_ondemand_proxied_services:  # example
#  - path: /grafana/
#    upstream: http://127.0.0.1:3000/
#    user_header: X-WEBAUTH-USER
