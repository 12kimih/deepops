---
# Applies to the [nis-master] inventory group -- the ONE node that runs the NIS master
# (ypserv) when nis_domain is set. The nis_server role (run by authentication.yml, which
# slurm-cluster.yml imports) installs ypserv, sets the NIS domain, writes securenets,
# and builds the maps with `ypinit -m` (skipped if /var/yp/<domain> already exists, so
# an existing manual database is preserved). It publishes the groups and netgroups in
# AUTH of group_vars/all.yml. Clients bind to it via nis_domain/nis_server there.

# Keep the people roster's accounts and homes here, the account source (roles/people,
# run by authentication.yml just before the directory servers publish them). See PEOPLE
# in all.yml.
#people_manage_accounts: true  # example

# Which client networks may query this NIS server ("NETMASK NETWORK" lines).
# Role default = localhost + RFC1918; TIGHTEN to your actual cluster subnet.
#nis_server_securenets:  # example
#  - "255.0.0.0       127.0.0.0"   # localhost
#  - "255.255.255.0   10.0.0.0"   # the cluster's internal subnet
