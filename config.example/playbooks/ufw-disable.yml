---
# Convenience helper: stop and disable UFW so it cannot block Slurm/munge/NFS
# ports on a fresh Ubuntu install. A host without ufw is skipped; any other failure
# fails the task rather than being ignored.
- name: Disable the UFW firewall on all nodes
  hosts: slurm-cluster
  become: true
  tasks:
    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Stop the ufw service
      ansible.builtin.systemd:
        name: ufw
        state: stopped
      when: "'ufw.service' in ansible_facts.services"

    - name: Disable ufw so it does not start on boot
      community.general.ufw:
        state: disabled
      when: "'ufw.service' in ansible_facts.services"
