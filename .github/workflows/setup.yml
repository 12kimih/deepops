---
name: test setup.sh
on:
  - push
  - pull_request
jobs:
  setup:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
    steps:
      - name: check out repo
        uses: actions/checkout@v4

      - name: run setup.sh
        run: ./scripts/setup.sh </dev/null

      - name: verify the environments setup.sh built
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run --locked ansible --version
          uv run --locked scripts/deepops/galaxy.py --check
          .venv-kubespray/bin/ansible --version
