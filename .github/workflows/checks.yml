---
# Every repository check, from scripts/check.sh, with the pinned tool versions.
name: checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install the tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lua5.3
          uv sync --locked

      - name: Install the Galaxy requirements
        run: uv run ansible-galaxy collection install -r roles/requirements.yml -p collections

      - name: Run every check
        run: uv run scripts/check.sh
