---
# Every repository check, from scripts/check.sh, with the pinned tool versions.
name: checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Lua for the job_submit.lua tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lua5.3

      - name: Install the Galaxy collections and roles
        run: uv run --locked scripts/deepops/galaxy.py

      - name: Run every check
        run: scripts/check.sh
