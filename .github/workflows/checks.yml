---
# Every repository check, from scripts/check.sh, with the pinned tool versions.
name: checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      # Kubespray is a submodule: config_lint reads its variables and the full check
      # syntax-checks the playbook that imports it.
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Lua for the job_submit.lua tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lua5.3

      - name: Install the Galaxy collections and roles
        run: uv run --locked scripts/deepops/galaxy.py

      - name: Run every check
        run: scripts/check.sh

      # The file hygiene hooks run only at commit otherwise, so a conflict marker or
      # broken YAML committed past the hook (web UI, --no-verify) would pass CI.
      # deepops-check is the step above.
      - name: Run the commit hooks on every file
        env:
          SKIP: deepops-check
        run: uv run --locked pre-commit run --all-files --show-diff-on-failure
