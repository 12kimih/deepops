---
name: test slurm epilog cleanup scripts as root
# The epilog cleanup guards, as root in a privileged container: the mount-boundary
# cases need root and a real mount, which scripts/check.sh (run by checks.yml)
# cannot give them.
on:
  push:
    paths:
      - 'roles/slurm/templates/etc/slurm/**'
      - 'tests/slurm-epilog/**'
      - '.github/workflows/slurm-epilog-tests.yml'
  pull_request:
    paths:
      - 'roles/slurm/templates/etc/slurm/**'
      - 'tests/slurm-epilog/**'
      - '.github/workflows/slurm-epilog-tests.yml'
  workflow_dispatch:

jobs:
  # The unprivileged cases run with every other check in checks.yml (scripts/check.sh).
  # The four mount-boundary cases mount tmpfs and bind mounts under the fixture,
  # so they need root and CAP_SYS_ADMIN. A privileged container gives the
  # harness both; `nobody` is the unprivileged account it borrows for ownership.
  privileged:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    container:
      image: ubuntu:24.04
      options: --privileged
    steps:
      - name: check out repo
        uses: actions/checkout@v4

      - name: install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            python3 python3-jinja2 findutils util-linux

      - name: run epilog tests as root
        run: |
          set -o pipefail
          bash tests/slurm-epilog/run-tests.sh 2>&1 | tee epilog-tests.log
          # Require every case, including fixtures that can skip individually
          # when a mount fails even though the whole-block preflight passed.
          if grep -qE '^[[:space:]]+skip ' epilog-tests.log; then
            echo '::error::epilog cases were skipped in the privileged container'
            exit 1
          fi

      - name: write job summary
        if: always()
        run: |
          {
            echo '### slurm-epilog tests (privileged container, root)'
            echo
            if grep -qE '^[[:space:]]+skip ' epilog-tests.log; then
              echo '**Cases were skipped.** The privileged job requires all cases; see the fixture or prerequisite failures below.'
            elif grep -qE '^[0-9]+ passed, 0 failed$' epilog-tests.log; then
              echo 'Includes the four root-only mount-boundary cases.'
            else
              echo '**The suite failed or did not finish.** Full mount-boundary coverage is not confirmed.'
            fi
            echo
            echo '```'
            cat epilog-tests.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
