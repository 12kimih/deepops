---
name: test ansible roles with molecule
on:
  - push
  - pull_request
jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        deepops-role:
          - cachefilesd
          - facts
          - kerberos_client
          - lmod
          - nfs
          - nhc
          - nvidia_dcgm
          - openmpi
          - os_updates
          - mofed
          - spack
          # Excluded from Docker CI (require systemd services that can't
          # run in containers): nis_client, rsyslog_client, rsyslog_server,
          # slurm. Tested end-to-end on real MAAS VMs instead.
          # Also excluded: singularity_wrapper (broken upstream Galaxy dep)
    steps:
      - name: check out repo
        uses: actions/checkout@v4
        with:
          path: "${{ github.repository }}"
      - name: set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # Galaxy downloads from GitHub occasionally time out; the cache lets most runs
      # skip them, and galaxy.py retries the rest.
      - name: cache galaxy roles and collections
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/${{ github.repository }}/roles/galaxy
            ${{ github.workspace }}/${{ github.repository }}/collections
          key: molecule-galaxy-${{ hashFiles(format('{0}/roles/requirements.yml', github.repository)) }}
      - name: install the galaxy collections and roles
        run: cd "${{ github.repository }}" && uv run --locked scripts/deepops/galaxy.py
      - name: run molecule test
        env:
          # Molecule runs from the role, outside the reach of the repository's ansible.cfg.
          ANSIBLE_ROLES_PATH: "${{ github.workspace }}/${{ github.repository }}/roles/galaxy:${{ github.workspace }}/${{ github.repository }}/roles"
          ANSIBLE_COLLECTIONS_PATH: "${{ github.workspace }}/${{ github.repository }}/collections"
        run: |
          cd "${{ github.repository }}/roles/${{ matrix.deepops-role }}"
          uv run --locked molecule test
