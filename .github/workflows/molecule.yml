---
name: test ansible roles with molecule
on:
  - push
  - pull_request
jobs:
  # The roles with a scenario, from the repository (scripts/deepops/molecule.py), so a
  # new scenario runs in CI the day it lands and none is left out by a hand list.
  roles:
    runs-on: ubuntu-24.04
    outputs:
      roles: ${{ steps.list.outputs.roles }}
    steps:
      - name: check out repo
        uses: actions/checkout@v7
      - id: list
        run: echo "roles=$(python3 scripts/deepops/molecule.py list)" >> "$GITHUB_OUTPUT"
  build:
    needs: roles
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        deepops-role: ${{ fromJSON(needs.roles.outputs.roles) }}
    steps:
      - name: check out repo
        uses: actions/checkout@v7
        with:
          path: "${{ github.repository }}"
      - name: set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      # Galaxy downloads from GitHub occasionally time out; the cache lets most runs
      # skip them, and galaxy.py retries the rest.
      - name: cache galaxy roles and collections
        uses: actions/cache@v6
        with:
          path: |
            ${{ github.workspace }}/${{ github.repository }}/roles/galaxy
            ${{ github.workspace }}/${{ github.repository }}/collections
          key: molecule-galaxy-${{ hashFiles(format('{0}/roles/requirements.yml', github.repository)) }}
      - name: install the galaxy collections and roles
        run: cd "${{ github.repository }}" && uv run --locked scripts/deepops/galaxy.py
      # Every scenario of the role (a component's absent path is a scenario of its own),
      # from .config/molecule/config.yml: the platform and the repository's Ansible paths.
      - name: run molecule test
        run: cd "${{ github.repository }}" && uv run --locked scripts/deepops/molecule.py test "${{ matrix.deepops-role }}"
