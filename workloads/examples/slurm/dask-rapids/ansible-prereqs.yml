---
# Miniconda on all hosts
- hosts: all
  become: true
  roles:
    - andrewrothstein.miniconda
  tasks:
    - name: Ensure git is installed
      ansible.builtin.package:
        name: "git"
        state: present

  # CUDA toolkit on the compute nodes, from the NVIDIA repository
- hosts: slurm-node
  become: true
  roles:
    - facts
    - nvidia_cuda

  # Pre-copy scripts to all nodes
- hosts: all
  become: true
  vars:
    share_dir: "/usr/share/deepops"
  tasks:
    - name: Create a doc directory for these files
      ansible.builtin.file:
        path: "{{ share_dir }}"
        mode: "0777"
        owner: root
        group: root
        state: directory
    - name: Copy conda requirements to doc dir
      ansible.builtin.copy:
        src: "conda-requirements.yml"
        dest: "{{ share_dir }}/conda-requirements.yml"
        owner: root
        group: root
        mode: "0444"
    - name: Copy scripts to doc dir
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ share_dir }}/{{ item }}"
        owner: root
        group: root
        mode: "0555"
      with_items:
        - launch-dask-cuda-worker.sh
        - launch-dask-scheduler.sh
        - run.sh
        - sum.py
