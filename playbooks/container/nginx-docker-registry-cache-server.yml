---
- name: Install docker
  import_playbook: docker.yml

- hosts: "{{ hostlist | default('slurm-cache') }}"
  become: true
  roles:
    - role: deploy_defaults
  tasks:
    - name: Deploy nginx container caching proxy
      ansible.builtin.include_role:
        name: "nginx-docker-registry-cache"
        tasks_from: server
