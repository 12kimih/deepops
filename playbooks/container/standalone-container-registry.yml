---
- name: Install docker
  import_playbook: docker.yml

# One registry, on the hosts named by hostlist (slurm-cluster.yml passes slurm-master,
# k8s-cluster.yml kube_control_plane). It used to default to every host, so one run
# without hostlist left a registry on each node; every other host now has it removed.
- hosts: "{{ hostlist | default('slurm-master') }}"
  become: true
  become_method: ansible.builtin.sudo
  roles:
    - standalone-container-registry

- hosts: "all:!{{ hostlist | default('slurm-master') }}"
  become: true
  become_method: ansible.builtin.sudo
  roles:
    - role: standalone-container-registry
      vars:
        standalone_container_registry_state: absent
