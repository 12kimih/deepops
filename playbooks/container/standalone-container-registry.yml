---
# Run alone it brings the Docker it needs; a deploy imports Docker itself, before it.
- name: Install docker
  import_playbook: docker.yml
  when: deepops_phase == 'converge'

# Every host it runs on converges: present where deepops_components says so (the
# switch and the target group, roles/deploy_defaults/vars/main.yml), removed elsewhere,
# so a registry started on another host earlier goes.
- hosts: "{{ hostlist | default('slurm-cluster') }}"
  become: true
  become_method: ansible.builtin.sudo
  roles:
    - role: deploy_defaults
    - role: standalone-container-registry
      standalone_container_registry_state: >-
        {{ deepops_components.standalone_container_registry | component_phase(deepops_phase) }}
