---
- name: Install docker
  import_playbook: docker.yml

- hosts: "{{ hostlist | default('slurm-node') }}"
  become: true
  roles:
    - role: deploy_defaults
  tasks:
    - name: Configure nginx container caching proxy client
      ansible.builtin.include_role:
        name: "nginx-docker-registry-cache"
        tasks_from: client
