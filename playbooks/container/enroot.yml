---
# enroot on login and compute hosts (roles/enroot), so containers can be imported and
# launched from either. Every host it runs on converges to deepops_components (present
# on slurm-cluster while slurm_install_enroot is on, removed elsewhere). Its NVIDIA hook
# runs nvidia-container-cli for every image that asks for GPUs: run alone it brings the
# container toolkit; a deploy imports it itself, before it.
- name: Install the NVIDIA Container Toolkit for enroot's GPU hook
  import_playbook: nvidia-container-toolkit.yml
  when: deepops_phase == 'converge'

- hosts: "{{ hostlist | default('slurm-cluster') }}"
  become: true
  roles:
    - role: deploy_defaults
    - role: facts
    - role: enroot
      enroot_state: "{{ deepops_components.enroot | component_phase(deepops_phase) }}"
