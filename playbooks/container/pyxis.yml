---
# Run alone it brings the enroot it needs; a deploy imports enroot itself, before it
# (and removes pyxis before enroot).
- name: Install enroot
  import_playbook: enroot.yml
  when: deepops_phase == 'converge'

# pyxis's node setup (roles/pyxis; its Slurm plugin and package are roles/slurm's).
# Every host it runs on converges to deepops_components (present on slurm-cluster while
# slurm_install_enroot and slurm_install_pyxis are on, removed elsewhere).
- hosts: "{{ hostlist | default('slurm-cluster') }}"
  become: true
  roles:
    - role: deploy_defaults
    - role: pyxis
      pyxis_state: "{{ deepops_components.pyxis | component_phase(deepops_phase) }}"
  post_tasks:
    - name: Record what this play deployed
      ansible.builtin.include_role:
        name: component_record
        tasks_from: sources
