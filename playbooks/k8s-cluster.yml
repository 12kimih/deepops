---
# Kubernetes Cluster Playbook

# Kubespray pins its own Ansible range (submodules/kubespray/playbooks/ansible_version.yml)
# and runs from the environment scripts/setup.sh builds for it.
- name: Check that this runs from the Kubespray environment
  hosts: localhost
  gather_facts: false
  tags: always
  vars:
    kubespray_ansible: "{{ (lookup('ansible.builtin.file', playbook_dir ~ '/../submodules/kubespray/playbooks/ansible_version.yml') | from_yaml)[0].vars }}"
  tasks:
    - name: Require the Ansible version Kubespray supports
      ansible.builtin.assert:
        that:
          - ansible_version.string is version(kubespray_ansible.minimal_ansible_version, '>=')
          - ansible_version.string is version(kubespray_ansible.maximal_ansible_version, '<')
        fail_msg: >-
          Kubespray needs ansible-core >= {{ kubespray_ansible.minimal_ansible_version }} and
          < {{ kubespray_ansible.maximal_ansible_version }}, this is {{ ansible_version.string }}.
          Run the Kubernetes playbooks from the Kubespray environment:
          source .venv-kubespray/bin/activate (scripts/setup.sh builds it)

# Set facts depending on container runtime
# Use GPU operator when container runtime is not docker
# etcd_deployment_type must be `host` when container_manager is not `docker`
# A play reading Kubespray's settings lists kubespray_defaults, as Kubespray's do.
- hosts: all
  roles:
    - role: deploy_defaults
    - role: kubespray_defaults
  tasks:
    # deepops_gpu_operator_enabled is the site's to set; a fact here overrode it.
    - name: Set facts when not using docker container runtime (default)
      ansible.builtin.set_fact:
        etcd_deployment_type: host
      when: container_manager != "docker"
    - name: Set facts when using Docker container runtime
      ansible.builtin.set_fact:
        etcd_deployment_type: docker
        gpu_operator_default_runtime: "docker"
      when: container_manager == "docker"
    # For the plays below that do not load kubespray_defaults (container/nvidia-container-toolkit.yml).
    - name: Note whether Docker is the container runtime
      ansible.builtin.set_fact:
        _k8s_runtime_is_docker: "{{ container_manager == 'docker' }}"

- name: Install python required for Ansible
  import_playbook: bootstrap/bootstrap-python.yml
  tags:
    - bootstrap

# Make sure Kubespray submodule is correct
- hosts: all
  gather_facts: false
  tasks:
    - name: Make sure kubespray is at the correct version
      change_command:
        cmd: git submodule update --init
      args:
        chdir: "{{ playbook_dir | dirname }}"
      delegate_to: localhost
      run_once: true
  vars:
    ansible_become: false
    ansible_connection: local
  tags:
    - local

- name: Disable cloud-init
  import_playbook: generic/disable-cloud-init.yml
  when: deepops_disable_cloud_init

- name: Configure each host's network from host_vars, one host at a time
  import_playbook: generic/netplan.yml

- name: Set the system locale and time zone
  import_playbook: generic/locale.yml

- name: Set the target each host boots into
  import_playbook: generic/default-target.yml

- name: Configure Chrony (NTP) sync
  import_playbook: generic/chrony-client.yml
  vars:
    deepops_phase: install

- name: Apply the OS update policy
  import_playbook: generic/os-updates.yml

- name: Configure the OpenSSH server
  import_playbook: generic/sshd.yml

- name: Ban repeated failed logins
  import_playbook: generic/fail2ban.yml
  vars:
    hostlist: k8s_cluster
    deepops_phase: install

- name: Configure hostnames, /etc/hosts
  import_playbook: generic/hosts.yml

# The container engine, where a component below needs it (deepops_components).
- name: Install Docker where a component needs it
  import_playbook: container/docker.yml
  vars:
    hostlist: k8s_cluster
    deepops_phase: install

- name: Set up a local cluster container registry
  import_playbook: container/standalone-container-registry.yml
  vars:
    hostlist: k8s_cluster
    deepops_phase: install

# Install 'sshpass' program for: https://github.com/ansible/ansible/issues/56629
- hosts: all
  gather_facts: true
  roles:
    - role: proxy_defaults
  tasks:
    - name: Install epel
      ansible.builtin.package:
        name: epel-release
        state: present
      when: ansible_facts.os_family == "RedHat"
    - name: Install sshpass
      ansible.builtin.package:
        name: sshpass
        state: present
  environment: "{{ proxy_env }}"
  tags:
    - bootstrap

# Un-hold container runtime packages on Ubuntu
# In some cases, container runtime packages can be in the 'held' state, preventing
# them from being removed and causing the install of the containerd runtime to fail
- hosts: all
  gather_facts: true
  roles:
    - role: proxy_defaults
    - role: kubespray_defaults
  tasks:
    # Only packages a host has: dpkg cannot select one it does not know.
    - name: Gather package facts
      ansible.builtin.package_facts:
      when:
        - container_manager != "docker"
        - ansible_facts.distribution == "Ubuntu"

    - name: Un-hold container runtime packages on Ubuntu
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: purge
      with_items:
        - docker-ce
        - docker-ce-cli
        - docker-ce-rootless-extras
        - containerd.io
      when:
        - container_manager != "docker"
        - ansible_facts.distribution == "Ubuntu"
        - item in ansible_facts.packages
  environment: "{{ proxy_env }}"

# Install Kubernetes
# for configuration, see: config/group_vars/k8s_cluster.yml
- name: Install Kubernetes
  import_playbook: ../submodules/kubespray/cluster.yml
  tags:
    - k8s

# Disable swap (required for k8s), kubespray method doesn't quite cut it
- hosts: all
  become: true
  tasks:
    - name: Remove swap from fstab
      ansible.builtin.lineinfile: path=/etc/fstab regexp='swap' state=absent
    - name: Disable swap
      change_command:
        cmd: swapoff -a
  tags:
    - swap

# Manage Kubernetes cluster access config file
- hosts: k8s_cluster
  gather_facts: false
  vars:
    ansible_become: false
  tasks:
    - name: Create artifacts directory
      ansible.builtin.file:
        path: "{{ artifacts_dir }}"
        state: directory
      delegate_to: localhost
      run_once: true
    - name: Create kube config directory for current user
      ansible.builtin.file:
        path: "{{ lookup('env', 'HOME') + '/.kube/' }}"
        state: directory
      delegate_to: localhost
      run_once: true
    - name: Check for kube config file
      ansible.builtin.stat:
        path: "{{ artifacts_dir }}/admin.conf"
      register: kubeconf
      delegate_to: localhost
      run_once: true
    - name: Copy kube config file for current user
      ansible.builtin.copy:
        src: "{{ artifacts_dir }}/admin.conf"
        dest: "{{ lookup('env', 'HOME') + '/.kube/config' }}"
        # Cluster-admin credentials: readable by the owner only.
        mode: "0600"
        backup: true
      when: kubeconf.stat.exists
      delegate_to: localhost
      run_once: true
  tags:
    - local

# Host drivers and toolkit unless the GPU Operator brings them (deepops_components).
- name: Install NVIDIA driver on GPU servers
  import_playbook: nvidia-software/nvidia-driver.yml
  vars:
    hostlist: "k8s_cluster"
    deepops_phase: install
  tags:
    - nvidia

# Under containerd and CRI-O the GPU Operator's toolkit configures the runtime.
- name: Install the NVIDIA Container Toolkit on GPU servers
  import_playbook: container/nvidia-container-toolkit.yml
  vars:
    hostlist: "k8s_cluster"
    deepops_phase: install
    # The device plugin's containers reach the GPUs through Docker's default runtime.
    nvidia_container_toolkit_set_as_default_runtime: true
  tags:
    - nvidia
  when: _k8s_runtime_is_docker | bool

# Manage kubectl binary -- handles cross-platform (e.g., Linux cluster -> macOS controller)
- hosts: kube_control_plane
  gather_facts: false
  vars:
    ansible_become: false
  roles:
    - role: proxy_defaults
  tasks:
    - name: Detect ansible host platform
      ansible.builtin.command: uname -sm
      register: local_uname
      delegate_to: localhost
      run_once: true
      changed_when: false
      check_mode: false  # read-only; --check needs the result

    - name: Detect remote platform
      ansible.builtin.command: uname -sm
      register: remote_uname
      run_once: true
      changed_when: false
      check_mode: false  # read-only; --check needs the result

    - name: Copy kubectl binary to ansible host (matching platform)
      ansible.builtin.fetch:
        src: "/usr/local/bin/kubectl"
        dest: "{{ artifacts_dir }}/kubectl"
        flat: true
      run_once: true
      when: local_uname.stdout == remote_uname.stdout

    - name: Ensure fetched kubectl is executable
      ansible.builtin.file:
        path: "{{ artifacts_dir }}/kubectl"
        mode: "0755"
      delegate_to: localhost
      run_once: true
      when: local_uname.stdout == remote_uname.stdout

    - name: Get kubectl version for cross-platform download
      ansible.builtin.command: /usr/local/bin/kubectl version --client -o json
      register: kubectl_ver_json
      run_once: true
      changed_when: false
      check_mode: false  # read-only; --check needs the result
      when: local_uname.stdout != remote_uname.stdout

    - name: Download kubectl for ansible host platform
      vars:
        kubectl_ver: "{{ (kubectl_ver_json.stdout | from_json).clientVersion.gitVersion }}"
        kubectl_os: "{{ 'darwin' if 'Darwin' in local_uname.stdout else 'linux' }}"
        kubectl_arch: "{{ 'arm64' if 'arm64' in local_uname.stdout or 'aarch64' in local_uname.stdout else 'amd64' }}"
      ansible.builtin.get_url:
        url: "https://dl.k8s.io/release/{{ kubectl_ver }}/bin/{{ kubectl_os }}/{{ kubectl_arch }}/kubectl"
        dest: "{{ artifacts_dir }}/kubectl"
        mode: "0755"
        force: true
        checksum: "sha256:https://dl.k8s.io/release/{{ kubectl_ver }}/bin/{{ kubectl_os }}/{{ kubectl_arch }}/kubectl.sha256"
      environment: "{{ proxy_env }}"
      register: kubectl_host_download
      until: kubectl_host_download is succeeded
      retries: 5
      delay: 10
      delegate_to: localhost
      run_once: true
      when: local_uname.stdout != remote_uname.stdout
  tags:
    - local
- hosts: k8s_cluster
  gather_facts: false
  vars:
    venv_dir: "{{ lookup('env', 'VIRTUAL_ENV') }}"
  tasks:
    - name: Check for kubectl in artifacts
      ansible.builtin.stat:
        path: "{{ artifacts_dir }}/kubectl"
      register: kubectl_local
      become: false
      delegate_to: localhost
      run_once: true
    - name: Install kubectl to virtualenv
      ansible.builtin.copy:
        src: "{{ artifacts_dir }}/kubectl"
        dest: "{{ venv_dir }}/bin/kubectl"
        mode: "0755"
      become: false
      delegate_to: localhost
      run_once: true
      when: kubectl_local.stat.exists and venv_dir != ''
    - name: Kubectl location
      ansible.builtin.debug:
        msg: >-
          {{ 'kubectl installed to ' ~ venv_dir ~ '/bin/kubectl'
             if venv_dir != ''
             else 'No virtualenv detected. kubectl is at ' ~ artifacts_dir ~ '/kubectl' }}
      delegate_to: localhost
      run_once: true
  tags:
    - local

# Remove taint from kube_control_plane nodes.
# This keeps backwards compatibility and allows a few services (monitoring/etc.) to run properly.
- hosts: kube_control_plane
  gather_facts: false
  vars:
    ansible_become: false
  tasks:
    # Kubespray installs helm on the control plane (helm_enabled); this puts the same
    # version on the admin machine, for the scripts/k8s/ deploy scripts.
    - name: Install Helm on admin node
      change_command:
        cmd: "bash {{ playbook_dir }}/../scripts/k8s/install_helm.sh"
      register: k8s_admin_helm
      changed_when: >-
        ansible_check_mode or ('is installed.' not in k8s_admin_helm.stdout)
      delegate_to: localhost
      run_once: true
    - name: Kubeadm | Remove taint for master with node role
      change_command:
        cmd: "{{ artifacts_dir }}/kubectl --kubeconfig {{ artifacts_dir }}/admin.conf taint node {{ inventory_hostname }} node-role.kubernetes.io/control-plane:NoSchedule-"
      delegate_to: localhost
      failed_when: false # Taint will not be present if kube_control_plane also under kube_node

- name: Install k8s GPU feature discovery
  import_playbook: k8s-cluster/nvidia-k8s-gpu-feature-discovery.yml
  vars:
    deepops_phase: install
  tags:
    - nvidia

- name: Install k8s GPU device plugin
  import_playbook: k8s-cluster/nvidia-k8s-gpu-device-plugin.yml
  vars:
    deepops_phase: install
  tags:
    - nvidia

- name: Install NVIDIA GPU Operator
  import_playbook: k8s-cluster/nvidia-gpu-operator.yml
  vars:
    deepops_phase: install
  tags:
    - nvidia

# The NFS server the provisioner uses (deepops_components: k8s_deploy_nfs_server on
# the first control-plane host).
- name: Set up the NFS server
  import_playbook: generic/nfs-server.yml
  vars:
    hostlist: k8s_cluster
    deepops_phase: install

- name: Setup a volume for NFS, install nfs_utils, and install NFS Helm chart
  import_playbook: k8s-cluster/nfs-client-provisioner.yml
  vars:
    deepops_phase: install

# Present where the switch and group say, removed elsewhere (deepops_components).
- name: Setup rsyslog server
  import_playbook: generic/rsyslog-server.yml
  vars:
    hostlist: k8s_cluster
    deepops_phase: install

- name: Setup rsyslog client
  import_playbook: generic/rsyslog-client.yml
  vars:
    hostlist: k8s_cluster
    deepops_phase: install

- name: Hand crashes to systemd-coredump
  import_playbook: generic/coredump.yml
  vars:
    hostlist: k8s_cluster
    deepops_phase: install

# Removal phase (docs/deepops/component-state.md): the components no longer wanted on a
# host go, in the reverse of the install order, so nothing goes from under what needs it.
- name: Remove systemd-coredump where it is no longer wanted
  import_playbook: generic/coredump.yml
  vars:
    hostlist: k8s_cluster
    deepops_phase: remove

- name: Remove the rsyslog client where it is no longer wanted
  import_playbook: generic/rsyslog-client.yml
  vars:
    hostlist: k8s_cluster
    deepops_phase: remove

- name: Remove the rsyslog server where it is no longer wanted
  import_playbook: generic/rsyslog-server.yml
  vars:
    hostlist: k8s_cluster
    deepops_phase: remove

# Only where the site lists nfs in deepops_component_removals (removal: explicit).
- name: Remove the NFS client provisioner where it is no longer wanted
  import_playbook: k8s-cluster/nfs-client-provisioner.yml
  vars:
    deepops_phase: remove

- name: Remove the NFS server where it is listed for removal
  import_playbook: generic/nfs-server.yml
  vars:
    hostlist: k8s_cluster
    deepops_phase: remove

- name: Remove the GPU Operator where it is no longer wanted
  import_playbook: k8s-cluster/nvidia-gpu-operator.yml
  vars:
    deepops_phase: remove

- name: Remove the device plugin where it is no longer wanted
  import_playbook: k8s-cluster/nvidia-k8s-gpu-device-plugin.yml
  vars:
    deepops_phase: remove

- name: Remove GPU Feature Discovery where it is no longer wanted
  import_playbook: k8s-cluster/nvidia-k8s-gpu-feature-discovery.yml
  vars:
    deepops_phase: remove

- name: Remove the NVIDIA Container Toolkit where nothing needs it
  import_playbook: container/nvidia-container-toolkit.yml
  vars:
    hostlist: k8s_cluster
    deepops_phase: remove
  tags:
    - nvidia
  when: _k8s_runtime_is_docker | bool

- name: Remove the NVIDIA driver where it is listed for removal
  import_playbook: nvidia-software/nvidia-driver.yml
  vars:
    hostlist: k8s_cluster
    deepops_phase: remove
  tags:
    - nvidia

- name: Remove the cluster container registry where it is no longer wanted
  import_playbook: container/standalone-container-registry.yml
  vars:
    hostlist: k8s_cluster
    deepops_phase: remove

# Only where the site named docker in deepops_component_removals.
- name: Remove Docker where it is no longer wanted
  import_playbook: container/docker.yml
  vars:
    hostlist: k8s_cluster
    deepops_phase: remove

# Only where the site named chrony in deepops_component_removals (the OS time sync takes over).
- name: Remove fail2ban where it is no longer wanted
  import_playbook: generic/fail2ban.yml
  vars:
    hostlist: k8s_cluster
    deepops_phase: remove

- name: Hand time sync back to the OS where chrony is no longer wanted
  import_playbook: generic/chrony-client.yml
  vars:
    deepops_phase: remove

# Last: each host records what was deployed to it (roles/deploy_record), where the next
# preview starts (scripts/deepops/settings.py diff).
- name: Record what was deployed
  hosts: k8s_cluster
  become: true
  gather_facts: false
  tags:
    - always
  roles:
    - role: deploy_record
      deploy_record_name: k8s-cluster
