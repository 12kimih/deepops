---
- hosts: all
  become: true
  roles:
    - role: proxy_defaults
  tasks:
    - name: Include NVIDIA DGX role
      ansible.builtin.include_role:
        name: nvidia-dgx
  environment: "{{ proxy_env }}"
  post_tasks:
    - name: Record what this play deployed
      ansible.builtin.include_role:
        name: component_record
        tasks_from: sources
      vars:
        component_record_sources_also: [nvidia-dgx]
