# Installs NVIDIA DOCA-OFED (the successor to MLNX_OFED): the kernel drivers,
# libraries and tools for high-speed networking with InfiniBand or RoCE on NVIDIA
# networking adapters.
#
# This playbook automates the host installation outlined in the DOCA documentation:
# https://docs.nvidia.com/doca/sdk/doca-host-installation-and-upgrade/index.html
---
- hosts: "{{ hostlist | default('all') }}"
  become: true
  roles:
    - mofed
