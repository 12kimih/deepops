---
# Rolling maintenance upgrade (roles/maintenance): one node at a time, drain it in
# Slurm and wait for its jobs, upgrade every package (the kernel, systemd, libc, GPU
# and scheduler stacks that unattended upgrades hold back included), reboot if the
# upgrade asks for it, check slurmd, the GPUs, DCGM and NHC, and resume the node. A failed
# node stops the run with that node still drained.
#
#   ansible-playbook -K playbooks/utilities/apt-upgrade.yml                  # compute nodes
#   ansible-playbook -K playbooks/utilities/apt-upgrade.yml -e hostlist=master
#     (run from master itself, it is upgraded and checked but not rebooted: the
#     reboot would end the run; `sudo systemctl reboot` afterwards if it asks for one)
#   -e maintenance_serial=2           nodes per batch (default 1)
#   -e maintenance_force_reboot=true  reboot every node, needed or not
#
# A node that was already drained (by an admin or a health check) is upgraded but left
# drained. Run it at least monthly: security fixes to the held-back stacks only land
# here.
#
# A last play compares the upgraded hosts (fleet-consistency.yml) and fails on any
# kernel, package or kernel-policy difference left between them, and on a host left
# running other than what it has installed (a reboot or driver reload still pending).
- hosts: "{{ hostlist | default('slurm-node') }}"
  become: true
  serial: "{{ maintenance_serial | default(1) }}"
  max_fail_percentage: 0
  tags:
    - apt-upgrade
  tasks:
    - name: Take the node out, upgrade it and put it back
      ansible.builtin.include_role:
        name: maintenance
        public: true
        tasks_from: run
      vars:
        maintenance_steps: "{{ ['drain', 'upgrade', 'reboot', 'verify', 'resume'] if inventory_hostname in groups['slurm-node'] | default([])
                              else ['upgrade', 'reboot', 'verify'] }}"

- hosts: "{{ hostlist | default('slurm-node') }}"
  become: true
  gather_facts: false
  tags:
    - apt-upgrade
  tasks:
    - name: Check the upgraded hosts are level
      ansible.builtin.include_role:
        name: maintenance
        public: true
        tasks_from: consistency
