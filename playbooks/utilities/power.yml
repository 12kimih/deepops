---
# Out-of-band chassis power control, reaching a node whose OS is gone. The work lives in
# the bmc role so that it and this share one set of bmc_* variables.
#
#   -e bmc_power_action=status|on|off|cycle|reset|soft|diag   (default status)
#   -e hostlist=...                                          target a subset
- hosts: "{{ hostlist | default('all') }}"
  gather_facts: false
  tags:
    - power
  pre_tasks:
    # Anything but status acts on every BMC it reaches, the controller and the NFS
    # servers too: name the hosts.
    - name: Require hostlist for a power action
      ansible.builtin.assert:
        that: hostlist is defined or bmc_power_action is not defined or bmc_power_action == 'status'
        fail_msg: "-e bmc_power_action={{ bmc_power_action }} needs -e hostlist=... naming the hosts."
        quiet: true
      run_once: true
  tasks:
    - name: Drive chassis power
      ansible.builtin.include_role:
        name: bmc
        tasks_from: power.yml
      tags:
        - power
