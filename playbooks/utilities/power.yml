---
# Out-of-band chassis power control, reaching a node whose OS is gone. The work lives in
# the bmc role so that it and this share one set of bmc_* variables.
#
#   -e bmc_power_action=status|on|off|cycle|reset|soft|diag   (default status)
#   -e hostlist=...                                          target a subset
- hosts: "{{ hostlist | default('all') }}"
  gather_facts: false
  tags:
    - power
  tasks:
    - name: Drive chassis power
      ansible.builtin.include_role:
        name: bmc
        tasks_from: power.yml
      tags:
        - power
