---
- hosts: slurm-node
  become: true
  tasks:
    - name: Install custom facts
      ansible.builtin.include_role:
        name: facts

    # Transient unit: the ssh service may hide the GPUs (DeviceAllow). -acp is
    # deprecated in current drivers and treated as a no-op.
    - name: Set GPU clocks permissions
      ansible.builtin.command: >-
        systemd-run --wait --pipe --collect --quiet --
        nvidia-smi -acp UNRESTRICTED
      changed_when: false
      when:
        - ansible_facts.local['gpus']['count']
  environment: "{{ proxy_env if proxy_env is defined else {} }}"
