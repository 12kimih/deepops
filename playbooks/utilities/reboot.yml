---
# Reboot the targeted hosts and wait for them to return (roles/maintenance, reboot
# step: shared filesystems are detached first).
#
#   -e hostlist=...              target a subset
#   -e reboot_serial=N           rolling batch size (default 100%)
#   -e reboot_timeout=N          seconds to wait for a node (default 1800)
#   -e reboot_detach_nfs=false   skip the pre-reboot unmount
#
# To take nodes out of Slurm first and check them afterwards, use apt-upgrade.yml
# (with -e maintenance_force_reboot=true for a reboot without upgrading anything new).
- hosts: "{{ hostlist | default('all') }}"
  become: true
  serial: "{{ reboot_serial | default('100%') }}"
  tags:
    - reboot
  tasks:
    - name: Reboot
      ansible.builtin.include_role:
        name: maintenance
        tasks_from: reboot
      vars:
        maintenance_force_reboot: true
        maintenance_detach_nfs: "{{ reboot_detach_nfs | default(true) }}"
        maintenance_reboot_timeout: "{{ reboot_timeout | default(1800) }}"
        maintenance_reason: reboot
