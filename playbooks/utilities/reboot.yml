---
# Reboot the targeted hosts and wait for them to return.
#
#   -e hostlist=...              target a subset
#   -e reboot_serial=N           rolling batch size (default 100%)
#   -e reboot_timeout=N          seconds to wait for a node (default 1800)
#   -e reboot_detach_nfs=false   skip the pre-reboot unmount
- hosts: "{{ hostlist | default('all') }}"
  become: true
  serial: "{{ reboot_serial | default('100%') }}"
  tags:
    - reboot
  vars:
    # ansible.cfg inherits ConnectionAttempts=100 from kubespray, which lets one SSH
    # probe block for the whole reboot_timeout. The reboot module only re-checks its
    # deadline between probes, so it never sees the node come back. ServerAliveInterval
    # drops a control master the reboot left stale.
    ansible_ssh_args: >-
      -o ControlMaster=auto -o ControlPersist=5m
      -o ServerAliveInterval=10 -o ServerAliveCountMax=3
      -o UserKnownHostsFile=/dev/null
  pre_tasks:
    # Lets the whole cluster reboot in one batch: a node holding a hard mount from a
    # peer that goes down with it blocks in D state and never reaches the reboot. The
    # nfs role installs the same detach as a shutdown unit; this covers nodes without it.
    - name: Detach the shared filesystems before the reboot
      ansible.builtin.shell:
        cmd: |
          # Triggers first, or the umount re-arms a mount against a dying server.
          systemctl stop '*.automount' 2>/dev/null || true
          umount -l -f -a -t nfs,nfs4 2>/dev/null || true
          exit 0
      changed_when: false
      when: reboot_detach_nfs | default(true) | bool
      tags:
        - reboot

  tasks:
    - name: Reboot and wait for the host to come back
      ansible.builtin.reboot:
        msg: "Reboot initiated by Ansible"
        pre_reboot_delay: 5
        post_reboot_delay: 15
        # A GPU server can spend several minutes in POST and memory training.
        reboot_timeout: "{{ reboot_timeout | default(1800) }}"
        connect_timeout: 5
