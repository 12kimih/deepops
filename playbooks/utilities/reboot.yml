---
# Reboot the targeted hosts one at a time and wait for each to return
# (roles/maintenance, reboot step: shared filesystems are detached first). A Slurm
# compute node is refused unless it is drained or down.
#
#   -e hostlist=...              target a subset
#   -e reboot_serial=N           reboot N hosts at a time (default 1)
#   -e maintenance_reboot_timeout=N    seconds to wait for a node (roles/maintenance)
#   -e maintenance_detach_nfs=false    skip the pre-reboot unmount
#   -e maintenance_reboot_undrained=true   reboot compute nodes that still take jobs
#
# To take nodes out of Slurm first and check them afterwards, use apt-upgrade.yml
# (with -e maintenance_force_reboot=true for a reboot without upgrading anything new).
- hosts: "{{ hostlist | default('all') }}"
  become: true
  serial: "{{ reboot_serial | default(1) }}"
  max_fail_percentage: 0  # a node that fails to come back stops the rest
  tags:
    - reboot
  pre_tasks:
    # The default would take in the controller and the NFS servers the clients hang on.
    - name: Require hostlist
      ansible.builtin.assert:
        that: hostlist is defined
        fail_msg: Name the hosts to reboot with -e hostlist=...
        quiet: true
      run_once: true
  tasks:
    - name: Reboot
      ansible.builtin.include_role:
        name: maintenance
        public: true
        tasks_from: reboot
      vars:
        maintenance_force_reboot: true
        maintenance_reason: reboot
