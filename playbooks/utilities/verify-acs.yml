---
# Report GPU peer-to-peer readiness on the compute nodes, read-only:
#   1. PCIe ACS is off on every device (roles/pcie_acs's program, as NHC runs it) and
#      its boot unit is enabled.
#   2. The IOMMU: BIOS VT-d (the DMAR ACPI table) and the kernel setting in effect.
# The play fails only where ACS is on; the IOMMU section is for reading.
#
#   ansible-playbook -K playbooks/utilities/verify-acs.yml [-e hostlist=...]
- hosts: "{{ hostlist | default('slurm-node') }}"
  become: true
  gather_facts: false
  tags:
    - nvidia
    - verify-acs
  roles:
    - role: deepops_paths  # pcie_acs_program, pcie_acs_service
  tasks:
    - name: Look for the ACS program
      ansible.builtin.stat:
        path: "{{ pcie_acs_program }}"
      register: acs_program

    - name: Require roles/pcie_acs
      ansible.builtin.assert:
        that: acs_program.stat.exists
        fail_msg: >-
          {{ pcie_acs_program }} is missing: PCIe ACS is not managed on this host
          (slurm_disable_pcie_acs, playbooks/generic/pcie-acs.yml).
        quiet: true

    - name: Read the devices with ACS on
      ansible.builtin.command:
        argv: ["{{ pcie_acs_program }}", check]
      register: acs_state
      changed_when: false
      failed_when: false
      check_mode: false  # read-only; --check needs the result

    - name: Read the boot unit's state
      ansible.builtin.command:
        argv: [systemctl, is-enabled, "{{ pcie_acs_service }}"]
      register: acs_unit
      changed_when: false
      failed_when: false
      check_mode: false  # read-only; --check needs the result

    - name: Look for BIOS VT-d (the DMAR ACPI table)
      ansible.builtin.stat:
        path: /sys/firmware/acpi/tables/DMAR
        get_checksum: false
        get_mime: false
        get_attributes: false
      register: dmar_table

    - name: Read the kernel IOMMU setting in effect
      ansible.builtin.shell: |
        set -o pipefail
        cmd=$(cat /proc/cmdline)
        intel=$(printf '%s' "$cmd" | grep -o 'intel_iommu=[^ ]*' || true)
        amd=$(printf '%s' "$cmd" | grep -o 'amd_iommu=[^ ]*' || true)
        mode=$(printf '%s' " $cmd" | grep -oE ' iommu=[^ ]*' | tr -d ' ' || true)
        groups=$(ls /sys/kernel/iommu_groups/ 2>/dev/null | wc -l)
        printf '%s %s %s groups=%s' "${intel:-intel_iommu=unset}" "${amd:-}" "${mode:-}" "$groups"
      args:
        executable: /bin/bash
      register: iommu_kernel
      changed_when: false
      check_mode: false  # read-only; --check needs the result

    - name: Report
      ansible.builtin.debug:
        msg:
          - "PCIe ACS: {{ acs_state.stdout | default('', true) or 'off on every device' }}"
          - "{{ pcie_acs_service }}: {{ acs_unit.stdout }}"
          - "VT-d in BIOS (DMAR table): {{ 'on' if dmar_table.stat.exists else 'off' }}"
          - "kernel IOMMU: {{ iommu_kernel.stdout | trim }}"

    - name: Fail where ACS is on or will not be turned off at boot
      ansible.builtin.assert:
        that:
          - acs_state.rc == 0
          - acs_unit.stdout == 'enabled'
        fail_msg: >-
          GPU peer-to-peer is degraded or will be after a reboot (see the report);
          rerun playbooks/generic/pcie-acs.yml.
        quiet: true
