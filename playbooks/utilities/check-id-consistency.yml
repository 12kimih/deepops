---
# Verify that every cluster group (directory_groups_all, roles/directory_defaults) resolves
# to its pinned GID on every node, whichever directory publishes it (NIS or LDAP).
# Read-only; changes nothing. Fails the play on the first mismatch so it can gate a
# maintenance run.
#
#   ansible-playbook playbooks/utilities/check-id-consistency.yml
#
# WHY THIS INVARIANT MATTERS
# Slurm resolves a job's supplementary groups on the submit/controller node and ships
# the resulting NUMERIC GID list into the job (send_gids, on by default since 20.11).
# The compute node never re-resolves the names -- it renders those numbers through its
# own group database. NFS with AUTH_SYS does the same with UIDs. So when two nodes
# disagree about what a number means, access does NOT fail closed: the job silently
# holds whatever group that number happens to name on the compute node.
#
# The same asymmetry makes `usermod -aG <group> <user>` on a compute node a no-op
# inside jobs -- that node's group file is never consulted for job credentials. Groups
# that must be meaningful inside a job therefore have to be published by the directory
# with a pinned GID. This playbook checks that it took effect on every node.
- hosts: "{{ hostlist | default('all') }}"
  become: false
  gather_facts: false
  tags:
    - check-id-consistency
  roles:
    - role: directory_defaults  # directory_groups_all
  tasks:
    - name: Skip when the directory publishes no groups
      ansible.builtin.meta: end_host
      when: (directory_groups_all | length) == 0

    - name: Resolve each published group on this node
      ansible.builtin.getent:
        database: group
        key: "{{ item.name }}"
        fail_key: false
      loop: "{{ directory_groups_all }}"
      loop_control:
        label: "{{ item.name }}"
      register: check_id_resolved

    # `fail_key: false` reports a missing group as a null value rather than an error,
    # so coerce it to an empty list and length-check before indexing -- assert stops at
    # the first false condition, which keeps the missing case a clean failure message
    # instead of a template error.
    - name: Assert each published group resolves to its pinned GID
      vars:
        check_id_entry: "{{ (item.ansible_facts.getent_group | default({})).get(item.item.name) or [] }}"
      ansible.builtin.assert:
        that:
          - (check_id_entry | length) >= 2
          - (check_id_entry[1] | int) == (item.item.gid | int)
        fail_msg: >-
          Group '{{ item.item.name }}' does not resolve to gid {{ item.item.gid }} on
          {{ inventory_hostname }}
          (got {{ (check_id_entry | length >= 2) | ternary(check_id_entry[1] | default(''), 'no such group') }}).
          Either the directory has not published it yet (NIS: `make -C /var/yp` on the
          master; LDAP: a deploy, then `sss_cache -E` here), this node does not reach
          its directory (`ypwhich`, `sssctl domain-status cluster`), or a LOCAL group of
          the same name shadows the directory's -- nsswitch resolves `files` first.
        success_msg: "{{ item.item.name }} = gid {{ item.item.gid }}"
      loop: "{{ check_id_resolved.results }}"
      loop_control:
        label: "{{ item.item.name }}"
