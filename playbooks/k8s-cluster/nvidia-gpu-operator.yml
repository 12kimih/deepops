---
# A cluster's Helm release, decided on the first control-plane host: present where
# deepops_components says so, removed where it says absent.

# GPU operator
- hosts: kube_control_plane[0]
  become: true
  roles:
    - role: deploy_defaults
  tasks:
    - name: Install helm chart for GPU operator
      ansible.builtin.include_role:
        name: nvidia-gpu-operator
        public: true
      vars:
        gpu_operator_state: "{{ deepops_components.gpu_operator | component_phase(deepops_phase) }}"
      run_once: true
  environment: "{{ proxy_env }}"
  tags:
    - nvidia
    - nvidia-gpu-operator
  post_tasks:
    - name: Record what this play deployed
      ansible.builtin.include_role:
        name: component_record
        tasks_from: sources
      vars:
        component_record_sources_also: [nvidia-gpu-operator]
