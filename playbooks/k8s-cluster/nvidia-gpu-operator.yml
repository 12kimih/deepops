---

# GPU operator
- hosts: kube_control_plane[0]
  become: true
  roles:
    - role: deploy_defaults
  tasks:
    - name: Install helm chart for GPU operator
      ansible.builtin.include_role:
        name: nvidia-gpu-operator
        public: true
      run_once: true
  environment: "{{ proxy_env if proxy_env is defined else {} }}"
  tags:
    - nvidia
    - nvidia-gpu-operator
