---
# This playbook is used to setup the nfs-client-provisioner
# The NFS server itself (kube_control_plane[0] by default) is playbooks/generic/nfs-server.yml,
#   which k8s-cluster.yml imports before this. If the cluster already has one, set
#   k8s_deploy_nfs_server: false (and k8s_nfs_mkdir: false when the export directory already
#   exists) and point k8s_nfs_server/k8s_nfs_export_path at it.
# This makes the export directory, installs nfs software on all nodes, and helm installs the
#   nfs-client-provisioner using the role
#
# The default NFS configuration of this playbook is not meant for production systems
#   For production deployments please configure NFS with storage-partner guidance
#
# Install the required NFS software on all nodes and then helm install the nfs-client
- hosts: kube_control_plane[0]
  become: true
  roles:
    - role: deploy_defaults
  tasks:
    - name: Make sure NFS directory exists and is globally writable
      ansible.builtin.file:
        path: "{{ k8s_nfs_export_path }}"
        state: directory
        mode: "u=rwx,g=rwx,o=rwx"
      when: k8s_nfs_mkdir and k8s_deploy_nfs_server
      tags:
        - nfs_mkdir

# What a kubelet needs to mount the provisioner's volumes.
- hosts: "k8s_cluster"
  become: true
  roles:
    - role: deploy_defaults
  tasks:
    - name: Install the NFS utilities
      ansible.builtin.include_role:
        name: nfs_common
        tasks_from: install
  tags:
    - nfs_software

- hosts: kube_control_plane[0]
  become: true
  roles:
    - role: deploy_defaults
  tasks:
    - name: Install nfs-client-provisioner
      ansible.builtin.include_role:
        name: nfs-client-provisioner
        public: true
      vars:
        k8s_nfs_client_state: "{{ deepops_components.k8s_nfs_client | component_phase(deepops_phase) }}"
  environment: "{{ proxy_env }}"
  post_tasks:
    - name: Record what this play deployed
      ansible.builtin.include_role:
        name: component_record
        tasks_from: sources
      vars:
        component_record_sources_also: [nfs-client-provisioner]
