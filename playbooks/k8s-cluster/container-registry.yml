---
- hosts: kube_control_plane
  become: true
  tasks:
    - name: Install helm chart for container registry
      ansible.builtin.include_role:
        name: k8s-internal-container-registry
        public: true  # its own settings reach the helm_release role it includes
      run_once: true
  tags:
    - container-registry

- hosts: kube_node
  become: true
  roles:
    - role: deploy_defaults  # container_registry_hostname
  tasks:
    - name: Set registry hostname in /etc/hosts
      ansible.builtin.lineinfile:
        path: /etc/hosts
        line: "{{ hostvars[groups['kube_control_plane'][0]]['ansible_host'] | default(hostvars[groups['kube_control_plane'][0]]['ansible_facts']['default_ipv4']['address'])
          }} {{ container_registry_hostname }}"
  tags:
    - container-registry
