---
# A cluster's Helm release, decided on the first control-plane host: present where
# deepops_components says so, removed where it says absent.
- hosts: kube_control_plane[0]
  become: true
  roles:
    - role: deploy_defaults
  tasks:
    - name: Install k8s GPU plugin
      ansible.builtin.include_role:
        name: nvidia-k8s-gpu-device-plugin
      vars:
        k8s_gpu_plugin_state: "{{ deepops_components.k8s_gpu_plugin | component_phase(deepops_phase) }}"
      run_once: true
  environment: "{{ proxy_env }}"
  tags:
    - k8s_gpu_device_plugin
  post_tasks:
    - name: Record what this play deployed
      ansible.builtin.include_role:
        name: component_record
        tasks_from: sources
      vars:
        component_record_sources_also: [nvidia-k8s-gpu-device-plugin]
