---
# A cluster's Helm release, decided on the first control-plane host: present where
# deepops_components says so, removed where it says absent.
- hosts: kube_control_plane[0]
  become: true
  roles:
    - role: deploy_defaults
  tasks:
    - name: Install k8s GPU feature discovery
      ansible.builtin.include_role:
        name: nvidia-k8s-gpu-feature-discovery
      vars:
        k8s_gpu_feature_discovery_state: "{{ deepops_components.k8s_gpu_feature_discovery | component_phase(deepops_phase) }}"
      run_once: true
  environment: "{{ proxy_env }}"
  tags:
    - k8s_gpu_feature_discovery
