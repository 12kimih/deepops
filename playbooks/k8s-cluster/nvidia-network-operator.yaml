---
## Playbook for installing nvidia-network-operator
#
- hosts: kube_control_plane[0]
  become: true
  tasks:
    - name: Put the NVIDIA Network Operator in its desired state
      ansible.builtin.include_role:
        name: nvidia-network-operator
        public: true
  post_tasks:
    - name: Record what this play deployed
      ansible.builtin.include_role:
        name: component_record
        tasks_from: sources
      vars:
        component_record_sources_also: [nvidia-network-operator]
