---
# The Open OnDemand web portal: present on the Slurm controller when
# slurm_install_open_ondemand is on (deepops_components), removed from every other host
# this runs on.
- hosts: "{{ hostlist | default('slurm-cluster') }}"
  become: true
  roles:
    - role: deploy_defaults
    - role: open_ondemand
      open_ondemand_state: "{{ deepops_components.open_ondemand | component_phase(deepops_phase) }}"
