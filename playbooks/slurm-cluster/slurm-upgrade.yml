---
# Upgrade Slurm to slurm_version in the order Slurm requires
# (https://slurm.schedmd.com/upgrades.html), and replace the retired source build with
# the packages on the way:
#
#   0. the controller: create the site's missing secret files (site-secrets.yml)
#   1. every host: refuse a downgrade or a jump of more than slurm_upgrade_max_majors
#   2. build and publish the packages (slurm-master[0])
#   3. controllers: a backup now (roles/slurm_backup), stop slurmctld and slurmdbd,
#      install, start slurmdbd (it converts the database first) then slurmctld; check
#      scontrol, sacct and job_submit
#   4. compute nodes, maintenance_serial at a time: drain and wait for their jobs,
#      install (pyxis comes with Slurm) and restart slurmd, check the node, resume it
#   5. the other hosts (login): install, sackd
#   6. every slurmd reports the new version
#
# A failed node stops the run with that node still drained. Nothing can go back once a
# daemon has started: the way back is the backup (docs/slurm-cluster/slurm-upgrade.md).
#
#   ansible-playbook -K playbooks/slurm-cluster/slurm-upgrade.yml
#   -e maintenance_serial=2        compute nodes per batch (default 1)
#   -e maintenance_drain_timeout=N seconds to wait for a node's jobs (default 86400)
- name: Create the missing site secrets
  import_playbook: site-secrets.yml

- hosts: all
  become: true
  roles:
    - role: facts

- hosts: slurm-cluster
  become: true
  any_errors_fatal: true
  tasks:
    - name: Check the version change is one Slurm supports
      ansible.builtin.include_role:
        name: slurm
        public: true
        tasks_from: version
      vars:
        slurm_upgrade: true

    # Slurm's order starts at the controllers, and the packages build on the first;
    # a --limit without them would upgrade nodes past their slurmctld, or install
    # packages never built (after draining the nodes and removing their old Slurm).
    - name: Refuse a limited run without the controllers
      ansible.builtin.assert:
        that: groups['slurm-master'] | difference(ansible_play_hosts_all) | length == 0
        fail_msg: >-
          The upgrade must include the controllers ({{ groups['slurm-master'] | join(', ') }}):
          widen --limit to them.
        quiet: true
      run_once: true

# The packages build in a container there (roles/slurm/tasks/packages-build.yml).
- name: Install Docker on the package build host
  import_playbook: ../container/docker.yml
  vars:
    hostlist: slurm-master[0]
    deepops_phase: require  # the build needs it whatever the cluster map says

- hosts: slurm-master[0]
  become: true
  any_errors_fatal: true
  tasks:
    - name: Build and publish the Slurm packages
      ansible.builtin.include_role:
        name: slurm
        public: true
        tasks_from: packages-build

# slurmdbd, then slurmctld; slurmd keeps running jobs meanwhile (SlurmdTimeout bounds
# how long slurmctld may be away).
- hosts: slurm-master
  become: true
  serial: 1
  any_errors_fatal: true
  tasks:
    - name: Back up the controller now
      ansible.builtin.include_role:
        name: slurm_backup
        public: true
        tasks_from: now
      when: inventory_hostname == groups['slurm-master'][0]

    - name: Stop slurmctld and slurmdbd for the upgrade
      systemd_unit:
        name: "{{ item }}"
        state: stopped
      loop: [slurmctld, slurmdbd]
      failed_when: false
      when: not ansible_check_mode

    - name: Upgrade the controller
      ansible.builtin.include_role:
        name: slurm
        public: true
      vars:
        slurm_upgrade: true

    - name: Check the controller
      ansible.builtin.include_role:
        name: slurm
        public: true
        tasks_from: upgrade-verify
      when: not ansible_check_mode

- hosts: slurm-node
  become: true
  serial: "{{ maintenance_serial | default(1) }}"
  max_fail_percentage: 0
  roles:
    - role: deploy_defaults
  tasks:
    - name: Drain the node and upgrade its slurmd
      ansible.builtin.include_role:
        name: maintenance
        public: true
        tasks_from: run
      vars:
        maintenance_reason: "maintenance: slurm upgrade"
        maintenance_role: slurm
        maintenance_steps: "{{ ['role'] if inventory_hostname in groups['slurm-master'] else ['drain', 'role'] }}"
        slurm_upgrade: true

    - name: Check the node and return it to Slurm
      ansible.builtin.include_role:
        name: maintenance
        public: true
        tasks_from: run
      vars:
        maintenance_reason: "maintenance: slurm upgrade"
        maintenance_steps: [verify, resume]

# Login and other client hosts last, as Slurm's upgrade order has it.
- hosts: slurm-cluster:!slurm-master:!slurm-node
  become: true
  roles:
    - role: deploy_defaults
  tasks:
    - name: Upgrade the client host
      ansible.builtin.include_role:
        name: slurm
        public: true
      vars:
        slurm_upgrade: true


# The check that every slurmd now runs slurm_version.
- hosts: slurm-master
  become: true
  roles:
    - role: deploy_defaults
  tasks:
    - name: Check every slurmd runs slurm_version
      ansible.builtin.include_role:
        name: slurm
        public: true
        tasks_from: upgrade-nodes
      when: not ansible_check_mode
