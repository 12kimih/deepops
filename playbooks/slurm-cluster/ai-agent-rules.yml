---
# Give AI coding agents on every node the site's agent rules (roles/ai_agent_rules).
# No-op until ai_agent_rules_url and its pinned ai_agent_rules_sha256 are set.
- hosts: "{{ hostlist | default('slurm-cluster') }}"
  become: true
  tags:
    - ai-agent-rules
  roles:
    - role: proxy_defaults
    - ai_agent_rules
  environment: "{{ proxy_env }}"
  post_tasks:
    - name: Record what this play deployed
      ansible.builtin.include_role:
        name: component_record
        tasks_from: sources
