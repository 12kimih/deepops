# Install EasyBuild and build software modules with it.
#
#   ansible-playbook playbooks/slurm-cluster/easybuild-modules.yml
#
# Lmod is the deploy's (slurm_install_lmod), with EasyBuild's module tree on its path
# everywhere. EasyBuild and its builds go once on the host that owns the shared tree:
# slurm-master[0] unless you pass -e hostlist=<host> (group_vars cannot pick a play's
# hosts).
---
# Lmod as the deploy has it (slurm_install_lmod, deepops_components).
- name: Lmod on every node
  import_playbook: lmod.yml
  vars:
    deepops_phase: install

- name: Install EasyBuild and build easybuild_packages on the software-tree host
  hosts: "{{ hostlist | default('slurm-master[0]') }}"
  become: true
  roles:
    - easy-build-packages
