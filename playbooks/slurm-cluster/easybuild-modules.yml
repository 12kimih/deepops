# Install EasyBuild and build software modules with it.
#
#   ansible-playbook playbooks/slurm-cluster/easybuild-modules.yml
#
# Lmod goes on every node, so EasyBuild's module tree is found everywhere. EasyBuild and
# its builds go once on the host that owns the shared tree: slurm-master[0] unless you
# pass -e hostlist=<host> (group_vars cannot pick a play's hosts).
---
- name: Ensure Lmod is present on all nodes
  hosts: "{{ hostlist | default('all') }}"
  become: true
  roles:
    - lmod

- name: Install EasyBuild and build easybuild_packages on the software-tree host
  hosts: "{{ hostlist | default('slurm-master[0]') }}"
  become: true
  roles:
    - easy-build-packages
