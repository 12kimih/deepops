---
# EasyBuild and the easyconfigs in easybuild_packages, built into the shared software
# tree (roles/easy-build).
#
#   ansible-playbook -K playbooks/slurm-cluster/easybuild-modules.yml
#
# Every host it runs on converges to deepops_components: present on the first
# slurm-master while slurm_install_easybuild is on (it owns the shared tree, so the
# modules are on every node), absent elsewhere (EasyBuild itself goes only from the host
# that installed it; what it built stays). Users see the modules through Lmod
# (slurm-cluster/lmod.yml).
- name: EasyBuild in the shared software tree
  hosts: "{{ hostlist | default('slurm-cluster') }}"
  become: true
  roles:
    - role: deploy_defaults
    - role: easy-build
      easybuild_state: "{{ deepops_components.easybuild | component_phase(deepops_phase) }}"
  environment: "{{ proxy_env }}"
  post_tasks:
    - name: Record what this play deployed
      ansible.builtin.include_role:
        name: component_record
        tasks_from: sources
