---
# Create the Slurm secret files the site config lacks (roles/site_secrets), on the
# controller, before any play needs them. It never replaces an existing file, so it
# runs first in every playbook that deploys Slurm, behind no switch.
#
# The play targets the Slurm hosts but touches none (no facts, every task delegated
# to localhost once): the file paths come from inventory_dir and the slurm-cluster
# group_vars, which the implicit localhost does not get.
- name: Create the missing site secrets
  hosts: slurm-cluster
  gather_facts: false
  become: false
  tags:
    - always
  roles:
    - role: slurm_paths
    - role: site_secrets
      site_secrets: "{{ slurm_site_secrets }}"
