---
# Create the Slurm secret files the site config lacks (roles/site_secrets), on the
# controller, before any play needs them. It never replaces an existing file, so it
# runs first in every playbook that deploys Slurm, behind no switch.
#
# The play targets the Slurm hosts, not localhost: the file paths come from
# inventory_dir and the slurm-cluster group_vars, which the implicit localhost does not
# get. It touches a host only to look for (and read) a key it already holds, when the
# site config lacks that file; everything is written on the controller.
- name: Create the missing site secrets
  hosts: slurm-cluster
  gather_facts: false
  become: false
  tags:
    - always
  roles:
    - role: slurm_paths
    - role: site_secrets
      site_secrets: "{{ slurm_site_secrets }}"
      site_secrets_adopt_from: "{{ (groups['slurm-master'] | default([]))[:1] | join }}"
  post_tasks:
    - name: Record what this play deployed
      ansible.builtin.include_role:
        name: component_record
        tasks_from: sources
