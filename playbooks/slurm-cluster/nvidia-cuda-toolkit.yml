---
# NVIDIA CUDA toolkits from the official runfiles in the shared software tree, each
# minor an Lmod module on every node (roles/nvidia_cuda_toolkit). The driver is never
# touched (runfile --toolkit only).
#
#   ansible-playbook -K playbooks/slurm-cluster/nvidia-cuda-toolkit.yml
#
# Every host it runs on converges to deepops_components: present on the first
# slurm-master while slurm_install_cuda_toolkit is on (it owns the shared tree, so
# `module avail cuda` lists them everywhere), absent elsewhere (the tree goes only
# from the host that installed it). Which toolkits: cuda_toolkit_oldest and the
# driver branch (roles/nvidia_cuda_toolkit/defaults/main.yml). Users see them through
# Lmod (slurm-cluster/lmod.yml), which reads the tree they land in.
- name: CUDA toolkits in the shared software tree
  hosts: "{{ hostlist | default('slurm-cluster') }}"
  become: true
  roles:
    - role: deploy_defaults
    - role: nvidia_cuda_toolkit
      cuda_toolkit_state: "{{ deepops_components.cuda_toolkit | component_phase(deepops_phase) }}"
  environment: "{{ proxy_env }}"
  post_tasks:
    - name: Record what this play deployed
      ansible.builtin.include_role:
        name: component_record
        tasks_from: sources
