---
# The removal phase installs nothing.
- name: Install docker
  import_playbook: ../container/docker.yml
  when: deepops_phase != 'remove'

# Every host it runs on converges: present where deepops_components says so (the
# switch and the target group, roles/deploy_defaults/vars/main.yml), removed elsewhere.
- hosts: "{{ hostlist | default('slurm-cluster') }}"
  become: true
  roles:
    - role: deploy_defaults
    - role: prometheus-slurm-exporter
      slurm_exporter_state: "{{ deepops_components.slurm_exporter | component_phase(deepops_phase) }}"
  tags: ['slurm-exporter', 'monitoring']
