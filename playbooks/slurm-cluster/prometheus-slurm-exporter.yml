---
- name: Install docker
  import_playbook: ../container/docker.yml

- hosts: "{{ hostlist | default('slurm-metric') }}"
  become: true
  roles:
    - role: deploy_defaults
  tasks:
    - name: Configure prometheus slurm exporter
      ansible.builtin.include_role:
        name: prometheus-slurm-exporter
        public: true
