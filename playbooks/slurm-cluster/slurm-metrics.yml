---
# Slurm data Slurm's own metrics lack (GPU allocation), for node_exporter on the
# controller, and its dashboard.
- hosts: "{{ hostlist | default('slurm-metric') }}"
  become: true
  roles:
    - role: deploy_defaults
  tasks:
    - name: Configure Slurm metrics
      ansible.builtin.include_role:
        name: slurm_metrics
        public: true
