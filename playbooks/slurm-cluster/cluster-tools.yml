---
# Publish the site's own commands, shell defaults and login banner on every node.
#
# The commands land in PATH as executables and the defaults in /etc/profile.d, so they
# reach job scripts and `ssh <node> <cmd>` as well as an interactive prompt. Each piece
# is opt-in through its own cluster_tools_* variable in config/group_vars. With
# slurm_install_cluster_tools off (deepops_components) everything is withdrawn.
- hosts: "{{ hostlist | default('slurm-cluster') }}"
  become: true
  tags:
    - cluster-tools
  roles:
    - role: proxy_defaults
    - role: deploy_defaults
    # The administrators' exemption from the login limits comes from the roster.
    - role: cluster_tools
      tags: [people]
      cluster_tools_state: "{{ deepops_components.cluster_tools | component_phase(deepops_phase) }}"
  environment: "{{ proxy_env }}"
