---
# The exporter runs in a container on the GPU nodes; the driver is nvidia-driver.yml's
# (run it first; slurm-cluster.yml does).
# Run alone it brings the Docker it needs; a deploy imports Docker itself, before it.
- name: Install docker
  import_playbook: ../container/docker.yml
  when: deepops_phase == 'converge'

- name: Install the NVIDIA Container Toolkit
  import_playbook: ../container/nvidia-docker.yml
  when: deepops_phase != 'remove'

# Every host it runs on converges: present where deepops_components says so (the
# switch and the target group, roles/deploy_defaults/vars/main.yml), removed elsewhere.
- hosts: "{{ hostlist | default('slurm-cluster') }}"
  become: true
  pre_tasks:
    - name: Install custom facts module
      ansible.builtin.include_role:
        name: facts
    - name: Set GPU fact
      ansible.builtin.set_fact:
        has_gpus: true
      when: ansible_facts.ansible_local['gpus']['count'] | int > 0
  roles:
    - role: deploy_defaults
    - role: nvidia-dcgm-exporter
      dcgm_exporter_state: "{{ deepops_components.dcgm_exporter | component_phase(deepops_phase) }}"
  tags: [dcgm-exporter, monitoring]
