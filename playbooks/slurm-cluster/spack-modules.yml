# Deploy the Spack package manager
---
# Lmod as the deploy has it (slurm_install_lmod, deepops_components).
- name: Lmod on every node
  import_playbook: lmod.yml
  vars:
    deepops_phase: install

# Spack's module tree on every node's module path.
- hosts: "{{ hostlist | default('all') }}"
  become: true
  tasks:
    - name: Register the Spack module tree
      ansible.builtin.include_role:
        name: spack
        tasks_from: register

# The shared instance, installed once.
- hosts: "{{ hostlist | default('slurm-master[0]') }}"
  become: true
  roles:
    - spack
