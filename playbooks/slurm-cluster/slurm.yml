---
- hosts: all
  become: true
  roles:
    - role: facts

# Build slurm first on all nodes. A failure on any host stops every host: a controller
# whose build failed must not be followed by nodes templating a new slurm.conf.
- hosts: slurm-cluster
  become: true
  any_errors_fatal: true
  tasks:
    - name: Build slurm on all nodes
      ansible.builtin.include_role:
        name: slurm
        public: true
        tasks_from: build

# One pass over every Slurm host: each one's duties (controller, compute or client
# only) follow from its inventory groups (slurm_controller_group, slurm_compute_group).
- hosts: slurm-cluster
  become: true
  roles:
    - role: slurm
      vars:
        slurm_workflow_build: false

# Set up slurm-login-on-compute if enabled
- hosts: slurm-master
  become: true
  roles:
    - role: deploy_defaults
  tasks:
    - name: Setup slurm login on compute if enabled.
      ansible.builtin.include_role:
        name: slurm
        public: true
        tasks_from: login-compute-setup
      when: slurm_login_on_compute
