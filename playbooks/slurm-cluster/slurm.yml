---
- name: Create the missing site secrets
  import_playbook: site-secrets.yml

# Run alone, before the facts below (slurm.conf gives each node the size of its job
# filesystem); a deploy imports it itself, before Slurm.
- name: Put the job directories on their own filesystem
  import_playbook: job-scratch.yml
  when: deepops_phase == 'converge'

- hosts: all
  become: true
  roles:
    - role: facts
  post_tasks:
    - name: Record what this play deployed
      ansible.builtin.include_role:
        name: component_record
        tasks_from: sources

# Every host first: a Slurm version change (or the retired source build) stops the
# whole deploy before anything is installed. That is the upgrade playbook's job
# (slurm-upgrade.yml), which orders it.
- hosts: slurm-cluster
  become: true
  any_errors_fatal: true
  tasks:
    - name: Check the installed Slurm version
      ansible.builtin.include_role:
        name: slurm
        public: true
        tasks_from: version

# The packages build in a container there (roles/slurm/tasks/packages-build.yml).
- name: Install Docker on the package build host
  import_playbook: ../container/docker.yml
  vars:
    hostlist: slurm-master[0]
    deepops_phase: require  # the build needs it whatever the cluster map says

# The packages of slurm_version, built once into the repository every node installs
# from (a no-op when the repository has them).
- hosts: slurm-master[0]
  become: true
  any_errors_fatal: true
  tasks:
    - name: Build and publish the Slurm packages
      ansible.builtin.include_role:
        name: slurm
        public: true
        tasks_from: packages-build

# One pass over every Slurm host: each one's duties (controller, compute or client
# only) follow from its inventory groups (slurm-master, slurm-node).
- hosts: slurm-cluster
  become: true
  roles:
    - role: slurm
  post_tasks:
    - name: Record what this play deployed
      ansible.builtin.include_role:
        name: component_record
        tasks_from: sources

# Set up slurm-login-on-compute if enabled
- hosts: slurm-master
  become: true
  roles:
    - role: deploy_defaults
  tasks:
    - name: Setup slurm login on compute if enabled.
      ansible.builtin.include_role:
        name: slurm
        public: true
        tasks_from: login-compute-setup
      when: slurm_login_on_compute
