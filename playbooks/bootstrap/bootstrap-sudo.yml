---
# Grant whoever runs this passwordless sudo on every host: a one-time step for a NEW
# node, before any directory or sudoers role has run. It is deliberately not part of
# slurm-cluster.yml, k8s-cluster.yml or ngc-ready-server.yml: run there, it re-created
# a personal NOPASSWD grant on every deploy, outside the administrator list, and kept
# it after that person's access was revoked. Day-to-day deploys use -K.
#
#   ansible-playbook -K -l <new-node> playbooks/bootstrap/bootstrap-sudo.yml
#
# Remove the grant once the node is in the cluster: cluster_sudoers_prune deletes
# drop-ins it did not write (roles/cluster_sudoers).
- hosts: all
  tasks:
    - name: Run setup to get ansible user
      ansible.builtin.setup: gather_subset=min

    - name: Check for presence of sudo
      ansible.builtin.command: which sudo
      changed_when: false
      check_mode: false  # read-only; --check needs the result
      failed_when: false
      register: sudo

    # If sudo is installed, try `become_method=sudo`
    - name: Use method "sudo" (requires password for "{{ ansible_facts.env.SUDO_USER | default(ansible_facts.env.USER) }}")
      ansible.builtin.set_fact: method=sudo
      when: sudo.rc == 0

    # Otherwise, use `become_method=su`
    - name: Use method "su" (requires password for "root")
      ansible.builtin.set_fact: method=su
      when: sudo.rc != 0

    - name: Install sudo package
      ansible.builtin.package: name=sudo
      become: true
      become_method: "{{ method }}"
      environment: "{{ proxy_env if proxy_env is defined else {} }}"

    # 0440 root:root is the mode sudoers files are required to have: visudo rejects
    # anything else, and the default 0644 would leave a NOPASSWD rule world-readable.
    - name: "Grant password-less sudo to user \"{{ ansible_facts.env.SUDO_USER | default(ansible_facts.env.USER) }}\""
      ansible.builtin.copy:
        content: "{{ ansible_facts.env.SUDO_USER | default(ansible_facts.env.USER) }} ALL=(ALL) NOPASSWD:ALL\n"
        dest: "/etc/sudoers.d/{{ ansible_facts.env.SUDO_USER | default(ansible_facts.env.USER) }}"
        owner: root
        group: root
        mode: "0440"
        validate: "visudo -cf %s"
      become: true
      become_method: "{{ method }}"

    - name: Report that become-pass is no longer required
      ansible.builtin.debug:
        msg: Now, you shouldn't need to use -K/--ask-become-pass for these hosts anymore.
      run_once: true
      delegate_to: 127.0.0.1
