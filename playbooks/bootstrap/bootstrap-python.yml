---
# Initial bootstrap of Python 3 installation on all hosts
- hosts: all
  become: true
  gather_facts: false
  roles:
    - role: proxy_defaults
  tasks:
    # raw runs before Python exists, so the play's environment cannot reach it: the
    # proxy variables go on the command line.
    - name: Install python
      ansible.builtin.raw: >-
        test -e /usr/bin/python3
        || ({{ _env }} apt -y update && {{ _env }} apt install -y python3-minimal)
        || ({{ _env }} yum install -y python3)
      vars:
        _env: "env {% for k, v in proxy_env.items() %}{{ k }}={{ v | quote }} {% endfor %}"
      register: output
      changed_when: output.stdout != ""

# Install necessary Python packages for future pip and setuptools requirements
- hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Force an apt update on Ubuntu
      ansible.builtin.apt:
        update_cache: true
      when: ansible_facts.distribution == "Ubuntu"

    - name: Install python 3 libraries if python 3 is present
      ansible.builtin.package:
        name:
          - python3-setuptools
          - python3-pip
        state: present
      when: ansible_facts.python.version.major == 3
