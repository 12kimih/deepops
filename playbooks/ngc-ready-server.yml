---
- name: Install python
  import_playbook: bootstrap/bootstrap-python.yml

- name: Install docker
  import_playbook: container/docker.yml
  vars:
    deepops_phase: require  # this server runs containers whatever the cluster map says

- name: Install NVIDIA driver
  import_playbook: nvidia-software/nvidia-driver.yml
  vars:
    deepops_phase: require  # this server's GPUs, whatever the cluster map says

- name: Install the NVIDIA Container Toolkit
  import_playbook: container/nvidia-container-toolkit.yml
  vars:
    deepops_phase: require

- name: Install NVIDIA DCGM
  import_playbook: nvidia-software/nvidia-dcgm.yml
  when: install_dcgm
  vars:
    hostlist: all
    deepops_phase: require  # this server's GPUs, whatever the cluster map says

- hosts: all
  become: true
  roles:
    - role: deploy_defaults  # ngc_ready_*
    - role: retired_settings  # the ngc_ready_* names before _container
  tasks:
    - name: Install docker python3 module
      ansible.builtin.apt:
        name: python3-docker
        state: present
        update_cache: true
      when: ansible_facts.distribution == "Ubuntu"
    - name: Add EPEL (RHEL family)
      ansible.builtin.include_role:
        name: package_repos
        tasks_from: epel
    - name: Install package dependencies
      ansible.builtin.package:
        name:
          - python3-pip
        state: present
      when: ansible_facts.os_family == "RedHat"
    - name: Install python3 dependencies
      ansible.builtin.pip:
        name:
          - docker
        state: present
      when: ansible_facts.os_family == "RedHat"
    # -t test: each NGC container sees this server's GPUs. Docker hands a container GPUs
    # only when it asks (no nvidia default runtime), so each asks for all of them, and
    # each is removed once it exits.
    - name: Run the GPU check in each NGC container
      community.docker.docker_container:
        name: "ngc-ready-{{ item.name }}"
        image: "{{ item.image }}"
        command: "{{ item.command }}"
        detach: false
        cleanup: true
        device_requests:
          - driver: nvidia
            count: -1
            capabilities: [[gpu]]
      loop:
        - {name: cuda, image: "{{ ngc_ready_cuda_container }}", command: nvidia-smi -L}
        - name: pytorch
          image: "{{ ngc_ready_pytorch_container }}"
          command: [python, -c, "import torch; assert torch.cuda.is_available(); print(torch.cuda.device_count(), 'GPUs')"]
        - name: tensorflow
          image: "{{ ngc_ready_tensorflow_container }}"
          command: [python, -c, "import tensorflow as tf; g = tf.config.list_physical_devices('GPU'); assert g; print(len(g), 'GPUs')"]
      loop_control:
        label: "{{ item.name }}"
      register: ngc_ready_checks
      tags:
        - test
        - never

    - name: Show what each container saw
      ansible.builtin.debug:
        msg: "{{ item.item.name }}: {{ item.container.Output | default('') | trim }}"
      loop: "{{ ngc_ready_checks.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      tags:
        - test
        - never
