---
# The NVIDIA driver (roles/nvidia_driver) on GPU hosts; DGX OS keeps its own. Every host
# it runs on converges to deepops_components: present where a deploy's switch wants it,
# left as it is elsewhere (removal: explicit; deepops_component_removals takes it away,
# from drained nodes, with a reboot request).
- hosts: "{{ hostlist | default('all') }}"
  become: true
  tags:
    - nvidia
    - nvidia_driver
  roles:
    - role: deploy_defaults
    - role: facts
    - role: nvidia_driver
      nvidia_driver_state: "{{ deepops_components.nvidia_driver | component_phase(deepops_phase) }}"
  environment: "{{ proxy_env }}"
  post_tasks:
    - name: Record what this play deployed
      ansible.builtin.include_role:
        name: component_record
        tasks_from: sources
