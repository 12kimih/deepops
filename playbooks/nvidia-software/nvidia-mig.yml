---
# Install the NVIDIA MIG Manager tooling on all MIG-capable nodes and apply the
# profile, mig_manager_profile (roles/deploy_defaults; override it in config/group_vars
# or per node), from the package's mig-parted configuration or the site's own.

# Check if MIG capabilities and software on nodes
- hosts: all
  become: true
  roles:
    - role: deploy_defaults
  vars:
    # The package's configuration, which its service generates from the GPUs at every
    # boot (service.sh), else the site's own (mig_manager_config_src).
    mig_package_config: /etc/nvidia-mig-manager/config.yaml
    mig_config_file: "{{ mig_manager_config if mig_manager_config_src | length > 0 else mig_package_config }}"
  tasks:
    # ansible_facts.ansible_local['gpus']['count'] counts the GPUs on the PCI bus, so it reports the GPUs the
    # node has even while the Slurm login setup hides them from ssh sessions.
    - name: Install custom facts
      ansible.builtin.include_role:
        name: facts

    # The GPU Operator runs its own MIG manager on Kubernetes nodes: one manager only.
    - name: Leave MIG to the GPU Operator on its nodes
      ansible.builtin.meta: end_host
      when:
        - inventory_hostname in groups['k8s_cluster'] | default([])
        - deepops_gpu_operator_enabled | bool

    # nvidia-smi runs in a transient unit so the probe also works on nodes where
    # the Slurm login setup hides GPUs from ssh sessions. The query is kept apart
    # from the match so its exit status survives: piping the two together reports
    # the same status whether nvidia-smi answered 'N/A' or never answered at all.
    #   0 - a GPU reports a MIG mode, configure the node
    #   1 - the query succeeded and no GPU supports MIG, skip the node
    #   2 - the query itself failed, which is an error rather than an answer
    # Only a real mode counts: 'grep -v N/A' also matched warnings and notices
    # nvidia-smi prints alongside the values.
    - name: Check for MIG capable devices
      ansible.builtin.shell: |
        set -o pipefail
        mig_mode=$(systemd-run --wait --pipe --collect --quiet -- \
          nvidia-smi --query-gpu=mig.mode.current --format=csv,noheader) || exit 2
        printf '%s\n' "$mig_mode" | grep -E '^(Enabled|Disabled)$'
      args:
        executable: /bin/bash
      register: has_mig
      failed_when: false
      changed_when: false
      check_mode: false  # read-only; --check needs the result

    # A node whose GPUs cannot be queried is not a node without MIG: skipping it
    # silently would report a MIG layout as converged that was never looked at.
    # ansible_facts.ansible_local['gpus']['count'] counts the GPUs on the PCI bus, so a node with no NVIDIA
    # hardware at all still passes through untouched.
    - name: Fail when the MIG capability probe could not run
      ansible.builtin.fail:
        msg: >-
          Could not read the MIG mode of the GPUs on this node.
          nvidia-smi is unavailable or did not answer, while the PCI bus has
          {{ ansible_facts.ansible_local['gpus']['count'] }} NVIDIA GPU(s).
          Install the driver on this node, or exclude it from this play.
      when:
        - has_mig.rc == 2
        - ansible_facts.ansible_local['gpus']['count'] | default(0) | int > 0

    - name: Install MIG Manager
      ansible.builtin.include_role:
        name: nvidia-mig-manager
      when:
        - has_mig.rc == 0

    - name: Copy the site's mig-parted configuration
      ansible.builtin.copy:
        src: "{{ mig_manager_config_src }}"
        dest: "{{ mig_manager_config }}"
        mode: "0644"
      register: mig_config
      when:
        - has_mig.rc == 0
        - mig_manager_config_src | length > 0

    # The package's own, as its service writes it at boot (service.sh, the same header
    # included), so a boot that follows rewrites the same file. nvidia-mig-parted reads
    # the GPUs, so it needs the probe's isolation from the ssh cgroup.
    - name: Generate the package's mig-parted configuration from the GPUs
      ansible.builtin.command: >-
        systemd-run --wait --pipe --collect --quiet --
        nvidia-mig-parted generate-config
      register: mig_generated
      changed_when: false
      check_mode: false  # read-only; --check needs the result
      when:
        - has_mig.rc == 0
        - mig_manager_config_src | length == 0

    - name: Write the package's mig-parted configuration
      ansible.builtin.copy:
        content: |
          # DO NOT EDIT: Auto-generated from hardware on every boot.
          # To use a custom config, set MIG_PARTED_CONFIG_FILE.

          {{ mig_generated.stdout }}
        dest: "{{ mig_package_config }}"
        mode: "0644"
      register: mig_config
      when:
        - has_mig.rc == 0
        - mig_manager_config_src | length == 0

    # What the boot-time reapply uses (override.conf, written by the package's
    # apply-start hook): a changed file, hooks or profile is applied again so the hook
    # persists it, even when the GPUs already hold the layout.
    - name: Read what the boot-time MIG reapply uses
      ansible.builtin.command:
        argv: [systemctl, show, --property=Environment, --value, nvidia-mig-manager.service]
      register: mig_persisted
      changed_when: false
      check_mode: false  # read-only; --check needs the result
      when: has_mig.rc == 0

    # Whether the GPUs already hold the profile: then nothing is applied, and the GPUs
    # and their CDI devices are left as they are. Read-only, so --check sees it.
    - name: Check whether the MIG configuration is in place
      ansible.builtin.command: >-
        systemd-run --wait --pipe --collect --quiet --
        nvidia-mig-parted assert -f {{ mig_config_file }}
        -c {{ mig_manager_profile }}
      register: mig_in_place
      changed_when: false
      failed_when: false
      check_mode: false  # read-only; --check needs the result
      when: has_mig.rc == 0

    # As the package's own service applies it (service.sh): the configuration, hooks
    # and profile in the environment, so the apply-start hook persists all three for
    # the boot-time reapply. nvidia-mig-parted drives the same GPUs as the probe, so it
    # needs the same isolation from the ssh cgroup. A failure is left unhandled on
    # purpose: a MIG layout that could not be applied must not pass as applied.
    - name: Apply MIG configuration
      change_command:
        argv:
          - systemd-run
          - --wait
          - --pipe
          - --collect
          - --quiet
          - "--setenv=MIG_PARTED_CONFIG_FILE={{ mig_config_file }}"
          - "--setenv=MIG_PARTED_HOOKS_FILE={{ mig_manager_hooks }}"
          - "--setenv=MIG_PARTED_SELECTED_CONFIG={{ mig_manager_profile }}"
          - --
          - nvidia-mig-parted
          - apply
      register: mig_apply
      # A changed configuration is applied even when the GPUs match it, so the hook
      # persists it for the boot-time reapply.
      when:
        - has_mig.rc == 0
        - >-
          mig_in_place.rc != 0 or mig_config is changed
          or not (mig_persisted.stdout.split() is superset(mig_environment))
      vars:
        mig_environment:
          - MIG_PARTED_CONFIG_FILE={{ mig_config_file }}
          - MIG_PARTED_HOOKS_FILE={{ mig_manager_hooks }}
          - MIG_PARTED_SELECTED_CONFIG={{ mig_manager_profile }}

    - name: Assert MIG configuration was applied
      ansible.builtin.command: >-
        systemd-run --wait --pipe --collect --quiet --
        nvidia-mig-parted assert -f {{ mig_config_file }}
        -c {{ mig_manager_profile }}
      changed_when: false
      when:
        - not ansible_check_mode
        - mig_apply is changed

    # The site's own configuration once the site leaves it: the boot-time reapply names
    # the package's now (applied above whenever it named another file).
    - name: Remove the site's former mig-parted configuration
      ansible.builtin.file:
        path: "{{ mig_manager_config }}"
        state: absent
      when:
        - has_mig.rc == 0
        - mig_manager_config_src | length == 0
        - mig_manager_config != mig_package_config

    # The CDI specification lists the MIG devices, and nvidia-cdi-refresh does not
    # follow a MIG change (cdi-support.html, known limitations): regenerate it.
    - name: Look for the NVIDIA CDI refresh service
      ansible.builtin.stat:
        path: /lib/systemd/system/nvidia-cdi-refresh.service
      register: mig_cdi_refresh
      when: has_mig.rc == 0

    - name: Regenerate the CDI specification for the MIG layout
      systemd_unit:
        name: nvidia-cdi-refresh.service
        state: restarted
      when:
        - mig_apply is changed
        - mig_cdi_refresh.stat.exists
