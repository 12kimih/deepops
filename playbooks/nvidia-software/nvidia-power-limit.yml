---
# Set (and persist across reboots) the NVIDIA GPU power limit on compute nodes.
#
# nvidia-smi resets the power limit to the card default on every boot, so this installs
# a small oneshot systemd unit (nvidia-power-limit.service) that re-applies the cap --
# and, optionally, persistence mode -- at boot. See roles/nvidia_power_limit.
#
# The role converges in both directions: a node with no nvidia_power_limit_watts has any
# cap REMOVED and its GPUs put back on their default limit. Running this over a whole
# group is therefore declarative, and slurm-cluster.yml runs it that way. Cap specific
# nodes by setting the wattage per host or group:
#
#   # config/host_vars/<node>:  nvidia_power_limit_watts: 450
#   ansible-playbook playbooks/nvidia-software/nvidia-power-limit.yml
#
#   # one-off, not written to config (undone by the next cluster run)
#   ansible-playbook -l <host1>,<host2> playbooks/nvidia-software/nvidia-power-limit.yml \
#       -e nvidia_power_limit_watts=450
#
# Every host it runs on converges to deepops_components (present on slurm-node while
# slurm_cluster_configure_gpu_power_limit is on, removed elsewhere). A host without the
# driver has no cap to apply or reset.
- hosts: "{{ hostlist | default('slurm-cluster') }}"
  become: true
  roles:
    - role: deploy_defaults
    - role: nvidia_power_limit
      nvidia_power_limit_state: "{{ deepops_components.nvidia_power_limit | component_phase(deepops_phase) }}"
  environment: "{{ proxy_env }}"
