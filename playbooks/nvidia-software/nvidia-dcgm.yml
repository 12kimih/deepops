---
# NVIDIA DCGM on the GPU nodes (roles/nvidia_dcgm). Every host it runs on converges to
# deepops_components (present on slurm-node while install_dcgm is on, removed
# elsewhere); a node without GPUs has nothing to install (roles/facts reports them).
- hosts: "{{ hostlist | default('slurm-cluster') }}"
  become: true
  roles:
    - role: deploy_defaults
    - role: facts
    - role: nvidia_dcgm
      dcgm_state: "{{ deepops_components.dcgm | component_phase(deepops_phase) }}"
  post_tasks:
    - name: Record what this play deployed
      ansible.builtin.include_role:
        name: component_record
        tasks_from: sources
