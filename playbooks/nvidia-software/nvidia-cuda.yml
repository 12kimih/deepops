---
# Install the NVIDIA CUDA toolkit. The driver is nvidia-driver.yml's (run it first).
#
# The role installs it only with nvidia_cuda_install: true (its default is false, for
# CUDA served per-version through Lmod/environment modules).
- hosts: all
  become: true
  roles:
    - role: proxy_defaults
  tasks:
    - name: Install the NVIDIA CUDA toolkit
      ansible.builtin.include_role:
        name: nvidia_cuda
        public: true  # nvidia_versions (a dependency) supplies its values
  environment: "{{ proxy_env }}"
