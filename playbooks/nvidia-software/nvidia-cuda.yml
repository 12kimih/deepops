---
# One system-wide NVIDIA CUDA toolkit from NVIDIA's repository (roles/nvidia_cuda). The
# driver is nvidia-driver.yml's (run it first).
#
# Every host it runs on converges to deepops_components: present while
# slurm_install_cuda is on (off by default, for CUDA served per minor as modules:
# slurm-cluster/nvidia-cuda-toolkit.yml), its package and profile script removed when off.
- hosts: "{{ hostlist | default('slurm-cluster') }}"
  become: true
  roles:
    - role: deploy_defaults
    - role: nvidia_cuda
      cuda_state: "{{ deepops_components.cuda | component_phase(deepops_phase) }}"
  environment: "{{ proxy_env }}"
