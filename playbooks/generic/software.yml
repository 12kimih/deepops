---
- hosts: all
  become: true
  # Removal has one home, roles/host_baseline; software_remove_packages is retired.
  roles:
    - retired_settings
    - role: deploy_defaults
    # The shells people log in with, on every host, each reading /etc/profile.d.
    - role: login_shells
  tasks:
    - name: Install extra packages
      ansible.builtin.package:
        name: "{{ software_extra_packages }}"
        state: present
      when: software_extra_packages | length > 0
