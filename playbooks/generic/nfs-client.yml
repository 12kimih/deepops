---
# A host's NFS mounts: present on the deploy's NFS clients (deepops_components), kept
# elsewhere, removed from a host only when the site lists nfs_client in
# deepops_component_removals.
- hosts: "{{ hostlist | default('slurm-cluster') }}"
  become: true
  roles:
    - role: deploy_defaults
    - role: nfs_client
      nfs_client_state: "{{ deepops_components.nfs_client | component_phase(deepops_phase) }}"
  tags:
    - nfs_client
  post_tasks:
    - name: Record what this play deployed
      ansible.builtin.include_role:
        name: component_record
        tasks_from: sources
