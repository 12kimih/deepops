---
# Keep administrator sudo access identical on every node.
#
# Two mechanisms decide whether someone can sudo on a compute node, and they disagree
# unless something keeps them in step: a Slurm job carries the numeric gid list
# resolved on the SUBMIT node (send_gids), while a direct SSH login resolves groups on
# the node itself. Membership granted on one side is invisible to the other.
#
# A NIS netgroup is matched by name rather than by a numeric gid, so it is immune to
# both: publish it once on the NIS master (nis_export_netgroups) and every node answers
# the same way. This playbook installs the matching sudoers rule.
#
# No-op until cluster_sudoers_netgroup is set in config/group_vars.
#
# SAFETY: every rule is checked with `visudo -cf` before it is installed, and the
# whole configuration is re-checked at the end. Even so, run this against ONE node
# first and confirm sudo still works there before letting it touch the cluster:
#
#   ansible-playbook -l <one-node> playbooks/generic/cluster-sudoers.yml
- hosts: "{{ hostlist | default('all') }}"
  become: true
  become_method: sudo
  tags:
    - cluster-sudoers
  roles:
    - role: cluster_sudoers
      when: (cluster_sudoers_netgroup | default('')) | length > 0
  environment: "{{ proxy_env if proxy_env is defined else {} }}"
