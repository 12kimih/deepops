---
# The OpenSSH server's settings (roles/sshd): the package's own sshd_config and one
# drop-in with the site's, alone in sshd_config.d, where sshd_manage is on; nothing
# changes elsewhere.
- hosts: "{{ hostlist | default('all') }}"
  become: true
  roles:
    - role: deploy_defaults
    - role: sshd
  tags:
    - sshd
  post_tasks:
    - name: Record what this play deployed
      ansible.builtin.include_role:
        name: component_record
        tasks_from: sources
