---
# Create and lock the people roster's accounts (roles/people) on the given hosts.
#
# With a directory the accounts live there (NIS: the master's files; LDAP: the
# directory) and authentication.yml keeps them on the account source
# (people_manage_accounts). Use this playbook where there is none, so every node gets
# the same accounts with the same UIDs:
#
#   ansible-playbook -K playbooks/generic/people.yml
- hosts: "{{ hostlist | default('all') }}"
  become: true
  tags:
    - people
  pre_tasks:
    # Local accounts on every node would shadow the directory's (nsswitch reads files
    # first).
    - name: Refuse to create local accounts beside a directory
      ansible.builtin.assert:
        that: directory_service == 'none'
        fail_msg: >-
          This host reads accounts from {{ directory_service }} (directory_service); they
          belong in the directory, through authentication.yml.
        quiet: true
  roles:
    - role: deploy_defaults  # directory_service
    - role: people
  post_tasks:
    - name: Record what this play deployed
      ansible.builtin.include_role:
        name: component_record
        tasks_from: sources
