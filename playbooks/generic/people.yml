---
# Create and lock the people roster's accounts (roles/people) on the given hosts.
#
# With a directory service the accounts live on its master only, and authentication.yml
# runs the role there (people_manage_accounts). Use this playbook where there is none,
# so every node gets the same accounts with the same UIDs:
#
#   ansible-playbook -K playbooks/generic/people.yml
- hosts: "{{ hostlist | default('all') }}"
  become: true
  tags:
    - people
  pre_tasks:
    # With NIS, local accounts on every node would shadow the directory's (nsswitch
    # reads files first); there authentication.yml runs the role on the master only.
    - name: Refuse to create local accounts beside a directory service
      ansible.builtin.assert:
        that: nis_domain | length == 0
        fail_msg: This site uses NIS (nis_domain); accounts belong on its master, through authentication.yml.
        quiet: true
  roles:
    - role: nis_defaults  # nis_domain
    - role: people
