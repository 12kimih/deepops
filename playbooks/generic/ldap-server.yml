---
# The LDAP directory server (docs/deepops/accounts.md): every host it runs on converges to what
# deepops_components says (roles/deploy_defaults/vars/main.yml). Taking it away is
# explicit only (deepops_component_removals).
- hosts: "{{ hostlist | default('all') }}"
  become: true
  roles:
    - role: deploy_defaults
    - role: ldap_server
      ldap_server_state: "{{ deepops_components.ldap_server | component_phase(deepops_phase) }}"
  tags:
    - people
    - ldap-server
  post_tasks:
    - name: Record what this play deployed
      ansible.builtin.include_role:
        name: component_record
        tasks_from: sources
