---
# Unattended OS upgrades take security fixes only, never the kernel, GPU,
# scheduler, container or storage packages, and never restart services or reboot
# (roles/os_updates).
- hosts: all
  become: true
  tasks:
    - name: Point apt at the site's Ubuntu mirror
      ansible.builtin.include_role:
        name: package_repos
        tasks_from: ubuntu

    - name: Apply the OS update policy
      ansible.builtin.include_role:
        name: os_updates
        public: true
  post_tasks:
    - name: Record what this play deployed
      ansible.builtin.include_role:
        name: component_record
        tasks_from: sources
      vars:
        component_record_sources_also: [os_updates]
