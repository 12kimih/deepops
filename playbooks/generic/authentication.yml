---
# Accounts and logins (docs/deepops/accounts.md): the people roster's accounts and homes
# on the account source, the directory servers, then each host's directory client.
# Every part is on when configured: the directories by directory_service, nis_domain and
# ldap_suffix (roles/deploy_defaults), the rest by their own settings, so with the
# default config nothing changes.
# The directory's secret files the site config lacks (its read-only accounts'
# passwords), made on the controller, never replaced (roles/site_secrets).
- name: Create the directory's missing secrets
  hosts: "{{ hostlist | default('all') }}"
  gather_facts: false
  become: false
  tags:
    - always
  roles:
    - role: directory_defaults
    - role: site_secrets
      site_secrets: "{{ directory_site_secrets }}"

- hosts: "{{ hostlist | default('all') }}"
  become: true
  tags:
    - people
  roles:
    - role: deploy_defaults
    - role: move-home-dirs
      when: move_home_dirs_enable | bool
    - role: kerberos_client
      when: kerberos_client_realm_name | length > 0
    # The roster's homes, and its local accounts where no LDAP directory holds them, on
    # the account source; before the servers that publish them.
    - role: people
      people_local_accounts_enabled: "{{ directory_service != 'ldap' }}"
      when: people_manage_accounts | bool

# Servers before the clients that bind to them.
- name: Serve the LDAP directory
  import_playbook: ldap-server.yml

- name: Serve NIS
  import_playbook: nis-server.yml

- name: Read accounts from NIS
  import_playbook: nis-client.yml

- name: Read accounts from LDAP
  import_playbook: sssd-client.yml

- hosts: "{{ hostlist | default('all') }}"
  become: true
  tags:
    - people
  roles:
    - role: autofs
      when: (autofs_mount | length > 0) and (autofs_map | length > 0)
