---
# Every host's locale and time zone (roles/locale): locale_lang and locale_timezone.
- name: Set the system locale and time zone
  hosts: "{{ hostlist | default('all') }}"
  become: true
  roles:
    - locale
  tags:
    - locale
  post_tasks:
    - name: Record what this play deployed
      ansible.builtin.include_role:
        name: component_record
        tasks_from: sources
