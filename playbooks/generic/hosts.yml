---
- hosts: all
  become: true
  roles:
    - role: deploy_defaults
  tasks:
    - name: Set /etc/hostname
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"
      when: deepops_set_hostname

    - name: Set /etc/hosts
      ansible.builtin.include_role:
        name: deepops_hosts
      vars:
        hosts_add_ansible_managed_hosts: true
