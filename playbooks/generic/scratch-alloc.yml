---
# Fast scratch space per request (roles/scratch_alloc): the allocation tool, its
# configuration and the timer that keeps end dates. Every host it runs on converges to
# deepops_components (present on scratch-server while slurm_enable_scratch_alloc is on,
# removed elsewhere; allocations and their registry always stay).
#
#   ansible-playbook -K playbooks/generic/scratch-alloc.yml [-l <hosts>] --check --diff
- hosts: "{{ hostlist | default('slurm-cluster') }}"
  become: true
  roles:
    - role: deploy_defaults
    - role: scratch_alloc
      scratch_alloc_state: "{{ deepops_components.scratch_alloc | component_phase(deepops_phase) }}"
  tags:
    - scratch-alloc
