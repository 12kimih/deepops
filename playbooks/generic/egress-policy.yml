---
# Where users' processes may connect outside the cluster, client SSH defaults, and
# inbound filtering where configured (roles/egress_policy). Preview on one host first:
#
#   ansible-playbook -K --check --diff -l <host> playbooks/generic/egress-policy.yml
#
# Present where slurm_enable_egress_policy is on, removed where it is off
# (deepops_components); -e egress_policy_state=absent removes it from the hosts run on.
- hosts: "{{ hostlist | default('slurm-cluster') }}"
  become: true
  tags:
    - egress-policy
    - people  # the exempt UIDs may come from the roster
  roles:
    - role: deploy_defaults  # slurm_enable_egress_policy, proxy_env
    - role: egress_policy
      egress_policy_state: "{{ deepops_components.egress_policy | component_phase(deepops_phase) }}"
  environment: "{{ proxy_env }}"
