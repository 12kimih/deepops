---
# What users may leave running outside a Slurm job (roles/node_user_policy): lingering
# and crontabs. Preview with --check --diff.
- hosts: "{{ hostlist | default('all') }}"
  become: true
  tags:
    - node-user-policy
  roles:
    - role: node_user_policy
  post_tasks:
    - name: Record what this play deployed
      ansible.builtin.include_role:
        name: component_record
        tasks_from: sources
