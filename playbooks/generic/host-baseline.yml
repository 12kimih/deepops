---
# Remove what must not be on a host (roles/host_baseline). Preview first:
#
#   ansible-playbook -K --check --diff playbooks/generic/host-baseline.yml
- hosts: "{{ hostlist | default('all') }}"
  become: true
  tags:
    - host-baseline
  roles:
    - role: host_baseline
  post_tasks:
    - name: Record what this play deployed
      ansible.builtin.include_role:
        name: component_record
        tasks_from: sources
