---
# The NFS server's exports: present on the deploy's NFS servers (deepops_components),
# kept elsewhere, removed from a host only when the site lists nfs in
# deepops_component_removals.
- hosts: "{{ hostlist | default('slurm-cluster') }}"
  become: true
  roles:
    - role: deploy_defaults
    - role: nfs
      nfs_state: "{{ deepops_components.nfs | component_phase(deepops_phase) }}"
  tags:
    - nfs_server
  post_tasks:
    - name: Record what this play deployed
      ansible.builtin.include_role:
        name: component_record
        tasks_from: sources
