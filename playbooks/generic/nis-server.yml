---
# The NIS master (docs/deepops/accounts.md): every host it runs on converges to what
# deepops_components says (roles/deploy_defaults/vars/main.yml). Taking it away is
# explicit only (deepops_component_removals).
- hosts: "{{ hostlist | default('all') }}"
  become: true
  roles:
    - role: deploy_defaults
    - role: nis_server
      nis_server_state: "{{ deepops_components.nis_server | component_phase(deepops_phase) }}"
  tags:
    - people
    - nis-server
