---
# Chrony will ensure that the clocks of all your servers are in sync and can be used to
# sync with an internal server. Every host it runs on converges to deepops_components.
- hosts: "{{ hostlist | default('all') }}"
  become: true
  roles:
    - role: deploy_defaults
    - role: deepops_chrony
      chrony_state: "{{ deepops_components.chrony | component_phase(deepops_phase) }}"
  post_tasks:
    - name: Record what this play deployed
      ansible.builtin.include_role:
        name: component_record
        tasks_from: sources
