---
# Slurm Cluster Playbook

# First, before any host changes: a deploy needs no hand-made secret files.
- name: Create the missing site secrets
  import_playbook: slurm-cluster/site-secrets.yml

- name: Install python required for Ansible
  import_playbook: bootstrap/bootstrap-python.yml

- name: Disable cloud-init
  import_playbook: generic/disable-cloud-init.yml
  when: deepops_disable_cloud_init

- name: Configure hostnames, /etc/hosts
  import_playbook: generic/hosts.yml
  when: slurm_configure_etc_hosts
  tags:
    - set-hosts

- name: Configure Chrony (NTP) sync
  import_playbook: generic/chrony-client.yml
  vars:
    deepops_phase: install

- name: Apply the OS update policy
  import_playbook: generic/os-updates.yml

- name: Configure the OpenSSH server
  import_playbook: generic/sshd.yml

- name: Ban repeated failed logins
  import_playbook: generic/fail2ban.yml
  vars:
    deepops_phase: install

# The container engine, where a component below needs it (deepops_components).
- name: Install Docker where a component needs it
  import_playbook: container/docker.yml
  vars:
    deepops_phase: install

- name: Set up a local cluster container registry
  import_playbook: container/standalone-container-registry.yml
  vars:
    deepops_phase: install

- name: Remove what must not be on a host
  import_playbook: generic/host-baseline.yml
  tags:
    - host-baseline

- name: Set up NGINX-based container caching | Install docker registry cache server
  import_playbook: container/nginx-docker-registry-cache-server.yml
  vars:
    deepops_phase: install

- name: Set up NGINX-based container caching | Install docker registry cache client
  import_playbook: container/nginx-docker-registry-cache-client.yml
  vars:
    deepops_phase: install

- name: Install NVIDIA driver
  import_playbook: nvidia-software/nvidia-driver.yml
  vars:
    deepops_phase: install

- name: Install the NVIDIA Container Toolkit where GPU containers run
  import_playbook: container/nvidia-container-toolkit.yml
  vars:
    deepops_phase: install

- name: Install the system-wide CUDA toolkit
  import_playbook: nvidia-software/nvidia-cuda.yml
  vars:
    deepops_phase: install

- name: Install software
  import_playbook: generic/software.yml

# Every play's hosts are an inventory group named here: a play's hosts are resolved
# before group_vars load, so a group_vars variable could not choose them (only -e can,
# with hostlist on the component playbook). NFS servers are the whole [slurm-nfs]
# group, so a cluster exporting different filesystems from different servers sets them
# all up in one run.
- name: Set up NFS filesystem | Install nfs-server
  import_playbook: generic/nfs-server.yml
  vars:
    deepops_phase: install

- name: Set up NFS filesystem | Install nfs-client
  import_playbook: generic/nfs-client.yml
  vars:
    deepops_phase: install

# Accounts and logins (docs/deepops/accounts.md): the roster's accounts and homes, the
# directory servers, each host's directory client. After NFS (so /home is mounted) and
# before Slurm, which resolves every user.
- name: Configure accounts and logins (the roster, NIS or LDAP, Kerberos, autofs)
  import_playbook: generic/authentication.yml
  vars:
    deepops_phase: install
  tags:
    - people

- name: Install DCGM
  import_playbook: nvidia-software/nvidia-dcgm.yml
  vars:
    deepops_phase: install

- name: Install Node Health Check
  import_playbook: slurm-cluster/nhc.yml
  vars:
    deepops_phase: install

- name: Install Slurm
  import_playbook: slurm-cluster/slurm.yml

- name: Back up the Slurm controller daily, with a monthly restore test
  import_playbook: slurm-cluster/slurm-backup.yml
  vars:
    deepops_phase: install
  tags:
    - slurm-backup

- name: Install OpenMPI
  import_playbook: slurm-cluster/openmpi.yml
  vars:
    deepops_phase: install

- name: Install Lmod
  import_playbook: slurm-cluster/lmod.yml
  vars:
    deepops_phase: install

- name: Install the NVIDIA HPC SDK
  import_playbook: nvidia-software/nvidia-hpc-sdk.yml
  vars:
    deepops_phase: install

- name: Install the CUDA toolkits as modules
  import_playbook: slurm-cluster/nvidia-cuda-toolkit.yml
  vars:
    deepops_phase: install

- name: Install EasyBuild
  import_playbook: slurm-cluster/easybuild-modules.yml
  vars:
    deepops_phase: install

- name: Install the Open OnDemand portal
  import_playbook: slurm-cluster/open-ondemand.yml
  vars:
    deepops_phase: install

# Monitoring: present where the switch and group say; removed in the removal phase.
- name: Install monitoring services | Install prometheus
  import_playbook: slurm-cluster/prometheus.yml
  vars:
    deepops_phase: install

- name: Install monitoring services | Install alert manager
  import_playbook: slurm-cluster/alertmanager.yml
  vars:
    deepops_phase: install

- name: Install monitoring services | Install grafana
  import_playbook: slurm-cluster/grafana.yml
  vars:
    deepops_phase: install

- name: Install monitoring exporters | Install prometheus node exporter
  import_playbook: slurm-cluster/prometheus-node-exporter.yml
  vars:
    deepops_phase: install

- name: Install monitoring exporters | Install prometheus IPMI exporter
  import_playbook: slurm-cluster/prometheus-ipmi-exporter.yml
  vars:
    deepops_phase: install

- name: Install monitoring exporters | Install nvidia dcgm exporter
  import_playbook: slurm-cluster/nvidia-dcgm-exporter.yml
  vars:
    deepops_phase: install

- name: Install monitoring exporters | Install Slurm GPU allocation metrics
  import_playbook: slurm-cluster/slurm-metrics.yml
  vars:
    deepops_phase: install

- name: Install monitoring services | Install the Slack usage report
  import_playbook: slurm-cluster/slurm-usage-report.yml
  vars:
    deepops_phase: install

# Present where the switch and group say, removed elsewhere (deepops_components).
- name: Set up rsyslog forwarding from compute nodes to head node | Install rsyslog server
  import_playbook: generic/rsyslog-server.yml
  vars:
    deepops_phase: install

- name: Set up rsyslog forwarding from compute nodes to head node | Install rsyslog client
  import_playbook: generic/rsyslog-client.yml
  vars:
    deepops_phase: install

- name: Set Permissions to adjust GPU Clocks speeds
  import_playbook: utilities/gpu-clocks.yml
  when: allow_user_set_gpu_clocks

# Declarative: nodes with nvidia_power_limit_watts get the cap, nodes without have any
# cap removed; slurm_cluster_configure_gpu_power_limit off removes it everywhere.
- name: Configure the GPU power limit
  import_playbook: nvidia-software/nvidia-power-limit.yml
  vars:
    deepops_phase: install

- name: Set the GPUs' ECC mode
  import_playbook: nvidia-software/nvidia-ecc.yml

- name: Install enroot
  import_playbook: container/enroot.yml
  vars:
    deepops_phase: install
  tags:
    - enroot
    - pyxis

- name: Install pyxis's node setup
  import_playbook: container/pyxis.yml
  vars:
    deepops_phase: install
  tags:
    - pyxis

- name: Install rootless Podman for image builds
  import_playbook: container/podman.yml
  vars:
    deepops_phase: install
  tags:
    - podman

- name: Clean up users' container image stores daily
  import_playbook: container/container-storage-gc.yml
  vars:
    deepops_phase: install
  tags:
    - container-storage-gc

# Both run after authentication.yml has published the group and the netgroup through
# NIS, so the compute nodes can resolve them. No-ops unless configured.
- name: Point the Docker socket at a cluster-wide group
  import_playbook: container/docker-socket-group.yml
  tags:
    - docker-socket-group

- name: Grant administrator sudo through the cluster netgroup
  import_playbook: generic/cluster-sudoers.yml
  tags:
    - cluster-sudoers
    - people

- name: Allow break-glass root SSH from the controller only
  import_playbook: generic/root-access.yml
  tags:
    - root-access

- name: Run a local resolver that blocks tunnel services by name
  import_playbook: generic/dns-resolver.yml
  vars:
    deepops_phase: install
  tags:
    - dns-resolver

- name: Limit where users connect outside the cluster
  import_playbook: generic/egress-policy.yml
  vars:
    deepops_phase: install
  tags:
    - egress-policy

- name: Limit what users leave running outside Slurm jobs
  import_playbook: generic/node-user-policy.yml
  tags:
    - node-user-policy
    - people

- name: Publish the site's commands, shell defaults and login banner
  import_playbook: slurm-cluster/cluster-tools.yml
  vars:
    deepops_phase: install
  tags:
    - cluster-tools

- name: Give AI coding agents the site's agent rules
  import_playbook: slurm-cluster/ai-agent-rules.yml
  tags:
    - ai-agent-rules

- name: Ensure that nv_peer_mem is loaded
  import_playbook: nvidia-software/nvidia-peer-memory.yml
  tags:
    - nvidia-peer-memory

# Removal phase (docs/deepops/component-state.md): the components no longer wanted on a
# host go, in the reverse of the install order, so nothing goes from under what needs it.
- name: Withdraw the cluster commands, shell defaults and banner where no longer wanted
  import_playbook: slurm-cluster/cluster-tools.yml
  vars:
    deepops_phase: remove
  tags:
    - cluster-tools

- name: Remove the container storage cleanup where it is no longer wanted
  import_playbook: container/container-storage-gc.yml
  vars:
    deepops_phase: remove
  tags:
    - container-storage-gc

- name: Remove EasyBuild where it is no longer wanted
  import_playbook: slurm-cluster/easybuild-modules.yml
  vars:
    deepops_phase: remove

- name: Remove the CUDA toolkits where they are no longer wanted
  import_playbook: slurm-cluster/nvidia-cuda-toolkit.yml
  vars:
    deepops_phase: remove

- name: Remove the HPC SDK where it is no longer wanted
  import_playbook: nvidia-software/nvidia-hpc-sdk.yml
  vars:
    deepops_phase: remove

- name: Remove pyxis's node setup where it is no longer wanted
  import_playbook: container/pyxis.yml
  vars:
    deepops_phase: remove
  tags:
    - pyxis

- name: Remove rootless Podman where it is no longer wanted
  import_playbook: container/podman.yml
  vars:
    deepops_phase: remove
  tags:
    - podman

- name: Remove enroot where it is no longer wanted
  import_playbook: container/enroot.yml
  vars:
    deepops_phase: remove
  tags:
    - enroot
    - pyxis

- name: Remove Open MPI where it is no longer wanted
  import_playbook: slurm-cluster/openmpi.yml
  vars:
    deepops_phase: remove

- name: Remove the controller backups where they are no longer wanted
  import_playbook: slurm-cluster/slurm-backup.yml
  vars:
    deepops_phase: remove
  tags:
    - slurm-backup

- name: Remove Node Health Check where it is no longer wanted
  import_playbook: slurm-cluster/nhc.yml
  vars:
    deepops_phase: remove

- name: Remove DCGM where it is no longer wanted
  import_playbook: nvidia-software/nvidia-dcgm.yml
  vars:
    deepops_phase: remove

- name: Remove the local resolver where it is no longer wanted
  import_playbook: generic/dns-resolver.yml
  vars:
    deepops_phase: remove
  tags:
    - dns-resolver

- name: Remove the GPU power limit where it is no longer wanted
  import_playbook: nvidia-software/nvidia-power-limit.yml
  vars:
    deepops_phase: remove

- name: Remove the egress policy where it is no longer wanted
  import_playbook: generic/egress-policy.yml
  vars:
    deepops_phase: remove
  tags:
    - egress-policy

- name: Remove the rsyslog client where it is no longer wanted
  import_playbook: generic/rsyslog-client.yml
  vars:
    deepops_phase: remove

- name: Remove the rsyslog server where it is no longer wanted
  import_playbook: generic/rsyslog-server.yml
  vars:
    deepops_phase: remove

- name: Remove the Slack usage report where it is no longer wanted
  import_playbook: slurm-cluster/slurm-usage-report.yml
  vars:
    deepops_phase: remove

- name: Remove the Slurm GPU allocation metrics where it is no longer wanted
  import_playbook: slurm-cluster/slurm-metrics.yml
  vars:
    deepops_phase: remove

- name: Remove the DCGM exporter where it is no longer wanted
  import_playbook: slurm-cluster/nvidia-dcgm-exporter.yml
  vars:
    deepops_phase: remove

- name: Remove the system-wide CUDA toolkit where it is no longer wanted
  import_playbook: nvidia-software/nvidia-cuda.yml
  vars:
    deepops_phase: remove

- name: Remove the NVIDIA Container Toolkit where nothing needs it
  import_playbook: container/nvidia-container-toolkit.yml
  vars:
    deepops_phase: remove

- name: Remove the NVIDIA driver where it is listed for removal
  import_playbook: nvidia-software/nvidia-driver.yml
  vars:
    deepops_phase: remove

# Retired: slurmctld serves the Slurm metrics; this removes the exporter everywhere.
- name: Remove the Slurm exporter where it is no longer wanted
  import_playbook: slurm-cluster/prometheus-slurm-exporter.yml
  vars:
    deepops_phase: remove

- name: Remove the IPMI exporter where it is no longer wanted
  import_playbook: slurm-cluster/prometheus-ipmi-exporter.yml
  vars:
    deepops_phase: remove

- name: Remove the node exporter where it is no longer wanted
  import_playbook: slurm-cluster/prometheus-node-exporter.yml
  vars:
    deepops_phase: remove

- name: Remove the Grafana where it is no longer wanted
  import_playbook: slurm-cluster/grafana.yml
  vars:
    deepops_phase: remove

- name: Remove the Alertmanager where it is no longer wanted
  import_playbook: slurm-cluster/alertmanager.yml
  vars:
    deepops_phase: remove

- name: Remove the Prometheus where it is no longer wanted
  import_playbook: slurm-cluster/prometheus.yml
  vars:
    deepops_phase: remove

- name: Stop pulling through the registry cache where it is no longer wanted
  import_playbook: container/nginx-docker-registry-cache-client.yml
  vars:
    deepops_phase: remove

- name: Remove the registry cache where it is no longer wanted
  import_playbook: container/nginx-docker-registry-cache-server.yml
  vars:
    deepops_phase: remove

- name: Remove the cluster container registry where it is no longer wanted
  import_playbook: container/standalone-container-registry.yml
  vars:
    deepops_phase: remove

# Only where the site named docker in deepops_component_removals.
- name: Remove Docker where it is no longer wanted
  import_playbook: container/docker.yml
  vars:
    deepops_phase: remove

- name: Remove the Open OnDemand portal where it is no longer wanted
  import_playbook: slurm-cluster/open-ondemand.yml
  vars:
    deepops_phase: remove

- name: Remove Lmod where it is no longer wanted
  import_playbook: slurm-cluster/lmod.yml
  vars:
    deepops_phase: remove

# Only where the site lists them in deepops_component_removals (removal: explicit):
# clients before the servers they bind to.
- name: Stop reading accounts from LDAP where it is listed for removal
  import_playbook: generic/sssd-client.yml
  vars:
    deepops_phase: remove

- name: Stop reading accounts from NIS where it is listed for removal
  import_playbook: generic/nis-client.yml
  vars:
    deepops_phase: remove

- name: Remove the NIS master where it is listed for removal
  import_playbook: generic/nis-server.yml
  vars:
    deepops_phase: remove

- name: Remove the LDAP server where it is listed for removal
  import_playbook: generic/ldap-server.yml
  vars:
    deepops_phase: remove

# Only where the site lists nfs_client in deepops_component_removals (removal: explicit).
- name: Remove the NFS mounts where they are listed for removal
  import_playbook: generic/nfs-client.yml
  vars:
    deepops_phase: remove

# Only where the site lists nfs in deepops_component_removals (removal: explicit).
- name: Remove the NFS server where it is listed for removal
  import_playbook: generic/nfs-server.yml
  vars:
    deepops_phase: remove

# Only where the site named chrony in deepops_component_removals (the OS time sync takes over).
- name: Remove fail2ban where it is no longer wanted
  import_playbook: generic/fail2ban.yml
  vars:
    deepops_phase: remove

- name: Hand time sync back to the OS where chrony is no longer wanted
  import_playbook: generic/chrony-client.yml
  vars:
    deepops_phase: remove

# Last: each host records what was deployed to it (roles/deploy_record), where the next
# preview starts (scripts/deepops/settings.py diff).
- name: Record what was deployed
  hosts: slurm-cluster
  become: true
  gather_facts: false
  tags:
    - always
  roles:
    - role: deploy_record
      deploy_record_name: slurm-cluster
