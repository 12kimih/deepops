---
- name: Record what this component installs
  ansible.builtin.include_role:
    name: component_record
  vars:
    component_record_name: job_notice
    component_record_action: begin
    component_record_items: "{{ job_notice_items }}"

# The slurm account (its group reads what follows), made as roles/slurm makes it, so
# job notices deploy before Slurm, whose slurm.conf names their command (MailProg) and
# whose controller refuses one not installed.
- name: Create the slurm account
  ansible.builtin.include_role:
    name: slurm
    tasks_from: setup-user
    public: true  # slurm_username means the same in both roles

- name: Make the textfile directory its DM counts go to
  ansible.builtin.include_role:
    name: textfile_keep
    tasks_from: unprivileged

# slurmctld runs MailProg as SlurmUser: the command, its configuration and the token
# are readable by that group, writable by root alone (slurm.conf(5): MailProg).
- name: Install the notice command
  ansible.builtin.include_role:
    name: cluster_tools_lib
    tasks_from: command
  vars:
    cluster_tools_lib_command:
      dest: "{{ job_notice_command }}"
      module: cluster_tools.job_notice

- name: Write the notice configuration
  ansible.builtin.copy:
    dest: "{{ _job_notice_config }}"
    owner: root
    group: "{{ slurm_username }}"
    mode: "0640"
    content: "{{ _job_notice_cfg | to_nice_json }}\n"
    validate: "{{ cluster_tools_lib_config_validate }} cluster_tools.job_notice %s"

- name: Record the job notice configuration
  ansible.builtin.include_role:
    name: cluster_tools_lib
    tasks_from: config
  vars:
    cluster_tools_lib_config: {role: job_notice, module: cluster_tools.job_notice, file: "{{ _job_notice_config }}", playbook: playbooks/slurm-cluster/job-notice.yml}

# Never on a command line or in the configuration; empty sends nothing.
- name: Write the Slack token
  ansible.builtin.copy:
    dest: "{{ _job_notice_token }}"
    owner: root
    group: "{{ slurm_username }}"
    mode: "0640"
    content: "{{ slack_bot_token }}\n"
  no_log: true

- name: Create the notice state directory
  ansible.builtin.file:
    path: "{{ _job_notice_state_dir }}"
    state: directory
    owner: "{{ slurm_username }}"
    group: "{{ slurm_username }}"
    mode: "0700"

- name: Record the component as present
  ansible.builtin.include_role:
    name: component_record
  vars:
    component_record_name: job_notice
    component_record_action: present
    component_record_items: "{{ job_notice_items }}"
