---
_job_notice_config: "{{ cluster_tools_lib_config_dir }}/job-notice.json"
_job_notice_token: "{{ cluster_tools_lib_config_dir }}/job-notice.token"
_job_notice_state_dir: "{{ deepops_state_dir }}/job-notice"
_job_notice_cfg:
  token_file: "{{ _job_notice_token }}"
  members: "{{ slack_members }}"
  email_domain: "{{ slack_email_domain }}"
  state_file: "{{ _job_notice_state_dir }}/state.json"
  coalesce_seconds: "{{ job_notice_coalesce_seconds | int }}"
  prefs_file: "{{ cluster_bot_prefs_file }}"
  dm_metrics: "{{ _job_notice_dm_metrics }}"
# What its DMs came to, for Prometheus (cluster_tools.slack.DmCounts), written as
# SlurmUser, a member of node_exporter_unprivileged_group (roles/system_accounts).
_job_notice_dm_metrics: "{{ node_exporter_unprivileged_dir }}/slack-dm-job-notice.prom"

# What this component installs, for its record (roles/component_record). The state (open
# messages, looked-up member IDs) is a cache and goes with it.
job_notice_items:
  - "file:{{ job_notice_command }}"
  - "file:{{ _job_notice_config }}"
  - "file:{{ cluster_tools_lib_config_records }}/job_notice.json"
  - "file:{{ _job_notice_token }}"
  - "dir:{{ _job_notice_state_dir }}"
  - "file:{{ _job_notice_dm_metrics }}"
  - "file:{{ _job_notice_dm_metrics }}.lock"
