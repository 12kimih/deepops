---
# Set up an NIS (YP) master server. Steps follow the LBNL/TLDP NIS-HOWTO and the
# ypinit(8)/ypserv(8) man pages. https://tldp.org/HOWTO/NIS-HOWTO/ypserv.html
- name: Assert nis_domain is set for the NIS master
  ansible.builtin.assert:
    that:
      - nis_domain is defined
      - (nis_domain | trim | length) > 0
    fail_msg: "nis_make_server is true but nis_domain is not defined (set it in group_vars)."

- name: Load OS-specific NIS server variables
  ansible.builtin.include_vars: "{{ ansible_os_family }}.yml"

# On Debian, installing ypserv tries to start it before the database exists (it
# would fail). Block daemon auto-start for the duration of the package install.
- name: Block daemon auto-start during package install (Debian)
  ansible.builtin.copy:
    content: |
      #!/bin/sh
      exit 101
    dest: /usr/sbin/policy-rc.d
    mode: "0755"
  when: ansible_os_family == "Debian"
  changed_when: false

- name: Install NIS server packages
  ansible.builtin.package:
    name: "{{ nis_server_packages }}"
    state: present

- name: Remove the daemon-start block (Debian)
  ansible.builtin.file:
    path: /usr/sbin/policy-rc.d
    state: absent
  when: ansible_os_family == "Debian"
  changed_when: false

# The NIS domain must be set (kernel domainname) before ypinit/ypserv, and persist
# across reboot.
- name: Set the NIS domain for the running system
  ansible.builtin.command: "nisdomainname {{ nis_domain }}"
  changed_when: false

- name: Persist the NIS domain (Debian /etc/defaultdomain)
  ansible.builtin.copy:
    dest: /etc/defaultdomain
    content: "{{ nis_domain }}\n"
    owner: root
    group: root
    mode: "0644"
  when: ansible_os_family == "Debian"

- name: Persist the NIS domain (RHEL /etc/sysconfig/network)
  ansible.builtin.lineinfile:
    path: /etc/sysconfig/network
    regexp: "^NISDOMAIN="
    line: "NISDOMAIN={{ nis_domain }}"
    create: true
    owner: root
    group: root
    mode: "0644"
  when: ansible_os_family == "RedHat"

# Restrict which client networks may query this server (security).
- name: Configure NIS securenets
  ansible.builtin.copy:
    dest: "{{ nis_server_securenets_path }}"
    content: |
      # Ansible managed -- edits will be overwritten (roles/nis_server).
      # NETMASK         NETWORK   -- hosts/networks allowed to query this NIS server.
      {% for line in nis_server_securenets %}
      {{ line }}
      {% endfor %}
    owner: root
    group: root
    mode: "0644"
  notify: Restart ypserv

# --- ypserv access rules -------------------------------------------------------
# Assert before writing: a protected map that is unrestricted, or listed after a
# catch-all that ypserv matches first, is served to anything securenets allows.
- name: Assert the protected maps are restricted and ordered ahead of any catch-all
  vars:
    nis_ypserv_maps: "{{ nis_server_ypserv_rules | map(attribute='map') | list }}"
    nis_ypserv_catchall: >-
      {{ nis_ypserv_maps.index('*') if '*' in nis_ypserv_maps else (nis_ypserv_maps | length) }}
    nis_ypserv_rule: >-
      {{ (nis_server_ypserv_rules | selectattr('map', 'eq', item) | list | first) | default({}) }}
  ansible.builtin.assert:
    that:
      - item in nis_ypserv_maps
      - nis_ypserv_rule.security | default('none') in ['port', 'deny', 'des']
      - (nis_ypserv_maps.index(item) | int) < (nis_ypserv_catchall | int)
    fail_msg: >-
      nis_server_ypserv_rules does not protect '{{ item }}'. It must appear with
      security port/deny/des AND before the catch-all `*` rule, because ypserv applies
      the first match -- otherwise the map is served to any unprivileged caller
      securenets allows, which publishes every password hash.
  loop: "{{ nis_server_ypserv_protected_maps }}"
  when: nis_server_manage_ypserv_conf | bool

- name: Configure ypserv access rules
  ansible.builtin.template:
    src: ypserv.conf.j2
    dest: /etc/ypserv.conf
    owner: root
    group: root
    mode: "0644"
  when: nis_server_manage_ypserv_conf | bool
  notify: Restart ypserv

- name: Ensure rpcbind and ypserv are enabled and running
  ansible.builtin.service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - rpcbind
    - "{{ nis_server_service }}"
  tags:
    - molecule-notest

# Build the NIS database once. ypinit -m reads the list of NIS servers from stdin;
# empty stdin (immediate EOF) accepts THIS host as the sole master. Idempotent via
# `creates`. Rebuild maps after passwd/group changes with `make -C /var/yp`.
# https://tldp.org/HOWTO/NIS-HOWTO/ypserv.html , man ypinit(8)
- name: Initialize the NIS master database (first run only)
  ansible.builtin.command:
    cmd: "{{ nis_server_ypinit }} -m"
    creates: "/var/yp/{{ nis_domain }}"
    stdin: ""
  tags:
    - molecule-notest

# Optional daemons: yppasswdd lets users change NIS passwords (yppasswd); ypxfrd
# speeds map transfer to NIS SLAVE servers. Best-effort -- the systemd unit name can
# vary by distro/version; if one does not start, enable it by hand and adjust
# nis_server_yppasswdd_service / nis_server_ypxfrd_service.
- name: Enable optional NIS server daemons (yppasswdd / ypxfrd)
  ansible.builtin.service:
    name: "{{ item.name }}"
    state: started
    enabled: true
  loop:
    - { name: "{{ nis_server_yppasswdd_service }}", want: "{{ nis_server_enable_yppasswdd }}" }
    - { name: "{{ nis_server_ypxfrd_service }}", want: "{{ nis_server_enable_ypxfrd }}" }
  loop_control:
    label: "{{ item.name }}"
  when: item.want | bool
  failed_when: false
  tags:
    - molecule-notest

# --- Cluster groups published through the NIS group map -----------------------
# See nis_export_groups in defaults/main.yml for why the GID has to be pinned and
# why it has to be >= GID_MIN.
- name: Read GID_MIN (the NIS group-map export threshold)
  ansible.builtin.command:
    cmd: awk '$1 == "GID_MIN" { print $2 }' /etc/login.defs
  register: nis_gid_min
  changed_when: false
  when: nis_export_groups | length > 0

- name: Assert exported group GIDs fall inside the NIS map range
  ansible.builtin.assert:
    that:
      - item.gid | int >= ((nis_gid_min.stdout | trim) | default('1000', true) | int)
    fail_msg: >-
      Group '{{ item.name }}' has gid {{ item.gid }}, below GID_MIN
      ({{ (nis_gid_min.stdout | trim) | default('1000', true) }}). /var/yp/Makefile
      drops such groups from the group map, so NIS clients would never see it.
      Choose a gid >= GID_MIN.
  loop: "{{ nis_export_groups }}"
  loop_control:
    label: "{{ item.name }} (gid {{ item.gid }})"
  when: nis_export_groups | length > 0

- name: Create the NIS-exported cluster groups
  ansible.builtin.group:
    name: "{{ item.name }}"
    gid: "{{ item.gid }}"
    state: present
  loop: "{{ nis_export_groups }}"
  loop_control:
    label: "{{ item.name }} (gid {{ item.gid }})"
  notify: Rebuild NIS maps

# Membership is ADDITIVE: this adds users to the group but never removes them, so a
# user deleted from `members` stays in the group until removed by hand on this node
# (`gpasswd -d <user> <group>`, then re-run the role to rebuild the maps).
- name: Add members to the NIS-exported cluster groups
  ansible.builtin.user:
    name: "{{ item.1 }}"
    groups: "{{ item.0.name }}"
    append: true
  loop: "{{ nis_export_groups | subelements('members', {'skip_missing': true}) }}"
  loop_control:
    label: "{{ item.1 }} -> {{ item.0.name }}"
  notify: Rebuild NIS maps

# --- Netgroups published through the netgroup maps -----------------------------
# Unlike a group, a netgroup is matched by name, so it escapes both the GID_MIN export
# filter and the numeric-gid path Slurm uses. See nis_export_netgroups in
# defaults/main.yml. Membership here is DECLARATIVE -- the file is rendered whole, so
# removing a user from the list removes their access on the next run.
- name: Publish the NIS netgroups
  ansible.builtin.template:
    src: netgroup.j2
    dest: /etc/netgroup
    owner: root
    group: root
    mode: "0644"
  when: nis_export_netgroups | length > 0
  notify: Rebuild NIS maps
