---
- name: Check the component state
  ansible.builtin.assert:
    that: nis_server_state in ['present', 'absent', 'kept']
    fail_msg: "nis_server_state must be present, absent or kept, not {{ nis_server_state }}."
    quiet: true

- name: "Make nis_server {{ nis_server_state }}"
  ansible.builtin.include_tasks: "{{ nis_server_state }}.yml"
  when: nis_server_state != 'kept'
