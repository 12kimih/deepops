---
# nis_server -- set up an NIS (YP) MASTER server (ypserv) so clients configured by
# the nis_client role can bind to it. Opt-in: the authentication.yml playbook runs
# this role only on the host where `nis_make_server` is true, and only when
# `nis_domain` is defined.
#
# NOTE: this role is new and NIS-server setup is environment-sensitive (domain
# resolution, the ypinit database build). Validate on your cluster after first run:
#   ypwhich -m            # should list maps
#   ypcat passwd          # should print NIS passwd entries
# Refs: https://wiki.debian.org/BullseyeNis , man ypinit(8), man ypserv(8)

# Required (shared with nis_client): the NIS domain this server is master for.
# nis_domain: example.nis

# Designate THIS host as the NIS master. Set true in host_vars for the server node
# (e.g. config/host_vars/<master>.yml: nis_make_server: true). Default false so the
# role is a no-op everywhere else.
nis_make_server: false

# /etc/ypserv.securenets (Debian) or /var/yp/securenets (RHEL): which client
# networks may query this server, as "NETMASK NETWORK" lines. The default allows
# localhost + the RFC1918 private ranges; TIGHTEN this to your actual cluster
# subnet (e.g. "255.255.255.0 192.0.2.0") -- a wide-open server is a security risk.
nis_server_securenets:
  - "255.0.0.0       127.0.0.0"        # localhost (required)
  - "255.0.0.0       10.0.0.0"         # 10.0.0.0/8    (RFC1918)
  - "255.240.0.0     172.16.0.0"       # 172.16.0.0/12 (RFC1918)
  - "255.255.0.0     192.168.0.0"      # 192.168.0.0/16 (RFC1918)

# Also run yppasswdd (lets users change NIS passwords with yppasswd) and ypxfrd
# (speeds map transfer to NIS SLAVE servers -- only needed if you run slaves).
nis_server_enable_yppasswdd: true
nis_server_enable_ypxfrd: false

# Cluster-wide groups to define on this node and publish through the NIS group map.
# Each entry is {name, gid, members}; empty by default, so nothing is exported.
#
#   nis_export_groups:
#     - name: dockerusers
#       gid: 4000
#       members: [alice, bob]
#
# WHY the GID must be pinned here rather than left to the OS:
# Slurm resolves a job's supplementary groups on the SUBMIT/controller node and ships
# the resulting *numeric* GID list into the job (send_gids, on by default since
# 20.11). The compute node never re-resolves them -- it just renders those numbers
# through its own group database. So a node-local group whose GID differs between
# nodes does not fail closed; it silently grants whatever OTHER group happens to hold
# that number on the compute node. Publishing the group through NIS under one fixed
# GID is what makes the name mean the same thing everywhere.
#
# WHY the GID must be >= GID_MIN:
# /var/yp/Makefile filters the group map to GID >= MINGID (taken from GID_MIN in
# /etc/login.defs, normally 1000). A group numbered below that is dropped from the
# map without a warning, so clients never see it no matter how often the maps are
# rebuilt. This role asserts the range instead of letting it fail silently.
nis_export_groups: []

# Netgroups to define on this node and publish through the netgroup maps. Each entry
# is {name, users}; empty by default, so /etc/netgroup is left alone.
#
#   nis_export_netgroups:
#     - name: cluster_admins
#       users: [alice, bob]
#
# A netgroup is matched by NAME, so it sidesteps both problems a group has here: it is
# not subject to the GID_MIN export filter, and it does not depend on every node
# agreeing what a number means. That makes it the right mechanism for anything that
# must mean the same thing whether it is evaluated inside a Slurm job (where the gid
# list comes from the submit node) or on a direct SSH login (where it comes from the
# node itself) -- sudoers `+netgroup` being the main example.
#
# WARNING: this manages /etc/netgroup as a whole. Any hand-written entries in that
# file are replaced once this list is non-empty.
nis_export_netgroups: []
