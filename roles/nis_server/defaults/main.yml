---
# nis_server -- an NIS (YP) master (ypserv) for the clients roles/nis_client binds: on the
# [nis-master] host when nis_domain is set (roles/deploy_defaults). It publishes the
# account source's files and the cluster groups and netgroups (directory_groups,
# directory_netgroups in roles/directory_defaults).
#
# NOTE: NIS-server setup is environment-sensitive (domain resolution, the ypinit
# database build). Validate on your cluster after first run:
#   ypwhich -m            # should list maps
#   ypcat passwd          # should print NIS passwd entries
# Refs: https://wiki.debian.org/BullseyeNis , man ypinit(8), man ypserv(8)

# present, absent, or kept (do nothing) (docs/deepops/component-state.md); a deploy
# sets it from deepops_components. Absent only when named in deepops_component_removals.
nis_server_state: present

# /etc/ypserv.securenets (Debian) or /var/yp/securenets (RHEL): which client
# networks may query this server, as "NETMASK NETWORK" lines. The default allows
# localhost + the RFC1918 private ranges; TIGHTEN this to your actual cluster
# subnet (e.g. "255.255.255.0 192.0.2.0") -- a wide-open server is a security risk.
nis_server_securenets:
  - "255.0.0.0       127.0.0.0"        # localhost (required)
  - "255.0.0.0       10.0.0.0"         # 10.0.0.0/8    (RFC1918)
  - "255.240.0.0     172.16.0.0"       # 172.16.0.0/12 (RFC1918)
  - "255.255.0.0     192.168.0.0"      # 192.168.0.0/16 (RFC1918)

# Also run yppasswdd (lets users change NIS passwords with yppasswd) and ypxfrd
# (speeds map transfer to NIS SLAVE servers -- only needed if you run slaves).
nis_server_enable_yppasswdd: true
nis_server_enable_ypxfrd: false

# --- ypserv access rules (/etc/ypserv.conf) -----------------------------------
# Manage the access rules rather than leaving them to whatever the package shipped.
# NIS does no authentication of its own; these rules are what restrict access to the
# maps. The `port` security setting makes ypserv answer for a map only when the
# request comes from a privileged port (< 1024), i.e. a root process. PAM's
# setuid-root helper qualifies; an ordinary user shell does not.
nis_server_manage_ypserv_conf: true

nis_server_ypserv_options:
  files: 30
  slp: "no"
  slp_timeout: 3600
  xfr_check_port: "yes"

# ypserv applies the FIRST matching rule, so map-specific entries must precede the
# catch-all. The role asserts that every map in nis_server_ypserv_protected_maps is
# restricted and is listed before any `*` map rule.
nis_server_ypserv_rules:
  - { host: "*", domain: "*", map: "shadow.byname", security: "port" }
  - { host: "*", domain: "*", map: "passwd.adjunct.byname", security: "port" }
  - { host: "*", domain: "*", map: "*", security: "none" }

# Maps that must not be served to unprivileged callers. The role asserts each of
# these is restricted; dropping one from this list removes that check.
nis_server_ypserv_protected_maps:
  - shadow.byname
  - passwd.adjunct.byname
