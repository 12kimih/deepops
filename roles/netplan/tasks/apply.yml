---
# A netplan change with a way back, the one way any role changes /etc/netplan
# (include_role: netplan, tasks_from: apply):
#   netplan_apply_file      the file to write (absolute path under netplan_dir)
#   netplan_apply_content   its content ("" leaves the file as it is)
#   netplan_apply_set_aside files to take out of netplan_dir, kept (roles/host_baseline)
#
# Ansible reaches the host over the network it changes, so: the directory is copied
# aside, the change written and checked by `netplan generate` (refused: the copy goes
# back), then the host arms a timer that puts the copy back and applies it, the change
# is applied in the background and Ansible waits to reach the host again; only then is
# the timer stopped. A change that cuts the host off is undone by the host itself after
# netplan_rollback_seconds. `netplan try` would do the same but waits for a key press.
- name: Check the request
  ansible.builtin.assert:
    that:
      - netplan_apply_file is match('^' ~ netplan_dir ~ '/[^/]+\\.ya?ml$')
      - (netplan_apply_set_aside | default([])) | reject('match', '^' ~ netplan_dir ~ '/') | list | length == 0
      - netplan_rollback_seconds | int >= 120
    fail_msg: >-
      netplan apply takes a file and set-aside paths under /etc/netplan, and at least
      120 s for the way back.
    quiet: true

- name: Keep the current configuration to go back to
  change_command:
    argv:
      - sh
      - -c
      - 'rm -rf -- "$1" && mkdir -p -m 0700 -- "$1" && cp -a "$2"/. "$1"/'
      - keep-netplan
      - "{{ netplan_rollback_dir }}"
      - "{{ netplan_dir }}"

- name: Write and check the change
  block:
    - name: Write {{ netplan_apply_file }}
      ansible.builtin.copy:
        content: "{{ netplan_apply_content }}"
        dest: "{{ netplan_apply_file }}"
        owner: root
        group: root
        mode: "0600"
      when: netplan_apply_content | length > 0

    - name: Set aside the files no deepops role wrote
      ansible.builtin.include_role:
        name: host_baseline
        tasks_from: set_aside
      vars:
        host_baseline_set_aside_paths: "{{ netplan_apply_set_aside | default([]) }}"
        host_baseline_set_aside_dir: "{{ netplan_set_aside_dir }}"
      when: netplan_apply_set_aside | default([]) | length > 0

    - name: Check netplan accepts it
      ansible.builtin.command:
        argv: [netplan, generate]
      changed_when: false
      when: not ansible_check_mode
  rescue:
    - name: Put the previous configuration back
      change_command:
        argv:
          - sh
          - -c
          - 'find "$2" -maxdepth 1 -type f -delete && cp -a "$1"/. "$2"/'
          - restore-netplan
          - "{{ netplan_rollback_dir }}"
          - "{{ netplan_dir }}"

    - name: Report that the configuration was refused
      ansible.builtin.fail:
        msg: "netplan refused the change to {{ netplan_apply_file }}; the previous configuration is back in place"

- name: Arm the way back
  change_command:
    argv:
      - systemd-run
      - "--unit={{ netplan_rollback_unit }}"
      - "--on-active={{ netplan_rollback_seconds }}"
      - --timer-property=AccuracySec=1s
      - sh
      - -c
      - 'find "$2" -maxdepth 1 -type f -delete && cp -a "$1"/. "$2"/ && netplan apply'
      - rollback-netplan
      - "{{ netplan_rollback_dir }}"
      - "{{ netplan_dir }}"

# In the background: the connection may drop while the links are reconfigured.
- name: Apply the change
  change_command:
    argv: [netplan, apply]
  async: 120
  poll: 0
  when: not ansible_check_mode

- name: Preview applying the change
  change_command:
    argv: [netplan, apply]
  when: ansible_check_mode

- name: Reach the host again
  ansible.builtin.wait_for_connection:
    delay: 5
    timeout: "{{ netplan_rollback_seconds | int - 60 }}"
  when: not ansible_check_mode

- name: Disarm the way back
  change_command:
    argv: [systemctl, stop, "{{ netplan_rollback_unit }}.timer"]

- name: Drop the copy kept to go back to
  ansible.builtin.file:
    path: "{{ netplan_rollback_dir }}"
    state: absent
