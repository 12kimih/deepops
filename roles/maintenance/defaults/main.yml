---
# maintenance -- the steps of taking a node out of service, changing it and putting it
# back, as separate task files a playbook calls in order (tasks_from):
#
#   drain    stop new Slurm jobs on the node and wait for the running ones to end
#   upgrade  full package upgrade, including what unattended upgrades hold back
#            (kernel, systemd, libc, GPU stack, scheduler): those wait for this window
#   reboot   reboot if the upgrade asks for it (or always), detaching NFS first;
#            a Slurm compute node only once drained
#   reboot_request  what a role calls instead of rebooting: marks the reboot pending
#   require_drained what a role calls before a change that breaks running jobs
#   role     run the role maintenance_role on the node (a driver switch, between drain
#            and reboot)
#   verify   the node is healthy again: slurmd, GPUs, DCGM diagnostics, NHC
#   resume   return the node to Slurm, only if this run drained it
#
# run.yml runs a list of them (maintenance_steps) so that a failed node stops the run
# only once its batch is done. playbooks/utilities/apt-upgrade.yml runs them one node
# at a time;
# playbooks/utilities/reboot.yml runs the reboot step alone.

# Slurm commands run on the controller.
maintenance_slurm_controller: "{{ (groups['slurm-master'] | default([]) | first) | default('') }}"
# Where those tasks are delegated. ansible-core resolves delegate_to before `when`, so a
# task skipped for want of a controller still needs a host name: its own.
maintenance_slurm_delegate: "{{ maintenance_slurm_controller or inventory_hostname }}"
maintenance_slurm_bin: "{{ slurm_install_prefix }}/bin"
# The reason recorded on the nodes this run drains; resume only touches those (and
# those an earlier run drained with the same reason).
maintenance_reason: "maintenance: upgrade"
# How long to wait for running jobs to finish, and how often to look (the cluster's
# rule: no scheduler polling faster than every 30 s).
maintenance_drain_timeout: 86400
maintenance_drain_poll: 60

# Reboot even when the upgrade does not ask for it.
maintenance_force_reboot: false
# reboot_request: reboot at once instead of leaving the reboot pending. Only for nodes
# nobody uses yet (a first deploy); a Slurm compute node must still be drained.
maintenance_reboot_now: false
# Reboot a Slurm compute node that still takes jobs (its running jobs are lost).
maintenance_reboot_undrained: false
# require_drained (set by its caller): the change, whether to go ahead undrained, and how
# to do it properly.
maintenance_change: this change
maintenance_undrained_ok: false
maintenance_drain_hint: ""
# role: the role the step applies.
maintenance_role: ""

# RHEL family: dnf --nobest, upgrading what can be upgraded when the newest version of
# a package cannot be installed (the DGX software guides ask for it).
maintenance_dnf_nobest: false
# Unmount the network filesystems first: a hard mount from a peer that is going down
# too can leave the node blocked in D state, never reaching the reboot.
maintenance_detach_nfs: true
# A GPU server can spend several minutes in POST and memory training.
maintenance_reboot_timeout: 1800
# reboot_request: the role that asks (default: the one including it); its request
# waits in maintenance_reboot_requests_dir (roles/deepops_paths), and the reboot step
# runs each requesting role again after the reboot.
maintenance_reboot_requester: "{{ (ansible_parent_role_names | default([]) | first) | default('') }}"

# Hosts the rest of the cluster depends on: the Slurm controller and the NFS servers.
# Their package upgrades restart no service (policy-rc.d; the new code runs from their
# next reboot): a restart of nfs-server under running jobs hung the cluster on
# 2026-11-18, and needrestart does not cover the restarts packages make themselves.
# Rebooting one is allowed while jobs run: they run on the compute nodes and survive
# it (I/O to a hard NFS mount waits for the server to come back).
maintenance_shared_host: >-
  {{ inventory_hostname in (groups['slurm-master'] | default([])) + (groups['slurm-nfs'] | default([])) }}

# verify: the units that must be active (what the deploy runs on each kind of host),
# and whether to require GPUs and NHC.
maintenance_verify_units: >-
  {{ (['slurmd'] if inventory_hostname in groups['slurm-node'] | default([]) else [])
     + (['mariadb', 'munge', 'slurmdbd', 'slurmctld'] if inventory_hostname in groups['slurm-master'] | default([]) else [])
     + (['nfs-server'] if inventory_hostname in groups['slurm-nfs'] | default([]) else []) }}
# A compute node without GPUs (maintenance_gpus_baseline: the gpus fact when the run started)
# is checked without them.
maintenance_verify_gpus: >-
  {{ inventory_hostname in groups['slurm-node'] | default([])
     and maintenance_gpus_baseline | default(0) | int > 0 }}
# The DCGM diagnostic run level (dcgmi diag -r): 0 off, 1 quick (seconds), 2 medium
# (about two minutes), 3 long stress (about half an hour), 4 extended. It loads every
# GPU, so it runs only here, on a node this run drained. Level 1 by default wherever
# DCGM is installed (install_dcgm); playbooks/utilities/gpu-diag.yml runs a long one.
maintenance_verify_dcgm_level: "{{ 1 if maintenance_verify_gpus | bool and install_dcgm | bool else 0 }}"
# The longest each level may run (seconds), about four times its usual length.
maintenance_verify_dcgm_timeout: {1: 600, 2: 1200, 3: 7200, 4: 28800}
# NHC where the deploy puts it (playbooks/slurm-cluster/nhc.yml: the compute nodes), not
# wherever an nhc binary happens to be: a stale hand install elsewhere is not a health check.
maintenance_verify_nhc: "{{ inventory_hostname in groups['slurm-node'] | default([]) and slurm_install_nhc | bool }}"

# Kernel policy settings every host must share, each with the playbook that sets it;
# consistency.yml fails when they differ and names that playbook. The user-namespace
# restriction is the one a site most often changes by hand on one node (a `sysctl -w`
# that the next run of its playbook undoes). (Not user.max_*_namespaces: their defaults
# scale with memory.)
maintenance_consistency_sysctls:
  kernel.apparmor_restrict_unprivileged_userns: playbooks/container/enroot.yml

# The packages a role installs from a release file rather than a repository, each with
# its playbook: the maintenance upgrade (apt-upgrade.yml) cannot level them, the role's
# next run does, so a difference names that playbook. tests/fleet keeps it complete.
maintenance_consistency_packages:
  enroot: playbooks/container/enroot.yml
  enroot+caps: playbooks/container/enroot.yml
  enroot-hardened: playbooks/container/enroot.yml
  enroot-hardened+caps: playbooks/container/enroot.yml
  nvidia-mig-manager: playbooks/nvidia-software/nvidia-mig.yml
