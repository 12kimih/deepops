---
# Every node is drained before the work, a DOWN one too: Slurm returns a DOWN node to
# service by itself when its slurmd registers (ReturnToService=2), which would put jobs
# on it mid-verify. A node another person took out keeps their reason and is not resumed
# by this run; one an earlier run of this step drained (the same reason; slurmctld may
# append " : Not responding") is this run's to resume, so a rerun after a fix returns it.
- name: Read the node's Slurm state
  ansible.builtin.command:
    argv: ["{{ maintenance_slurm_bin }}/scontrol", --json, show, node, "{{ inventory_hostname }}"]
  delegate_to: "{{ maintenance_slurm_controller }}"
  register: maintenance_node
  changed_when: false
  check_mode: false  # read-only; --check needs the result

- name: Note whether this run takes the node out
  vars:
    _node: "{{ maintenance_node.stdout | slurm_node }}"
  ansible.builtin.set_fact:
    maintenance_drained_here: >-
      {{ not (_node.drain or _node.down) or _node.reason == maintenance_reason
         or _node.reason.startswith(maintenance_reason ~ ' : ') }}
    maintenance_needs_drain: "{{ not _node.drain }}"

- name: Drain the node
  ansible.builtin.command:
    argv: ["{{ maintenance_slurm_bin }}/scontrol", update, "nodename={{ inventory_hostname }}", state=drain,
           "reason={{ maintenance_reason }}"]
  delegate_to: "{{ maintenance_slurm_controller }}"
  changed_when: true
  when: maintenance_needs_drain | bool

- name: Wait for the jobs on the node to finish
  ansible.builtin.command:
    argv: ["{{ maintenance_slurm_bin }}/squeue", -h, -t, "RUNNING,COMPLETING,SUSPENDED", -w, "{{ inventory_hostname }}", -o, "%i"]
  delegate_to: "{{ maintenance_slurm_controller }}"
  register: maintenance_jobs
  until: maintenance_jobs.stdout | trim | length == 0
  retries: "{{ (maintenance_drain_timeout | int) // (maintenance_drain_poll | int) }}"
  delay: "{{ maintenance_drain_poll }}"
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

# An exhausted `until` leaves no message of its own.
- name: Fail when jobs outlast the drain timeout
  ansible.builtin.fail:
    msg: >-
      Jobs {{ maintenance_jobs.stdout_lines | join(', ') }} still run on {{ inventory_hostname }} after
      {{ maintenance_drain_timeout }}s (maintenance_drain_timeout); it stays drained.
      {{ maintenance_jobs.stderr | default('') }}
  when:
    - maintenance_jobs is not skipped
    - maintenance_jobs.rc != 0 or maintenance_jobs.stdout | trim | length > 0
