---
# Make sure the package manager can work before changing packages: an install or
# removal interrupted earlier (a lost connection, a Ctrl-C, a crash) leaves dpkg
# refusing everything ("dpkg was interrupted") until it is finished, and that blocks
# every later role and the security updates. Shared by every role that installs or
# removes packages (include_role: maintenance, tasks_from: apt_health).
- name: Check the package database (Debian)
  when: ansible_facts.os_family == 'Debian'
  block:
    # fuser (psmisc) tells whether something holds dpkg's lock. Ubuntu servers ship it,
    # minimal images do not: install it first (apt itself waits for the lock).
    - name: Install fuser
      ansible.builtin.apt:
        name: psmisc
        state: present
        update_cache: true
        cache_valid_time: 3600
        lock_timeout: 600

    # fuser exits 1 when nothing holds the lock, 0 while something does; anything else
    # is an error, not a free lock.
    - name: Wait for any running apt or dpkg to finish
      ansible.builtin.command:
        argv: [fuser, /var/lib/dpkg/lock-frontend]
      register: maintenance_dpkg_lock
      until: maintenance_dpkg_lock.rc == 1
      retries: 60
      delay: 10
      changed_when: false
      failed_when: maintenance_dpkg_lock.rc > 1
      check_mode: false  # read-only; --check needs the result

    - name: Look for half-installed or half-removed packages
      ansible.builtin.command:
        argv: [dpkg, --audit]
      register: maintenance_dpkg_audit
      changed_when: false
      failed_when: false
      check_mode: false  # read-only; --check needs the result

    # What apt itself asks for: finish the interrupted configuration first.
    - name: Finish what an interrupted dpkg run left
      change_command:
        argv: [dpkg, --configure, -a]
      environment:
        DEBIAN_FRONTEND: noninteractive
      when: maintenance_dpkg_audit.stdout | trim | length > 0
