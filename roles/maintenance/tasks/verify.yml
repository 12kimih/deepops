---
# Every GPU the node had when this run started (maintenance_gpus_baseline, read by run
# before any step) must answer again. Checked first: a missing GPU is what a failed
# slurmd or NHC would only hint at.
- name: Check every GPU answers
  when: maintenance_verify_gpus | bool and not ansible_check_mode
  vars:
    maintenance_gpus_expected: "{{ maintenance_gpus_baseline }}"
  block:
    # In a transient unit: nvidia-smi run directly from a session leaks into its cgroup.
    - name: List the GPUs the driver answers for
      ansible.builtin.command:
        argv: [systemd-run, --wait, --pipe, --collect, --quiet, --, nvidia-smi, -L]
      register: maintenance_gpus
      changed_when: false
      failed_when: false
      check_mode: false  # read-only

    # roles/facts gpus.fact, read again: the GPUs on the PCIe bus now.
    - name: Count the GPUs on the PCIe bus now
      ansible.builtin.setup:
        filter: ansible_local

    - name: Fail when a GPU is missing
      ansible.builtin.fail:
        msg: >-
          {{ maintenance_gpus.stdout_lines | select('match', 'GPU [0-9]') | list | length }} of
          {{ maintenance_gpus_expected }} GPUs answer, {{ ansible_facts.ansible_local.gpus.count }} are on the
          PCIe bus. Fewer on the bus: a GPU, riser or PCIe switch dropped off; power-cycle the node
          through its BMC, and if they stay gone it is hardware. All on the bus: the driver failed for
          some; see dmesg | grep -E 'NVRM|Xid'.
      when: >-
        maintenance_gpus.rc != 0 or
        maintenance_gpus.stdout_lines | select('match', 'GPU [0-9]') | list | length < maintenance_gpus_expected | int

# Every service up, within five minutes of the boot.
- name: Wait for the node's services
  ansible.builtin.include_tasks: unit_healthy.yml
  vars:
    maintenance_healthy_units: "{{ maintenance_verify_units }}"
    maintenance_healthy_wait: 300

# Slurm must see the node as declared: when the slurmd started above registers, a GRES
# it finds unlike slurm.conf (a GPU missing, another type) marks the node INVALID_REG
# with the reason. The state before that registration says nothing (a drained node is
# IDLE+DRAIN before and after, NOT_RESPONDING too after a reboot), and slurmd tells
# systemd it is ready before it registers; so this waits until Slurm records a slurmd
# start no earlier than this one's and hears from it. plugins/filter/slurm_node.py
# reads the state.
- name: Check Slurm sees the node as declared
  when:
    - "'slurmd' in maintenance_verify_units"
    - maintenance_slurm_controller | length > 0
    - not ansible_check_mode
  block:
    - name: Read when this slurmd started
      ansible.builtin.shell:
        cmd: date -d "$(systemctl show slurmd --property=ExecMainStartTimestamp --value)" +%s
      register: maintenance_slurmd_start
      changed_when: false
      check_mode: false  # read-only

    - name: Read the node as Slurm sees it after this slurmd registered
      ansible.builtin.command:
        argv: ["{{ maintenance_slurm_bin }}/scontrol", --json, show, node, "{{ inventory_hostname }}"]
      delegate_to: "{{ maintenance_slurm_delegate }}"
      register: maintenance_slurm_view
      vars:
        _node: "{{ maintenance_slurm_view.stdout | slurm_node }}"
      until: >-
        maintenance_slurm_view.rc == 0 and _node.found and (_node.invalid or (_node.responding
        and _node.slurmd_started | default(0, true) | int >= maintenance_slurmd_start.stdout | int))
      retries: 18
      delay: 10
      changed_when: false
      failed_when: false
      check_mode: false  # read-only

    - name: Fail when Slurm finds the node unlike its declaration, or never hears from it
      vars:
        _node: "{{ maintenance_slurm_view.stdout | slurm_node }}"
      ansible.builtin.fail:
        msg: >-
          {% if maintenance_slurm_view.rc != 0 %}Could not read {{ inventory_hostname }} from Slurm:
          {{ maintenance_slurm_view.stderr }}{% elif _node.invalid %}Slurm marks {{ inventory_hostname }}
          {{ _node.state }}: {{ _node.reason or 'no reason given' }}. Compare slurm.conf's Gres= for the node
          with what it found (scontrol show node, slurmd -G).{% else %}Slurm has not heard from the slurmd
          started at {{ maintenance_slurmd_start.stdout }} on {{ inventory_hostname }} after three minutes
          (state {{ _node.state | default('unknown') }}, slurmd start it knows {{ _node.slurmd_started | default('none') }}):
          see journalctl -u slurmd on the node (MUNGE key, firewall, --conf-server).{% endif %}
      when: >-
        maintenance_slurm_view.rc != 0 or not _node.found or _node.invalid or not (_node.responding
        and _node.slurmd_started | default(0, true) | int >= maintenance_slurmd_start.stdout | int)

# Fails the node on any failed test; the run stops with the node still drained. After
# a reboot the host engine may still be starting: only that is waited for. A hung run is
# killed at its level's limit and fails the node like a failed test.
- name: Run the DCGM diagnostics
  ansible.builtin.command:
    argv:
      - systemd-run
      - --wait
      - --pipe
      - --collect
      - --quiet
      - "--property=RuntimeMaxSec={{ dcgm_diag_timeout[maintenance_verify_dcgm_level | int] }}"
      - --
      - dcgmi
      - diag
      - -r
      - "{{ maintenance_verify_dcgm_level }}"
  register: maintenance_dcgm
  until: maintenance_dcgm.rc == 0 or 'Unable to establish a connection' not in (maintenance_dcgm.stdout ~ maintenance_dcgm.stderr)
  retries: 12
  delay: 10
  changed_when: false
  when: maintenance_verify_dcgm_level | int > 0 and not ansible_check_mode

- name: Report the DCGM diagnostics
  ansible.builtin.debug:
    msg: "{{ maintenance_dcgm.stdout_lines }}"
  when: maintenance_dcgm.stdout_lines is defined

# A node that should have NHC and lacks it fails here, rather than passing unchecked.
- name: Run the node health check
  ansible.builtin.command:
    argv: ["{{ nhc_program }}"]
  changed_when: false
  when: maintenance_verify_nhc | bool and not ansible_check_mode
