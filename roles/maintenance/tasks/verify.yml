---
# A service that does not come up fails the node with its journal from this boot,
# which says why; its systemd properties do not.
- name: Wait for the node's services
  ansible.builtin.command:
    argv: [systemctl, is-active, "{{ item }}"]
  register: maintenance_unit
  until: maintenance_unit.stdout == 'active'
  retries: 30
  delay: 10
  changed_when: false
  failed_when: false
  loop: "{{ maintenance_verify_units }}"
  when: not ansible_check_mode

- name: Read the journal of each service that did not start
  ansible.builtin.command:
    argv: [journalctl, --boot, --unit, "{{ item.item }}", --lines, "40", --no-pager, --output, short-precise]
  register: maintenance_unit_journal
  changed_when: false
  loop: "{{ maintenance_unit.results | default([]) | selectattr('stdout', 'defined') | rejectattr('stdout', 'eq', 'active') }}"
  loop_control:
    label: "{{ item.item }}"
  when: not ansible_check_mode

- name: Fail on each service that did not start
  ansible.builtin.fail:
    msg: |-
      {{ item.item.item }} is {{ item.item.stdout }} five minutes after the boot. Its journal:
      {{ item.stdout }}
  loop: "{{ maintenance_unit_journal.results | default([]) }}"
  loop_control:
    label: "{{ item.item.item }}"
  when: not ansible_check_mode

# In a transient unit: nvidia-smi run directly from a session leaks into its cgroup.
- name: Check the GPUs answer
  ansible.builtin.command:
    argv: [systemd-run, --wait, --pipe, --collect, --quiet, --, nvidia-smi, -L]
  register: maintenance_gpus
  changed_when: false
  failed_when: maintenance_gpus.rc != 0 or maintenance_gpus.stdout is not search('^GPU \\d', multiline=True)
  when: maintenance_verify_gpus | bool and not ansible_check_mode

# Fails the node on any failed test; the run stops with the node still drained. After
# a reboot the host engine may still be starting: only that is waited for. A hung run is
# killed at its level's limit and fails the node like a failed test.
- name: Run the DCGM diagnostics
  ansible.builtin.command:
    argv:
      - systemd-run
      - --wait
      - --pipe
      - --collect
      - --quiet
      - "--property=RuntimeMaxSec={{ maintenance_verify_dcgm_timeout[maintenance_verify_dcgm_level | int] }}"
      - --
      - dcgmi
      - diag
      - -r
      - "{{ maintenance_verify_dcgm_level }}"
  register: maintenance_dcgm
  until: maintenance_dcgm.rc == 0 or 'Unable to establish a connection' not in (maintenance_dcgm.stdout ~ maintenance_dcgm.stderr)
  retries: 12
  delay: 10
  changed_when: false
  when: maintenance_verify_dcgm_level | int > 0 and not ansible_check_mode

- name: Report the DCGM diagnostics
  ansible.builtin.debug:
    msg: "{{ maintenance_dcgm.stdout_lines }}"
  when: maintenance_dcgm.stdout_lines is defined

- name: Look for NHC
  ansible.builtin.stat:
    path: /usr/sbin/nhc
  register: maintenance_nhc

- name: Run the node health check
  ansible.builtin.command:
    argv: [/usr/sbin/nhc]
  changed_when: false
  when: maintenance_verify_nhc | bool and maintenance_nhc.stat.exists and not ansible_check_mode
