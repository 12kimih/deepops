---
- name: Check whether the upgrade asks for a reboot
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: maintenance_reboot_required

# The machine Ansible runs on (the controller, when the playbook is started there)
# cannot be rebooted by the play: the reboot kills the run halfway. Its reboot is left
# pending (/var/run/reboot-required, reported by the os_updates metrics) for its
# operator to do once the run has finished.
- name: Read whether this host is the machine running Ansible
  ansible.builtin.slurp:
    src: /etc/machine-id
  register: maintenance_machine_id
  when: maintenance_force_reboot | bool or maintenance_reboot_required.stat.exists

- name: Note whether this host is the machine running Ansible
  ansible.builtin.set_fact:
    maintenance_reboot_self: >-
      {{ maintenance_machine_id is not skipped
         and (maintenance_machine_id.content | b64decode | trim) == (lookup('ansible.builtin.file', '/etc/machine-id') | trim) }}

- name: Leave the reboot of the machine running Ansible to its operator
  when: maintenance_reboot_self | bool
  block:
    - name: Ask for the reboot
      ansible.builtin.copy:
        dest: /var/run/reboot-required
        content: "*** System restart required ***\n"
        owner: root
        group: root
        mode: "0644"

    - name: Say how to finish it
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} runs this playbook, so it is not rebooted now.
          When the run has finished: `sudo systemctl reboot` there, then
          playbooks/utilities/fleet-consistency.yml.

- name: Reboot
  when:
    - maintenance_force_reboot | bool or maintenance_reboot_required.stat.exists
    - not maintenance_reboot_self | bool
  block:
    # Every reboot comes through here, so this is where a node that runs jobs is
    # protected.
    - name: Require the node drained
      ansible.builtin.include_tasks: require_drained.yml
      vars:
        maintenance_change: a reboot
        maintenance_undrained_ok: "{{ maintenance_reboot_undrained }}"
        maintenance_drain_hint: >-
          playbooks/utilities/apt-upgrade.yml -e hostlist={{ inventory_hostname }} -e maintenance_force_reboot=true
          drains it, reboots it and returns it; -e maintenance_reboot_undrained=true
          reboots it anyway, losing its jobs.

    # Triggers first, or the umount re-arms a mount against a dying server.
    - name: Detach the shared filesystems before the reboot
      ansible.builtin.shell:
        cmd: |
          systemctl stop '*.automount' 2>/dev/null || true
          umount -l -f -a -t nfs,nfs4 2>/dev/null || true
          exit 0
      changed_when: false
      when: maintenance_detach_nfs | bool

    # ansible.cfg's single connection attempt and keepalives let the reboot module
    # re-check its deadline between probes and see the node come back.
    - name: Reboot and wait for the host to come back
      ansible.builtin.reboot:
        msg: "Reboot by Ansible: {{ maintenance_reason }}"
        pre_reboot_delay: 5
        post_reboot_delay: 15
        reboot_timeout: "{{ maintenance_reboot_timeout }}"
        connect_timeout: 5
