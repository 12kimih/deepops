---
- name: Check whether the upgrade asks for a reboot
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: maintenance_reboot_required

# The machine Ansible runs on (the controller, when the playbook is started there)
# cannot be rebooted by the play: the reboot kills the run halfway. Its reboot is left
# pending (/var/run/reboot-required, reported by the os_updates metrics) for its
# operator to do once the run has finished.
- name: Find out whether this host is the machine running Ansible
  ansible.builtin.include_tasks: runs_ansible.yml
  when: maintenance_force_reboot | bool or maintenance_reboot_required.stat.exists

- name: Note whether this host is the machine running Ansible
  ansible.builtin.set_fact:
    maintenance_reboot_self: >-
      {{ (maintenance_force_reboot | bool or maintenance_reboot_required.stat.exists)
         and maintenance_runs_ansible | default(false) | bool }}

- name: Leave the reboot of the machine running Ansible to its operator
  when: maintenance_reboot_self | bool
  block:
    - name: Ask for the reboot
      ansible.builtin.copy:
        dest: /var/run/reboot-required
        content: "*** System restart required ***\n"
        owner: root
        group: root
        mode: "0644"

    - name: Say how to finish it
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} runs this playbook, so it is not rebooted now.
          When the run has finished: `sudo systemctl reboot` there, then
          playbooks/utilities/fleet-consistency.yml.

- name: Reboot
  when:
    - maintenance_force_reboot | bool or maintenance_reboot_required.stat.exists
    - not maintenance_reboot_self | bool
  block:
    # Every reboot comes through here, so this is where a node that runs jobs is
    # protected.
    - name: Require the node drained
      ansible.builtin.include_tasks: require_drained.yml
      vars:
        maintenance_change: a reboot
        maintenance_undrained_ok: "{{ maintenance_reboot_undrained }}"
        maintenance_drain_hint: >-
          playbooks/utilities/apt-upgrade.yml -e hostlist={{ inventory_hostname }} -e maintenance_force_reboot=true
          drains it, reboots it and returns it; -e maintenance_reboot_undrained=true
          reboots it anyway, losing its jobs.

    # Triggers first, or the umount re-arms a mount against a dying server.
    - name: Detach the shared filesystems before the reboot
      change_shell:
        cmd: |
          systemctl stop '*.automount' 2>/dev/null || true
          umount -l -f -a -t nfs,nfs4 2>/dev/null || true
          exit 0
      # Only a clean shutdown can hang on a dead mount; a power cycle has none. And once
      # /home is gone, a new SSH session (the persistent one lapses while the other
      # hosts of the batch reboot) cannot read authorized_keys and is refused.
      when:
        - maintenance_detach_nfs | bool
        - maintenance_reboot_method == 'os'

    # ansible.cfg's single connection attempt and keepalives let the reboot module
    # re-check its deadline between probes and see the node come back.
    - name: Reboot and wait for the host to come back
      ansible.builtin.reboot:
        msg: "Reboot by Ansible: {{ maintenance_reason }}"
        pre_reboot_delay: 5
        post_reboot_delay: 15
        reboot_timeout: "{{ maintenance_reboot_timeout }}"
        connect_timeout: 5
      when: maintenance_reboot_method == 'os'

    # A host whose hardware comes back whole only from a cold start (devices that drop
    # off the bus on a warm reboot) is power-cycled through its BMC instead.
    - name: Power-cycle the host through its BMC
      when: maintenance_reboot_method == 'bmc_cycle'
      block:
        - name: Read the boot before the power cycle
          ansible.builtin.slurp:
            src: /proc/sys/kernel/random/boot_id
          register: maintenance_boot_before

        - name: Cycle the chassis power
          ansible.builtin.include_role:
            name: bmc
            tasks_from: chassis
          vars:
            bmc_power_action: cycle
            bmc_power_undrained: "{{ maintenance_reboot_undrained }}"

        # The cycle only previews under --check: there is no boot to wait for or prove.
        - name: Confirm the host booted again
          when: not ansible_check_mode
          block:
            - name: Wait for the host to come back
              ansible.builtin.wait_for_connection:
                delay: 60
                timeout: "{{ maintenance_reboot_timeout }}"

            - name: Read the boot after the power cycle
              ansible.builtin.slurp:
                src: /proc/sys/kernel/random/boot_id
              register: maintenance_boot_after

            - name: Require that the host really booted again
              ansible.builtin.assert:
                that: maintenance_boot_after.content != maintenance_boot_before.content
                fail_msg: "{{ inventory_hostname }} answers with the same boot as before the power cycle."
                quiet: true

    # The work the asking roles could only do on the new kernel or module (a driver's
    # persistence check, a kernel setting's check): each runs again, then its request
    # goes. A role still running (it asked with maintenance_reboot_now) carries on
    # itself. A failed rerun keeps the request for the next maintenance run.
    - name: Find the roles that waited for this reboot
      find_present:
        paths: "{{ maintenance_reboot_requests_dir }}"
        file_type: file
      register: maintenance_reboot_requests

    - name: Run each waiting role again on the new boot
      ansible.builtin.include_role:
        name: "{{ maintenance_rerun_role }}"
        public: true
      loop: "{{ maintenance_reboot_requests.files | map(attribute='path') | map('basename')
                | reject('in', ansible_parent_role_names | default([])) | list }}"
      loop_control:
        loop_var: maintenance_rerun_role

    - name: Clear the reboot requests
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ maintenance_reboot_requests.files | map(attribute='path') | list }}"
