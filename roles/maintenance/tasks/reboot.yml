---
- name: Check whether the upgrade asks for a reboot
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: maintenance_reboot_required

- name: Reboot
  when: maintenance_force_reboot | bool or maintenance_reboot_required.stat.exists
  block:
    # Every reboot comes through here, so this is where a node that runs jobs is
    # protected: a compute node Slurm knows must be drained (or down) first. One it
    # does not know yet (a first deploy) has no jobs to lose.
    - name: Read the node's Slurm state
      ansible.builtin.command:
        argv: ["{{ maintenance_slurm_bin }}/scontrol", show, node, -o, "{{ inventory_hostname }}"]
      delegate_to: "{{ maintenance_slurm_controller }}"
      register: maintenance_reboot_node
      changed_when: false
      failed_when: false
      check_mode: false  # read-only; --check needs the result
      when:
        - inventory_hostname in groups[slurm_compute_group] | default([])
        - maintenance_slurm_controller | length > 0
        - not maintenance_reboot_undrained | bool

    - name: Refuse to reboot a node that takes jobs
      ansible.builtin.fail:
        msg: >-
          {{ inventory_hostname }} is not drained in Slurm
          ({{ (maintenance_reboot_node.stdout ~ maintenance_reboot_node.stderr) | regex_search('State=\S+') or 'state unknown' }}).
          playbooks/utilities/apt-upgrade.yml -e hostlist={{ inventory_hostname }} -e maintenance_force_reboot=true
          drains it, reboots it and returns it; -e maintenance_reboot_undrained=true
          reboots it anyway, losing its jobs.
      when:
        - maintenance_reboot_node is not skipped
        - maintenance_reboot_node.stdout is not search('State=\S*(DRAIN|DOWN)')
        - (maintenance_reboot_node.stdout ~ maintenance_reboot_node.stderr) is not search('not found')

    # Triggers first, or the umount re-arms a mount against a dying server.
    - name: Detach the shared filesystems before the reboot
      ansible.builtin.shell:
        cmd: |
          systemctl stop '*.automount' 2>/dev/null || true
          umount -l -f -a -t nfs,nfs4 2>/dev/null || true
          exit 0
      changed_when: false
      when: maintenance_detach_nfs | bool

    # ansible.cfg's single connection attempt and keepalives let the reboot module
    # re-check its deadline between probes and see the node come back.
    - name: Reboot and wait for the host to come back
      ansible.builtin.reboot:
        msg: "Reboot by Ansible: {{ maintenance_reason }}"
        pre_reboot_delay: 5
        post_reboot_delay: 15
        reboot_timeout: "{{ maintenance_reboot_timeout }}"
        connect_timeout: 5
