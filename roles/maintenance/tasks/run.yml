---
# The steps in maintenance_steps, in order, for each node of a batch. A node that
# fails stops its own steps at once (it is never resumed), but the run stops only
# after the other nodes of its batch finish theirs: failing it on the spot would end
# the play for every node mid-step, leaving a node rebooted and never verified.

# The GPUs the node has now, before any step changes it: what verify requires to answer
# again after the reboot. Read from the host, not the fact cache (a day old, and maybe
# taken after a GPU dropped off), and kept in a fact of its own, which a role rerun
# after the reboot cannot refresh.
- name: Read the node's GPUs before any step
  ansible.builtin.setup:
    filter: ansible_local

- name: Note the GPUs verify expects back
  ansible.builtin.set_fact:
    maintenance_gpus_baseline: "{{ ansible_facts.ansible_local.gpus.count | default(0) | int }}"

# The steps that talk to Slurm call the commands this checkout installs. A controller
# still on another install (the source build before slurm-upgrade.yml moved it to the
# packages) has none there: say so once, before any node is touched.
- name: Find the Slurm commands on the controller
  ansible.builtin.stat:
    path: "{{ maintenance_slurm_bin }}/scontrol"
  delegate_to: "{{ maintenance_slurm_delegate }}"
  register: maintenance_scontrol
  run_once: true
  check_mode: false
  when:
    - maintenance_slurm_controller | length > 0
    - ansible_play_hosts | intersect(groups[slurm_compute_group] | default([])) | length > 0
    - maintenance_steps | intersect(['drain', 'reboot', 'verify', 'resume']) | length > 0

- name: Require the Slurm commands this checkout installs
  ansible.builtin.assert:
    that: maintenance_scontrol.stat.exists
    fail_msg: >-
      {{ maintenance_slurm_bin }}/scontrol is missing on {{ maintenance_slurm_controller }}:
      the controller runs a different Slurm install than this checkout deploys. Run
      playbooks/slurm-cluster/slurm-upgrade.yml first (docs/slurm-cluster/slurm-upgrade.md).
    quiet: true
  run_once: true
  when: maintenance_scontrol is not skipped

- name: Run the maintenance steps
  block:
    - name: Run the step
      ansible.builtin.include_tasks: "{{ step }}.yml"
      loop: "{{ maintenance_steps }}"
      loop_control:
        loop_var: step
  rescue:
    # A failed command's msg is generic and a wait that ran out sets none: the reason is
    # in its stderr, or stdout (the last lines are kept).
    - name: Note why the node failed
      vars:
        _result: "{{ ansible_failed_result | default({}) }}"
        _said: >-
          {{ [_result.msg | default(''), _result.stderr | default('', true) or _result.stdout | default('')]
             | map('string') | map('trim') | select | join(': ') or 'failed (rc ' ~ (_result.rc | default('?')) ~ ')' }}
      ansible.builtin.set_fact:
        maintenance_failure: "{{ ansible_failed_task.name }}: {{ (_said | string).splitlines()[-20:] | join(' / ') }}"

- name: Fail the node, now that its batch is done
  ansible.builtin.fail:
    msg: "{{ inventory_hostname }} stays drained. {{ maintenance_failure }}"
  when: maintenance_failure is defined
