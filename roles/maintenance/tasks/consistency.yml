---
# Hosts that should be identical: the same running kernel, the same version of every
# package two or more of them have, the same maintenance_consistency_sysctls, and each
# running what it has installed (no pending reboot, the NVIDIA module loaded at its
# installed version), and no two sharing /etc/machine-id. Run on
# all the hosts at once (no serial); the comparison runs once, over every host in the
# play, and fails listing each difference and where it is.
- name: Read the running kernel  # facts may predate the maintenance reboot
  ansible.builtin.command:
    argv: [uname, -r]
  register: maintenance_kernel
  changed_when: false
  check_mode: false

- name: Read the installed packages
  ansible.builtin.package_facts:

# One line per key, in order; a key this kernel lacks reads as "unset".
- name: Read the sysctls that must agree
  ansible.builtin.command:
    argv: "{{ ['sh', '-c', 'for k; do sysctl -n \"$k\" 2>/dev/null || echo unset; done', 'sh'] + maintenance_consistency_sysctls }}"
  register: maintenance_sysctl
  changed_when: false
  check_mode: false

# Five lines: the loaded NVIDIA module, the version and the license of the one the running
# kernel would load next ("" where none; plugins/filter/nvidia.py makes each
# "<version> <open|proprietary>"), the pending reboot (the packages that asked for it, "yes" when they
# are not listed, "" when none; reboot_request.yml and dnf's upgrade write the marker),
# the machine ID.
- name: Read whether this host runs what it has installed
  ansible.builtin.shell:
    cmd: |
      head -n 1 /proc/driver/nvidia/version 2>/dev/null || echo
      modinfo -F version nvidia 2>/dev/null || echo
      modinfo -F license nvidia 2>/dev/null || echo
      if [ -e /var/run/reboot-required ]; then
        p=$(sort -u /var/run/reboot-required.pkgs 2>/dev/null | paste -sd, -)
        echo "${p:-yes}"
      else
        echo
      fi
      cat /etc/machine-id 2>/dev/null || echo
  register: maintenance_running
  changed_when: false
  check_mode: false

- name: Record this host's state
  ansible.builtin.set_fact:
    maintenance_fleet_state:
      kernel: "{{ maintenance_kernel.stdout }}"
      packages: "{{ dict(ansible_facts.packages | dict2items | map(attribute='key')
                    | zip(ansible_facts.packages | dict2items | map(attribute='value')
                          | map('map', attribute='version') | map('join', ','))) }}"
      sysctl: "{{ dict(maintenance_consistency_sysctls | zip(maintenance_sysctl.stdout_lines | default([]))) }}"
      nvidia_loaded: "{{ maintenance_running.stdout_lines[0] | default('') | nvidia_module_loaded }}"
      nvidia_on_disk: >-
        {{ maintenance_running.stdout_lines[1] | default('')
           | nvidia_module_on_disk(maintenance_running.stdout_lines[2] | default('')) }}
      # the machine running Ansible: reboot.yml has just told its operator to finish it
      machine_id: "{{ maintenance_running.stdout_lines[4] | default('') | trim }}"
      reboot_pending: "{{ '' if maintenance_reboot_self | default(false) | bool else maintenance_running.stdout_lines[3] | default('') | trim }}"

- name: Compare the hosts
  run_once: true
  vars:
    _hosts: "{{ ansible_play_hosts | select('in', hostvars) | list }}"
    _drift: "{{ dict(_hosts | zip(_hosts | map('extract', hostvars, 'maintenance_fleet_state'))) | fleet_drift }}"
    _nl: "\n"  # YAML makes this a newline; inside a template '\n' stays two characters
  ansible.builtin.assert:
    that: _drift | length == 0
    quiet: true
    fail_msg: |-
      {{ _drift | length }} differences between {{ _hosts | join(', ') }}:
      {{ _drift[:60] | join(_nl) }}{{ _nl ~ '...' if _drift | length > 60 else '' }}
      Bring them level with playbooks/utilities/apt-upgrade.yml (and the role that owns
      a differing sysctl); a pending reboot or a stale NVIDIA module goes with
      playbooks/utilities/reboot.yml.
