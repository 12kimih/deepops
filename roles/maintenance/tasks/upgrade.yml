---
- name: Make sure the package manager can work
  ansible.builtin.include_tasks: apt_health.yml

- name: Upgrade every package, the held-back stacks included (Ubuntu)
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
    lock_timeout: 600
  environment: "{{ proxy_env if proxy_env is defined else {} }}"
  when: ansible_facts.os_family == 'Debian'

- name: Upgrade every package (RHEL family)
  ansible.builtin.dnf:
    name: "*"
    state: latest
    update_only: true
    nobest: "{{ maintenance_dnf_nobest | bool }}"
  when: ansible_facts.os_family == 'RedHat'
