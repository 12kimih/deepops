---
- name: Make sure the package manager can work
  ansible.builtin.include_tasks: apt_health.yml

# Before the upgrade, so it brings every node to the same versions (os_updates owns
# the apt policy; a node it has not reached yet still upgrades level).
- name: Take phased updates on every node at once
  ansible.builtin.include_role:
    name: os_updates
    tasks_from: phased
  when: ansible_facts.os_family == 'Debian'

# On a shared host no package upgrade starts or restarts a service (roles/quiet_install's
# hold, which refuses a site's own policy-rc.d here); it is released by its text, also
# after an interrupted upgrade.
- name: Upgrade every package, the held-back stacks included (Ubuntu)
  when: ansible_facts.os_family == 'Debian'
  vars:
    _hold: "{{ maintenance_shared_host | bool }}"
  block:
    - name: Hold every service where it is for the upgrade
      ansible.builtin.include_role:
        name: quiet_install
        tasks_from: hold
      vars:
        quiet_install_foreign_policy: refuse
      when: _hold

    - name: Upgrade every package
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
        lock_timeout: 600
      environment: "{{ proxy_env }}"
      register: maintenance_apt_upgrade

    - name: Say the services were left running the old code
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} serves the cluster, so the upgrade restarted no service.
          `needrestart -r l` lists those running old code; they take it at the next reboot
          (playbooks/utilities/reboot.yml, or `sudo systemctl reboot` on the host).
      when: _hold and maintenance_apt_upgrade is changed
  always:
    - name: Let services start again
      ansible.builtin.include_role:
        name: quiet_install
        tasks_from: release

- name: Upgrade every package (RHEL family)
  ansible.builtin.dnf:
    name: "*"
    state: latest
    update_only: true
    nobest: "{{ maintenance_dnf_nobest | bool }}"
  when: ansible_facts.os_family == 'RedHat'

# dnf writes no /var/run/reboot-required, the marker the reboot step and the os_updates
# metrics read (Debian's packages write it): a new kernel was installed and never
# booted. `dnf needs-restarting -r` (dnf-plugins-core) exits 1 when the kernel or a
# core library changed.
- name: Find out whether the upgrade needs a reboot (RHEL family)
  when: ansible_facts.os_family == 'RedHat'
  block:
    - name: Install dnf needs-restarting
      ansible.builtin.dnf:
        name: dnf-plugins-core
        state: present

    - name: Ask dnf whether a reboot is needed
      ansible.builtin.command:
        argv: [dnf, needs-restarting, -r]
      register: maintenance_dnf_restart
      changed_when: false
      failed_when: maintenance_dnf_restart.rc not in [0, 1]
      check_mode: false  # read-only

    - name: Ask for the reboot
      ansible.builtin.copy:
        dest: /var/run/reboot-required
        content: "*** System restart required ***\n"
        owner: root
        group: root
        mode: "0644"
      when: maintenance_dnf_restart.rc == 1
