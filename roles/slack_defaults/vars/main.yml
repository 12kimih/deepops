---
# The bot's way in on a host it acts on (roles/cluster_bot_access): its key's one forced
# command runs the dispatcher as root through one sudo rule, and the dispatcher runs
# only the services roles list in the directory, a file each (clustertools.bot_serve).
cluster_bot_serve_command: /usr/local/sbin/cluster-bot-serve
cluster_bot_serve_dir: /etc/cluster-bot-access
# What the bot's key runs, and the one command its sudo rule allows.
cluster_bot_serve: "{{ cluster_bot_serve_command }} {{ cluster_bot_serve_dir }}"
cluster_bot_serve_sudoers: /etc/sudoers.d/deepops-cluster-bot-access
cluster_bot_authorized_keys: "{{ cluster_bot_key | dirname }}/authorized_keys"
# What every role offering a service installs in common, listed in each such role's
# items (roles/component_record): it goes when the last of them does.
cluster_bot_access_items:
  - "file:{{ cluster_bot_serve_command }}"
  - "file:{{ cluster_bot_serve_sudoers }}"
  - "file:{{ cluster_bot_authorized_keys }}"
  - "dir:{{ cluster_bot_serve_dir }}"
