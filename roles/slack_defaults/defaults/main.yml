---
# slack_defaults -- the cluster's Slack workspace, named once for every role that posts
# there (a shared-defaults role: roles list it as a meta dependency).
#
# The one bot token of the cluster's Slack app (vault it in the site config); every
# feature that posts or listens uses it. Empty turns the Slack features off.
slack_bot_token: ""

# Cluster user -> Slack member ID (or an email to look up), for every tool that mentions
# or messages a person: the roster's `slack` attribute.
slack_members: "{{ people | people_attr('slack') }}"
# A person not in slack_members is looked up as <login>@<slack_email_domain> (empty: not
# looked up); a notice sent to an address in it names that login.
slack_email_domain: ""

# The channels by what they are for, and the language the cluster writes there
# (cluster_tools.slack.LANGUAGE; a DM to a person is Korean):
#   status    what everyone may look at: the hourly and weekly GPU usage, storage (Korean)
#   admin     what an administrator has to act on, and the day logs (English)
#   help      where people ask for help and make requests (accounts, unbans, shared data) (Korean)
#   announce  notices and release notes (Korean)
slack_channels:
  status: "#gpu-usage"
  admin: "#alerts"
  help: "#help"
  announce: "#announcements"

# Where every notice a tool or the cluster bot sends a person by DM is also logged, so the administrators
# see what people were told and can help them (cluster_tools.slack.dm): one message a
# day in this channel, each DM whole in a reply in its thread, mentioning no one. A person's own
# job start and end notices are not logged. Empty logs none.
slack_dm_log_channel: "{{ slack_channels.admin }}"
# The administrators' Slack user group. Its @handle is what people tag in the help channel,
# and what the bot's help text and the docs name ("@sysadmin"; empty: "the
# administrators"). Its ID (the group's S... ID, as Slack's API and a mention write it) is
# how a notice an administrator has to act on mentions the group in
# slack_channels.admin, so Slack notifies its members: critical alerts
# (roles/alertmanager), the usage report's notices to administrators
# (roles/slurm_usage_report), the cluster bot's held requests (roles/cluster_bot);
# reports, the day logs and the lists the bot keeps up to date do not. Empty ID
# with a handle and the bot token: each run looks the ID up by the handle (this role's
# tasks, usergroups.list) and says it, to pin here. No ID found: those notices mention
# no one.
slack_admin_group: ""
slack_admin_group_id: ""
# The mention those notices carry is derived from the ID: slack_admin_mention, in this
# role's vars, so no site or role sets another (one group, never @channel or @here).

# The Socket Mode app-level token (xapp-, vault it): the cluster bot's connection to
# Slack, opened from inside (no port to open). Empty keeps the bot off.
slack_app_token: ""

# The cluster bot (roles/cluster_bot): its local account on every host it runs on or
# acts on (roles/system_accounts), the host it runs on, and its SSH key there, whose
# public half the hosts it acts on authorize for one forced command
# (roles/cluster_bot_access).
cluster_bot_user: cluster-bot
cluster_bot_host: >-
  {{ (deepops_component_registry | component_hosts(groups, 'cluster_bot', deepops_component_removals))[:1] | join }}
cluster_bot_key: "{{ system_accounts[cluster_bot_user].home }}/.ssh/id_ed25519"
# Each person's choices about notices (cluster_bot.prefs: who muted job notices), written
# by the bot and read by the notifiers on the same host (roles/job_notice), so its
# directory is readable by all.
cluster_bot_prefs_file: /var/lib/cluster-bot-prefs/prefs.json
