---
galaxy_info:
  namespace: deepops
  role_name: slack_defaults
  author: DeepOps
  description: The cluster's Slack bot token, channels and administrators' group, named once
  license: BSD-3-Clause
  min_ansible_version: "2.17"
  platforms:
    - name: Ubuntu
      versions: [jammy, noble]
    - name: EL
      versions: ["8", "9"]
dependencies:
  - role: deploy_defaults  # deepops_component_registry (cluster_bot_host)
  - role: people_defaults  # people (slack_members)
  - role: system_accounts  # the bot's account, whose home holds its key (cluster_bot_key)
