---
- name: Remove what this component installed
  ansible.builtin.include_role:
    name: component_record
  vars:
    component_record_name: nis_client
    component_record_action: absent
    component_record_items: "{{ nis_client_items }}"
    # yp-tools comes with the NIS server too; only its record frees it.
    component_record_exclusive_packages: "{{ nis_client_packages | difference(['yp-tools']) }}"

# Lookups stop asking NIS only where deepops ran the client (its record, or what it just
# removed): a host whose NIS the site runs itself keeps its nsswitch.conf.
- name: Stop reading accounts from NIS
  ansible.builtin.include_role:
    name: nsswitch
  vars:
    nsswitch_source: nis
    nsswitch_state: absent
  when: >-
    component_record_result.before | length > 0
    or component_record_removed.values() | map('length') | sum > 0
