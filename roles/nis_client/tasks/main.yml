---
- name: Check the component state
  ansible.builtin.assert:
    that: nis_client_state in ['present', 'absent', 'kept']
    fail_msg: "nis_client_state must be present, absent or kept, not {{ nis_client_state }}."
    quiet: true

- name: "Make nis_client {{ nis_client_state }}"
  ansible.builtin.include_tasks: "{{ nis_client_state }}.yml"
  when: nis_client_state != 'kept'
