---
# nis_client -- bind this host to an NIS (YP) domain: nis_domain and nis_server
# (roles/deploy_defaults), on hosts whose directory_service is nis.

# present, absent, or kept (do nothing) (docs/deepops/component-state.md); a deploy
# sets it from deepops_components. Absent only when named in deepops_component_removals:
# the host then reads no accounts from NIS.
nis_client_state: present

# The databases NIS answers (roles/nsswitch adds the nis source to each and takes sss
# away). `files` first: a local entry shadows the directory's, which keeps system
# accounts local but also lets a stray local group override a cluster-wide one.
nis_client_databases: [passwd, group, shadow, netgroup, automount]
