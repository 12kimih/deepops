---
# Point dockerd's unix socket at a cluster-wide group. See defaults/main.yml for why
# the package-default `docker` group cannot work inside a Slurm job.
- name: Assert the socket group is fully specified
  ansible.builtin.assert:
    that:
      - docker_socket_group is defined
      - (docker_socket_group | trim | length) > 0
      - docker_socket_group_gid is defined
    fail_msg: >-
      docker_socket_group is enabled but docker_socket_group / docker_socket_group_gid
      are not both set. The GID must be pinned explicitly so that it is identical on
      every node -- Slurm ships numeric GIDs into jobs, so a per-node GID silently
      grants the wrong group instead of failing.

- name: Create the Docker socket group locally with the pinned GID
  ansible.builtin.group:
    name: "{{ docker_socket_group }}"
    gid: "{{ docker_socket_group_gid }}"
    state: present
  when: docker_socket_group_create_local | bool

# Which knob owns the socket depends on how dockerd was started: under socket activation
# (`-H fd://`) the unit's SocketGroup= wins, otherwise dockerd chowns the socket from the
# daemon-level `group` key. Set both, so ownership holds either way. Merge rather than
# rewrite -- other roles also write daemon.json.
# https://docs.docker.com/reference/cli/dockerd/#daemon-configuration-file
- name: Set the socket group in the Docker daemon configuration
  ansible.builtin.command:
    cmd: >-
      python3 -c 'import json, pathlib, sys;
      p = pathlib.Path("/etc/docker/daemon.json");
      want = {{ {"group": docker_socket_group} | to_json }};
      text = p.read_text().strip() if p.exists() else "";
      data = json.loads(text) if text else {};
      changed = any(data.get(k) != v for k, v in want.items());
      data.update(want);
      (p.write_text(json.dumps(data, indent=2) + chr(10)) if changed else None);
      sys.exit(10 if changed else 0)'
  register: docker_socket_group_daemon_json
  changed_when: docker_socket_group_daemon_json.rc == 10
  failed_when: docker_socket_group_daemon_json.rc not in [0, 10]
  notify: Restart docker

- name: Check whether the docker.socket unit exists
  ansible.builtin.command:
    cmd: systemctl cat docker.socket
  register: docker_socket_group_unit
  changed_when: false
  failed_when: false

- name: Ensure the docker.socket drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/docker.socket.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: docker_socket_group_unit.rc == 0

- name: Align the docker.socket unit group with the daemon configuration
  ansible.builtin.copy:
    content: |
      # Ansible managed -- edits will be overwritten (roles/docker_socket_group).
      # Kept in sync with the `group` key in /etc/docker/daemon.json so socket
      # ownership is the same whether or not dockerd is socket-activated.
      [Socket]
      SocketGroup={{ docker_socket_group }}
    dest: /etc/systemd/system/docker.socket.d/10-socket-group.conf
    owner: root
    group: root
    mode: "0644"
  when: docker_socket_group_unit.rc == 0
  notify:
    - Reload systemd
    - Restart the docker socket unit
    - Restart docker

# Configuration alone cannot converge a node whose files are already right but whose live
# socket is not -- handlers that never ran, or a socket changed by hand. Compare the live
# socket too, so re-running the role is a real repair.
- name: Read the group that currently owns the Docker socket
  ansible.builtin.stat:
    path: "{{ docker_socket_group_socket_path }}"
  register: docker_socket_group_socket_stat

# gr_name is absent when the owning GID has no name, which is also a mismatch.
- name: Restart the daemon when the live socket is owned by the wrong group
  ansible.builtin.debug:
    msg: >-
      {{ docker_socket_group_socket_path }} is owned by group
      '{{ docker_socket_group_socket_stat.stat.gr_name | default("") }}',
      expected '{{ docker_socket_group }}'.
  changed_when: true
  when:
    - docker_socket_group_socket_stat.stat.exists
    - (docker_socket_group_socket_stat.stat.gr_name | default("")) != docker_socket_group
  notify:
    - Reload systemd
    - Restart the docker socket unit
    - Restart docker
