---
provisioner:
  inventory:
    group_vars:
      all:
        docker_socket_group: "dockerusers"
        docker_socket_group_gid: 4000
        # dockerd is not installed in the test container, so never fire the restart
        # handlers; the scenario only checks that the group and the daemon
        # configuration are written correctly. The live-socket check finds no socket
        # for the same reason, so it does nothing.
        docker_daemon_restart: false
