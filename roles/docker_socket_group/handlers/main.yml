---
- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

# Restarting dockerd is what actually re-creates /run/docker.sock with the new group
# ownership. It also stops running containers -- gated so the change can be staged
# and applied during a maintenance window instead.
- name: Restart docker
  ansible.builtin.systemd:
    name: docker
    state: restarted
  when: docker_socket_group_restart | bool
