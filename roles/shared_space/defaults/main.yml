---
# present, absent or kept (docs/deepops/component-state.md): the shared space on the
# home server, where /home is local. A deploy sets it from deepops_components
# (slurm_enable_shared_space, on slurm-nfs). docs/slurm-cluster/shared-space.md.
#
#   <root>/<data>              datasets, models, container images: written by one account
#                              (shared_space_writer), read by everyone, its own budget
#   <root>/projects/<name>     collaboration folders (shared_projects, the roster's
#                              projects): owners and members read and write (group
#                              <name>), viewers read (group <name>-read); files keep the
#                              group and count to their writer's quota
#
# A folder is never removed: one taken off shared_projects keeps its files (the group goes)
# and is listed on each run, for an administrator to move to an owner's home. The
# account's name is no person's login: list it in the roster's reserved_logins.
shared_space_state: present

# The layout (shared_space_writer, shared_space_root, shared_space_data) and the
# projects (shared_projects) are roles/shared_space_defaults'.
