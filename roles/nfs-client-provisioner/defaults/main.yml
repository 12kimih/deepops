---
# The NFS subdir external provisioner from its official Helm chart (roles/helm_release):
# https://github.com/kubernetes-sigs/nfs-subdir-external-provisioner
k8s_nfs_server: "127.0.0.1"
# Whether its StorageClass is the cluster's default.
k8s_nfs_default_sc: true
k8s_nfs_client_helm_repo: "https://kubernetes-sigs.github.io/nfs-subdir-external-provisioner"
k8s_nfs_client_chart: "nfs-subdir-external-provisioner"
k8s_nfs_client_release_name: "nfs-subdir-external-provisioner"
k8s_nfs_client_namespace: "deepops-nfs-client-provisioner"
# upstream: helm https://kubernetes-sigs.github.io/nfs-subdir-external-provisioner nfs-subdir-external-provisioner
k8s_nfs_client_chart_version: "4.0.18"
