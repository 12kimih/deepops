---
- name: Check the component state
  ansible.builtin.assert:
    that: k8s_nfs_client_state in ['present', 'absent', 'kept']
    fail_msg: "k8s_nfs_client_state must be present, absent or kept, not {{ k8s_nfs_client_state }}."
    quiet: true

- name: "Make the NFS client provisioner {{ k8s_nfs_client_state }}"
  ansible.builtin.include_tasks: "{{ k8s_nfs_client_state }}.yml"
  when: k8s_nfs_client_state != 'kept'
