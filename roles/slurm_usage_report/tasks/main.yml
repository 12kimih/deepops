---
- name: Check the component state
  ansible.builtin.assert:
    that: slurm_usage_report_state in ['present', 'absent', 'kept']
    fail_msg: "slurm_usage_report_state must be present, absent or kept, not {{ slurm_usage_report_state }}."
    quiet: true

# Without a bot token the report has nothing to post with: nothing of it stays installed.
- name: "Make slurm_usage_report {{ slurm_usage_report_state if slurm_usage_report_token | length > 0 else 'absent (no token)' }}"
  ansible.builtin.include_tasks: "{{ slurm_usage_report_state if slurm_usage_report_token | length > 0 else 'absent' }}.yml"
  when: slurm_usage_report_state != 'kept'
