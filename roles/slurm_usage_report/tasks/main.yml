---
- name: Install the usage report
  when: slurm_usage_report_token | length > 0
  block:
    - name: Create config dir
      ansible.builtin.file:
        path: "{{ slurm_usage_report_config_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    # The report is a module on the shared clustertools path, run through the same
    # command wrapper as every other cluster tool.
    - name: Install the report module
      ansible.builtin.copy:
        src: slurm_usage_report.py
        dest: "{{ cluster_tools_lib_dir }}/slurm_usage_report.py"
        owner: root
        group: root
        mode: "0644"

    - name: Install the report command
      ansible.builtin.include_role:
        name: cluster_tools_lib
        tasks_from: command
      vars:
        cluster_tools_lib_command:
          dest: "{{ slurm_usage_report_script }}"
          module: slurm_usage_report

    # Holds the bot token.
    - name: Install the report config
      ansible.builtin.template:
        src: config.json.j2
        dest: "{{ slurm_usage_report_config_dir }}/config.json"
        owner: root
        group: root
        mode: "0600"
      # The user map comes from the people roster.
      tags:
        - people

    - name: Install systemd units
      ansible.builtin.template:
        src: "slurm-usage-report.{{ item }}.j2"
        dest: "/etc/systemd/system/{{ slurm_usage_report_svc_name }}.{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop: [service, timer]
      notify: Restart usage report timer

    - name: Enable the report timer
      ansible.builtin.systemd:
        name: "{{ slurm_usage_report_svc_name }}.timer"
        state: started
        enabled: true
        daemon_reload: true

- name: Disable the report timer without a token
  ansible.builtin.systemd:
    name: "{{ slurm_usage_report_svc_name }}.timer"
    state: stopped
    enabled: false
  when: slurm_usage_report_token | length == 0
  failed_when: false
