---
- name: Record what this component installs
  ansible.builtin.include_role:
    name: component_record
  vars:
    component_record_name: slurm_usage_report
    component_record_action: begin
    component_record_items: "{{ slurm_usage_report_items }}"

# Its configuration holds the bot token: root's alone (0600) in the cluster tools'
# configuration directory, as every cluster tool's is.
- name: Create the cluster tools configuration directory
  ansible.builtin.file:
    path: "{{ _slurm_usage_report_config | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# The report is cluster_tools.usage_report, installed with the rest of the cluster's
# Python by cluster_tools_lib, so it always matches the library it imports. This role
# only wires it up.
- name: Remove the report module of earlier layouts
  ansible.builtin.file:
    path: "{{ cluster_tools_lib_dir }}/slurm_usage_report.py"
    state: absent

- name: Install the report command
  ansible.builtin.include_role:
    name: cluster_tools_lib
    tasks_from: command
  vars:
    cluster_tools_lib_command:
      dest: "{{ _slurm_usage_report_command }}"
      module: cluster_tools.usage_report

# Holds the bot token.
- name: Install the report config
  diff: false  # the file holds a secret; --diff would print it
  ansible.builtin.template:
    src: config.json.j2
    dest: "{{ _slurm_usage_report_config }}"
    owner: root
    group: root
    mode: "0600"
    # The report checks its own config, so a mistake fails the deploy, not the run.
    validate: "{{ cluster_tools_lib_config_validate }} cluster_tools.usage_report %s"
  # The user map comes from the people roster.
  tags:
    - people

- name: Record the usage report configuration
  ansible.builtin.include_role:
    name: cluster_tools_lib
    tasks_from: config
    apply:
      tags: [people]
  vars:
    cluster_tools_lib_config:
      role: slurm_usage_report
      module: cluster_tools.usage_report
      file: "{{ _slurm_usage_report_config }}"
      playbook: playbooks/slurm-cluster/slurm-usage-report.yml
  tags:
    - people

- name: Install the report, weekly summary and disk report services
  ansible.builtin.template:
    src: slurm-usage-report.service.j2
    dest: "/etc/systemd/system/{{ item.unit }}.service"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ slurm_usage_report_runs }}"
  loop_control:
    label: "{{ item.unit }}"
  notify: Restart usage report timers

- name: Install their timers
  ansible.builtin.template:
    src: slurm-usage-report.timer.j2
    dest: "/etc/systemd/system/{{ item.unit }}.timer"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ slurm_usage_report_runs }}"
  loop_control:
    label: "{{ item.unit }}"
  notify: Restart usage report timers

- name: Enable the timers
  systemd_unit:
    name: "{{ item.unit }}.timer"
    state: started
    enabled: true
    daemon_reload: true
  loop: "{{ slurm_usage_report_runs }}"
  loop_control:
    label: "{{ item.unit }}"

- name: Record the component as present
  ansible.builtin.include_role:
    name: component_record
  vars:
    component_record_name: slurm_usage_report
    component_record_action: present
    component_record_items: "{{ slurm_usage_report_items }}"
