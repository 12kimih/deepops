---
# The report's state file (when each job turned idle, whom it notified) is data and stays.
- name: Remove what this component installed
  ansible.builtin.include_role:
    name: component_record
  vars:
    component_record_name: slurm_usage_report
    component_record_action: absent
    component_record_items: "{{ slurm_usage_report_items }}"
