---
# Its names, one for each kind (docs/deepops/naming.md): the command, its configuration,
# and the units' and the state directory's name.
_slurm_usage_report_name: slurm-usage-report
_slurm_usage_report_command: "/usr/local/libexec/{{ _slurm_usage_report_name }}"
_slurm_usage_report_config: "{{ cluster_tools_lib_config_dir }}/{{ _slurm_usage_report_name }}.json"
# The runs: the hourly report, the weekly summary and the daily disk usage report, each
# its own service and timer (one template pair), sharing the configuration; the weekly
# and disk runs keep their own state files beside the hourly one's. args is a list, so
# a run without any adds nothing to its command line.
slurm_usage_report_runs:
  - {unit: "{{ _slurm_usage_report_name }}", args: [], schedule: "{{ slurm_usage_report_schedule }}",
     what: GPU usage report}
  - {unit: "{{ _slurm_usage_report_name }}-weekly", args: [--weekly],
     schedule: "{{ slurm_usage_report_weekly_schedule }}", what: weekly GPU usage summary}
  - {unit: "{{ _slurm_usage_report_name }}-disk", args: [--disk],
     schedule: "{{ slurm_usage_report_disk_schedule }}", what: daily disk usage report}
# What this component installs, for its record (roles/component_record). Its state files
# (when each job turned idle, whom it notified, each person's weeks) are data and stay.
_slurm_usage_report_units: "{{ slurm_usage_report_runs | map(attribute='unit') | product(['.timer', '.service']) | map('join') | list }}"
slurm_usage_report_items: >-
  {{ _slurm_usage_report_units | map('regex_replace', '^', 'unit:') | list
     + _slurm_usage_report_units | map('regex_replace', '^', 'file:/etc/systemd/system/') | list
     + ['file:' ~ _slurm_usage_report_command, 'file:' ~ _slurm_usage_report_config,
        'file:' ~ cluster_tools_lib_config_records ~ '/slurm_usage_report.json'] }}
