---
# Hourly Slurm GPU usage report to Slack, and nudges for jobs whose GPUs sit idle, a
# weekly per-person summary of GPU-hours held and left idle, and a daily disk usage
# report. Runs on a host with the Slurm client commands and access to Prometheus. No-op
# until the Slack bot token (slack_bot_token in roles/slack_defaults) is set; the app's
# scopes are the generated manifest's (cluster_bot.commands API_SCOPES).

# present or absent (docs/deepops/component-state.md); a deploy sets it from
# deepops_components.
slurm_usage_report_state: present
slurm_usage_report_token: "{{ slack_bot_token }}"
slurm_usage_report_channel: "{{ slack_channels.status }}"
slurm_usage_report_schedule: hourly
# The weekly summary (systemd OnCalendar): Monday morning, before the week's work.
slurm_usage_report_weekly_schedule: "Mon *-*-* 09:00:00"
# Someone over both thresholds (idle GPU-hours, and that share of the GPU-hours their
# jobs held) in each of repeat_weeks weeks in a row is reported to admin_channel with
# the weeks' numbers, their jobs now and what to do. Loose to start; tighten from the
# weekly numbers. "" (admin_channel) turns the notice off.
slurm_usage_report_admin_channel: "{{ slack_channels.admin }}"
slurm_usage_report_repeat_idle_gpu_hours: 50
slurm_usage_report_repeat_idle_share: 0.5
slurm_usage_report_repeat_weeks: 2
# The daily disk usage report (systemd OnCalendar), from the disk quota metrics
# (roles/disk_quota; without them it posts nothing): each counted filesystem's disk, its
# people (every one, in the thread) with their day's growth and levels, the projects,
# and everyone past a warn level, told as disk_notify says (mention, dm, both or []).
slurm_usage_report_disk_schedule: "*-*-* 09:00:00"
slurm_usage_report_disk_notify: [mention]
# A person is told when they first pass a level, every day at a hard limit (their writes
# fail), and again every repeat_days while past the same warn level (0: every day). The
# card lists everyone past a level every day, mentioning only those told.
slurm_usage_report_disk_repeat_days: 7
# A filesystem at least cluster_disk_fill_fraction full: its this many largest people are
# named on the card every day, mentioned at most every disk_repeat_days. The thread also
# lists each filesystem's folders worth cleaning (cluster_cleanup_top of them, from the
# scans of roles/disk_quota and roles/scratch_space).
slurm_usage_report_disk_fill_mentions: 5
# The people the disk report ranks (the roster's active logins); everyone else on a disk
# (root, the services, people who left) is one line. [] ranks every user.
slurm_usage_report_people: "{{ people | people_active | list | sort }}"
slurm_usage_report_prometheus_url: "http://localhost:{{ prometheus_port }}"
# The report links the site facts' dashboard_url (cluster_tools_lib, from
# grafana_root_url), read on the host through cluster_tools.site; empty drops the link.

# The thresholds of the rule on jobs leaving their GPUs idle (idle_hours, idle_util_threshold, cancel_after_hours,
# cancel_warn_hours) and the I/O notices' (io_share, io_minutes, io_top_jobs):
# roles/slurm_usage_report_defaults, which `usage` reads too (cluster_tools.rules).
# How the owners of such jobs are told, once per person for all of them: any of
# mention (in the report thread) and dm; [] lists the jobs without telling anyone. Told
# when a job of theirs first turns idle, then every notify_repeat_hours while any stays
# idle (cluster_tools.notices); 0 (the default) tells them on every hourly report while
# it lasts (owner, 2026-11-23): the cancel below bounds how long that goes on.
slurm_usage_report_notify: [mention]
slurm_usage_report_notify_repeat_hours: 0
# The texts below are written in cluster_tools.rich's Markdown (**bold**, `code`,
# [text](url), - lists): they are sent as Slack rich text, shown as written.
# The DM (with dm in notify): {jobs} (one line each), {count}, {hours} (idle_hours).
slurm_usage_report_dm_text: |-
  잡 {count}개가 할당받은 GPU를 {hours}시간 넘게 쓰지 않고 있습니다:
  {jobs}
  더 쓰지 않으신다면 `scancel <JOBID>`로 GPU를 반납해 주세요. 반납하시면 대기 중인 잡이 그 GPU를 쓸 수 있습니다.
# The DM before a cancel (cancel_warn_hours ahead): {jobs}, {count}, {hours}.
slurm_usage_report_cancel_warn_text: |-
  아래 잡은 할당받은 GPU를 오래 쓰지 않아 {hours}시간 뒤에 취소됩니다:
  {jobs}
  GPU를 다시 쓰기 시작하시거나, 더 쓰지 않으신다면 지금 `scancel <JOBID>`로 반납해 주세요.

# The I/O notices (systemd OnCalendar, every 5 minutes): a node whose NFS traffic to a
# measured export (io_fairness_models, roles/io_defaults) stayed above io_share of what
# the disk serves for io_minutes; the users of its io_top_jobs jobs by I/O are sent a
# DM ending in io_advice and the administrators one line per node (admin_channel), at
# once and every io_repeat_hours while it lasts. No models, no notices.
slurm_usage_report_io_schedule: "*:0/5"
slurm_usage_report_io_repeat_hours: 6
slurm_usage_report_io_advice: >-
  잡이 많이 읽고 쓰는 데이터는 클러스터의 스크래치 공간(있다면)이나 노드의 로컬 디스크에
  두고, 결과만 마지막에 한 번 옮겨 주세요.

# Slurm user -> Slack member ID or email (default: the roster's, slack_members). Users
# not listed are looked up as <user>@<email_domain> when email_domain is set; otherwise
# shown without a mention.
slurm_usage_report_user_map: "{{ slack_members }}"
slurm_usage_report_email_domain: "{{ slack_email_domain }}"
