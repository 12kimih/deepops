---
# tasks file for netapp-trident role

- name: Install Trident from its Helm chart
  ansible.builtin.include_role:
    name: helm_release
  vars:
    helm_release:
      release: "{{ trident_helm_release_name }}"
      namespace: "{{ trident_namespace }}"
      chart: "{{ trident_helm_chart }}"
      repo: "{{ trident_helm_repo_url }}"
      version: "{{ trident_helm_chart_version }}"
      helm_values: {}
  run_once: true

# Resolved here, where this role's defaults are in scope: the download role templates
# its arguments later, in its own scope.
- name: Resolve the Trident working directory
  ansible.builtin.set_fact:
    trident_workdir_parent: "{{ deepops_dir }}"
    trident_installer_checksum: "{{ trident_checksums[trident_version] | default('') }}"
  run_once: true

- name: Create Trident working directory
  ansible.builtin.file:
    path: "{{ deepops_dir }}/trident-installer"
    state: directory
    mode: "0755"
  when: create_backends or create_StorageClasses or enable_volume_snapshots or copy_tridentctl_to_localhost
  run_once: true

- name: Download and extract Trident installer
  ansible.builtin.include_role:
    name: download
  vars:
    download_url: "{{ trident_installer_url }}"
    download_checksum: "{{ trident_installer_checksum }}"
    download_dest: "{{ deepops_cache_dir }}/trident-installer-{{ trident_version }}.tar.gz"
    download_unpack: "{{ trident_workdir_parent }}"
  when: create_backends or copy_tridentctl_to_localhost
  run_once: true

- name: Copy backend config file(s) to control node
  diff: false  # the file holds a secret; --diff would print it
  ansible.builtin.template:
    src: backend.j2
    dest: "{{ deepops_dir }}/trident-installer/backend-{{ item.backendName }}.json"
    mode: "0600"
  with_items: "{{ backends_to_create }}"
  when: create_backends
  run_once: true
  no_log: "{{ trident_hide_backend_details | bool }}"

- name: Create Trident backend(s)
  change_command:
    argv:
      - "{{ deepops_dir }}/trident-installer/tridentctl"
      - -n
      - "{{ trident_namespace }}"
      - create
      - backend
      - -f
      - "{{ deepops_dir }}/trident-installer/backend-{{ item.backendName }}.json"
  with_items: "{{ backends_to_create }}"
  retries: 10
  delay: 30
  register: result
  # Stop retrying once created OR already present (a re-run hits the latter
  # immediately instead of spinning ~5 min then failing the play).
  until: >-
    ansible_check_mode or (result.rc == 0 or 'already exists' in (result.stdout + result.stderr))
  changed_when: >-
    ansible_check_mode or ('already exists' not in (result.stdout + result.stderr))
  failed_when: >-
    not ansible_check_mode and ((result.rc != 0) and ('already exists' not in (result.stdout + result.stderr)))
  when: create_backends
  run_once: true
  no_log: "{{ trident_hide_backend_details | bool }}"

- name: Copy StorageClass config file(s) to control node
  ansible.builtin.copy:
    content: "{{ item | to_nice_yaml }}"
    dest: "{{ deepops_dir }}/trident-installer/sc-{{ item.metadata.name }}.yaml"
    mode: "0644"
  with_items: "{{ storageClasses_to_create }}"
  when: create_StorageClasses
  run_once: true

# kubectl apply says "unchanged" for what is already so: only the rest is a change.
- name: Create StorageClasses
  change_command:
    argv: [kubectl, apply, -f, "{{ deepops_dir }}/trident-installer/sc-{{ item.metadata.name }}.yaml"]
  with_items: "{{ storageClasses_to_create }}"
  when: create_StorageClasses
  run_once: true
  register: trident_storage_classes
  changed_when: ansible_check_mode or (trident_storage_classes.stdout is not search('(?m) unchanged$'))

# One snapshot controller per cluster: Kubespray's, matched to its Kubernetes.
- name: Look for the volume snapshot CRDs
  ansible.builtin.command:
    argv: [kubectl, get, crd, volumesnapshotclasses.snapshot.storage.k8s.io]
  register: trident_snapshot_crd
  changed_when: false
  failed_when: false
  check_mode: false  # read-only; --check needs the result
  when: enable_volume_snapshots
  run_once: true

- name: Require Kubespray's snapshot controller
  ansible.builtin.assert:
    that: trident_snapshot_crd.rc == 0
    fail_msg: >-
      The volume snapshot CRDs are missing. Set csi_snapshot_controller_enabled: true in
      config/group_vars/k8s_cluster.yml and rerun playbooks/k8s-cluster.yml, then this playbook.
    quiet: true
  when: enable_volume_snapshots
  run_once: true

- name: Copy volume snapshot class config file(s) to control node
  ansible.builtin.copy:
    content: "{{ item | to_nice_yaml }}"
    dest: "{{ deepops_dir }}/trident-installer/snapclass-{{ item.metadata.name }}.yaml"
    mode: "0644"
  with_items: "{{ volume_snapshot_classes_to_create }}"
  when: enable_volume_snapshots
  run_once: true

- name: Create volume snapshot classes
  change_command:
    argv: [kubectl, apply, -f, "{{ deepops_dir }}/trident-installer/snapclass-{{ item.metadata.name }}.yaml"]
  with_items: "{{ volume_snapshot_classes_to_create }}"
  when: enable_volume_snapshots
  run_once: true
  register: trident_snapshot_classes
  changed_when: ansible_check_mode or (trident_snapshot_classes.stdout is not search('(?m) unchanged$'))

- name: Fetch tridentctl from control node
  ansible.builtin.fetch:
    src: "{{ deepops_dir }}/trident-installer/tridentctl"
    dest: "{{ tridentctl_copy_to_directory }}"
    flat: true
  when: copy_tridentctl_to_localhost
  run_once: true
  register: trident_tridentctl_fetch

# A preview fetched nothing: a file it would make has no mode to set yet.
- name: Make tridentctl on localhost executable
  delegate_to: localhost
  become: false
  ansible.builtin.file:
    path: "{{ tridentctl_copy_to_directory }}/tridentctl"
    mode: "0755"
  when:
    - copy_tridentctl_to_localhost
    - not (ansible_check_mode and trident_tridentctl_fetch is changed)
