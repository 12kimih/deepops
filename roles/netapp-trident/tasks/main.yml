---
# tasks file for netapp-trident role

- name: Add Trident Helm repo
  ansible.builtin.command: "/usr/local/bin/helm repo add --force-update {{ trident_helm_repo_name }} {{ trident_helm_repo_url }}"
  run_once: true
  changed_when: false

- name: Update Helm repos
  ansible.builtin.command: /usr/local/bin/helm repo update
  run_once: true
  changed_when: false

- name: Install Trident using Helm
  ansible.builtin.command: "/usr/local/bin/helm upgrade --install {{ trident_helm_release_name }} {{ trident_helm_chart_name }} --namespace {{ trident_namespace }} --create-namespace --version {{ trident_helm_chart_version }} --wait"
  run_once: true
  changed_when: false

- name: Create Trident working directory
  ansible.builtin.file:
    path: "{{ deepops_dir }}/trident-installer"
    state: directory
    mode: "0755"
  when: create_backends or create_StorageClasses or enable_volume_snapshots or copy_tridentctl_to_localhost
  run_once: true

- name: Download and extract Trident installer
  ansible.builtin.unarchive:
    src: "{{ trident_installer_url }}"
    dest: "{{ deepops_dir }}"
    remote_src: true
  when: create_backends or copy_tridentctl_to_localhost
  run_once: true

- name: Copy backend config file(s) to control node
  diff: false  # the file holds a secret; --diff would print it
  ansible.builtin.template:
    src: backend.j2
    dest: "{{ deepops_dir }}/trident-installer/backend-{{ item.backendName }}.json"
    mode: "0600"
  with_items: "{{ backends_to_create }}"
  when: create_backends
  run_once: true
  no_log: "{{ trident_hide_backend_details | bool }}"

- name: Create Trident backend(s)
  ansible.builtin.command: "{{ deepops_dir }}/trident-installer/tridentctl -n {{ trident_namespace }} create backend -f {{ deepops_dir }}/trident-installer/backend-{{
    item.backendName }}.json"
  with_items: "{{ backends_to_create }}"
  retries: 10
  delay: 30
  register: result
  # Stop retrying once created OR already present (a re-run hits the latter
  # immediately instead of spinning ~5 min then failing the play).
  until: result.rc == 0 or 'already exists' in (result.stdout + result.stderr)
  changed_when: "'already exists' not in (result.stdout + result.stderr)"
  failed_when:
    - result.rc != 0
    - "'already exists' not in (result.stdout + result.stderr)"
  when: create_backends
  run_once: true
  no_log: "{{ trident_hide_backend_details | bool }}"

- name: Copy StorageClass config file(s) to control node
  ansible.builtin.copy:
    content: "{{ item | to_nice_yaml }}"
    dest: "{{ deepops_dir }}/trident-installer/sc-{{ item.metadata.name }}.yaml"
    mode: "0644"
  with_items: "{{ storageClasses_to_create }}"
  when: create_StorageClasses
  run_once: true

- name: Create StorageClasses
  ansible.builtin.command: "kubectl apply -f {{ deepops_dir }}/trident-installer/sc-{{ item.metadata.name }}.yaml"
  with_items: "{{ storageClasses_to_create }}"
  when: create_StorageClasses
  run_once: true
  changed_when: false

- name: Create volume snapshot CRDs
  ansible.builtin.command: "kubectl apply -f {{ item }}"
  with_items: "{{ volume_snapshot_CRD_manifest_URLs }}"
  when: enable_volume_snapshots
  run_once: true
  changed_when: false

- name: Create snapshot controller
  ansible.builtin.command: "kubectl apply -f {{ item }}"
  with_items: "{{ snapshot_controller_manifest_URLs }}"
  when: enable_volume_snapshots
  run_once: true
  changed_when: false

- name: Copy volume snapshot class config file(s) to control node
  ansible.builtin.copy:
    content: "{{ item | to_nice_yaml }}"
    dest: "{{ deepops_dir }}/trident-installer/snapclass-{{ item.metadata.name }}.yaml"
    mode: "0644"
  with_items: "{{ volume_snapshot_classes_to_create }}"
  when: enable_volume_snapshots
  run_once: true

- name: Create volume snapshot classes
  ansible.builtin.command: "kubectl apply -f {{ deepops_dir }}/trident-installer/snapclass-{{ item.metadata.name }}.yaml"
  with_items: "{{ volume_snapshot_classes_to_create }}"
  when: enable_volume_snapshots
  run_once: true
  changed_when: false

- name: Fetch tridentctl from control node
  ansible.builtin.fetch:
    src: "{{ deepops_dir }}/trident-installer/tridentctl"
    dest: "{{ tridentctl_copy_to_directory }}"
    flat: true
  when: copy_tridentctl_to_localhost
  run_once: true

- name: Make tridentctl on localhost executable
  delegate_to: localhost
  become: false
  ansible.builtin.file:
    path: "{{ tridentctl_copy_to_directory }}/tridentctl"
    mode: "0755"
  when: copy_tridentctl_to_localhost
