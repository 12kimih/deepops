---
- name: Check the component state
  ansible.builtin.assert:
    that: slurm_exporter_state in ['present', 'absent', 'kept']
    fail_msg: "slurm_exporter_state must be present, absent or kept, not {{ slurm_exporter_state }}."
    quiet: true

- name: "Make slurm_exporter {{ slurm_exporter_state }}"
  ansible.builtin.include_tasks: "{{ slurm_exporter_state }}.yml"
  when: slurm_exporter_state != 'kept'
