---
# Built locally from the bundled Dockerfile by default; set
# slurm_exporter_build_image: false and point slurm_exporter_container at a
# site image (repo:tag@sha256:digest) to pull a registry image instead.
slurm_exporter_container: "deepops/prometheus-slurm-exporter:2.0.0"
slurm_exporter_build_image: true
slurm_exporter_build_dir: /opt/deepops/build/slurm-exporter
# Port the slurm exporter listens on. The container keeps its image default (host network);
# this only sets the scrape target.
slurm_exporter_port: 8080
slurm_exporter_svc_name: "docker.slurm-exporter.service"
slurm_exporter_state: started
slurm_exporter_enabled: true

slurm_install_prefix: /usr/local
slurm_config_dir: /etc/slurm

prometheus_config_dir: /etc/prometheus
prometheus_cfg_endpoint_dir: "{{ prometheus_config_dir }}/endpoints"
slurm_exporter_conf_template: "slurm-exporter.yml.j2"

grafana_svc_name: "docker.grafana.service"
grafana_data_dir: /var/lib/grafana
grafana_cfg_dashboard_path: "{{ grafana_data_dir }}/dashboards"
grafana_user_id: 472

slurm_exporter_host_group: slurm-metric
