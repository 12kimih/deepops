---
# Retired (roles/deploy_defaults/vars/main.yml): slurmctld serves the Slurm metrics; a
# deploy only removes this exporter. Deleted with its role once every site has converged.
slurm_exporter_port: 8080
# present or absent (docs/deepops/component-state.md); a deploy sets it from
# deepops_components.
slurm_exporter_state: present

# Built locally from the bundled Dockerfile by default; set
# slurm_exporter_build_image: false and point slurm_exporter_container at a
# site image (repo:tag@sha256:digest) to pull a registry image instead.
slurm_exporter_container: "deepops/prometheus-slurm-exporter:2.0.0"
slurm_exporter_build_image: true
slurm_exporter_build_dir: /opt/deepops/build/slurm-exporter
slurm_exporter_svc_name: "docker.slurm-exporter.service"
slurm_exporter_service_state: started
slurm_exporter_service_enabled: true
