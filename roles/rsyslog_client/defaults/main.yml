---
# present, absent, or kept (do nothing) (docs/deepops/component-state.md); a deploy
# sets it from deepops_components.
rsyslog_client_state: present
# The destination host for TCP forwarding of rsyslog messages; empty forwards nothing.
# config.example sets it for Slurm and Kubernetes in group_vars/slurm-cluster.yml
# and group_vars/k8s_cluster.yml.
rsyslog_client_tcp_host: ""

rsyslog_client_tcp_port: "514"
# Log files forwarded with the syslog stream, tag -> path: Slurm's (roles/slurm_paths).
# They are read only to be forwarded (a ruleset of their own), never written a second
# time to the local syslog; a file a host does not have is waited for, not an error.
rsyslog_client_forward_files: "{{ slurm_log_files }}"
