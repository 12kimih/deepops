{{ ansible_managed | comment }}
{% if rsyslog_client_tcp_host %}
# Everything the host logs, and the files below, go to the log server.
ruleset(name="deepops_forward") {
    action(type="omfwd" Target="{{ rsyslog_client_tcp_host }}" Port="{{ rsyslog_client_tcp_port }}" Protocol="tcp")
}
call deepops_forward
{% if rsyslog_client_forward_files %}

# The files are read only to be forwarded: their own ruleset keeps them out of the
# local syslog, where each line would be stored a second time.
module(load="imfile")
ruleset(name="deepops_forward_files") {
    call deepops_forward
    stop
}
{% for tag, file in rsyslog_client_forward_files.items() %}
input(type="imfile" File="{{ file }}" Tag="{{ tag }}" Ruleset="deepops_forward_files")
{% endfor %}
{% endif %}
{% endif %}
