---
- name: Remove what this component installed
  ansible.builtin.include_role:
    name: component_record
  vars:
    component_record_name: rsyslog_client
    component_record_action: absent
    component_record_items: "{{ rsyslog_client_items }}"

- name: Look for rsyslog
  ansible.builtin.systemd_service:
    name: rsyslog
  register: rsyslog_client_rsyslog
  check_mode: true  # read-only: no state requested
  failed_when: false

# rsyslog keeps running for the OS; it restarts so the removed file stops applying.
- name: Restart rsyslog without this component's settings
  ansible.builtin.service:
    name: rsyslog
    state: restarted
  when:
    - component_record_result.orphans.file | length > 0
    - rsyslog_client_rsyslog.status.LoadState | default('not-found') == 'loaded'
