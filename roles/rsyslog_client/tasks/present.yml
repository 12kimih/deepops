---
- name: Record what this component installs
  ansible.builtin.include_role:
    name: component_record
  vars:
    component_record_name: rsyslog_client
    component_record_action: begin
    component_record_items: "{{ rsyslog_client_items }}"

- name: Ensure rsyslog is installed
  ansible.builtin.package:
    name: rsyslog
    state: present

- name: Configure syslog forwarding
  ansible.builtin.template:
    src: "99-forward-syslog.conf"
    dest: "/etc/rsyslog.d/99-forward-syslog.conf"
    owner: "root"
    group: "root"
    mode: "0644"
    validate: "{{ rsyslog_validate }}"
  notify:
    - Restart rsyslog

# A forward file rsyslogd cannot use stops local logging too after the restart.
- name: Apply a changed configuration now
  ansible.builtin.meta: flush_handlers

- name: Check rsyslog runs
  ansible.builtin.command:
    argv: [systemctl, is-active, rsyslog]
  changed_when: false
  check_mode: false  # read-only

- name: Record the component as present
  ansible.builtin.include_role:
    name: component_record
  vars:
    component_record_name: rsyslog_client
    component_record_action: present
    component_record_items: "{{ rsyslog_client_items }}"
