---
- name: Record what this component installs
  ansible.builtin.include_role:
    name: component_record
  vars:
    component_record_name: rsyslog_client
    component_record_action: begin
    component_record_items: "{{ rsyslog_client_items }}"

- name: Ensure rsyslog is installed
  ansible.builtin.package:
    name: rsyslog
    state: present

- name: Configure syslog forwarding
  ansible.builtin.template:
    src: "99-forward-syslog.conf"
    dest: "/etc/rsyslog.d/99-forward-syslog.conf"
    owner: "root"
    group: "root"
    mode: "0644"
  notify:
    - Restart rsyslog

- name: Record the component as present
  ansible.builtin.include_role:
    name: component_record
  vars:
    component_record_name: rsyslog_client
    component_record_action: present
    component_record_items: "{{ rsyslog_client_items }}"
