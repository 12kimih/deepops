---
# The registry cache proxy (docs/container/nginx-docker-cache.md). present, absent or
# kept (do nothing); a deploy sets it from deepops_components (slurm_enable_nginx_docker_cache
# on [slurm-cache]). absent removes the container and any pre-defined CA copy; the
# mirror cache and the generated CA stay.
nginx_docker_cache_state: present

# Run as a systemd unit (roles/container_service), its container named after it.
nginx_docker_cache_svc_name: docker.nginx-docker-cache.service
# The container's name when it ran outside systemd (docker restart policy): retired.
nginx_docker_cache_name: "deepops-nginx-docker-cache"
nginx_docker_cache_image: "rpardini/docker-registry-proxy:0.8.0@sha256:fe958e7a4b7ef01a646d903347a0522b6a9065b44b451c5ef87eb4b6b0f3d770"

nginx_docker_cache_mirror_path: "{{ deepops_dir }}/nginx-docker-cache/mirror"

nginx_docker_cache_registry_string: "registry.k8s.io quay.io gcr.io nvcr.io"
nginx_docker_cache_manifests: "false"
nginx_docker_cache_manifest_default_time: "1h"
