---
# What the component installs, for its record (roles/component_record): the container,
# and the pre-defined CA's copies while one is set. The mirror cache and a CA the proxy
# generated are data.
nginx_docker_cache_items: >-
  {{ ['unit:' ~ nginx_docker_cache_svc_name, 'container:' ~ nginx_docker_cache_svc_name,
      'file:/etc/systemd/system/' ~ nginx_docker_cache_svc_name, 'package:python3-docker']
     + (['file:' ~ nginx_docker_cache_ca_path ~ '/ca.key', 'file:' ~ nginx_docker_cache_ca_path ~ '/ca.crt']
        if nginx_docker_cache_ca | length > 0 else []) }}
# The container as it ran outside systemd, for a removal on a host never moved over.
nginx_docker_cache_retired_items: ["container:{{ nginx_docker_cache_name }}"]
