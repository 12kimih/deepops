---
- name: Record what this component installs
  ansible.builtin.include_role:
    name: component_record
  vars:
    component_record_name: nginx_docker_cache
    component_record_action: begin
    component_record_items: "{{ nginx_docker_cache_items }}"

- name: Install python3 docker module
  ansible.builtin.package:
    name: python3-docker
    state: present

- name: Ensure data directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    owner: "root"
    group: "root"
    mode: "0755"
    state: "directory"
  with_items:
    - "{{ nginx_docker_cache_mirror_path }}"
    - "{{ nginx_docker_cache_ca_path }}"

- name: Add pre-defined CA key file
  ansible.builtin.copy:
    src: "{{ nginx_docker_cache_ca.key }}"
    dest: "{{ nginx_docker_cache_ca_path }}/ca.key"
    owner: "root"
    group: "root"
    mode: "0400"
  register: nginx_docker_cache_ca_key
  notify: [Restart the caching proxy]
  when: nginx_docker_cache_ca | length > 0

- name: Add pre-defined CA certificate
  ansible.builtin.copy:
    src: "{{ nginx_docker_cache_ca.crt }}"
    dest: "{{ nginx_docker_cache_ca_path }}/ca.crt"
    owner: "root"
    group: "root"
    mode: "0444"
  register: nginx_docker_cache_ca_crt
  notify: [Restart the caching proxy]
  when: nginx_docker_cache_ca | length > 0

- name: Pull the image
  ansible.builtin.include_role:
    name: container_image
  vars:
    container_image: "{{ nginx_docker_cache_image }}"

# It ran outside systemd under its own name, with Docker's restart policy: that
# container holds the proxy port the unit's needs, so it goes first (its cache and CA
# are binds and stay).
- name: Retire the proxy container run outside systemd
  community.docker.docker_container:
    name: "{{ nginx_docker_cache_name }}"
    state: absent

- name: Run the caching proxy
  ansible.builtin.include_role:
    name: container_service
  vars:
    container_service:
      unit: "{{ nginx_docker_cache_svc_name }}"
      description: Container registry caching proxy
      image: "{{ nginx_docker_cache_image }}"
      options: [--network host]
      mounts:
        - {src: "{{ nginx_docker_cache_mirror_path }}", dst: /docker_mirror_cache}
        - {src: "{{ nginx_docker_cache_ca_path }}", dst: /ca}
      env:
        REGISTRIES: "{{ nginx_docker_cache_registry_string }}"
        ENABLE_MANIFEST_CACHE: "{{ nginx_docker_cache_manifests }}"
        MANIFEST_CACHE_DEFAULT_TIME: "{{ nginx_docker_cache_manifest_default_time }}"
      # nginx reads the mounted CA only at start.
      notify: [Restart the caching proxy]

- name: Record the component as present
  ansible.builtin.include_role:
    name: component_record
  vars:
    component_record_name: nginx_docker_cache
    component_record_action: present
    component_record_items: "{{ nginx_docker_cache_items }}"
