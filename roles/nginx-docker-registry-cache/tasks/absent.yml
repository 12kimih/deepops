---
# The container and a pre-defined CA's copies go; the mirror cache and a CA the proxy
# generated stay (python3-docker is freed by the record alone).
- name: Remove what this component installed
  ansible.builtin.include_role:
    name: component_record
  vars:
    component_record_name: nginx_docker_cache
    component_record_action: absent
    component_record_items: "{{ nginx_docker_cache_items }}"
