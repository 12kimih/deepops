---
# The CA on internal_ca_host, made once; internal_ca_certificate is its certificate (PEM),
# or empty under --check before it exists.
- name: Check the CA request
  ansible.builtin.assert:
    that:
      - internal_ca_name is match('^[a-z0-9][a-z0-9-]*$')
      - internal_ca_host in hostvars
    fail_msg: internal_ca needs a name (lowercase, digits, dashes) and a CA host from the inventory.
    quiet: true

- name: Install the certificate library on the CA host
  ansible.builtin.package:
    name: python3-cryptography
    state: present
  delegate_to: "{{ internal_ca_host }}"
  run_once: true

- name: Create the CA directory
  ansible.builtin.file:
    path: "{{ internal_ca_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  delegate_to: "{{ internal_ca_host }}"
  run_once: true

- name: Create the CA key
  community.crypto.openssl_privatekey:
    path: "{{ internal_ca_dir }}/ca.key"
    type: ECC
    curve: secp384r1
    owner: root
    group: root
    mode: "0600"
  delegate_to: "{{ internal_ca_host }}"
  run_once: true
  register: internal_ca_key

- name: Make the CA certificate
  when: not ansible_check_mode or not internal_ca_key.changed
  delegate_to: "{{ internal_ca_host }}"
  run_once: true
  block:
    - name: Make the CA's certificate request
      community.crypto.openssl_csr_pipe:
        privatekey_path: "{{ internal_ca_dir }}/ca.key"
        common_name: "{{ internal_ca_subject }}"
        use_common_name_for_san: false
        basic_constraints: [CA:TRUE, pathlen:0]
        basic_constraints_critical: true
        key_usage: [keyCertSign, cRLSign]
        key_usage_critical: true
      register: internal_ca_csr
      changed_when: false

    # Kept until it expires: a new CA would have to reach every host that trusts it.
    - name: Create the CA certificate
      community.crypto.x509_certificate:
        path: "{{ internal_ca_dir }}/ca.crt"
        privatekey_path: "{{ internal_ca_dir }}/ca.key"
        csr_content: "{{ internal_ca_csr.csr }}"
        provider: selfsigned
        selfsigned_not_after: "+{{ internal_ca_days }}d"
        owner: root
        group: root
        mode: "0644"

    - name: Read the CA certificate
      ansible.builtin.slurp:
        src: "{{ internal_ca_dir }}/ca.crt"
      register: internal_ca_read

- name: Note the CA certificate
  ansible.builtin.set_fact:
    internal_ca_certificate: "{{ internal_ca_read.content | default('') | b64decode }}"
