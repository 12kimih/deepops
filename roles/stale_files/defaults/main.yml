---
# roles/stale_files: the leftovers of retired installs, found by evidence and removed
# (library/stale_files.py says what each rule type takes). A component's own rules
# live with it (roles/slurm: slurm_stale_files_rules); the ones here fit any host.
#   stale_files_rules   the rules to apply (default: stale_files_host_rules, then the
#                       site's own stale_files_site_rules)
#   stale_files_state   absent removes what they match; report only lists it
#   stale_files_report  with report: also count the files under these no package owns
#                       and no rule matched, for a person to judge
#   stale_files_ignore  paths deepops itself installs there: never removed, never counted
stale_files_rules: "{{ stale_files_host_rules + stale_files_site_rules }}"
# A site's own leftovers, in the rule types library/stale_files.py takes: what a person
# installed by hand there and the site retired (e.g. a hand-copied binary under
# /usr/local/bin). Nothing a package owns is ever taken.
stale_files_site_rules: []
stale_files_state: absent
stale_files_report: []
# With a report, also audit what changes how the host behaves without a package's or a
# rule's say (library/stale_files.py: audit), for a person to judge; the unowned files
# are looked for in these directories.
stale_files_audit: "{{ stale_files_state == 'report' }}"
stale_files_config_dirs:
  - /etc/profile.d
  - /etc/bash_completion.d
  - /etc/environment.d
  - /etc/cron.d
  - /etc/cron.hourly
  - /etc/cron.daily
  - /etc/cron.weekly
  - /etc/cron.monthly
  - /etc/sudoers.d
  - /etc/apt/sources.list.d
  - /etc/apt/apt.conf.d
  - /etc/apt/preferences.d
  - /etc/apt/keyrings
  - /etc/yum.repos.d
  - /etc/sysctl.d
  - /etc/modprobe.d
  - /etc/modules-load.d
  - /etc/ld.so.conf.d
  - /etc/udev/rules.d
  - /etc/security/limits.d
  - /etc/tmpfiles.d
  - /etc/update-motd.d
  - /etc/ssh/sshd_config.d
  - /etc/rsyslog.d
  - /etc/logrotate.d
# Where a report looks for files nothing claims.
stale_files_report_paths: [/usr/local, /opt/deepops]
stale_files_ignore: []

# What a host keeps after its interpreters change (an OS release upgrade replaces
# python3.10, ruby3.0, perl 5.34): their site trees under /usr/local and /var/lib/gems,
# and the entry scripts that still name them; and libtool archives whose shared library
# is gone, which send a later build that searches /usr/local/lib to nothing.
stale_files_host_rules:
  - name: python of a release no longer installed
    type: runtime
    glob: /usr/local/lib/python3.*
    version: 'python(\d+\.\d+)$'
    interpreter: /usr/bin/python{0}
    dirs: [/usr/local/bin]
  - name: ruby gems of a release no longer installed
    type: runtime
    glob: /var/lib/gems/*
    version: '/(\d+\.\d+)\.\d+$'
    interpreter: /usr/bin/ruby{0}
    dirs: [/usr/local/bin]
  - name: perl modules of a release no longer installed
    type: runtime
    glob: /usr/local/lib/*/perl/*
    version: '/perl/(\d+\.\d+\.\d+)$'
    interpreter: /usr/bin/perl{0}
  - name: perl modules of a release no longer installed (shared)
    type: runtime
    glob: /usr/local/share/perl/*
    version: '/perl/(\d+\.\d+\.\d+)$'
    interpreter: /usr/bin/perl{0}
  # DCGM 3 (the datacenter-gpu-manager package) installed its bindings and samples
  # under /usr/local/dcgm; DCGM 4 (datacenter-gpu-manager-4-*) uses none of it, and a
  # removal that was not a purge, or a hand install, left the tree behind (a node with
  # only DCGM 4 kept one, 2026-11-22). While the old package is installed the tree is
  # its own and stays.
  - name: DCGM 3's tree
    type: glob
    globs: [/usr/local/dcgm]
  # Subiquity writes this for the unattended-upgrades run during an install and is
  # meant to remove it; left behind, it overrides the site's unattended-upgrades
  # settings (MinimalSteps, the allowed origins) from the end of apt.conf.d.
  - name: the Ubuntu installer's temporary unattended-upgrades config
    type: files
    dirs: [/etc/apt/apt.conf.d]
    pattern: zzzz-temp-installer-unattended-upgrade
    contains: "unattended-upgrades run to avoid failing on battery power"
  # An enable link of rc-local.service: the unit has no [Install], and
  # systemd-rc-local-generator pulls it in whenever /etc/rc.local is executable, so a
  # link was always a hand (or old playbook) addition, and without rc.local it starts a
  # unit whose condition fails at every boot.
  - name: the enable link of rc-local.service
    type: files
    dirs: [/etc/systemd/system/multi-user.target.wants]
    pattern: 'rc-local\.service'
  # DSA host keys: OpenSSH 10 dropped DSA and sshd has not loaded them since 7.0 (no
  # HostKey names them); older installs generated them anyway and they stayed.
  - name: DSA host keys sshd no longer loads
    type: files
    dirs: [/etc/ssh]
    pattern: 'ssh_host_dsa_key(\.pub)?'
  # A hand copy of roles/nfs's auto-restart drop-in under another name: it kept the old
  # OnFailure= after the role's helper learnt to leave a hung nfsd alone.
  - name: hand copies of the nfs-server auto-restart drop-in
    type: files
    dirs: [/etc/systemd/system/nfs-server.service.d]
    pattern: '(?!auto-restart\.conf$).+\.conf'
    contains: "OnFailure=nfs-server-restart"
  # What a task with backup: true writes beside a file on each change, never removed
  # (Ansible's own naming: <file>.<pid>.<YYYY-MM-DD@HH:MM:SS>~); tests/task-rules keeps
  # deepops from writing more.
  - name: the copies Ansible's backup option left
    type: files
    dirs: [/etc]
    pattern: '.+\.\d+\.\d{4}-\d\d-\d\d@\d\d:\d\d:\d\d~'
  # A kernel removed without purging, or by hand, leaves its module tree: one per kernel
  # ever installed. An installed kernel's tree is a package's and never taken; nor is
  # the running kernel's.
  - name: module trees of kernels no package installs
    type: kernel_trees
    dirs: [/lib/modules]
  # A removed install's library path (a CUDA runfile's /usr/local/cuda-X.Y) stays in
  # ld.so.conf.d after its directories went.
  - name: library paths whose directories are gone
    type: ld_conf
    dirs: [/etc/ld.so.conf.d]
  - name: libtool archives of a library that is gone
    type: libtool
    globs: [/usr/local/lib/*.la, /usr/local/lib/*/*.la]
