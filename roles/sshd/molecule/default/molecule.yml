---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: sshd-ubuntu-2404
    image: geerlingguy/docker-ubuntu2404-ansible
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  ansible_args:
    - -vv
  inventory:
    group_vars:
      all:
        sshd_manage: true
        sshd_ports: [22, 2222]
        sshd_settings: {LoginGraceTime: 20, X11Forwarding: false}
scenario:
  test_sequence: [destroy, syntax, create, prepare, converge, idempotence, side_effect, verify, destroy]
verifier:
  name: ansible
