---
# A host whose sshd_config was edited by hand, as the site's were, with cloud-init's
# drop-in beside it.
- name: Prepare
  hosts: all
  become: true
  tasks:
    - name: Install the OpenSSH server
      ansible.builtin.apt:
        name: openssh-server
        state: present
        update_cache: true

    - name: Edit sshd_config by hand
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        line: "{{ item }}"
        insertafter: "^Include"
      loop: ["Port 22", "LoginGraceTime 30"]

    - name: Leave a drop-in of cloud-init's
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/50-cloud-init.conf
        content: "PasswordAuthentication no\n"
        mode: "0600"

    # Ubuntu's own state is ssh.socket enabled and ssh.service not; the site had both.
    - name: Enable ssh.service beside the socket, by hand
      ansible.builtin.command:
        argv: [systemctl, enable, ssh.socket, ssh.service]
      changed_when: true
