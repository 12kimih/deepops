---
- name: Manage the OpenSSH server's settings
  when: sshd_manage | bool
  vars:
    sshd_aside_dir: "{{ sshd_backup_dir }}/{{ ansible_facts.date_time.iso8601_basic_short }}"
  block:
    - name: Check the settings
      ansible.builtin.assert:
        that:
          - sshd_ports | length > 0
          - sshd_ports | map('int') | select('gt', 0) | select('lt', 65536) | list | length == sshd_ports | length
          - "'Port' not in sshd_settings and 'Include' not in sshd_settings"
          - "'HostbasedAuthentication' not in sshd_settings"
        fail_msg: >-
          sshd_ports needs one or more ports (1-65535); ports go there, not in sshd_settings,
          Include is the package's and HostbasedAuthentication is sshd_hostbased_group's.
        quiet: true

    - name: Install the OpenSSH server (Debian family)
      ansible.builtin.apt:
        name: openssh-server
        state: present
        update_cache: true
        cache_valid_time: 3600
      when: ansible_facts.os_family == "Debian"

    - name: Install the OpenSSH server (RHEL family)
      ansible.builtin.dnf:
        name: openssh-server
        state: present
      when: ansible_facts.os_family == "RedHat"

    # Where ssh.socket starts sshd, its ports come from the configuration: a generator
    # turns the Port lines into the socket's ListenStream at daemon-reload.
    - name: Look for socket activation
      ansible.builtin.command:
        argv: [systemctl, is-enabled, ssh.socket]
      register: sshd_socket
      changed_when: false
      failed_when: false
      check_mode: false  # read-only; --check needs the result

    # sshd -t and -T need its privilege separation directory, which systemd makes only
    # when it starts sshd: a socket-started sshd that has had no login yet lacks it.
    - name: Make sshd's privilege separation directory (Debian family)
      ansible.builtin.file:
        path: /run/sshd
        state: directory
        owner: root
        group: root
        mode: "0755"
      when: ansible_facts.os_family == "Debian"

    - name: Read the ports sshd listens on now
      ansible.builtin.command:
        argv: [sshd, -T]
      register: sshd_before
      changed_when: false
      failed_when: false
      check_mode: false  # read-only; --check needs the result

    - name: Trust the cluster's hosts, or stop trusting them
      ansible.builtin.include_tasks: hostbased.yml

    # Anything else in sshd_config.d is read beside the drop-in and may set what it leaves
    # to the defaults: the directory holds the drop-in alone.
    - name: Find the drop-ins this role did not write
      find_present:
        paths: /etc/ssh/sshd_config.d
        file_type: any
        hidden: true
        excludes: [10-deepops.conf]
      register: sshd_foreign

    # What each one sets, so a preview shows the settings that leave with it.
    - name: Read the drop-ins this role did not write
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop: "{{ sshd_foreign.files | map(attribute='path') | sort }}"
      register: sshd_foreign_text

    - name: Report the drop-ins set aside
      ansible.builtin.debug:
        msg: >-
          {{ 'Would move' if ansible_check_mode else 'Moving' }}
          {{ sshd_foreign.files | map(attribute='path') | sort | join(', ') }} to {{ sshd_aside_dir }}:
          sshd_config.d holds only the site's drop-in; set what they set in sshd_settings.
          {% for file in sshd_foreign_text.results %} {{ file.item }}: {{ file.content | b64decode | trim }}.{% endfor %}
      when: sshd_foreign.matched > 0

    # Read here and written as content below: a copy from a path on the host shows no
    # diff, and the preview must show the hand edits the package's file replaces.
    - name: Read the package's own sshd_config (Debian family)
      ansible.builtin.slurp:
        src: /usr/share/openssh/sshd_config
      register: sshd_package_config
      when: ansible_facts.os_family == "Debian"

    # A configuration sshd rejects would leave no way in: the files are written, sshd
    # checks them together, and anything it refuses is put back as it was.
    - name: Write and check the configuration
      block:
        - name: Write the site's settings
          ansible.builtin.template:
            src: 10-deepops.conf.j2
            dest: /etc/ssh/sshd_config.d/10-deepops.conf
            owner: root
            group: root
            mode: "0644"
            backup: true
          register: sshd_dropin

        # The package's file: its hand edits move to the drop-in (sshd_settings).
        - name: Put back the package's own sshd_config (Debian family)
          ansible.builtin.copy:
            content: "{{ sshd_package_config.content | b64decode }}"
            dest: /etc/ssh/sshd_config
            owner: root
            group: root
            mode: "0644"
            backup: true
          register: sshd_main
          when: ansible_facts.os_family == "Debian"

        - name: Make the directory for the drop-ins set aside
          ansible.builtin.file:
            path: "{{ sshd_aside_dir }}"
            state: directory
            owner: root
            group: root
            mode: "0700"
          when: sshd_foreign.matched > 0

        # mv keeps each file as it was (owner, mode, a symlink as a symlink).
        - name: Set aside the drop-ins this role did not write
          change_command:
            argv: [mv, --, "{{ item }}", "{{ sshd_aside_dir }}/"]
          loop: "{{ sshd_foreign.files | map(attribute='path') | sort }}"
          register: sshd_aside

        - name: Let sshd check the whole configuration
          ansible.builtin.command:
            argv: [sshd, -t]
          changed_when: false
          when: sshd_dropin is changed or sshd_main is changed or sshd_aside is changed
      rescue:
        - name: Put the drop-ins set aside back
          change_command:
            argv: [mv, --, "{{ sshd_aside_dir }}/{{ item.item | basename }}", /etc/ssh/sshd_config.d/]
          loop: "{{ sshd_aside.results | default([]) | selectattr('rc', 'defined') | selectattr('rc', 'eq', 0) }}"
          loop_control:
            label: "{{ item.item }}"

        - name: Put the previous files back
          ansible.builtin.copy:
            src: "{{ item.backup_file }}"
            dest: "{{ item.dest }}"
            remote_src: true
            mode: "0644"
          loop: "{{ [sshd_dropin | default({}), sshd_main | default({})] | selectattr('backup_file', 'defined') | list }}"
          loop_control:
            label: "{{ item.dest }}"

        - name: Remove a drop-in that was not there before
          ansible.builtin.file:
            path: /etc/ssh/sshd_config.d/10-deepops.conf
            state: absent
          when: sshd_dropin | default({}) is changed and sshd_dropin.backup_file is not defined

        - name: Report the refused configuration
          ansible.builtin.fail:
            msg: sshd refused the new configuration; the previous files are back in place.
      # The copies exist only for the rollback.
      always:
        - name: Remove the copies kept for the rollback
          ansible.builtin.file:
            path: "{{ item.backup_file }}"
            state: absent
          loop: "{{ [sshd_dropin | default({}), sshd_main | default({})] | selectattr('backup_file', 'defined') | list }}"
          loop_control:
            label: "{{ item.backup_file }}"

    - name: Read the ports the new configuration gives
      ansible.builtin.command:
        argv: [sshd, -T]
      register: sshd_after
      changed_when: false
      check_mode: false  # read-only; --check needs the result
      when: not ansible_check_mode

    - name: Apply it
      when:
        - not ansible_check_mode
        - sshd_dropin is changed or sshd_main is changed or sshd_aside is changed
      vars:
        _ports_before: "{{ sshd_before.stdout_lines | select('match', '^port ') | sort | list }}"
        _ports_after: "{{ sshd_after.stdout_lines | select('match', '^port ') | sort | list }}"
        _socket: "{{ sshd_socket.stdout | default('') in ['enabled', 'enabled-runtime', 'static'] }}"
        _service: "{{ 'ssh' if ansible_facts.os_family == 'Debian' else 'sshd' }}"
      block:
        # New ports reach the socket only through the generator; the sessions in place
        # are their own processes and stay.
        - name: Move ssh.socket to the new ports
          systemd_unit:
            name: ssh.socket
            state: restarted
            daemon_reload: true
          when: _socket | bool and _ports_before != _ports_after

        # Socket-started sshd that is idle reads the file at the next login: nothing to
        # reload then.
        - name: Look at the sshd service
          ansible.builtin.command:
            argv: [systemctl, is-active, "{{ _service }}"]
          register: sshd_service
          changed_when: false
          failed_when: false
          check_mode: false  # read-only

        - name: Reload sshd
          systemd_unit:
            name: "{{ _service }}"
            state: reloaded
          when:
            - not (_socket | bool) or _ports_before == _ports_after
            - sshd_service.stdout == 'active' or not (_socket | bool)

    - name: Check sshd answers on every port
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ item | int }}"
        timeout: 30
      loop: "{{ sshd_ports }}"
      when: not ansible_check_mode
