---
# The directory of the expected component state, on a Prometheus host (prometheus_paths:
# component_expected_dir): made by its reader (roles/prometheus-node-exporter, which a
# missing directory gives a textfile error) and its writer (roles/prometheus), the same
# way. Group-writable by component_expected_group only when that is the controller
# user's own private group on this host (named like the user, no other member), for
# scripts/deepops/sync.py: a shared group would let every member silence or spoof
# ComponentNotDeployed and ComponentVersionNotPinned. Root's otherwise.
- name: Look up the group that writes the expected component state
  ansible.builtin.getent:
    database: group
    key: "{{ component_expected_group }}"
  failed_when: false
  register: _textfile_keep_expected_group

- name: Decide who writes the expected component state
  ansible.builtin.set_fact:
    _textfile_keep_expected_writer: >-
      {{ component_expected_group
         if (ansible_facts.getent_group | default({})).get(component_expected_group)
            | private_group(component_expected_group, component_expected_user)
         else 'root' }}

- name: Say that only root writes it
  ansible.builtin.debug:
    msg: >-
      {{ component_expected_dir }} stays root's: {{ component_expected_group }} is not
      {{ component_expected_user }}'s own private group on {{ inventory_hostname }}, so
      scripts/deepops/sync.py cannot write it; each prometheus.yml run does.
  when: _textfile_keep_expected_writer == 'root' and component_expected_group != 'root'

- name: Create the directory of the expected component state
  ansible.builtin.file:
    path: "{{ component_expected_dir }}"
    state: directory
    owner: root
    group: "{{ _textfile_keep_expected_writer }}"
    mode: "{{ '2775' if _textfile_keep_expected_writer != 'root' else '0755' }}"
