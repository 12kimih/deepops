---
# textfile_keep -- a node_exporter textfile that survives a reboot. node_exporter_prom_dir
# is a tmpfs; a kept copy under node_exporter_prom_keep_dir goes back there at boot
# (systemd-tmpfiles C: it copies only while the live file is missing, so exactly at boot,
# never over a newer one). One mechanism for both kinds of writer:
#   a role that writes the file when it runs (a fact the deploy knows):
#     - ansible.builtin.include_role:
#         name: textfile_keep
#       vars:
#         textfile_keep_name: nfs-exports        # <name>.prom
#         textfile_keep_content: "..."
#   a timer that rewrites it: the role installs only the restore line, and the writer
#   writes the kept copy beside the live file on every run:
#     - ansible.builtin.include_role:
#         name: textfile_keep
#         tasks_from: restore
#       vars:
#         textfile_keep_name: slurm-backup
# The caller lists the files in its component record, which removes them with it:
# {{ node_exporter_prom_dir }}/<name>.prom, {{ node_exporter_prom_keep_dir }}/<name>.prom
# and /etc/tmpfiles.d/deepops-textfile-<name>.conf.
textfile_keep_name: ""
textfile_keep_content: ""
