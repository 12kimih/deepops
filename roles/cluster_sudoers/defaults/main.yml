---
# cluster_sudoers -- grant administrator sudo through a NIS NETGROUP.
# Opt-in: the role is a no-op while cluster_sudoers_netgroup is empty.
#
# WHY A NETGROUP AND NOT A GROUP
#
# Two mechanisms resolve a user's groups. A Slurm job carries the numeric gid list
# resolved on the SUBMIT node (send_gids, on by default since 20.11); a direct SSH
# login resolves groups on the node itself. Membership in `sudo` on the head node
# therefore grants sudo inside jobs on every compute node but not over SSH to those
# same nodes, and membership on a compute node does the reverse.
#
# The group cannot be made consistent either: `sudo` is gid 27, below GID_MIN, so
# /var/yp/Makefile does not export it. A netgroup is matched by NAME through
# innetgr(3), so neither the GID_MIN filter nor the numeric gid path applies. Publish
# it with nis_export_netgroups in the nis_server role.
#
# The stock `%sudo ALL=(ALL:ALL) ALL` rule in /etc/sudoers is left alone, so a LOCAL
# account in the local sudo group with a local password keeps sudo when NIS is
# unreachable.
cluster_sudoers_netgroup: ""

# Require a password. Set true only where the password cannot be checked -- a node
# with no reachable hash for directory users, where a password-requiring rule can
# never succeed. Check as the user, on the node:
#
#   sudo -v        # prompts and returns 0 => a password-requiring rule works here
cluster_sudoers_nopasswd: false

# The privilege granted. Narrow this if the admins only need specific commands --
# `ALL=(ALL:ALL) NOPASSWD:ALL` is unrestricted root.
cluster_sudoers_privilege: "ALL=(ALL:ALL)"

# Filename under /etc/sudoers.d. sudo skips any name containing a dot or ending in
# '~', so the role asserts the name is one sudo will read.
cluster_sudoers_file: cluster-admins

# Fail rather than install a rule whose netgroup does not resolve on the node, since
# such a rule grants nothing.
cluster_sudoers_require_netgroup: true

# Drop-ins in /etc/sudoers.d that this role did not write are always REPORTED. Set
# prune to true to delete them as well. `playbooks/bootstrap/bootstrap-sudo.yml`
# leaves one per host for whoever ran it, granting passwordless root outside any
# group.
#
# A drop-in owned by a PACKAGE is never reported or pruned. Ownership is asked of
# dpkg/rpm rather than matched against a list of names, so components installed later
# are covered without being listed here.
cluster_sudoers_prune: false

# Additionally never reported or pruned -- files no package owns that must survive.
# Exact basenames.
#
#   README              ships with the sudo package
#   root                root's own grant
#   90-cloud-init-users cloud-init's grant for the default cloud user, which is the
#                       only sudo path on a stock cloud image
cluster_sudoers_keep:
  - README
  - root
  - 90-cloud-init-users
