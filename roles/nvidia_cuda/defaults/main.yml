---
# present, absent or kept (docs/deepops/component-state.md); the playbook sets it from
# slurm_install_cuda (roles/deploy_defaults).
cuda_state: present

# The newest toolkit of the CUDA major the driver branch serves (nvidia_versions):
# the unversioned cuda-toolkit would follow NVIDIA's newest release past what the
# driver runs. A specific version looks like cuda-toolkit-13-2.
cuda_version: "cuda-toolkit-{{ nvidia_driver_cuda_major }}"

# DGX-specific vars may be used to target specific models,
# because available versions for DGX may differ from the generic repo
cuda_dgx_1_version: "{{ cuda_version }}"
cuda_dgx_2_version: "{{ cuda_version }}"
cuda_dgx_a100_version: "{{ cuda_version }}"

# A specific CUDA package for every DGX model (empty: each model's own above). DGX OS
# may release at a different cadence than the toolkit repository.
cuda_dgx_override_version: ""

# Should we install the /etc/profile.d/cuda-vars.sh script that will put
# the CUDA toolkit binaries and libraries in the default environment?
cuda_toolkit_add_profile_script: true

# The CUDA repository: roles/package_repos (tasks_from: cuda).
