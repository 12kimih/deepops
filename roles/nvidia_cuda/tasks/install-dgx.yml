---
- name: DGX | Install CUDA on DGX-1
  repo_package:
    name: "{{ cuda_dgx_override_version | default(cuda_dgx_1_version, true) }}"
    state: present
  when: ansible_facts.product_name is search("DGX-1")

- name: DGX | Install CUDA on DGX-2
  repo_package:
    name: "{{ cuda_dgx_override_version | default(cuda_dgx_2_version, true) }}"
    state: present
  when: ansible_facts.product_name is search("DGX-2")

- name: DGX | Install CUDA on DGX A100
  repo_package:
    name: "{{ cuda_dgx_override_version | default(cuda_dgx_a100_version, true) }}"
    state: present
  when: ansible_facts.product_name is search("DGXA100")
