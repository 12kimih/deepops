---
- name: Ubuntu | remove ppa
  ansible.builtin.apt_repository:
    repo: ppa:graphics-drivers/ppa
    state: absent

- name: Ubuntu | add the CUDA repository
  ansible.builtin.include_role:
    name: package_repos
    tasks_from: cuda

- name: Ubuntu | install cuda
  ansible.builtin.package:
    name: "{{ cuda_version }}"
    state: present
