---
# One system-wide CUDA toolkit from NVIDIA's repository (present.yml). DGX systems keep
# DGX OS's own: there it is installed by model, never removed.
- name: Check the component state
  ansible.builtin.assert:
    that: cuda_state in ['present', 'absent', 'kept']
    fail_msg: "cuda_state must be present, absent or kept, not {{ cuda_state }}."
    quiet: true

- name: Check if we are running on DGX
  ansible.builtin.stat:
    path: /etc/dgx-release
  register: is_dgx
  when: cuda_state != 'kept'

- name: "Make the CUDA toolkit {{ cuda_state }}"
  ansible.builtin.include_tasks: "{{ cuda_state }}.yml"
  when: cuda_state != 'kept' and (cuda_state == 'present' or not is_dgx.stat.exists)
