---
- name: RedHat | add EPEL
  ansible.builtin.include_role:
    name: package_repos
    tasks_from: epel

- name: RedHat | add the CUDA repository
  ansible.builtin.include_role:
    name: package_repos
    tasks_from: cuda

- name: RedHat | install cuda
  ansible.builtin.package:
    name: "{{ cuda_version }}"
    state: present
