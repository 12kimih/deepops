---
- name: Check the component state
  ansible.builtin.assert:
    that: podman_state in ['present', 'absent', 'kept']
    fail_msg: "podman_state must be present, absent or kept, not {{ podman_state }}."
    quiet: true

- name: "Make rootless Podman {{ podman_state }}"
  ansible.builtin.include_tasks: "{{ podman_state }}.yml"
  when: podman_state != 'kept'
