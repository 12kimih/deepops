---
# Podman, its settings and the packages only it needed go through the record. The
# users' image stores (podman_storage_root) are data and stay; so do /etc/subuid and
# /etc/subgid (shadow's files: without newuidmap nothing reads the ranges) and the
# apparmor package's profiles (the OS's).
- name: Remove what this component installed
  ansible.builtin.include_role:
    name: component_record
  vars:
    component_record_name: podman
    component_record_action: absent
    component_record_items: "{{ podman_items }}"
    component_record_exclusive_packages: [podman]
