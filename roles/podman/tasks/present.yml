---
- name: Record what this component installs
  ansible.builtin.include_role:
    name: component_record
  vars:
    component_record_name: podman
    component_record_action: begin
    component_record_items: "{{ podman_items }}"

- name: Install rootless Podman
  ansible.builtin.package:
    name: "{{ podman_packages[ansible_facts.os_family] }}"
    state: present
    install_recommends: "{{ false if ansible_facts.os_family == 'Debian' else omit }}"

# Owned whole: a range outside the roster (useradd adds one for each new local user)
# could overlap a roster range, and container root of two users would then share IDs.
- name: Write the subordinate UID and GID ranges
  ansible.builtin.template:
    src: subid.j2
    dest: "/etc/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: [subuid, subgid]

# Rootless podman reads /etc/containers/storage.conf unless the user has their own.
- name: Keep rootless image storage on local disk
  ansible.builtin.template:
    src: storage.conf.j2
    dest: /etc/containers/storage.conf
    owner: root
    group: root
    mode: "0644"

- name: Create the containers.conf drop-in directory
  ansible.builtin.file:
    path: /etc/containers/containers.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Run podman without a systemd user instance
  ansible.builtin.template:
    src: containers.conf.j2
    dest: /etc/containers/containers.conf.d/50-deepops-rootless.conf
    owner: root
    group: root
    mode: "0644"

- name: Create the storage root
  ansible.builtin.file:
    path: "{{ podman_storage_root }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# Created by root, so no user can take another's name first in a shared parent.
- name: Create each user's storage directory
  ansible.builtin.file:
    path: "{{ podman_storage_root }}/{{ item.uid }}"
    state: directory
    owner: "{{ item.uid }}"
    group: "{{ item.uid }}"
    mode: "0700"
  loop: "{{ podman_subids }}"
  loop_control:
    label: "{{ podman_storage_root }}/{{ item.uid }} ({{ item.name }})"

# A job's XDG_RUNTIME_DIR now comes from Slurm's task prolog (roles/slurm,
# slurm_user_runtime_root). Earlier releases of this role used a podman wrapper and a
# runtime directory of their own.
- name: Remove the earlier podman wrapper and runtime directories
  ansible.builtin.include_role:
    name: stale_files
  vars:
    stale_files_state: absent
    stale_files_rules:
      - name: the podman wrapper earlier releases installed
        type: files
        dirs: [/usr/local/bin]
        pattern: podman
        contains: roles/podman keeps for this user
      - name: their runtime directories at boot
        type: files
        dirs: [/etc/tmpfiles.d]
        pattern: podman-users\.conf
        contains: Rootless podman runtime directories, one per user
      - name: their runtime root
        type: glob
        globs: [/run/podman-users]

- name: Let podman create user namespaces under AppArmor
  ansible.builtin.include_tasks: apparmor.yml
  when: ansible_facts.distribution == 'Ubuntu'

- name: Record the component as present
  ansible.builtin.include_role:
    name: component_record
  vars:
    component_record_name: podman
    component_record_action: present
    component_record_items: "{{ podman_items }}"
