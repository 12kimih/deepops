---
- name: Apt update
  ansible.builtin.apt:
    update_cache: true
  when: ansible_facts.distribution == 'Ubuntu'

- name: Restart cachefilesd
  ansible.builtin.service:
    name: cachefilesd
    state: restarted

- name: Restart docker
  ansible.builtin.service:
    name: docker
    state: restarted
