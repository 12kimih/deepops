---
# Site switches. They live here, not in vars/, so config/group_vars can set them;
# vars/ holds only the platform and package tables from NVIDIA's DGX guides.
# Upgrading every package is not this role's job: use playbooks/utilities/apt-upgrade.yml.

dgx_configure_raid_array: false
nvidia_driver_skip_reboot: false
dgx_raid_mount_path: /raid
cachefilesd_cache_dir: /raid
cachefilesd_cache_tag: dgx1cache
cachefilesd_cache_brun: 25%
cachefilesd_cache_bcull: 10%
cachefilesd_cache_dir_mode: 1775

# --- DGX OS 6 (Ubuntu 22.04) ---------------------------------------------------
dgx_os6_repo_files_url: https://repo.download.nvidia.com/baseos/ubuntu/jammy/dgx-repo-files.tgz

dgx_os6_install_driver: true
dgx_os6_install_container_runtime: true
dgx_os6_install_nvsm: true
dgx_os6_install_admin_packages: true
dgx_os6_install_development_packages: true
dgx_os6_disable_unattended_upgrades: true
dgx_os6_install_ipmisol: true
dgx_os6_install_logrotate: true

dgx_os6_driver_branch: "550"

# --- DGX OS 7 (Ubuntu 24.04) ---------------------------------------------------
# The repository files (the trust anchors of the DGX repositories) per URL
# (roles/download). NVIDIA keeps one unversioned file per release and updates it in
# place: when it changes, the download stops until the new sum is recorded here.
dgx_repo_files_checksums:
  "https://repo.download.nvidia.com/baseos/ubuntu/jammy/dgx-repo-files.tgz": "sha256:81b6725c3b828215d2cfd58ddd007a29d31c6d40b44d05f87f0739cdb8088412"
  "https://repo.download.nvidia.com/baseos/ubuntu/noble/x86_64/dgx-repo-files.tgz": "sha256:ddbcf6ef501c3b18a2773a0420eba64de250514d7ac915e575173674d6e348a4"
  "https://repo.download.nvidia.com/baseos/ubuntu/noble/arm64/dgx-repo-files.tgz": "sha256:d91072b92f59ae8a4c2aaa189654316bdfc6740e71b339f2aaf4806894dc1105"
dgx_os7_repo_files_url: "https://repo.download.nvidia.com/baseos/ubuntu/noble/{{ 'arm64' if ansible_facts.architecture in ['aarch64', 'arm64'] else 'x86_64' }}/dgx-repo-files.tgz"

dgx_os7_install_driver: true
dgx_os7_disable_unattended_upgrades: true

# --- Red Hat family (EL8, EL9) -------------------------------------------------
dgx_repo_dir: "rhel{{ ansible_facts.distribution_major_version }}"

dgx_extra_packages:
  - dgx-conf-cachefilesd
  - kernel-headers

dgx_redhat_manage_subscription_repos: true
dgx_redhat_install_driver: true
dgx_redhat_install_container_runtime: true
dgx_redhat_install_docker_ce: "{{ ansible_facts.distribution_major_version == '8' }}"
dgx_redhat_install_cachefilesd: false
dgx_redhat_driver_branch: "{{ '580' if ansible_facts.distribution_major_version == '9' else ('535-dkms' if dgx_redhat_platform.configuration_group == 'DGX H100 Configurations' else '525-dkms') }}"
dgx_redhat_driver_package_branch: "{{ dgx_redhat_driver_branch | regex_replace('-dkms$', '') }}"
dgx_redhat_use_open_kernel_modules: "{{ ansible_facts.distribution_major_version == '9' and dgx_redhat_platform.nvswitch | default(false) }}"
