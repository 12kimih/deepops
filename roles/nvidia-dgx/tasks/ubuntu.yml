---
# The release table is vars/main.yml (dgx_ubuntu_releases). Legacy DGX OS 4/5 (Ubuntu
# 18.04/20.04) is no longer supported and was removed.
- name: Check for a supported Ubuntu DGX Software Stack version
  ansible.builtin.fail:
    msg: >-
      This role supports Ubuntu {{ dgx_ubuntu_releases | list | join(', ') }};
      this host runs {{ ansible_facts.distribution_version }}.
  when: ansible_facts.distribution_version not in dgx_ubuntu_releases

- name: Run the DGX OS tasks of this release
  ansible.builtin.include_tasks: "ubuntu-{{ dgx_ubuntu_releases[ansible_facts.distribution_version] }}.yml"
