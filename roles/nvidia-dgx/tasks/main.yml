---
- name: Check for DGX
  ansible.builtin.fail:
    msg: "Role supports DGX systems only"
  when: ansible_facts.product_name is not search("DGX")

- name: Ubuntu tasks for DGX Software Stack
  ansible.builtin.include_tasks: ubuntu.yml
  when:
    - ansible_facts.distribution == 'Ubuntu'

- name: Red Hat family tasks for DGX Software Stack
  ansible.builtin.include_tasks: redhat.yml
  when: ansible_facts.os_family == 'RedHat'

- name: Configure raid array
  ansible.builtin.include_tasks: configure-raid.yml
  when: dgx_configure_raid_array

- name: Perform full OS upgrade on Ubuntu
  ansible.builtin.include_tasks: ubuntu-upgrade.yml
  when:
    - dgx_full_upgrade
    - ansible_facts.distribution == 'Ubuntu'
