---
- name: Include Red Hat DGX variables
  ansible.builtin.include_vars: redhat.yml

# The majors NVIDIA publishes a repository setup RPM for (vars/redhat.yml) are the ones
# this role supports: one table, so a new major is one entry there.
- name: Check for a supported Red Hat family DGX Software Stack version
  ansible.builtin.fail:
    msg: >-
      This role supports Red Hat family major versions {{ dgx_redhat_repo_setup_rpms | list | join(', ') }};
      this host runs {{ ansible_facts.distribution_major_version }}.
  when: ansible_facts.distribution_major_version not in dgx_redhat_repo_setup_rpms

- name: Run EL8+ DGX Software Stack tasks
  ansible.builtin.include_tasks: redhat-el8-plus.yml
  when: ansible_facts.distribution_major_version | int >= 8
