---
# EasyBuild on the host that owns the shared software tree, and the easyconfigs it builds
# (present.yml, packages.yml). What it builds stays: easybuild_prefix is data.
- name: Check the component state
  ansible.builtin.assert:
    that: easybuild_state in ['present', 'absent', 'kept']
    fail_msg: "easybuild_state must be present, absent or kept, not {{ easybuild_state }}."
    quiet: true

- name: "Make EasyBuild {{ easybuild_state }}"
  ansible.builtin.include_tasks: "{{ easybuild_state }}.yml"
  when: easybuild_state != 'kept'
