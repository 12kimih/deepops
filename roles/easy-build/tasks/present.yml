---
# EasyBuild with pip, per https://docs.easybuild.io/installation/: a root-owned venv per
# version on the shared tree, a modulefile next to the other shared modules, a system
# config in /etc/xdg/easybuild.d, and an unprivileged account that builds (eb refuses root).
- name: Record EasyBuild as installing
  ansible.builtin.include_role:
    name: component_record
  vars:
    component_record_name: easybuild
    component_record_action: begin
    component_record_items: "{{ easybuild_record_items }}"

- name: Refuse an EasyBuild version without its checksums
  ansible.builtin.assert:
    that: easybuild_version in easybuild_sha256
    fail_msg: "easybuild_sha256 has no row for EasyBuild {{ easybuild_version }}: add the sdist sha256s from pypi.org."
    quiet: true

- name: Install what EasyBuild needs (Debian family)
  become: true
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    name: [tar, gzip, bzip2, unzip, xz-utils, patch]
    state: present
  when: ansible_facts.os_family == "Debian"

- name: Install what EasyBuild needs (RedHat family)
  become: true
  ansible.builtin.dnf:
    name: [tar, gzip, bzip2, unzip, xz, patch]
    state: present
  when: ansible_facts.os_family == "RedHat"

# The old bootstrap wrote world-writable profile scripts root's login shells ran.
- name: Remove the old EasyBuild profile scripts
  become: true
  ansible.builtin.file:
    path: "/etc/profile.d/{{ item }}"
    state: absent
  loop: [z01_eb.sh, z01_eb.csh]

# With the IDs and home roles/system_accounts gives it (the same on every host: it owns
# files on shared storage), through roles/local_accounts. Resolved here: local_accounts
# evaluates its arguments in its own scope.
- name: Note the build account
  ansible.builtin.set_fact:
    _easybuild_accounts: "{{ {easybuild_user: _easybuild_account} }}"

- name: Create the build account
  ansible.builtin.include_role:
    name: local_accounts
    apply:
      become: true
  vars:
    local_accounts: "{{ _easybuild_accounts }}"

# Only the account's home and EasyBuild's own prefix are the account's, never more of
# the shared tree; EasyBuild creates what it needs below them.
- name: Give the build account its home and prefix
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ easybuild_user }}"
    group: "{{ easybuild_user }}"
    mode: "0755"
  loop:
    - "{{ _easybuild_account.home }}"
    - "{{ easybuild_prefix }}"

- name: Create the root-owned EasyBuild directories
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ easybuild_venv }}"
    - "{{ sm_module_path }}/EasyBuild"
    - /etc/xdg/easybuild.d

# setuptools first: the sdists have only setup.py, and building them without isolation
# keeps pip from fetching an unpinned setuptools. Rendered here: a template lookup in
# the include's arguments would look in roles/python_venv.
- name: Note EasyBuild's pinned requirements
  ansible.builtin.set_fact:
    _easybuild_venv_steps:
      - {requirements: "{{ lookup('ansible.builtin.template', 'setuptools.txt.j2') }}", args: "--only-binary :all:"}
      - {requirements: "{{ lookup('ansible.builtin.template', 'requirements.txt.j2') }}", args: --no-build-isolation}

- name: Install EasyBuild into its venv
  ansible.builtin.include_role:
    name: python_venv
    tasks_from: create
    apply:
      become: true
  vars:
    python_venv_path: "{{ easybuild_venv }}"
    python_venv_python: "{{ easybuild_python }}"
    python_venv_steps: "{{ _easybuild_venv_steps }}"

- name: Write the EasyBuild modulefile
  become: true
  ansible.builtin.template:
    src: EasyBuild.lua.j2
    dest: "{{ sm_module_path }}/EasyBuild/{{ easybuild_version }}.lua"
    owner: root
    group: root
    mode: "0644"

- name: Write the EasyBuild system configuration
  become: true
  ansible.builtin.template:
    src: easybuild.cfg.j2
    dest: /etc/xdg/easybuild.d/deepops.cfg
    owner: root
    group: root
    mode: "0644"

# Proves the module loads and EasyBuild takes its prefix from the system configuration
# (F) as the build account, not its per-user default.
- name: Check EasyBuild runs as the build account
  become: true
  become_user: "{{ easybuild_user }}"
  ansible.builtin.command:
    argv:
      - bash
      - -l
      - -c
      - module load "EasyBuild/$1" && eb --version && eb --show-config | grep -Eq "^prefix +\(F\) = $2\$"
      - check
      - "{{ easybuild_version }}"
      - "{{ easybuild_prefix }}"
    chdir: "{{ _easybuild_account.home }}"
  changed_when: false
  when: not ansible_check_mode  # a first --check has no account to become yet

- name: Build the easyconfigs
  ansible.builtin.include_tasks: packages.yml

# An earlier version's venv and modulefile go once they are no longer in the items.
- name: Record EasyBuild as present
  ansible.builtin.include_role:
    name: component_record
  vars:
    component_record_name: easybuild
    component_record_action: present
    component_record_items: "{{ easybuild_record_items }}"
    component_record_version: "{{ easybuild_version }}"
