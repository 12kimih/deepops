---
# Not main.yml: the roles that need a venv include this with python_venv_path and
# python_venv_steps. python_venv_built says whether it was (re)built, for a restart.
- name: Check the venv's inputs
  ansible.builtin.assert:
    that:
      - python_venv_path is match('^/.+')
      - python_venv_steps | length > 0
      - python_venv_steps | rejectattr('requirements', 'defined') | list | length == 0
    fail_msg: python_venv needs an absolute python_venv_path and python_venv_steps, each with its requirements.
    quiet: true

- name: Install what venv needs (Debian family)
  ansible.builtin.apt:
    name: "{{ python_venv_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts.os_family == "Debian" and python_venv_packages | length > 0

# From scratch, so nothing of an earlier build stays; the record is written last.
- name: Build the venv from its pinned requirements
  change_shell:
    cmd: |
      set -eu
      umask 022
      venv={{ python_venv_path | quote }}
      rm -rf "$venv"
      {{ python_venv_python | quote }} -m venv "$venv"
      {% for step in python_venv_steps %}
      printf '%s\n' {{ step.requirements | trim | quote }} > "$venv/requirements-{{ loop.index }}.txt"
      "$venv/bin/pip" install --no-cache-dir --disable-pip-version-check --require-hashes \
        {{ step.args | default('') }} -r "$venv/requirements-{{ loop.index }}.txt"
      {% endfor %}
      printf '%s\n' {{ _python_venv_digest | quote }} > {{ _python_venv_record | quote }}
    unless: [sh, -c, 'test "$(cat "$1" 2>/dev/null)" = "$2"', check, "{{ _python_venv_record }}", "{{ _python_venv_digest }}"]
  args:
    executable: /bin/bash
  register: python_venv_built
