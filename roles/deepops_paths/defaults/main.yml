---
# Where DeepOps puts things on a host, and what kind of host it is, written once for
# every role that uses it.
deepops_dir: /opt/deepops
# deepops' own directories on every host, root's and never world-writable: its state
# (records of what it installed, read back by later runs) and its cache (downloads and
# builds, which a run may recreate). Every role names them through these.
deepops_state_dir: /var/lib/deepops
deepops_cache_dir: /var/cache/deepops
# The Helm client every role drives (roles/helm_release, roles/runai); Kubespray puts
# it in its bin_dir, /usr/local/bin.
helm_bin: /usr/local/bin/helm
# One file per role waiting for a reboot (roles/maintenance reboot_request); the reboot
# step runs those roles again, and a component removed meanwhile takes its file along
# (roles/component_record).
maintenance_reboot_requests_dir: "{{ deepops_state_dir }}/reboot-requested-by"
# Node-side home of a GPU power cap (roles/nvidia_power_limit). Its unit reads it as an
# EnvironmentFile, so the number lives in one place on the node, and anything else that
# changes a GPU's power limit reads the cap back instead of guessing: the Slurm
# prolog/epilog does, so an exclusive job never gets the card maximum on a capped node.
nvidia_power_limit_conf_file: /etc/nvidia-power-limit.conf
# Turns PCIe ACS off, or lists the devices where it is on (roles/pcie_acs); NHC runs
# it to drain a node where ACS came back (roles/nhc). Its boot unit keeps the name the
# hand-installed one had (the old utilities/disable-acs.yml), so it is taken over in place.
pcie_acs_program: /usr/local/sbin/pcie-acs
pcie_acs_service: disable-acs.service
# Software modules (Lmod): the prefix must be on storage every node shares.
sm_prefix: /sw
sm_module_root: "{{ sm_prefix }}/modules"
sm_module_path: "{{ sm_module_root }}/all"
sm_software_path: "{{ sm_prefix }}/software"
# EasyBuild's own tree (software, modules, sources), the only part of sm_prefix its
# build account (roles/easy-build) owns.
easybuild_prefix: "{{ sm_prefix }}/easybuild"
easybuild_module_path: "{{ easybuild_prefix }}/modules/all"
# A container shares its host's kernel: /proc/sys is read-only there or would change
# the host, so kernel settings and similar host-wide steps are skipped in one.
deepops_container_types: [docker, container, containerd, podman, lxc, systemd-nspawn]
deepops_containerized: "{{ ansible_facts.virtualization_type | default('') in deepops_container_types }}"

# Source builds (roles/source_build), root's and never world-writable: the trees (gone
# once installed), the release archives, and the manifest of what each installed.
source_build_root: "{{ deepops_cache_dir }}/build"
source_build_archives: "{{ deepops_cache_dir }}/src"
source_build_manifests: "{{ deepops_state_dir }}/source-builds"
