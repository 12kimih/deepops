---
- name: Starting diagnostics step
  ansible.builtin.debug:
    msg: "Starting now"

- name: Check firmware
  ansible.builtin.include_tasks: check-firmware.yml
  ignore_errors: true

- name: Get health
  ansible.builtin.include_tasks: get-health.yml
  ignore_errors: true

- name: Get IB
  ansible.builtin.include_tasks: get-ib.yml
  ignore_errors: true
