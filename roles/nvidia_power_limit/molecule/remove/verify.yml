---
- name: Verify
  hosts: all
  tasks:
    - name: Stat the systemd unit
      ansible.builtin.stat:
        path: /etc/systemd/system/nvidia-power-limit.service
      register: unit

    - name: Read the stub nvidia-smi log
      ansible.builtin.slurp:
        src: /var/log/nvidia-smi-stub.log
      register: smi_log

    - name: Assert the cap was removed and the GPU reset to its default limit
      ansible.builtin.assert:
        that:
          - not unit.stat.exists
          - "'-pl 600' in (smi_log.content | b64decode)"
        fail_msg: "the power cap was not fully removed (unit present, or no reset to the default limit)"
