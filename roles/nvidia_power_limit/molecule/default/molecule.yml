---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: power-limit-ubuntu-2204
    image: geerlingguy/docker-ubuntu2204-ansible
    cgroupns_mode: host
    pre_build_image: true
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
provisioner:
  name: ansible
  ansible_args:
    - -vv
verifier:
  name: ansible
