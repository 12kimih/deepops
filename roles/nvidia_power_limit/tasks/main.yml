---
- name: Check the component state
  ansible.builtin.assert:
    that: nvidia_power_limit_state in ['present', 'absent', 'kept']
    fail_msg: "nvidia_power_limit_state must be present, absent or kept, not {{ nvidia_power_limit_state }}."
    quiet: true

- name: "Make the GPU power limit {{ nvidia_power_limit_state }}"
  ansible.builtin.include_tasks: "{{ nvidia_power_limit_state }}.yml"
  when: nvidia_power_limit_state != 'kept'
