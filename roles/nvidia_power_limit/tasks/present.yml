---
- name: Record what this component installs
  ansible.builtin.include_role:
    name: component_record
  vars:
    component_record_name: nvidia_power_limit
    component_record_action: begin
    component_record_items: "{{ nvidia_power_limit_items }}"

# Converges in both directions: a watts value enforces the cap, an empty one removes it
# and restores each GPU's default limit, so running the role over a group is declarative.
# Persistence mode is left alone on the removal path -- it is not a cap, and other tooling
# on the node relies on it.

- name: Assert the configured power limit is a positive integer
  ansible.builtin.assert:
    that:
      - nvidia_power_limit_watts | int > 0
    fail_msg: >-
      nvidia_power_limit_watts must be a positive integer number of watts (e.g. 450), or
      left empty to remove any cap from this node. Got: "{{ nvidia_power_limit_watts }}".
      A typo would otherwise read as "no cap" and silently un-cap the node.
  when: nvidia_power_limit_watts | string | trim | length > 0

# nvidia-smi runs in a transient unit throughout, so it sees the GPUs even where the
# ssh service hides them (DeviceAllow, see slurm login-compute-setup).
#
# Gate on a working driver rather than just GPU presence: a node can have an NVIDIA
# card (lspci) but no driver yet, in which case nvidia-smi is absent. With no cap set
# there is nothing to reset, so the node passes; with a cap set, it cannot be applied,
# so the node fails (under --check only a warning: the driver may be in the same run).
- name: Check for nvidia-smi
  ansible.builtin.command: which nvidia-smi
  register: nvidia_power_limit_smi
  changed_when: false
  failed_when: false
  check_mode: false

- name: Require nvidia-smi where a power limit is configured
  ansible.builtin.fail:
    msg: >-
      nvidia_power_limit_watts is {{ nvidia_power_limit_watts }} for {{ inventory_hostname }},
      but nvidia-smi is not found there, so the cap cannot be applied. Install the NVIDIA
      driver first, or remove the cap from this host's config.
  when:
    - nvidia_power_limit_smi.rc != 0
    - nvidia_power_limit_watts | int > 0
    - not ansible_check_mode

- name: Skip nodes without an NVIDIA driver
  ansible.builtin.debug:
    msg: >-
      nvidia-smi not found on {{ inventory_hostname }}: no GPU power limit to
      {{ 'apply (--check preview)' if nvidia_power_limit_watts | int > 0 else 'reset' }}.
  when: nvidia_power_limit_smi.rc != 0

- name: Configure the GPU power limit
  when: nvidia_power_limit_smi.rc == 0
  block:
    # "index, current, default, min, max" per GPU. Every decision below is made per
    # GPU against this, so nothing is written unless a card is off target.
    - name: Read the current and supported GPU power limits
      ansible.builtin.command:
        cmd: >-
          systemd-run --wait --pipe --collect --quiet --
          nvidia-smi
          --query-gpu=index,power.limit,power.default_limit,power.min_limit,power.max_limit
          --format=csv,noheader,nounits
      register: nvidia_power_limit_readings
      changed_when: false
      check_mode: false

    - name: Enforce the configured power limit
      when: nvidia_power_limit_watts | int > 0
      block:
        # nvidia-smi -pl silently refuses (non-zero) a value outside a card's Min/Max
        # Power Limit, which would leave the boot service failing forever. Catch it
        # here, per GPU, with a clear message instead.
        - name: Assert the requested limit is within every GPU's supported range
          ansible.builtin.assert:
            that:
              - nvidia_power_limit_watts | int >= (item.split(',')[3] | trim | float)
              - nvidia_power_limit_watts | int <= (item.split(',')[4] | trim | float)
            fail_msg: >-
              Requested {{ nvidia_power_limit_watts }}W is outside GPU
              {{ item.split(',')[0] | trim }}'s supported power range
              ({{ item.split(',')[3] | trim }} - {{ item.split(',')[4] | trim }} W) on
              {{ inventory_hostname }}. Check the range with: nvidia-smi -q -d POWER
          loop: "{{ nvidia_power_limit_readings.stdout_lines | default([]) }}"
          when:
            - item.split(',')[3] | trim is regex('^[0-9.]+$')
            - item.split(',')[4] | trim is regex('^[0-9.]+$')
          loop_control:
            label: "GPU {{ item.split(',')[0] | trim }}"

        # Written before the unit, which refuses to start without it. It also carries the
        # wattage, so a changed cap shows up here rather than in the unit file.
        - name: Write the node's GPU power-limit configuration
          ansible.builtin.template:
            src: nvidia-power-limit.conf.j2
            dest: "{{ nvidia_power_limit_conf_file }}"
            owner: root
            group: root
            mode: "0644"
          notify:
            - Reload systemd
            - Restart nvidia-power-limit

        - name: Install the GPU power-limit systemd unit
          ansible.builtin.template:
            src: nvidia-power-limit.service.j2
            dest: "/etc/systemd/system/{{ nvidia_power_limit_service_name }}"
            owner: root
            group: root
            mode: "0644"
          notify:
            - Reload systemd
            - Restart nvidia-power-limit

        - name: Enable and start the GPU power-limit service
          ansible.builtin.systemd:
            name: "{{ nvidia_power_limit_service_name }}"
            enabled: true
            state: started
            daemon_reload: true

        # Apply a changed cap during this run (the handler restarts the oneshot unit)
        # so the drift check below sees the new value.
        - name: Apply any pending power-limit change now
          ansible.builtin.meta: flush_handlers

        # A separate register: re-using nvidia_power_limit_readings would clobber the
        # outer read on any host that skips this branch, and a loop is templated
        # before its when is evaluated, so the skipped branch would still fail.
        - name: Re-read the enforced power limits
          ansible.builtin.command:
            cmd: >-
              systemd-run --wait --pipe --collect --quiet --
              nvidia-smi
              --query-gpu=index,power.limit,power.default_limit,power.min_limit,power.max_limit
              --format=csv,noheader,nounits
          register: nvidia_power_limit_recheck
          changed_when: false
          check_mode: false

        # Covers what the unit alone cannot: the unit file was already correct, so no
        # handler fired, but a card drifted (manual nvidia-smi -pl, driver reload).
        - name: Enforce the cap on any GPU that drifted from it
          ansible.builtin.command:
            cmd: systemd-run --wait --pipe --collect --quiet -- nvidia-smi -i {{ item.split(',')[0] | trim }} -pl {{ nvidia_power_limit_watts | int }}
          loop: "{{ nvidia_power_limit_recheck.stdout_lines | default([]) }}"
          when:
            - item.split(',')[1] | trim is regex('^[0-9.]+$')
            - (item.split(',')[1] | trim | float) != (nvidia_power_limit_watts | float)
          loop_control:
            label: "GPU {{ item.split(',')[0] | trim }}: {{ item.split(',')[1] | trim }}W -> {{ nvidia_power_limit_watts }}W"

    - name: Remove any power limit left on this node
      ansible.builtin.include_tasks: uncap.yml
      when: nvidia_power_limit_watts | int <= 0

    - name: Read back the enforced power limit
      ansible.builtin.command:
        cmd: systemd-run --wait --pipe --collect --quiet -- nvidia-smi --query-gpu=power.limit --format=csv,noheader
      register: nvidia_power_limit_enforced
      changed_when: false
      check_mode: false

    - name: Show the enforced power limit
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}:
          {{ 'capped at ' ~ nvidia_power_limit_watts ~ 'W' if nvidia_power_limit_watts | int > 0 else 'uncapped (card defaults)' }},
          enforced GPU power limit(s) = {{ nvidia_power_limit_enforced.stdout_lines | default([]) | join(', ') }}

- name: Record the component as present
  ansible.builtin.include_role:
    name: component_record
  vars:
    component_record_name: nvidia_power_limit
    component_record_action: present
    component_record_items: "{{ nvidia_power_limit_items }}"
