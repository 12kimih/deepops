---
- name: Prepare
  hosts: all
  become: true
  tasks:
    - name: Update the apt cache
      ansible.builtin.apt:
        update_cache: true

    # What roles/site_secrets makes, vaulted, in a site's config.
    - name: Write the read-only account's password file
      ansible.builtin.copy:
        content: molecule-only
        dest: "{{ ldap_secrets_dir }}/sssd.password"
        mode: "0600"
      delegate_to: localhost
      become: false
