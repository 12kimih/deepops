---
# The directory and a client of it in one container: slapd filled from a roster, SSSD
# reading it over StartTLS with the cluster CA (docs/deepops/accounts.md).
provisioner:
  inventory:
    hosts:
      all:
        children:
          ldap-server:
            hosts:
              ${DEEPOPS_MOLECULE_INSTANCE:-instance}-${MOLECULE_SCENARIO_NAME}: {}
    group_vars:
      all:
        people:
          alice: {uid: 1001, name: Alice Example, roles: [admin, docker]}
          bob: {uid: 1002, shell: /bin/sh}
          carol: {uid: 1003, status: left}
        ldap_suffix: dc=example,dc=internal
        # The read-only account's password file, written by prepare.yml.
        ldap_secrets_dir: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/ldap"
        directory_service: ldap
        directory_groups:
          - {name: dockerusers, gid: 4000, members: [alice]}
        directory_netgroups:
          - {name: cluster_admins, users: [alice]}
scenario:
  test_sequence: [destroy, syntax, create, prepare, converge, idempotence, side_effect, verify, destroy]
