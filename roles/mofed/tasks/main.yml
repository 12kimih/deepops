---
# DOCA-OFED from NVIDIA's DOCA network repository, as the DOCA-Host installation guide
# of mofed_doca_version describes (see defaults/main.yml).

# --- Prerequisites: headers of the running kernel and DKMS, which builds the modules ---
- name: Add EPEL for DKMS (RHEL family)
  ansible.builtin.include_role:
    name: package_repos
    tasks_from: epel
  when: ansible_facts.os_family == "RedHat"

- name: Install the kernel headers, DKMS and compiler (Debian)
  ansible.builtin.apt:
    name: ["linux-headers-{{ ansible_facts.kernel }}", dkms, gcc, make]
    state: present
    update_cache: true
  when: ansible_facts.os_family == "Debian"

- name: Install the kernel headers, DKMS and compiler (RHEL family)
  ansible.builtin.dnf:
    name: ["kernel-devel-{{ ansible_facts.kernel }}", "kernel-headers", dkms, gcc, make]
    state: present
  when: ansible_facts.os_family == "RedHat"

# --- Previous stacks: "Full uninstallation is required before installing DOCA-Host" ---
- name: Read the OFED stack on the host
  ansible.builtin.command:
    argv: [ofed_info, -s]
  register: mofed_ofed_info
  changed_when: false
  failed_when: false
  check_mode: false  # read-only; --check needs the result

- name: Read the installed DOCA profile's version
  ansible.builtin.command:
    argv: "{{ ['dpkg-query', '-W', '-f', '${Version}', mofed_package] if ansible_facts.os_family == 'Debian'
              else ['rpm', '-q', '--qf', '%{VERSION}', mofed_package] }}"
  register: mofed_installed_version
  changed_when: false
  failed_when: false
  check_mode: false  # read-only; --check needs the result

# A standalone MLNX_OFED (ofed_info names itself MLNX_OFED_LINUX) goes with its own
# uninstaller, as the guide says.
- name: Remove MLNX_OFED
  ansible.builtin.command:
    argv: [/usr/sbin/ofed_uninstall.sh, --force]
  changed_when: true
  when: mofed_ofed_info.stdout is search('^MLNX_OFED_LINUX')

# DOCA before 2.6 cannot be upgraded in place: every DOCA package goes first.
- name: Remove a DOCA older than 2.6
  ansible.builtin.include_role:
    name: host_baseline
    tasks_from: absent
  vars:
    host_baseline_absent_packages: ["doca*", "flexio*", "dpa-gdbserver*", "dpa-stats*", "dpa-resource-mgmt*", "dpaeumgmt*"]
  when:
    - mofed_installed_version.rc == 0
    - mofed_installed_version.stdout | length > 0
    - mofed_installed_version.stdout is version('2.6', '<')

# --- The repository, signed by the "NVIDIA DOCA Host" key (roles/package_repos) ---
- name: Add the DOCA repository
  ansible.builtin.include_role:
    name: package_repos
    tasks_from: repo
  vars:
    package_repos_repo:
      name: nvidia-doca
      uris: "{{ mofed_repo_base_url }}"
      suites: ["./"]
      key_url: "{{ mofed_repo_keys[ansible_facts.os_family].url }}"
      key_checksum: "{{ mofed_repo_keys[ansible_facts.os_family].checksum }}"
      key_fingerprint: "{{ mofed_repo_key_fingerprint }}"
      # The Mellanox key and entries that signed DOCA before 3.2.2.
      legacy_files:
        - /usr/share/keyrings/mellanox-doca.asc
        - /etc/apt/sources.list.d/mellanox-doca.list
        - /etc/yum.repos.d/mellanox-doca.repo
        - /usr/share/keyrings/nvidia-doca.gpg

# --- The profile, then the firmware updater if asked for ---
- name: Install DOCA-OFED (Debian)
  ansible.builtin.apt:
    name: "{{ [mofed_package] + (['mlnx-fw-updater'] if mofed_install_fw_updater else []) }}"
    state: present
    update_cache: true
  register: mofed_install_debian
  when: ansible_facts.os_family == "Debian"
  environment: "{{ proxy_env }}"

- name: Install DOCA-OFED (RHEL family)
  ansible.builtin.dnf:
    name: "{{ [mofed_package] + (['mlnx-fw-updater'] if mofed_install_fw_updater else []) }}"
    state: present
  register: mofed_install_redhat
  when: ansible_facts.os_family == "RedHat"
  environment: "{{ proxy_env }}"

- name: Ask for a reboot to load the OFED kernel modules
  ansible.builtin.include_role:
    name: maintenance
    tasks_from: reboot_request
  vars:
    maintenance_reason: "load the DOCA-OFED kernel modules"
  when: (mofed_install_debian is changed) or (mofed_install_redhat is changed)

# Installed, and from the pinned release (DOCA-Host versions read <release>-<build>).
- name: Read the installed DOCA profile's version again
  ansible.builtin.command:
    argv: "{{ ['dpkg-query', '-W', '-f', '${Version}', mofed_package] if ansible_facts.os_family == 'Debian'
              else ['rpm', '-q', '--qf', '%{VERSION}', mofed_package] }}"
  register: mofed_final_version
  changed_when: false
  failed_when: false
  check_mode: false  # read-only; --check needs the result
  when: not ansible_check_mode

- name: Check the pinned DOCA release is installed
  ansible.builtin.assert:
    that: mofed_final_version.stdout is match(mofed_doca_version | regex_escape ~ '([-.]|$)')
    fail_msg: >-
      {{ mofed_package }} is {{ mofed_final_version.stdout | default('not installed', true) }}, not
      {{ mofed_doca_version }}. A newer DOCA is not downgraded in place: remove it as the
      DOCA-Host guide describes, then rerun.
    quiet: true
  when: not ansible_check_mode
