---
# Spack as https://spack.readthedocs.io/en/latest/getting_started.html describes it: a
# release tag of spack/spack cloned into a prefix every node shares, configured in the
# instance's site scope ($SPACK_ROOT/etc/spack/site, "for a common Spack instance").
spack_repo: "https://github.com/spack/spack.git"
# upstream: git https://github.com/spack/spack v(\d+)\.(\d+)\.(\d+)
spack_version: "v1.2.2"
spack_install_dir: "{{ sm_prefix }}/spack"

# The builtin package repository, a separate repository since Spack 1.0. Left alone,
# every user's Spack clones it into ~/.spack/package_repos on a moving branch; here it is
# cloned once into the shared prefix at a fixed tag of the release line this Spack's own
# defaults name (etc/spack/defaults/base/repos.yaml: releases/v2026.06 for 1.2).
spack_packages_repo: "https://github.com/spack/spack-packages.git"
# upstream: git https://github.com/spack/spack-packages v(2026)\.(06)\.(\d+)
spack_packages_version: "v2026.06.0"
spack_packages_dir: "{{ sm_prefix }}/spack-packages"

# Lmod modules for what Spack installs (modules.yaml), in a Core/compiler/MPI hierarchy
# under share/spack/lmod, registered with Lmod on every node. Packages built with these
# compilers go in the Core layer.
spack_lmod_core_compilers: [gcc]

# Specs the role installs (as root, into the shared tree). Empty = none.
spack_default_packages: []
