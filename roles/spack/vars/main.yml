---
# The docs' system prerequisites (installing_prerequisites.html).
spack_prerequisites:
  Debian: [file, bzip2, ca-certificates, g++, gcc, gfortran, git, gzip, lsb-release, patch, python3, tar, unzip, xz-utils, zstd]
  RedHat: [file, bzip2, ca-certificates, git, gzip, patch, python3, tar, unzip, xz, zstd, gcc, gcc-c++, gcc-gfortran]
spack_bin: "{{ spack_install_dir }}/bin/spack"
# arch_folder is off, so the Core layer is directly under the root.
spack_lmod_core_tree: "{{ spack_install_dir }}/share/spack/lmod/Core"
spack_clones:
  - {repo: "{{ spack_repo }}", dest: "{{ spack_install_dir }}", version: "{{ spack_version }}"}
  - {repo: "{{ spack_packages_repo }}", dest: "{{ spack_packages_dir }}", version: "{{ spack_packages_version }}"}
