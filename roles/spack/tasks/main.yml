---
# The shared instance, installed once (on a host that writes the shared prefix); every
# node gets the module tree with tasks_from: register.
- name: Add EPEL (RHEL family)
  ansible.builtin.include_role:
    name: package_repos
    tasks_from: epel
  when: ansible_facts.os_family == "RedHat"

# "apt update" then install, as the docs list it.
- name: Install Spack's system prerequisites (Debian)
  ansible.builtin.apt:
    name: "{{ spack_prerequisites.Debian }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts.os_family == "Debian"

- name: Install Spack's system prerequisites (RHEL family)
  ansible.builtin.dnf:
    name: "{{ spack_prerequisites.RedHat }}"
    state: present
  when: ansible_facts.os_family == "RedHat"

- name: Create the install directories
  ansible.builtin.file:
    path: "{{ item }}"
    owner: root
    group: root
    mode: "0755"
    state: directory
  loop:
    - "{{ spack_install_dir }}"
    - "{{ spack_packages_dir }}"

# A shallow clone at the tag. The git module fails on an existing shallow clone checked
# out at a tag (detached HEAD), so an existing clone is moved with git itself, and only
# when it is not at the pinned tag already.
- name: Read the tags each clone is at (a commit can carry several)
  ansible.builtin.command:
    argv: [git, -C, "{{ item.dest }}", tag, --points-at, HEAD]
  loop: "{{ spack_clones }}"
  loop_control:
    label: "{{ item.dest }}"
  register: spack_clone_tags
  changed_when: false
  failed_when: false
  check_mode: false  # read-only; --check needs the result

- name: Clone Spack and its package repository at their pinned tags
  ansible.builtin.git:
    repo: "{{ item.item.repo }}"
    dest: "{{ item.item.dest }}"
    version: "{{ item.item.version }}"
    depth: 1
  loop: "{{ spack_clone_tags.results }}"
  loop_control:
    label: "{{ item.item.dest }} at {{ item.item.version }}"
  when: item.rc == 128 and item.stderr is search('not a git repository')
  register: spack_clone
  until: spack_clone is succeeded
  retries: 5
  delay: 10

- name: Move an existing clone to its pinned tag
  change_shell:
    cmd: >-
      git -C "$DEST" fetch --depth 1 origin tag "$VERSION" &&
      git -C "$DEST" checkout -q "$VERSION"
  environment:
    DEST: "{{ item.item.dest }}"
    VERSION: "{{ item.item.version }}"
  loop: "{{ spack_clone_tags.results }}"
  loop_control:
    label: "{{ item.item.dest }} to {{ item.item.version }}"
  when:
    - not (item.rc == 128 and item.stderr is search('not a git repository'))
    - item.item.version not in item.stdout_lines
  register: spack_move
  retries: 5
  delay: 10
  until: spack_move is succeeded

- name: Create the instance's site configuration scope
  ansible.builtin.file:
    path: "{{ spack_install_dir }}/etc/spack/site"
    owner: root
    group: root
    mode: "0755"
    state: directory

- name: Configure the instance (site scope)
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ spack_install_dir }}/etc/spack/site/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: [repos.yaml, modules.yaml]

# The docs' shell support, at login for every user of this host.
- name: Set up Spack's shell support
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "/etc/profile.d/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: [z00_spack.sh, z00_spack.csh]

- name: Check Spack is the pinned release
  ansible.builtin.command:
    argv: ["{{ spack_bin }}", --version]
  register: spack_version_check
  changed_when: false
  check_mode: false  # read-only; --check needs the result
  failed_when: (spack_version_check.stdout.split() | first | default('')) != (spack_version | regex_replace('^v', ''))
  when: not ansible_check_mode or not (spack_clone is changed or spack_move is changed)

- name: Check Spack reads the shared package repository
  ansible.builtin.command:
    argv: ["{{ spack_bin }}", location, --repo, builtin]
  register: spack_repo_check
  changed_when: false
  check_mode: false  # read-only; --check needs the result
  failed_when: (spack_repo_check.stdout | trim) is not match(spack_packages_dir | regex_escape)
  when: not ansible_check_mode or not (spack_clone is changed or spack_move is changed)

# `spack install` is a no-op for a spec already installed; modules for new installs are
# generated as they install (modules.yaml enable: lmod).
- name: Install the default packages
  change_command:
    argv: ["{{ spack_bin }}", install, "{{ item }}"]
  loop: "{{ spack_default_packages }}"
  register: spack_build_result
  changed_when: >-
    ansible_check_mode or ('already installed' not in spack_build_result.stdout)
