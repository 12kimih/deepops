---
# Put the instance's Lmod tree on every node's MODULEPATH (run on every node; the
# instance itself is installed once, by tasks/main.yml).
- name: Resolve the Spack module tree
  ansible.builtin.set_fact:
    spack_register_paths: ["{{ spack_lmod_core_tree }}"]

- name: Register the Spack module tree with Lmod
  ansible.builtin.include_role:
    name: lmod
    tasks_from: register
  vars:
    lmod_register_name: spack
    lmod_register_paths: "{{ spack_register_paths }}"
