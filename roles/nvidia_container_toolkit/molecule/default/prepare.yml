---
# No GPU and no Docker in CI: report one GPU (roles/facts) and give the host the
# daemon.json roles/docker keeps, with a key of Docker's own the role must keep.
- name: Prepare
  hosts: all
  become: true
  tasks:
    - name: Create the custom facts directory
      ansible.builtin.file:
        path: /etc/ansible/facts.d
        state: directory
        mode: "0755"

    - name: Report one GPU
      ansible.builtin.copy:
        dest: /etc/ansible/facts.d/gpus.fact
        content: '{"count": 1, "device_ids": ["0x2330"]}'
        mode: "0644"

    - name: Create the Docker configuration directory
      ansible.builtin.file:
        path: /etc/docker
        state: directory
        mode: "0755"

    - name: Write the daemon.json roles/docker keeps
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        content: '{"live-restore": true}'
        mode: "0644"
