---
- name: Ubuntu | set package architecture
  ansible.builtin.set_fact:
    nvidia_container_toolkit_deb_arch: "{{ ansible_facts.architecture | deb_architecture }}"

# Prerequisites named by the official install guide (ca-certificates, gnupg2 -- we
# use get_url instead of curl). https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/latest/install-guide.html
- name: Ubuntu | install repository prerequisites
  repo_package:
    use: apt
    name:
      - ca-certificates
      - gnupg2
    state: present
    update_cache: true
  when: nvidia_container_toolkit_repo_base_url | length > 0

# NVIDIA's flat repository for this architecture, signed by its key alone
# (roles/package_repos, the one way a repository is added).
- name: Ubuntu | add the NVIDIA Container Toolkit repository
  ansible.builtin.include_role:
    name: package_repos
    tasks_from: repo
  vars:
    package_repos_repo:
      name: nvidia-container-toolkit
      uris: "{{ nvidia_container_toolkit_repo_base_url }}/stable/deb/{{ nvidia_container_toolkit_deb_arch }}"
      suites: [/]
      architectures: []
      key_url: "{{ nvidia_container_toolkit_repo_gpg_url }}"
      key_checksum: "{{ nvidia_container_toolkit_repo_gpg_checksum }}"
      # The set stays at nvidia_container_toolkit_version through every upgrade (unattended,
      # or the maintenance role's dist upgrade), from this repository or the CUDA one,
      # which publishes the same versions as builds of its own: one record for both, so
      # the installed build is kept. Unpinned, the record still names the set, so the
      # NVIDIA driver's archive-only pin (roles/nvidia_driver, read after it) never refuses
      # the CUDA builds and turns the installed one into a downgrade.
      pin:
        packages: "{{ nvidia_container_toolkit_packages | join(' ') }}"
        pin: "version {{ nvidia_container_toolkit_version if nvidia_container_toolkit_version | length > 0 else '*' }}"
        priority: "{{ 990 if nvidia_container_toolkit_version | length > 0 else 500 }}"
      # What this role and the install guide wrote before: the .list, the keyrings.
      legacy_files:
        - /etc/apt/sources.list.d/nvidia-container-toolkit.list
        - /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
        - /usr/share/keyrings/nvidia-container-toolkit-keyring.asc

- name: Ubuntu | install NVIDIA Container Toolkit
  repo_package:
    use: apt
    # apt pins as pkg=version; an empty version installs the latest.
    name: "{{ nvidia_container_toolkit_packages | map('regex_replace', '$', _version_suffix) | list }}"
    state: present
    update_cache: "{{ package_repos_changed }}"
  vars:
    _version_suffix: "{{ ('=' ~ nvidia_container_toolkit_version) if (nvidia_container_toolkit_version | length > 0) else '' }}"
  environment: "{{ proxy_env }}"
