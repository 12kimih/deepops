---
# Docker's NVIDIA keys in /etc/docker/daemon.json, through roles/docker_daemon_json (the
# one way a role changes it), where roles/docker keeps that file: the runtime (default only when
# nvidia_container_toolkit_set_as_default_runtime asks), and the NGC defaults.
# nvidia_container_toolkit_docker_wanted false takes them out again; a key nvidia-ctk
# wrote before the record existed goes by its value.
- name: Docker | look for the Docker daemon's settings
  ansible.builtin.stat:
    path: /etc/docker/daemon.json
  register: nvidia_container_toolkit_daemon_json

# Resolved here: docker_daemon_json evaluates its arguments in its own scope.
- name: Docker | work out the NVIDIA keys
  ansible.builtin.set_fact:
    _nvidia_container_toolkit_tuning_keys: >-
      {{ nvidia_container_toolkit_docker_tuning
         if nvidia_container_toolkit_docker_wanted | bool and nvidia_container_toolkit_set_docker_tuning | bool
         else {} }}
    _nvidia_container_toolkit_runtime_keys: >-
      {{ (_nvidia_container_toolkit_docker_runtime | combine({'default-runtime': 'nvidia'} if _default | bool else {}))
         if nvidia_container_toolkit_docker_wanted | bool else {} }}
    _nvidia_container_toolkit_runtime_drop: >-
      {{ ({} if nvidia_container_toolkit_docker_wanted | bool else _nvidia_container_toolkit_docker_runtime)
         | combine({} if _default | bool else {'default-runtime': 'nvidia'}) }}
  vars:
    _default: "{{ nvidia_container_toolkit_docker_wanted | bool and nvidia_container_toolkit_set_as_default_runtime | bool }}"
  when: nvidia_container_toolkit_daemon_json.stat.exists

- name: Docker | configure the NVIDIA runtime and the NGC defaults
  when: nvidia_container_toolkit_daemon_json.stat.exists
  block:
    # NGC/NCCL workloads run via bare `docker run` need a larger /dev/shm and unlimited
    # memlock (pinned GPU memory) + a large stack; docker's 64 MiB shm default breaks
    # multi-GPU NCCL. https://docs.nvidia.com/deeplearning/frameworks/user-guide/
    - name: Docker | apply daemon defaults for NGC/NCCL workloads (shm-size + ulimits)
      ansible.builtin.include_role:
        name: docker_daemon_json
      vars:
        docker_daemon_json_owner: nvidia-tuning
        docker_daemon_json_keys: "{{ _nvidia_container_toolkit_tuning_keys }}"

    - name: Docker | register the NVIDIA runtime
      ansible.builtin.include_role:
        name: docker_daemon_json
      vars:
        docker_daemon_json_owner: nvidia-runtime
        docker_daemon_json_keys: "{{ _nvidia_container_toolkit_runtime_keys }}"
        docker_daemon_json_drop_if: "{{ _nvidia_container_toolkit_runtime_drop }}"
