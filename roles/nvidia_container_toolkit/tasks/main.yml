---
- name: Check the component state
  ansible.builtin.assert:
    that: nvidia_container_toolkit_state in ['present', 'absent', 'kept']
    fail_msg: "nvidia_container_toolkit_state must be present, absent or kept, not {{ nvidia_container_toolkit_state }}."
    quiet: true

- name: Verify supported distribution
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == "Ubuntu" or ansible_facts.os_family == "RedHat"
    fail_msg: "The nvidia_container_toolkit role supports Ubuntu and Red Hat family hosts only."
  when: nvidia_container_toolkit_state == 'present'

# The toolkit hands a container the host's GPUs: a host without them has nothing to
# install (ansible_facts.ansible_local.gpus, roles/facts).
- name: "Make the NVIDIA Container Toolkit {{ nvidia_container_toolkit_state }}"
  ansible.builtin.include_tasks: "{{ nvidia_container_toolkit_state }}.yml"
  when:
    - nvidia_container_toolkit_state != 'kept'
    - nvidia_container_toolkit_state == 'absent' or (ansible_facts.ansible_local.gpus.count | default(0) | int) > 0
