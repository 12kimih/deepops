---
# What the component installs, for its record (roles/component_record): its packages,
# its repository's files (named by roles/package_repos) and the CDI specification its
# refresh units write. Its daemon.json keys are roles/docker_daemon_json's record.
_nvidia_container_toolkit_repo_items:
  Debian: [file:/etc/apt/sources.list.d/nvidia-container-toolkit.sources,
           file:/etc/apt/keyrings/nvidia-container-toolkit.asc,
           file:/etc/apt/keyrings/nvidia-container-toolkit.gpg,
           file:/var/cache/deepops/package-repos/nvidia-container-toolkit.key]
  RedHat: [file:/etc/yum.repos.d/nvidia-container-toolkit.repo,
           file:/etc/pki/rpm-gpg/RPM-GPG-KEY-nvidia-container-toolkit,
           file:/var/cache/deepops/package-repos/nvidia-container-toolkit.key]
nvidia_container_toolkit_items: >-
  {{ nvidia_container_toolkit_packages | map('regex_replace', '^', 'package:') | list
     + _nvidia_container_toolkit_repo_items[ansible_facts.os_family] | default([])
     + ['file:/var/run/cdi/nvidia.yaml'] }}
# The runtime as `nvidia-ctk runtime configure --runtime=docker` writes it.
_nvidia_container_toolkit_docker_runtime:
  runtimes:
    nvidia:
      args: []
      path: nvidia-container-runtime
