---
# present or absent (docs/deepops/component-state.md): a deploy passes the state from
# deepops_components; present where something needs it (enroot's GPU hook, a GPU
# container under Docker, the Kubernetes deploy with host drivers).
nvidia_container_toolkit_state: present

nvidia_container_toolkit_repo_base_url: "https://nvidia.github.io/libnvidia-container"
nvidia_container_toolkit_repo_gpg_url: "{{ nvidia_container_toolkit_repo_base_url }}/gpgkey"
# The signing key, checked on download.
nvidia_container_toolkit_repo_gpg_checksum: "sha256:c880576d6cf75a48e5027a871bac70fd0421ab07d2b55f30877b21f1c87959c9"
nvidia_container_toolkit_rpm_prerequisites:
  - ca-certificates

# Pin the toolkit to an exact package version for reproducibility (set "" to
# track the latest). All packages in the set are pinned to the same version.
# https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/latest/install-guide.html
# upstream: deb https://nvidia.github.io/libnvidia-container/stable/deb/amd64/Packages nvidia-container-toolkit
nvidia_container_toolkit_version: "1.20.2-1"
# The unified toolkit package set (nvidia-docker2 / nvidia-container-runtime are
# end-of-life and replaced by these). Pin all four together.
nvidia_container_toolkit_packages:
  - nvidia-container-toolkit
  - nvidia-container-toolkit-base
  - libnvidia-container-tools
  - libnvidia-container1

# Register the NVIDIA runtime with Docker (daemon.json, roles/docker_daemon_json) on a
# host where Docker is installed; containers ask for GPUs with --gpus.
nvidia_container_toolkit_configure_docker: true
# Keep the package's CDI specification (/var/run/cdi/nvidia.yaml) generated, for
# podman's --device nvidia.com/gpu=... (nvidia-cdi-refresh, toolkit 1.18 and newer).
nvidia_container_toolkit_cdi: true
# Off: a container gets GPUs only when it asks for them (--gpus or a CDI device), as
# NVIDIA's install guide configures Docker. With nvidia as Docker's default runtime,
# every container saw every GPU of the node, outside what Slurm gave the job. The
# Kubernetes deploy turns it on where the device plugin runs on Docker (it needs it).
nvidia_container_toolkit_set_as_default_runtime: false
# Daemon-wide docker defaults for NGC/PyTorch/NCCL workloads launched via bare
# `docker run`: the NGC deep-learning containers need a large /dev/shm and unlimited
# memlock (pinned GPU memory) + a big stack (docker's 64 MiB shm default breaks
# multi-GPU NCCL). Merged into /etc/docker/daemon.json. Slurm+pyxis/enroot and k8s
# set these through their own mechanisms, so this only affects plain `docker run`.
# Set false to leave docker's defaults alone.
nvidia_container_toolkit_set_docker_tuning: true
nvidia_container_toolkit_docker_tuning:
  default-shm-size: "1G"
  default-ulimits:
    memlock:
      Name: memlock
      Hard: -1
      Soft: -1
    stack:
      Name: stack
      Hard: 67108864
      Soft: 67108864
