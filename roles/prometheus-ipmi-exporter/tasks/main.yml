---
- name: Check the component state
  ansible.builtin.assert:
    that: ipmi_exporter_state in ['present', 'absent', 'kept']
    fail_msg: "ipmi_exporter_state must be present, absent or kept, not {{ ipmi_exporter_state }}."
    quiet: true

- name: "Make ipmi_exporter {{ ipmi_exporter_state }}"
  ansible.builtin.include_tasks: "{{ ipmi_exporter_state }}.yml"
  when: ipmi_exporter_state != 'kept'
