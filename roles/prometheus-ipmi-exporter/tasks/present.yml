---
- name: Record what this component installs
  ansible.builtin.include_role:
    name: component_record
  vars:
    component_record_name: ipmi_exporter
    component_record_action: begin
    component_record_items: "{{ ipmi_exporter_items }}"

# Prometheus generates every exporter's scrape targets (roles/prometheus); the file this
# role wrote on each host before goes. Not on a Prometheus host: there the prometheus
# role replaces it with the generated targets, and removing it first, by an exporter
# run ahead of that one, would stop the scrape until then.
- name: Remove the scrape target file this role wrote before
  ansible.builtin.file:
    path: "{{ prometheus_cfg_endpoint_dir }}/ipmi-exporter.yml"
    state: absent
  when: inventory_hostname not in deepops_component_registry | component_hosts(groups, 'prometheus', deepops_component_removals)

- name: Pull the image
  ansible.builtin.include_role:
    name: container_image
  vars:
    container_image: "{{ ipmi_exporter_container }}"

- name: Load IPMI kernel modules
  ansible.builtin.include_role:
    name: kernel_modules
  vars:
    kernel_modules: "{{ ipmi_exporter_kernel_modules }}"
    kernel_modules_optional: true

- name: Check for the IPMI device
  ansible.builtin.stat:
    path: /dev/ipmi0
  register: ipmi_exporter_device

- name: Skip hosts without a BMC
  ansible.builtin.debug:
    msg: "No /dev/ipmi0 on {{ inventory_hostname }}; ipmi-exporter not installed."
  when: not ipmi_exporter_device.stat.exists

- name: Install ipmi-exporter
  when: ipmi_exporter_device.stat.exists
  block:
    - name: Create config dir
      ansible.builtin.file:
        path: "{{ ipmi_exporter_config_dir }}"
        state: directory
        mode: "0755"

    - name: Install config file
      ansible.builtin.template:
        src: config.yml.j2
        dest: "{{ ipmi_exporter_config_dir }}/config.yml"
        owner: root
        group: root
        mode: "0644"
      notify: Restart ipmi-exporter

    - name: Run ipmi-exporter
      ansible.builtin.include_role:
        name: container_service
      vars:
        container_service:
          unit: "{{ ipmi_exporter_svc_name }}"
          description: Prometheus IPMI Exporter
          image: "{{ ipmi_exporter_container }}"
          options: [--network host, --user 0, "--cpus={{ ipmi_exporter_max_cpu }}", --device /dev/ipmi0]
          mounts:
            - {src: "{{ ipmi_exporter_config_dir }}", dst: /config, readonly: true}
          args: [--config.file=/config/config.yml, "--web.listen-address=:{{ ipmi_exporter_port }}"]
          state: "{{ ipmi_exporter_service_state }}"
          enabled: "{{ ipmi_exporter_service_enabled }}"
          notify: [Restart ipmi-exporter]
          health_url: "http://localhost:{{ ipmi_exporter_port }}/metrics"

- name: Record the component as present
  ansible.builtin.include_role:
    name: component_record
  vars:
    component_record_name: ipmi_exporter
    component_record_action: present
    component_record_items: "{{ ipmi_exporter_items }}"
    component_record_version: "{{ ipmi_exporter_container | regex_replace('@.*', '') }}"
