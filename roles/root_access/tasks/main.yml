---
- name: Find root's public keys on the break-glass hosts
  ansible.builtin.find:
    paths: /root/.ssh
    patterns: "*.pub"
  delegate_to: "{{ item }}"
  loop: "{{ root_access_from_hosts }}"
  register: root_access_found
  run_once: true

- name: Read root's public keys on the break-glass hosts
  ansible.builtin.slurp:
    src: "{{ item.1.path }}"
  delegate_to: "{{ item.0.item }}"
  loop: "{{ root_access_found.results | subelements('files') }}"
  loop_control:
    label: "{{ item.0.item }}:{{ item.1.path }}"
  register: root_access_keys
  run_once: true

- name: Refuse to render an authorized_keys without any key
  ansible.builtin.assert:
    that: root_access_keys.results | length > 0
    fail_msg: >-
      No /root/.ssh/*.pub on {{ root_access_from_hosts | join(', ') }}. Writing an empty
      authorized_keys would remove the break-glass path; create root's key pair there
      first (ssh-keygen -t ed25519 as root).
    quiet: true

# from= is the address each break-glass host connects from: root_access_source in its
# host_vars, else its ansible_host. It must be an address: sshd matches a host name
# only with UseDNS on, so a name would silently refuse the break-glass login.
- name: Require an address for each break-glass host
  ansible.builtin.assert:
    that: >-
      (hostvars[item].root_access_source | default(hostvars[item].ansible_host | default(item)))
      is match('^([0-9]{1,3}[.]){3}[0-9]{1,3}$|^[0-9a-fA-F:]+$')
    fail_msg: >-
      {{ item }} connects from {{ hostvars[item].root_access_source | default(hostvars[item].ansible_host | default(item)) }},
      not an address; set root_access_source (the IP it reaches the nodes from) in its host_vars.
    quiet: true
  loop: "{{ root_access_from_hosts }}"

# Mode 0600 root:root, as sshd's StrictModes requires.
- name: Allow exactly the break-glass hosts' root keys
  ansible.builtin.copy:
    dest: /root/.ssh/authorized_keys
    owner: root
    group: root
    mode: "0600"
    content: |
      # Managed by roles/root_access: root on {{ root_access_from_hosts | join(', ') }} only.
      {% for r in root_access_keys.results %}
      from="{{ hostvars[r.item.0.item].root_access_source | default(hostvars[r.item.0.item].ansible_host | default(r.item.0.item)) }}" {{ r.content | b64decode | trim }}
      {% endfor %}
