---
# present or absent (docs/deepops/component-state.md); a deploy sets it from
# deepops_components.
prometheus_state: present
prometheus_config_src: templates/prometheus.yml.j2
prometheus_container: "prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06"
prometheus_svc_name: "docker.prometheus.service"
# The container's CPUs and memory (Docker's --cpus and --memory, roles/container_service);
# "" for no limit.
prometheus_max_cpu: "2"
prometheus_max_memory: "8g"
prometheus_docker_volume_name: "deepops_prometheus_metrics"
prometheus_service_state: started
prometheus_service_enabled: true

prometheus_cfg_evaluation_interval: 15s

# TSDB retention: whichever limit is hit first wins. Empty size disables the size cap.
prometheus_retention_time: 90d
prometheus_retention_size: 50GB

# slurmctld's own metrics (MetricsType=metrics/openmetrics in slurm.conf), one scrape
# job per set at /metrics/<set> on its port. The first controller only: a standby
# redirects there. jobs-users-accts is left out: one series per user and account grows
# without bound. Empty targets: no Slurm, no scrape.
prometheus_slurmctld_metrics: [jobs, nodes, partitions, scheduler]
prometheus_slurmctld_targets: "{{ (groups['slurm-master'] | default([]))[:1] | map('regex_replace', '$', ':' ~ slurm_slurmctld_port) | list }}"

# Each node's NFS client latency (node_exporter's mountstats): the operations whose
# requests, response time, queue time and major timeouts the scrape keeps, by mount; the
# other operations and every transport and event family are dropped. Each operation
# costs 4 series per mount per host: a cluster of 9 hosts with 3 NFS mounts keeps
# 9 x 3 x 6 x 4 = about 650 series with these six (rules io-usage.yml).
prometheus_nfs_client_operations: [READ, WRITE, GETATTR, LOOKUP, ACCESS, COMMIT]
# When a node's NFS mount is slow (NfsClientSlow): its mean READ or WRITE response
# over 5 minutes, in milliseconds, past this for 15 minutes, by mountpoint. Exported on
# the Prometheus host as deepops_nfs_client_slow_seconds{mountpoint} for the alert to
# compare with; a mountpoint not named is not watched, {} watches none.
prometheus_nfs_client_slow_ms: {/home: 100}

# Extra rule files from the site config, e.g.
# ["{{ inventory_dir }}/files/prometheus/rules/site.yml"]
prometheus_extra_rule_files: []
