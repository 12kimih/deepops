---
# Both only while Prometheus is meant to run: a restart would start one set to stopped,
# and a reload would fail against it after its retries.
- name: Restart prometheus
  ansible.builtin.service:
    name: "{{ prometheus_svc_name }}"
    state: restarted
  when: prometheus_service_state == 'started'

# SIGHUP reloads the configuration, as the docs describe; the HTTP /-/reload would need
# --web.enable-lifecycle, which also serves an unauthenticated /-/quit. Retries cover a
# restart that is still starting up (the container is named after the unit).
- name: Reload prometheus
  change_command:
    argv: [docker, kill, --signal=HUP, "{{ prometheus_svc_name }}"]
  register: prometheus_reload
  until: prometheus_reload is succeeded
  retries: 10
  delay: 3
  when: prometheus_service_state == 'started'
