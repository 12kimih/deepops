---
# The hosts' power management held at full performance (roles/power_policy textfile
# metrics, cluster_tools.power_policy, run every 15 minutes): a setting the kernel will
# not take, one that something keeps switching back, and the runs stopping.
groups:
  - name: power-policy
    rules:
      - alert: PowerPolicyRefused
        expr: power_policy_refused > 0
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.host }} will not hold {{ $labels.setting }} at full performance"
          description: >-
            `power-policy check /etc/power-policy.json` on {{ $labels.host }}
            lists what each holds. A gpu/ setting: gpu/persistence is
            nvidia-persistenced's (`systemctl status nvidia-persistenced`), the others
            are what nvidia-smi refused (`journalctl -u power-policy` says which call).
            A sysfs setting the kernel refuses is the firmware's (ASPM, a BIOS power
            profile): set its performance profile in the BIOS or BMC.
      # Four runs in a row each found it off and set it back.
      # Refused ones are PowerPolicyRefused's: off, but nothing set them back.
      - alert: PowerPolicyKeepsBeingReset
        expr: power_policy_off - power_policy_refused > 0
        for: 50m
        labels: {severity: warning}
        annotations:
          summary: "Something keeps changing {{ $labels.setting }} on {{ $labels.host }}"
          description: >-
            Every run of power-policy sets it back (`journalctl -u power-policy` on {{
            $labels.host }} lists each). Find what writes it: a job script (nvidia-smi
            -pl, -ac, -lgc in a job), a tuned or power-profiles daemon, a package's unit.
      - alert: PowerPolicyStale
        expr: time() - power_policy_last_success_timestamp_seconds > 3600
        labels: {severity: warning}
        annotations:
          summary: "The power policy on {{ $labels.host }} has not run for an hour"
          description: "`journalctl -u power-policy` and `systemctl list-timers power-policy.timer` on the host."
