---
# Users' container image stores (roles/container_storage_gc textfile metrics,
# clustertools.container_gc). The disk itself is watched by the filesystem rules in
# host.yml; these say when the daily cleanup stopped working, and when a container
# deepops did not start has run on a node past the site's grace period.
groups:
  - name: container-storage
    rules:
      - alert: ContainerStorageCleanupStale
        expr: time() - container_storage_gc_last_success_timestamp_seconds > 3 * 86400
        labels: {severity: warning}
        annotations:
          summary: "Container image stores on {{ $labels.host }} have not been cleaned up for 3 days"
          description: >-
            The daily cleanup failed or did not run, so podman storage and the enroot
            cache can fill the local disk: `journalctl -u container-storage-gc` and
            `systemctl list-timers container-storage-gc.timer` on the host.
      # No timestamp at all on a host with the unit installed (never ran, or every run
      # failed since it was installed or since a boot emptied the textfile directory):
      # the alert above has nothing to compare, so the unit's presence stands in.
      - alert: ContainerStorageCleanupNeverReported
        expr: |
          count by (instance, host) (node_systemd_unit_state{name="container-storage-gc.service"})
          unless on (instance) container_storage_gc_last_success_timestamp_seconds
        for: 3d
        labels: {severity: warning}
        annotations:
          summary: "The container storage cleanup on {{ $labels.host }} has reported no success for 3 days"
          description: "`journalctl -u container-storage-gc` and `systemctl list-timers container-storage-gc.timer` on the host."
      # A running container without deepops' label (roles/container_service sets it),
      # created longer ago than the grace period: someone's own, outside Slurm, its
      # limits and its cleanup. Containers belong in jobs (pyxis, or podman in a job).
      - alert: ContainerOutsideSlurm
        expr: sum by (instance, host) (container_storage_gc_docker_unmanaged_stale{state="running"}) > 0
        labels: {severity: warning}
        annotations:
          summary: "{{ $value }} container(s) on {{ $labels.host }} run outside Slurm past the grace period"
          description: >-
            Docker containers deepops did not start have run on the node longer than the
            cleanup grace period, outside Slurm's limits and cleanup:
            `docker ps --filter label!=deepops.unit` on the host. Stop them, and run the
            work as a job (pyxis, or podman in a job; docs/container/podman.md).
