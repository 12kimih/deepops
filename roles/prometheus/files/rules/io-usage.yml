---
# Who drives the disks and the NFS exports: node_exporter's mountstats (what each node
# sends to and reads from each NFS mount, over the wire) and roles/io_usage's textfile
# counters (each job's and login's I/O on the node, cluster_tools.io_usage).
groups:
  - name: io-usage
    rules:
      # Bytes per second each node reads from and writes to the NFS server, by the
      # mountpoint the host gives the export (the scrape strips the exporter's /host).
      - record: host_mount:nfs_read_bytes:rate5m
        expr: |
          sum by (host, mountpoint) (
            rate(node_mountstats_nfs_total_read_bytes_total[5m])
            * on (instance, export, mountaddr, protocol) group_left (mountpoint)
            node_mountstats_nfs_mountpoint_info
          )
      - record: host_mount:nfs_write_bytes:rate5m
        expr: |
          sum by (host, mountpoint) (
            rate(node_mountstats_nfs_total_write_bytes_total[5m])
            * on (instance, export, mountaddr, protocol) group_left (mountpoint)
            node_mountstats_nfs_mountpoint_info
          )
      # Each node's NFS client latency, by mount and operation (the operations the scrape
      # keeps, prometheus_nfs_client_operations): the mean response, from sending a
      # request to its reply, and the share of a request's time it first waited in the
      # client's queue (high: the node itself, its RPC slots, is the bottleneck, not the
      # server). An operation with no requests in the window has no series.
      - record: host_mount_operation:nfs_response_seconds:mean5m
        expr: |
          sum by (host, mountpoint, operation) (
            rate(node_mountstats_nfs_operations_response_time_seconds_total[5m])
            * on (instance, export, mountaddr, protocol) group_left (mountpoint)
            node_mountstats_nfs_mountpoint_info
          )
          / (
            sum by (host, mountpoint, operation) (
              rate(node_mountstats_nfs_operations_requests_total[5m])
              * on (instance, export, mountaddr, protocol) group_left (mountpoint)
              node_mountstats_nfs_mountpoint_info
            ) > 0
          )
      - record: host_mount_operation:nfs_queue_share:ratio5m
        expr: |
          sum by (host, mountpoint, operation) (
            rate(node_mountstats_nfs_operations_queue_time_seconds_total[5m])
            * on (instance, export, mountaddr, protocol) group_left (mountpoint)
            node_mountstats_nfs_mountpoint_info
          )
          / (
            sum by (host, mountpoint, operation) (
              (
                rate(node_mountstats_nfs_operations_queue_time_seconds_total[5m])
                + rate(node_mountstats_nfs_operations_response_time_seconds_total[5m])
              )
              * on (instance, export, mountaddr, protocol) group_left (mountpoint)
              node_mountstats_nfs_mountpoint_info
            ) > 0
          )
      # A node's reads or writes on a watched mount slow for 15 minutes: the server, or
      # the network to it, answers this node late (deepops_nfs_client_slow_seconds: the
      # threshold per mountpoint, prometheus_nfs_client_slow_ms).
      - alert: NfsClientSlow
        expr: |
          host_mount_operation:nfs_response_seconds:mean5m{operation=~"READ|WRITE"}
          > on (mountpoint) group_left () max by (mountpoint) (deepops_nfs_client_slow_seconds)
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "NFS {{ $labels.operation }} on {{ $labels.mountpoint }} answers {{ $labels.host }} in {{ $value | humanizeDuration }} on average"
          description: >-
            Past the threshold (prometheus_nfs_client_slow_ms) for 15 minutes, so every
            job on the node waits on its files. The dashboard Storage / NFS and disks
            shows which nodes and since when: all of them slow points at the server or
            its disks (Disk busy), one alone at its network or its own queue (NFS queue
            share).
      # Each job's estimated share of its node's NFS traffic, every export together: the
      # node's wire bytes split across its jobs by their share of its jobs' syscall I/O
      # (io_usage_job_*). An estimate: syscall I/O counts local files, page cache and
      # pipes too, and the traffic of processes outside jobs is put on the jobs. Not
      # per export: a job's syscall counts do not say which mount they went to.
      - record: job:nfs_read_bytes:rate5m
        expr: |
          sum by (host, job_id, cgroup, user) (rate(io_usage_job_read_bytes_total[5m]))
          / on (host) group_left ()
          (sum by (host) (rate(io_usage_job_read_bytes_total[5m])) > 0)
          * on (host) group_left ()
          sum by (host) (host_mount:nfs_read_bytes:rate5m)
      - record: job:nfs_write_bytes:rate5m
        expr: |
          sum by (host, job_id, cgroup, user) (rate(io_usage_job_written_bytes_total[5m]))
          / on (host) group_left ()
          (sum by (host) (rate(io_usage_job_written_bytes_total[5m])) > 0)
          * on (host) group_left ()
          sum by (host) (host_mount:nfs_write_bytes:rate5m)
      - alert: IoUsageStale
        expr: time() - io_usage_last_success_timestamp_seconds > 600
        labels: {severity: warning}
        annotations:
          summary: "I/O usage on {{ $labels.host }} has not been counted for 10 minutes"
          description: >-
            Which jobs and logins do I/O on the node is not known, so the I/O notices
            cannot name them: `journalctl -u io-usage` and `systemctl list-timers
            io-usage.timer` on the host.
      # It counts, but no job: a node with jobs where io-usage succeeds yet exports no job
      # series. Slurm 26.05 named job cgroups by an opaque id, not job_<id>, and the count
      # found no job on any node for 8 days unnoticed (2026-11-27): the alert above only
      # proves the count ran, not that it saw what it is for.
      - alert: IoUsageJobsMissing
        expr: |
          label_replace(max by (node) (slurm_node_cpus_alloc) > 0, "host", "$1", "node", "(.*)")
          and on (host) io_usage_last_success_timestamp_seconds
          unless on (host) count by (host) (io_usage_job_read_bytes_total)
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "I/O usage on {{ $labels.host }} counts no job though jobs run there"
          description: >-
            The node runs jobs but io-usage found none of their processes, so the I/O
            notices cannot name them: compare a job process's /proc/<pid>/cgroup on the host
            with what roles/io_usage recognizes as a job's cgroup.
      # No timestamp at all where the unit is installed: the alert above has nothing to
      # compare, so the unit's presence stands in.
      - alert: IoUsageNeverReported
        expr: |
          count by (instance, host) (node_systemd_unit_state{name="io-usage.service"})
          unless on (instance) io_usage_last_success_timestamp_seconds
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "I/O usage on {{ $labels.host }} has reported no success for 30 minutes"
          description: "`journalctl -u io-usage` and `systemctl list-timers io-usage.timer` on the host."
