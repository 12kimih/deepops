---
groups:
  - name: host
    rules:
      # roles/journald: the system journal sized for journald_retention_days, measured by
      # journal-retention.timer. Short only once journald deleted entries (the oldest
      # kept one is not the journal's first): a young host is not short, only new.
      - alert: JournalRetentionShort
        expr: >-
          (time() - journald_entries_since_seconds) < journald_retention_target_seconds
          and journald_oldest_entry_seqnum > 1
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: "The system journal of {{ $labels.host }} reaches back {{ $value | humanizeDuration }} only"
          description: >-
            journald deleted entries younger than the retention it is sized for
            (roles/journald, journald_retention_days): what happened before is gone.
            `journalctl --disk-usage`, `ls /var/log/journal/*/ | wc -l` and the top senders
            (`journalctl --since -1h -o json --output-fields=SYSLOG_IDENTIFIER`) there;
            raise journald_system_max_use or stop the flood.
      # A measure that stopped: the alert above is blind.
      - alert: JournalRetentionUnmeasured
        expr: time() - journald_retention_last_success_timestamp_seconds > 3600
        labels: {severity: warning}
        annotations:
          summary: "How far back the journal of {{ $labels.host }} reaches has not been measured for an hour"
          description: >-
            `systemctl list-timers journal-retention.timer` and `journalctl -u
            journal-retention` on the host.
      - alert: HostDiskAlmostFull
        expr: |
          node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs|nfs.*|fuse.*"}
            / node_filesystem_size_bytes < 0.10
          and node_filesystem_readonly == 0
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.mountpoint }} on {{ $labels.host }} is over 90% full"
          description: "{{ $value | humanizePercentage }} free."
      - alert: HostDiskFull
        expr: |
          node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs|nfs.*|fuse.*"}
            / node_filesystem_size_bytes < 0.03
          and node_filesystem_readonly == 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.mountpoint }} on {{ $labels.host }} is over 97% full"
          description: "{{ $value | humanizePercentage }} free. Writes will start failing."
      # The six-hour trend and the last hour's both fill it: one large allocation (a job
      # scratch image of 70% of the disk) is a step the six-hour trend reads as filling
      # for six hours, while the last hour's is flat an hour after it.
      - alert: HostDiskFillingUp
        expr: |
          predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs|nfs.*|fuse.*"}[6h], 24 * 3600) < 0
          and predict_linear(node_filesystem_avail_bytes[1h], 24 * 3600) < 0
          and node_filesystem_avail_bytes / node_filesystem_size_bytes < 0.25
          and node_filesystem_readonly == 0
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.mountpoint }} on {{ $labels.host }} will fill within 24h"
          description: >-
            `du -xh --max-depth=2 {{ $labels.mountpoint }} 2>/dev/null | sort -h | tail`
            on {{ $labels.host }} finds what grows.
      # A filesystem this host exports over NFS (what roles/nfs publishes): slower
      # well before it is full (fragmented free space, the slow inner tracks of disks),
      # and every node's jobs read from it, so it warns at 80%. Once per filesystem, however
      # many exports it holds.
      - alert: NfsExportFilling
        expr: |
          node_filesystem_avail_bytes / node_filesystem_size_bytes < 0.20
          and node_filesystem_readonly == 0
          and on (instance, mountpoint) nfs_export_info
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.mountpoint }} on {{ $labels.host }}, exported over NFS, is over 80% full"
          description: "{{ $value | humanizePercentage }} free. Ask the largest users to clean up before it slows every job."
      # An NFS share of fstab still unmounted after the client's retry timer has tried for
      # 15 minutes (roles/nfs_client, nfs-client-retry): its server is down or does not
      # serve the export. NHC keeps the node out of Slurm meanwhile.
      - alert: NfsMountMissing
        expr: nfs_client_mount_missing == 1
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.mountpoint }} is not mounted on {{ $labels.host }}"
          description: "Retried every minute for 15 minutes. Check its NFS server; journalctl -u nfs-client-retry on the node shows each attempt."
      - alert: HostInodesAlmostExhausted
        expr: |
          node_filesystem_files_free{fstype!~"tmpfs|overlay|squashfs|ramfs|nfs.*|fuse.*"}
            / node_filesystem_files < 0.05
          and node_filesystem_readonly == 0
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.mountpoint }} on {{ $labels.host }} has under 5% inodes left"
          description: >-
            Many small files: `du --inodes -x --max-depth=2 {{ $labels.mountpoint }}
            2>/dev/null | sort -n | tail` on {{ $labels.host }} finds where.
      - alert: HostMemoryExhausted
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.03
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.host }} has under 3% memory available"
          description: >-
            The kernel's OOM killer is next. `ps -eo pid,user,rss,comm --sort=-rss |
            head` on {{ $labels.host }} shows who holds the memory; work on a login node
            belongs in a Slurm job.
      - alert: HostClockNotSynchronised
        expr: min_over_time(node_timex_sync_status[5m]) == 0 and node_timex_maxerror_seconds >= 16
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Clock on {{ $labels.host }} is not synchronised"
          description: "Munge and Slurm reject credentials when clocks drift apart."
      - alert: HostSystemdUnitFailed
        expr: node_systemd_unit_state{state="failed"} == 1
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.name }} failed on {{ $labels.host }}"
          description: >-
            `systemctl status {{ $labels.name }}` and `journalctl -b -u {{ $labels.name
            }}` on {{ $labels.host }} say why; once fixed, `systemctl reset-failed {{
            $labels.name }}` clears the alert. A user@<uid>.service is that person's own
            systemd manager.
      # PID 1 can hang (e.g. after a daemon-reexec) while running daemons keep working, so
      # nothing else notices; the systemd collector is then the first thing to fail.
      - alert: HostSystemdUnresponsive
        expr: node_scrape_collector_success{collector="systemd"} == 0
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "systemd on {{ $labels.host }} is not answering"
          description: "node-exporter cannot read unit states from systemd (PID 1), so units cannot be started or stopped and failed-unit alerts are blind. Drain the node and reboot it."
      - alert: HostMemoryUncorrectableErrors
        expr: increase(node_edac_uncorrectable_errors_total[1h]) > 0
        labels: {severity: critical}
        annotations:
          summary: "Uncorrectable ECC memory error on {{ $labels.host }}"
          description: "Drain the node and replace the DIMM on controller {{ $labels.controller }}."
      - alert: HostMemoryCorrectableErrorsHigh
        expr: increase(node_edac_correctable_errors_total[24h]) > 100
        labels: {severity: warning}
        annotations:
          summary: "Many correctable ECC memory errors on {{ $labels.host }}"
          description: "{{ $value }} in 24h on controller {{ $labels.controller }}; the DIMM is likely failing."
      - alert: HostRaidDegraded
        expr: node_md_disks_required - ignoring(state) node_md_disks{state="active"} > 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "RAID {{ $labels.device }} on {{ $labels.host }} is degraded"
          description: >-
            `cat /proc/mdstat` and `mdadm --detail /dev/{{ $labels.device }}` on {{
            $labels.host }} show the missing member: replace that disk and add it back
            before a second one fails.
      - alert: HostRaidDiskFailed
        expr: node_md_disks{state="failed"} > 0
        labels: {severity: critical}
        annotations:
          summary: "A disk in RAID {{ $labels.device }} on {{ $labels.host }} has failed"
          description: >-
            `mdadm --detail /dev/{{ $labels.device }}` on {{ $labels.host }} names the
            failed disk: check it with `smartctl -a`, replace it and add the new one
            (`mdadm --add`).
      - alert: HostNetworkErrors
        expr: |
          rate(node_network_receive_errs_total{device!~"lo|veth.*|docker.*|br-.*"}[5m])
            + rate(node_network_transmit_errs_total{device!~"lo|veth.*|docker.*|br-.*"}[5m]) > 1
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "Network errors on {{ $labels.device }} of {{ $labels.host }}"
          description: >-
            `ip -s link show {{ $labels.device }}` and `ethtool -S {{ $labels.device }}`
            on {{ $labels.host }} show which counters grow; a cable, transceiver or
            switch port is the usual cause.
