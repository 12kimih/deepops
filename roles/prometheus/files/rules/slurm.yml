---
# Slurm GPU allocation (roles/slurm_metrics) against what the GPUs report (DCGM).
groups:
  - name: slurm
    rules:
      # Slurm numbers a node's GPUs by device file (/dev/nvidiaN, gres.conf File=), so its
      # GPU index is the device minor number. DCGM's gpu label, and the device label
      # dcgm-exporter derives from it, is the NVML index in PCI order, which need not be
      # the same. The minor number DCGM reports joins the two: one series per GPU,
      # value 1, labelled with the device Slurm means. PromQL cannot turn a value into a
      # label, hence one term per possible minor number (16 GPUs a node at most).
      - record: host_gpu:dcgm_slurm_device:info
        expr: |
          (label_replace(max by (host, gpu) (DCGM_FI_DEV_GPU_MINOR_NUMBER) == 0, "device", "nvidia0", "", "")
          or label_replace(max by (host, gpu) (DCGM_FI_DEV_GPU_MINOR_NUMBER) == 1, "device", "nvidia1", "", "")
          or label_replace(max by (host, gpu) (DCGM_FI_DEV_GPU_MINOR_NUMBER) == 2, "device", "nvidia2", "", "")
          or label_replace(max by (host, gpu) (DCGM_FI_DEV_GPU_MINOR_NUMBER) == 3, "device", "nvidia3", "", "")
          or label_replace(max by (host, gpu) (DCGM_FI_DEV_GPU_MINOR_NUMBER) == 4, "device", "nvidia4", "", "")
          or label_replace(max by (host, gpu) (DCGM_FI_DEV_GPU_MINOR_NUMBER) == 5, "device", "nvidia5", "", "")
          or label_replace(max by (host, gpu) (DCGM_FI_DEV_GPU_MINOR_NUMBER) == 6, "device", "nvidia6", "", "")
          or label_replace(max by (host, gpu) (DCGM_FI_DEV_GPU_MINOR_NUMBER) == 7, "device", "nvidia7", "", "")
          or label_replace(max by (host, gpu) (DCGM_FI_DEV_GPU_MINOR_NUMBER) == 8, "device", "nvidia8", "", "")
          or label_replace(max by (host, gpu) (DCGM_FI_DEV_GPU_MINOR_NUMBER) == 9, "device", "nvidia9", "", "")
          or label_replace(max by (host, gpu) (DCGM_FI_DEV_GPU_MINOR_NUMBER) == 10, "device", "nvidia10", "", "")
          or label_replace(max by (host, gpu) (DCGM_FI_DEV_GPU_MINOR_NUMBER) == 11, "device", "nvidia11", "", "")
          or label_replace(max by (host, gpu) (DCGM_FI_DEV_GPU_MINOR_NUMBER) == 12, "device", "nvidia12", "", "")
          or label_replace(max by (host, gpu) (DCGM_FI_DEV_GPU_MINOR_NUMBER) == 13, "device", "nvidia13", "", "")
          or label_replace(max by (host, gpu) (DCGM_FI_DEV_GPU_MINOR_NUMBER) == 14, "device", "nvidia14", "", "")
          or label_replace(max by (host, gpu) (DCGM_FI_DEV_GPU_MINOR_NUMBER) == 15, "device", "nvidia15", "", "")) * 0 + 1
      # GPU utilisation and memory keyed by the device Slurm means: what the alerts, the
      # allocation dashboard and the usage report compare with allocation.
      - record: host_device:dcgm_gpu_util_ratio:max
        expr: |
          max by (host, gpu) (DCGM_FI_DEV_GPU_UTIL_RATIO)
          * on (host, gpu) group_left (device) host_gpu:dcgm_slurm_device:info
      - record: host_device:dcgm_fb_used_bytes:max
        expr: |
          max by (host, gpu) (DCGM_FI_DEV_FB_USED_BYTES)
          * on (host, gpu) group_left (device) host_gpu:dcgm_slurm_device:info
      # Allocation keyed the same way: host is the Slurm node name, device nvidia<IDX>.
      # One definition for the alerts and the Slurm / GPU allocation dashboard.
      - record: host_device:slurm_gpu_allocated:max
        expr: |
          label_replace(
            label_replace(
              max by (node, gpu, gpu_type, user, account, partition, job_id) (slurm_gpu_allocated),
              "host", "$1", "node", "(.*)"),
            "device", "nvidia$1", "gpu", "(.*)")
      # Each GPU a job holds with what it used, labelled with the job (job_id, user,
      # account, partition): per-job GPU usage, kept for the retention period.
      - record: job_device:dcgm_gpu_util_ratio:max
        expr: |
          host_device:slurm_gpu_allocated:max
          * on (host, device) group_left () host_device:dcgm_gpu_util_ratio:max
      - record: job_device:dcgm_fb_used_bytes:max
        expr: |
          host_device:slurm_gpu_allocated:max
          * on (host, device) group_left () host_device:dcgm_fb_used_bytes:max
      # Only while the allocation data is fresh, so a stale file never pages, and never
      # on a drained node: maintenance (a DCGM diagnostic, a burn-in) uses its GPUs
      # outside Slurm on purpose.
      - alert: GpuBusyWithoutJob
        expr: |
          host_device:dcgm_gpu_util_ratio:max > 0
          unless on (host, device) host_device:slurm_gpu_allocated:max
          unless on (host) label_replace(max by (node) (slurm_node_drain) == 1, "host", "$1", "node", "(.*)")
          and on () (time() - max(slurm_metrics_updated_timestamp_seconds) < 300)
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "GPU {{ $labels.device }} on {{ $labels.host }} is {{ $value | humanizePercentage }} busy with no Slurm job holding it"
          description: >-
            A process outside Slurm, or one left behind by a finished job. As root on the
            host, `fuser -v /dev/nvidia*` finds it; a GPU reset or reboot clears a hung one.
      # The textfile error counts only on the host that writes the allocation data.
      - alert: SlurmGpuMetricsStale
        expr: |
          time() - slurm_metrics_updated_timestamp_seconds > 300
          or (node_textfile_scrape_error > 0 and on (instance) slurm_metrics_updated_timestamp_seconds)
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Slurm GPU allocation data on {{ $labels.host }} is stale or unreadable"
          description: >-
            `systemctl status slurm-gpu-metrics` and `journalctl -u slurm-gpu-metrics` on
            the host say why; GpuBusyWithoutJob is off meanwhile.
      # No timestamp at all on a host with the unit installed (never ran, or every run
      # failed since it was installed or since a boot emptied the textfile directory):
      # the alert above has nothing to compare, so the unit's presence stands in.
      - alert: SlurmGpuMetricsNeverReported
        expr: |
          count by (instance, host) (node_systemd_unit_state{name="slurm-gpu-metrics.service"})
          unless on (instance) slurm_metrics_updated_timestamp_seconds
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.host }} has written no Slurm GPU allocation data for 5 minutes"
          description: "`systemctl status slurm-gpu-metrics` and `journalctl -u slurm-gpu-metrics` on the host; GpuBusyWithoutJob is off meanwhile."
      # The join above needs the DCGM fields of roles/nvidia-dcgm-exporter's metrics file.
      # A GPU node still running an older file reports utilisation without them, which
      # silently turns GpuBusyWithoutJob and the allocation dashboard's utilisation off.
      - alert: DcgmFieldsMissing
        expr: |
          count by (host) (DCGM_FI_DEV_GPU_UTIL_RATIO)
          unless on (host) count by (host) (host_gpu:dcgm_slurm_device:info)
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "DCGM on {{ $labels.host }} does not export the fields the Slurm GPU join needs"
          description: >-
            Its metrics file lacks DCGM_FI_DEV_GPU_MINOR_NUMBER. `ansible-playbook -K -l {{ $labels.host }}
            playbooks/slurm-cluster/nvidia-dcgm-exporter.yml` installs the current one.
