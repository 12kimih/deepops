---
# Operating system updates (roles/os_updates textfile metrics). Unattended upgrades
# apply security fixes daily but hold back the kernel, libc, systemd, GPU and scheduler
# stacks; those land with the rolling maintenance upgrade,
# playbooks/utilities/apt-upgrade.yml.
groups:
  - name: os-updates
    rules:
      - alert: OsSecurityUpdatesPending
        expr: |
          os_updates_security_pending_since_seconds > 0
          and time() - os_updates_security_pending_since_seconds > 14 * 86400
          and on (instance) os_updates_apt_ok == 1
        labels: {severity: warning}
        annotations:
          summary: "Security updates have waited on {{ $labels.host }} for over 14 days"
          description: >-
            Held-back packages need the rolling upgrade:
            `ansible-playbook -K playbooks/utilities/apt-upgrade.yml -e hostlist={{ $labels.host }}`.
      - alert: OsRebootPending
        expr: |
          time() - os_updates_reboot_required_since_seconds > 14 * 86400
          and on (instance) os_updates_reboot_required == 1
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.host }} has waited over 14 days for a reboot an update asked for"
          description: >-
            The update is not in effect until then:
            `ansible-playbook -K playbooks/utilities/apt-upgrade.yml -e hostlist={{ $labels.host }}`
            drains the node, reboots it and puts it back.
      - alert: OsUpdatesMetricsStale
        expr: time() - os_updates_metrics_timestamp_seconds > 3 * 86400
        labels: {severity: warning}
        annotations:
          summary: "Update status from {{ $labels.host }} is over 3 days old"
          description: "The os-updates metrics timer stopped: `systemctl status os-updates-metrics.timer` on the host."
      # No timestamp at all on a host with the unit installed (never ran, or every run
      # failed since it was installed or since a boot emptied the textfile directory):
      # the alert above has nothing to compare, so the unit's presence stands in.
      - alert: OsUpdatesMetricsNeverReported
        expr: |
          count by (instance, host) (node_systemd_unit_state{name="os-updates-metrics.service"})
          unless on (instance) os_updates_metrics_timestamp_seconds
        for: 3d
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.host }} has reported no update status for 3 days"
          description: "`systemctl status os-updates-metrics.timer` and `journalctl -u os-updates-metrics` on the host."
      # Either one leaves the counts above meaningless and blocks every update.
      - alert: OsDpkgBroken
        expr: os_updates_dpkg_problems > 0
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: "dpkg on {{ $labels.host }} has {{ $value }} half-installed packages and refuses every package change"
          description: >-
            Security updates included. `dpkg --configure -a` on the host repairs it; the
            maintenance role's apt health step runs it.
      - alert: OsAptBroken
        expr: os_updates_apt_ok == 0
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: "apt on {{ $labels.host }} cannot plan an upgrade, so its pending-update counts mean nothing"
          description: "`apt-get -s dist-upgrade` on the host shows why (broken sources, held or conflicting packages)."
      # Hosts drift apart between maintenance windows: an update one node took and
      # another held back, a package or kernel changed by hand, a component's playbook
      # run on some of its hosts only. Unattended upgrades land on each node at its own
      # time, so a difference counts once it outlasts a day. (roles/maintenance
      # consistency.yml is the same comparison, run on demand.) A package no apt source
      # offers (source="local": a .deb installed from a URL) is levelled by the component
      # that installs it (the hosts' component records name it; components.yml its
      # playbook), not by an upgrade. A package whose component's recorded versions
      # differ is that component's alert, below: one cause, one alert.
      - alert: OsPackageVersionsDiffer
        expr: |
          count by (package, source) (count by (package, version, source) (os_updates_package_info)) > 1
          unless on (package) max by (package) (
            os_updates_package_component_info
            * on (component) group_left ()
            (count by (component) (count by (component, version) (os_updates_component_info{version!=""})) > 1)
          )
        for: 26h
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.package }} is installed at {{ $value }} different versions across the hosts"
          description: >-
            {{ range printf "max by (host, version) (os_updates_package_info{package=%q})" $labels.package | query | sortByLabel "host" }}
            {{- .Labels.host }}: {{ .Labels.version }}; {{ end -}}
            {{ if eq $labels.source "local" }}No apt source offers it, so an upgrade cannot change it:
            {{ range printf "max by (component, playbook) (deepops:component_playbook:info and on (component) os_updates_package_component_info{package=%q})" $labels.package | query }}
            {{- .Labels.component }} installs it, and `ansible-playbook -K {{ .Labels.playbook }}` brings its hosts level.{{ else -}}
            no host's component record names what installed it (a .deb installed by hand?).{{ end }}
            {{- else }}`ansible-playbook -K playbooks/utilities/apt-upgrade.yml` brings them level.{{ end }}
      # A component's playbook run on some of its hosts (a --limit) leaves the others at
      # the version they had; their component records say so.
      - alert: ComponentVersionsDiffer
        expr: count by (component) (count by (component, version) (os_updates_component_info{version!=""})) > 1
        for: 26h
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.component }} is at {{ $value }} different versions across the hosts"
          description: >-
            {{ range printf "max by (host, version) (os_updates_component_info{component=%q})" $labels.component | query | sortByLabel "host" }}
            {{- .Labels.host }}: {{ .Labels.version }}; {{ end -}}
            A run limited to some of its hosts left the others behind:
            {{ range printf "deepops:component_playbook:info{component=%q}" $labels.component | query }}
            {{- "" }}`ansible-playbook -K {{ .Labels.playbook }}`{{ end }} converges every host it belongs on
            (one already there changes nothing).
      - alert: OsKernelsDiffer
        expr: count(count by (release) (max by (host, release) (node_uname_info))) > 1
        for: 26h
        labels: {severity: warning}
        annotations:
          summary: "The hosts run {{ $value }} different kernels"
          description: >-
            {{ range query "max by (host, release) (node_uname_info)" | sortByLabel "host" }}
            {{- .Labels.host }}: {{ .Labels.release }}; {{ end }}
            A node left out of the last maintenance reboot runs the old one.
            `ansible-playbook -K playbooks/utilities/apt-upgrade.yml` reboots each into the installed kernel.
