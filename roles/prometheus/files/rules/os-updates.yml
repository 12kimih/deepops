---
# Operating system updates (roles/os_updates textfile metrics). Unattended upgrades
# apply security fixes daily but hold back the kernel, libc, systemd, GPU and scheduler
# stacks; those land with the rolling maintenance upgrade,
# playbooks/utilities/apt-upgrade.yml.
groups:
  - name: os-updates
    rules:
      - alert: OsSecurityUpdatesPending
        expr: |
          os_updates_security_pending_since_seconds > 0
          and time() - os_updates_security_pending_since_seconds > 14 * 86400
          and on (instance) os_updates_apt_ok == 1
        labels: {severity: warning}
        annotations:
          summary: "Security updates have waited on {{ $labels.host }} for over 14 days"
          description: >-
            Held-back packages need the rolling upgrade:
            `ansible-playbook -K playbooks/utilities/apt-upgrade.yml -e hostlist={{ $labels.host }}`.
      - alert: OsRebootPending
        expr: |
          time() - os_updates_reboot_required_since_seconds > 14 * 86400
          and on (instance) os_updates_reboot_required == 1
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.host }} has waited over 14 days for a reboot an update asked for"
          description: >-
            The update is not in effect until then:
            `ansible-playbook -K playbooks/utilities/apt-upgrade.yml -e hostlist={{ $labels.host }}`
            drains the node, reboots it and puts it back.
      - alert: OsUpdatesMetricsStale
        expr: time() - os_updates_metrics_timestamp_seconds > 3 * 86400
        labels: {severity: warning}
        annotations:
          summary: "Update status from {{ $labels.host }} is over 3 days old"
          description: "The os-updates metrics timer stopped: `systemctl status os-updates-metrics.timer` on the host."
      # Either one leaves the counts above meaningless and blocks every update.
      - alert: OsDpkgBroken
        expr: os_updates_dpkg_problems > 0
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: "dpkg on {{ $labels.host }} has {{ $value }} half-installed packages and refuses every package change"
          description: >-
            Security updates included. `dpkg --configure -a` on the host repairs it; the
            maintenance role's apt health step runs it.
      - alert: OsAptBroken
        expr: os_updates_apt_ok == 0
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: "apt on {{ $labels.host }} cannot plan an upgrade, so its pending-update counts mean nothing"
          description: "`apt-get -s dist-upgrade` on the host shows why (broken sources, held or conflicting packages)."
      # Hosts drift apart between maintenance windows: an update one node took and
      # another held back, a package or kernel changed by hand. Unattended upgrades land
      # on each node at its own time, so a difference counts once it outlasts a day.
      # (roles/maintenance consistency.yml is the same comparison, run on demand.)
      - alert: OsPackageVersionsDiffer
        expr: count by (package) (count by (package, version) (os_updates_package_info)) > 1
        for: 26h
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.package }} is installed at {{ $value }} different versions across the hosts"
          description: >-
            `count by (version, host) (os_updates_package_info{package="{{ $labels.package }}"})`
            shows which host has which; `ansible-playbook -K playbooks/utilities/apt-upgrade.yml`
            brings them level.
      - alert: OsKernelsDiffer
        expr: count(count by (release) (max by (host, release) (node_uname_info))) > 1
        for: 26h
        labels: {severity: warning}
        annotations:
          summary: "The hosts run {{ $value }} different kernels"
          description: >-
            {{ range query "max by (host, release) (node_uname_info)" | sortByLabel "host" }}
            {{- .Labels.host }}: {{ .Labels.release }}; {{ end }}
            A node left out of the last maintenance reboot runs the old one.
            `ansible-playbook -K playbooks/utilities/apt-upgrade.yml` reboots each into the installed kernel.
