---
groups:
  - name: gpu
    rules:
      # XID 13, 31, 43 and 45 are raised by faulty user programs, not hardware. The
      # exporter counts each XID over its window (DCGM_EXP_XID_ERRORS_COUNT, label xid, 5
      # minutes), so a repeat of the same XID counts too.
      - alert: GpuXidError
        expr: max by (host, instance, gpu, xid) (DCGM_EXP_XID_ERRORS_COUNT{xid!~"13|31|43|45"}) > 0
        labels: {severity: warning}
        annotations:
          summary: "XID {{ $labels.xid }} on {{ $labels.host }} GPU {{ $labels.gpu }}"
          description: "XID 48/63/64/74/79/92/94/95 usually need a drain and reset; see the NVIDIA XID catalogue."
      - alert: GpuFallenOffBus
        # The last XID the GPU raised, held until the exporter restarts: a GPU off the bus
        # stays reported while it is.
        expr: DCGM_FI_DEV_XID_ERROR == 79
        labels: {severity: critical}
        annotations:
          summary: "GPU {{ $labels.gpu }} on {{ $labels.host }} fell off the bus (XID 79)"
      # Counted against the most the host reported in 7 days, while its exporter answers
      # (a dead exporter is ExporterDown's), so a host whose GPUs all vanish counts too.
      - alert: GpuMissing
        expr: |
          (
            max_over_time(count by (instance, host) (DCGM_FI_DEV_GPU_TEMP_CELSIUS)[7d:30m])
            - (count by (instance, host) (DCGM_FI_DEV_GPU_TEMP_CELSIUS)
               or 0 * max_over_time(count by (instance, host) (DCGM_FI_DEV_GPU_TEMP_CELSIUS)[7d:30m]))
          ) > 0
          and on (instance) up == 1
        for: 10m
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.host }} reports {{ $value }} fewer GPUs than it did in the last 7 days"
      - alert: GpuRowRemapFailure
        expr: DCGM_FI_DEV_ROW_REMAP_FAILED > 0
        labels: {severity: critical}
        annotations:
          summary: "Row remapping failed on {{ $labels.host }} GPU {{ $labels.gpu }}"
          description: "The GPU has run out of spare rows; RMA it."
      - alert: GpuUncorrectableRemappedRows
        expr: increase(DCGM_FI_DEV_ROW_REMAP_UNCORRECTABLE_TOTAL[1h]) > 0
        labels: {severity: warning}
        annotations:
          summary: "New uncorrectable remapped rows on {{ $labels.host }} GPU {{ $labels.gpu }}"
          description: "Reset the GPU (drain the node first) so the remap takes effect."
      # Thresholds come from each GPU's own limits; the fixed values apply only to
      # GPUs that do not report them.
      - alert: GpuTemperatureHigh
        expr: |
          DCGM_FI_DEV_GPU_TEMP_CELSIUS > on (instance, gpu) group_left () (DCGM_FI_DEV_GPU_TEMP_SLOWDOWN_CELSIUS - 5)
          or (DCGM_FI_DEV_GPU_TEMP_CELSIUS > 85 unless on (instance, gpu) DCGM_FI_DEV_GPU_TEMP_SLOWDOWN_CELSIUS > 0)
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "GPU {{ $labels.gpu }} on {{ $labels.host }} at {{ $value }}C, near its slowdown temperature"
      - alert: GpuMemoryTemperatureHigh
        expr: |
          DCGM_FI_DEV_MEMORY_TEMP_CELSIUS > on (instance, gpu) group_left () (DCGM_FI_DEV_MEMORY_MAX_OP_TEMP_CELSIUS - 5)
          or (DCGM_FI_DEV_MEMORY_TEMP_CELSIUS > 90 unless on (instance, gpu) DCGM_FI_DEV_MEMORY_MAX_OP_TEMP_CELSIUS > 0)
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "GPU {{ $labels.gpu }} memory on {{ $labels.host }} at {{ $value }}C, near its limit"
      # The exporter counts clock events per reason over its window (label clock_event).
      # Hardware slowdown, hardware thermal and power brake mean cooling or power trouble;
      # power capping under load is normal and ignored.
      - alert: GpuHardwareSlowdown
        expr: |
          max by (host, instance, gpu, clock_event) (
            DCGM_EXP_CLOCK_EVENTS_COUNT{clock_event=~"hw_slowdown|hw_thermal|hw_power_brake"}
          ) > 0
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "GPU {{ $labels.gpu }} on {{ $labels.host }} is held down by {{ $labels.clock_event }}"
          description: "Thermal or power-brake slowdown; check cooling, fans and power supplies."
      - alert: GpuPcieReplaysHigh
        expr: increase(DCGM_FI_DEV_PCIE_REPLAY_TOTAL[1h]) > 1000
        labels: {severity: warning}
        annotations:
          summary: "PCIe replays on {{ $labels.host }} GPU {{ $labels.gpu }}"
          description: "{{ $value }} in 1h; check the riser, slot or cabling."
