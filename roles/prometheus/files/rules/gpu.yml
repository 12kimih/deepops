---
groups:
  - name: gpu
    rules:
      # XID 13, 31, 43 and 45 are raised by faulty user programs, not hardware. The
      # exporter counts each XID over its window (DCGM_EXP_XID_ERRORS_COUNT, label xid, 5
      # minutes), so a repeat of the same XID counts too.
      - alert: GpuXidError
        expr: max by (host, instance, gpu, xid) (DCGM_EXP_XID_ERRORS_COUNT{xid!~"13|31|43|45"}) > 0
        labels: {severity: warning}
        annotations:
          summary: "XID {{ $labels.xid }} on {{ $labels.host }} GPU {{ $labels.gpu }}"
          description: "What it needs is in the action column of NVIDIA's XID catalog (docs.nvidia.com/deploy/xid-errors); NHC drains the node itself on the XIDs that need a GPU reset or a reboot (nhc_gpu_drain_xids) and on an Xid 154 asking for one."
      - alert: GpuFallenOffBus
        # The last XID the GPU raised, held until the exporter restarts: a GPU off the bus
        # stays reported while it is.
        expr: DCGM_FI_DEV_XID_ERROR == 79
        labels: {severity: critical}
        annotations:
          summary: "GPU {{ $labels.gpu }} on {{ $labels.host }} fell off the bus (XID 79)"
          description: >-
            The GPU is gone until the node is power-cycled; NHC drains the node on XID
            79. Once its jobs end, power-cycle it through its BMC
            (playbooks/utilities/power.yml); a GPU still missing after that is hardware
            (the GPU, its riser or PCIe switch).
      # Counted against the most the host reported in 7 days, while its exporter answers
      # (a dead exporter is ExporterDown's), so a host whose GPUs all vanish counts too.
      - alert: GpuMissing
        expr: |
          (
            max_over_time(count by (instance, host) (DCGM_FI_DEV_GPU_TEMP_CELSIUS)[7d:30m])
            - (count by (instance, host) (DCGM_FI_DEV_GPU_TEMP_CELSIUS)
               or 0 * max_over_time(count by (instance, host) (DCGM_FI_DEV_GPU_TEMP_CELSIUS)[7d:30m]))
          ) > 0
          and on (instance) up == 1
        for: 10m
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.host }} reports {{ $value }} fewer GPUs than it did in the last 7 days"
          description: >-
            `lspci -d 10de:` on {{ $labels.host }} counts the GPUs the bus sees: all of
            them means the driver lost some (see `journalctl -k | grep -E 'NVRM|Xid'`),
            fewer means hardware. Drain the node, then power-cycle it through its BMC
            (playbooks/utilities/power.yml).
      - alert: GpuRowRemapFailure
        expr: DCGM_FI_DEV_ROW_REMAP_FAILED > 0
        labels: {severity: critical}
        annotations:
          summary: "Row remapping failed on {{ $labels.host }} GPU {{ $labels.gpu }}"
          description: "The GPU has run out of spare rows; RMA it."
      - alert: GpuUncorrectableRemappedRows
        expr: increase(DCGM_FI_DEV_ROW_REMAP_UNCORRECTABLE_TOTAL[1h]) > 0
        labels: {severity: warning}
        annotations:
          summary: "New uncorrectable remapped rows on {{ $labels.host }} GPU {{ $labels.gpu }}"
          description: "Reset the GPU (drain the node first) so the remap takes effect."
      # Thresholds come from each GPU's own limits; the fixed values apply only to
      # GPUs that do not report them.
      - alert: GpuTemperatureHigh
        expr: |
          DCGM_FI_DEV_GPU_TEMP_CELSIUS > on (instance, gpu) group_left () (DCGM_FI_DEV_GPU_TEMP_SLOWDOWN_CELSIUS - 5)
          or (DCGM_FI_DEV_GPU_TEMP_CELSIUS > 85 unless on (instance, gpu) DCGM_FI_DEV_GPU_TEMP_SLOWDOWN_CELSIUS > 0)
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "GPU {{ $labels.gpu }} on {{ $labels.host }} at {{ $value }}C, near its slowdown temperature"
          description: >-
            Near its slowdown temperature the GPU throttles. Check the node's fans and
            inlet air (`ipmitool sdr type Temperature` on {{ $labels.host }}, the
            BmcSensor alerts) and whether its neighbours run hot too (the room's
            cooling).
      - alert: GpuMemoryTemperatureHigh
        expr: |
          DCGM_FI_DEV_MEMORY_TEMP_CELSIUS > on (instance, gpu) group_left () (DCGM_FI_DEV_MEMORY_MAX_OP_TEMP_CELSIUS - 5)
          or (DCGM_FI_DEV_MEMORY_TEMP_CELSIUS > 90 unless on (instance, gpu) DCGM_FI_DEV_MEMORY_MAX_OP_TEMP_CELSIUS > 0)
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "GPU {{ $labels.gpu }} memory on {{ $labels.host }} at {{ $value }}C, near its limit"
          description: >-
            Memory near its limit throttles and raises ECC errors. Check the node's fans
            and inlet air (`ipmitool sdr type Temperature` on {{ $labels.host }}) as for
            a hot GPU.
      # The exporter counts clock events per reason over its window (label clock_event).
      # Hardware slowdown, hardware thermal and power brake mean cooling or power trouble;
      # power capping under load is normal and ignored.
      - alert: GpuHardwareSlowdown
        expr: |
          max by (host, instance, gpu, clock_event) (
            DCGM_EXP_CLOCK_EVENTS_COUNT{clock_event=~"hw_slowdown|hw_thermal|hw_power_brake"}
          ) > 0
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "GPU {{ $labels.gpu }} on {{ $labels.host }} is held down by {{ $labels.clock_event }}"
          description: "Thermal or power-brake slowdown; check cooling, fans and power supplies."
      - alert: GpuPcieReplaysHigh
        expr: increase(DCGM_FI_DEV_PCIE_REPLAY_TOTAL[1h]) > 1000
        labels: {severity: warning}
        annotations:
          summary: "PCIe replays on {{ $labels.host }} GPU {{ $labels.gpu }}"
          description: "{{ $value }} in 1h; check the riser, slot or cabling."
      # The weekly DCGM diagnostics on idle GPU nodes (roles/gpu_diag_idle). A failure is
      # confirmed by a rerun before it counts; with gpu_diag_idle_drain_on_failure the node
      # is drained with the reason "gpu-diag: <tests>", which only an administrator lifts.
      - alert: GpuDiagFailed
        expr: gpu_diag_idle_result{result="fail"} == 1
        labels: {severity: critical}
        annotations:
          summary: "DCGM diagnostics failed twice on {{ $labels.node }}: {{ $labels.tests }}"
          description: >-
            {{ if eq $labels.drained "yes" }}The node is drained. {{ end }}The raw result is
            /var/lib/gpu-diag-idle/raw/{{ $labels.node }}.json on {{ $labels.host }}. Run the
            diagnostics again (playbooks/utilities/gpu-diag.yml -e hostlist={{ $labels.node }});
            once they pass, `scontrol update nodename={{ $labels.node }} state=resume`.
      - alert: GpuDiagFlaky
        expr: gpu_diag_idle_result{result="flaky"} == 1
        labels: {severity: warning}
        annotations:
          summary: "DCGM diagnostics on {{ $labels.node }} failed ({{ $labels.tests }}), then passed on the rerun"
          description: >-
            The node stays in service. A repeat next week points at the hardware: the raw
            result is /var/lib/gpu-diag-idle/raw/{{ $labels.node }}.json on {{ $labels.host }}.
      - alert: GpuDiagError
        expr: gpu_diag_idle_result{result="error"} == 1
        labels: {severity: warning}
        annotations:
          summary: "The weekly DCGM diagnostics could not run on {{ $labels.node }}"
          description: >-
            A problem of the tool (the host engine, a timeout, output it cannot read), not a
            GPU verdict, so the node was not drained: `journalctl -u gpu-diag-idle` on
            {{ $labels.host }}.
      # A GPU node no pass found idle for four weeks, counted once the diagnostics have run
      # that long: from the first pass, not from the deploy.
      - alert: GpuDiagOverdue
        expr: |
          (
            max by (node) (slurm_gpu_configured)
            unless on (node) (time() - gpu_diag_idle_node_last_success_timestamp_seconds < 28 * 86400)
          )
          and on () (gpu_diag_idle_since_seconds > 0
                     and time() - gpu_diag_idle_since_seconds > 28 * 86400)
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.node }}'s GPUs have not been diagnosed for four weeks"
          description: >-
            No weekly pass found it idle. Run the diagnostics in a quiet hour
            (playbooks/utilities/gpu-diag.yml -e hostlist={{ $labels.node }} drains it first).
      - alert: GpuDiagNotRunning
        expr: gpu_diag_idle_last_success_timestamp_seconds > 0 and time() - gpu_diag_idle_last_success_timestamp_seconds > 8 * 86400
        labels: {severity: warning}
        annotations:
          summary: "The weekly DCGM diagnostics have not run for 8 days on {{ $labels.host }}"
          description: "`systemctl list-timers gpu-diag-idle*` and `journalctl -u gpu-diag-idle` on {{ $labels.host }}."
