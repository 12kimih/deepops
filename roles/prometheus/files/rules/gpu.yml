---
groups:
  - name: gpu
    rules:
      # XID 13, 31, 43 and 45 are raised by faulty user programs, not hardware.
      - alert: GpuXidError
        expr: |
          DCGM_FI_DEV_XID_ERRORS > 0 and changes(DCGM_FI_DEV_XID_ERRORS[10m]) > 0
          unless (DCGM_FI_DEV_XID_ERRORS == 13 or DCGM_FI_DEV_XID_ERRORS == 31
                  or DCGM_FI_DEV_XID_ERRORS == 43 or DCGM_FI_DEV_XID_ERRORS == 45)
        labels: {severity: warning}
        annotations:
          summary: "XID {{ $value }} on {{ $labels.host }} GPU {{ $labels.gpu }}"
          description: "XID 48/63/64/74/79/92/94/95 usually need a drain and reset; see the NVIDIA XID catalogue."
      - alert: GpuFallenOffBus
        expr: DCGM_FI_DEV_XID_ERRORS == 79
        labels: {severity: critical}
        annotations:
          summary: "GPU {{ $labels.gpu }} on {{ $labels.host }} fell off the bus (XID 79)"
      - alert: GpuMissing
        expr: count by (instance, host) (DCGM_FI_DEV_GPU_TEMP) < on (instance) group_left max_over_time(count by (instance) (DCGM_FI_DEV_GPU_TEMP)[7d:30m])
        for: 10m
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.host }} reports fewer GPUs than it did in the last 7 days"
      - alert: GpuRowRemapFailure
        expr: DCGM_FI_DEV_ROW_REMAP_FAILURE > 0
        labels: {severity: critical}
        annotations:
          summary: "Row remapping failed on {{ $labels.host }} GPU {{ $labels.gpu }}"
          description: "The GPU has run out of spare rows; RMA it."
      - alert: GpuUncorrectableRemappedRows
        expr: increase(DCGM_FI_DEV_UNCORRECTABLE_REMAPPED_ROWS[1h]) > 0
        labels: {severity: warning}
        annotations:
          summary: "New uncorrectable remapped rows on {{ $labels.host }} GPU {{ $labels.gpu }}"
          description: "Reset the GPU (drain the node first) so the remap takes effect."
      # Thresholds come from each GPU's own limits; the fixed values apply only to
      # GPUs that do not report them.
      - alert: GpuTemperatureHigh
        expr: |
          DCGM_FI_DEV_GPU_TEMP > on (instance, gpu) group_left () (DCGM_FI_DEV_SLOWDOWN_TEMP - 5)
          or (DCGM_FI_DEV_GPU_TEMP > 85 unless on (instance, gpu) DCGM_FI_DEV_SLOWDOWN_TEMP > 0)
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "GPU {{ $labels.gpu }} on {{ $labels.host }} at {{ $value }}C, near its slowdown temperature"
      - alert: GpuMemoryTemperatureHigh
        expr: |
          DCGM_FI_DEV_MEMORY_TEMP > on (instance, gpu) group_left () (DCGM_FI_DEV_MEM_MAX_OP_TEMP - 5)
          or (DCGM_FI_DEV_MEMORY_TEMP > 90 unless on (instance, gpu) DCGM_FI_DEV_MEM_MAX_OP_TEMP > 0)
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "GPU {{ $labels.gpu }} memory on {{ $labels.host }} at {{ $value }}C, near its limit"
      # DCGM_FI_DEV_CLOCKS_EVENT_REASONS bits: 0x8 HW slowdown, 0x40 HW thermal,
      # 0x80 HW power brake. Power capping (0x4) under load is normal and ignored.
      - alert: GpuHardwareSlowdown
        expr: |
          floor(DCGM_FI_DEV_CLOCKS_EVENT_REASONS / 8) % 2 == 1
          or floor(DCGM_FI_DEV_CLOCKS_EVENT_REASONS / 64) % 2 == 1
          or floor(DCGM_FI_DEV_CLOCKS_EVENT_REASONS / 128) % 2 == 1
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "GPU {{ $labels.gpu }} on {{ $labels.host }} is held down by a hardware slowdown"
          description: "Thermal or power-brake slowdown; check cooling, fans and power supplies."
      - alert: GpuPcieReplaysHigh
        expr: increase(DCGM_FI_DEV_PCIE_REPLAY_COUNTER[1h]) > 1000
        labels: {severity: warning}
        annotations:
          summary: "PCIe replays on {{ $labels.host }} GPU {{ $labels.gpu }}"
          description: "{{ $value }} in 1h; check the riser, slot or cabling."
