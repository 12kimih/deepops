---
# Disk quotas (roles/disk_quota textfile metrics, cluster_tools.disk_quota). The disk
# itself is watched by the filesystem rules in host.yml; these say when the usage stopped
# being reported, and who (or which shared directory) is past its warn level: a level
# that only notifies (the kernel enforces the hard limit alone, at once).
groups:
  - name: disk-quota
    rules:
      - alert: DiskQuotaMetricsStale
        expr: time() - disk_quota_last_success_timestamp_seconds > 3600
        labels: {severity: warning}
        annotations:
          summary: "Disk quota usage on {{ $labels.host }} has not been reported for an hour"
          description: "`journalctl -u disk-quota` and `systemctl list-timers disk-quota.timer` on the host."
      # No timestamp at all on a host with the unit installed: the alert above has
      # nothing to compare, so the unit's presence stands in.
      - alert: DiskQuotaMetricsNeverReported
        expr: |
          count by (instance, host) (node_systemd_unit_state{name="disk-quota.service"})
          unless on (instance) disk_quota_last_success_timestamp_seconds
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.host }} has reported no disk quota usage for an hour"
          description: "`journalctl -u disk-quota` and `systemctl list-timers disk-quota.timer` on the host."
      - alert: DiskQuotaOverWarnLevel
        expr: |
          disk_quota_used_bytes
          > on (instance, filesystem, user) group_left disk_quota_limit_bytes{kind="warn"}
        for: 1h
        labels: {severity: info}
        annotations:
          summary: "{{ $labels.user }} is past their disk warn level on {{ $labels.host }}:{{ $labels.filesystem }}"
          description: >-
            Nothing is refused yet: only the hard limit stops writes (a limit announced
            for a later day, disk_quota_limit_from_timestamp_seconds, from that day).
            `quota -s {{ $labels.user }}` on the host shows it; the person frees space,
            or gets a larger disk_quota in people.yml.
      - alert: DiskQuotaProjectOverWarnLevel
        expr: |
          disk_quota_project_used_bytes
          > on (instance, filesystem, project) group_left disk_quota_project_limit_bytes{kind="warn"}
        for: 1h
        labels: {severity: info}
        annotations:
          summary: "{{ $labels.project }} on {{ $labels.host }} is past its warn level"
          description: >-
            Nothing is refused yet: only the hard limit stops writes. Free space there,
            or raise its block_hard in disk_quota_projects.
