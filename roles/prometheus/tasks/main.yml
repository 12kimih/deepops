---
- name: Check the component state
  ansible.builtin.assert:
    that: prometheus_state in ['present', 'absent', 'kept']
    fail_msg: "prometheus_state must be present, absent or kept, not {{ prometheus_state }}."
    quiet: true

- name: "Make prometheus {{ prometheus_state }}"
  ansible.builtin.include_tasks: "{{ prometheus_state }}.yml"
  when: prometheus_state != 'kept'
