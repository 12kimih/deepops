---
- name: Record what this component installs
  ansible.builtin.include_role:
    name: component_record
  vars:
    component_record_name: prometheus
    component_record_action: begin
    component_record_items: "{{ prometheus_items }}"

- name: Create config dirs
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ prometheus_config_dir }}"
    - "{{ prometheus_config_dir }}/rules"
    - "{{ prometheus_cfg_endpoint_dir }}"

- name: Collect alert rule sources
  ansible.builtin.set_fact:
    prometheus_rule_sources: "{{ lookup('ansible.builtin.fileglob', role_path ~ '/files/rules/*.yml', wantlist=True) + prometheus_extra_rule_files }}"

- name: Install python3 docker module
  ansible.builtin.package:
    name: python3-docker
    state: present

# promtool ships in the same image; pulling first lets it validate files below.
- name: Pull the image
  ansible.builtin.include_role:
    name: container_image
  vars:
    container_image: "{{ prometheus_container }}"

# promtool checks each rule file before it is installed; a rule file dropped from the
# sources is removed.
- name: Install alert rules
  ansible.builtin.include_role:
    name: managed_dir
  vars:
    managed_dir_path: "{{ prometheus_config_dir }}/rules"
    managed_dir_sources: "{{ prometheus_rule_sources }}"
    managed_dir_validate: "docker run --rm -u 0 --entrypoint promtool --mount type=bind,src=%s,dst=/check.yml,readonly {{ prometheus_container }} check rules /check.yml"
    managed_dir_notify: [Reload prometheus]

# The targets of every exporter, from the component map; the endpoint directory holds
# that one file (what exporters wrote there before goes).
- name: Locate the scrape targets template
  ansible.builtin.set_fact:
    prometheus_targets_sources: ["{{ role_path }}/templates/{{ prometheus_targets_file }}"]

- name: Install the scrape targets
  ansible.builtin.include_role:
    name: managed_dir
  vars:
    managed_dir_path: "{{ prometheus_cfg_endpoint_dir }}"
    managed_dir_sources: "{{ prometheus_targets_sources }}"
    managed_dir_template: true

- name: Install config file
  ansible.builtin.template:
    src: "{{ prometheus_config_src }}"
    dest: "{{ prometheus_config_dir }}/prometheus.yml"
    owner: root
    group: root
    mode: "0644"
    validate: "docker run --rm -u 0 --entrypoint promtool --mount type=bind,src=%s,dst=/check.yml,readonly {{ prometheus_container }} check config --syntax-only /check.yml"
  notify: Reload prometheus

- name: Create a persistent docker volume for metrics
  community.docker.docker_volume:
    name: "{{ prometheus_docker_volume_name }}"
    state: present
  when: not docker_preview_installs | default(false)  # roles/docker

- name: Run Prometheus
  ansible.builtin.include_role:
    name: container_service
  vars:
    container_service:
      unit: "{{ prometheus_svc_name }}"
      description: Prometheus
      image: "{{ prometheus_container }}"
      options: [--network host]
      cpus: "{{ prometheus_max_cpu }}"
      memory: "{{ prometheus_max_memory }}"
      mounts:
        - {src: "{{ prometheus_config_dir }}", dst: /etc/prometheus, readonly: true}
        - {src: "{{ prometheus_docker_volume_name }}", dst: /prometheus, type: volume}
      args: >-
        {{ ['--config.file=/etc/prometheus/prometheus.yml', '--storage.tsdb.path=/prometheus',
            '--storage.tsdb.retention.time=' ~ prometheus_retention_time]
           + (['--storage.tsdb.retention.size=' ~ prometheus_retention_size] if prometheus_retention_size else [])
           + ['--web.listen-address=:' ~ prometheus_port] }}
      state: "{{ prometheus_service_state }}"
      enabled: "{{ prometheus_service_enabled }}"
      notify: [Restart prometheus]
      # Ready once the TSDB's write-ahead log is replayed: minutes on a large one.
      health_url: "http://localhost:{{ prometheus_port }}/-/ready"
      health_timeout: 900

# SIGHUP (the reload handler) succeeds whether or not Prometheus took the new
# configuration: a file it rejects leaves the old one running. Its own gauge says which.
- name: Check Prometheus took the configuration
  ansible.builtin.uri:
    url: "http://localhost:{{ prometheus_port }}/api/v1/query?query=prometheus_config_last_reload_successful"
    return_content: true
  register: prometheus_reload_state
  until: >-
    prometheus_reload_state.json is defined
    and (prometheus_reload_state.json.data.result | map(attribute='value') | map('last') | list) == ['1']
  retries: 6
  delay: 5
  when:
    - prometheus_service_state == 'started'
    - not ansible_check_mode

- name: Record the component as present
  ansible.builtin.include_role:
    name: component_record
  vars:
    component_record_name: prometheus
    component_record_action: present
    component_record_items: "{{ prometheus_items + prometheus_rule_items }}"
    component_record_version: "{{ prometheus_container | regex_replace('@.*', '') }}"
