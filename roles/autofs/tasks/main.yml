---
- name: Assert that the required variables are defined
  ansible.builtin.assert:
    that:
      - autofs_mount is defined
      - autofs_map is defined
    fail_msg: "Set autofs_mount and autofs_map in config/group_vars."
    quiet: true

- name: Install packages
  ansible.builtin.package:
    name: autofs

- name: Configure /etc/auto.master
  ansible.builtin.template:
    src: templates/master.j2
    dest: /etc/auto.master
    owner: root
    group: root
    mode: "0644"
  notify: "Restart autofs"
  tags:
    - configuration

- name: Ensure mountpoint exists
  ansible.builtin.file:
    path: "{{ autofs_mount }}"
    state: directory
    owner: "root"
    group: "root"
    mode: "0755"
  when: autofs_mount is defined

- name: Make sure autofs is running
  ansible.builtin.service:
    name: autofs
    state: started
    enabled: true
