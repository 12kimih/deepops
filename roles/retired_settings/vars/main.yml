---
# Settings deepops no longer reads, each with what replaces it: the one list. A site still
# setting one would be ignored without a word, so roles that read one before depend on
# this role and a deploy stops on it; scripts/deepops/config_lint.py reports a document
# or config that still names one. Add a name here when a setting is renamed or removed.
retired_settings:
  host_file_backup: nothing (the repository is the hosts file's history; rule 14)
  hosts_custom_hosts_marker: nothing (hosts_entries are written once, in roles/deepops_hosts' own part)
  slurm_container_storage_gc: slurm_enable_container_storage_gc in roles/deploy_defaults (off removes the cleanup)
  docker_rh_repo_url: docker_rh_repo_base_url (and docker_rh_repo_gpgkey) in roles/docker
  nvidia_container_toolkit_enable_docker: roles/docker enables and starts Docker (docker_service_enabled, docker_service_state)
  nvidia_container_toolkit_rpm_repo_url: nvidia_container_toolkit_repo_base_url (a mirror) in roles/nvidia_container_toolkit
  nvidia_driver_ubuntu_cuda_keyring_url: package_repos_cuda_base in roles/package_repos
  nvidia_driver_ubuntu_cuda_repo_baseurl: package_repos_cuda_base in roles/package_repos
  nvidia_driver_rhel_cuda_repo_baseurl: package_repos_cuda_base in roles/package_repos
  nvidia_driver_rhel_cuda_repo_gpgkey: package_repos_cuda_base in roles/package_repos
  nvidia_driver_ubuntu_repo_release: package_repos_cuda_release in roles/package_repos
  nvidia_cuda_ubuntu_repo_release: package_repos_cuda_release in roles/package_repos
  nvidia_dcgm_ubuntu_repo_release: package_repos_cuda_release in roles/package_repos
  epel_package: package_repos_epel_* in roles/package_repos
  epel_key_url: package_repos_epel_* in roles/package_repos
  software_remove_packages: host_baseline_absent_packages (playbooks/generic/host-baseline.yml)
  nvidia_cuda_toolkit_install: slurm_install_cuda_toolkit in roles/deploy_defaults (the first slurm-master installs; off removes)
  slurm_cluster_install_cuda: slurm_install_cuda in roles/deploy_defaults (off removes the toolkit)
  nvidia_cuda_install: slurm_install_cuda in roles/deploy_defaults (off removes the toolkit)
  nvidia_driver_ubuntu_use_open_kernel_modules: nvidia_driver_kernel_modules (open or proprietary) in roles/nvidia_driver
  ngc_ready_pytorch: ngc_ready_pytorch_container in roles/deploy_defaults
  ngc_ready_tensorflow: ngc_ready_tensorflow_container in roles/deploy_defaults
  rootlessdocker_install_dir: slurm_install_podman (rootless Podman, roles/podman, replaces the retired docker-rootless)
  sm_files_path: easybuild_packages (easyconfig names or paths) in roles/easy-build
  sm_files_url: easybuild_packages (easyconfig names or paths) in roles/easy-build
  sm_files_repo_version: easybuild_packages (easyconfig names or paths) in roles/easy-build
  sm_install_default: easybuild_packages (empty builds nothing) in roles/easy-build
  sm_sources_path: easybuild_prefix in roles/deepops_paths (sources live under it)
  sm_build_path: system_accounts.easybuild.home in roles/system_accounts (builds unpack under it)
  slurm_password: slurm_munge_key_file, a vaulted key file (docs/slurm-cluster/munge-key.md)
  enroot_configure_kernel_options_versions: every installed kernel gets the arguments (roles/host_baseline, kernel_args)
  nvidia_power_limit_persistence_mode: persistence mode is the persistence daemon's (roles/nvidia_driver)
  nvidia_driver_persistenced_dropin: the role owns the nvidia-persistenced unit with persistence mode on (roles/nvidia_driver)
  chrony_config_server: chrony_upstream (chrony.conf source lines, e.g. "server time.example.org iburst") in roles/deepops_chrony
  chrony_timezone: locale_timezone in roles/locale (the time zone is set with or without chrony)
  spack_build_packages: spack_default_packages (the specs to install; empty installs none) in roles/spack
  volume_snapshot_CRD_manifest_URLs: csi_snapshot_controller_enabled (Kubespray deploys the snapshot CRDs and controller) in group_vars/k8s_cluster
  snapshot_controller_manifest_URLs: csi_snapshot_controller_enabled (Kubespray deploys the snapshot CRDs and controller) in group_vars/k8s_cluster
  trident_helm_repo_name: trident_helm_repo_url (installed with helm --repo, no named repository) in roles/netapp-trident
  slurm_cluster_group: the inventory group names are fixed (slurm-cluster; config.example/inventory)
  slurm_controller_group: the inventory group names are fixed (slurm-master; config.example/inventory)
  slurm_compute_group: the inventory group names are fixed (slurm-node; config.example/inventory)
  trident_helm_chart_name: trident_helm_chart (the chart name; the repository is trident_helm_repo_url) in roles/netapp-trident
  k8s_nfs_client_repo_name: k8s_nfs_client_helm_repo (installed with helm --repo, no named repository) in roles/nfs-client-provisioner
  prometheus_enabled: prometheus_service_enabled (started/stopped; _state means present/absent, docs/deepops/component-state.md)
  grafana_enabled: grafana_service_enabled (started/stopped; _state means present/absent, docs/deepops/component-state.md)
  alertmanager_enabled: alertmanager_service_enabled (started/stopped; _state means present/absent, docs/deepops/component-state.md)
  slurm_exporter_enabled: slurm_exporter_service_enabled (started/stopped; _state means present/absent, docs/deepops/component-state.md)
  node_exporter_enabled: node_exporter_service_enabled (started/stopped; _state means present/absent, docs/deepops/component-state.md)
  ipmi_exporter_enabled: ipmi_exporter_service_enabled (started/stopped; _state means present/absent, docs/deepops/component-state.md)
  nvidia_dcgm_state: dcgm_exporter_service_state (started/stopped; _state means present/absent, docs/deepops/component-state.md)
  nvidia_dcgm_enabled: dcgm_exporter_service_enabled (started/stopped; _state means present/absent, docs/deepops/component-state.md)
  nginx_docker_cache_hostgroup: the registry entry nginx_docker_cache (its group, [slurm-cache]) in roles/deploy_defaults/vars/main.yml, or nginx_docker_cache_host to point clients elsewhere
  docker_apt_keyring: nothing (roles/package_repos names it /etc/apt/keyrings/docker.asc)
  docker_apt_sources: nothing (roles/package_repos names it /etc/apt/sources.list.d/docker.sources)
  nvidia_container_toolkit_keyring_ascii_path: nothing (roles/package_repos keeps the key as /etc/apt/keyrings/nvidia-container-toolkit.asc)
  nvidia_container_toolkit_keyring_path: nothing (roles/package_repos keeps the key as /etc/apt/keyrings/nvidia-container-toolkit.asc)
  nvidia_container_toolkit_apt_source_path: nothing (roles/package_repos writes /etc/apt/sources.list.d/nvidia-container-toolkit.sources)
  chrony_pkg_state: chrony_state (present, absent or kept) in roles/deepops_chrony, set by the deploy from chrony_install
  runai_helm: helm_bin in roles/deepops_paths (the one Helm client path)
  runai_helm_timeout: helm_timeout in roles/helm_release (every release waits as long)
  helm_cmd: helm_bin in roles/deepops_paths (the one Helm client path)
  container_registry_repo_name: container_registry_chart_location (installed with helm --repo, no named repository) in roles/k8s-internal-container-registry
  container_registry_values_template: the chart values are set in roles/k8s-internal-container-registry/tasks/main.yml from the container_registry_* settings
  container_registry_values_path: nothing (the values travel on stdin, never on disk; roles/helm_release)
  k8s_nfs_client_chart_name: k8s_nfs_client_chart (the chart name; the repository is k8s_nfs_client_helm_repo) in roles/nfs-client-provisioner
  sriov_resources: nvidia_network_operator_interfaces in roles/nvidia-network-operator (roles/roce_backend is retired; NVIDIA Network Operator manages SR-IOV/RDMA)
  roce_backend_num_vf: nvidia_network_operator_num_vf in roles/nvidia-network-operator (roles/roce_backend is retired)
  intf_resources: nvidia_network_operator_interfaces in roles/nvidia-network-operator
  vendor_id: nvidia_network_operator_vendor_id in roles/nvidia-network-operator
  link_type: nvidia_network_operator_link_type in roles/nvidia-network-operator
  mtu: nvidia_network_operator_mtu in roles/nvidia-network-operator
  mpi_operator_version: nvidia_network_operator_mpi_operator_version (a kubeflow/mpi-operator release) in roles/nvidia-network-operator
  mpi_raw_url: nvidia_network_operator_mpi_operator_version (the release manifest, checksummed) in roles/nvidia-network-operator
  nvidia_network_operator_url: nvidia_network_operator_repo in roles/nvidia-network-operator
  # Slurm from SchedMD's packages (roles/slurm) instead of a source build
  slurm_build_dir: nothing, Slurm comes from packages built in system_accounts.slurmbuild.home (roles/system_accounts)
  slurm_configure: nothing, the packages build with the shipped debian/rules plus slurm_deb_build_extra_deps
  slurm_configure_nvml: nothing, NVML is always built in from slurm_nvml_cuda_version
  slurm_build_make_clean: nothing, the package build tree is replaced on each build
  slurm_build_dir_cleanup: nothing, the package build tree is replaced on each build
  slurm_cuda_prefix: slurm_nvml_cuda_version (NVML from cuda-nvml-dev, never /usr/local/cuda)
  slurm_build_lua: nothing, the packages always carry Lua (slurm_deb_lua_dev)
  slurm_build_slurmrestd: nothing, the packages always carry slurmrestd
  slurm_autodetect_nvml: nothing, gres.conf has AutoDetect=nvml whenever slurm_manage_gpus is on
  slurm_conf_symlink: nothing, the nodes fetch slurm.conf from slurmctld (configless)
  slurmctl_config_dir: nothing, the nodes fetch slurm.conf from slurmctld (configless)
  slurm_include_pmix: nothing, PMIx is the distribution's and MpiDefault lives in slurm.conf
  slurm_include_hwloc: nothing, hwloc is the distribution's (libhwloc-dev)
  hwloc_build_dir: nothing, hwloc is the distribution's (libhwloc-dev)
  hwloc_version: nothing, hwloc is the distribution's (libhwloc-dev)
  hwloc_install_prefix: nothing, hwloc is the distribution's (OpenMPI takes --with-hwloc=external)
  hwloc_configure: nothing, hwloc is the distribution's (libhwloc-dev)
  hwloc_force_rebuild: nothing, hwloc is the distribution's (libhwloc-dev)
  pmix_build_dir: nothing, PMIx is the distribution's (libpmix-dev)
  pmix_version: nothing, PMIx is the distribution's (libpmix-dev)
  pmix_install_prefix: nothing, PMIx is the distribution's (OpenMPI takes --with-pmix=external)
  pmix_configure: nothing, PMIx is the distribution's (libpmix-dev)
  pmix_force_rebuild: nothing, PMIx is the distribution's (libpmix-dev)
  # The repository signing key as files, like the MUNGE key
  slurm_repo_signing_key: slurm_repo_signing_key_file, a vaulted file roles/site_secrets creates (roles/slurm_paths)
  slurm_repo_signing_pubkey: slurm_repo_signing_pubkey_file, a file roles/site_secrets creates (roles/slurm_paths)
  # Monitoring components (docs/deepops/component-state.md): where each exporter runs is its
  # registry entry; Prometheus scrapes it there.
  node_exporter_host_group: the node_exporter rule in deepops_component_registry (roles/deploy_defaults/vars/main.yml)
  ipmi_exporter_host_group: the ipmi_exporter rule in deepops_component_registry (roles/deploy_defaults/vars/main.yml)
  slurm_exporter_host_group: the slurm_exporter rule in deepops_component_registry (roles/deploy_defaults/vars/main.yml)
  node_exporter_conf_template: nothing (Prometheus writes every exporter's scrape targets, roles/prometheus)
  ipmi_exporter_conf_template: nothing (Prometheus writes every exporter's scrape targets, roles/prometheus)
  slurm_exporter_conf_template: nothing (Prometheus writes every exporter's scrape targets, roles/prometheus)
  nvidia_dcgm_exporter_conf_template: nothing (Prometheus writes every exporter's scrape targets, roles/prometheus)
  nvidia_dcgm_container: dcgm_exporter_container in roles/nvidia-dcgm-exporter
  nvidia_dcgm_exporter_port: dcgm_exporter_port in roles/prometheus_paths
  nvidia_dcgm_container_config_dir: dcgm_exporter_config_dir in roles/nvidia-dcgm-exporter
  nvidia_dcgm_container_custom_metrics_file: dcgm_exporter_counters_file in roles/nvidia-dcgm-exporter
  nvidia_dcgm_svc_name: dcgm_exporter_svc_name in roles/nvidia-dcgm-exporter
  nvidia_dcgm_max_cpu: dcgm_exporter_max_cpu in roles/nvidia-dcgm-exporter
  grafana_dashboards: grafana_dashboard_sets in roles/prometheus_paths (every set's files, under src/dashboards)
  grafana_cfg_dashboard_path: grafana_dashboards_dir in roles/prometheus_paths (configuration, under /etc)
  nfs_servers: "deepops_component_removals: [nfs] (the NFS server goes from every host outside the deploy's NFS servers) in roles/deploy_defaults"
  maas_repo: maas_series (the MAAS release series; its PPA comes through roles/package_repos with a checked key) in roles/maas-controller
  pyxis_src_dir: none; pyxis is packaged with Slurm (roles/slurm, slurm_pyxis_package)
  pyxis_build_record: none; pyxis is packaged with Slurm (roles/slurm, slurm_pyxis_package)
  slurm_pyxis_force_rebuild: slurm_force_rebuild in roles/slurm (pyxis is built with the Slurm packages)
  openmpi_build_root: source_build_root in roles/deepops_paths (roles/source_build builds every release there)
  openmpi_build_dir: none; roles/source_build names the tree and removes it once installed
  nhc_build_dir: none; roles/source_build names the tree and removes it once installed
  nhc_extract_dir: none; roles/source_build unpacks the release with its top directory stripped
  lmod_build_dir: none; roles/source_build names the tree and removes it once installed
  pyxis_runtime_path: slurm_pyxis_runtime_path in roles/slurm (pyxis is configured with its package)
  pyxis_execute_entrypoint: slurm_pyxis_execute_entrypoint in roles/slurm (pyxis is configured with its package)
  pyxis_container_scope: slurm_pyxis_container_scope in roles/slurm (pyxis is configured with its package)
  pyxis_sbatch_support: slurm_pyxis_sbatch_support in roles/slurm (pyxis is configured with its package)
  pyxis_use_enroot_load: slurm_pyxis_use_enroot_load in roles/slurm (pyxis is configured with its package)
  slurm_install_authentication: "directory_service, nis_domain and ldap_suffix in roles/deploy_defaults (each directory is on when configured; deepops_component_removals retires one)"
  nis_make_server: the [nis-master] inventory group (its host serves nis_domain, roles/deploy_defaults)
  nis_export_groups: directory_groups in roles/directory_defaults (NIS and LDAP publish the same groups)
  nis_export_groups_exclusive: directory_groups_exclusive in roles/directory_defaults
  nis_export_netgroups: directory_netgroups in roles/directory_defaults (NIS and LDAP publish the same netgroups)
  nis_client_remove_caches: directory_remove_caches in roles/directory_defaults
  nis_client_nsswitch: none; each directory client adds its own source to nsswitch.conf (roles/nsswitch)
  easybuild_home: system_accounts.easybuild.home (the build account's home) in roles/system_accounts
  slurm_deb_build_dir: system_accounts.slurmbuild.home (the build account's home) in roles/system_accounts
  slurm_user_home: system_accounts.slurm.home in roles/system_accounts
  slurm_user_uid: system_accounts.slurm.uid in roles/system_accounts
  slurm_user_gid: system_accounts.slurm.gid in roles/system_accounts
  slurm_groupname: nothing, the slurm account's group is named like it (roles/local_accounts)
  slurm_manage_user_gid: nothing, roles/local_accounts pins the group's GID and refuses to renumber
  docker_login_disable_log_password: nothing, roles/docker-login never logs credentials
  cluster_subnet: cluster_networks (a list of CIDRs) in roles/network_defaults
  egress_policy_internal_networks: cluster_networks in roles/network_defaults
  hosts_internal_subnet_prefix: cluster_networks in roles/network_defaults (/etc/hosts lists the address inside them)
  egress_policy_inbound: slurm_enable_ingress_policy in roles/deploy_defaults (roles/ingress_policy, its own table)
  egress_policy_inbound_tcp_ports: ingress_policy_tcp_ports in roles/ingress_policy
  egress_policy_inbound_udp_ports: ingress_policy_udp_ports in roles/ingress_policy
  egress_policy_trusted_interfaces: ingress_policy_trusted_interfaces in roles/ingress_policy
  egress_policy_inbound_lockout_check: ingress_policy_lockout_check in roles/ingress_policy
