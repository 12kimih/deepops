---
# scratch_defaults -- fast scratch space per request, named once for the roles that need
# it: roles/scratch_alloc on the scratch server and roles/cluster_bot, which takes the
# requests (a shared-defaults role: roles list it as a meta dependency).
#
# The mount point (XFS or ext4, with project quotas) that holds the allocations.
scratch_alloc_mount: /scratch

# A person has one allocation, <mount>/<login>. One table decides a request, every period
# counted from the day the allocation was made: up to auto_size and auto_days it is
# given at once; beyond, up to the hard caps max_size and max_days, an administrator
# approves; past the caps nobody can. An extension adds at most max_extend_days.
# Giving space back is always at once.
scratch_alloc_max_size: 10T
scratch_alloc_max_days: 180
scratch_alloc_max_extend_days: 90
scratch_alloc_auto_size: 5T
scratch_alloc_auto_days: 90

# While the scratch disk is this full (a fraction), anything that grows (a new
# allocation, a larger size, an extension) waits for an administrator.
scratch_alloc_guard: 0.8

# After its end date an allocation is read-only for this many days, then removed: the
# cluster's period for users to clean up.
scratch_alloc_grace_days: "{{ cluster_user_grace_days }}"

# How often the end dates are kept and the usage exported (systemd OnUnitActiveSec).
scratch_alloc_sweep_interval: 15min
