---
- name: Assert that the required variables are defined
  ansible.builtin.assert:
    that:
      - kerberos_client_realm_name is defined
    fail_msg: "Set kerberos_client_realm_name in config/group_vars."
    quiet: true

- name: Install the kerberos packages (RedHat)
  ansible.builtin.dnf:
    name: "{{ item }}"
    state: present
  with_items: "{{ kerberos_client_redhat_pkg }}"
  when: ansible_facts.os_family == "RedHat"

- name: Install the kerberos packages (Ubuntu)
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    name: "{{ item }}"
    state: present
  with_items: "{{ kerberos_client_ubuntu_pkg }}"
  when: ansible_facts.distribution == "Ubuntu"

- name: Copy the client configuration file
  ansible.builtin.template:
    src: "krb5.conf.j2"
    dest: "/etc/krb5.conf"
    mode: "0644"
