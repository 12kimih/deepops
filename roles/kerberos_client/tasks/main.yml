---
- name: Assert that variables are defined
  ansible.builtin.fail:
    msg: "Variable '{{ item }}' is not defined"
  when: item not in vars
  with_items:
    - kerberos_client_realm_name

- name: Install the kerberos packages (RedHat)
  ansible.builtin.dnf:
    name: "{{ item }}"
    state: present
  with_items: "{{ kerberos_client_redhat_pkg }}"
  when: ansible_facts.os_family == "RedHat"

- name: Install the kerberos packages (Ubuntu)
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    name: "{{ item }}"
    state: present
  with_items: "{{ kerberos_client_ubuntu_pkg }}"
  when: ansible_facts.distribution == "Ubuntu"

- name: Copy the client configuration file
  ansible.builtin.template:
    src: "krb5.conf.j2"
    dest: "/etc/krb5.conf"
    mode: "0644"
