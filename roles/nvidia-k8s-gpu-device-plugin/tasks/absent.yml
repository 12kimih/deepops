---
# The release goes; its CRDs and persistent volumes stay (Helm keeps them, as does
# roles/helm_release).
- name: Remove the NVIDIA device plugin
  ansible.builtin.include_role:
    name: helm_release
  vars:
    helm_release:
      release: "{{ k8s_gpu_plugin_release_name }}"
      namespace: default
      state: absent

- name: Forget the component
  ansible.builtin.include_role:
    name: component_record
  vars:
    component_record_name: k8s_gpu_plugin
    component_record_action: absent
    component_record_items: "{{ k8s_gpu_plugin_items }}"
