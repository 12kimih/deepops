---
- name: Check the component state
  ansible.builtin.assert:
    that: k8s_gpu_plugin_state in ['present', 'absent', 'kept']
    fail_msg: "k8s_gpu_plugin_state must be present, absent or kept, not {{ k8s_gpu_plugin_state }}."
    quiet: true

- name: "Make the NVIDIA device plugin {{ k8s_gpu_plugin_state }}"
  ansible.builtin.include_tasks: "{{ k8s_gpu_plugin_state }}.yml"
  when: k8s_gpu_plugin_state != 'kept'
