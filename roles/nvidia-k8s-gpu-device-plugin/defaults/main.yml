---
# present, absent or kept (do nothing) (docs/deepops/component-state.md); the Kubernetes
# deploy sets it from deepops_components on the first control-plane host, which decides
# for the cluster.
k8s_gpu_plugin_state: present
# Vars needed to install device plugin
k8s_gpu_plugin_helm_repo: "https://nvidia.github.io/k8s-device-plugin"
k8s_gpu_plugin_chart_name: "nvidia-device-plugin"
k8s_gpu_plugin_release_name: "nvidia-device-plugin"
# upstream: helm https://nvidia.github.io/k8s-device-plugin nvidia-device-plugin
k8s_gpu_plugin_chart_version: "0.20.2"
k8s_gpu_plugin_init_error: "false"
k8s_gpu_mig_strategy: "mixed"
