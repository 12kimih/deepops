---
# The in-cluster Docker registry, one Helm release (roles/helm_release). Its hostname
# is container_registry_hostname in roles/deploy_defaults (the nodes resolve it too).
# Canonical twuni chart repository (the old vanity URL https://helm.twun.io is
# deprecated and may go offline). Hosts all chart versions including the 2.x pinned below.
container_registry_chart_location: "https://twuni.github.io/docker-registry.helm"
container_registry_chart_name: "docker-registry"
container_registry_installed_name: "docker-registry"

container_registry_namespace: "deepops-docker"
# Pinned to chart 2.x (registry/distribution 2.x). Chart 3.0.0 ships distribution 3.x
# with breaking config changes (the config mount moved /etc/docker/registry ->
# /etc/distribution and needs a `configPath` value), so bumping requires reworking
# the values -- intentionally left on 2.1.0.
# upstream: hold the 3.x chart moved the config mount and needs configPath (see above)
container_registry_version: "2.1.0"
container_registry_ingress_enabled: false
container_registry_ingress_size: 4096m
container_registry_service_type: NodePort
container_registry_node_port: 31500
container_registry_persistence_enabled: true
container_registry_delete_enabled: true
container_registry_storage_size: 100Gi
