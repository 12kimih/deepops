---
- name: Install the in-cluster container registry
  ansible.builtin.include_role:
    name: helm_release
  vars:
    helm_release:
      release: "{{ container_registry_installed_name }}"
      namespace: "{{ container_registry_namespace }}"
      chart: "{{ container_registry_chart_name }}"
      repo: "{{ container_registry_chart_location }}"
      version: "{{ container_registry_version }}"
      helm_values:
        persistence: >-
          {{ {'enabled': container_registry_persistence_enabled | bool,
              'deleteEnabled': container_registry_delete_enabled | bool}
             | combine({'size': container_registry_storage_size}
                       if container_registry_persistence_enabled | bool else {}) }}
        nodeSelector:
          node-role.kubernetes.io/control-plane: ""
        service: >-
          {{ {'type': container_registry_service_type}
             | combine({'nodePort': container_registry_node_port | int}
                       if container_registry_service_type == 'NodePort' else {}) }}
        ingress:
          enabled: "{{ container_registry_ingress_enabled | bool }}"
          hosts: ["{{ container_registry_hostname }}"]
          className: nginx
          annotations:
            nginx.ingress.kubernetes.io/ssl-redirect: "false"
            nginx.ingress.kubernetes.io/rewrite-target: /
            nginx.ingress.kubernetes.io/proxy-body-size: "{{ container_registry_ingress_size }}"
