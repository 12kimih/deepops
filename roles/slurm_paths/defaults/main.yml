---
# Where Slurm lives and which hosts play which part, written once for every role
# that installs into, configures or talks to Slurm.

# The slurm-smd packages (roles/slurm) install the commands under /usr and the plugins
# in the multiarch library directory; nothing here moves them.
slurm_install_prefix: /usr
# Debian multiarch tuple per architecture: not derivable from the architecture name
# (armv7l is arm-linux-gnueabihf, ppc64le powerpc64le-linux-gnu).
slurm_multiarch_map:
  x86_64: x86_64-linux-gnu
  aarch64: aarch64-linux-gnu
  arm64: aarch64-linux-gnu
  armv7l: arm-linux-gnueabihf
  ppc64le: powerpc64le-linux-gnu
slurm_multiarch: "{{ slurm_multiarch_map.get(ansible_facts.architecture, ansible_facts.architecture ~ '-linux-gnu') }}"
slurm_plugin_dir: "/usr/lib/{{ slurm_multiarch }}/slurm"
slurm_config_dir: /etc/slurm
# Slurm's log files, keyed by the tag a forwarded line carries: slurm.conf and
# slurmdbd.conf, the prolog and epilog parts, logrotate and the syslog forwarding
# (roles/rsyslog_client) all take their paths from here.
slurm_log_dir: /var/log/slurm
slurm_log_files:
  slurmctld: "{{ slurm_log_dir }}/slurmctld.log"
  slurmd: "{{ slurm_log_dir }}/slurmd.log"
  slurmdbd: "{{ slurm_log_dir }}/slurmdbd.log"
  slurm-prolog-epilog: "{{ slurm_log_dir }}/prolog-epilog"
# slurmctld's port: slurm.conf, slurmd's --conf-server and the metrics scrape.
slurm_slurmctld_port: 6817
# Where roles/nhc installs the node health check, for the role and for whatever runs it.
nhc_install_dir: /usr
nhc_program: "{{ nhc_install_dir }}/sbin/nhc"

# The site's Slurm secrets, files in the site config. roles/site_secrets creates each
# one that is missing (the first play of every playbook that deploys Slurm) and never
# replaces one; a MUNGE key the hosts already share is adopted, not replaced
# (docs/slurm-cluster/munge-key.md).
# The MUNGE key every Slurm host shares, copied verbatim, vaulted: random bytes, never
# derived from a password (only as strong as the password).
# https://github.com/dun/munge/wiki/Installation-Guide#creating-a-secret-key
slurm_munge_key_file: "{{ inventory_dir }}/files/munge/munge.key"
# The OpenPGP key pair that signs the Slurm package repository, ASCII-armored: the secret
# key (vaulted) is used on the build host only, the public key is what every node's apt
# trusts. Replacing the pair is a deliberate step (docs/slurm-cluster/slurm-upgrade.md).
slurm_repo_signing_key_file: "{{ inventory_dir }}/files/slurm/repo-signing.key"
slurm_repo_signing_pubkey_file: "{{ inventory_dir }}/files/slurm/repo-signing.asc"
# The declarations roles/site_secrets reads (its defaults say the format).
slurm_site_secrets:
  - path: "{{ slurm_munge_key_file }}"
    kind: random
    length: 1024
    adopt: /etc/munge/munge.key
  - path: "{{ slurm_repo_signing_key_file }}"
    public_path: "{{ slurm_repo_signing_pubkey_file }}"
    kind: gpg_signing
    uid: "Slurm packages ({{ slurm_cluster_name }}) <root@localhost>"

# The cluster's name (slurm.conf ClusterName, the accounting cluster), read by every role
# that names the cluster (the Slurm config, accounting, the web portal's cluster file).
# Renaming a running cluster is its own step: playbooks/slurm-cluster/slurm-cluster-rename.yml.
slurm_cluster_name: deepops

# A host's Slurm duties follow from its inventory groups (config.example/inventory names
# them, the one contract: a play's hosts cannot be templated, so the names are fixed):
# slurmctld and slurmdbd on slurm-master, slurmd on slurm-node, client-only elsewhere.
is_controller: "{{ inventory_hostname in (groups['slurm-master'] | default([])) }}"
is_compute: "{{ inventory_hostname in (groups['slurm-node'] | default([])) }}"

slurm_enable_ha: false
# HA StateSaveLocation. Must be on storage shared by all controllers when HA is on;
# set it to your shared path (e.g. /sw/slurm) in config/group_vars.
slurm_ha_state_save_location: "{{ deepops_dir }}/slurm/state"
# Where slurmctld keeps its state, for slurm.conf, the directory task and backups.
slurm_state_save_location: "{{ slurm_ha_state_save_location if slurm_enable_ha else '/var/spool/slurmctld' }}"

# The systemd units that run sshd: the service, then the socket that starts it on
# demand (Ubuntu 22.10+). Debian and Ubuntu name them ssh; upstream OpenSSH and RHEL sshd.
ssh_units: "{{ ['sshd.service', 'sshd.socket'] if ansible_facts.os_family == 'RedHat' else ['ssh.service', 'ssh.socket'] }}"
