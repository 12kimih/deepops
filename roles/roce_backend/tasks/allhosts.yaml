---
# Tasks file for roce_backend role
# Install Mellanox OFED through roles/mofed, the one place DeepOps installs it (a
# verified repository, and a reboot left pending for the drained maintenance path).
- name: MOFED installation
  ansible.builtin.include_role:
    name: mofed
  tags:
    - roce_host

# Activate VF for relevant PF
- name: Checking the Mellanox OFED is installed
  ansible.builtin.stat:
    path: /usr/bin/ofed_info
  register: ofed_present
  tags:
    - roce_host

- name: Create /etc/rc.local if it is not present
  ansible.builtin.file:
    path: /etc/rc.local
    state: touch
    mode: "0755"
  when: ofed_present.stat.exists
  register: f
  changed_when: f.diff.before.state == "absent"
  tags:
    - roce_host

- name: Add first line to /etc/rc.local
  ansible.builtin.lineinfile:
    path: /etc/rc.local
    regexp: "^#!/bin/sh -e"
    state: present
    line: "#!/bin/sh -e"
    insertbefore: BOF
  when: ofed_present.stat.exists
  tags:
    - roce_host

- name: Add last line to /etc/rc.local
  ansible.builtin.lineinfile:
    path: /etc/rc.local
    regexp: "^exit 0"
    state: present
    line: "exit 0"
    insertafter: EOF
  when: ofed_present.stat.exists
  tags:
    - roce_host

- name: Activate VFs for SR-IOV resources
  ansible.builtin.include_tasks: vf-activate.yaml
  with_items: "{{ sriov_resources }}"
  when: ofed_present.stat.exists
  tags:
    - roce_host

#Install Python modules

- name: Install PIP
  ansible.builtin.apt:
    name:
      - python3-pip
      - python3-setuptools
    state: present
    update_cache: true
  tags:
    - roce_host
