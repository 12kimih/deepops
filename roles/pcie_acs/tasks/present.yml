---
- name: Record what this component installs
  ansible.builtin.include_role:
    name: component_record
  vars:
    component_record_name: pcie_acs
    component_record_action: begin
    component_record_items: "{{ pcie_acs_items }}"

- name: Check the IOMMU setting
  ansible.builtin.assert:
    that: pcie_acs_iommu in ['', 'off', 'pt']
    fail_msg: "pcie_acs_iommu is off, pt or \"\" (leave the kernel alone), not {{ pcie_acs_iommu }}."
    quiet: true

# A hand edit of /etc/default/grub set the IOMMU before this role did: back to the
# package's empty value, so the role's own file is the one place it is set.
- name: Take the hand-set IOMMU argument out of the grub defaults
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    regexp: '^GRUB_CMDLINE_LINUX="(intel|amd)_iommu=(off|on)"$'
    line: 'GRUB_CMDLINE_LINUX=""'
  when:
    - pcie_acs_iommu | length > 0
    - ansible_facts.os_family == 'Debian'
    - not deepops_containerized

- name: Set the IOMMU on the kernel command line
  ansible.builtin.include_role:
    name: host_baseline
    tasks_from: kernel_args
  vars:
    host_baseline_kernel_args_owner: pcie-acs
    host_baseline_kernel_args: "{{ pcie_acs_iommu_args }}"
    host_baseline_kernel_args_reason: set the IOMMU for GPU peer-to-peer

# setpci; part of every server install, so not this component's to remove.
- name: Install pciutils
  ansible.builtin.package:
    name: pciutils
    state: present

- name: Install the program
  ansible.builtin.template:
    src: pcie-acs.sh.j2
    dest: "{{ pcie_acs_program }}"
    owner: root
    group: root
    mode: "0755"
  notify: Restart pcie-acs

- name: Install the boot unit
  ansible.builtin.template:
    src: pcie-acs.service.j2
    dest: "/etc/systemd/system/{{ pcie_acs_service }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart pcie-acs

# A container shares the host's PCI devices: their configuration is the host's to set.
- name: Turn ACS off now and at every boot
  systemd_unit:
    name: "{{ pcie_acs_service }}"
    enabled: true
    state: started
    daemon_reload: true
  when: not deepops_containerized

- name: Apply a changed program or unit now
  ansible.builtin.meta: flush_handlers

# The unit fails when a device keeps ACS on; this says which, also on a rerun where the
# unit had already run.
- name: Check ACS is off on every device
  ansible.builtin.command:
    argv: ["{{ pcie_acs_program }}", check]
  changed_when: false
  check_mode: false  # read-only; --check needs the result
  when:
    - not deepops_containerized
    - not ansible_check_mode

- name: Record the component as present
  ansible.builtin.include_role:
    name: component_record
  vars:
    component_record_name: pcie_acs
    component_record_action: present
    component_record_items: "{{ pcie_acs_items }}"
