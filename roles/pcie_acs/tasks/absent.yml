---
# The devices keep ACS off until the next boot, which gives them back the firmware's
# setting: removal changes no device. The IOMMU argument leaves the boot configuration;
# the running kernel keeps it until its next reboot.
- name: Take the IOMMU argument off the kernel command line
  ansible.builtin.include_role:
    name: host_baseline
    tasks_from: kernel_args
  vars:
    host_baseline_kernel_args_owner: pcie-acs
    host_baseline_kernel_args: []

- name: Remove what this component installed
  ansible.builtin.include_role:
    name: component_record
  vars:
    component_record_name: pcie_acs
    component_record_action: absent
    component_record_items: "{{ pcie_acs_items }}"
