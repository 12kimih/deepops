---
- name: Record what this component installs
  ansible.builtin.include_role:
    name: component_record
  vars:
    component_record_name: alertmanager
    component_record_action: begin
    component_record_items: "{{ alertmanager_items }}"

- name: Create config dirs
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ alertmanager_config_dir }}"
    - "{{ alertmanager_config_dir }}/templates"

- name: Install python3 docker module
  ansible.builtin.package:
    name: python3-docker
    state: present

# amtool ships in the same image; pulling first lets it validate the config.
- name: Pull the image
  ansible.builtin.include_role:
    name: container_image
  vars:
    container_image: "{{ alertmanager_container }}"

- name: Install notification templates
  ansible.builtin.copy:
    src: slack.tmpl
    dest: "{{ alertmanager_config_dir }}/templates/slack.tmpl"
    owner: root
    group: root
    mode: "0644"
  notify: Restart alertmanager

# Holds the webhook secret: readable only by root and the container user (nobody).
- name: Install config file
  diff: false  # the file holds a secret; --diff would print it
  ansible.builtin.template:
    src: "{{ alertmanager_config_src }}"
    dest: "{{ alertmanager_config_dir }}/alertmanager.yml"
    owner: root
    group: "65534"
    mode: "0640"
    validate: "docker run --rm -u 0 --entrypoint amtool --mount type=bind,src=%s,dst=/check.yml,readonly {{ alertmanager_container }} check-config /check.yml"
  notify: Restart alertmanager

- name: Create a persistent docker volume for state
  community.docker.docker_volume:
    name: "{{ alertmanager_docker_volume_name }}"
    state: present

- name: Run Alertmanager
  ansible.builtin.include_role:
    name: container_service
  vars:
    container_service:
      unit: "{{ alertmanager_svc_name }}"
      description: Alertmanager
      image: "{{ alertmanager_container }}"
      options: [--network host]
      mounts:
        - {src: "{{ alertmanager_config_dir }}", dst: /etc/alertmanager, readonly: true}
        - {src: "{{ alertmanager_docker_volume_name }}", dst: /alertmanager, type: volume}
      args:
        - --config.file=/etc/alertmanager/alertmanager.yml
        - --storage.path=/alertmanager
        - --web.listen-address=:{{ alertmanager_port }}
        - --cluster.listen-address=
      state: "{{ alertmanager_service_state }}"
      enabled: "{{ alertmanager_service_enabled }}"
      notify: [Restart alertmanager]
      health_url: "http://localhost:{{ alertmanager_port }}/-/ready"

- name: Record the component as present
  ansible.builtin.include_role:
    name: component_record
  vars:
    component_record_name: alertmanager
    component_record_action: present
    component_record_items: "{{ alertmanager_items }}"
    component_record_version: "{{ alertmanager_container | regex_replace('@.*', '') }}"
