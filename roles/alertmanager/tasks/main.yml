---
- name: Check the component state
  ansible.builtin.assert:
    that: alertmanager_state in ['present', 'absent', 'kept']
    fail_msg: "alertmanager_state must be present, absent or kept, not {{ alertmanager_state }}."
    quiet: true

- name: "Make alertmanager {{ alertmanager_state }}"
  ansible.builtin.include_tasks: "{{ alertmanager_state }}.yml"
  when: alertmanager_state != 'kept'
