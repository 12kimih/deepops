---
# How hosts update packages on their own: `security` (security fixes only, never the
# held-back packages below, never a reboot), `off` (no unattended upgrades) or
# `unmanaged` (leave the distribution's settings as they are).
os_updates_policy: security

# Packages unattended upgrades never touch (shell-style globs on the package name).
# They change the kernel, GPU, scheduler, container or storage stack, or (systemd,
# libc, dbus) their upgrade re-executes PID 1 or restarts core daemons under running
# jobs; a daemon-reexec from an unattended upgrade can leave systemd hung. They are
# upgraded in a maintenance window, with a reboot.
os_updates_held_back:
  - "linux-*"
  - "kernel*"
  - "systemd*"
  - "libsystemd*"
  - "udev"
  - "libudev*"
  - "libc6*"
  - "libc-*"   # libc-bin, libc-dev-bin, libc-l10n: same glibc source as libc6
  - "glibc*"
  - "dbus*"
  - "*nvidia*"
  - "cuda*"
  - "libcudnn*"
  - "libnccl*"
  - "datacenter-gpu-manager*"
  - "slurm*"
  - "*munge*"
  - "nfs-*"
  - "docker-ce*"
  - "containerd*"
  - "enroot*"

# Whether needrestart may restart services after an upgrade. When false it only lists
# them, so an upgrade never restarts nfs-server, slurmctld or similar under running jobs.
os_updates_restart_services: false

# Packages an apt hold may pin (shell-style globs). Any other hold is released: a hold
# set by hand once keeps a package back forever, even from the maintenance upgrade
# (Docker was held on some nodes only, so their versions drifted). Pin a version
# through the owning role instead. Debian family.
os_updates_allowed_holds: []

# Pending updates and whether a reboot is needed, as node_exporter textfile metrics
# (os_updates_pending_packages{kind="security"|"all"}, os_updates_security_pending_since_seconds,
# os_updates_reboot_required and _since_seconds, os_updates_dpkg_problems for an
# interrupted dpkg, os_updates_apt_ok when apt cannot simulate), measured daily, kept in
# /var/lib/os-updates and republished at boot, so updates that wait for a maintenance
# window cannot pile up unseen. Debian family. false removes the timer.
os_updates_metrics: true
os_updates_metrics_textfile_dir: "{{ node_exporter_prom_dir | default('/run/prometheus') }}"
