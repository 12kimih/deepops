---
- name: Make sure the package manager can work
  ansible.builtin.include_role:
    name: maintenance
    tasks_from: apt_health

- name: Take phased updates on every node at once
  ansible.builtin.include_tasks: phased.yml

# apt keeps every package it downloads (/var/cache/apt/archives) unless told not to:
# Ubuntu's `apt` command deletes them after installing, apt-get and python-apt (Ansible's
# apt module, unattended-upgrades) do not, and the daily apt job cleans nothing while
# every interval is 0 (Ubuntu's 10periodic). Every kernel, driver and CUDA upgrade
# stayed on the root filesystem (3.5G on a GPU node, 2026-11). A package is fetched
# again when wanted. https://manpages.ubuntu.com/manpages/noble/man5/apt.conf.5.html
- name: Keep no downloaded packages
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/53deepops-package-cache
    content: |
      // Managed by DeepOps (roles/os_updates).
      APT::Keep-Downloaded-Packages "false";
      APT::Periodic::CleanInterval "1";
    owner: root
    group: root
    mode: "0644"
    validate: apt-config -c %s dump

- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 600
  when: os_updates_policy == "security"

- name: Remove unattended-upgrades
  ansible.builtin.include_role:
    name: host_baseline
    tasks_from: absent
  vars:
    host_baseline_absent_packages: [unattended-upgrades]
  when: os_updates_policy == "off"

- name: Turn on the periodic unattended upgrade
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      // Managed by DeepOps (roles/os_updates).
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    owner: root
    group: root
    mode: "0644"
  when: os_updates_policy == "security"

- name: Limit unattended upgrades to security fixes
  ansible.builtin.template:
    src: 52deepops-unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/52deepops-unattended-upgrades
    owner: root
    group: root
    mode: "0644"
    validate: apt-config -c %s dump
  when: os_updates_policy == "security"

- name: Remove the unattended-upgrades settings
  ansible.builtin.file:
    path: /etc/apt/apt.conf.d/52deepops-unattended-upgrades
    state: absent
  when: os_updates_policy == "off"

- name: Create the needrestart drop-in directory
  ansible.builtin.file:
    path: /etc/needrestart/conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Set whether needrestart restarts services
  ansible.builtin.copy:
    dest: /etc/needrestart/conf.d/50-deepops.conf
    content: |
      # Managed by DeepOps (roles/os_updates).
      # a: restart services automatically, l: only list them
      $nrconf{restart} = '{{ "a" if os_updates_restart_services else "l" }}';
    owner: root
    group: root
    mode: "0644"

# Unattended-upgrades and autoremove remove an old kernel without purging it: its
# configuration and /lib/modules/<version> (modules.* files depmod wrote) stay with the
# package in state rc, one set per kernel ever installed. Only kernel packages are
# purged here: another rc package's purge can take data with it (a database server's).
- name: Find the kernels removed without their files
  ansible.builtin.command:
    argv: [dpkg-query, -W, -f, '${db:Status-Abbrev} ${binary:Package}\n']
  register: os_updates_dpkg_status
  changed_when: false
  check_mode: false  # read-only; --check needs the result

- name: Purge what the removed kernels left
  ansible.builtin.include_role:
    name: host_baseline
    tasks_from: absent
  vars:
    host_baseline_absent_packages: >-
      {{ os_updates_dpkg_status.stdout_lines | select('match', '^rc ') | map('split') | map('last')
         | select('match', '^linux-(image|modules|modules-extra|headers)-[0-9]') | list }}
  when: host_baseline_absent_packages | length > 0

# A hold keeps a package back from every upgrade, the maintenance window's included.
- name: Read the apt holds
  ansible.builtin.command:
    argv: [apt-mark, showhold]
  register: os_updates_holds
  changed_when: false
  check_mode: false  # read-only; --check needs the result

- name: Release the holds that are not allowed
  change_command:
    argv: [apt-mark, unhold, "{{ item }}"]
  loop: >-
    {{ os_updates_holds.stdout_lines
       | reject('in', os_updates_holds.stdout_lines | select('search', os_updates_allowed_holds_regex) | list
                if os_updates_allowed_holds | length > 0 else [])
       | list }}
  vars:
    os_updates_allowed_holds_regex: >-
      {{ '^(' ~ (os_updates_allowed_holds | map('regex_escape') | map('replace', '\*', '.*')
                 | map('replace', '\?', '.') | join('|')) ~ ')$' }}

- name: Publish pending updates as metrics
  when: os_updates_metrics | bool
  block:
    - name: Install the pending-updates metrics command
      ansible.builtin.copy:
        src: os-updates-metrics
        dest: /usr/local/sbin/os-updates-metrics
        owner: root
        group: root
        mode: "0755"

    - name: Install the pending-updates metrics units
      ansible.builtin.copy:
        dest: "/etc/systemd/system/os-updates-metrics.{{ item.key }}"
        mode: "0644"
        content: "{{ item.value }}"
      loop: "{{ units | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      vars:
        units:
          service: |
            # Managed by roles/os_updates.
            [Unit]
            Description=Publish pending package updates as node_exporter metrics
            After=apt-daily.service

            [Service]
            Type=oneshot
            TimeoutStartSec=15min
            Environment=OS_UPDATES_COMPONENT_RECORD={{ deepops_component_record }}
            ExecStart=/usr/local/sbin/os-updates-metrics {{ node_exporter_prom_dir }}
            Nice=10
          # At every boot: the kept metrics at once (the textfile directory is usually
          # tmpfs), with the reboot flag measured afresh, then a full measurement, so a
          # boot after an upgrade never shows the packages it had before. Not the
          # timer's OnBootSec: a daemon-reload can drop its pending boot trigger.
          publish.service: |
            # Managed by roles/os_updates.
            [Unit]
            Description=Publish the kept pending-update metrics, then measure them afresh, after boot
            Wants=network-online.target
            After=network-online.target local-fs.target

            [Service]
            Type=oneshot
            TimeoutStartSec=15min
            Environment=OS_UPDATES_COMPONENT_RECORD={{ deepops_component_record }}
            ExecStart=/usr/local/sbin/os-updates-metrics --publish {{ node_exporter_prom_dir }}
            ExecStart=/usr/local/sbin/os-updates-metrics {{ node_exporter_prom_dir }}
            Nice=10

            [Install]
            WantedBy=multi-user.target
          # The component record's series alone, at once (component_record starts it after
          # it writes the record: deepops_component_record_readers).
          components.service: |
            # Managed by roles/os_updates.
            [Unit]
            Description=Publish the component record as node_exporter metrics

            [Service]
            Type=oneshot
            TimeoutStartSec=1min
            Environment=OS_UPDATES_COMPONENT_RECORD={{ deepops_component_record }}
            ExecStart=/usr/local/sbin/os-updates-metrics --components {{ node_exporter_prom_dir }}
          timer: |
            # Managed by roles/os_updates.
            [Unit]
            Description=Publish pending package updates daily

            [Timer]
            OnCalendar=daily
            RandomizedDelaySec=1h
            Persistent=true

            [Install]
            WantedBy=timers.target

    # After every dpkg run (unattended upgrades, a deploy's install, the maintenance
    # upgrade): measure again, so the metrics never show what an upgrade replaced until
    # the next daily run. --no-block: dpkg does not wait, and a start while one runs is
    # a no-op; || true: a host without systemd (a container) still installs packages.
    - name: Measure again after every package change
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/54deepops-os-updates-metrics
        content: |
          // Managed by DeepOps (roles/os_updates).
          DPkg::Post-Invoke { "systemctl start --no-block os-updates-metrics.service >/dev/null 2>&1 || true"; };
        owner: root
        group: root
        mode: "0644"
        validate: apt-config -c %s dump

    - name: Enable the pending-updates metrics timer and boot republish
      systemd_unit:
        name: "{{ item }}"
        enabled: true
        daemon_reload: true
      loop: [os-updates-metrics.timer, os-updates-metrics.publish.service]

    - name: Start the pending-updates metrics timer
      systemd_unit:
        name: os-updates-metrics.timer
        state: started

    # Now, not at the timer's next run (a day off): the command or the units this run
    # changed, and the source digests this deploy's record holds, show at once.
    - name: Measure the pending updates now
      ansible.builtin.include_role:
        name: textfile_keep
        tasks_from: refresh
      vars:
        textfile_keep_producers: [os-updates-metrics.service]

- name: Remove the pending-updates metrics when they are off
  when: not os_updates_metrics | bool
  block:
    - name: Check for the metrics timer
      ansible.builtin.stat:
        path: /etc/systemd/system/os-updates-metrics.timer
      register: os_updates_metrics_timer

    - name: Stop and disable the metrics timer and boot republish
      systemd_unit:
        name: "{{ item }}"
        enabled: false
        state: stopped
      loop: [os-updates-metrics.timer, os-updates-metrics.publish.service]
      when: os_updates_metrics_timer.stat.exists

    - name: Remove the metrics command, units and kept metrics
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /usr/local/sbin/os-updates-metrics
        - /etc/systemd/system/os-updates-metrics.service
        - /etc/systemd/system/os-updates-metrics.publish.service
        - /etc/systemd/system/os-updates-metrics.components.service
        - /etc/systemd/system/os-updates-metrics.timer
        - /etc/apt/apt.conf.d/54deepops-os-updates-metrics
        - /var/lib/os-updates
        - "{{ node_exporter_prom_dir }}/os-updates.prom"
        - "{{ node_exporter_prom_dir }}/os-updates-components.prom"
