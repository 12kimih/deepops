---
- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 600
  when: os_updates_policy == "security"

- name: Remove unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: absent
    purge: true
    lock_timeout: 600
  when: os_updates_policy == "off"

- name: Turn on the periodic unattended upgrade
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      // Managed by DeepOps (roles/os_updates).
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    owner: root
    group: root
    mode: "0644"
  when: os_updates_policy == "security"

- name: Limit unattended upgrades to security fixes
  ansible.builtin.template:
    src: 52deepops-unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/52deepops-unattended-upgrades
    owner: root
    group: root
    mode: "0644"
    validate: apt-config -c %s dump
  when: os_updates_policy == "security"

- name: Remove the unattended-upgrades settings
  ansible.builtin.file:
    path: /etc/apt/apt.conf.d/52deepops-unattended-upgrades
    state: absent
  when: os_updates_policy == "off"

- name: Create the needrestart drop-in directory
  ansible.builtin.file:
    path: /etc/needrestart/conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Set whether needrestart restarts services
  ansible.builtin.copy:
    dest: /etc/needrestart/conf.d/50-deepops.conf
    content: |
      # Managed by DeepOps (roles/os_updates).
      # a: restart services automatically, l: only list them
      $nrconf{restart} = '{{ "a" if os_updates_restart_services else "l" }}';
    owner: root
    group: root
    mode: "0644"

# A hold keeps a package back from every upgrade, the maintenance window's included.
- name: Read the apt holds
  ansible.builtin.command:
    argv: [apt-mark, showhold]
  register: os_updates_holds
  changed_when: false
  check_mode: false  # read-only; --check needs the result

- name: Release the holds that are not allowed
  ansible.builtin.command:
    argv: [apt-mark, unhold, "{{ item }}"]
  loop: >-
    {{ os_updates_holds.stdout_lines
       | reject('in', os_updates_holds.stdout_lines | select('search', os_updates_allowed_holds_regex) | list
                if os_updates_allowed_holds | length > 0 else [])
       | list }}
  vars:
    os_updates_allowed_holds_regex: >-
      {{ '^(' ~ (os_updates_allowed_holds | map('regex_escape') | map('replace', '\*', '.*')
                 | map('replace', '\?', '.') | join('|')) ~ ')$' }}
  changed_when: true

- name: Publish pending updates as metrics
  when: os_updates_metrics | bool
  block:
    - name: Install the pending-updates metrics command
      ansible.builtin.copy:
        src: os-updates-metrics
        dest: /usr/local/sbin/os-updates-metrics
        owner: root
        group: root
        mode: "0755"

    - name: Install the pending-updates metrics units
      ansible.builtin.copy:
        dest: "/etc/systemd/system/os-updates-metrics.{{ item.key }}"
        mode: "0644"
        content: "{{ item.value }}"
      loop: "{{ units | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      vars:
        units:
          service: |
            # Managed by roles/os_updates.
            [Unit]
            Description=Publish pending package updates as node_exporter metrics
            After=apt-daily.service

            [Service]
            Type=oneshot
            ExecStart=/usr/local/sbin/os-updates-metrics {{ os_updates_metrics_textfile_dir }}
            Nice=10
          # The textfile directory is usually tmpfs: republish the kept metrics at
          # boot so the series never go absent until the next measurement.
          publish.service: |
            # Managed by roles/os_updates.
            [Unit]
            Description=Republish the kept pending-update metrics after boot
            After=local-fs.target

            [Service]
            Type=oneshot
            ExecStart=/usr/local/sbin/os-updates-metrics --publish {{ os_updates_metrics_textfile_dir }}

            [Install]
            WantedBy=multi-user.target
          timer: |
            # Managed by roles/os_updates.
            [Unit]
            Description=Publish pending package updates daily

            [Timer]
            OnCalendar=daily
            OnBootSec=10min
            RandomizedDelaySec=1h
            Persistent=true

            [Install]
            WantedBy=timers.target

    # Under --check the unit files above are not written, so there is nothing to enable.
    - name: Enable the pending-updates metrics timer and boot republish
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
        daemon_reload: true
      loop: [os-updates-metrics.timer, os-updates-metrics.publish.service]
      when: not ansible_check_mode

    - name: Start the pending-updates metrics timer
      ansible.builtin.systemd:
        name: os-updates-metrics.timer
        state: started
      when: not ansible_check_mode

- name: Remove the pending-updates metrics when they are off
  when: not os_updates_metrics | bool
  block:
    - name: Check for the metrics timer
      ansible.builtin.stat:
        path: /etc/systemd/system/os-updates-metrics.timer
      register: os_updates_metrics_timer

    - name: Stop and disable the metrics timer and boot republish
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: false
        state: stopped
      loop: [os-updates-metrics.timer, os-updates-metrics.publish.service]
      when: os_updates_metrics_timer.stat.exists

    - name: Remove the metrics command, units and kept metrics
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /usr/local/sbin/os-updates-metrics
        - /etc/systemd/system/os-updates-metrics.service
        - /etc/systemd/system/os-updates-metrics.publish.service
        - /etc/systemd/system/os-updates-metrics.timer
        - /var/lib/os-updates
        - "{{ os_updates_metrics_textfile_dir }}/os-updates.prom"
