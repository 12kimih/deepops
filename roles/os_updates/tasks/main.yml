---
- name: Check the update policy
  ansible.builtin.assert:
    that: os_updates_policy in ["security", "off", "unmanaged"]
    fail_msg: "os_updates_policy must be security, off or unmanaged, not {{ os_updates_policy }}"

- name: Apply the update policy
  ansible.builtin.include_tasks: "{{ ansible_facts.os_family | lower }}.yml"
  when: os_updates_policy != "unmanaged"
