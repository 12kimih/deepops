---
- name: Check the component state
  ansible.builtin.assert:
    that: nhc_state in ['present', 'absent', 'kept']
    fail_msg: "nhc_state must be present, absent or kept, not {{ nhc_state }}."
    quiet: true

- name: Gather OS specific variables
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - files:
        - "{{ ansible_facts.distribution | lower }}-{{ ansible_facts.distribution_version }}.yml"
        - "{{ ansible_facts.distribution | lower }}.yml"
        - "{{ ansible_facts.os_family | lower }}.yml"
      paths:
        - ../vars
      skip: true
  tags:
    - always

- name: "Make NHC {{ nhc_state }}"
  ansible.builtin.include_tasks: "{{ nhc_state }}.yml"
  when: nhc_state != 'kept'
