---
- name: Gather OS specific variables
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - files:
        - "{{ ansible_facts.distribution | lower }}-{{ ansible_facts.distribution_version }}.yml"
        - "{{ ansible_facts.distribution | lower }}.yml"
        - "{{ ansible_facts.os_family | lower }}.yml"
      paths:
        - ../vars
      skip: true
  tags:
    - always

# An nhc on disk is not ours at this version (a distribution or hand install, or an
# older nhc_version): only the record of our last build says so.
- name: Check what the installed NHC was built from
  ansible.builtin.include_role:
    name: build_record
  vars:
    build_record_path: "{{ nhc_build_record }}"
    build_record_key: "{{ nhc_build_key }}"
    build_record_installed: ["{{ nhc_program }}"]
    build_record_force: "{{ nhc_force_reinstall }}"

- name: Decide whether NHC needs building
  ansible.builtin.set_fact:
    nhc_build: "{{ build_record_stale }}"

- name: Install build dependencies
  ansible.builtin.package:
    name: "{{ item }}"
    state: present
  with_items: "{{ nhc_build_deps }}"

- name: Ensure build dir exists
  ansible.builtin.file:
    path: "{{ nhc_build_dir }}"
    state: "directory"
    owner: "root"
    group: "root"
    mode: "0755"
  when: nhc_build

- name: Fetch and unpack the NHC source
  ansible.builtin.include_role:
    name: download
  vars:
    download_url: "{{ nhc_src_url }}"
    download_checksum: "{{ nhc_checksums[nhc_version] | default('') }}"
    download_dest: "{{ nhc_build_dir }}/{{ nhc_src_url | basename }}"
    download_unpack: "{{ nhc_build_dir }}"
  when: nhc_build

- name: Configure nhc
  ansible.builtin.command: "{{ nhc_configure }}"
  args:
    chdir: "{{ nhc_extract_dir }}"
  when: nhc_build

- name: Test nhc src
  ansible.builtin.command: "{{ nhc_test }}"
  args:
    chdir: "{{ nhc_extract_dir }}"
  when: nhc_build and nhc_run_test

- name: Make and install nhc
  ansible.builtin.command: "{{ nhc_make }}"
  args:
    chdir: "{{ nhc_extract_dir }}"
  when: nhc_build

- name: Record what NHC was built from
  ansible.builtin.include_role:
    name: build_record
    tasks_from: write
  vars:
    build_record_path: "{{ nhc_build_record }}"
    build_record_key: "{{ nhc_build_key }}"
  when: nhc_build

- name: Add deepops checks to nhc
  ansible.builtin.copy:
    src: "deepops.nhc"
    dest: "{{ nhc_config_dir }}/nhc/scripts/deepops.nhc"
    owner: "root"
    group: "root"
    mode: "0644"

- name: Install NHC config
  ansible.builtin.template:
    src: "{{ nhc_config_template }}"
    dest: "{{ nhc_config_dir }}/nhc/nhc.conf"
    owner: "root"
    group: "root"
    mode: "0644"

- name: Create sysconfig dir
  ansible.builtin.file:
    path: "{{ nhc_sysconfig_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Add sysconfig to use slurm
  ansible.builtin.template:
    src: "{{ nhc_sysconfig_template }}"
    dest: "{{ nhc_sysconfig_dir }}/nhc"
    owner: root
    group: root
    mode: "0644"

# NHC picks its directories at run time (by version, distribution and its own path),
# not from the build: a settings file it never reads loses NHC_RM, and a helper path
# that does not exist means a failed check never drains the node. So the installed nhc
# is asked where it looks, as root as slurmd runs it.
- name: Read the version and directories the installed NHC uses
  ansible.builtin.command:
    argv: ["{{ nhc_program }}", -V, -V, -V]
  register: nhc_info
  changed_when: false
  check_mode: false  # read-only; --check needs the result
  when: not (ansible_check_mode and nhc_build)

- name: Look for the helper that drains a node
  ansible.builtin.stat:
    path: "{{ nhc_libexec_dir }}/nhc/node-mark-offline"
  register: nhc_offline_helper
  when: nhc_info is not skipped

- name: Refuse an NHC that is not this version or reads other directories
  ansible.builtin.assert:
    that:
      - nhc_info.stdout is search('^LBNL NHC version ' ~ (nhc_version | regex_escape) ~ '$', multiline=True)
      - "' SYSCONFIGDIR=\"' ~ nhc_sysconfig_dir ~ '\"' in nhc_info.stdout"
      - "' LIBEXECDIR=\"' ~ nhc_libexec_dir ~ '\"' in nhc_info.stdout"
      - "' CONFDIR=\"' ~ nhc_config_dir ~ '/nhc\"' in nhc_info.stdout"
      - "' RM \"slurm\"' in nhc_info.stdout"
      - "'OFFLINE_NODE=\"' ~ nhc_libexec_dir ~ '/nhc/node-mark-offline\"' in nhc_info.stdout"
      - nhc_offline_helper.stat.executable | default(false)
    fail_msg: >-
      {{ nhc_program }} is not NHC {{ nhc_version }} reading {{ nhc_sysconfig_dir }}/nhc
      (NHC_RM=slurm), {{ nhc_config_dir }}/nhc and helpers in {{ nhc_libexec_dir }}/nhc.
      It reports: {{ nhc_info.stdout_lines | select('search', 'version|RM |DIR=|OFFLINE_NODE') | join(' ') }}
    quiet: true
  when: nhc_info is not skipped
