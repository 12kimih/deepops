---
nhc_version: "1.4.3"
nhc_src_url: "https://github.com/mej/nhc/releases/download/{{ nhc_version }}/lbnl-nhc-{{ nhc_version }}.tar.xz"
nhc_install_dir: "/usr"
nhc_config_dir: "/etc"
nhc_libexec_dir: "/usr/libexec"
nhc_build_dir: "/opt/deepops/build/nhc"
nhc_sysconfig_dir: "/etc/sysconfig"

nhc_extract_dir: "{{ nhc_build_dir }}/lbnl-nhc-{{ nhc_version }}"
nhc_configure: "./configure --prefix={{ nhc_install_dir }} --sysconfdir={{ nhc_config_dir }} --libexecdir={{ nhc_libexec_dir }}"
nhc_test: "make test"
nhc_run_test: false
nhc_make: "make install"

nhc_config_template: "nhc.conf.j2"
nhc_sysconfig_template: "sysconfig_nhc.j2"

nhc_force_reinstall: false
nhc_config: "nhc.conf.j2"

# Shared filesystems NHC asserts are mounted read-write, so that a node which lost one
# is drained instead of collecting failed jobs. Derived from the NFS client mounts to
# keep the check list in step with what the nfs role actually mounts; set it explicitly
# to check a filesystem DeepOps does not manage.
nhc_check_mounts: "{{ nfs_mounts | default([]) | map(attribute='mountpoint') | list }}"
