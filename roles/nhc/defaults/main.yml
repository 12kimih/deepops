---
# 1.5+ finds its settings in /etc/sysconfig and its helpers in /usr/libexec on every
# distribution; 1.4 used /etc/default and /usr/lib on Debian and Ubuntu, so the
# settings this role writes were never read and a failed check never drained the node.
nhc_version: "1.5.1"
nhc_src_url: "https://github.com/mej/nhc/releases/download/{{ nhc_version }}/lbnl-nhc-{{ nhc_version }}.tar.gz"
# The release tarball per version, as GitHub publishes for the release asset
# (roles/download); add one when changing nhc_version.
nhc_checksums:
  "1.5.1": "sha256:ad5bd56938970a594937644d3b60a1629f41ab962a5a397d99be0b20b1c97354"
nhc_config_dir: "/etc"

# Where NHC looks for its helpers and its settings file: NHC's own defaults, which the
# role checks the installed nhc reports (nhc -VVV), since nothing in the build sets them.
nhc_libexec_dir: "/usr/libexec"
nhc_build_dir: "/opt/deepops/build/nhc"
nhc_sysconfig_dir: "/etc/sysconfig"

nhc_extract_dir: "{{ nhc_build_dir }}/lbnl-nhc-{{ nhc_version }}"
# --localstatedir: the default ($prefix/var) creates /usr/var.
nhc_configure: "./configure --prefix={{ nhc_install_dir }} --sysconfdir={{ nhc_config_dir }} --libexecdir={{ nhc_libexec_dir }} --localstatedir=/var"
nhc_test: "make test"
nhc_run_test: false
nhc_make: "make install"

nhc_config_template: "nhc.conf.j2"
nhc_sysconfig_template: "sysconfig_nhc.j2"

# Rebuild NHC even when the installed build matches its record.
nhc_force_reinstall: false
# What the installed NHC was built from (roles/build_record).
nhc_build_record: "{{ nhc_program }}.built-from"
nhc_build_key: "nhc {{ nhc_version }}: {{ nhc_configure }}"

# Shared filesystems NHC asserts are mounted read-write, so that a node which lost one
# is drained instead of collecting failed jobs. Derived from the NFS client mounts to
# keep the check list in step with what the nfs role actually mounts; set it explicitly
# to check a filesystem DeepOps does not manage.
nhc_check_mounts: "{{ nfs_mounts | default([]) | map(attribute='mountpoint') | list }}"
