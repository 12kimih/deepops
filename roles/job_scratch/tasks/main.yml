---
- name: Check the component state
  ansible.builtin.assert:
    that: job_scratch_state in ['present', 'absent', 'kept']
    fail_msg: "job_scratch_state must be present, absent or kept, not {{ job_scratch_state }}."
    quiet: true

- name: "Make the job scratch filesystem {{ job_scratch_state }}"
  ansible.builtin.include_tasks: "{{ job_scratch_state }}.yml"
  when: job_scratch_state != 'kept'
