  "nvidia-mig-manager-0.15.2-1.x86_64.rpm": "sha256:190ae59c0b7b27c4e37bc7f8a8c0abc7819249015849e32f068094c2722f77b5"
  "nvidia-mig-manager_0.15.2-1_amd64.deb": "sha256:b792b6e3e3c3daaf343e49b44a90b7c28dc7e61a53e1460c809620dbf376f47d"
  "nvidia-mig-manager_0.15.2-1_arm64.deb": "sha256:66275e688319a6b18487ec241b20908fbbf33a0f0318f1017c065d3e084c9b64"
