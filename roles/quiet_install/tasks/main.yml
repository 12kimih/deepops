---
# Debian starts a daemon the moment its package is installed. For one that must not
# run half-configured (ypserv before its database, ypbind before its domain),
# policy-rc.d (exit 101) holds the start back during the install. It blocks every
# service start on the host while present, so it is written only for an install that
# will happen, never over a site's own policy-rc.d (which stays in charge), and removed
# in `always`, so a failed install cannot leave later upgrades unable to restart
# anything. RHEL does not start daemons on install; there it is a plain install.
#   - ansible.builtin.include_role:
#       name: quiet_install
#     vars:
#       quiet_install_packages: [ypserv, yp-tools, rpcbind]
- name: Install the packages (RHEL family)
  ansible.builtin.package:
    name: "{{ quiet_install_packages }}"
    state: present
  when: ansible_facts.os_family != "Debian"

- name: Find the packages not yet installed
  ansible.builtin.package_facts:
  when: ansible_facts.os_family == "Debian"

- name: Install the packages without starting their daemons
  when:
    - ansible_facts.os_family == "Debian"
    - quiet_install_missing | length > 0
  vars:
    quiet_install_missing: "{{ quiet_install_packages | reject('in', ansible_facts.packages) | list }}"
  block:
    - name: Hold back daemon starts during the install
      ansible.builtin.copy:
        src: policy-rc.d
        dest: /usr/sbin/policy-rc.d
        owner: root
        group: root
        mode: "0700"
        force: false
      register: quiet_install_policy

    - name: Install {{ quiet_install_missing | join(', ') }}
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        name: "{{ quiet_install_missing }}"
        state: present
  always:
    - name: Remove the hold on daemon starts
      ansible.builtin.file:
        path: /usr/sbin/policy-rc.d
        state: absent
      when: quiet_install_policy is defined and quiet_install_policy is changed
