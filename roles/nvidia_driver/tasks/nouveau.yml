---
# The driver's packages keep nouveau (and nova) from loading themselves
# (/lib/modprobe.d/nvidia-graphics-drivers.conf). The copies hand setups added before
# go, each told by its text, only while that package file blacklists nouveau: the block
# appended to kmod's /etc/modprobe.d/blacklist.conf (which then matches what kmod
# ships), a blacklist-nouveau.conf saying nothing else, and an empty nvidia.conf.
- name: Read the driver package's module blacklist
  ansible.builtin.slurp:
    src: /lib/modprobe.d/nvidia-graphics-drivers.conf
  register: nvidia_driver_pkg_blacklist
  failed_when: false

- name: Remove the hand copies of the nouveau blacklist
  when: >-
    nvidia_driver_pkg_blacklist.content is defined
    and 'blacklist nouveau' in (nvidia_driver_pkg_blacklist.content | b64decode).splitlines()
  block:
    - name: Remove the nouveau block appended to kmod's blacklist
      ansible.builtin.replace:
        path: /etc/modprobe.d/blacklist.conf
        regexp: '(?<=\n)\n?(?:^(?:blacklist (?:lbm-)?nouveau|options nouveau modeset=0|alias (?:lbm-)?nouveau [o0]ff)[ \t]*\n)+'
        replace: ""

    - name: Read the other nouveau and nvidia modprobe files
      ansible.builtin.slurp:
        src: "/etc/modprobe.d/{{ item }}"
      loop: [blacklist-nouveau.conf, nvidia.conf]
      register: nvidia_driver_modprobe_copies
      failed_when: false

    - name: Remove those saying nothing but the nouveau blacklist, or nothing
      ansible.builtin.file:
        path: "/etc/modprobe.d/{{ item.item }}"
        state: absent
      loop: "{{ nvidia_driver_modprobe_copies.results | selectattr('content', 'defined') | list }}"
      loop_control:
        label: "{{ item.item }}"
      when: >-
        (item.content | b64decode).splitlines() | map('trim') | reject('equalto', '') | reject('match', '#')
        | reject('match', '^(blacklist nouveau|options nouveau modeset=0|alias nouveau off)$') | list | length == 0
