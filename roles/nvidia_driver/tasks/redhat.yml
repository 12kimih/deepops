---
# RHEL/Rocky: install the driver from NVIDIA's cuda-rhel repository using dnf
# module streams. The "-open" stream + the nvidia-open meta installs the open
# kernel modules; "-dkms" + cuda-drivers installs the proprietary modules.
# https://docs.nvidia.com/datacenter/tesla/driver-installation-guide/red-hat-enterprise-linux.html
- name: Determine the NVIDIA driver module stream and package (RHEL/Rocky)
  ansible.builtin.set_fact:
    nvidia_driver_rhel_stream_resolved: >-
      {{ nvidia_driver_rhel_module_stream if (nvidia_driver_rhel_module_stream | length > 0)
         else 'nvidia-driver:' ~ nvidia_driver_branch
              ~ ('-open' if (nvidia_driver_kernel_modules == 'open') else '-dkms') }}
    nvidia_driver_rhel_package_resolved: >-
      {{ nvidia_driver_rhel_package if (nvidia_driver_rhel_package | length > 0)
         else ('nvidia-open' if (nvidia_driver_kernel_modules == 'open') else 'cuda-drivers') }}

- name: Add the CUDA repository (RHEL/Rocky)
  ansible.builtin.include_role:
    name: package_repos
    tasks_from: cuda

# CodeReady Builder / CRB provides build deps (e.g. dkms). On Rocky/Alma this is
# enabled with dnf config-manager; on RHEL proper it is the codeready-builder
# repo enabled via subscription-manager (override nvidia_driver_rhel_crb_repo).
- name: Read the enabled repositories (RHEL/Rocky)
  ansible.builtin.command:
    argv: [dnf, -q, repolist, --enabled]
  register: nvidia_driver_rhel_repos
  changed_when: false
  check_mode: false  # read-only; --check needs the result

- name: Enable the CodeReady Builder (CRB) repository (RHEL/Rocky)
  change_command:
    argv: [dnf, config-manager, --set-enabled, "{{ nvidia_driver_rhel_crb_repo }}"]
  when: >-
    nvidia_driver_rhel_crb_repo not in
    (nvidia_driver_rhel_repos.stdout_lines | map('split') | map('first') | list)

# Per the official guide, kernel-devel is pinned to the running kernel while
# kernel-headers is the unversioned arch package (a single version that tracks
# the userspace ABI, not the running kernel). Pinning kernel-headers to
# ansible_facts.kernel can fail to resolve when no matching version is published.
# https://docs.nvidia.com/datacenter/tesla/driver-installation-guide/red-hat-enterprise-linux.html
- name: Install matching kernel headers and development packages (RHEL/Rocky)
  repo_package:
    use: dnf
    name:
      - "kernel-devel-{{ ansible_facts.kernel }}"
      - "kernel-headers"
    state: present

# Gather installed packages so the purge can be skipped when the target driver is
# already present. Without this guard the find/purge below would match the driver
# this role just installed and remove it on every re-run, forcing a reboot loop.
- name: Gather installed package facts (RHEL/Rocky)
  ansible.builtin.package_facts:
    manager: rpm
  when: nvidia_driver_purge_existing | bool

# A switch: the target is not installed, or the installed one is of another branch
# (nvidia-open / cuda-drivers carry no branch in their names).
- name: Decide whether the driver switches (RHEL/Rocky)
  ansible.builtin.set_fact:
    nvidia_driver_switch: >-
      {{ (nvidia_driver_rhel_package_resolved | trim) not in ansible_facts.packages
         or ansible_facts.packages[nvidia_driver_rhel_package_resolved | trim][0].version is not match(nvidia_driver_branch ~ '\.') }}
  when: nvidia_driver_purge_existing | bool

- name: Find pre-existing NVIDIA driver packages (RHEL/Rocky)
  ansible.builtin.shell:
    cmd: >-
      rpm -qa --qf '%{NAME}\n' 'nvidia-*' 'kmod-nvidia-*' 'cuda-drivers*' 2>/dev/null
      | grep -vE 'container' || true
  register: nvidia_driver_existing_packages
  changed_when: false
  check_mode: false
  when:
    - nvidia_driver_purge_existing | bool
    - nvidia_driver_switch | bool

- name: Remove the other NVIDIA driver packages (RHEL/Rocky)
  ansible.builtin.include_tasks: purge.yml
  vars:
    nvidia_driver_purge_target: "{{ nvidia_driver_rhel_package_resolved }}"
    nvidia_driver_purge_packages: "{{ nvidia_driver_existing_packages.stdout_lines | default([]) }}"

- name: Reset the NVIDIA driver dnf module (RHEL/Rocky)
  change_command:
    argv: [dnf, -y, module, reset, nvidia-driver]
  when:
    - nvidia_driver_purge_existing | bool
    - nvidia_driver_switch | bool

- name: Read the enabled NVIDIA driver module stream (RHEL/Rocky)
  ansible.builtin.command:
    argv: [dnf, -q, module, list, --enabled, nvidia-driver]
  register: nvidia_driver_rhel_module
  changed_when: false
  failed_when: false  # none enabled yet: dnf says so and exits non-zero
  check_mode: false  # read-only; --check needs the result

- name: Enable the NVIDIA driver dnf module stream (RHEL/Rocky)
  change_command:
    argv: [dnf, -y, module, enable, "{{ nvidia_driver_rhel_stream_resolved }}"]
  when: >-
    nvidia_driver_rhel_module.stdout is not search('(?m)^nvidia-driver\\s+'
    ~ (nvidia_driver_rhel_stream_resolved.split(':') | last | regex_escape) ~ '\\s.*\\[e\\]')

- name: Install the NVIDIA driver (RHEL/Rocky)
  repo_package:
    use: dnf
    name: "{{ nvidia_driver_rhel_package_resolved }}"
    state: present
  register: nvidia_driver_install

# Fabric Manager (opt-in, NVSwitch HGX), branch-matched to the driver. Through 615 the
# enabled stream's fm profile names the packages of its branch (nvidia-fabric-manager and
# libnvidia-nscq-<branch> until 575, unversioned from 580); the 620 streams have no fm
# profile and name them directly.
# https://docs.nvidia.com/datacenter/tesla/driver-installation-guide/optional-components.html
- name: Install NVIDIA Fabric Manager and NSCQ (RHEL/Rocky)
  repo_package:
    use: dnf
    name: >-
      {{ ['@' ~ (nvidia_driver_rhel_stream_resolved | trim) ~ '/fm']
         if nvidia_driver_branch | int <= 615
         else ['nvidia-fabricmanager-direct', 'libnvidia-nscq'] }}
    state: present
  when: nvidia_driver_fabricmanager | bool
