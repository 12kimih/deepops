---
# The driver capabilities beyond compute and utility (nvidia_driver_capabilities, in
# NVIDIA's own names): graphics (OpenGL, EGL, Vulkan without a display) and video
# (NVENC, NVDEC). Apart from the driver's install, so adding one never reads as a
# driver change (they are libraries: no reboot is asked), and after it, so a branch
# switch (which purges every libnvidia-*) gets them back at the new branch.
#
# The Ubuntu archive's server set is headless: each capability is its own package
# there, the driver's own build at the same version (libnvidia-gl-<branch>,
# libnvidia-decode-, libnvidia-encode-). NVIDIA's repos (Ubuntu nvidia_repo, RHEL)
# install the full driver, every capability included, so there only the graphics
# loaders are added.
- name: Check the driver capabilities
  ansible.builtin.assert:
    that:
      - "'compute' in nvidia_driver_capabilities and 'utility' in nvidia_driver_capabilities"
      - nvidia_driver_capabilities | difference(nvidia_driver_capability_names) | length == 0
    fail_msg: >-
      nvidia_driver_capabilities holds compute and utility, plus any of graphics and
      video, not {{ nvidia_driver_capabilities }} (display needs an X server: render
      offscreen with graphics).
    quiet: true

- name: Install the driver capabilities
  ansible.builtin.package:
    name: "{{ nvidia_driver_capability_packages }}"
    state: present
  when: nvidia_driver_capability_packages | length > 0

# A capability taken out: its NVIDIA libraries go; the loaders stay, other software
# uses them.
- name: Remove the driver capabilities no longer wanted
  ansible.builtin.include_role:
    name: host_baseline
    tasks_from: absent
  vars:
    host_baseline_absent_packages: "{{ nvidia_driver_capability_unwanted }}"
  when: nvidia_driver_capability_unwanted | length > 0
