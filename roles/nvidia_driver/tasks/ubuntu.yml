---
# Two install methods, selected by nvidia_driver_install_method:
#  - ubuntu_repo (default): the Canonical archive, as ubuntu-drivers installs it: the
#    signed precompiled kernel modules for the running kernel flavour
#    (linux-modules-nvidia-{branch}-server-open-{flavour}, which follow kernel upgrades)
#    with the full driver (nvidia-driver-{branch}-server-open: CUDA, OpenGL/EGL/Vulkan,
#    NVENC/NVDEC, the tools). The modules package provides nvidia-dkms-{branch}-..., so
#    installed together nothing is compiled on the node. nvidia_driver_headless takes
#    the compute-only userspace instead (nvidia-headless-no-dkms-..., nvidia-utils-...).
#    https://ubuntu.com/server/docs/how-to/graphics/install-nvidia-drivers/
#  - nvidia_repo: NVIDIA's CUDA apt repo (cuda-keyring + nvidia-open / cuda-drivers),
#    branch-pinned with nvidia-driver-pinning-{branch} (installed FIRST).
#    https://docs.nvidia.com/datacenter/tesla/driver-installation-guide/ubuntu.html

- name: Gather installed package facts (Ubuntu)
  ansible.builtin.package_facts:
    manager: apt

# Resolved up front so the purge can be skipped when the driver is already installed
# (re-runs stay idempotent). The modules are built for the kernel flavour the host
# boots (kernel_flavour: the HWE kernel's when its metapackage is installed).
- name: Determine the NVIDIA driver packages (Ubuntu, Canonical archive)
  ansible.builtin.set_fact:
    nvidia_driver_packages_resolved: >-
      {{ [nvidia_driver_package] if nvidia_driver_package | length > 0 else
         ['linux-modules-nvidia-' ~ _flavoured ~ '-' ~ _kernel_flavour]
         + (['nvidia-headless-no-dkms-' ~ _flavoured, 'nvidia-utils-' ~ _branch]
            if nvidia_driver_headless | bool else ['nvidia-driver-' ~ _flavoured]) }}
  vars:
    _branch: "{{ nvidia_driver_ubuntu_branch }}"
    _flavoured: "{{ _branch ~ ('-open' if nvidia_driver_kernel_modules == 'open' else '') }}"
    _kernel_flavour: "{{ ansible_facts.packages | kernel_flavour(ansible_facts.kernel) }}"
  when: nvidia_driver_install_method == 'ubuntu_repo'

# The package whose presence (at the branch) means this driver is installed.
- name: Set the target NVIDIA driver package name (Ubuntu)
  ansible.builtin.set_fact:
    nvidia_driver_target_package: >-
      {{ nvidia_driver_packages_resolved[0 if nvidia_driver_package | length > 0 else 1]
         if nvidia_driver_install_method == 'ubuntu_repo'
         else ('nvidia-open' if nvidia_driver_kernel_modules == 'open' else 'cuda-drivers') }}

# The NVIDIA repository's package names carry no branch, so there a switch is told from
# the target: not installed, or of another branch. A switch removes every NVIDIA
# package first (a new pin alone never replaces an installed nvidia-open).
- name: Decide whether the driver switches (Ubuntu, nvidia_repo)
  ansible.builtin.set_fact:
    nvidia_driver_switch: >-
      {{ (nvidia_driver_target_package | trim) not in ansible_facts.packages
         or ansible_facts.packages[nvidia_driver_target_package | trim][0].version is not match(nvidia_driver_branch ~ '\.') }}
  when:
    - nvidia_driver_purge_existing | bool
    - nvidia_driver_install_method == 'nvidia_repo' or nvidia_driver_package | length > 0

# The Canonical archive's precompiled modules (linux-modules-, linux-objects-,
# linux-signatures-nvidia-*) count too, or the old branch's module stays on disk.
- name: Find pre-existing NVIDIA driver packages (Ubuntu)
  ansible.builtin.shell:
    cmd: >-
      dpkg-query -W -f='${db:Status-Abbrev} ${binary:Package}\n' 2>/dev/null
      | awk '$1 ~ /^.i/ {print $2}'
      | grep -E '^(nvidia-|libnvidia-|linux-(modules|objects|signatures)-nvidia-)'
      | grep -vE 'container' || true
  register: nvidia_driver_existing_packages
  changed_when: false
  check_mode: false  # read-only; --check needs the result
  when: nvidia_driver_purge_existing | bool

# The archive's names carry the branch and the flavour, so what is not the target's is
# told package by package (plugins/filter/nvidia.py, nvidia_driver_leftovers): another
# branch, flavour or architecture goes before the install, the other userspace (headless
# or full) of the same branch after it. The running driver is never removed to be
# installed again.
- name: Note the packages that are not the target driver's (Ubuntu)
  ansible.builtin.set_fact:
    nvidia_driver_leftovers: >-
      {{ _installed | nvidia_driver_leftovers(nvidia_driver_ubuntu_branch, nvidia_driver_kernel_modules,
                                              nvidia_driver_headless | bool, ansible_facts.architecture | deb_architecture)
         if nvidia_driver_install_method == 'ubuntu_repo' and nvidia_driver_package | length == 0
         else {'before': _installed if nvidia_driver_switch | default(false) | bool else [], 'after': []} }}
  vars:
    _installed: "{{ nvidia_driver_existing_packages.stdout_lines | default([]) }}"

- name: Remove the other NVIDIA driver packages (Ubuntu)
  ansible.builtin.include_tasks: purge.yml
  vars:
    nvidia_driver_purge_target: "{{ nvidia_driver_target_package }}"
    nvidia_driver_purge_packages: "{{ nvidia_driver_leftovers.before }}"

# --- Method: ubuntu_repo (Canonical archive) ---------------------------------
# The CUDA repository (added for DCGM) also publishes driver packages, some newer than
# the archive's (fabricmanager, nscq): with the archive's driver they must never come
# from there, or an upgrade mixes two builds of one branch, in any architecture
# (apt_pin_packages: an i386 build let in once held its amd64 twin's version). The
# NVIDIA packages that are not the driver's are exempt, in a record ahead of the pin:
# apt applies the first record that matches a version, in file order too, so no other
# role's file could lift this one.
- name: Take the NVIDIA driver packages from the Ubuntu archive only
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/deepops-nvidia-driver
    owner: root
    group: root
    mode: "0644"
    content: |
      # roles/nvidia_driver (nvidia_driver_install_method: ubuntu_repo)
      # Not the driver's: as the repository offers them.
      Package: {{ nvidia_driver_archive_pin_exempt | apt_pin_packages }}
      Pin: origin developer.download.nvidia.com
      Pin-Priority: 500

      Package: {{ '*nvidia*' | apt_pin_packages }}
      Pin: origin developer.download.nvidia.com
      Pin-Priority: -1
  when: nvidia_driver_install_method == 'ubuntu_repo'

- name: Drop the archive-only pin (Ubuntu, nvidia_repo)
  ansible.builtin.file:
    path: /etc/apt/preferences.d/deepops-nvidia-driver
    state: absent
  when: nvidia_driver_install_method == 'nvidia_repo'

# The archive builds a driver's prebuilt modules for the newest kernel only: a driver
# newer than the modules of the running kernel would pull that kernel in with it, on
# the nodes that need it and not the others. Kernels change on every node at once.
- name: Install the NVIDIA driver from the Ubuntu archive
  repo_package:
    use: apt
    name: "{{ nvidia_driver_packages_resolved }}"
    state: present
    install_recommends: false
    update_cache: true
    refuse: ["linux-image-"]
    refuse_reason: >-
      a new kernel comes on every node at once, in the maintenance upgrade
      (playbooks/utilities/apt-upgrade.yml), which brings the driver's modules for it;
      run that, then this playbook
  register: nvidia_driver_install_archive
  when: nvidia_driver_install_method == 'ubuntu_repo'

- name: Remove the other userspace of the branch (Ubuntu)
  ansible.builtin.include_tasks: purge.yml
  vars:
    nvidia_driver_purge_target: "{{ nvidia_driver_target_package }}"
    nvidia_driver_purge_packages: "{{ nvidia_driver_leftovers.after }}"
  when: nvidia_driver_install_method == 'ubuntu_repo'

# --- Method: nvidia_repo (NVIDIA CUDA apt repo) ------------------------------
- name: Add the CUDA repository (Ubuntu, nvidia_repo)
  ansible.builtin.include_role:
    name: package_repos
    tasks_from: cuda
  when: nvidia_driver_install_method == 'nvidia_repo'

# Branch is pinned via a separate package installed first; from the 590 series
# Ubuntu drops the branch suffix from the driver package name.
# https://docs.nvidia.com/datacenter/tesla/driver-installation-guide/version-locking.html
- name: Pin the NVIDIA driver branch (Ubuntu, nvidia_repo)
  repo_package:
    use: apt
    name: "nvidia-driver-pinning-{{ nvidia_driver_branch }}"
    state: present
    update_cache: true
  when: nvidia_driver_install_method == 'nvidia_repo'

- name: Install the NVIDIA driver from the NVIDIA repo (Ubuntu, nvidia_repo)
  repo_package:
    use: apt
    name: "{{ 'nvidia-open' if nvidia_driver_kernel_modules == 'open' else 'cuda-drivers' }}"
    state: present
    update_cache: true
  register: nvidia_driver_install_repo
  when: nvidia_driver_install_method == 'nvidia_repo'

# One result for main.yml, whichever method ran (a skipped task's register would
# otherwise overwrite the one that installed).
- name: Note whether the driver was installed now (Ubuntu)
  ansible.builtin.set_fact:
    nvidia_driver_install: "{{ nvidia_driver_install_archive if nvidia_driver_install_method == 'ubuntu_repo' else nvidia_driver_install_repo }}"

- name: Remove the nouveau blacklists the packages make redundant (Ubuntu)
  ansible.builtin.include_tasks: nouveau.yml

# --- Fabric Manager (opt-in, NVSwitch HGX) -----------------------------------
- name: Install NVIDIA Fabric Manager and NSCQ (Ubuntu)
  repo_package:
    use: apt
    name: "{{ ['nvidia-fabricmanager', 'libnvidia-nscq'] | map('regex_replace', '$', _suffix) | list }}"
    state: present
    update_cache: true
  vars:
    # NVIDIA's repo drops the branch from these names from the 580 series on (the pin
    # selects the branch); the Canonical archive keeps it (nvidia-fabricmanager-580).
    _suffix: "{{ '' if nvidia_driver_install_method == 'nvidia_repo' and nvidia_driver_branch | int >= 580 else '-' ~ nvidia_driver_branch }}"
  when: nvidia_driver_fabricmanager | bool
