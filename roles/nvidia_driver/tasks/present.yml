---
- name: Record what this component installs
  ansible.builtin.include_role:
    name: component_record
  vars:
    component_record_name: nvidia_driver
    component_record_action: begin
    component_record_items: "{{ nvidia_driver_items }}"

- name: Install the NVIDIA driver (Ubuntu)
  ansible.builtin.include_tasks: ubuntu.yml
  when: ansible_facts.distribution == 'Ubuntu'

- name: Install the NVIDIA driver (RHEL/Rocky)
  ansible.builtin.include_tasks: redhat.yml
  when: ansible_facts.os_family == 'RedHat'

# NVIDIA's graphics libraries plug into the distribution's dispatchers (glvnd's libEGL,
# libGL, libGLX, libOpenGL, libGLESv2; the Vulkan loader), which the driver packages do
# not depend on: pulled in by something else, they were auto-installed, and removing that
# (a desktop) autoremoved them, taking EGL, OpenGL and Vulkan from every job. Installed by
# name they are the host's own; never in the component's record, other software needs
# them too. Apart from the driver's install: libraries, no reboot.
- name: Install the graphics dispatchers the driver plugs into
  repo_package:
    name: "{{ nvidia_driver_graphics_dispatchers }}"
    state: present
  when: nvidia_driver_graphics | bool

# A reboot is needed when the running module is not the one on disk, by version and by
# flavor (plugins/filter/nvidia.py): a first install, a new version, open <-> proprietary.
# Not for every install: packages reinstalled at the running version (headless -> full)
# load nothing new. On re-runs this re-fires a reboot that was skipped.
- name: Read the running NVIDIA kernel module version
  ansible.builtin.command: cat /proc/driver/nvidia/version
  register: nvidia_driver_loaded_version
  changed_when: false
  failed_when: false
  check_mode: false

- name: Read the on-disk NVIDIA kernel module version
  ansible.builtin.command: modinfo -F version nvidia
  register: nvidia_driver_ondisk_version
  changed_when: false
  failed_when: false
  check_mode: false

- name: Read the on-disk NVIDIA kernel module license (open or proprietary)
  ansible.builtin.command: modinfo -F license nvidia
  register: nvidia_driver_ondisk_license
  changed_when: false
  failed_when: false
  check_mode: false

# A run compares the module on disk with the loaded one. A preview installs nothing, so
# it asks what the install would bring: a reboot only for a package that puts a kernel
# module on disk (an apt preview names them, repo_package_installs); where the preview
# cannot name them (dnf, a repository not indexed yet), any install.
- name: Determine whether the NVIDIA driver needs a reboot
  ansible.builtin.set_fact:
    nvidia_driver_reboot_needed: >-
      {{ (ansible_check_mode and nvidia_driver_install is defined and
          ((nvidia_driver_install.repo_package_installs | nvidia_module_packages | length > 0)
           if nvidia_driver_install.repo_package_installs is defined
           else nvidia_driver_install is changed)) or
         (nvidia_driver_module_on_disk | length > 0 and
          nvidia_driver_module_on_disk != (nvidia_driver_loaded_version.stdout | default('') | nvidia_module_loaded)) }}

- name: Ask for a reboot to load the new NVIDIA kernel module
  ansible.builtin.include_role:
    name: maintenance
    tasks_from: reboot_request
  vars:
    maintenance_reason: "load the new NVIDIA driver"
  when: nvidia_driver_reboot_needed | bool

# Post-installation actions, run after the reboot so the new module is loaded.
# https://docs.nvidia.com/datacenter/tesla/driver-installation-guide/post-installation-actions.html

# Re-read the loaded version AFTER the possible reboot and confirm it now matches the
# on-disk module. Persistence/verify run only when the module is loaded and current.
# No module on disk after the install, or a module still not loaded with no reboot
# pending (so it failed to load), fails the host; a pending reboot is stated.
- name: Re-read the running NVIDIA kernel module version (after any reboot)
  ansible.builtin.command: cat /proc/driver/nvidia/version
  register: nvidia_driver_loaded_version_post
  changed_when: false
  failed_when: false
  check_mode: false

- name: Determine whether the NVIDIA kernel module is loaded and current
  ansible.builtin.set_fact:
    nvidia_driver_module_loaded: >-
      {{ nvidia_driver_module_on_disk | length > 0 and
         nvidia_driver_module_on_disk == (nvidia_driver_loaded_version_post.stdout | default('') | nvidia_module_loaded) }}

# Under --check nothing was installed, so an empty modinfo proves nothing there.
- name: Require an NVIDIA kernel module on disk after the install
  ansible.builtin.fail:
    msg: >-
      No NVIDIA kernel module is installed on {{ inventory_hostname }} after the driver
      install (modinfo nvidia: {{ nvidia_driver_ondisk_version.stderr | default('') | trim }}).
      Check the DKMS build or the kernel module package for the running kernel.
  when:
    - not ansible_check_mode
    - (nvidia_driver_ondisk_version.stdout | default('') | trim) | length == 0

- name: Check whether a reboot is pending
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: nvidia_driver_reboot_pending
  check_mode: false
  when: not (nvidia_driver_module_loaded | bool)

- name: Require the NVIDIA module loaded when no reboot is pending
  ansible.builtin.fail:
    msg: >-
      The NVIDIA module {{ nvidia_driver_ondisk_version.stdout | trim }} is on disk but not
      running on {{ inventory_hostname }}, and no reboot is pending: it failed to load.
      See `dmesg | grep -i nvidia` (open vs proprietary modules, Secure Boot).
  when:
    - not ansible_check_mode
    - not (nvidia_driver_module_loaded | bool)
    - (nvidia_driver_ondisk_version.stdout | default('') | trim) | length > 0
    - not nvidia_driver_reboot_pending.stat.exists

- name: State that the NVIDIA driver waits for a reboot
  ansible.builtin.debug:
    msg: >-
      REBOOT PENDING: {{ inventory_hostname }} still runs the old NVIDIA module; the
      installed {{ nvidia_driver_ondisk_version.stdout | default('?') | trim }} is not in use.
      The persistence daemon and Fabric Manager start at boot; the GPU checks run when
      the maintenance reboot runs this role again (roles/maintenance, reboot_request).
  when:
    - not (nvidia_driver_module_loaded | bool)
    - nvidia_driver_reboot_pending.stat.exists | default(false)

# NVIDIA recommends the persistence daemon (not the legacy `nvidia-smi -pm 1`) with
# persistence mode on. The distribution units do not give that: Ubuntu's runs
# --no-persistence-mode, stops when unneeded and cannot be enabled (no [Install]). The
# role owns the unit (/etc/systemd/system takes precedence), after NVIDIA's template.
# https://docs.nvidia.com/datacenter/tesla/driver-installation-guide/post-installation-actions.html
# https://github.com/NVIDIA/nvidia-persistenced/blob/main/init/systemd/nvidia-persistenced.service.template
- name: Own the persistence daemon's unit, persistence mode on
  ansible.builtin.copy:
    dest: /etc/systemd/system/nvidia-persistenced.service
    owner: root
    group: root
    mode: "0644"
    content: |
      # roles/nvidia_driver: persistence mode on, started at boot
      [Unit]
      Description=NVIDIA Persistence Daemon
      Wants=syslog.target

      [Service]
      Type=forking
      ExecStart=/usr/bin/nvidia-persistenced --user nvidia-persistenced --persistence-mode --verbose
      ExecStopPost=/bin/rm -rf /var/run/nvidia-persistenced
      # Without it a crashed daemon leaves the GPUs out of persistence mode until a reboot.
      Restart=on-failure
      RestartSec=5

      [Install]
      WantedBy=multi-user.target
  register: nvidia_driver_persistenced_unit
  when: nvidia_driver_persistenced | bool

# The drop-in earlier versions of this role could write (override.conf, told by its
# text); the unit above replaces it. A site's own drop-ins there stay, and so does the
# directory while it holds any.
- name: Read the persistence drop-in earlier versions wrote
  ansible.builtin.slurp:
    src: /etc/systemd/system/nvidia-persistenced.service.d/override.conf
  register: nvidia_driver_old_dropin
  failed_when: false

- name: Remove the retired persistence drop-in
  systemd_dropin:
    path: /etc/systemd/system/nvidia-persistenced.service.d/override.conf
    state: absent
  when:
    - nvidia_driver_old_dropin.content is defined
    - >-
      "ExecStart=/usr/bin/nvidia-persistenced --user nvidia-persistenced --persistence-mode"
      in (nvidia_driver_old_dropin.content | b64decode)
  register: nvidia_driver_old_dropin_removed

# Enabled now, whatever module runs: after a pending reboot it starts with the new one.
- name: Enable the NVIDIA persistence daemon at boot
  systemd_unit:
    name: nvidia-persistenced
    enabled: true
    daemon_reload: true
  when: nvidia_driver_persistenced | bool

# Restarted here, not by a handler, when its unit changed: the persistence mode is read
# right below and must come from the new unit.
- name: Start the NVIDIA persistence daemon
  systemd_unit:
    name: nvidia-persistenced
    state: >-
      {{ 'restarted' if nvidia_driver_persistenced_unit is changed or nvidia_driver_old_dropin_removed is changed
         else 'started' }}
  when:
    - nvidia_driver_persistenced | bool
    - nvidia_driver_module_loaded | bool

- name: Read the persistence mode of every GPU
  ansible.builtin.command:
    argv: [systemd-run, --wait, --pipe, --collect, --quiet, --, nvidia-smi, --query-gpu=persistence_mode, "--format=csv,noheader"]
  register: nvidia_driver_persistence
  changed_when: false
  check_mode: false
  when:
    - nvidia_driver_persistenced | bool
    - nvidia_driver_verify | bool
    - nvidia_driver_module_loaded | bool

- name: Fail when a GPU is not in persistence mode
  ansible.builtin.assert:
    that: nvidia_driver_persistence.stdout_lines | map('trim') | reject('eq', 'Enabled') | list | length == 0
    fail_msg: "Persistence mode is not on for every GPU: {{ nvidia_driver_persistence.stdout_lines | join(', ') }}"
    quiet: true
  when: nvidia_driver_persistence is not skipped

# NVSwitch HGX baseboards require Fabric Manager, branch-matched to the driver.
# https://docs.nvidia.com/datacenter/tesla/fabric-manager-user-guide/index.html
- name: Enable NVIDIA Fabric Manager at boot
  systemd_unit:
    name: nvidia-fabricmanager
    enabled: true
  when: nvidia_driver_fabricmanager | bool

- name: Start NVIDIA Fabric Manager
  systemd_unit:
    name: nvidia-fabricmanager
    state: started
  when:
    - nvidia_driver_fabricmanager | bool
    - nvidia_driver_module_loaded | bool

- name: Verify the loaded NVIDIA driver version
  ansible.builtin.command: cat /proc/driver/nvidia/version
  changed_when: false
  when:
    - nvidia_driver_verify | bool
    - nvidia_driver_module_loaded | bool

# A transient unit sees the GPUs even where the ssh service hides them (DeviceAllow).
- name: Verify GPUs are visible with nvidia-smi
  ansible.builtin.command: systemd-run --wait --pipe --collect --quiet -- nvidia-smi
  changed_when: false
  when:
    - nvidia_driver_verify | bool
    - nvidia_driver_module_loaded | bool

- name: Record the component as present
  ansible.builtin.include_role:
    name: component_record
  vars:
    component_record_name: nvidia_driver
    component_record_action: present
    component_record_items: "{{ nvidia_driver_items }}"
    component_record_version: "{{ nvidia_driver_branch }}"
