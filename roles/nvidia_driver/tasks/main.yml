---
- name: Check the component state
  ansible.builtin.assert:
    that: nvidia_driver_state in ['present', 'absent', 'kept']
    fail_msg: "nvidia_driver_state must be present, absent or kept, not {{ nvidia_driver_state }}."
    quiet: true

# DGX OS ships its own driver stack (roles/nvidia-dgx): never installed over, never
# removed. Elsewhere the driver goes on hosts with GPUs (roles/facts), or every host
# with nvidia_driver_force_install.
- name: Check for DGX OS
  ansible.builtin.stat:
    path: /etc/dgx-release
  register: nvidia_driver_dgx
  when: nvidia_driver_state != 'kept'

- name: "Make the NVIDIA driver {{ nvidia_driver_state }}"
  ansible.builtin.include_tasks: "{{ nvidia_driver_state }}.yml"
  when:
    - nvidia_driver_state != 'kept'
    - not nvidia_driver_dgx.stat.exists
    - >-
      nvidia_driver_state == 'absent'
      or (ansible_facts.ansible_local.gpus.count | default(0) | int) > 0
      or nvidia_driver_force_install | bool
