---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: nvidia-driver-absent-ubuntu-2204
    image: geerlingguy/docker-ubuntu2204-ansible
    command: ""
    cgroupns_mode: host
    pre_build_image: true
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
provisioner:
  name: ansible
verifier:
  name: ansible
