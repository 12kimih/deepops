---
# In-tree NVIDIA data-center driver role.
#
# Installs the driver from the single official meta-package per OS, using the
# open kernel modules by default. This replaces the nvidia.nvidia_driver Galaxy
# role, whose per-package apt loop and mixed dkms + no-dkms package list produced
# a non-functional driver (nvidia-smi could not communicate with the module) and
# which had no open-module support on RHEL/Rocky.
#
# References:
#   Open vs proprietary modules (open is the NVIDIA default since the 560 series,
#   recommended for Turing and newer):
#     https://docs.nvidia.com/datacenter/tesla/driver-installation-guide/kernel-modules.html
#   Ubuntu packaged "-server" / "-server-open" meta-packages:
#     https://ubuntu.com/server/docs/how-to/graphics/install-nvidia-drivers/
#   RHEL/Rocky dnf module streams (nvidia-driver:<branch>-open + nvidia-open):
#     https://docs.nvidia.com/datacenter/tesla/driver-installation-guide/red-hat-enterprise-linux.html

# present or absent (docs/deepops/component-state.md): a deploy passes the state from
# deepops_components. absent removes the driver from a drained node and asks for a
# reboot; a deploy does that only where the site lists nvidia_driver in
# deepops_component_removals.
nvidia_driver_state: present

# --- Package selection -------------------------------------------------------
# The effective package is built from the toggles below, OR you can override it
# completely with nvidia_driver_package (Ubuntu) / nvidia_driver_rhel_package
# (RHEL/Rocky) for any combination not covered by the toggles.

# The driver branch is nvidia_driver_branch (roles/nvidia_versions), shared with the
# roles whose packages must match it.

# Kernel module flavor: "open" (default, Turing and newer; adds the "-open"
# suffix / "-open" dnf stream) or "proprietary" (omits it).
nvidia_driver_kernel_modules: "open"

# Ubuntu only: use the data-center "Enterprise Ready" branch (adds the "-server"
# suffix). Set false for the desktop/latest branch (no "-server" suffix).
nvidia_driver_server_branch: true

# Full override of the exact package name. Leave empty ("") to construct it from
# the toggles above. Examples:
#   "nvidia-driver-580-server-open"  (default: data-center, open kernel modules)
#   "nvidia-driver-580"              (desktop, proprietary)
#   "nvidia-driver-570-open"         (desktop, open)
#   "nvidia-driver-535-server"       (data-center, proprietary)
nvidia_driver_package: ""

# RHEL/Rocky override of the dnf module stream and meta-package. Leave empty to
# construct from the toggles, e.g. stream "nvidia-driver:580-open" + package
# "nvidia-open" (open), or "nvidia-driver:580-dkms" + "cuda-drivers" (proprietary).
nvidia_driver_rhel_module_stream: ""
nvidia_driver_rhel_package: ""

# Purge any pre-existing NVIDIA driver packages before installing. This avoids
# the broken mixed-package state that prevents the kernel module from building.
# Container Toolkit packages (libnvidia-container*, nvidia-container-toolkit*)
# are deliberately excluded from the purge.
nvidia_driver_purge_existing: true

# A driver change asks for a reboot (roles/maintenance, reboot_request) to load the new
# kernel module; it does not reboot the node itself.

# Run `nvidia-smi` and read /proc/driver/nvidia/version to verify the load.
nvidia_driver_verify: true

# --- Ubuntu install method -----------------------------------------------------
# "ubuntu_repo" (default): the Canonical archive's server set: signed precompiled
#   modules for the kernel flavour (linux-modules-nvidia-{branch}-server-open-*),
#   nvidia-headless-no-dkms and nvidia-utils. Secure Boot works without MOK
#   enrollment, SRU-qualified, no extra repo, no DKMS build on the nodes.
#   https://ubuntu.com/server/docs/how-to/graphics/install-nvidia-drivers/
# "nvidia_repo": NVIDIA's CUDA apt repo (cuda-keyring + nvidia-open / cuda-drivers),
#   branch-pinned via nvidia-driver-pinning-{branch}. Use for newer point releases,
#   a single repo shared with the CUDA toolkit, or non-stock kernels. NOTE: this
#   path builds DKMS modules, which require MOK enrollment under Secure Boot.
#   https://docs.nvidia.com/datacenter/tesla/driver-installation-guide/ubuntu.html
nvidia_driver_install_method: "ubuntu_repo"

# --- NVIDIA CUDA repository (Ubuntu nvidia_repo method, and RHEL) --------------
# roles/package_repos (tasks_from: cuda), shared with nvidia_cuda and nvidia_dcgm.

# --- Driver capabilities -------------------------------------------------------
# What the driver offers besides CUDA, in NVIDIA's own names (the ones containers ask
# for in NVIDIA_DRIVER_CAPABILITIES): compute and utility (CUDA, nvidia-smi) always;
# graphics adds OpenGL, EGL and Vulkan without a display (3D, simulation, rendering
# jobs), video adds NVENC and NVDEC (encoding and decoding video on the GPU). On the
# Ubuntu archive's headless driver each is its own package at the driver's branch,
# kept through every branch switch; one taken out of the list is removed again.
# docs/slurm-cluster/gpu-capabilities.md.
nvidia_driver_capabilities: [compute, utility]

# --- Post-installation actions -------------------------------------------------
# Run the NVIDIA persistence daemon with persistence mode on (the role owns its unit:
# the distribution units leave persistence mode off), and check every GPU reports it.
# https://docs.nvidia.com/datacenter/tesla/driver-installation-guide/post-installation-actions.html
nvidia_driver_persistenced: true
# NVSwitch HGX baseboards only: install + enable Fabric Manager (branch-matched to
# nvidia_driver_branch, or the service will refuse to start). Off by default.
# https://docs.nvidia.com/datacenter/tesla/fabric-manager-user-guide/index.html
nvidia_driver_fabricmanager: false

# RHEL/Rocky: the CodeReady Builder / CRB repository name (powertools on EL8, crb on EL9+).
nvidia_driver_rhel_crb_repo: "{{ 'powertools' if ansible_facts.distribution_major_version | int == 8 else 'crb' }}"
