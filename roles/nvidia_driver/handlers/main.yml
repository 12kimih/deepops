---
# The persistence daemon's unit changed: reload systemd, and restart the daemon only
# while the driver is loaded (with a reboot pending it starts at boot instead).
- name: Reload systemd for nvidia-persistenced
  systemd_unit:
    daemon_reload: true
  listen: Nvidia-persistenced unit changed

- name: Restart nvidia-persistenced
  systemd_unit:
    name: nvidia-persistenced
    state: restarted
  when: nvidia_driver_module_loaded | default(false) | bool
  listen: Nvidia-persistenced unit changed
