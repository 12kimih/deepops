---
# What the component installs, for its record (roles/component_record). The packages by
# family, as patterns the package manager resolves: the branch and the kernel flavour
# are in their names, a branch switch is purge.yml's, and what they pulled in goes with
# them (roles/host_baseline). Never the container toolkit's (nvidia-container-*,
# libnvidia-container*), a component of its own.
_nvidia_driver_packages:
  Debian:
    - linux-modules-nvidia-*
    - linux-objects-nvidia-*
    - linux-signatures-nvidia-*
    - nvidia-headless-*
    - nvidia-utils-*
    - nvidia-compute-utils-*
    - nvidia-kernel-common-*
    - nvidia-kernel-source-*
    - nvidia-dkms-*
    - nvidia-firmware-*
    - nvidia-driver-*
    - nvidia-open*
    - cuda-drivers*
    - nvidia-fabricmanager*
    - libnvidia-nscq*
    - libnvidia-cfg1-*
    - libnvidia-common-*
    - libnvidia-compute-*
    - libnvidia-decode-*
    - libnvidia-encode-*
    - libnvidia-extra-*
    - libnvidia-fbc1-*
    - libnvidia-gl-*
  RedHat:
    - nvidia-driver*
    - nvidia-open*
    - cuda-drivers*
    - kmod-nvidia*
    - nvidia-kmod*
    - nvidia-persistenced*
    - nvidia-modprobe*
    - nvidia-settings*
    - nvidia-xconfig*
    - nvidia-libXNVCtrl*
    - nvidia-fabricmanager*
    - nvidia-fabric-manager*
    - libnvidia-nscq*
    - nvidia-imex*
    - libnvsdm*
# The branch as the Canonical archive names its packages (580-server, or 580).
nvidia_driver_ubuntu_branch: "{{ nvidia_driver_branch ~ ('-server' if nvidia_driver_server_branch | bool else '') }}"
# The capabilities nvidia_driver_capabilities may name (NVIDIA's, as in
# NVIDIA_DRIVER_CAPABILITIES; display is left out: it needs an X server).
nvidia_driver_capability_names: [compute, utility, graphics, video]
# Where the driver is the archive's headless set, each capability beyond compute and
# utility is its own package at the driver's branch; NVIDIA's repos carry all of them.
nvidia_driver_capabilities_separate: >-
  {{ ansible_facts.distribution == 'Ubuntu' and nvidia_driver_install_method == 'ubuntu_repo'
     and nvidia_driver_package | length == 0 }}
_nvidia_driver_capability_archive:
  graphics: [libnvidia-gl]
  video: [libnvidia-decode, libnvidia-encode]
# The distribution's dispatchers graphics plugs into: Vulkan, EGL, GL and GLES (glvnd),
# and vulkaninfo to see the GPU from a job.
_nvidia_driver_graphics_loaders:
  Debian: [libvulkan1, libegl1, libgl1, libgles2, vulkan-tools]
  RedHat: [vulkan-loader, libglvnd-egl, libglvnd-glx, libglvnd-gles, vulkan-tools]
nvidia_driver_capability_packages: >-
  {{ (_nvidia_driver_graphics_loaders[ansible_facts.os_family] | default([])
      if 'graphics' in nvidia_driver_capabilities else [])
     + (_nvidia_driver_capability_archive | dict2items
        | selectattr('key', 'in', nvidia_driver_capabilities) | map(attribute='value') | flatten
        | map('regex_replace', '$', '-' ~ nvidia_driver_ubuntu_branch) | list
        if nvidia_driver_capabilities_separate else []) }}
nvidia_driver_capability_unwanted: >-
  {{ _nvidia_driver_capability_archive | dict2items
     | rejectattr('key', 'in', nvidia_driver_capabilities) | map(attribute='value') | flatten
     | map('regex_replace', '$', '-*') | list
     if nvidia_driver_capabilities_separate else [] }}
nvidia_driver_packages_owned: "{{ _nvidia_driver_packages[ansible_facts.os_family] | default([]) }}"
nvidia_driver_items: >-
  {{ nvidia_driver_packages_owned | map('regex_replace', '^', 'package:') | list
     + ['unit:nvidia-persistenced.service', 'file:/etc/systemd/system/nvidia-persistenced.service',
        'file:/etc/apt/preferences.d/deepops-nvidia-driver'] }}
