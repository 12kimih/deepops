---
# What the component installs, for its record (roles/component_record). The packages by
# family, as patterns the package manager resolves: the branch and the kernel flavour
# are in their names, a branch switch is purge.yml's, and what they pulled in goes with
# them (roles/host_baseline). Never the container toolkit's (nvidia_driver_archive_pin_exempt),
# a component of its own.
_nvidia_driver_packages:
  Debian:
    - linux-modules-nvidia-*
    - linux-objects-nvidia-*
    - linux-signatures-nvidia-*
    - nvidia-headless-*
    - nvidia-utils-*
    - nvidia-compute-utils-*
    - nvidia-kernel-common-*
    - nvidia-kernel-source-*
    - nvidia-dkms-*
    - nvidia-firmware-*
    - nvidia-driver-*
    - xserver-xorg-video-nvidia-*
    - nvidia-open*
    - cuda-drivers*
    - nvidia-fabricmanager*
    - libnvidia-nscq*
    - libnvidia-cfg1-*
    - libnvidia-common-*
    - libnvidia-compute-*
    - libnvidia-decode-*
    - libnvidia-encode-*
    - libnvidia-extra-*
    - libnvidia-fbc1-*
    - libnvidia-gl-*
  RedHat:
    - nvidia-driver*
    - nvidia-open*
    - cuda-drivers*
    - kmod-nvidia*
    - nvidia-kmod*
    - nvidia-persistenced*
    - nvidia-modprobe*
    - nvidia-settings*
    - nvidia-xconfig*
    - nvidia-libXNVCtrl*
    - nvidia-fabricmanager*
    - nvidia-fabric-manager*
    - libnvidia-nscq*
    - nvidia-imex*
    - libnvsdm*
# The branch as the Canonical archive names its packages (580-server, or 580).
nvidia_driver_ubuntu_branch: "{{ nvidia_driver_branch ~ ('-server' if nvidia_driver_server_branch | bool else '') }}"
# Whether the installed driver renders: every driver but the Ubuntu archive's headless set.
nvidia_driver_graphics: >-
  {{ not (nvidia_driver_headless | bool and ansible_facts.distribution == 'Ubuntu'
          and nvidia_driver_install_method == 'ubuntu_repo') }}
_nvidia_driver_graphics_dispatchers:
  Debian: [libglvnd0, libegl1, libgl1, libglx0, libgles2, libopengl0, libvulkan1]
  RedHat: [libglvnd-egl, libglvnd-gles, libglvnd-glx, libglvnd-opengl, vulkan-loader]
nvidia_driver_graphics_dispatchers: "{{ _nvidia_driver_graphics_dispatchers[ansible_facts.os_family] | default([]) }}"
nvidia_driver_packages_owned: "{{ _nvidia_driver_packages[ansible_facts.os_family] | default([]) }}"
nvidia_driver_items: >-
  {{ nvidia_driver_packages_owned | map('regex_replace', '^', 'package:') | list
     + ['unit:nvidia-persistenced.service', 'file:/etc/systemd/system/nvidia-persistenced.service',
        'file:/etc/apt/preferences.d/deepops-nvidia-driver'] }}

# The module modprobe would load, "<version> <open|proprietary>" ("" when none).
nvidia_driver_module_on_disk: >-
  {{ nvidia_driver_ondisk_version.stdout | default('') | nvidia_module_on_disk(nvidia_driver_ondisk_license.stdout | default('')) }}

# The NVIDIA packages the archive-only pin (tasks/ubuntu.yml) leaves to the repositories:
# the Container Toolkit (roles/nvidia_container_toolkit's packages), which its own
# repository and the CUDA repository publish at the same versions, each its own build.
# Refused from the CUDA repository, a toolkit installed from there became a downgrade
# to the other build in every maintenance upgrade (2026-11).
nvidia_driver_archive_pin_exempt:
  - libnvidia-container*
  - nvidia-container-*
