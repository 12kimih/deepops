---
# The profile goes first, so no login runs a gate already removed. The counts on /run
# go with the next boot.
- name: Read whether the PAM profile is there
  ansible.builtin.stat:
    path: "{{ _ssh_rate_profile_file }}"
  register: ssh_rate_profile_stat

- name: Turn the PAM profile off
  ansible.builtin.include_role:
    name: pam_profile
  vars:
    pam_profile_name: "{{ _ssh_rate_profile }}"
    pam_profile_enabled: false
    pam_profile_module: "{{ _ssh_rate_gate }}"
    pam_profile_file: /etc/pam.d/common-account
  when: ssh_rate_profile_stat.stat.exists

- name: Remove what this component installed
  ansible.builtin.include_role:
    name: component_record
  vars:
    component_record_name: ssh_rate
    component_record_action: absent
    component_record_items: "{{ ssh_rate_items }}"
