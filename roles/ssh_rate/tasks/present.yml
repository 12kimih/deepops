---
- name: Record what this component installs
  ansible.builtin.include_role:
    name: component_record
  vars:
    component_record_name: ssh_rate
    component_record_action: begin
    component_record_items: "{{ ssh_rate_items }}"

# pam_exec (libpam-modules) and pam-auth-update with its profiles directory
# (libpam-runtime): Ubuntu's own, never removed with the component.
- name: Install pam_exec and pam-auth-update
  ansible.builtin.apt:
    name: [libpam-modules, libpam-runtime]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Install the decision
  ansible.builtin.include_role:
    name: cluster_tools_lib
    tasks_from: command
  vars:
    cluster_tools_lib_command:
      dest: "{{ _ssh_rate_command }}"
      module: cluster_tools.ssh_rate

- name: Write the limit's configuration
  ansible.builtin.copy:
    dest: "{{ _ssh_rate_config }}"
    owner: root
    group: root
    mode: "0644"
    content: "{{ _ssh_rate_cfg | to_nice_json }}\n"
    validate: "{{ cluster_tools_lib_config_validate }} cluster_tools.ssh_rate %s"

- name: Record the limit's configuration
  ansible.builtin.include_role:
    name: cluster_tools_lib
    tasks_from: config
  vars:
    cluster_tools_lib_config: {role: ssh_rate, module: cluster_tools.ssh_rate, file: "{{ _ssh_rate_config }}", playbook: playbooks/generic/ssh-rate.yml}

# The gate before the profile: PAM runs it at the first login after the profile is on.
- name: Install the gate PAM runs
  ansible.builtin.template:
    src: ssh-rate-gate.j2
    dest: "{{ _ssh_rate_gate }}"
    owner: root
    group: root
    mode: "0755"

- name: Install the metrics units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ _ssh_rate_units }}"
  register: ssh_rate_units_written

- name: Publish the counts every minute
  systemd_unit:
    name: ssh-rate-metrics.timer
    enabled: true
    state: "{{ 'restarted' if ssh_rate_units_written is changed else 'started' }}"
    daemon_reload: true

- name: Write the PAM profile
  ansible.builtin.template:
    src: pam-profile.j2
    dest: "{{ _ssh_rate_profile_file }}"
    owner: root
    group: root
    mode: "0644"

- name: Turn the PAM profile on
  ansible.builtin.include_role:
    name: pam_profile
  vars:
    pam_profile_name: "{{ _ssh_rate_profile }}"
    pam_profile_enabled: true
    pam_profile_module: "{{ _ssh_rate_gate }}"
    pam_profile_file: /etc/pam.d/common-account

- name: Record the component as present
  ansible.builtin.include_role:
    name: component_record
  vars:
    component_record_name: ssh_rate
    component_record_action: present
    component_record_items: "{{ ssh_rate_items }}"
