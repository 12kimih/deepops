---
- name: Converge
  hosts: all
  become: true
  tasks:
    - name: Add the repository
      ansible.builtin.include_role:
        name: package_repos
        tasks_from: repo
      vars:
        package_repos_repo: "{{ repos_test_repo }}"

    - name: Check apt resolves nodejs from it, at the pinned priority
      ansible.builtin.command:
        argv: [apt-cache, policy, nodejs]
      register: repos_policy
      changed_when: false

    - name: Check the candidate comes from NodeSource
      ansible.builtin.assert:
        that:
          - repos_policy.stdout is search('Candidate. 22\\.[0-9.]+-1nodesource1')
          - repos_policy.stdout is search('22\\.[0-9.]+-1nodesource1 600')
          - repos_policy.stdout is search('https://deb.nodesource.com/node_22.x nodistro/main')
        fail_msg: "{{ repos_policy.stdout }}"
