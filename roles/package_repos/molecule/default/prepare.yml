---
# What an older setup left for the same repository: the converge must remove it.
- name: Prepare
  hosts: all
  become: true
  tasks:
    - name: Leave an old .list entry behind
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/nodesource.list
        content: "deb [signed-by=/usr/share/keyrings/nodesource.gpg] https://deb.nodesource.com/node_22.x nodistro main\n"
        mode: "0644"
