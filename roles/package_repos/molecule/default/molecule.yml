---
provisioner:
  inventory:
    group_vars:
      all:
        # NodeSource's node_22.x repository, as roles/open_ondemand uses it.
        repos_test_repo:
          name: nodesource
          uris: https://deb.nodesource.com/node_22.x
          suites: [nodistro]
          components: [main]
          key_url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
          key_checksum: "sha256:b42e0321dabdc24e892115da705cf061167eac12a317f23d329862d0aa0a271d"
          key_fingerprint: 6F71F525282841EEDAF851B42F59B5F99B1BE0B4
          pin: {pin: "origin deb.nodesource.com", priority: 600, packages: nodejs}
          legacy_files: [/etc/apt/sources.list.d/nodesource.list]
scenario:
  test_sequence: [destroy, syntax, create, prepare, converge, idempotence, side_effect, verify, destroy]
