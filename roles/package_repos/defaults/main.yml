---
# package_repos -- the third-party package repositories roles share, set up one way:
#
#   tasks_from: epel   EPEL on the RHEL family (a no-op elsewhere)
#   tasks_from: cuda   NVIDIA's CUDA repository (drivers, CUDA, DCGM): the cuda-keyring
#                      package on Ubuntu, a dnf repository on the RHEL family
#
# A mirror (an airgap) replaces the base URLs and keeps the layout below them.

package_repos_epel_release: "https://dl.fedoraproject.org/pub/epel/epel-release-latest-{{ ansible_facts.distribution_major_version }}.noarch.rpm"
package_repos_epel_key: "https://dl.fedoraproject.org/pub/epel/RPM-GPG-KEY-EPEL-{{ ansible_facts.distribution_major_version }}"

package_repos_cuda_base: "https://developer.download.nvidia.com/compute/cuda/repos"
# NVIDIA publishes one repository per OS release; a brand-new release may have none
# yet: set this to the previous one (e.g. "24.04") until it does.
package_repos_cuda_release: "{{ ansible_facts.distribution_version if ansible_facts.os_family == 'Debian' else ansible_facts.distribution_major_version }}"
# NVIDIA names the Arm server directory sbsa, not aarch64.
package_repos_cuda_dir: >-
  {{ ('ubuntu' if ansible_facts.os_family == 'Debian' else 'rhel') ~ (package_repos_cuda_release | string | replace('.', '')) }}/{{
  'sbsa' if ansible_facts.architecture == 'aarch64' else ansible_facts.architecture }}
package_repos_cuda_url: "{{ package_repos_cuda_base }}/{{ package_repos_cuda_dir }}"
package_repos_cuda_keyring: cuda-keyring_1.1-1_all.deb
# The keyring is the trust anchor for every NVIDIA package, and each directory has
# its own build of it: sha256 per directory (developer.download.nvidia.com, 2026-11).
package_repos_cuda_keyring_checksums:
  ubuntu2204/x86_64: "sha256:d93190d50b98ad4699ff40f4f7af50f16a76dac3bb8da1eaaf366d47898ff8df"
  ubuntu2204/sbsa: "sha256:36d1aed84dfcf93ee9a0212d149f1c4187db92e03ab96a759ec0689aa438fd9e"
  ubuntu2404/x86_64: "sha256:d2a6b11c096396d868758b86dab1823b25e14d70333f1dfa74da5ddaf6a06dba"
  ubuntu2404/sbsa: "sha256:6ea7d2737648936820e85677177957a0f6521b840d98eb0bbae0a4f003fa7249"
package_repos_cuda_rhel_gpgkey: D42D0685.pub
