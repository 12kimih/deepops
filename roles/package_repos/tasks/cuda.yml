---
- name: Add the CUDA repository (Ubuntu)
  when: ansible_facts.os_family == 'Debian'
  block:
    - name: Fetch the CUDA keyring
      ansible.builtin.include_role:
        name: download
      vars:
        download_url: "{{ package_repos_cuda_url }}/{{ package_repos_cuda_keyring }}"
        download_checksum: "{{ package_repos_cuda_keyring_checksums[package_repos_cuda_dir] | default('') }}"
        download_dest: "/var/cache/deepops/{{ package_repos_cuda_dir | replace('/', '-') }}-{{ package_repos_cuda_keyring }}"

    - name: Install the CUDA keyring
      ansible.builtin.apt:
        deb: "/var/cache/deepops/{{ package_repos_cuda_dir | replace('/', '-') }}-{{ package_repos_cuda_keyring }}"
      register: package_repos_cuda_keyring_install
      # Under --check a keyring not yet fetched is not there to install.
      when: not (ansible_check_mode and download_fetch is changed)

    # The keyring package writes this source with NVIDIA's URL; owned here, it follows
    # package_repos_cuda_base, so a mirror needs no step on the hosts. (A conffile: apt
    # keeps this version when the keyring is upgraded.)
    - name: Point the CUDA repository source at package_repos_cuda_url
      ansible.builtin.copy:
        dest: "{{ package_repos_cuda_source_file }}"
        content: "deb [signed-by={{ package_repos_cuda_keyring_file }}] {{ package_repos_cuda_url }}/ /\n"
        owner: root
        group: root
        mode: "0644"
      register: package_repos_cuda_source

    - name: Look for the CUDA repository's package index
      ansible.builtin.include_tasks: index.yml
      vars:
        package_repos_index_uris: ["{{ package_repos_cuda_url }}"]

    # Also when apt lacks the index: an earlier run's update failed.
    - name: Read the CUDA repository index
      ansible.builtin.apt:
        update_cache: true
      environment: "{{ proxy_env }}"
      when: >-
        package_repos_cuda_keyring_install is changed or package_repos_cuda_source is changed
        or package_repos_index_missing | bool

# Earlier setups downloaded NVIDIA's own .repo file, which defines the repository a
# second time.
- name: Remove the downloaded CUDA .repo file (RHEL family)
  ansible.builtin.file:
    path: "/etc/yum.repos.d/cuda-rhel{{ ansible_facts.distribution_major_version }}.repo"
    state: absent
  when: ansible_facts.os_family == 'RedHat'

- name: Add the CUDA repository (RHEL family)
  ansible.builtin.yum_repository:
    name: cuda
    description: NVIDIA CUDA repository
    baseurl: "{{ package_repos_cuda_url }}/"
    gpgkey: "{{ package_repos_cuda_url }}/{{ package_repos_cuda_rhel_gpgkey }}"
    gpgcheck: true
  when: ansible_facts.os_family == 'RedHat'
