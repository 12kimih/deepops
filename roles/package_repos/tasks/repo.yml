---
# One third-party package repository in its desired state: the one way a role adds or
# removes one.
#
#   - ansible.builtin.include_role:
#       name: package_repos
#       tasks_from: repo
#     vars:
#       package_repos_repo:
#         name: ondemand-web            # file names: <name>.sources, keyrings/<name>.asc|.gpg
#         uris: https://apt.osc.edu/ondemand/4.2/web/apt   # (dnf: the baseurl)
#         suites: [noble]               # Debian; default: this release's codename ("./": flat)
#         components: [main]            # Debian; omit for a flat repository
#         architectures: [amd64]        # Debian; default: this host's (dpkg); [] omits it
#         key_url: https://.../KEY      # the signing key, fetched with key_checksum ...
#         key_checksum: "sha256:..."
#         key_src: ""                   # ... or a file under the inventory (vaulted is fine)
#         key_fingerprint: "3D4C..."    # optional: the key must carry it
#         pin: {pin: "origin apt.osc.edu", priority: 600, packages: "*"}   # Debian; optional
#         legacy_files: []              # entries earlier setups left for the same repository
#                                       # (an old .list, a trusted.gpg.d key, ...)
#         module_hotfixes: false        # RHEL family, optional (e.g. CUDA on EL8)
#         priority: 99                  # RHEL family, optional
#         signed: packages              # RHEL family: what the key signs, packages (the
#                                       # default) or metadata (NVIDIA's container toolkit)
#         state: present                # or absent: source, key, pin and legacy files go
#
# The files it manages, for a component's record: /etc/apt/sources.list.d/<name>.sources,
# /etc/apt/keyrings/<name>.asc (or .gpg), /etc/apt/preferences.d/<name>.pref with a pin,
# /etc/yum.repos.d/<name>.repo, /etc/pki/rpm-gpg/RPM-GPG-KEY-<name>, and the fetched copy
# /var/cache/deepops/package-repos/<name>.key.
#
# Debian: the key is installed as /etc/apt/keyrings/<name>.asc (armored) or .gpg, and the
# source (ansible.builtin.deb822_repository) trusts only it (signed-by), never apt-key or
# trusted.gpg.d. RHEL family: the key goes to /etc/pki/rpm-gpg/RPM-GPG-KEY-<name> and the
# yum repository checks packages against it. Either way the package index is refreshed
# only when something changed or, on Debian, apt lacks the source's index (index.yml):
# package_repos_changed.
- name: Check the repository request
  ansible.builtin.assert:
    that:
      - package_repos_repo.name | default('') is match('^[a-z0-9][a-z0-9._-]*$')
      - package_repos_repo.state | default('present') in ['present', 'absent']
      - package_repos_repo.signed | default('packages') in ['packages', 'metadata']
      - >-
        package_repos_repo.state | default('present') == 'absent'
        or (package_repos_repo.uris | default('') | length > 0
            and ((package_repos_repo.key_url | default('') | length > 0 and package_repos_repo.key_checksum | default('') | length > 0)
                 or package_repos_repo.key_src | default('') | length > 0))
    fail_msg: >-
      package_repos_repo needs a name (lowercase, digits, . _ -), state present|absent and, to
      add a repository, uris and a signing key: key_url with key_checksum, or key_src.
    quiet: true

- name: Resolve the repository's files
  ansible.builtin.set_fact:
    package_repos_r: "{{ package_repos_repo }}"
    package_repos_state: "{{ package_repos_repo.state | default('present') }}"
    package_repos_key_fetched: "{{ deepops_cache_dir }}/package-repos/{{ package_repos_repo.name }}.key"
    package_repos_rpm_key: "/etc/pki/rpm-gpg/RPM-GPG-KEY-{{ package_repos_repo.name }}"
    package_repos_changed: false

# legacy_files are what other setups left; naming one of the files this manages would
# remove it right after installing it.
- name: Check the legacy files are not this repository's own
  ansible.builtin.assert:
    that: >-
      package_repos_r.legacy_files | default([]) | intersect([
        '/etc/apt/sources.list.d/' ~ package_repos_r.name ~ '.sources',
        '/etc/apt/keyrings/' ~ package_repos_r.name ~ '.asc', '/etc/apt/keyrings/' ~ package_repos_r.name ~ '.gpg',
        '/etc/apt/preferences.d/' ~ package_repos_r.name ~ '.pref', '/etc/yum.repos.d/' ~ package_repos_r.name ~ '.repo',
        package_repos_rpm_key, package_repos_key_fetched]) | length == 0
    fail_msg: "{{ package_repos_r.name }}: legacy_files names a file this repository's setup installs."
    quiet: true

- name: Add the repository
  when: package_repos_state == 'present'
  block:
    # First: a leftover entry for this repository (an old .list naming a key that is
    # gone) makes every apt update fail, the one below for the prerequisites included.
    - name: Remove what earlier setups left for this repository
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ package_repos_r.legacy_files | default([]) }}"
      register: package_repos_legacy

    - name: Create the key cache directory
      ansible.builtin.file:
        path: "{{ deepops_cache_dir }}/package-repos"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Fetch the signing key
      ansible.builtin.include_role:
        name: download
      vars:
        download_url: "{{ package_repos_r.key_url }}"
        download_checksum: "{{ package_repos_r.key_checksum }}"
        download_dest: "{{ package_repos_key_fetched }}"
      when: package_repos_r.key_url | default('') | length > 0

    - name: Take the signing key from the inventory
      ansible.builtin.copy:
        src: "{{ package_repos_r.key_src }}"
        dest: "{{ package_repos_key_fetched }}"
        decrypt: true
        owner: root
        group: root
        mode: "0644"
      when: package_repos_r.key_src | default('') | length > 0

    # Under --check a key not fetched yet is not there to read or install.
    - name: Look for the fetched key
      ansible.builtin.stat:
        path: "{{ package_repos_key_fetched }}"
      register: package_repos_key_stat

    - name: Read the key
      ansible.builtin.command:
        argv: [gpg, --batch, --no-default-keyring, --show-keys, --with-colons, "{{ package_repos_key_fetched }}"]
      register: package_repos_key_info
      changed_when: false
      failed_when: false
      check_mode: false  # read-only; --check needs the result

    - name: Check the key is the publisher's
      ansible.builtin.assert:
        that: (package_repos_r.key_fingerprint | upper) in (package_repos_key_info.stdout | regex_findall('(?m)^fpr:+([0-9A-F]+):'))
        fail_msg: "The {{ package_repos_r.name }} signing key does not have fingerprint {{ package_repos_r.key_fingerprint }}; not trusting it."
        quiet: true
      when:
        - package_repos_r.key_fingerprint | default('') | length > 0
        - not ansible_check_mode or package_repos_key_info.rc == 0

    - name: Add the repository (Debian)
      when:
        - ansible_facts.os_family == 'Debian'
        - package_repos_key_stat.stat.exists
      block:
        # apt reads an armored key only with .asc and a binary one only with .gpg.
        - name: Tell an armored key from a binary one
          ansible.builtin.command:
            argv: [grep, -q, -e, "-----BEGIN PGP PUBLIC KEY BLOCK-----", "{{ package_repos_key_fetched }}"]
          register: package_repos_key_armored
          changed_when: false
          failed_when: package_repos_key_armored.rc > 1
          check_mode: false  # read-only; --check needs the result

        - name: Note the keyring's name
          ansible.builtin.set_fact:
            package_repos_keyring: "/etc/apt/keyrings/{{ package_repos_r.name }}.{{ 'asc' if package_repos_key_armored.rc == 0 else 'gpg' }}"
            package_repos_other_keyring: "/etc/apt/keyrings/{{ package_repos_r.name }}.{{ 'gpg' if package_repos_key_armored.rc == 0 else 'asc' }}"

        - name: Read this host's package architecture
          ansible.builtin.command:
            argv: [dpkg, --print-architecture]
          register: package_repos_dpkg_arch
          changed_when: false
          check_mode: false  # read-only; --check needs the result
          when: package_repos_r.architectures is not defined

        - name: Install the prerequisites (deb822_repository needs python3-debian)
          ansible.builtin.apt:
            name: [ca-certificates, python3-debian]
            state: present
            update_cache: true
            cache_valid_time: 3600  # a fresh host has no package index yet

        - name: Create the keyring directory
          ansible.builtin.file:
            path: /etc/apt/keyrings
            state: directory
            owner: root
            group: root
            mode: "0755"

        - name: Install the signing key
          ansible.builtin.copy:
            src: "{{ package_repos_key_fetched }}"
            dest: "{{ package_repos_keyring }}"
            remote_src: true
            owner: root
            group: root
            mode: "0644"
          register: package_repos_key_installed

        - name: Add the source (deb822), trusting only that key
          ansible.builtin.deb822_repository:
            name: "{{ package_repos_r.name }}"
            types: [deb]
            uris: "{{ package_repos_r.uris }}"
            suites: "{{ package_repos_r.suites | default([ansible_facts.distribution_release]) }}"
            components: "{{ package_repos_r.components | default(omit) }}"
            architectures: >-
              {{ ([package_repos_dpkg_arch.stdout | trim] if package_repos_r.architectures is not defined
                  else package_repos_r.architectures) or omit }}
            signed_by: "{{ package_repos_keyring }}"
            state: present
          register: package_repos_source

        - name: Pin the repository
          ansible.builtin.copy:
            dest: "/etc/apt/preferences.d/{{ package_repos_r.name }}.pref"
            owner: root
            group: root
            mode: "0644"
            content: |
              # Managed by DeepOps (roles/package_repos): {{ package_repos_r.name }}
              Package: {{ package_repos_r.pin.packages | default('*') }}
              Pin: {{ package_repos_r.pin.pin }}
              Pin-Priority: {{ package_repos_r.pin.priority | int }}
          register: package_repos_pin
          when: package_repos_r.pin is defined

        - name: Remove the other keyring form and an unwanted pin
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop: "{{ [package_repos_other_keyring]
                    + ([] if package_repos_r.pin is defined else ['/etc/apt/preferences.d/' ~ package_repos_r.name ~ '.pref']) }}"
          register: package_repos_stale

        - name: Look for the source's package index
          ansible.builtin.include_tasks: index.yml
          vars:
            package_repos_index_uris: "{{ [package_repos_r.uris] if package_repos_r.uris is string else package_repos_r.uris }}"

        # A changed key or pin, or an index apt lacks (an earlier run's update failed).
        - name: Note whether the repository changed
          ansible.builtin.set_fact:
            package_repos_changed: >-
              {{ package_repos_key_installed is changed or package_repos_source is changed
                 or package_repos_pin is changed or package_repos_stale is changed or package_repos_legacy is changed
                 or package_repos_index_missing | bool }}

    - name: Add the repository (RHEL family)
      when:
        - ansible_facts.os_family == 'RedHat'
        - package_repos_key_stat.stat.exists
      block:
        - name: Install the signing key
          ansible.builtin.copy:
            src: "{{ package_repos_key_fetched }}"
            dest: "{{ package_repos_rpm_key }}"
            remote_src: true
            owner: root
            group: root
            mode: "0644"
          register: package_repos_key_installed

        - name: Add the yum repository, checked against that key
          ansible.builtin.yum_repository:
            name: "{{ package_repos_r.name }}"
            description: "{{ package_repos_r.name }}"
            baseurl: "{{ package_repos_r.uris }}"
            gpgcheck: "{{ package_repos_r.signed | default('packages') == 'packages' }}"
            repo_gpgcheck: "{{ package_repos_r.signed | default('packages') == 'metadata' }}"
            gpgkey: "file://{{ package_repos_rpm_key }}"
            module_hotfixes: "{{ package_repos_r.module_hotfixes | default(omit) }}"
            priority: "{{ package_repos_r.priority | default(omit) }}"
            state: present
          register: package_repos_source

        - name: Note whether the repository changed
          ansible.builtin.set_fact:
            package_repos_changed: "{{ package_repos_key_installed is changed or package_repos_source is changed or package_repos_legacy is changed }}"

- name: Remove the repository
  when: package_repos_state == 'absent'
  block:
    - name: Remove the source (Debian)
      ansible.builtin.deb822_repository:
        name: "{{ package_repos_r.name }}"
        state: absent
      register: package_repos_source_removed
      when: ansible_facts.os_family == 'Debian'

    - name: Remove the yum repository (RHEL family)
      ansible.builtin.yum_repository:
        name: "{{ package_repos_r.name }}"
        state: absent
      register: package_repos_yum_removed
      when: ansible_facts.os_family == 'RedHat'

    - name: Remove the key, the pin and what earlier setups left
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: >-
        {{ ['/etc/apt/keyrings/' ~ package_repos_r.name ~ '.asc', '/etc/apt/keyrings/' ~ package_repos_r.name ~ '.gpg',
            '/etc/apt/preferences.d/' ~ package_repos_r.name ~ '.pref', package_repos_rpm_key, package_repos_key_fetched]
           + package_repos_r.legacy_files | default([]) }}
      register: package_repos_files_removed

    - name: Note whether the repository changed
      ansible.builtin.set_fact:
        package_repos_changed: >-
          {{ package_repos_source_removed is changed or package_repos_yum_removed is changed
             or package_repos_files_removed is changed }}

- name: Refresh the package index
  ansible.builtin.apt:
    update_cache: true
  when:
    - package_repos_changed | bool
    - ansible_facts.os_family == 'Debian'
    - not ansible_check_mode
