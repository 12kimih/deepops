  description: The cluster bot's one forced command on a host, and the services it may run there
  license: BSD-3-Clause
  min_ansible_version: "2.17"
  platforms:
    - name: Ubuntu
      versions: [jammy, noble]
    - name: EL
      versions: ["8", "9"]
