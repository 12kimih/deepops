dependencies:
  - role: slack_defaults  # cluster_bot_user, cluster_bot_host, cluster_bot_key, the paths
  - role: system_accounts  # the bot's account
  - role: network_defaults  # the bot host's cluster address

galaxy_info:
  namespace: deepops
  role_name: cluster_bot_access
