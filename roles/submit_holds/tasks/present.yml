---
- name: Record what this component installs
  ansible.builtin.include_role:
    name: component_record
  vars:
    component_record_name: submit_holds
    component_record_action: begin
    component_record_items: "{{ submit_holds_items }}"

- name: Install the submission holds command
  ansible.builtin.include_role:
    name: cluster_tools_lib
    tasks_from: command
  vars:
    cluster_tools_lib_command:
      dest: "{{ _submit_holds_command }}"
      module: cluster_tools.submit_holds

- name: Write the submission holds configuration
  ansible.builtin.copy:
    dest: "{{ _submit_holds_config }}"
    owner: root
    group: root
    mode: "0644"
    content: "{{ _submit_holds_cfg | to_nice_json }}\n"
    validate: "{{ cluster_tools_lib_config_validate }} cluster_tools.submit_holds %s"

- name: Record the submission holds configuration
  ansible.builtin.include_role:
    name: cluster_tools_lib
    tasks_from: config
  vars:
    cluster_tools_lib_config:
      role: submit_holds
      module: cluster_tools.submit_holds
      file: "{{ _submit_holds_config }}"
      playbook: playbooks/slurm-cluster/submit-holds.yml

- name: Install the submission holds units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ _submit_holds_units }}"
  register: submit_holds_units

- name: Work out the holds regularly
  systemd_unit:
    name: submit-holds.timer
    enabled: true
    state: "{{ 'restarted' if submit_holds_units is changed else 'started' }}"
    daemon_reload: true

- name: Record the component as present
  ansible.builtin.include_role:
    name: component_record
  vars:
    component_record_name: submit_holds
    component_record_action: present
    component_record_items: "{{ submit_holds_items }}"
