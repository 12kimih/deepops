---
# present, absent or kept (docs/deepops/component-state.md): who may not submit Slurm
# jobs for now, and why (cluster_tools.submit_holds), written on the controllers, where
# the rendered job_submit.lua reads it. A deploy sets it from deepops_components
# (slurm_enable_submit_holds, on slurm-master). Held, new jobs refused with the reason
# while running jobs go on: a person past their roster `ends`, from the next day; with
# submit_holds_disk, a person at a disk hard limit (the disk quota metrics, as the daily
# disk report reads them) from submit_holds_from on, until they free space.
# docs/deepops/disk-quota.md, docs/deepops/accounts.md.
submit_holds_state: present

# How often the holds are worked out again (systemd OnUnitActiveSec). job_submit.lua
# trusts the file for submit_holds_max_age (roles/deploy_defaults) and an alert fires
# after half of it without a run (SubmitHoldsStale): keep this well under both.
submit_holds_interval: 5min

# Roster-shaped mapping (login -> {ends, status}) whose ends hold people (default: the
# roster); empty: no one is held for an end.
submit_holds_people: "{{ people }}"

# Prometheus, which holds every host's disk quota metrics.
submit_holds_prometheus_url: "{{ prometheus_url }}"
