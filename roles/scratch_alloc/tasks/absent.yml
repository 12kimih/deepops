---
# The command, its units and configuration go; the registry and every allocation stay
# (data). The allocations' project quotas stay with them until each is removed by hand.
- name: Remove what this component installed
  ansible.builtin.include_role:
    name: component_record
  vars:
    component_record_name: scratch_alloc
    component_record_action: absent
    component_record_items: "{{ scratch_alloc_items }}"
    component_record_exclusive_packages: []
