---
# present, absent or kept (docs/deepops/component-state.md): fast scratch space handed out
# per request (cluster_tools.scratch_alloc), each allocation a directory of its own,
# <mount>/<user>-<id>, with a size limit (a project quota, XFS or ext4) and an end date. A deploy
# sets it from deepops_components (slurm_enable_scratch_alloc, on scratch-server: the
# host whose filesystem holds the scratch space).
#
# The registry of allocations is data: absent never removes it, nor any allocation. The
# filesystem needs project quotas, a mount-time option: set prjquota in
# host_baseline_mount_options for it (roles/host_baseline asks for the reboot that
# applies it); the role stops until it is mounted so, saying so.
scratch_alloc_state: present

# The mount, the caps, the automatic limits and the periods are roles/scratch_defaults'
# (the cluster bot reads them too).
