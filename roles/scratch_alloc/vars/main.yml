---
_scratch_alloc_command: /usr/local/sbin/scratch-alloc
_scratch_alloc_config: /etc/cluster-tools/scratch-alloc.json
_scratch_alloc_textfile: "{{ node_exporter_prom_dir }}/scratch-alloc.prom"
_scratch_alloc_units: [scratch-alloc-sweep.service, scratch-alloc-sweep.timer]
_scratch_alloc_cfg:
  mount: "{{ scratch_alloc_mount }}"
  registry: "{{ deepops_state_dir }}/scratch-alloc/registry.json"
  first_id: "{{ scratch_alloc_first_id | int }}"
  max_bytes: "{{ scratch_alloc_max_size }}"
  max_days: "{{ scratch_alloc_max_days | int }}"
  grace_days: "{{ scratch_alloc_grace_days | int }}"
  textfile: "{{ _scratch_alloc_textfile }}"

# What this component installs, for its record (roles/component_record). The registry and
# the allocations are data and stay.
scratch_alloc_items: >-
  {{ ['package:xfsprogs', 'package:quota', 'unit:scratch-alloc-sweep.timer', 'unit:scratch-alloc-sweep.service']
     + _scratch_alloc_units | map('regex_replace', '^', 'file:/etc/systemd/system/') | list
     + ['file:' ~ _scratch_alloc_command, 'file:' ~ _scratch_alloc_config, 'file:' ~ _scratch_alloc_textfile,
        'file:' ~ _scratch_alloc_sudoers, 'file:' ~ _scratch_alloc_bot_keys] }}
# The cluster bot's way in: its key may run the allocation command's serve mode as root,
# nothing else (the forced command, and the one sudo rule).
_scratch_alloc_sudoers: /etc/sudoers.d/deepops-scratch-alloc
_scratch_alloc_bot_home: "{{ system_accounts[cluster_bot_user].home }}"
_scratch_alloc_bot_keys: "{{ _scratch_alloc_bot_home }}/.ssh/authorized_keys"
_scratch_alloc_serve: "{{ _scratch_alloc_command }} {{ _scratch_alloc_config }} serve"
