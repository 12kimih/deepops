---
dependencies:
  - role: deepops_paths  # deepops_state_dir, deepops_containerized
  - role: scratch_defaults  # scratch_alloc_mount, limits, periods
  - role: cluster_tools_lib  # clustertools.scratch_alloc
  - role: prometheus_paths  # node_exporter_prom_dir
  - role: slack_defaults  # cluster_bot_user, cluster_bot_host, cluster_bot_key
  - role: system_accounts  # the bot's account
  - role: network_defaults  # the bot host's cluster address

galaxy_info:
  namespace: deepops
  role_name: scratch_alloc
  author: DeepOps
  description: Fast scratch space handed out per request, each with a project quota and an end date
  license: BSD-3-Clause
  min_ansible_version: "2.17"
  platforms:
    - name: Ubuntu
      versions: [jammy, noble]
    - name: EL
      versions: ["8", "9"]
