---
dependencies:
  - role: deepops_paths  # deepops_dir
  - role: cluster_tools_lib  # cluster_tools.slack: every DM, and its log for the administrators
  - role: deploy_defaults  # deepops_component_registry (cluster_bot_host)
  - role: slack_defaults  # tokens, channels, cluster_bot_user, cluster_bot_key
  - role: system_accounts  # the bot's account
  - role: network_defaults  # cluster addresses
  - role: people_defaults  # people (members, admins)
  - role: shared_space_defaults  # shared_projects, the shared space's root
  - role: slurm_paths  # slurm_accounting_file (the teams a new person picks)
  - role: scratch_space_defaults  # the scratch space's root and stale period (project places)
  - role: directory_defaults  # directory_groups (GIDs a new project avoids)
  - role: cluster_info_defaults  # cluster_info (login host, SSH port, guide)
  - role: open_ondemand_defaults  # open_ondemand_url, the portal in the onboarding text
  - role: cluster_tools_defaults  # cluster_tools_commands (the help lists them)

galaxy_info:
  namespace: deepops
  role_name: cluster_bot
  author: DeepOps
  description: The cluster's Slack app (Socket Mode) for requests users make themselves
  license: BSD-3-Clause
  min_ansible_version: "2.17"
  platforms:
    - name: Ubuntu
      versions: [jammy, noble]
    - name: EL
      versions: ["8", "9"]
