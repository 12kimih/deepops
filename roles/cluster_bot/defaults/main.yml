---
# present, absent or kept (docs/deepops/component-state.md): the cluster's Slack app
# (clusterbot): slash commands, forms and buttons through Socket Mode, an outbound
# connection, so no port is opened. A deploy sets it from deepops_components
# (slurm_enable_cluster_bot, on the first slurm-master). It runs as cluster_bot_user
# (roles/system_accounts) and needs slack_bot_token and slack_app_token (roles/
# slack_defaults); without them it is installed but not started.
#
# Features: scratch allocations (/scratch: ask, extend, resize, release; reminders
# before an allocation ends), account requests (/join, /leave), unban requests
# (/unban-request, where fail2ban runs), reminders before a person's last day (the
# roster's `ends`), the Home tab. It acts on other hosts through the services they offer
# it (roles/cluster_bot_access).
cluster_bot_state: present

# Slack's Python SDK and Bolt, installed with pip --require-hashes into the bot's venv
# (the wheels' sha256 from PyPI, per version).
# upstream: pypi slack-bolt 3.9
cluster_bot_slack_bolt_version: "1.30.0"
# upstream: pypi slack-sdk 3.9
cluster_bot_slack_sdk_version: "3.48.0"
# The roster editors' YAML library (round trip, pure Python), for account requests.
# upstream: pypi ruamel.yaml 3.9
cluster_bot_ruamel_yaml_version: "0.19.1"
cluster_bot_sha256:
  ruamel_yaml:
    "0.19.1": 27592957fedf6e0b62f281e96effd28043345e0e66001f97683aa9a40c667c93
  slack_bolt:
    "1.30.0": 81f5bc46e79516d23d5e2a31dded6304dd1b8b6b72c0083f2f31d5d801e262c4
  slack_sdk:
    "3.48.0": 1213726e5b8015eeded608fcb3665c4e9b48af7f7f383ecc1b90af886d6aaa03

# Who the bot knows: cluster user -> Slack member ID, and the administrators (cluster
# users) who approve what goes beyond the automatic limits.
cluster_bot_members: "{{ slack_members }}"
cluster_bot_admins: "{{ people | default({}) | people_with_role('admin') }}"

# Days before a deadline the person it concerns gets a DM, once each: an allocation's
# end (its owner) and a person's last day (`ends` in the roster: what stops when, and to
# move their files away while they can still log in).
cluster_bot_scratch_remind_days: [7, 1]
cluster_bot_leave_remind_days: [30, 14, 7, 1]

# Account requests (/join, /leave) become pull requests on the site configuration, made
# as the bot's GitHub App (docs/slurm-cluster/cluster-bot.md: creating it). Empty repo
# leaves them off. The App's private key (PEM) is a secret: vault it.
cluster_bot_github_repo: ""
cluster_bot_github_base: main
cluster_bot_github_app_id: ""
cluster_bot_github_installation_id: ""
cluster_bot_github_app_key: ""
# Accounts never offered to a new person (accounts without children are offered).
cluster_bot_join_exclude: [root, admin]
