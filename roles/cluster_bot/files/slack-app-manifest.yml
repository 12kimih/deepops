---
# The cluster bot's Slack app (api.slack.com/apps, "From a manifest"): what
# clusterbot.app handles. Change it together with the app's commands and actions.
display_information:
  name: Cluster bot
features:
  bot_user:
    display_name: cluster-bot
    always_online: true
  slash_commands:
    - command: /scratch
      description: "Fast scratch space: ask, extend, resize, release"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - chat:write.public
      - commands
      - im:write
      - users:read
      - users:read.email
settings:
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
