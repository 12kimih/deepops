---
# The cluster bot's Slack app (api.slack.com/apps, "From a manifest"): what
# clusterbot.app handles. Change it together with the app's commands and actions.
display_information:
  name: Cluster bot
features:
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: true
  bot_user:
    display_name: cluster-bot
    always_online: true
  slash_commands:
    - command: /join
      description: "Ask for a cluster account"
      should_escape: false
    - command: /leave
      description: "Give back a cluster account (graduation)"
      should_escape: false
    - command: /scratch
      description: "Fast scratch space: ask, extend, resize, release"
      should_escape: false
    - command: /unban-request
      description: "Ask to lift the ban on an address after failed logins"
      should_escape: false
    - command: /project
      description: "Start a collaboration folder (the Home tab manages yours)"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - chat:write.public
      - commands
      - im:write
      - pins:write
      - users:read
      - users:read.email
settings:
  event_subscriptions:
    bot_events:
      - app_home_opened
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
