---
_cluster_bot_prefix: "{{ deepops_dir }}/cluster-bot"
_cluster_bot_venv: "{{ _cluster_bot_prefix }}/venv"
_cluster_bot_lib: "{{ _cluster_bot_prefix }}/lib"
_cluster_bot_etc: /etc/cluster-bot
_cluster_bot_config: "{{ _cluster_bot_etc }}/config.json"
_cluster_bot_tokens: {bot: "{{ _cluster_bot_etc }}/bot.token", app: "{{ _cluster_bot_etc }}/app.token"}
_cluster_bot_home: "{{ system_accounts[cluster_bot_user].home }}"
_cluster_bot_unit: cluster-bot.service
_cluster_bot_github_key: "{{ _cluster_bot_etc }}/github-app.pem"
_cluster_bot_known_hosts: "{{ _cluster_bot_etc }}/known_hosts"
# The Slack app manifest, generated at deploy from the subcommand table
# (cluster_bot.commands): what the owner imports into the app (docs: cluster-bot.md).
_cluster_bot_manifest: "{{ _cluster_bot_etc }}/slack-app-manifest.json"
_cluster_bot_ready: "{{ slack_bot_token | length > 0 and slack_app_token | length > 0 }}"
# The hosts the bot acts on, by the component that offers it a service there
# (roles/cluster_bot_access), and their cluster addresses (the from= of its key).
_cluster_bot_ban_hosts: "{{ deepops_component_registry | component_hosts(groups, 'fail2ban', deepops_component_removals) }}"
_cluster_bot_data_hosts: "{{ deepops_component_registry | component_hosts(groups, 'shared_space', deepops_component_removals) }}"
_cluster_bot_reaches: "{{ (_cluster_bot_ban_hosts + _cluster_bot_data_hosts[:1]) | unique }}"
_cluster_bot_addresses: "{{ hostvars | cluster_addresses(_cluster_bot_reaches, cluster_networks) }}"
_cluster_bot_cfg:
  bot_token_file: "{{ _cluster_bot_tokens.bot }}"
  app_token_file: "{{ _cluster_bot_tokens.app }}"
  channels: {help: "{{ slack_channels.help }}", admin: "{{ slack_channels.admin }}"}
  command: "{{ cluster_bot_command }}"
  admin_group: "{{ slack_admin_group }}"
  admin_mention: "{{ slack_admin_mention }}"
  members: "{{ dict(cluster_bot_members.values() | zip(cluster_bot_members.keys())) }}"
  admins: "{{ cluster_bot_admins | map('extract', cluster_bot_members) | select | list }}"
  pending: "{{ _cluster_bot_home }}/requests-pending.json"
  reminders: "{{ _cluster_bot_home }}/reminders-sent.json"
  welcomed: "{{ _cluster_bot_home }}/accounts-welcomed.json"
  # The notices the bot DMs a person, logged for the administrators (cluster_tools.slack).
  dm_log: {channel: "{{ slack_dm_log_channel }}", state: "{{ _cluster_bot_home }}/dm-log.json"}
  # The user docs' notices, posted in the announcement channel on their date
  # (cluster_bot.notices): the docs site publishes them as notices.json.
  notices:
    url: "{{ (cluster_bot_connect.docs_url | regex_replace('/+$', '') ~ '/notices.json') if cluster_bot_connect.docs_url | length > 0 else '' }}"
    channel: "{{ slack_channels.announce }}"
    seen: "{{ _cluster_bot_home }}/notices-posted.json"
  connect: "{{ cluster_bot_connect }}"
  prefs_file: "{{ cluster_bot_prefs_file }}"
  github:
    repo: "{{ cluster_bot_github_repo }}"
    base: "{{ cluster_bot_github_base }}"
    app_id: "{{ cluster_bot_github_app_id }}"
    installation_id: "{{ cluster_bot_github_installation_id }}"
    key_file: "{{ _cluster_bot_github_key }}"
  roster:
    roster: people.yml
    accounting: files/slurm/accounting.yml
    reserved: "{{ system_accounts.values() | map(attribute='uid') | list }}"
    exclude: "{{ cluster_bot_join_exclude }}"
  ssh:
    key: "{{ cluster_bot_key }}"
    user: "{{ cluster_bot_user }}"
    known_hosts: "{{ _cluster_bot_known_hosts }}"
  bans:
    hosts: "{{ dict(_cluster_bot_ban_hosts | zip(_cluster_bot_ban_hosts | map('extract', _cluster_bot_addresses))) }}"
    seen: "{{ _cluster_bot_home }}/bans-seen.json"
  leave:
    remind_days: "{{ cluster_bot_leave_remind_days }}"
    leaving: "{{ people | people_leaving(people_leave_grace_days) }}"
  # Collaboration folders (roles/shared_space): the projects as deployed (the Home tab, and
  # whom to tell of a change), and what a new project's GIDs avoid.
  projects:
    deployed: "{{ shared_projects }}"
    root: "{{ shared_space_root }}/projects"
    gid_min: "{{ shared_projects_gid_min | int }}"
    reserved_gids: "{{ directory_groups | map(attribute='gid') | map('int') | list }}"
    seen: "{{ _cluster_bot_home }}/projects-seen.json"
  # Shared data requests (roles/shared_space's service on the home server; no host leaves
  # them off), and the cleanup's notices (cluster_bot.data).
  data:
    host: "{{ _cluster_bot_addresses[_cluster_bot_data_hosts[0]] if _cluster_bot_data_hosts else '' }}"
    kinds: "{{ shared_space_data }}"
    root: "{{ shared_space_root }}"
    unused_days: "{{ shared_space_data_unused_days | int }}"
    grace_days: "{{ cluster_user_grace_days | int }}"
    seen: "{{ _cluster_bot_home }}/data-seen.json"

# What this component installs, for its record (roles/component_record). The bot's state
# files and key in its home stay (data).
cluster_bot_items:
  - "unit:{{ _cluster_bot_unit }}"
  - "file:/etc/systemd/system/{{ _cluster_bot_unit }}"
  - "file:{{ _cluster_bot_config }}"
  - "file:{{ _cluster_bot_manifest }}"
  - "file:{{ _cluster_bot_tokens.bot }}"
  - "file:{{ _cluster_bot_tokens.app }}"
  - "file:{{ _cluster_bot_known_hosts }}"
  - "file:{{ _cluster_bot_github_key }}"
  - "dir:{{ _cluster_bot_etc }}"
  - "dir:{{ _cluster_bot_prefix }}"
