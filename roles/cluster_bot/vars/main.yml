---
_cluster_bot_prefix: "{{ deepops_dir }}/cluster-bot"
_cluster_bot_venv: "{{ _cluster_bot_prefix }}/venv"
_cluster_bot_lib: "{{ _cluster_bot_prefix }}/lib"
_cluster_bot_etc: /etc/cluster-bot
_cluster_bot_config: "{{ _cluster_bot_etc }}/config.json"
_cluster_bot_tokens: {bot: "{{ _cluster_bot_etc }}/bot.token", app: "{{ _cluster_bot_etc }}/app.token"}
_cluster_bot_home: "{{ system_accounts[cluster_bot_user].home }}"
_cluster_bot_unit: cluster-bot.service
_cluster_bot_known_hosts: "{{ _cluster_bot_etc }}/known_hosts"
_cluster_bot_ready: "{{ slack_bot_token | length > 0 and slack_app_token | length > 0 }}"
_cluster_bot_scratch_host: "{{ (groups['scratch-server'] | default([]))[:1] | join }}"
_cluster_bot_cfg:
  bot_token_file: "{{ _cluster_bot_tokens.bot }}"
  app_token_file: "{{ _cluster_bot_tokens.app }}"
  channels: {help: "{{ slack_channels.help }}", admin: "{{ slack_channels.admin }}"}
  members: "{{ dict(cluster_bot_members.values() | zip(cluster_bot_members.keys())) }}"
  admins: "{{ cluster_bot_admins | map('extract', cluster_bot_members) | select | list }}"
  scratch:
    host: "{{ (hostvars | cluster_addresses([_cluster_bot_scratch_host], cluster_networks))[_cluster_bot_scratch_host] if _cluster_bot_scratch_host else '' }}"
    key: "{{ cluster_bot_key }}"
    user: "{{ cluster_bot_user }}"
    known_hosts: "{{ _cluster_bot_known_hosts }}"
    policy:
      auto_bytes: "{{ scratch_alloc_auto_size | kib * 1024 }}"
      auto_days: "{{ scratch_alloc_auto_days | int }}"
      auto_extensions: "{{ scratch_alloc_auto_extensions | int }}"
    pending: "{{ _cluster_bot_home }}/scratch-pending.json"
    reminders: "{{ _cluster_bot_home }}/scratch-reminders.json"
    remind_days: "{{ cluster_bot_remind_days }}"

# What this component installs, for its record (roles/component_record). The bot's state
# files and key in its home stay (data).
cluster_bot_items:
  - "unit:{{ _cluster_bot_unit }}"
  - "file:/etc/systemd/system/{{ _cluster_bot_unit }}"
  - "file:{{ _cluster_bot_config }}"
  - "file:{{ _cluster_bot_tokens.bot }}"
  - "file:{{ _cluster_bot_tokens.app }}"
  - "file:{{ _cluster_bot_known_hosts }}"
  - "dir:{{ _cluster_bot_etc }}"
  - "dir:{{ _cluster_bot_prefix }}"
