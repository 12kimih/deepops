---
- name: Record what this component installs
  ansible.builtin.include_role:
    name: component_record
  vars:
    component_record_name: cluster_bot
    component_record_action: begin
    component_record_items: "{{ cluster_bot_record_items }}"

- name: Require the pinned Slack libraries' hashes
  ansible.builtin.assert:
    that:
      - cluster_bot_sha256.slack_bolt[cluster_bot_slack_bolt_version] is defined
      - cluster_bot_sha256.slack_sdk[cluster_bot_slack_sdk_version] is defined
      - cluster_bot_sha256.ruamel_yaml[cluster_bot_ruamel_yaml_version] is defined
    fail_msg: >-
      cluster_bot_sha256 has no hash for slack_bolt {{ cluster_bot_slack_bolt_version }} or
      slack_sdk {{ cluster_bot_slack_sdk_version }}; add the wheels' sha256 from PyPI.
    quiet: true

- name: Note the bot's account
  ansible.builtin.set_fact:
    _cluster_bot_account: "{{ {cluster_bot_user: system_accounts[cluster_bot_user]} }}"

- name: Create the bot's account
  ansible.builtin.include_role:
    name: local_accounts
  vars:
    local_accounts: "{{ _cluster_bot_account }}"

- name: Create the bot's directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.owner }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ _cluster_bot_prefix }}", owner: root, mode: "0755"}
    - {path: "{{ _cluster_bot_etc }}", owner: root, mode: "0755"}
    - {path: "{{ _cluster_bot_home }}/.ssh", owner: "{{ cluster_bot_user }}", mode: "0700"}
    - {path: "{{ cluster_bot_prefs_file | dirname }}", owner: "{{ cluster_bot_user }}", mode: "0755"}
  loop_control:
    label: "{{ item.path }}"

# The bot's own key: its way to the hosts it acts on, each of which allows it for one
# forced command (roles/cluster_bot_access). Made on this host, never copied.
- name: Create the bot's SSH key
  ansible.builtin.command:
    argv: [ssh-keygen, -q, -t, ed25519, -N, "", -C, "{{ cluster_bot_user }}@{{ inventory_hostname }}", -f, "{{ cluster_bot_key }}"]
    creates: "{{ cluster_bot_key }}"
  become: true
  become_user: "{{ cluster_bot_user }}"

# A new pin rebuilds the venv from scratch (roles/python_venv).
- name: Install the Slack libraries into the bot's venv
  ansible.builtin.include_role:
    name: python_venv
    tasks_from: create
  vars:
    python_venv_path: "{{ _cluster_bot_venv }}"
    python_venv_steps: "{{ _cluster_bot_venv_steps }}"

- name: Restart the bot for its new venv
  ansible.builtin.debug:
    msg: The bot's venv was built; the bot restarts.
  when: python_venv_built is changed
  changed_when: true
  notify: Restart the cluster bot

# The DM log's day message and count are read from Slack now (cluster_tools.slack.DmLog),
# shared with every other sender; the bot's own copy of them goes.
- name: Remove the DM log's earlier state
  ansible.builtin.file:
    path: "{{ _cluster_bot_home }}/{{ item }}"
    state: absent
  loop: [dm-log.json, dm-log.json.lock]

# Where the first deploys wrote the pins; they live in the venv now.
- name: Remove the pins' earlier place
  ansible.builtin.file:
    path: "{{ _cluster_bot_prefix }}/requirements.txt"
    state: absent

- name: Install the bot's program
  ansible.builtin.copy:
    src: cluster_bot
    dest: "{{ _cluster_bot_lib }}/"
    owner: root
    group: root
    mode: u=rwX,go=rX
  notify: Restart the cluster bot

# The bot imports cluster_tools (its DMs): a new package takes a restart.
- name: Restart the bot for the new cluster_tools package
  ansible.builtin.debug:
    msg: The cluster_tools package changed; the bot restarts.
  when: cluster_tools_lib_changed
  changed_when: true
  notify: Restart the cluster bot

# The roster's checks and editors, the very file the deploy and people.py use: account
# requests edit the roster as an administrator would.
- name: Install the roster module and what it imports
  ansible.builtin.copy:
    src: "{{ role_path }}/../../plugins/filter/{{ item.value }}"
    dest: "{{ _cluster_bot_lib }}/cluster_bot/{{ item.key }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ _cluster_bot_roster_modules | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  notify: Restart the cluster bot

- name: Write the GitHub App's private key
  ansible.builtin.copy:
    dest: "{{ _cluster_bot_github_key }}"
    owner: root
    group: "{{ cluster_bot_user }}"
    mode: "0640"
    content: "{{ cluster_bot_github_app_key | trim }}\n"
  no_log: true
  notify: Restart the cluster bot

# Each token in its own file the bot alone reads: never on a command line or in the unit.
- name: Write the Slack tokens
  ansible.builtin.copy:
    dest: "{{ _cluster_bot_tokens[item.key] }}"
    owner: root
    group: "{{ cluster_bot_user }}"
    mode: "0640"
    content: "{{ item.value }}\n"
  loop: "{{ {'bot': slack_bot_token, 'app': slack_app_token} | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  no_log: true
  notify: Restart the cluster bot

- name: Read the host keys of the hosts the bot reaches
  ansible.builtin.slurp:
    src: /etc/ssh/ssh_host_ed25519_key.pub
  delegate_to: "{{ item }}"
  loop: "{{ _cluster_bot_reaches }}"
  register: cluster_bot_hostkeys

# Each with its key read from the host itself: the bot never trusts a key on first use.
- name: Pin the host keys of the hosts the bot reaches
  ansible.builtin.copy:
    dest: "{{ _cluster_bot_known_hosts }}"
    owner: root
    group: root
    mode: "0644"
    content: |
      # roles/cluster_bot: the hosts the bot reaches.
      {% for key in cluster_bot_hostkeys.results | default([]) if key.content is defined %}
      {{ _cluster_bot_addresses[key.item] }} {{ (key.content | b64decode).split()[:2] | join(' ') }}
      {% endfor %}

- name: Write the bot's configuration
  ansible.builtin.copy:
    dest: "{{ _cluster_bot_config }}"
    owner: root
    group: "{{ cluster_bot_user }}"
    mode: "0640"
    content: "{{ _cluster_bot_cfg | to_nice_json }}\n"
  notify: Restart the cluster bot

# The Slack app manifest from the subcommand table (cluster_bot.commands), with the
# app's name and every scope the cluster's Slack features need: what the owner imports
# into the app, so its command, scopes and events always match this bot.
- name: Generate the Slack app manifest
  ansible.builtin.command:
    argv: "{{ ['python3', '-m', 'cluster_bot.commands', 'manifest', cluster_bot_command, cluster_bot_app_name] + cluster_bot_extra_scopes }}"
    chdir: "{{ role_path }}/files"
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: false
  check_mode: false  # read-only; the preview shows the file it writes
  register: cluster_bot_manifest

- name: Write the Slack app manifest
  ansible.builtin.copy:
    dest: "{{ _cluster_bot_manifest }}"
    owner: root
    group: root
    mode: "0644"
    content: "{{ cluster_bot_manifest.stdout }}\n"

# What the bot still lacks to run, by the settings that give it, so a deploy says the
# whole list at once (docs/slurm-cluster/cluster-bot.md: setting it up).
- name: Say what the cluster bot still needs
  ansible.builtin.debug:
    msg: >-
      The cluster bot is installed but needs: {{ _missing | join('; ') }}. Import
      {{ _cluster_bot_manifest }} into the Slack app first (docs/slurm-cluster/cluster-bot.md).
  vars:
    _missing: >-
      {{ (['slack_bot_token (the app\'s xoxb- bot token, vaulted)'] if slack_bot_token | length == 0 else [])
         + (['slack_app_token (a Socket Mode xapp- app-level token with connections:write, vaulted)'] if slack_app_token | length == 0 else [])
         + (['cluster_bot_github_app_id, cluster_bot_github_installation_id and cluster_bot_github_app_key (vaulted) for account requests on ' ~ cluster_bot_github_repo]
            if cluster_bot_github_repo | length > 0 and (cluster_bot_github_app_id | string | length == 0
              or cluster_bot_github_installation_id | string | length == 0 or cluster_bot_github_app_key | length == 0) else [])
         + (['slack_admin_group_id (the administrators\' user group S... ID) for their mentions'] if slack_admin_group_id | length == 0 else []) }}
  when: _missing | length > 0

- name: Install the bot's unit
  ansible.builtin.template:
    src: cluster-bot.service.j2
    dest: "/etc/systemd/system/{{ _cluster_bot_unit }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart the cluster bot

- name: Install the administrators' command (cluster-bot notices [--dry-run])
  ansible.builtin.template:
    src: cluster-bot.j2
    dest: "{{ _cluster_bot_admin_command }}"
    owner: root
    group: root
    mode: "0755"

# Without both tokens there is nothing to connect with: installed, not running.
- name: Run the cluster bot, or keep it stopped without both tokens
  systemd_unit:
    name: "{{ _cluster_bot_unit }}"
    enabled: "{{ _cluster_bot_ready }}"
    state: "{{ 'started' if _cluster_bot_ready else 'stopped' }}"
    daemon_reload: true

# Whether Slack granted the token every scope the bot needs (cluster_bot.scopes): daily,
# and now, so a scope a new feature needs and the app lacks shows with this deploy.
- name: Install the scopes check's units
  ansible.builtin.template:
    src: "cluster-bot-scopes.{{ item }}.j2"
    dest: "/etc/systemd/system/{{ _cluster_bot_scopes_unit }}.{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: [service, timer]

- name: Check the token's scopes daily, or not without a bot token
  systemd_unit:
    name: "{{ _cluster_bot_scopes_unit }}.timer"
    enabled: "{{ _cluster_bot_ready }}"
    state: "{{ 'started' if _cluster_bot_ready else 'stopped' }}"
    daemon_reload: true

- name: Check the token's scopes now
  ansible.builtin.include_role:
    name: textfile_keep
    tasks_from: refresh
  vars:
    textfile_keep_producers: ["{{ _cluster_bot_scopes_unit }}.service"]
  when: _cluster_bot_ready

- name: Record the component as present
  ansible.builtin.include_role:
    name: component_record
  vars:
    component_record_name: cluster_bot
    component_record_action: present
    component_record_items: "{{ cluster_bot_record_items }}"
