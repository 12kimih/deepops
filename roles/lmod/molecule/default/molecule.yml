---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: lmod-ubuntu-2404
    image: geerlingguy/docker-ubuntu2404-ansible
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  ansible_args:
    - -vv
scenario:
  test_sequence: [destroy, syntax, create, prepare, converge, idempotence, side_effect, verify, destroy]
verifier:
  name: ansible
