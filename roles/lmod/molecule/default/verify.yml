---
- name: Verify
  hosts: all
  become: true
  gather_facts: false
  tasks:
    # The role's own check, again, from outside the run that installed it.
    - name: Ask every shell, in every way it starts, for Lmod's version
      ansible.builtin.script:
        cmd: ../../files/lmod-shell-check.py --version 9.4.5 --shells bash,zsh,tcsh,fish --ssh-reads-system-rc true
        executable: python3
      changed_when: false

    - name: Read the hooks' place in bash.bashrc
      ansible.builtin.command:
        argv: [grep, -n, -e, "DeepOps: Lmod", -e, 'PS1" ] && return', /etc/bash.bashrc]
      register: lmod_bashrc
      changed_when: false

    - name: Check the bash hook comes before the early return, once
      ansible.builtin.assert:
        that:
          - lmod_bashrc.stdout_lines | length == 3
          - "'BEGIN DeepOps: Lmod in every shell' in lmod_bashrc.stdout_lines[0]"
          - "'return' in lmod_bashrc.stdout_lines[2]"
        fail_msg: "{{ lmod_bashrc.stdout }}"

    - name: Read the initial module path
      ansible.builtin.command:
        argv: [/bin/bash, -lc, 'echo $MODULEPATH']
      register: lmod_modulepath
      changed_when: false

    - name: Check the shared tree is on it
      ansible.builtin.assert:
        that: "'/sw/modules/all' in lmod_modulepath.stdout"
        fail_msg: "MODULEPATH is {{ lmod_modulepath.stdout }}"
