#
# ansible role to install lmod:
#
---
- name: Add EPEL (RHEL family)
  ansible.builtin.include_role:
    name: package_repos
    tasks_from: epel

- name: "Install packages"
  become: true
  ansible.builtin.apt:
    update_cache: true
    name:
      - bash
      - tcsh
      - lmod
    state: present
  when: ansible_facts.os_family == "Debian"

- name: "Install packages"
  become: true
  ansible.builtin.dnf:
    name:
      - bash
      - tcsh
      - Lmod
    # Lmod ships from EPEL, whose packages expect CodeReady Builder enabled for their
    # dependencies -- named "powertools" on EL8 and "crb" on EL9+ (Rocky/Alma/CentOS Stream).
    enablerepo: "{{ 'powertools' if ansible_facts.distribution_major_version == '8' else 'crb' }}"
  when: ansible_facts.os_family == "RedHat"

- name: "Mkdir software path"
  become: true
  ansible.builtin.file:
    path: "{{ sm_software_path }}"
    state: directory
    mode: "0755"

- name: "Mkdir module path"
  become: true
  ansible.builtin.file:
    path: "{{ sm_module_path }}"
    state: directory
    mode: "0755"

# Register the shared software-module tree with Lmod via LMOD_SITE_MODULEPATH (the official
# site hook). The distro lmod package's /etc/profile.d/lmod.sh -- generated from Lmod's
# init/profile.in -- initialises the `module` command and prepends every LMOD_SITE_MODULEPATH
# entry to MODULEPATH (preserved across `module reset`). The 00- snippet installed here sorts
# before lmod.sh so the variable is set first. This replaces the old custom z00_lmod.sh, which
# re-implemented Lmod init and hard-set MODULEPATH, both redundant against the distro init.
# https://lmod.readthedocs.io/en/latest/090_configuring_lmod.html
- name: Register the shared module tree with Lmod (LMOD_SITE_MODULEPATH)
  become: true
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/etc/profile.d/{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - {src: "00-modulepath.sh.j2", dest: "00-modulepath.sh"}
    - {src: "00-modulepath.csh.j2", dest: "00-modulepath.csh"}
  tags:
    - configuration
