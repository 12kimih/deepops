---
- name: Check the component state
  ansible.builtin.assert:
    that: lmod_state in ['present', 'absent', 'kept']
    fail_msg: "lmod_state must be present, absent or kept, not {{ lmod_state }}."
    quiet: true

- name: "Make Lmod {{ lmod_state }}"
  ansible.builtin.include_tasks: "{{ lmod_state }}.yml"
  when: lmod_state != 'kept'
