---
# Validated, with every default filled in (plugins/filter/accounts.py).
- name: Check the account declarations
  ansible.builtin.set_fact:
    local_accounts_wanted: "{{ local_accounts | local_accounts_check(local_accounts_shell, local_accounts_groups) }}"

# Read from the local files only: getent would also answer from NIS or the directory.
- name: Read the local accounts and groups
  ansible.builtin.getent:
    database: "{{ item }}"
    service: files
  loop: [passwd, group]
  when: local_accounts_wanted | length > 0

- name: Refuse to renumber an existing account or group
  ansible.builtin.assert:
    that:
      - item.key not in ansible_facts.getent_passwd
        or (ansible_facts.getent_passwd[item.key][1] | int) == item.value.uid
      - item.key not in ansible_facts.getent_group
        or (ansible_facts.getent_group[item.key][1] | int) == item.value.gid
    fail_msg: >-
      {{ item.key }} exists here with UID
      {{ (ansible_facts.getent_passwd[item.key] | default(['', 'none']))[1] }} and group
      GID {{ (ansible_facts.getent_group[item.key] | default(['', 'none']))[1] }}, but is
      declared {{ item.value.uid }}/{{ item.value.gid }}. Changing it would orphan its
      files on shared storage; fix the declaration, or migrate the files and the ID by
      hand.
    quiet: true
  loop: "{{ local_accounts_wanted | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

# A group several accounts share (system_groups: one writer group of a directory), with
# its fixed GID, made before the accounts that join it; never renumbered either.
- name: Refuse to renumber a group the accounts join
  ansible.builtin.assert:
    that: >-
      item not in ansible_facts.getent_group
      or (ansible_facts.getent_group[item][1] | int) == local_accounts_groups[item].gid
    fail_msg: >-
      Group {{ item }} exists here with GID {{ (ansible_facts.getent_group[item] | default(['', 'none']))[1] }},
      but is declared {{ local_accounts_groups[item].gid }}. Fix the declaration, or migrate
      its files and the ID by hand.
    quiet: true
  loop: "{{ local_accounts_wanted.values() | map(attribute='groups') | flatten | unique | sort }}"

- name: Create the groups the accounts also join
  ansible.builtin.group:
    name: "{{ item }}"
    gid: "{{ local_accounts_groups[item].gid }}"
    system: true
  loop: "{{ local_accounts_wanted.values() | map(attribute='groups') | flatten | unique | sort }}"

- name: Create each account's group
  ansible.builtin.group:
    name: "{{ item.key }}"
    gid: "{{ item.value.gid }}"
    system: "{{ item.value.system }}"
  loop: "{{ local_accounts_wanted | dict2items }}"
  loop_control:
    label: "{{ item.key }} ({{ item.value.gid }})"

# useradd copies the skeleton into a home it makes, and warns about one already there (a
# service's data directory made before its account): a home the host has is only named.
- name: Look for each account's home
  ansible.builtin.stat:
    path: "{{ item.value.home }}"
    get_checksum: false
  loop: "{{ local_accounts_wanted | dict2items | selectattr('value.home', 'defined') | list }}"
  loop_control:
    label: "{{ item.key }} ({{ item.value.home }})"
  register: local_accounts_homes

- name: Create or update each account
  ansible.builtin.user:
    name: "{{ item.key }}"
    uid: "{{ item.value.uid }}"
    group: "{{ item.key }}"
    comment: "{{ item.value.comment | default(omit) }}"
    shell: "{{ item.value.shell }}"
    groups: "{{ item.value.groups }}"
    append: true
    home: "{{ item.value.home | default(omit) }}"
    create_home: "{{ item.value.create_home and item.key not in _homes_present }}"
    system: "{{ item.value.system }}"
  loop: "{{ local_accounts_wanted | dict2items }}"
  loop_control:
    label: "{{ item.key }} ({{ item.value.uid }})"
  vars:
    _homes_present: "{{ local_accounts_homes.results | default([]) | selectattr('stat.exists', 'defined')
                        | selectattr('stat.exists') | map(attribute='item.key') | list }}"
