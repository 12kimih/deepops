---
# Validated, with every default filled in (plugins/filter/accounts.py).
- name: Check the account declarations
  ansible.builtin.set_fact:
    local_accounts_wanted: "{{ local_accounts | local_accounts_check(local_accounts_shell) }}"

# Read from the local files only: getent would also answer from NIS or the directory.
- name: Read the local accounts and groups
  ansible.builtin.getent:
    database: "{{ item }}"
    service: files
  loop: [passwd, group]
  when: local_accounts_wanted | length > 0

- name: Refuse to renumber an existing account or group
  ansible.builtin.assert:
    that:
      - item.key not in ansible_facts.getent_passwd
        or (ansible_facts.getent_passwd[item.key][1] | int) == item.value.uid
      - item.key not in ansible_facts.getent_group
        or (ansible_facts.getent_group[item.key][1] | int) == item.value.gid
    fail_msg: >-
      {{ item.key }} exists here with UID
      {{ (ansible_facts.getent_passwd[item.key] | default(['', 'none']))[1] }} and group
      GID {{ (ansible_facts.getent_group[item.key] | default(['', 'none']))[1] }}, but is
      declared {{ item.value.uid }}/{{ item.value.gid }}. Changing it would orphan its
      files on shared storage; fix the declaration, or migrate the files and the ID by
      hand.
    quiet: true
  loop: "{{ local_accounts_wanted | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Create each account's group
  ansible.builtin.group:
    name: "{{ item.key }}"
    gid: "{{ item.value.gid }}"
    system: "{{ item.value.system }}"
  loop: "{{ local_accounts_wanted | dict2items }}"
  loop_control:
    label: "{{ item.key }} ({{ item.value.gid }})"

- name: Create or update each account
  ansible.builtin.user:
    name: "{{ item.key }}"
    uid: "{{ item.value.uid }}"
    group: "{{ item.key }}"
    comment: "{{ item.value.comment | default(omit) }}"
    shell: "{{ item.value.shell }}"
    home: "{{ item.value.home | default(omit) }}"
    create_home: "{{ item.value.create_home }}"
    system: "{{ item.value.system }}"
  loop: "{{ local_accounts_wanted | dict2items }}"
  loop_control:
    label: "{{ item.key }} ({{ item.value.uid }})"
