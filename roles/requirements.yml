---
# Every collection and Galaxy role the playbooks use, at its exact version: ansible-core
# ships none, so a module whose collection is missing here fails to resolve.
# scripts/deepops/galaxy.py installs this file and scripts/check.sh checks it.
collections:
  - name: ansible.posix
    version: 2.2.2

  - name: community.general
    version: 14.0.1

  - name: community.docker
    version: 5.4.0

  - name: ansible.mysql
    version: 5.2.1

  - name: kubernetes.core
    version: 6.6.0

  - name: devsec.hardening
    version: 11.0.0

# First-party utility roles (hosts, chrony, users) and the NVIDIA driver, container
# toolkit and enroot are in-tree roles, so only third-party roles are listed here.
roles:
  - src: andrewrothstein.miniconda
    version: "v6.4.1"
