---
- name: Check the component state
  ansible.builtin.assert:
    that: sssd_client_state in ['present', 'absent', 'kept']
    fail_msg: "sssd_client_state must be present, absent or kept, not {{ sssd_client_state }}."
    quiet: true

- name: "Make sssd_client {{ sssd_client_state }}"
  ansible.builtin.include_tasks: "{{ sssd_client_state }}.yml"
  when: sssd_client_state != 'kept'
