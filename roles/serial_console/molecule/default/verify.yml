---
- name: Verify
  hosts: all
  become: true
  tasks:
    - name: Read the grub defaults
      ansible.builtin.slurp:
        src: /etc/default/grub
      register: grub_defaults

    - name: The serial console block is present, coherent and removable
      ansible.builtin.assert:
        that:
          - "'console=ttyS1,115200n8' in content"
          - "'GRUB_TERMINAL=\"console serial\"' in content"
          - "'--unit=1' in content"
          - "'GRUB_TIMEOUT_STYLE=menu' in content"
          - "'# BEGIN ANSIBLE MANAGED -- serial console' in content"
          - "'# END ANSIBLE MANAGED -- serial console' in content"
      vars:
        content: "{{ grub_defaults.content | b64decode }}"
