---
- name: Verify
  hosts: all
  become: true
  tasks:
    - name: Read the grub defaults
      ansible.builtin.slurp:
        src: /etc/default/grub
      register: grub_defaults

    - name: The serial console block is present and coherent
      ansible.builtin.assert:
        that:
          - "'console=ttyS1,115200n8' in content"
          - "'GRUB_TERMINAL=\"console serial\"' in content"
          - "'--unit=1' in content"
          - "'GRUB_TIMEOUT_STYLE=menu' in content"
      vars:
        content: "{{ grub_defaults.content | b64decode }}"

    - name: The original file was kept
      ansible.builtin.stat:
        path: /etc/default/grub.before-serial-console
      register: grub_backup

    - name: Check the backup exists
      ansible.builtin.assert:
        that: grub_backup.stat.exists
