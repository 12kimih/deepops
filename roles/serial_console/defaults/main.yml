---
# Serial console over the BMC's SOL: the only console another machine can reach on a node
# that stops before the network is up. Which port SOL is wired to is a BIOS setting the OS
# cannot read -- confirm by attaching during a boot, a blank screen means the other one.
serial_console_port: ttyS1
serial_console_speed: 115200

# GRUB's own menu on the serial line too, so a stuck node can be booted with different
# kernel arguments. A hidden zero-second menu cannot be caught over a serial line.
serial_console_grub_menu: true
serial_console_grub_timeout: 5
