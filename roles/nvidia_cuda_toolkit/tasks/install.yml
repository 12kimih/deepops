---
# Download + install the toolkits, then generate one Lmod modulefile per
# installed version. Runs only on the software-tree host.

- name: Assert the install host is x86_64 (CUDA runfiles are x86_64 only)
  ansible.builtin.assert:
    that: ansible_facts.architecture == "x86_64"
    fail_msg: "CUDA runfiles are x86_64 only (this host is {{ ansible_facts.architecture }})."

# A toolkit runs on a driver of its own CUDA major or newer (minor version
# compatibility within a major): one the nodes' driver branch cannot run is refused
# here, not discovered by a user's first job.
- name: Refuse toolkits the nodes' driver cannot run
  ansible.builtin.assert:
    that:
      - (item.version.split('.')[0] | int) in nvidia_cuda_min_driver_branch
      - (item.version.split('.')[0] | int) <= (nvidia_driver_cuda_major | int)
    fail_msg: >-
      CUDA {{ item.version }} needs a driver branch of at least
      {{ nvidia_cuda_min_driver_branch[item.version.split('.')[0] | int] | default('(unknown: add its major to nvidia_cuda_min_driver_branch)') }};
      nvidia_driver_branch is {{ nvidia_driver_branch }} (CUDA {{ nvidia_driver_cuda_major }}).
      Raise the driver branch first, or drop this toolkit from cuda_versions.
    quiet: true
  loop: "{{ cuda_versions }}"
  loop_control:
    label: "{{ item.version }}"

- name: Ensure the CUDA install, module, and cache directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ cuda_install_root }}"
    - "{{ cuda_modroot }}/cuda"
    - "{{ cuda_cache_dir }}/tmp"

- name: Probe which toolkits are already installed (idempotency)
  ansible.builtin.stat:
    path: "{{ cuda_install_root }}/{{ item.version }}/bin/nvcc"
  loop: "{{ cuda_versions }}"
  loop_control:
    label: "{{ item.version }}"
  register: cuda_nvcc_pre

- name: Build the list of toolkits still to install
  ansible.builtin.set_fact:
    cuda_to_install: "{{ cuda_nvcc_pre.results | rejectattr('stat.exists') | map(attribute='item') | list }}"

- name: Download the CUDA runfiles
  ansible.builtin.include_role:
    name: download
  vars:
    download_url: "{{ cuda_base_url }}/{{ item.version }}/local_installers/{{ item.runfile }}"
    download_checksum: "{{ cuda_runfile_checksums[item.runfile] | default('') }}"
    download_dest: "{{ cuda_cache_dir }}/{{ item.runfile }}"
  loop: "{{ cuda_to_install }}"
  loop_control:
    label: "{{ item.version }}"

# Official runfile options (CUDA Installation Guide, Advanced Options):
#   --silent       non-interactive
#   --toolkit      install the CUDA Toolkit only (no driver -- host driver safe)
#   --toolkitpath  per-version install location
#   --override     ignore compiler/toolkit detection checks (newer host gcc)
#   --no-man-page  skip man pages
#   --tmpdir       scratch dir (in case /tmp is small)
- name: Install the CUDA toolkits (toolkit only -- driver untouched)
  ansible.builtin.command:
    cmd: >-
      sh {{ cuda_cache_dir }}/{{ item.runfile }}
      --silent --toolkit
      --toolkitpath={{ cuda_install_root }}/{{ item.version }}
      --override --no-man-page
      --tmpdir={{ cuda_cache_dir }}/tmp
    creates: "{{ cuda_install_root }}/{{ item.version }}/bin/nvcc"
  loop: "{{ cuda_to_install }}"
  loop_control:
    label: "{{ item.version }}"

- name: Re-probe installed toolkits (post-install, for modulefile generation)
  ansible.builtin.stat:
    path: "{{ cuda_install_root }}/{{ item.version }}/bin/nvcc"
  loop: "{{ cuda_versions }}"
  loop_control:
    label: "{{ item.version }}"
  register: cuda_nvcc_post

- name: Record which toolkits are installed
  ansible.builtin.set_fact:
    cuda_installed: "{{ cuda_nvcc_post.results | selectattr('stat.exists') | map(attribute='item') | list }}"

- name: Generate one Lmod modulefile per installed toolkit
  ansible.builtin.template:
    src: "cuda.lua.j2"
    dest: "{{ cuda_modroot }}/cuda/{{ item.version }}.lua"
    mode: "0644"
  loop: "{{ cuda_installed }}"
  loop_control:
    label: "{{ item.version }}"

# The modules directory is shared with every other module tree; a version dropped from
# cuda_versions leaves its modulefile behind unless recorded.
- name: Remove modulefiles of toolkits no longer installed
  ansible.builtin.include_role:
    name: recorded_files
  vars:
    recorded_files_record: /var/lib/deepops/recorded/cuda-modulefiles
    recorded_files_names: "{{ cuda_installed | map(attribute='version') | map('regex_replace', '$', '.lua') | list }}"
    recorded_files_dirs: ["{{ cuda_modroot }}/cuda"]
