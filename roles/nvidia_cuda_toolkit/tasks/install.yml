---
# Download + install the toolkits in cuda_versions, write one Lmod modulefile per CUDA
# minor, and remove what left the range. Runs only on the software-tree host. This role
# owns cuda_install_root and cuda_modroot/cuda: every version-named entry there is its.

- name: Assert the install host is x86_64 (the catalog holds the x86_64 runfiles)
  ansible.builtin.assert:
    that: ansible_facts.architecture == "x86_64"
    fail_msg: "The CUDA catalog holds x86_64 runfiles (this host is {{ ansible_facts.architecture }})."

# A toolkit runs on a driver of its own CUDA major or newer (minor version
# compatibility within a major). cuda_versions stops at the driver's major by itself;
# a site's own list that goes further is refused here, not by a user's first job.
- name: Refuse toolkits the nodes' driver cannot run
  ansible.builtin.assert:
    that:
      - (item.version.split('.')[0] | int) in nvidia_cuda_min_driver_branch
      - (item.version.split('.')[0] | int) <= (nvidia_driver_cuda_major | int)
    fail_msg: >-
      CUDA {{ item.version }} needs a driver branch of at least
      {{ nvidia_cuda_min_driver_branch[item.version.split('.')[0] | int] | default('(unknown: add its major to nvidia_cuda_min_driver_branch)') }};
      nvidia_driver_branch is {{ nvidia_driver_branch }} (CUDA {{ nvidia_driver_cuda_major }}).
      Raise the driver branch first, or drop this toolkit from cuda_versions.
    quiet: true
  loop: "{{ cuda_versions }}"
  loop_control:
    label: "{{ item.version }}"

- name: Say which catalog releases the driver keeps out
  ansible.builtin.debug:
    msg: >-
      Not installed until the driver branch serves their CUDA major:
      {{ _too_new | map(attribute='version') | join(', ') }}
  vars:
    _too_new: "{{ cuda_releases | rejectattr('version', 'version', (nvidia_driver_cuda_major | int + 1) ~ '.0', '<') | list }}"
  when: _too_new | length > 0

- name: Ensure the CUDA install, module, and cache directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ cuda_install_root }}"
    - "{{ cuda_modroot }}/cuda"
    - "{{ cuda_cache_dir }}/tmp"

# A version tree appears only once its install finished (install_one.yml renames it
# from a hidden .partial tree), so its nvcc means a complete toolkit.
- name: Probe which toolkits are already installed (idempotency)
  ansible.builtin.stat:
    path: "{{ cuda_install_root }}/{{ item.version }}/bin/nvcc"
  loop: "{{ cuda_versions }}"
  loop_control:
    label: "{{ item.version }}"
  register: cuda_nvcc_pre

- name: Build the list of toolkits still to install
  ansible.builtin.set_fact:
    cuda_to_install: "{{ cuda_nvcc_pre.results | rejectattr('stat.exists') | map(attribute='item') | list }}"

# Run as root, the runfile also writes host-wide files named per component, not per
# version (/usr/local/cuda, /etc/ld.so.conf.d/cuda-X-Y.conf, /usr/lib/pkgconfig/*.pc,
# nsight .desktop files) and records them as owned in /var/log/nvidia/.uninstallManifests.
# Toolkits side by side overwrite each other's, the host linker resolves CUDA libraries
# outside any module, and the 13.5+ installer aborts when a file another toolkit's
# manifest owns has changed ("installed shared generated output changed"). Every
# --installpath/--toolkitpath combination writes them, so they are removed before and
# after the installs: a toolkit here is reached only through its module.
- name: Remove the host-wide files earlier installs left
  ansible.builtin.include_tasks: system_files.yml
  when: cuda_to_install | length > 0

# One toolkit at a time (space check, download, install, drop the runfile): the peak is
# one runfile and its unpacked copy, not the whole catalog, on a disk the host shares.
- name: Install each missing toolkit
  ansible.builtin.include_tasks: install_one.yml
  loop: "{{ cuda_to_install }}"
  loop_control:
    loop_var: cuda_toolkit
    label: "{{ cuda_toolkit.version }}"

- name: Remove the host-wide files the installs wrote
  ansible.builtin.include_tasks: system_files.yml

# A runfile is needed only until its toolkit is installed (a failed install keeps its
# own for the rerun, which stops before this task).
- name: Find the cached runfiles
  ansible.builtin.find:
    paths: "{{ cuda_cache_dir }}"
    patterns: "*.run"
  register: cuda_cached_runfiles

- name: Remove the cached runfiles
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ cuda_cached_runfiles.files | map(attribute='path') | list }}"

# Named by minor: a patch release changes what cuda/12.4 points at, never the name a
# job script loads.
- name: Generate one Lmod modulefile per CUDA minor
  ansible.builtin.template:
    src: "cuda.lua.j2"
    dest: "{{ cuda_modroot }}/cuda/{{ item.version | regex_replace('\\.[0-9]+$', '') }}.lua"
    mode: "0644"
  loop: "{{ cuda_versions }}"
  loop_control:
    label: "{{ item.version }}"
  when: not ansible_check_mode or item not in cuda_to_install

# Every patch level loads its minor (cuda/12.4.1 is cuda/12.4), and a bare `module
# load cuda` takes the newest. https://lmod.readthedocs.io/en/latest/060_locating.html
- name: Write the module aliases and default
  ansible.builtin.template:
    src: "modulerc.lua.j2"
    dest: "{{ cuda_modroot }}/cuda/.modulerc.lua"
    mode: "0644"

# What left the range goes: a minor below cuda_toolkit_oldest, a previous patch of a
# minor, and their modulefiles (a running job that loaded one loses it, so change the
# range in a maintenance window). A toolkit only the driver keeps out loses its
# modulefile but keeps its tree: a lowered driver branch must not delete software.
- name: Find what the software tree holds
  ansible.builtin.find:
    paths: ["{{ cuda_install_root }}", "{{ cuda_modroot }}/cuda"]
    file_type: any
    patterns: ['^[0-9]+\.[0-9]+(\.[0-9]+)?(\.lua)?$']
    use_regex: true
  register: cuda_present

- name: Remove toolkits and modulefiles no longer offered
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ cuda_present.files | map(attribute='path') | reject('in', _keep) | list }}"
  vars:
    _keep: >-
      {{ (cuda_releases | selectattr('version', 'version', cuda_toolkit_oldest, '>=') | map(attribute='version')
          | map('regex_replace', '^', cuda_install_root ~ '/') | list)
         + (cuda_versions | map(attribute='version') | map('regex_replace', '\.[0-9]+$', '.lua')
            | map('regex_replace', '^', cuda_modroot ~ '/cuda/') | list) }}

# An install that failed for a version since dropped from cuda_versions leaves its
# .partial tree (install_one.yml); hidden, the find above never sees it.
- name: Find unfinished toolkit installs
  ansible.builtin.find:
    paths: "{{ cuda_install_root }}"
    file_type: directory
    hidden: true
    patterns: ['^\.[0-9]+\.[0-9]+(\.[0-9]+)?\.partial$']
    use_regex: true
  register: cuda_partial

- name: Remove unfinished toolkit installs
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ cuda_partial.files | map(attribute='path') | list }}"

# The record the modulefiles were tracked with before the role owned the directory.
- name: Remove the retired modulefile record
  ansible.builtin.file:
    path: /var/lib/deepops/recorded/cuda-modulefiles
    state: absent
