---
# One toolkit (cuda_toolkit, an entry of cuda_releases): refuse to start without room,
# download, install, drop the runfile.

- name: Refuse to start without room for {{ cuda_toolkit.version }}
  ansible.builtin.include_role:
    name: free_space
  vars:
    free_space_paths: ["{{ cuda_cache_dir }}", "{{ cuda_install_root }}"]
    free_space_gb: "{{ cuda_install_free_gb }}"
    free_space_for: "CUDA {{ cuda_toolkit.version }}"

- name: Download {{ cuda_toolkit.version }}
  ansible.builtin.include_role:
    name: download
  vars:
    download_url: "{{ cuda_base_url }}/{{ cuda_toolkit.version }}/local_installers/{{ cuda_toolkit.runfile }}"
    download_checksum: "{{ cuda_toolkit.checksum }}"
    download_dest: "{{ cuda_cache_dir }}/{{ cuda_toolkit.runfile }}"

# Official runfile options (CUDA Installation Guide, Advanced Options):
#   --silent       non-interactive
#   --toolkit      install the CUDA Toolkit only (no driver -- host driver safe)
#   --toolkitpath  per-version install location
#   --override     ignore compiler/toolkit detection checks (newer host gcc)
#   --no-man-page  skip man pages
#   --tmpdir       scratch dir (in case /tmp is small)
- name: Install the toolkit (never the driver) for {{ cuda_toolkit.version }}
  ansible.builtin.command:
    cmd: >-
      sh {{ cuda_cache_dir }}/{{ cuda_toolkit.runfile }}
      --silent --toolkit
      --toolkitpath={{ cuda_install_root }}/{{ cuda_toolkit.version }}
      --override --no-man-page
      --tmpdir={{ cuda_cache_dir }}/tmp
    creates: "{{ cuda_install_root }}/{{ cuda_toolkit.version }}/bin/nvcc"

- name: Remove the runfile of {{ cuda_toolkit.version }}
  ansible.builtin.file:
    path: "{{ cuda_cache_dir }}/{{ cuda_toolkit.runfile }}"
    state: absent
