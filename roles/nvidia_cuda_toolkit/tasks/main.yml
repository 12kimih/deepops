---
# CUDA modulefiles land in cuda_modroot (default sm_module_path), a tree the lmod role
# registers with Lmod (lmod_module_paths). A cuda_modroot outside those trees needs to be
# added there. The download+install path runs only where the playbook sets
# nvidia_cuda_toolkit_install.

- name: Install CUDA toolkits from the official runfiles
  ansible.builtin.import_tasks: install.yml
  when: nvidia_cuda_toolkit_install | bool
