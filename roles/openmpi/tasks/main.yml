---
- name: Check the component state
  ansible.builtin.assert:
    that: openmpi_state in ['present', 'absent', 'kept']
    fail_msg: "openmpi_state must be present, absent or kept, not {{ openmpi_state }}."
    quiet: true

- name: Gather os specific variables
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - files:
        - "{{ ansible_facts.distribution | lower }}.yml"
        - "{{ ansible_facts.os_family | lower }}.yml"
      paths:
        - ../vars
      skip: true
  tags:
    - always

- name: "Make Open MPI {{ openmpi_state }}"
  ansible.builtin.include_tasks: "{{ openmpi_state }}.yml"
  when: openmpi_state != 'kept'
