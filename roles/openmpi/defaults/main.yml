---
# OpenMPI built from source for the Slurm cluster. 5.0.x is the current stable
# series; 4.0.x is EOL. When built against the distribution PMIx
# (config.example's override below), it compiles against the libpmix-dev headers Slurm
# also uses (5.0.x needs PMIx >= 4.2.0; Ubuntu 24.04 ships 5.0.1).
# upstream: git https://github.com/open-mpi/ompi v(\d+)\.(\d+)\.(\d+)
openmpi_version: 5.0.11
openmpi_tag: "v{{ openmpi_version.split('.')[0] }}.{{ openmpi_version.split('.')[1] }}"
openmpi_src_url: "https://download.open-mpi.org/release/open-mpi/{{ openmpi_tag }}/openmpi-{{ openmpi_version }}.tar.bz2"
# Per version, as published on open-mpi.org (roles/download).
openmpi_checksums:
  "5.0.11": "sha256:e668a3c4acd50c41dc204c8a6dd98a611e0f26af89cf677577fa9be8a2698003"
# Root builds here, so never under a world-writable directory such as /tmp. Each
# version builds in its own tree, so the installed version is uninstalled from the tree
# that installed it; the older trees are removed.
openmpi_install_prefix: /usr/local
# Default builds OpenMPI's bundled (internal) PMIx. On 5.0.x that bundled PMIx is
# 5.x -- the SAME major as the distribution PMIx Slurm loads (5.0 on Ubuntu 24.04) -- so they are
# wire-compatible with no cross-version risk, and it builds anywhere without a
# prebuilt external PMIx. For the tightest coupling you can instead build against
# the SAME external PMIx + hwloc Slurm uses (SchedMD best practice); config.example
# ships that override. Note v5 removed --with-pmi/--with-slurm; `srun --mpi=pmix`
# needs only PMIx. https://slurm.schedmd.com/mpi_guide.html
openmpi_configure: "./configure --prefix={{ openmpi_install_prefix }} --disable-dependency-tracking --disable-getpwuid --with-pmix=internal"
# Rebuild Open MPI even when the installed build matches its record.
openmpi_force_rebuild: false
# What the installed Open MPI was built from (roles/build_record).
openmpi_build_record: "{{ openmpi_install_prefix }}/bin/ompi_info.built-from"
openmpi_build_key: "openmpi {{ openmpi_version }}: {{ openmpi_configure }}"
# The distribution's Open MPI, removed so it cannot shadow the build (per OS family).
openmpi_distro_packages:
  Debian: [openmpi-bin, openmpi-common, libopenmpi-dev]
  RedHat: [openmpi, openmpi-devel]
