---
- name: Check the component state
  ansible.builtin.assert:
    that: ingress_policy_state in ['present', 'absent', 'kept']
    fail_msg: "ingress_policy_state must be present, absent or kept, not {{ ingress_policy_state }}."
    quiet: true

- name: "Make the ingress policy {{ ingress_policy_state }}"
  ansible.builtin.include_tasks: "{{ ingress_policy_state }}.yml"
  when: ingress_policy_state != 'kept'
