---
fail2ban_dropin: /etc/fail2ban/jail.d/deepops.local
# What this component installs, for its record (roles/component_record).
fail2ban_items:
  - package:fail2ban
  - unit:fail2ban.service
  - "file:{{ fail2ban_dropin }}"
# A whole copy of jail.conf saved as jail.local (the way it was often set up by hand)
# is told by jail.conf's own header; it overrides every distribution default.
fail2ban_copied_jail_local: "Changes:  in most of the cases you should not modify this"
