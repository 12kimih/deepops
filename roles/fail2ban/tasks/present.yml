---
- name: Check the platform
  ansible.builtin.assert:
    that: ansible_facts.os_family == "Debian"
    fail_msg: roles/fail2ban supports the Debian family (its defaults are Debian's jail.d).
    quiet: true

- name: Record what this component installs
  ansible.builtin.include_role:
    name: component_record
  vars:
    component_record_name: fail2ban
    component_record_action: begin
    component_record_items: "{{ fail2ban_items }}"

- name: Install fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Write the site's settings
  ansible.builtin.template:
    src: deepops.local.j2
    dest: "{{ fail2ban_dropin }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban

# Evidence only: a jail.local a site wrote for itself stays.
- name: Look for jail.local
  ansible.builtin.stat:
    path: /etc/fail2ban/jail.local
  register: fail2ban_local

- name: Read whether it is a copy of jail.conf
  ansible.builtin.command:
    argv: [grep, -qF, "{{ fail2ban_copied_jail_local }}", /etc/fail2ban/jail.local]
  register: fail2ban_copy
  changed_when: false
  failed_when: fail2ban_copy.rc > 1
  check_mode: false  # read-only; --check needs the result
  when: fail2ban_local.stat.exists

- name: Remove the copy, which overrides every default
  ansible.builtin.file:
    path: /etc/fail2ban/jail.local
    state: absent
  when: fail2ban_local.stat.exists and fail2ban_copy.rc == 0
  notify: Restart fail2ban

# Before the restart: a configuration fail2ban refuses would stop it banning at all.
- name: Let fail2ban check the configuration
  ansible.builtin.command:
    argv: [fail2ban-client, --test]
  changed_when: false
  when: not ansible_check_mode  # under --check it may not be installed yet

- name: Run fail2ban
  systemd_unit:
    name: fail2ban
    enabled: true
    state: started

# The cluster bot reads the ban list and lifts a ban an administrator approved
# (/unban-request) through cluster-bans alone (roles/cluster_bot_access).
- name: Offer the bot the ban list and unbans
  when: cluster_bot_host | length > 0
  block:
    - name: Offer the bot the bans service
      ansible.builtin.include_role:
        name: cluster_bot_access
      vars:
        cluster_bot_access_service: "{{ _fail2ban_bot_service }}"

    - name: Install the ban command
      ansible.builtin.include_role:
        name: cluster_tools_lib
        tasks_from: command
      vars:
        cluster_tools_lib_command: {dest: "{{ _fail2ban_bans_command }}", module: cluster_tools.bans}

- name: Record the component as present
  ansible.builtin.include_role:
    name: component_record
  vars:
    component_record_name: fail2ban
    component_record_action: present
    component_record_items: "{{ fail2ban_items }}"
