---
# present, absent or kept (docs/deepops/component-state.md): fail2ban, banning an address
# after repeated failed logins. A deploy sets it from deepops_components
# (slurm_enable_fail2ban, kube_enable_fail2ban). While the cluster has a bot
# (roles/cluster_bot) it offers it the ban list and unbans (its unban subcommand, an
# administrator approves; roles/cluster_bot_access).
fail2ban_state: present

# [DEFAULT] settings of the site's jail.d/deepops.local, over the distribution's
# defaults (Debian: nftables bans, the systemd journal): bantime (-1 bans for good),
# findtime, maxretry. fail2ban's own: 10m, 10m, 5.
fail2ban_settings: {}
# Addresses never banned, besides the host's own: the cluster's networks
# (roles/network_defaults). A range rather than each host's address, so a host whose
# facts are stale or missing is still never banned; it must not hold a range the hosts
# share with others.
fail2ban_ignoreip: "{{ cluster_networks }}"
