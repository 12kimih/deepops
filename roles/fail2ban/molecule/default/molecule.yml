---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: fail2ban-ubuntu-2404
    image: geerlingguy/docker-ubuntu2404-ansible
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  ansible_args:
    - -vv
  inventory:
    group_vars:
      all:
        fail2ban_settings: {bantime: -1, findtime: 3d, maxretry: 5}
        fail2ban_ignoreip: [192.0.2.0/24]
scenario:
  test_sequence: [destroy, syntax, create, prepare, converge, idempotence, side_effect, verify, destroy]
verifier:
  name: ansible
