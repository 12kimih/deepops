---
# A Prometheus host also reads the expected component state (prometheus_paths), seen
# through the host's root mount.
node_exporter_expected: >-
  {{ inventory_hostname in deepops_component_registry | component_hosts(groups, 'prometheus', deepops_component_removals) }}
# What this component installs, for its record (roles/component_record).
node_exporter_items:
  - "unit:{{ node_exporter_svc_name }}"
  - "container:{{ node_exporter_svc_name }}"
  - "file:/etc/systemd/system/{{ node_exporter_svc_name }}"
  - "file:{{ node_exporter_prom_dir_tmpfiles }}"
