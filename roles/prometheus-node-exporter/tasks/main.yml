---
- name: Check the component state
  ansible.builtin.assert:
    that: node_exporter_state in ['present', 'absent', 'kept']
    fail_msg: "node_exporter_state must be present, absent or kept, not {{ node_exporter_state }}."
    quiet: true

- name: "Make node_exporter {{ node_exporter_state }}"
  ansible.builtin.include_tasks: "{{ node_exporter_state }}.yml"
  when: node_exporter_state != 'kept'
