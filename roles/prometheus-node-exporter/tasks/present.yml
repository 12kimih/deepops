---
- name: Record what this component installs
  ansible.builtin.include_role:
    name: component_record
  vars:
    component_record_name: node_exporter
    component_record_action: begin
    component_record_items: "{{ node_exporter_items }}"

# Prometheus generates every exporter's scrape targets (roles/prometheus); the file this
# role wrote on each host before goes. Not on a Prometheus host: there the prometheus
# role replaces it with the generated targets, and removing it first, by an exporter
# run ahead of that one, would stop the scrape until then.
- name: Remove the scrape target file this role wrote before
  ansible.builtin.file:
    path: "{{ prometheus_cfg_endpoint_dir }}/node-exporter.yml"
    state: absent
  when: inventory_hostname not in deepops_component_registry | component_hosts(groups, 'prometheus', deepops_component_removals)

# The textfile directory it binds is a tmpfs: made at every boot, before the container
# starts (a missing bind source stops it; nothing else made it on every host).
- name: Make the textfile directory at every boot
  ansible.builtin.include_role:
    name: textfile_keep
    tasks_from: directory

- name: Pull the image
  ansible.builtin.include_role:
    name: container_image
  vars:
    container_image: "{{ node_exporter_container }}"

# The host's /proc and /sys come through the root bind (rslave, so a mount made after
# the start, NFS or /scratch, shows too): Docker masks parts of the container's own
# (/proc/interrupts, /sys/.../thermal_throttle, powercap). The systemd collector needs
# D-Bus, which Docker's default AppArmor profile blocks. The unit carries the image, the
# collectors and the limits; the scrape targets are Prometheus's, so node-exporter
# restarts for the unit, never for them.
- name: Run node-exporter
  ansible.builtin.include_role:
    name: container_service
  vars:
    _systemd: "{{ 'systemd' in node_exporter_extra_collectors }}"
    container_service:
      unit: "{{ node_exporter_svc_name }}"
      description: Prometheus Node Exporter
      image: "{{ node_exporter_container }}"
      options: >-
        {{ ['--network host', '--pid=host', '--cpus=' ~ node_exporter_max_cpu]
           + (['--security-opt apparmor=unconfined'] if _systemd else []) }}
      mounts: >-
        {{ [{'src': '/', 'dst': '/host', 'readonly': true, 'propagation': 'rslave'},
            {'src': node_exporter_prom_dir, 'dst': node_exporter_prom_dir, 'readonly': true}]
           + ([{'src': '/run/dbus/system_bus_socket', 'dst': '/var/run/dbus/system_bus_socket', 'readonly': true}]
              if _systemd else []) }}
      args: >-
        {{ ['--path.rootfs=/host', '--path.procfs=/host/proc', '--path.sysfs=/host/sys',
            '--path.udev.data=/host/run/udev/data', '--web.listen-address=:' ~ node_exporter_port,
            '--collector.textfile.directory=' ~ node_exporter_prom_dir]
           + node_exporter_extra_collectors | map('regex_replace', '^', '--collector.') | list
           + node_exporter_disabled_collectors | map('regex_replace', '^', '--no-collector.') | list
           + (["--collector.systemd.unit-include='" ~ node_exporter_systemd_unit_include ~ "'"] if _systemd else []) }}
      state: "{{ node_exporter_service_state }}"
      enabled: "{{ node_exporter_service_enabled }}"
      notify: [Restart node-exporter]
      health_url: "http://localhost:{{ node_exporter_port }}/metrics"

- name: Record the component as present
  ansible.builtin.include_role:
    name: component_record
  vars:
    component_record_name: node_exporter
    component_record_action: present
    component_record_items: "{{ node_exporter_items }}"
    component_record_version: "{{ node_exporter_container | regex_replace('@.*', '') }}"
