---
- name: Install the AI agent rules
  when: ai_agent_rules_url | length > 0
  block:
    - name: Require a pinned hash with the URL
      ansible.builtin.assert:
        that: ai_agent_rules_sha256 is match('^[0-9a-f]{64}$')
        fail_msg: >-
          Set ai_agent_rules_sha256 to the SHA-256 of the reviewed rules file; the cluster
          installs only the version an admin approved.
        quiet: true

    # Downloaded once, on the controller, and only accepted if it matches the pin.
    - name: Fetch the approved rules
      ansible.builtin.get_url:
        url: "{{ ai_agent_rules_url }}"
        dest: "{{ ai_agent_rules_download }}"
        checksum: "sha256:{{ ai_agent_rules_sha256 }}"
        mode: "0644"
      delegate_to: localhost
      run_once: true
      become: false
      vars:
        ai_agent_rules_download: "{{ lookup('env', 'TMPDIR') | default('/tmp', true) }}/ai-agent-rules-{{ ai_agent_rules_sha256 }}.md"
      register: ai_agent_rules_fetch

    - name: Read the rules
      ansible.builtin.set_fact:
        ai_agent_rules_text: "{{ lookup('ansible.builtin.file', ai_agent_rules_fetch.dest, rstrip=false) }}"

    - name: Check it is the rules file
      ansible.builtin.assert:
        that:
          - ai_agent_rules_text.startswith(ai_agent_rules_marker)
          - ai_agent_rules_text | length <= ai_agent_rules_max_bytes
        fail_msg: "{{ ai_agent_rules_url }} is not an agent rules file, or exceeds {{ ai_agent_rules_max_bytes }} bytes."
        quiet: true

    - name: Create the agents' admin config dirs
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - "{{ ai_agent_rules_claude_file | dirname }}"
        - "{{ ai_agent_rules_codex_file | dirname }}"

    - name: Install the rules for Claude Code
      ansible.builtin.copy:
        content: "{{ ai_agent_rules_text }}"
        dest: "{{ ai_agent_rules_claude_file }}"
        owner: root
        group: root
        mode: "0644"

    - name: Install the rules for Codex
      ansible.builtin.template:
        src: requirements.toml.j2
        dest: "{{ ai_agent_rules_codex_file }}"
        owner: root
        group: root
        mode: "0644"
