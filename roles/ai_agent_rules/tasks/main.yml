---
- name: Install the AI agent rules
  when: ai_agent_rules_url | length > 0
  block:
    - name: Install the refresh module
      ansible.builtin.copy:
        src: ai_agent_rules.py
        dest: "{{ cluster_tools_lib_dir }}/ai_agent_rules.py"
        owner: root
        group: root
        mode: "0644"

    - name: Install the refresh command
      ansible.builtin.include_role:
        name: cluster_tools_lib
        tasks_from: command
      vars:
        cluster_tools_lib_command:
          dest: "{{ ai_agent_rules_command }}"
          module: ai_agent_rules

    - name: Create the agents' admin config dirs
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - "{{ ai_agent_rules_claude_file | dirname }}"
        - "{{ ai_agent_rules_codex_file | dirname }}"

    - name: Install systemd units
      ansible.builtin.template:
        src: "ai-agent-rules.{{ item }}.j2"
        dest: "/etc/systemd/system/{{ ai_agent_rules_svc_name }}.{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop: [service, timer]
      notify: Restart agent rules timer

    # Install the rules now rather than at the first timer run.
    - name: Fetch and install the rules
      ansible.builtin.command: >-
        {{ ai_agent_rules_command }} --url {{ ai_agent_rules_url | quote }}
        --claude {{ ai_agent_rules_claude_file }} --codex {{ ai_agent_rules_codex_file }}
      register: ai_agent_rules_run
      changed_when: "'installed' in ai_agent_rules_run.stdout"

    - name: Enable the refresh timer
      ansible.builtin.systemd:
        name: "{{ ai_agent_rules_svc_name }}.timer"
        state: started
        enabled: true
        daemon_reload: true
