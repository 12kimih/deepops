---
# What the NIS roles must agree on, written once for nis_server and nis_client.
# The NIS domain, and the server clients bind to; empty means the site has no NIS.
nis_domain: ""
nis_server: ""
# Designate THIS host as the NIS master. Set true for the server node only, e.g. in
# group_vars/nis-master.yml (the [nis-master] inventory group) or that host's
# host_vars. Default false so the server role is a no-op everywhere else, and the
# client role removes ypserv there.
nis_make_server: false
