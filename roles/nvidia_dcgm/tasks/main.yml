---
- name: Check the component state
  ansible.builtin.assert:
    that: dcgm_state in ['present', 'absent', 'kept']
    fail_msg: "dcgm_state must be present, absent or kept, not {{ dcgm_state }}."
    quiet: true

# DCGM talks to the GPUs through NVML: a node without them has nothing to install
# (ansible_facts.ansible_local.gpus, roles/facts) and nothing it could have.
- name: "Make DCGM {{ dcgm_state }}"
  ansible.builtin.include_tasks: "{{ dcgm_state }}.yml"
  when:
    - dcgm_state != 'kept'
    - dcgm_state == 'absent' or (ansible_facts.ansible_local.gpus.count | default(0) | int) > 0
