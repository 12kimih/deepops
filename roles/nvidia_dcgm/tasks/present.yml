---
- name: Check for DGX
  ansible.builtin.set_fact:
    dcgm_is_dgx: true
  when: ansible_facts.product_name is search("DGX")

- name: Record what this component installs
  ansible.builtin.include_role:
    name: component_record
  vars:
    component_record_name: dcgm
    component_record_action: begin
    component_record_items: "{{ dcgm_items }}"

# Through a transient unit: on a Slurm node the ssh session does not see the GPUs.
- name: Read the GPUs' compute capability
  ansible.builtin.command: systemd-run --wait --pipe --collect --quiet -- nvidia-smi --query-gpu=compute_cap --format=csv,noheader
  register: dcgm_compute_caps
  changed_when: false
  failed_when: false
  check_mode: false  # read-only

# Before the first reboot into a new driver nvidia-smi does not answer; the PCI device
# IDs (roles/facts gpus.fact) tell the generation then: every Turing and newer GPU has
# one from 0x1E00 up (the first in NVIDIA's open kernel module support list is 0x1E02),
# every older one below. Taking an unanswered query for "no old GPU" put the wrong
# build on Pascal and Volta.
- name: Use the CUDA 12 build for GPUs older than Turing on a CUDA 13 driver
  ansible.builtin.set_fact:
    _dcgm_cuda_major: "12"
  vars:
    _old_by_capability: "{{ dcgm_compute_caps.stdout_lines | map('float') | select('lt', 7.5) | list }}"
    _old_by_id: "{{ ansible_facts.ansible_local.gpus.device_ids | map('int', base=16) | select('lt', 7680) | list }}"
  when:
    - nvidia_driver_cuda_major | int >= 13
    - (_old_by_capability if dcgm_compute_caps.rc == 0 else _old_by_id) | length > 0

# Resolved here: host_baseline evaluates its arguments in its own scope, where
# nvidia_versions (this role's dependency) supplies nothing.
- name: Note the DCGM packages of another series
  ansible.builtin.set_fact:
    _dcgm_other_packages: "{{ dcgm_other_pkgs }}"
    _dcgm_dgx_conflicting_packages: "{{ dcgm_dgx_conflicting_pkgs | default([]) }}"
    _dcgm_record_version: "{{ dcgm_dgx_pkg_name if dcgm_is_dgx | bool else dcgm_pkg_name }}"

- name: DGX tasks
  ansible.builtin.include_tasks: install-dgx.yml
  when: dcgm_is_dgx

- name: Ubuntu tasks
  ansible.builtin.include_tasks: install-ubuntu.yml
  when: (ansible_facts.distribution == "Ubuntu") and not dcgm_is_dgx

- name: Red Hat family tasks
  ansible.builtin.include_tasks: install-redhat.yml
  when: (ansible_facts.os_family == "RedHat") and not dcgm_is_dgx

# DCGM 4 ships nvidia-dcgm.service (dcgm.service was the 2.x/3.x name).
- name: Start the nvidia-dcgm service
  systemd_unit:
    daemon_reload: true
    name: nvidia-dcgm.service
    state: started
    enabled: true
  tags:
    - molecule-notest

- name: Record the component as present
  ansible.builtin.include_role:
    name: component_record
  vars:
    component_record_name: dcgm
    component_record_action: present
    component_record_items: "{{ dcgm_items }}"
    component_record_version: "{{ _dcgm_record_version }}"
