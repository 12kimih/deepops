---
- name: RedHat | add EPEL
  ansible.builtin.include_role:
    name: package_repos
    tasks_from: epel

- name: RedHat | add the CUDA repository
  ansible.builtin.include_role:
    name: package_repos
    tasks_from: cuda

- name: RedHat | install package
  ansible.builtin.package:
    name: "{{ dcgm_pkg_name }}"
    state: "present"
