---
dcgm_is_dgx: false
# NVIDIA publishes the CUDA apt repo (which carries DCGM) per OS release. A brand-new LTS (e.g.
# 26.04) may not have a path yet; override nvidia_dcgm_ubuntu_repo_release (e.g.
# "24.04") in group_vars until upstream publishes it.
# NVIDIA names the Arm server repo directory sbsa, not aarch64.
_ubuntu_repo_dir: "{{ ansible_facts.distribution | lower }}{{ (nvidia_dcgm_ubuntu_repo_release | default(ansible_facts.distribution_version)) | replace('.', '') }}/{{ 'sbsa' if ansible_facts.architecture == 'aarch64' else ansible_facts.architecture }}"
_rhel_repo_dir: "rhel{{ ansible_facts.distribution_major_version }}/{{ 'sbsa' if ansible_facts.architecture == 'aarch64' else ansible_facts.architecture }}"
