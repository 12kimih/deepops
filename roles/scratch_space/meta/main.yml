---
dependencies:
  - role: people_defaults  # people, people_home_mode
  - role: shared_space_defaults  # shared_projects (those placed on the scratch space)
  - role: deploy_defaults  # cluster_user_stale_days, cluster_user_grace_days
  - role: cluster_tools_lib  # cluster_tools.scratch_space
  - role: prometheus_paths  # node_exporter_prom_dir

galaxy_info:
  namespace: deepops
  role_name: scratch_space
  author: DeepOps
  description: The fast scratch space, every active person's own directory on it
  license: BSD-3-Clause
  min_ansible_version: "2.17"
  platforms:
    - name: Ubuntu
      versions: [jammy, noble]
    - name: EL
      versions: ["8", "9"]
