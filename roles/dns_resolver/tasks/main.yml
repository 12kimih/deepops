---
- name: Check the resolver settings
  ansible.builtin.assert:
    that:
      - dns_resolver_state in ['present', 'absent', 'kept']
      - dns_resolver_upstreams | networks_invalid | length == 0
      - dns_resolver_upstreams | select('search', '/') | list | length == 0
      - (dns_resolver_blocked_domains + dns_resolver_blocked_domains_site)
        | reject('match', '^([A-Za-z0-9-]+\\.)+[A-Za-z0-9-]+$') | list | length == 0
    fail_msg: >-
      dns_resolver_state is present, absent or kept, dns_resolver_upstreams lists IP
      addresses, and the blocked domains are plain names (no wildcard, no trailing dot).

- name: "Make the resolver {{ dns_resolver_state }}"
  ansible.builtin.include_tasks: "{{ dns_resolver_state }}.yml"
  when: dns_resolver_state != 'kept'
