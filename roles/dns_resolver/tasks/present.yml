---
- name: Install unbound
  ansible.builtin.package:
    name: unbound
    state: present

- name: Configure unbound
  ansible.builtin.template:
    src: unbound.conf.j2
    dest: "{{ _dns_resolver_conf }}"
    owner: root
    group: root
    mode: "0644"
    validate: unbound-checkconf %s
  register: dns_resolver_conf

# Under --check the package and file above may not exist yet.
- name: Run unbound
  ansible.builtin.systemd:
    name: unbound
    enabled: true
    state: "{{ 'restarted' if dns_resolver_conf is changed else 'started' }}"
  when: not ansible_check_mode

# Before the host depends on it: unbound must resolve, and answer NXDOMAIN for a
# blocked name.
- name: Resolve through unbound
  ansible.builtin.command:
    argv: [python3, -c, "{{ _dns_resolver_query }}", 127.0.0.1, "{{ item.name }}", "{{ item.type }}"]
  loop:
    - {name: ".", type: 2, rcode: "0"}
    - {name: "{{ dns_resolver_blocked_domains | first | default('blocked.invalid') }}", type: 1, rcode: "3"}
  loop_control:
    label: "{{ item.name }}"
  register: dns_resolver_answer
  until: dns_resolver_answer.stdout.split() | first | default('') == item.rcode
  retries: 5
  delay: 2
  changed_when: false
  when: not ansible_check_mode

- name: Create the systemd-resolved drop-in directory
  ansible.builtin.file:
    path: "{{ _dns_resolver_resolved_dropin | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# unbound's guide: resolved forwards to unbound and its own stub listener is off, so
# resolv.conf names unbound directly. The empty DNS= drops global servers set before
# this file, which would otherwise come first; the links' servers follow unbound.
- name: Point systemd-resolved at unbound
  ansible.builtin.copy:
    dest: "{{ _dns_resolver_resolved_dropin }}"
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by DeepOps (roles/dns_resolver).
      [Resolve]
      DNS=
      DNS=127.0.0.1
      DNSStubListener=no
  register: dns_resolver_dropin

- name: Restart systemd-resolved
  ansible.builtin.systemd:
    name: systemd-resolved
    state: restarted
  when: dns_resolver_dropin is changed and not ansible_check_mode

- name: Name unbound in /etc/resolv.conf
  ansible.builtin.file:
    path: /etc/resolv.conf
    src: /run/systemd/resolve/resolv.conf
    state: link
    force: true
