---
- name: Record what this component installs
  ansible.builtin.include_role:
    name: component_record
  vars:
    component_record_name: slurm_metrics
    component_record_action: begin
    component_record_items: "{{ slurm_metrics_items }}"

- name: Install the metrics command
  ansible.builtin.include_role:
    name: cluster_tools_lib
    tasks_from: command
  vars:
    cluster_tools_lib_command:
      dest: "{{ slurm_metrics_command }}"
      module: cluster_tools.metrics

- name: Install systemd units
  ansible.builtin.template:
    src: "slurm-gpu-metrics.{{ item }}.j2"
    dest: "/etc/systemd/system/{{ slurm_metrics_svc_name }}.{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: [service, timer]
  notify: Restart slurm metrics timer

- name: Enable the metrics timer
  systemd_unit:
    name: "{{ slurm_metrics_svc_name }}.timer"
    state: started
    enabled: true
    daemon_reload: true

- name: Install the dashboards
  ansible.builtin.include_role:
    name: grafana
    tasks_from: dashboards
    public: true
  vars:
    grafana_dashboard_set: "{{ slurm_metrics_dashboard_set }}"

- name: Record the component as present
  ansible.builtin.include_role:
    name: component_record
  vars:
    component_record_name: slurm_metrics
    component_record_action: present
    component_record_items: "{{ slurm_metrics_items }}"
