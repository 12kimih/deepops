---
- name: Check the component state
  ansible.builtin.assert:
    that: slurm_metrics_state in ['present', 'absent', 'kept']
    fail_msg: "slurm_metrics_state must be present, absent or kept, not {{ slurm_metrics_state }}."
    quiet: true

- name: "Make slurm_metrics {{ slurm_metrics_state }}"
  ansible.builtin.include_tasks: "{{ slurm_metrics_state }}.yml"
  when: slurm_metrics_state != 'kept'
