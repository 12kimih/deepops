---
# The core pattern goes back to the kernel's own (a core file in the working directory,
# within the core size limit) now, not at the next boot: until then it would pipe every
# crash to the removed handler, losing the cores. apport's core handler, which the
# package replaced, is not put back; apport's coredump hook, held off by this
# component, runs after systemd-coredump again.
- name: Let apport's coredump hook run again
  systemd_dropin:
    path: "{{ coredump_apport_hook_dropin }}"
    state: absent

- name: Remove what this component installed
  ansible.builtin.include_role:
    name: component_record
  vars:
    component_record_name: coredump
    component_record_action: absent
    component_record_items: "{{ coredump_items }}"
    component_record_exclusive_packages: "{{ coredump_packages }}"

- name: Give the kernel its own core pattern back
  ansible.builtin.include_role:
    name: host_baseline
    tasks_from: sysctl_reset
  vars:
    host_baseline_sysctls_reset:
      kernel.core_pattern: core
