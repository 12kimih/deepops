---
# present, absent or kept (docs/deepops/component-state.md): per-user disk quotas on
# local ext4 and XFS filesystems and per-directory (project) quotas (cluster_tools.disk_quota). A deploy sets it from
# deepops_components (slurm_enable_disk_quota, on slurm-login and slurm-nfs): a login
# node shares its disk with whatever else runs there (on a small cluster the controller,
# its database and the logs), and one user's /tmp, /var/tmp or enroot cache could fill
# it; the home server's /home is everyone's. docs/deepops/disk-quota.md.
#
# Everyone in the roster is limited, administrators too (their own accounts; what they
# do with sudo is root's and never limited), on each filesystem with its limits in
# disk_quota_filesystems or their own disk_quota for it in the roster; root and system accounts are never limited. Usage and limits
# are exported as metrics (disk_quota_used_bytes, disk_quota_project_used_bytes, ...)
# every disk_quota_metrics_interval.
#
# The filesystems' quota mount options are host_baseline_mount_options' (the one writer
# of /etc/fstab, which also remounts): usrjquota=aquota.user,jqfmt=vfsv1, or usrquota on
# a filesystem with ext4's quota feature. Without them the role stops, naming them.
# absent takes the limits and quotas away; drop the options there too, or the next boot
# turns quotas on again.
# https://www.kernel.org/doc/html/latest/filesystems/ext4/overview.html#quota
disk_quota_state: present

# The local ext4 or XFS filesystems whose users' space is counted, per host, each with
# every roster person's hard limits there ({"/": {}, "/home": {block_hard: 10T}} on a
# login node that is also the home server): block_hard (setquota sizes, K, M, G, T) and
# inode_hard (numbers, or with k, m, g, t; else from block_hard, disk_quota_inodes_per_tib).
# Only they are enforced (a write past one fails at once). Each has its warn level,
# cluster_user_warn_fraction of it, which only notifies: exported with the usage for the
# alerts and the people's notices, never set in the kernel (no soft limit, so no grace
# period that later refuses writes). {} sets none: quotas only count, so the metrics show
# how the space is used before limits are chosen. A person's own disk_quota for a
# filesystem in the roster (people.yml) overrides the site's there.
disk_quota_filesystems: {"/": {}}

# Files allowed per TiB of a block_hard where no inode_hard is set, so the file count
# follows the space (3000000: a full quota's files average a third of a MiB); 0 limits
# no file count.
disk_quota_inodes_per_tib: 0

# Directories whose whole tree has a limit (project quota), path: {id, block_hard}, on a
# filesystem with prjquota in its mount options (ext4 with the project feature, or XFS).
# Several trees may share one id: one limit for them together (they name the same
# block_hard); otherwise each id is one tree's. The trees and their data stay when a
# project goes; only its limit is lifted.
disk_quota_projects: {}

# The folders worth cleaning (cluster_tools.cleanup), for the daily disk report: per
# filesystem, the base directories whose folders are weighed, as globs ({"/home":
# ["/home/*"]}: each home's folders). {} scans nothing. A home server's walk takes hours,
# at low priority, so it runs weekly (disk_quota_scan_on_calendar). The scratch space's
# own daily cleanup walk weighs its folders (roles/scratch_space): list it here never.
disk_quota_scan: {}
disk_quota_scan_on_calendar: "Sun *-*-* 01:00:00"
# The most entries one scan looks at (a bound on time and memory).
disk_quota_scan_max_entries: 1000000000

# How often every user's usage is exported (systemd OnUnitActiveSec).
disk_quota_metrics_interval: 15min
