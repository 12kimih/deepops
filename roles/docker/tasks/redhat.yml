---
# Follows https://docs.docker.com/engine/install/rhel/ (RHEL 8-10 and its rebuilds):
# remove the conflicting packages, add the repository (roles/package_repos: written
# there, so no dnf config-manager plugin is needed), then install the Engine + plugins.
- name: Remove the packages that conflict with Docker Engine
  ansible.builtin.include_role:
    name: host_baseline
    tasks_from: absent
  vars:
    host_baseline_absent_packages: "{{ docker_conflicting_packages.RedHat }}"

- name: Add the Docker CE dnf repository
  ansible.builtin.include_role:
    name: package_repos
    tasks_from: repo
  vars:
    package_repos_repo:
      name: docker
      uris: "{{ docker_rh_repo_base_url }}/$releasever/$basearch/stable"
      key_url: "{{ docker_rh_repo_gpgkey }}"
      key_checksum: "{{ docker_rh_key_checksum }}"
      key_fingerprint: "{{ docker_rh_key_fingerprint }}"
      legacy_files: [/etc/yum.repos.d/docker-ce.repo]  # this role wrote it before

- name: Install Docker Engine + plugins
  repo_package:
    use: dnf
    name: "{{ docker_packages | map('regex_replace', '^(docker-ce|docker-ce-cli)$', '\\1-' ~ docker_engine_version) | list }}"
    state: present
