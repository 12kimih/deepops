---
- name: Record what this component installs
  ansible.builtin.include_role:
    name: component_record
  vars:
    component_record_name: docker
    component_record_action: begin
    component_record_version: "{{ docker_engine_version }}"
    component_record_items: "{{ docker_items }}"

- name: Install Docker on Debian/Ubuntu
  ansible.builtin.include_tasks: ubuntu.yml
  when: ansible_facts.os_family == "Debian"

- name: Install Docker on the RHEL family
  ansible.builtin.include_tasks: redhat.yml
  when: ansible_facts.os_family == "RedHat"

# A preview installs nothing, so on a host without Docker the Docker API is not there
# for any later task to ask: every task that talks to it (community.docker) is skipped
# under docker_preview_installs, and the real run does them.
- name: Look for the Docker client
  ansible.builtin.stat:
    path: /usr/bin/docker
    get_checksum: false
  register: docker_client_file

- name: Note a Docker this preview only installs
  ansible.builtin.set_fact:
    docker_preview_installs: "{{ ansible_check_mode and not docker_client_file.stat.exists }}"

- name: Ensure the Docker service is enabled and running
  systemd_unit:
    name: docker
    state: "{{ docker_service_state }}"
    enabled: "{{ docker_service_enabled }}"
  tags:
    - molecule-notest

# An address pool overlapping a prefix the host already routes takes that prefix away
# from whatever was using it, and the damage shows up later as a network timeout
# somewhere else rather than as a docker error. Compare against the live routing table
# before writing anything.
#
# Docker's own bridges are skipped, or the check would fail on every run after the
# first: once a pool is in use, docker has carved networks out of it and each one adds
# a route, which the naive comparison then reports as the pool colliding with itself.
# Only routes on interfaces docker did not create can represent a real conflict.
# Matching is by interface name -- docker0 for the default bridge, br-<12 hex digits>
# for user-defined networks -- so a foreign prefix stays visible even when it sits
# inside a configured pool.
- name: Check the configured address pools against the host routing table
  ansible.builtin.command:
    cmd: >-
      python3 -c 'import ipaddress, re, subprocess, sys;
      pools = {{ docker_daemon_options.get("default-address-pools", []) | map(attribute="base") | list | to_json }};
      out = subprocess.run(["ip", "-4", "route", "show"], capture_output=True, text=True).stdout;
      fields = [line.split() for line in out.splitlines()];
      routes = [f[0] for f in fields if f and "/" in f[0]
                and not re.fullmatch("docker[0-9]+|br-[0-9a-f]{12}",
                                     f[f.index("dev") + 1] if "dev" in f else "")];
      bad = ["%s overlaps %s" % (p, r) for p in pools for r in routes
             if ipaddress.ip_network(p).overlaps(ipaddress.ip_network(r, strict=False))];
      print("; ".join(bad));
      sys.exit(0)'
  register: docker_pool_overlap
  changed_when: false
  check_mode: false
  when: docker_daemon_options.get("default-address-pools", []) | length > 0

- name: Assert no configured address pool overlaps a routed prefix
  ansible.builtin.assert:
    that:
      - (docker_pool_overlap.stdout | trim | length) == 0
    fail_msg: >-
      docker_daemon_options.default-address-pools collides with a prefix
      {{ inventory_hostname }} already routes: {{ docker_pool_overlap.stdout | trim }}.
      Docker would hand those addresses to containers and take them away from whatever
      uses them today. Choose a base outside every prefix in `ip route`.
  when: docker_daemon_options.get("default-address-pools", []) | length > 0

# A full copy of docker.service in /etc shadows the package's unit, so no package update
# reaches it again (a kubespray-era copy kept a 2026-06 unit under Docker 29). Settings go
# in daemon.json or a drop-in; a copy stops the run until the site retires it.
- name: Look for a copy of the Docker unit in /etc
  ansible.builtin.stat:
    path: /etc/systemd/system/docker.service
    get_checksum: false
  register: docker_unit_copy

- name: Refuse a copy of the Docker unit the site has not retired
  ansible.builtin.assert:
    that: >-
      not docker_unit_copy.stat.exists
      or '/etc/systemd/system/docker.service' in docker_retired_unit_files
    fail_msg: >-
      /etc/systemd/system/docker.service on {{ inventory_hostname }} is a copy of the
      Docker unit that shadows the package's, so package updates never reach it. Move
      any setting it carries into daemon.json (docker_daemon_options) and add it to
      docker_retired_unit_files, which sets it aside under /var/backups/deepops-docker-units.
    quiet: true

# The unit files the site retires go before daemon.json is written: their flags would
# make dockerd refuse daemon.json's keys for the same options.
# Besides the site's, DGX OS's drop-in (docker_dgx_override), whose options conflict with
# a stock install. A retired unit changes how dockerd starts, so it needs the restart
# that applies it: with restarts off, the old dockerd would run on until something else
# restarts it unattended (an upgrade), and its socket would go then.
- name: Look for the unit files to retire
  ansible.builtin.stat:
    path: "{{ item }}"
    get_checksum: false
  loop: "{{ _docker_retiring }}"
  register: docker_retiring_found

- name: Refuse to retire a unit file without restarting dockerd
  ansible.builtin.assert:
    that: docker_daemon_restart | bool or not _found
    fail_msg: >-
      {{ _found | join(', ') }} on {{ inventory_hostname }} would be retired, which takes a
      dockerd restart, and docker_daemon_restart is false. Run this with it true in a
      maintenance window.
    quiet: true
  vars:
    _found: "{{ docker_retiring_found.results | selectattr('stat.exists') | map(attribute='item') | list }}"

- name: Retire the unit files
  when: docker_retiring_found.results | selectattr('stat.exists') | list | length > 0
  block:
    - name: Set aside the retired unit files
      ansible.builtin.include_role:
        name: host_baseline
        tasks_from: set_aside
      vars:
        host_baseline_set_aside_paths: "{{ _docker_retiring }}"
        host_baseline_set_aside_dir: /var/backups/deepops-docker-units

    - name: Reload systemd without them
      systemd_unit:
        daemon_reload: true
      when: host_baseline_set_aside is changed

# nvidia_container_toolkit and docker_socket_group own other keys in this file; each
# goes through docker_daemon_json, which also removes a key its owner no longer sets.
- name: Apply the daemon-wide Docker options
  ansible.builtin.include_role:
    name: docker_daemon_json
  vars:
    docker_daemon_json_owner: docker
    docker_daemon_json_keys: >-
      {{ docker_daemon_options | combine({'live-restore': docker_live_restore | bool})
         | combine({'log-driver': docker_log_driver} if docker_log_driver | length > 0 else {})
         | combine({'log-opts': docker_log_opts} if docker_log_opts | length > 0 else {})
         | combine({'insecure-registries': docker_insecure_registries} if docker_insecure_registries | length > 0 else {})
         | combine({'registry-mirrors': docker_registry_mirrors} if docker_registry_mirrors | length > 0 else {})
         | combine({'builder': {'gc': {'enabled': true, 'defaultMaxUsedSpace': docker_build_cache_max,
                                       'defaultReservedSpace': docker_build_cache_reserved}}}
                   if docker_build_cache_max | length > 0 else {}) }}
    # dockerd picks up a changed unit only when it restarts.
    docker_daemon_json_unit_changed: "{{ (host_baseline_set_aside | default({})) is changed }}"
    docker_daemon_json_retiring: "{{ _docker_retiring }}"

# A dockerd that made its own API socket (a retired unit passing -H unix://...) removes
# the socket file when it stops, and the package's dockerd that follows serves the
# socket docker.socket handed it with that file gone: every client then finds no
# daemon (2026-11-22: retiring a kubespray-era unit). So on every run, after any
# restart, the API is asked, and where it does not answer docker.socket recreates the
# file (dockerd stops first, live-restore keeps the containers).
- name: Apply a pending dockerd restart now
  ansible.builtin.meta: flush_handlers

# The API itself is asked, not the file: a socket file with nothing behind it passes a
# stat.
- name: Ask the Docker API
  ansible.builtin.command:
    argv: [docker, --host, "unix://{{ docker_api_socket }}", info, --format, ok]
  register: docker_api_probe
  changed_when: false
  failed_when: false
  check_mode: false  # read-only; --check needs the result
  when:
    - not deepops_containerized | bool
    - docker_service_state == 'started'
    - not docker_preview_installs | bool

- name: Recreate the Docker API socket
  when:
    - not deepops_containerized | bool
    - docker_service_state == 'started'
    - not docker_preview_installs | bool
    - docker_api_probe.rc | default(0) != 0
  block:
    - name: Stop dockerd so docker.socket can listen again
      systemd_unit:
        name: docker.service
        state: stopped

    - name: Restart docker.socket, which recreates the socket file
      systemd_unit:
        name: docker.socket
        state: restarted

    - name: Start dockerd on the recreated socket
      systemd_unit:
        name: docker.service
        state: started

    - name: Ask the Docker API again
      ansible.builtin.command:
        argv: [docker, --host, "unix://{{ docker_api_socket }}", info, --format, ok]
      register: docker_api_again
      until: docker_api_again.rc == 0
      retries: 12
      delay: 5
      changed_when: false
      failed_when: false
      when: not ansible_check_mode

    - name: Stop when the API still does not answer
      ansible.builtin.assert:
        that: docker_api_again.rc == 0
        fail_msg: >-
          The Docker API ({{ docker_api_socket }}) still does not answer on
          {{ inventory_hostname }} after restarting docker.socket and dockerd:
          {{ docker_api_again.stderr | default('') }}. See systemctl status docker.socket
          docker.service.
        quiet: true
      when: not ansible_check_mode

- name: Raise the kernel limits a container host runs into
  ansible.builtin.include_role:
    name: host_baseline
    tasks_from: sysctl
  vars:
    host_baseline_sysctls: "{{ docker_sysctls }}"
    host_baseline_sysctl_file: /etc/sysctl.d/90-docker.conf
  when: docker_tune_kernel | bool

# Containers first: an image a stopped container holds is in use until it goes. Each
# step stops the rest when it fails, so a failure shows as the failed unit.
- name: Prune what Docker keeps unused, on a schedule
  when: docker_prune_after | length > 0
  block:
    - name: Install the prune service
      ansible.builtin.copy:
        dest: /etc/systemd/system/docker-prune.service
        mode: "0644"
        content: |
          # Managed by roles/docker (docker_prune_after). The build cache is BuildKit's (builder.gc).
          [Unit]
          Description=Remove what Docker keeps unused: stopped containers and images older than {{ docker_prune_after }}, anonymous volumes
          # Only while Docker runs: a timer must not start a Docker stopped on purpose.
          Requisite=docker.service
          After=docker.service

          [Service]
          Type=oneshot
          TimeoutStartSec=1h
          ExecStart=/usr/bin/docker container prune --force --filter until={{ docker_prune_after }}
          ExecStart=/usr/bin/docker image prune --all --force --filter until={{ docker_prune_after }}
          ExecStart=/usr/bin/docker volume prune --force

    - name: Install the prune timer
      ansible.builtin.copy:
        dest: /etc/systemd/system/docker-prune.timer
        mode: "0644"
        content: |
          # Managed by roles/docker (docker_prune_schedule).
          [Unit]
          Description=Prune what Docker keeps unused ({{ docker_prune_schedule }})

          [Timer]
          OnCalendar={{ docker_prune_schedule }}
          RandomizedDelaySec=1h
          Persistent=true

          [Install]
          WantedBy=timers.target

    - name: Enable the prune timer
      systemd_unit:
        name: docker-prune.timer
        enabled: true
        state: started
        daemon_reload: true

# With pruning or kernel tuning off, their files are not in docker_items: the record
# removes them.
- name: Record the component as present
  ansible.builtin.include_role:
    name: component_record
  vars:
    component_record_name: docker
    component_record_action: present
    component_record_version: "{{ docker_engine_version }}"
    component_record_items: "{{ docker_items }}"
