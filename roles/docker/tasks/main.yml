---
# In-tree Docker CE install (replaces the kubespray submodule's docker role), so the
# install follows Docker's current official instructions and is not tied to kubespray.
- name: Install Docker on Debian/Ubuntu
  ansible.builtin.include_tasks: ubuntu.yml
  when: ansible_os_family == "Debian"

- name: Install Docker on the RHEL family
  ansible.builtin.include_tasks: redhat.yml
  when: ansible_os_family == "RedHat"

- name: Ensure the Docker service is enabled and running
  ansible.builtin.systemd:
    name: docker
    state: "{{ docker_service_state }}"
    enabled: "{{ docker_service_enabled }}"
  tags:
    - molecule-notest

# An address pool overlapping a prefix the host already routes takes that prefix away
# from whatever was using it, and the damage shows up later as a network timeout
# somewhere else rather than as a docker error. Compare against the live routing table
# before writing anything.
#
# Docker's own bridges are skipped, or the check would fail on every run after the
# first: once a pool is in use, docker has carved networks out of it and each one adds
# a route, which the naive comparison then reports as the pool colliding with itself.
# Only routes on interfaces docker did not create can represent a real conflict.
# Matching is by interface name -- docker0 for the default bridge, br-<12 hex digits>
# for user-defined networks -- so a foreign prefix stays visible even when it sits
# inside a configured pool.
- name: Check the configured address pools against the host routing table
  ansible.builtin.command:
    cmd: >-
      python3 -c 'import ipaddress, re, subprocess, sys;
      pools = {{ docker_daemon_options.get("default-address-pools", []) | map(attribute="base") | list | to_json }};
      out = subprocess.run(["ip", "-4", "route", "show"], capture_output=True, text=True).stdout;
      fields = [line.split() for line in out.splitlines()];
      routes = [f[0] for f in fields if f and "/" in f[0]
                and not re.fullmatch("docker[0-9]+|br-[0-9a-f]{12}",
                                     f[f.index("dev") + 1] if "dev" in f else "")];
      bad = ["%s overlaps %s" % (p, r) for p in pools for r in routes
             if ipaddress.ip_network(p).overlaps(ipaddress.ip_network(r, strict=False))];
      print("; ".join(bad));
      sys.exit(0)'
  register: docker_pool_overlap
  changed_when: false
  check_mode: false
  when: docker_daemon_options.get("default-address-pools", []) | length > 0

- name: Assert no configured address pool overlaps a routed prefix
  ansible.builtin.assert:
    that:
      - (docker_pool_overlap.stdout | trim | length) == 0
    fail_msg: >-
      docker_daemon_options.default-address-pools collides with a prefix
      {{ inventory_hostname }} already routes: {{ docker_pool_overlap.stdout | trim }}.
      Docker would hand those addresses to containers and take them away from whatever
      uses them today. Choose a base outside every prefix in `ip route`.
  when: docker_daemon_options.get("default-address-pools", []) | length > 0

# Merge, never rewrite: nvidia_container_toolkit and docker_socket_group own their own
# keys in this file. Idempotent -- only writes, and only reports changed, when a value
# actually differs.
- name: Apply the daemon-wide Docker options
  ansible.builtin.command:
    cmd: >-
      python3 -c 'import json, pathlib, sys;
      p = pathlib.Path("/etc/docker/daemon.json");
      want = {{ docker_daemon_options | to_json }};
      text = p.read_text().strip() if p.exists() else "";
      data = json.loads(text) if text else {};
      changed = any(data.get(k) != v for k, v in want.items());
      data.update(want);
      p.parent.mkdir(parents=True, exist_ok=True);
      (p.write_text(json.dumps(data, indent=2) + chr(10)) if changed else None);
      sys.exit(10 if changed else 0)'
  register: docker_daemon_options_result
  changed_when: docker_daemon_options_result.rc == 10
  failed_when: docker_daemon_options_result.rc not in [0, 10]
  when: docker_daemon_options | length > 0
  notify: Restart docker to apply daemon options

- name: Raise the kernel limits a container host runs into
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/90-docker.conf
    sysctl_set: true
    state: present
    reload: true
  loop: "{{ docker_sysctls | dict2items }}"
  when:
    - docker_tune_kernel | bool
    - ansible_virtualization_type | default('') not in ['docker', 'container', 'containerd', 'podman', 'lxc', 'systemd-nspawn']
  tags:
    - molecule-notest
