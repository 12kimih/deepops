---
# In-tree Docker CE install (replaces the kubespray submodule's docker role), so the
# install follows Docker's current official instructions and is not tied to kubespray.
- name: Check the component state
  ansible.builtin.assert:
    that: docker_state in ['present', 'absent', 'kept']
    fail_msg: "docker_state must be present, absent or kept, not {{ docker_state }}."
    quiet: true

- name: "Make docker {{ docker_state }}"
  ansible.builtin.include_tasks: "{{ docker_state }}.yml"
  when: docker_state != 'kept'
