---
# Follows https://docs.docker.com/engine/install/ubuntu/ (and .../debian/) verbatim:
# the official key and a deb822 repository, then the Engine and plugins.

# "Uninstall all conflicting packages", before the repository is added.
- name: Remove the packages that conflict with Docker Engine
  ansible.builtin.include_role:
    name: host_baseline
    tasks_from: absent
  vars:
    host_baseline_absent_packages: "{{ docker_conflicting_packages.Debian }}"

# "sudo apt-get install ca-certificates curl"
- name: Install repository prerequisites
  repo_package:
    use: apt
    name:
      - ca-certificates
      - curl
    state: present
    update_cache: true
    lock_timeout: "{{ docker_apt_lock_timeout }}"

# The official key in /etc/apt/keyrings/docker.asc and the deb822 docker.sources, the
# suite this release's codename (roles/package_repos, the one way a repository is added).
- name: Add the Docker apt repository
  ansible.builtin.include_role:
    name: package_repos
    tasks_from: repo
  vars:
    package_repos_repo:
      name: docker
      uris: "{{ lookup('ansible.builtin.vars', 'docker_' ~ ansible_facts.distribution | lower ~ '_repo_base_url') }}"
      components: [stable]
      key_url: "{{ lookup('ansible.builtin.vars', 'docker_' ~ ansible_facts.distribution | lower ~ '_repo_gpgkey') }}"
      key_checksum: "{{ docker_apt_key_checksum }}"
      key_fingerprint: "{{ docker_apt_key_fingerprint }}"
      # What the older install docs left (the .list, the dearmored key elsewhere);
      # package_repos removes the other form of its own keyring itself.
      legacy_files:
        - /etc/apt/sources.list.d/docker.list
        - /usr/share/keyrings/docker-archive-keyring.gpg

# "sudo apt-get update" then install, docker-ce and docker-ce-cli at
# docker_engine_version ("Install a specific version"); never downgraded here.
# lock_timeout rides out unattended-upgrades.
- name: Install Docker Engine + plugins
  repo_package:
    use: apt
    name: "{{ docker_packages | map('regex_replace', '^(docker-ce|docker-ce-cli)$', '\\1=5:' ~ docker_engine_version ~ '-1~*') | list }}"
    state: present
    update_cache: true
    lock_timeout: "{{ docker_apt_lock_timeout }}"
