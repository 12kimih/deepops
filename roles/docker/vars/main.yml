---
# The kernel limits it raises (roles/host_baseline tasks_from: sysctl).
docker_sysctl_file: "{{ deepops_sysctl_prefix }}docker.conf"
# What the component installs, for its record (roles/component_record). The prune
# units only while pruning is on, so turning it off removes them (and the record removes
# the docker-image-prune units earlier versions installed). /var/lib/docker is data and
# stays.
# The repository's files, named by roles/package_repos.
_docker_repo_items:
  Debian: [file:/etc/apt/sources.list.d/docker.sources, file:/etc/apt/keyrings/docker.asc,
           "file:{{ deepops_cache_dir }}/package-repos/docker.key"]
  RedHat: [file:/etc/yum.repos.d/docker.repo, file:/etc/pki/rpm-gpg/RPM-GPG-KEY-docker,
           "file:{{ deepops_cache_dir }}/package-repos/docker.key"]
_docker_prune_items:
  - unit:docker-prune.timer
  - unit:docker-prune.service
  - file:/etc/systemd/system/docker-prune.timer
  - file:/etc/systemd/system/docker-prune.service
_docker_all_items: >-
  {{ ['unit:docker.socket', 'unit:docker.service', 'file:/etc/docker/daemon.json',
      'file:' ~ docker_sysctl_file]
     + docker_packages | map('regex_replace', '^', 'package:') | list
     + _docker_repo_items[ansible_facts.os_family] | default([])
     + _docker_prune_items }}
docker_items: >-
  {{ _docker_all_items
     | reject('in', [] if docker_tune_kernel | bool else ['file:' ~ docker_sysctl_file])
     | reject('in', [] if docker_prune_after | length > 0 else _docker_prune_items)
     | list }}
# DGX OS's drop-in, with options that conflict with a stock install: always retired.
docker_dgx_override: /etc/systemd/system/docker.service.d/docker-override.conf
# Every unit file the role retires: the site's (docker_retired_unit_files) and DGX OS's.
_docker_retiring: "{{ docker_retired_unit_files + [docker_dgx_override] }}"
