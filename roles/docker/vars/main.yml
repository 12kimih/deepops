---
# What the component installs, for its record (roles/component_record). The image
# prune units only while pruning is on, so turning it off removes them. Images and
# volumes (/var/lib/docker) are data and stay.
_docker_repo_items:
  Debian: ["file:{{ docker_apt_sources }}", "file:{{ docker_apt_keyring }}"]
  RedHat: ["file:/etc/yum.repos.d/docker-ce-stable.repo"]
_docker_prune_items:
  - unit:docker-image-prune.timer
  - unit:docker-image-prune.service
  - file:/etc/systemd/system/docker-image-prune.timer
  - file:/etc/systemd/system/docker-image-prune.service
_docker_all_items: >-
  {{ ['unit:docker.socket', 'unit:docker.service', 'file:/etc/docker/daemon.json',
      'file:/etc/sysctl.d/90-docker.conf']
     + docker_packages | map('regex_replace', '^', 'package:') | list
     + _docker_repo_items[ansible_facts.os_family] | default([])
     + _docker_prune_items }}
docker_items: >-
  {{ _docker_all_items
     | reject('in', [] if docker_tune_kernel | bool else ['file:/etc/sysctl.d/90-docker.conf'])
     | reject('in', [] if docker_image_prune_until | length > 0 else _docker_prune_items)
     | list }}
