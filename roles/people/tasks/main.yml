---
# A person's UID or per-user GID must not be a service account's (roles/system_accounts).
- name: Refuse roster IDs the service accounts use
  ansible.builtin.assert:
    that: (people | people_local_accounts | accounts_disjoint(system_accounts)) is mapping
    quiet: true
  tags:
    - people

# The roster UID, a per-user group with GID = UID, the name as the comment and the
# shell; an existing account with another number stops the run (roles/local_accounts).
# Supplementary groups are not managed here: they come from the roles that own them
# (nis_server for published groups, cluster_sudoers for the local sudo group).
- name: Create or update each active person's account
  ansible.builtin.include_role:
    name: local_accounts
    apply:
      tags:
        - people
  vars:
    local_accounts: "{{ people | people_local_accounts(people_home_root, people_default_shell) }}"
    local_accounts_shell: "{{ people_default_shell }}"
  when: people_local_accounts_enabled | bool
  tags:
    - people

# Accounts are read from the local files only: on a NIS master `getent` would also
# answer from NIS, which is built from these same files and may be stale.
- name: Read the local accounts
  ansible.builtin.getent:
    database: passwd
    service: files
  tags:
    - people

# create_home sets the mode only on a home it creates, so existing homes are checked
# here. people_home_mode is a ceiling: a home with any permission beyond it is set to
# it, while a stricter one (0700) is left as its owner chose.
- name: Read the home directories' modes
  ansible.builtin.stat:
    path: "{{ people_home_root }}/{{ item.key }}"
  loop: "{{ people | people_active | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: people_homes
  tags:
    - people

# useradd makes a local account's home; a directory account's is made here, from
# /etc/skel, owned by the roster's numbers (they resolve once the directory answers).
- name: Create the homes of active people who have none
  ansible.builtin.file:
    path: "{{ people_home_root }}/{{ item.item.key }}"
    state: directory
    owner: "{{ item.item.value.uid }}"
    group: "{{ item.item.value.uid }}"
    mode: "{{ people_home_mode }}"
  loop: "{{ people_homes.results | rejectattr('stat.exists') | list }}"
  loop_control:
    label: "{{ item.item.key }}"
  tags:
    - people

- name: Fill the new homes from /etc/skel
  ansible.builtin.copy:
    src: /etc/skel/
    dest: "{{ people_home_root }}/{{ item.item.key }}/"
    remote_src: true
    owner: "{{ item.item.value.uid }}"
    group: "{{ item.item.value.uid }}"
  loop: "{{ people_homes.results | rejectattr('stat.exists') | list }}"
  loop_control:
    label: "{{ item.item.key }}"
  tags:
    - people

- name: Take away permissions beyond the home mode
  ansible.builtin.file:
    path: "{{ item.stat.path }}"
    mode: "{{ people_home_mode }}"
  loop: "{{ people_homes.results | selectattr('stat.exists') | list }}"
  loop_control:
    label: "{{ item.item.key }} ({{ item.stat.mode }})"
  when: item.stat.mode | mode_exceeds(people_home_mode)
  tags:
    - people

- name: Make useradd create homes with the same mode
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: '^#?\s*HOME_MODE\s'
    line: "HOME_MODE\t{{ people_home_mode }}"
  tags:
    - people

# Expiry blocks every login PAM checks, SSH keys included; a locked password alone
# would not. Only accounts that exist are locked; a left person is never created.
- name: Lock the accounts of people who have left
  ansible.builtin.user:
    name: "{{ item }}"
    password_lock: true
    expires: 1
    shell: /usr/sbin/nologin
  loop: "{{ people | people_left | select('in', ansible_facts.getent_passwd) | list }}"
  tags:
    - people

# A person back from left (status active again) gets the account back: the lock above
# set expiry day 1 (1970-01-02), which no one sets by hand, and is undone only where it
# is found; the password regains its hash where the lock put a "!" before one. The shell
# comes back with the account update at the top (local_accounts). Only the name, whether
# a hash sits behind a "!" and the expiry day leave the host: never a hash, nor a fact.
- name: Read which local accounts the lock marked
  ansible.builtin.command:
    argv: [awk, -F, ":", '$8 == "1" { print $1, ($2 ~ /^![^!*]/) }', /etc/shadow]
  register: people_marked
  changed_when: false
  check_mode: false
  tags:
    - people

- name: Give back the accounts of people active again
  vars:
    _marked: "{{ dict(people_marked.stdout_lines | map('split') | map('first') | zip(people_marked.stdout_lines | map('split') | map('last'))) }}"
  ansible.builtin.user:
    name: "{{ item }}"
    expires: -1
    password_lock: "{{ false if _marked[item] == '1' else omit }}"
  loop: "{{ _marked | list | select('in', people | people_active) | list }}"
  tags:
    - people
