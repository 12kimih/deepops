---
# Accounts are read from the local files only: on a NIS master `getent` would also
# answer from NIS, which is built from these same files and may be stale.
- name: Read the local accounts
  ansible.builtin.getent:
    database: passwd
    service: files
  tags:
    - people

- name: Refuse to change an existing account's UID
  ansible.builtin.assert:
    that: >-
      (ansible_facts.getent_passwd[item.key][1] | int) == (item.value.uid | int)
    fail_msg: >-
      {{ item.key }} has UID {{ ansible_facts.getent_passwd[item.key][1] }} here but
      {{ item.value.uid }} in the roster. Changing it would orphan the account's files
      on shared storage; fix the roster, or migrate the files and the UID by hand.
    quiet: true
  loop: "{{ people | dict2items | selectattr('key', 'in', ansible_facts.getent_passwd) }}"
  loop_control:
    label: "{{ item.key }}"
  tags:
    - people

- name: Read the local groups
  ansible.builtin.getent:
    database: group
    service: files
  tags:
    - people

# The group module renumbers an existing group (groupmod -g), which orphans the group
# ownership of every file on shared storage as surely as a UID change would.
- name: Refuse to change an existing person's group GID
  ansible.builtin.assert:
    that: >-
      (ansible_facts.getent_group[item.key][1] | int) == (item.value.uid | int)
    fail_msg: >-
      Group {{ item.key }} has GID {{ ansible_facts.getent_group[item.key][1] }} here but
      {{ item.value.uid }} in the roster. Changing it would orphan the group's files on
      shared storage; fix the roster, or migrate the files and the GID by hand.
    quiet: true
  loop: "{{ people | people_active | dict2items | selectattr('key', 'in', ansible_facts.getent_group) }}"
  loop_control:
    label: "{{ item.key }}"
  tags:
    - people

- name: Create each active person's group
  ansible.builtin.group:
    name: "{{ item.key }}"
    gid: "{{ item.value.uid }}"
  loop: "{{ people | people_active | dict2items }}"
  loop_control:
    label: "{{ item.key }} ({{ item.value.uid }})"
  tags:
    - people

# `groups` is not managed here: supplementary groups come from the roles that own them
# (nis_server for published groups, cluster_sudoers for the local sudo group).
- name: Create or update each active person's account
  ansible.builtin.user:
    name: "{{ item.key }}"
    uid: "{{ item.value.uid }}"
    group: "{{ item.key }}"
    comment: "{{ item.value.name | default(omit) }}"
    shell: "{{ item.value.shell | default(people_default_shell) }}"
    home: "{{ people_home_root }}/{{ item.key }}"
    create_home: true
  loop: "{{ people | people_active | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  tags:
    - people

# create_home sets the mode only on a home it creates, so existing homes are checked
# here. people_home_mode is a ceiling: a home with any permission beyond it is set to
# it, while a stricter one (0700) is left as its owner chose.
- name: Read the home directories' modes
  ansible.builtin.stat:
    path: "{{ people_home_root }}/{{ item.key }}"
  loop: "{{ people | people_active | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: people_homes
  tags:
    - people

- name: Take away permissions beyond the home mode
  ansible.builtin.file:
    path: "{{ item.stat.path }}"
    mode: "{{ people_home_mode }}"
  loop: "{{ people_homes.results | selectattr('stat.exists') | list }}"
  loop_control:
    label: "{{ item.item.key }} ({{ item.stat.mode }})"
  when: item.stat.mode | mode_exceeds(people_home_mode)
  tags:
    - people

- name: Make useradd create homes with the same mode
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: '^#?\s*HOME_MODE\s'
    line: "HOME_MODE\t{{ people_home_mode }}"
  tags:
    - people

# Expiry blocks every login PAM checks, SSH keys included; a locked password alone
# would not. Only accounts that exist are locked; a left person is never created.
- name: Lock the accounts of people who have left
  ansible.builtin.user:
    name: "{{ item }}"
    password_lock: true
    expires: 1
    shell: /usr/sbin/nologin
  loop: "{{ people | people_left | select('in', ansible_facts.getent_passwd) | list }}"
  tags:
    - people
