---
# A person's login, UID or per-user GID must not be a service account's
# (roles/system_accounts): either would make the two one account.
- name: Refuse roster names and IDs the service accounts use
  ansible.builtin.assert:
    that: (people | people_local_accounts | accounts_disjoint(system_accounts, system_groups)) is mapping
    quiet: true
  tags:
    - people

# The roster UID, a per-user group with GID = UID, the name as the comment and the
# shell; an existing account with another number stops the run (roles/local_accounts).
# Supplementary groups are not managed here: they come from the roles that own them
# (nis_server for published groups, cluster_sudoers for the local sudo group).
- name: Create or update each active person's account
  ansible.builtin.include_role:
    name: local_accounts
    apply:
      tags:
        - people
  vars:
    local_accounts: "{{ people | people_local_accounts(people_home_root, people_default_shell) }}"
    local_accounts_shell: "{{ people_default_shell }}"
  when: people_local_accounts_enabled | bool
  tags:
    - people

# Accounts are read from the local files only: on a NIS master `getent` would also
# answer from NIS, which is built from these same files and may be stale.
- name: Read the local accounts
  ansible.builtin.getent:
    database: passwd
    service: files
  tags:
    - people

# Every active person's home: made where missing (from /etc/skel), its mode held to
# people_home_mode (person_dirs.yml, which /scratch's directories use too).
- name: Make each active person's home
  ansible.builtin.include_tasks:
    file: person_dirs.yml
    apply:
      tags:
        - people
  vars:
    people_dirs_root: "{{ people_home_root }}"
    people_dirs_mode: "{{ people_home_mode }}"
    people_dirs_skel: true
  tags:
    - people

- name: Make useradd create homes with the same mode
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: '^#?\s*HOME_MODE\s'
    line: "HOME_MODE\t{{ people_home_mode }}"
  tags:
    - people

# Expiry blocks every login PAM checks, SSH keys included; a locked password alone
# would not. Only accounts that exist are locked; a left person is never created. Their
# day (people_login_ends) is 1, 1970-01-02, which no one sets by hand: the lock's marker.
# The user module's expires counts seconds, shadow(5) days.
- name: Lock the accounts of people who have left
  ansible.builtin.user:
    name: "{{ item }}"
    password_lock: true
    expires: "{{ people_login_ends[item] * 86400 }}"
    shell: /usr/sbin/nologin
  loop: "{{ people | people_left | select('in', ansible_facts.getent_passwd) | list }}"
  tags:
    - people

# Each local account's expiry day ("-" for none) and whether a "!" sits before a hash:
# only those leave the host, never a hash, nor a fact.
- name: Read the local accounts' expiry
  ansible.builtin.command:
    argv: [awk, -F, ":", '{ print $1, ($8 == "" ? "-" : $8), ($2 ~ /^![^!*]/) }', /etc/shadow]
  register: people_expiry
  changed_when: false
  check_mode: false
  tags:
    - people

# Every active person's account ends on the day people_login_ends gives (a last day plus
# the grace period), or never: set where it differs, so a new last day, a cancelled one
# and a return from left are one step. Someone back from left (the lock's day 1) gets
# the password's hash back where the lock put a "!" before it; the shell comes back
# with the account update at the top (local_accounts).
- name: Set when each active person's login ends
  vars:
    _rows: "{{ people_expiry.stdout_lines | map('split') | list }}"
    _day: "{{ dict(_rows | map('first') | zip(_rows | map(attribute=1))) }}"
    _locked: "{{ dict(_rows | map('first') | zip(_rows | map('last'))) }}"
    _want: "{{ people_login_ends[item] | string if people_login_ends[item] != '' else '-' }}"
  ansible.builtin.user:
    name: "{{ item }}"
    expires: "{{ people_login_ends[item] * 86400 if people_login_ends[item] != '' else -1 }}"
    password_lock: "{{ false if (_day[item] == '1' and _locked[item] == '1') else omit }}"
  loop: "{{ people | people_active | list | select('in', ansible_facts.getent_passwd) | list }}"
  when: _want != _day[item] | default('-')
  tags:
    - people

- name: Publish when the files of the people who leave fall due
  ansible.builtin.include_tasks:
    file: purge_metric.yml
    apply:
      tags: [people]
  tags:
    - people
