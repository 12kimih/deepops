---
# people -- create and lock the user accounts a people roster declares (see
# config.example/people.yml and plugins/filter/people.py).
#
# Run it on the account source, the host whose /home is on its own disk: with NIS its
# passwd/group files are what the nis_server role publishes; with LDAP the directory
# holds the accounts (roles/ldap_server) and this role keeps only the homes. Every other
# access list (sudo, group members, Slurm associations) is derived from the same roster
# elsewhere; this role only owns the accounts and their homes.
#
# Active people get an account with the roster's UID, a per-user group with GID = UID,
# the name as the comment and the shell. Someone who has left is locked (password
# locked, account expired, nologin shell), never deleted, so their files keep an owner
# and the UID is not reused. Passwords are not managed: a new account starts locked
# until an administrator sets one (`passwd <user>`).
#
# A UID that differs from the roster fails the run instead of being changed: usermod -u
# would leave every file the account owns on shared storage with a stale owner.

# people, people_default_shell, people_home_root and people_home_mode come from
# roles/people_defaults (the directory reads them too).

# Create the roster's accounts in the local files (passwd, group). Where an LDAP
# directory holds them (directory_service ldap) only the homes are kept here.
people_local_accounts_enabled: true
