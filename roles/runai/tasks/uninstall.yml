---
# Removes only what this role installs. Leaves the GPU stack alone.
- name: Remove the Run:ai releases this role installed
  ansible.builtin.include_role:
    name: helm_release
  vars:
    helm_release:
      release: "{{ runai_release.release }}"
      namespace: "{{ runai_release.namespace }}"
      state: absent
  loop: >-
    {{ [{'release': runai_cluster_release_name, 'namespace': runai_cluster_namespace},
        {'release': runai_cp_release_name, 'namespace': runai_cp_namespace},
        {'release': runai_kai_release_name, 'namespace': runai_kai_namespace}]
       + ([{'release': runai_platform_ingress_release_name, 'namespace': runai_platform_ingress_namespace}]
          if runai_haproxy_managed | bool else []) }}
  loop_control:
    loop_var: runai_release
    label: "{{ runai_release.release }}"

- name: Remove the Gateway and what was installed for it
  ansible.builtin.include_tasks: gateway_remove.yml

- name: Remove the CoreDNS rewrite
  ansible.builtin.include_tasks: coredns.yml
  vars:
    runai_coredns_present: false
    runai_dns_cm: coredns
    runai_dns_workload: deployment/coredns
  when: runai_platform_coredns_rewrite | bool

- name: Check for the node-local DNS cache
  ansible.builtin.command: "{{ runai_kubectl }} -n kube-system get configmap nodelocaldns --ignore-not-found --output name"
  register: runai_nodelocal
  changed_when: false
  check_mode: false
  when: runai_platform_coredns_rewrite | bool

- name: Remove the node-local DNS cache entry
  ansible.builtin.include_tasks: coredns.yml
  vars:
    runai_coredns_present: false
    runai_dns_cm: nodelocaldns
    runai_dns_workload: daemonset/nodelocaldns
  when:
    - runai_platform_coredns_rewrite | bool
    - runai_nodelocal.stdout | default('') | length > 0

- name: Remove the hosts-file entry
  ansible.builtin.include_role:
    name: deepops_hosts
    tasks_from: fragment
    apply:
      become: true
  vars:
    hosts_fragment_name: runai
    hosts_fragment_lines: []
  # Turning the entry off already removes it (platform_dns.yml), so only a managed one
  # is left to remove here.
  when: runai_platform_manage_hosts_entry | bool

# Helm keeps these on purpose (resource-policy: keep); an uninstall that leaves
# them behind is not clean, so remove them here.
- name: Remove namespaces left behind
  change_command:
    cmd: "{{ runai_kubectl }} delete namespace {{ item }} --ignore-not-found --wait --timeout=300s"
  loop: >-
    {{ [runai_kai_namespace, 'kai-resource-reservation', 'runai-reservation',
        'runai-scale-adjust', runai_cluster_namespace, runai_cp_namespace]
       + ([runai_platform_ingress_namespace] if runai_haproxy_managed | bool else []) }}
  register: runai_rm_ns
  changed_when: >-
    ansible_check_mode or ('deleted' in runai_rm_ns.stdout)

- name: List CRDs from these charts
  ansible.builtin.shell: >-
    set -o pipefail;
    {{ runai_kubectl }} get crd --output name | grep -E '(\.run\.ai|\.kai\.scheduler|scheduling\.run\.ai|gpu-fractioning\.kai\.scheduler|\.karta\.)' || true
  args:
    executable: /bin/bash
  register: runai_left_crds
  changed_when: false
  check_mode: false

- name: Remove CRDs from these charts (runai_uninstall_remove_crds)
  change_command:
    cmd: "{{ runai_kubectl }} delete {{ item }} --ignore-not-found"
  loop: "{{ runai_left_crds.stdout_lines }}"
  when: runai_uninstall_remove_crds | bool
