---
- name: Check the component state
  ansible.builtin.assert:
    that: k8s_gpu_feature_discovery_state in ['present', 'absent', 'kept']
    fail_msg: "k8s_gpu_feature_discovery_state must be present, absent or kept, not {{ k8s_gpu_feature_discovery_state }}."
    quiet: true

- name: "Make GPU Feature Discovery {{ k8s_gpu_feature_discovery_state }}"
  ansible.builtin.include_tasks: "{{ k8s_gpu_feature_discovery_state }}.yml"
  when: k8s_gpu_feature_discovery_state != 'kept'
