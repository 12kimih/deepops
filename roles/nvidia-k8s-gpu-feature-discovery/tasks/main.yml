---
# One Helm release in its desired state, through the shared helm_release role (a
# converged rerun changes nothing).
- name: Install NVIDIA GPU Feature Discovery
  ansible.builtin.include_role:
    name: helm_release
  vars:
    helm_release:
      release: "{{ k8s_gpu_feature_discovery_release_name }}"
      namespace: default
      chart: "{{ k8s_gpu_feature_discovery_chart_name }}"
      repo: "{{ k8s_gpu_feature_discovery_helm_repo }}"
      version: "{{ k8s_gpu_feature_discovery_chart_version }}"
      helm_values:
        allowDefaultNamespace: true
        migStrategy: "{{ k8s_gpu_mig_strategy }}"
