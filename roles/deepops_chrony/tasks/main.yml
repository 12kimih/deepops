---
- name: Check the component state
  ansible.builtin.assert:
    that: chrony_state in ['present', 'absent', 'kept']
    fail_msg: "chrony_state must be present, absent or kept, not {{ chrony_state }}."
    quiet: true

- name: Add the OS specific variables
  ansible.builtin.include_vars: "{{ ansible_facts.os_family | lower }}.yml"
  when: chrony_state != 'kept'

- name: "Make chrony {{ chrony_state }}"
  ansible.builtin.include_tasks: "{{ chrony_state }}.yml"
  when: chrony_state != 'kept'
