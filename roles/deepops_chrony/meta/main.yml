---
galaxy_info:
  namespace: deepops
  author: DeepOps
  role_name: deepops_chrony
  description: Time sync with chrony, optionally through the cluster's own time servers
  license: MIT  # vendored from unxnn/ansible-role-chrony (LICENSE)
  min_ansible_version: "2.17"
  platforms:
    - name: Ubuntu
      versions: [noble, jammy]
    - name: EL
      versions: ["8", "9"]
dependencies:
  - role: network_defaults  # cluster_networks, cluster_addresses for chrony_serve_hosts
  - role: retired_settings  # chrony_config_server, chrony_timezone
