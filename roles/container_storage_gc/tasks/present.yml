---
- name: Record what this component installs
  ansible.builtin.include_role:
    name: component_record
  vars:
    component_record_name: container_storage_gc
    component_record_action: begin
    component_record_items: "{{ container_storage_gc_items }}"

- name: Install the container storage cleanup command
  ansible.builtin.include_role:
    name: cluster_tools_lib
    tasks_from: command
  vars:
    cluster_tools_lib_command:
      dest: "{{ _container_storage_gc_command }}"
      module: cluster_tools.container_gc

- name: Write the container storage cleanup configuration
  ansible.builtin.copy:
    dest: "{{ _container_storage_gc_config }}"
    owner: root
    group: root
    mode: "0644"
    content: "{{ _container_storage_gc_cfg | to_nice_json }}\n"
    validate: "{{ cluster_tools_lib_config_validate }} cluster_tools.container_gc %s"

- name: Record the container storage gc configuration
  ansible.builtin.include_role:
    name: cluster_tools_lib
    tasks_from: config
  vars:
    cluster_tools_lib_config: {role: container_storage_gc, module: cluster_tools.container_gc, file: "{{ _container_storage_gc_config }}", playbook: playbooks/container/container-storage-gc.yml}

- name: Install the container storage cleanup units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ _container_storage_gc_units }}"
  register: container_storage_gc_units

- name: Enable the container storage cleanup timer
  systemd_unit:
    name: container-storage-gc.timer
    enabled: true
    state: "{{ 'restarted' if container_storage_gc_units is changed else 'started' }}"
    daemon_reload: true

- name: Record the component as present
  ansible.builtin.include_role:
    name: component_record
  vars:
    component_record_name: container_storage_gc
    component_record_action: present
    component_record_items: "{{ container_storage_gc_items }}"
