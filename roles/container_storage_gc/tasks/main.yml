---
- name: Check the component state
  ansible.builtin.assert:
    that: container_storage_gc_state in ['present', 'absent', 'kept']
    fail_msg: "container_storage_gc_state must be present, absent or kept, not {{ container_storage_gc_state }}."
    quiet: true

- name: "Make container_storage_gc {{ container_storage_gc_state }}"
  ansible.builtin.include_tasks: "{{ container_storage_gc_state }}.yml"
  when: container_storage_gc_state != 'kept'
