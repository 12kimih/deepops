---
- name: Check the component state
  ansible.builtin.assert:
    that: hpcsdk_state in ['present', 'absent', 'kept']
    fail_msg: "hpcsdk_state must be present, absent or kept, not {{ hpcsdk_state }}."
    quiet: true

- name: "Make the HPC SDK {{ hpcsdk_state }}"
  ansible.builtin.include_tasks: "{{ hpcsdk_state }}.yml"
  when: hpcsdk_state != 'kept'
