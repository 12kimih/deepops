---
# The installer writes the version tree as it goes (nvc among the first files), so a
# file in it does not mean the install finished: a record names the release the tree
# was installed from and is written only after the installer succeeded. localrc,
# which makelocalrc writes for the host's gcc, has its own record: a gcc upgrade
# regenerates it without reinstalling. This role owns hpcsdk_install_dir: another
# release's version tree and modulefiles there are removed.
- name: Install the compilers makelocalrc configures for (ubuntu)
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    name:
      - "gcc"
      - "g++"
    state: present
  when: ansible_facts.distribution == "Ubuntu"

- name: Install the compilers makelocalrc configures for (rhel)
  ansible.builtin.dnf:
    name:
      - "gcc"
      - "gcc-c++"
  when: ansible_facts.os_family == "RedHat"

# A tree from before records counts as installed when it has localrc, the last file
# the old role wrote.
- name: Look for localrc in the version tree
  ansible.builtin.stat:
    path: "{{ hpcsdk_tree }}/compilers/bin/localrc"
    get_checksum: false
  register: hpcsdk_old_localrc

- name: Check what the installed HPC SDK was installed from
  ansible.builtin.include_role:
    name: build_record
  vars:
    build_record_path: "{{ hpcsdk_install_record }}"
    build_record_key: "{{ hpcsdk_install_key }}"
    build_record_installed: ["{{ hpcsdk_tree }}/compilers/bin/nvc"]
    build_record_adopt: "{{ hpcsdk_old_localrc.stat.exists }}"

- name: Decide whether the HPC SDK needs installing
  ansible.builtin.set_fact:
    hpcsdk_install: "{{ build_record_stale }}"

- name: Ensure download and install directories exist
  when: hpcsdk_install
  ansible.builtin.file:
    path: "{{ item }}"
    state: "directory"
    owner: "root"
    group: "root"
    mode: "0755"
  with_items:
    - "{{ hpcsdk_temp_dir }}"
    - "{{ hpcsdk_install_dir }}"

- name: Refuse to start without room for the HPC SDK
  when: hpcsdk_install
  ansible.builtin.include_role:
    name: free_space
  vars:
    free_space_paths: ["{{ hpcsdk_temp_dir }}", "{{ hpcsdk_install_dir }}"]
    free_space_gb: "{{ hpcsdk_install_free_gb }}"
    free_space_for: "HPC SDK {{ hpcsdk_version_dir }}"

- name: Fetch and unpack the HPC SDK
  when: hpcsdk_install
  ansible.builtin.include_role:
    name: download
  vars:
    download_url: "{{ hpcsdk_download_url }}"
    download_checksum: "{{ hpcsdk_checksums[hpcsdk_download_url | basename] | default('') }}"
    download_dest: "{{ hpcsdk_dest_download_path }}"
    download_unpack: "{{ hpcsdk_temp_dir }}"

# Once the release is here to replace it.
- name: Remove what an unfinished install left in {{ hpcsdk_tree }}
  ansible.builtin.file:
    path: "{{ hpcsdk_tree }}"
    state: absent
  when: hpcsdk_install

- name: Run the installer
  when: hpcsdk_install
  ansible.builtin.command: "./install"
  args:
    chdir: "{{ hpcsdk_temp_dir }}/{{ hpcsdk_download_name }}"
  changed_when: true
  environment:
    NVHPC_SILENT: "true"
    NVHPC_INSTALL_DIR: "{{ hpcsdk_install_dir }}"
    NVHPC_INSTALL_TYPE: "{{ hpcsdk_install_type }}"
    NVHPC_DEFAULT_CUDA: "{{ hpcsdk_default_cuda }}"

- name: Record what the HPC SDK was installed from
  ansible.builtin.include_role:
    name: build_record
    tasks_from: write
  vars:
    build_record_path: "{{ hpcsdk_install_record }}"
    build_record_key: "{{ hpcsdk_install_key }}"
  when: hpcsdk_install

# Only after the installer succeeded: a failure keeps the unpacked copy for the rerun.
- name: Clean up the temp directory
  ansible.builtin.file:
    path: "{{ hpcsdk_temp_dir }}"
    state: absent
  when: hpcsdk_clean_up_temp_dir

- name: Read the gcc localrc is generated for
  ansible.builtin.command:
    argv: [gcc, -dumpfullversion]
  register: hpcsdk_gcc
  changed_when: false
  failed_when: hpcsdk_gcc.rc != 0 and not ansible_check_mode  # --check did not install it
  check_mode: false  # read-only; --check needs the result

# A localrc from before records is taken to be for this gcc.
- name: Check what localrc was generated for
  ansible.builtin.include_role:
    name: build_record
  vars:
    build_record_path: "{{ hpcsdk_tree }}/compilers/bin/localrc.built-from"
    build_record_key: "gcc {{ hpcsdk_gcc.stdout | trim }}"
    build_record_installed: ["{{ hpcsdk_tree }}/compilers/bin/localrc"]
    build_record_adopt: true
    build_record_force: "{{ hpcsdk_install }}"

- name: Decide whether localrc needs generating
  ansible.builtin.set_fact:
    hpcsdk_localrc: "{{ build_record_stale }}"

- name: Run the makelocalrc script
  ansible.builtin.command:
    argv:
      - "{{ hpcsdk_tree }}/compilers/bin/makelocalrc"
      - -x
      - "{{ hpcsdk_tree }}/compilers"
  changed_when: true
  when: hpcsdk_localrc

- name: Record what localrc was generated for
  ansible.builtin.include_role:
    name: build_record
    tasks_from: write
  vars:
    build_record_path: "{{ hpcsdk_tree }}/compilers/bin/localrc.built-from"
    build_record_key: "gcc {{ hpcsdk_gcc.stdout | trim }}"
  when: hpcsdk_localrc

# Another release's version tree, its year directory (links into a version tree) and
# its modulefiles. A running job that uses one loses it: change the version in a
# maintenance window.
- name: Find the HPC SDK releases the install directory holds
  ansible.builtin.find:
    paths: ["{{ hpcsdk_install_dir }}/Linux_{{ hpcsdk_arch }}", "{{ hpcsdk_install_dir }}/modulefiles"]
    file_type: any
    recurse: true
    depth: 2
    patterns: ['^[0-9]+\.[0-9]+(\.built-from)?$', '^20[0-9][0-9]$']
    use_regex: true
  register: hpcsdk_present

- name: Remove the other HPC SDK releases
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: >-
    {{ hpcsdk_present.files | map(attribute='path')
       | reject('search', '/(' ~ (hpcsdk_version_dir | regex_escape) ~ '(\.built-from)?|20' ~ hpcsdk_major_version ~ ')$')
       | reject('search', '^' ~ (hpcsdk_install_dir | regex_escape) ~ '/Linux_[^/]+/[^/]+/')
       | list }}

- name: Add profile script to add to environment
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "/etc/profile.d/{{ item }}"
    owner: "root"
    group: "root"
    mode: "0644"
  with_items:
    - "z95_nvhpc.sh"
    - "z95_nvhpc.csh"
  when: hpcsdk_install_in_path

- name: Register the HPC SDK modulefiles tree with Lmod (sorts before lmod.sh)
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "/etc/profile.d/{{ item }}"
    owner: "root"
    group: "root"
    mode: "0644"
  with_items:
    - "00-nvhpc-modulepath.sh"
    - "00-nvhpc-modulepath.csh"
  when: hpcsdk_install_as_modules
