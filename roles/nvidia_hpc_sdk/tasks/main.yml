---
- name: Check for existing nvhpc installation
  ansible.builtin.stat:
    path: "{{ hpcsdk_install_dir }}/Linux_{{ hpcsdk_arch }}/{{ hpcsdk_version_dir }}/compilers/bin/localrc"
  register: nvhpc_localrc

- name: Install dependencies (ubuntu)
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    name:
      - "gcc"
      - "g++"
    state: present
  when: ansible_facts.distribution == "Ubuntu" and not nvhpc_localrc.stat.exists

- name: Install dependencies (rhel)
  ansible.builtin.dnf:
    name:
      - "gcc"
      - "gcc-c++"
  when: ansible_facts.os_family == "RedHat" and not nvhpc_localrc.stat.exists

- name: Ensure download and install directories exist
  when: not nvhpc_localrc.stat.exists
  ansible.builtin.file:
    path: "{{ item }}"
    state: "directory"
    owner: "root"
    group: "root"
    mode: "0755"
  with_items:
    - "{{ hpcsdk_temp_dir }}"
    - "{{ hpcsdk_install_dir }}"

- name: Fetch and unpack the HPC SDK
  when: not nvhpc_localrc.stat.exists
  ansible.builtin.include_role:
    name: download
  vars:
    download_url: "{{ hpcsdk_download_url }}"
    download_checksum: "{{ hpcsdk_checksums[hpcsdk_download_url | basename] | default('') }}"
    download_dest: "{{ hpcsdk_dest_download_path }}"
    download_unpack: "{{ hpcsdk_temp_dir }}"

- name: Run the installer
  when: not nvhpc_localrc.stat.exists
  ansible.builtin.command: "./install"
  args:
    chdir: "{{ hpcsdk_temp_dir }}/{{ hpcsdk_download_name }}"
    creates: "{{ hpcsdk_install_dir }}/Linux_{{ hpcsdk_arch }}/{{ hpcsdk_version_dir }}/compilers/bin/nvc"
  environment:
    NVHPC_SILENT: "true"
    NVHPC_INSTALL_DIR: "{{ hpcsdk_install_dir }}"
    NVHPC_INSTALL_TYPE: "{{ hpcsdk_install_type }}"
    NVHPC_DEFAULT_CUDA: "{{ hpcsdk_default_cuda }}"

- name: Clean up the temp directory
  ansible.builtin.file:
    path: "{{ hpcsdk_temp_dir }}"
    state: absent
  when:
    - not nvhpc_localrc.stat.exists
    - hpcsdk_clean_up_temp_dir

- name: Run the makelocalrc script
  when: not nvhpc_localrc.stat.exists
  ansible.builtin.command: "{{ hpcsdk_install_dir }}/Linux_{{ hpcsdk_arch }}/{{ hpcsdk_version_dir }}/compilers/bin/makelocalrc -x {{ hpcsdk_install_dir }}/Linux_{{
    hpcsdk_arch }}/{{ hpcsdk_version_dir }}/compilers"
  args:
    creates: "{{ hpcsdk_install_dir }}/Linux_{{ hpcsdk_arch }}/{{ hpcsdk_version_dir }}/compilers/bin/localrc"

- name: Add profile script to add to environment
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "/etc/profile.d/{{ item }}"
    owner: "root"
    group: "root"
    mode: "0644"
  with_items:
    - "z95_nvhpc.sh"
    - "z95_nvhpc.csh"
  when: hpcsdk_install_in_path

- name: Register the HPC SDK modulefiles tree with Lmod (sorts before lmod.sh)
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "/etc/profile.d/{{ item }}"
    owner: "root"
    group: "root"
    mode: "0644"
  with_items:
    - "00-nvhpc-modulepath.sh"
    - "00-nvhpc-modulepath.csh"
  when: hpcsdk_install_as_modules
