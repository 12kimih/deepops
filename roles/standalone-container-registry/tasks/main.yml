---
- name: Check the component state
  ansible.builtin.assert:
    that: standalone_container_registry_state in ['present', 'absent', 'kept']
    fail_msg: "standalone_container_registry_state must be present, absent or kept, not {{ standalone_container_registry_state }}."
    quiet: true

- name: "Make the registry {{ standalone_container_registry_state }}"
  ansible.builtin.include_tasks: "{{ standalone_container_registry_state }}.yml"
  when: standalone_container_registry_state != 'kept'
