---
- name: Remove the registry from this host
  when: standalone_container_registry_state == 'absent'
  block:
    # Only where Docker runs; a host without it has no registry to remove.
    - name: Check for the Docker daemon socket
      ansible.builtin.stat:
        path: /var/run/docker.sock
      register: standalone_container_registry_docker

    - name: Remove the registry container
      community.docker.docker_container:
        name: "{{ standalone_container_registry_name }}"
        state: absent
      when: standalone_container_registry_docker.stat.exists

    # The configuration (it holds the upstream credentials) goes; the image store
    # (standalone_container_registry_data_dir) is data and stays.
    - name: Remove the registry configuration
      ansible.builtin.file:
        path: "{{ standalone_container_registry_config_dir }}/config.yml"
        state: absent

    - name: Stop here; the registry belongs elsewhere
      ansible.builtin.meta: end_role

- name: Create local directory for configuration
  ansible.builtin.file:
    path: "{{ standalone_container_registry_config_dir }}"
    state: directory
    owner: "root"
    group: "root"
    mode: "0700"

- name: Add config file
  diff: false  # the file holds a secret; --diff would print it
  ansible.builtin.template:
    src: "{{ standalone_container_registry_config_template }}"
    dest: "{{ standalone_container_registry_config_dir }}/config.yml"
    owner: "root"
    group: "root"
    mode: "0600"
  register: standalone_container_registry_config

- name: Create the registry storage directory
  ansible.builtin.file:
    path: "{{ standalone_container_registry_data_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  register: standalone_container_registry_data

- name: Add EPEL (RHEL family)
  ansible.builtin.include_role:
    name: package_repos
    tasks_from: epel

- name: Install python3 docker module
  ansible.builtin.package:
    name: python3-docker
    state: present

# A registry started before its storage was a host directory kept it in an anonymous
# volume: copy that into the new directory once, before the container is recreated.
- name: Look for an earlier registry container
  community.docker.docker_container_info:
    name: "{{ standalone_container_registry_name }}"
  register: standalone_container_registry_earlier
  when: standalone_container_registry_data is changed

- name: Keep what the earlier registry stored
  ansible.builtin.command:
    argv: [docker, cp, "{{ standalone_container_registry_name }}:/var/lib/registry/.", "{{ standalone_container_registry_data_dir }}/"]
  when:
    - standalone_container_registry_data is changed
    - standalone_container_registry_earlier.exists | default(false)
    - standalone_container_registry_earlier.container.Mounts | selectattr('Destination', 'equalto', '/var/lib/registry')
      | selectattr('Type', 'equalto', 'volume') | list | length > 0
  changed_when: true

- name: Run registry docker container
  community.docker.docker_container:
    name: "{{ standalone_container_registry_name }}"
    image: "{{ standalone_container_registry_image }}"
    state: started
    network_mode: host
    # The registry reads its mounted config only at start: restart when it changed
    # (a new image already recreates the container). restart_policy keeps it across boots.
    restart: "{{ standalone_container_registry_config is changed }}"
    restart_policy: unless-stopped
    # The registry exports traces to localhost:4318 unless told not to (its docs).
    env: "{{ proxy_env | combine({'OTEL_TRACES_EXPORTER': 'none'}) }}"
    volumes:
      - "{{ standalone_container_registry_config_dir }}/config.yml:/etc/docker/registry/config.yml"
      - "{{ standalone_container_registry_data_dir }}:/var/lib/registry"
