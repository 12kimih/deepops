---
- name: Remove the registry from this host
  when: standalone_container_registry_state == 'absent'
  block:
    # Only where Docker runs; a host without it has no registry to remove.
    - name: Check for the Docker daemon socket
      ansible.builtin.stat:
        path: /var/run/docker.sock
      register: standalone_container_registry_docker

    - name: Remove the registry container
      community.docker.docker_container:
        name: "{{ standalone_container_registry_name }}"
        state: absent
      when: standalone_container_registry_docker.stat.exists

    - name: Remove the registry configuration
      ansible.builtin.file:
        path: "{{ standalone_container_registry_config_dir }}"
        state: absent

    - name: Stop here; the registry belongs elsewhere
      ansible.builtin.meta: end_role

- name: Create local directory for configuration
  ansible.builtin.file:
    path: "{{ standalone_container_registry_config_dir }}"
    state: directory
    owner: "root"
    group: "root"
    mode: "0700"

- name: Add config file
  diff: false  # the file holds a secret; --diff would print it
  ansible.builtin.template:
    src: "{{ standalone_container_registry_config_template }}"
    dest: "{{ standalone_container_registry_config_dir }}/config.yml"
    owner: "root"
    group: "root"
    mode: "0600"
  register: standalone_container_registry_config

- name: Trust GPG key for EPEL
  ansible.builtin.rpm_key:
    key: "{{ epel_key_url }}"
    state: present
  when: ansible_facts.os_family == "RedHat"

- name: Enable EPEL repo
  ansible.builtin.package:
    name:
      - "{{ epel_package }}"
    state: present
  when: ansible_facts.os_family == 'RedHat'

- name: Install python3 docker module
  ansible.builtin.package:
    name: python3-docker
    state: present

- name: Run registry docker container
  community.docker.docker_container:
    name: "{{ standalone_container_registry_name }}"
    image: "{{ standalone_container_registry_image }}"
    state: started
    network_mode: host
    # The registry reads its mounted config only at start: restart when it changed
    # (a new image already recreates the container). restart_policy keeps it across boots.
    restart: "{{ standalone_container_registry_config is changed }}"
    restart_policy: unless-stopped
    env: "{{ proxy_env if proxy_env is defined else {} }}"
    volumes:
      - "{{ standalone_container_registry_config_dir }}/config.yml:/etc/docker/registry/config.yml"
