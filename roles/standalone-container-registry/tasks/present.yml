---
- name: Record what this component installs
  ansible.builtin.include_role:
    name: component_record
  vars:
    component_record_name: standalone_container_registry
    component_record_action: begin
    component_record_items: "{{ standalone_container_registry_items }}"

- name: Create local directory for configuration
  ansible.builtin.file:
    path: "{{ standalone_container_registry_config_dir }}"
    state: directory
    owner: "root"
    group: "root"
    mode: "0700"

- name: Replace a directory Docker made in the config file's place
  ansible.builtin.include_role:
    name: container_service
    tasks_from: file_sources
  vars:
    container_service_files: ["{{ standalone_container_registry_config_dir }}/config.yml"]

- name: Add config file
  diff: false  # the file holds a secret; --diff would print it
  ansible.builtin.template:
    src: "{{ standalone_container_registry_config_template }}"
    dest: "{{ standalone_container_registry_config_dir }}/config.yml"
    owner: "root"
    group: "root"
    mode: "0600"
  register: standalone_container_registry_config
  notify: [Restart the registry]

- name: Create the registry storage directory
  ansible.builtin.file:
    path: "{{ standalone_container_registry_data_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Add EPEL (RHEL family)
  ansible.builtin.include_role:
    name: package_repos
    tasks_from: epel

- name: Install python3 docker module
  repo_package:
    name: python3-docker
    state: present

# A registry started before its storage was a host directory kept it in an anonymous
# volume: copied into the directory, from the volume's own host path, while the
# container still uses that volume. Decided by that evidence, not by this run having
# made the directory, so a run that failed in between finishes it; docker cp is not
# used, since it remounts the old container's binds (one may have become a file).
- name: Look for an earlier registry container
  community.docker.docker_container_info:
    name: "{{ standalone_container_registry_name }}"
  register: standalone_container_registry_earlier

- name: Keep what the earlier registry stored
  change_command:
    argv: [cp, -a, --no-clobber, "{{ _volume.Source }}/.", "{{ standalone_container_registry_data_dir }}/"]
  vars:
    _volume: >-
      {{ (standalone_container_registry_earlier.container.Mounts | default([])
          | selectattr('Destination', 'equalto', '/var/lib/registry')
          | selectattr('Type', 'equalto', 'volume') | selectattr('Driver', 'equalto', 'local') | list
          + [{}]) | first }}
  when: _volume.Source is defined

- name: Pull the image
  ansible.builtin.include_role:
    name: container_image
  vars:
    container_image: "{{ standalone_container_registry_image }}"

# It ran outside systemd under its own name, with Docker's restart policy: that
# container holds the port the unit's needs, so it goes first (its store is a bind,
# kept above).
- name: Retire the registry container run outside systemd
  community.docker.docker_container:
    name: "{{ standalone_container_registry_name }}"
    state: absent
  when: standalone_container_registry_earlier.exists | default(false)

- name: Run the registry
  ansible.builtin.include_role:
    name: container_service
  vars:
    container_service:
      unit: "{{ standalone_container_registry_svc_name }}"
      description: Container registry
      image: "{{ standalone_container_registry_image }}"
      options: [--network host]
      # The registry exports traces to localhost:4318 unless told not to (its docs).
      env: "{{ proxy_env | combine({'OTEL_TRACES_EXPORTER': 'none'}) }}"
      mounts:
        - {src: "{{ standalone_container_registry_config_dir }}/config.yml", dst: /etc/docker/registry/config.yml, readonly: true}
        - {src: "{{ standalone_container_registry_data_dir }}", dst: /var/lib/registry}
      # It reads its configuration only at start.
      notify: [Restart the registry]
      health_url: "http://localhost:{{ standalone_container_registry_port }}/v2/"

- name: Record the component as present
  ansible.builtin.include_role:
    name: component_record
  vars:
    component_record_name: standalone_container_registry
    component_record_action: present
    component_record_items: "{{ standalone_container_registry_items }}"
