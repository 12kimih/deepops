---

standalone_container_registry_image: "registry:3.1.2@sha256:82f6ff4a7f982960c8aa51617fea3aabc485df6e55cce80d22deb1de36f1bc3c"
standalone_container_registry_port: "5000"
# Run as a systemd unit (roles/container_service), its container named after it.
standalone_container_registry_svc_name: docker.registry.service
# The container's CPUs and memory (Docker's --cpus and --memory, roles/container_service);
# "" for no limit.
standalone_container_registry_max_cpu: "1"
standalone_container_registry_max_memory: "1g"
# The container's name when it ran outside systemd (docker restart policy): retired.
standalone_container_registry_name: "deepops-registry"
# present, absent or kept (do nothing); a deploy sets it from deepops_components, so a
# registry turned off or moved to another host goes from where it was. absent removes
# the container and its config, never the image store.
standalone_container_registry_state: present

standalone_container_registry_config_template: "config.yml"

standalone_container_registry_config_dir: "{{ deepops_dir }}/registry"
# The registry's storage (/var/lib/registry), a host directory as the deploying docs use:
# in the image's anonymous volume it was orphaned whenever the container was recreated.
standalone_container_registry_data_dir: "{{ standalone_container_registry_config_dir }}/data"

# To configure the container registry as a pull-through cache, set
# standalone_container_registry_cache_enable to true.
# A username and password can optionally be configured to access private images
# or take advantage of higher rate limits in a pro account.
standalone_container_registry_cache_enable: false
standalone_container_registry_cache_upstream: "https://registry-1.docker.io"
standalone_container_registry_cache_username: ""
standalone_container_registry_cache_password: ""
