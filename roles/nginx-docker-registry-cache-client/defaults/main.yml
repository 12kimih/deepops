---
# A host's Docker pulls through the registry cache proxy (docs/container/nginx-docker-cache.md):
# a docker.service drop-in pointing at it, and the proxy's CA in the system trust store.
# present, absent or kept (do nothing); a deploy sets it from deepops_components
# (slurm_enable_nginx_docker_cache on [slurm-node]). absent takes both out again, so
# Docker never pulls through a proxy that is gone.
nginx_docker_cache_client_state: present

# The proxy: the first host where the cache component is installed (deepops_components),
# unless the site points elsewhere.
nginx_docker_cache_host: >-
  {{ deepops_component_registry | component_hosts(groups, 'nginx_docker_cache', deepops_component_removals)
     | first | default('') }}
nginx_docker_cache_proxy_url: "http://{{ nginx_docker_cache_host }}:{{ nginx_docker_cache_port }}"

# Whether dockerd pulls through the proxy (the drop-in); false removes the drop-in.
nginx_docker_cache_dockerd_clients: true
nginx_docker_cache_docker_config_src: "http-proxy.conf"
nginx_docker_cache_docker_config_dest: "/etc/systemd/system/docker.service.d/http-proxy.conf"

# Where the proxy's CA goes in the trust store (a file, on each family).
nginx_docker_cache_ca_client_crt_ubuntu: "/usr/share/ca-certificates/docker_registry_proxy.crt"
nginx_docker_cache_ca_client_crt_el: "/etc/pki/ca-trust/source/anchors/docker_registry_proxy.crt"
nginx_docker_cache_ca_client_name: "docker_registry_proxy.crt"
