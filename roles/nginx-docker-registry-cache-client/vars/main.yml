---
# What the component installs, for its record (roles/component_record).
_nginx_docker_cache_client_crt: >-
  {{ nginx_docker_cache_ca_client_crt_el if ansible_facts.os_family == 'RedHat'
     else nginx_docker_cache_ca_client_crt_ubuntu }}
nginx_docker_cache_client_items: >-
  {{ ['file:' ~ _nginx_docker_cache_client_crt]
     + (['file:' ~ nginx_docker_cache_docker_config_dest] if nginx_docker_cache_dockerd_clients | bool else []) }}
