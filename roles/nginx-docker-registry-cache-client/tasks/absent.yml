---
- name: Remove what this component installed
  ansible.builtin.include_role:
    name: component_record
  vars:
    component_record_name: nginx_docker_cache_client
    component_record_action: absent
    component_record_items: >-
      {{ ['file:' ~ _nginx_docker_cache_client_crt, 'file:' ~ nginx_docker_cache_docker_config_dest,
          'dir:' ~ nginx_docker_cache_docker_config_dest | dirname] }}

# The proxy's CA leaves the trust store: off the list (Debian), and the store rebuilt
# whenever it is older than its sources, also after a run that failed before rebuilding.
- name: Drop the CA from the certificate list (Debian)
  ansible.builtin.lineinfile:
    path: /etc/ca-certificates.conf
    line: "{{ nginx_docker_cache_ca_client_name }}"
    state: absent
  when: ansible_facts.os_family == 'Debian'

- name: Bring the trust store up to date
  ansible.builtin.include_tasks: trust.yml

- name: Restart Docker without the proxy
  ansible.builtin.debug:
    msg: The proxy drop-in of docker.service is gone; dockerd restarts.
  changed_when: true
  notify: Restart dockerd
  when: nginx_docker_cache_docker_config_dest in component_record_removed.file
