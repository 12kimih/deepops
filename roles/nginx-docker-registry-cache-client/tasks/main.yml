---
- name: Check the component state
  ansible.builtin.assert:
    that: nginx_docker_cache_client_state in ['present', 'absent', 'kept']
    fail_msg: "nginx_docker_cache_client_state must be present, absent or kept, not {{ nginx_docker_cache_client_state }}."
    quiet: true

- name: "Make the registry cache client {{ nginx_docker_cache_client_state }}"
  ansible.builtin.include_tasks: "{{ nginx_docker_cache_client_state }}.yml"
  when: nginx_docker_cache_client_state != 'kept'
