---
- name: Look for Docker
  systemd_unit:
    name: docker
  register: nginx_docker_cache_client_docker
  check_mode: true  # read-only: no state requested
  failed_when: false

- name: Restart Docker so its environment drops the proxy
  systemd_unit:
    name: docker
    state: restarted
    daemon_reload: true
  when: nginx_docker_cache_client_docker.status.ActiveState | default('') == 'active'
