---
# Every setting below is inert until a site fills it in: an empty value means
# "leave that alone", so the role is safe to run against any inventory.

bmc_channel: 1
bmc_user_name: ADMIN

# BMC LAN. bmc_ipaddr is per-host (host_vars); the rest are usually site-wide.
bmc_ipsrc: static
bmc_ipaddr: ""
bmc_netmask: ""
bmc_gateway: ""

# Set from the host over KCS, which needs no BMC credentials -- this is how a
# board whose factory password exists only on a sticker gets a known one. Vault
# it. Newer BMCs require the 20-byte wire format; older ones take 16.
bmc_password: ""
bmc_password_format: 20

# SNMP community for the channel's v1/v2c agent, which authenticates with this string
# alone and sends it in clear. bmc_snmp_community_file names a site secret file holding
# it, made when missing (roles/site_secrets: random, vaulted, 18 characters, all the
# parameter holds), so nobody picks it and nothing keeps the shipped "public".
# An explicit bmc_snmp_community (vaulted) wins; both empty leave the setting alone.
bmc_snmp_community_file: ""
# (Under --check a missing file is not made, so the community is left alone.)
bmc_snmp_community: "{{ query('ansible.builtin.file', bmc_snmp_community_file, errors='ignore') | first | default('') if bmc_snmp_community_file | length > 0 else '' }}"
# The secret files roles/site_secrets makes for this role (playbooks/utilities/bmc.yml).
bmc_site_secrets: "{{ [{'path': bmc_snmp_community_file, 'kind': 'password', 'chars': 18}] if bmc_snmp_community_file | length > 0 else [] }}"

# IPMI 1.5 session authentication types left enabled at the callback, user, operator and
# admin levels (the OEM level's are kept), from md2, md5, password and oem, each one the
# BMC supports (`ipmitool lan print`: Auth Type Support): [md5] drops none (no
# authentication), password (clear text) and md2. IPMI 2.0 (RMCP+, the cipher suites
# below) does not use them. Empty leaves them alone.
bmc_auth_types: []

# The RMCP+ cipher suites left open, each up to ADMIN; every other suite the BMC lists
# is closed. Must hold bmc_cipher_suite, which out-of-band calls use, and only suites
# the BMC lists (`ipmitool lan print`: RMCP+ Cipher Suites): [3, 17] keeps the AES ones
# with SHA1 and SHA256 integrity. Empty leaves them alone.
bmc_cipher_suites: []

# Chassis power action driven out-of-band by playbooks/utilities/power.yml.
bmc_power_action: status
# off, cycle, reset, soft and diag stop a node's jobs, so a Slurm compute node must be
# drained and empty first (maintenance require_drained, as for a reboot); a hung node
# Slurm already counts DOWN passes. true acts anyway, losing its jobs.
bmc_power_undrained: false

# RMCP+ cipher suite for out-of-band sessions. Pinned rather than negotiated: ipmitool
# asks for the strongest suite it knows, and a BMC that does not offer it answers
# "invalid role" instead of falling back. 3 (HMAC-SHA1 + AES-128) is the baseline every
# IPMI 2.0 implementation supports; raise it to 17 on a fleet that offers it.
bmc_cipher_suite: 3

# This host's leg on the BMC network, written as its own netplan file. Empty
# leaves host networking untouched.
bmc_mgmt_interface: ""
bmc_mgmt_address: ""
