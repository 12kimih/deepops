---
- name: Verify
  hosts: all
  become: true
  tasks:
    - name: Check ipmitool is installed
      ansible.builtin.command: ipmitool -V
      changed_when: false

    - name: Look for a BMC
      ansible.builtin.stat:
        path: /dev/ipmi0
      register: bmc_device

    - name: A host without a BMC is left alone
      ansible.builtin.assert:
        that: not bmc_device.stat.exists
        success_msg: "No /dev/ipmi0, so BMC configuration was correctly skipped"

    - name: Host networking is untouched when bmc_mgmt_address is unset
      ansible.builtin.stat:
        path: /etc/netplan/60-bmc-mgmt.yaml
      register: bmc_netplan_file

    - name: Check no netplan file was written
      ansible.builtin.assert:
        that: not bmc_netplan_file.stat.exists

    # A BMC address for a host with no BMC would leave it silently unconfigured.
    - name: A host without a BMC refuses a BMC address of its own
      block:
        - name: Apply the role with a BMC address
          ansible.builtin.include_role:
            name: bmc
          vars:
            bmc_ipaddr: 192.0.2.10
            bmc_netmask: 255.255.255.0
            bmc_gateway: 192.0.2.1
        - name: Never reached
          ansible.builtin.fail:
            msg: the role accepted bmc_ipaddr on a host without /dev/ipmi0
      rescue:
        - name: Check it was the missing device that stopped it
          ansible.builtin.assert:
            that: "'has no /dev/ipmi0' in ansible_failed_result.msg"
