---
# The password never reaches ipmitool's argv, which any user on the host can read in
# ps: ipmitool reads the command from stdin (exec /dev/stdin), where only it sees it.
# exec splits a line on blanks and honours double quotes, hence the assert.
- name: Require a BMC password exec can quote
  ansible.builtin.assert:
    that: bmc_password is not search('["\n\r]')
    fail_msg: bmc_password may not contain a double quote or a line break.
    quiet: true
  no_log: true
  tags:
    - bmc

# A BMC password cannot be read back, so `user test` -- which verifies one
# without changing it -- is what makes this idempotent.
- name: Test the configured BMC password
  ansible.builtin.command:
    argv: ["ipmitool", "-I", "open", "exec", "/dev/stdin"]
    stdin: 'user test {{ bmc_user_id }} {{ bmc_password_format }} "{{ bmc_password }}"'
  register: bmc_password_test
  failed_when: false
  changed_when: false
  check_mode: false
  no_log: true
  tags:
    - bmc

- name: Set the BMC password
  ansible.builtin.command:
    argv: ["ipmitool", "-I", "open", "exec", "/dev/stdin"]
    stdin: 'user set password {{ bmc_user_id }} "{{ bmc_password }}" {{ bmc_password_format }}'
  when: bmc_password_test.rc != 0
  changed_when: true
  no_log: true
  tags:
    - bmc
