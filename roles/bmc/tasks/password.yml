---
# A BMC password cannot be read back, so `user test` -- which verifies one
# without changing it -- is what makes this idempotent.
- name: Test the configured BMC password
  ansible.builtin.command:
    argv: ["ipmitool", "-I", "open", "user", "test", "{{ bmc_user_id }}", "{{ bmc_password_format }}", "{{ bmc_password }}"]
  register: bmc_password_test
  failed_when: false
  changed_when: false
  check_mode: false
  no_log: true
  tags:
    - bmc

- name: Set the BMC password
  ansible.builtin.command:
    argv: ["ipmitool", "-I", "open", "user", "set", "password", "{{ bmc_user_id }}", "{{ bmc_password }}", "{{ bmc_password_format }}"]
  when: bmc_password_test.rc != 0
  changed_when: true
  no_log: true
  tags:
    - bmc
