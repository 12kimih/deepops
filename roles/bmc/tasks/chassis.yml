---
# One chassis power action (bmc_power_action) through the host's BMC, the one place the
# repository drives ipmitool: playbooks/utilities/power.yml and the maintenance reboot
# of a host that must be power-cycled both come here. Refuses the machine running
# Ansible for anything but status and on: powering it off cuts the run off; and a
# compute node that takes or runs jobs, as a reboot does (bmc_power_undrained).
- name: Require a BMC address and credentials
  ansible.builtin.assert:
    that:
      - bmc_ipaddr | length > 0
      - bmc_password | length > 0
      - bmc_power_action in ["status", "on", "off", "cycle", "reset", "soft", "diag"]
    fail_msg: "Set bmc_ipaddr and bmc_password -- see docs/deepops/bmc.md"

- name: Find out whether this host is the machine running Ansible
  ansible.builtin.include_role:
    name: maintenance
    tasks_from: runs_ansible.yml
  when: bmc_power_action not in ["status", "on"]

- name: Refuse a power action on the machine running Ansible
  ansible.builtin.assert:
    that: not maintenance_runs_ansible | default(false) | bool
    fail_msg: >-
      {{ inventory_hostname }} runs this playbook; chassis power {{ bmc_power_action }}
      would cut the run off. Leave it out of hostlist, or run the playbook from another
      machine.
    quiet: true
  when: bmc_power_action not in ["status", "on"]

- name: Require the node drained before chassis power {{ bmc_power_action }}
  ansible.builtin.include_role:
    name: maintenance
    tasks_from: require_drained
  vars:
    maintenance_change: chassis power {{ bmc_power_action }}
    maintenance_undrained_ok: "{{ bmc_power_undrained }}"
    maintenance_drain_hint: >-
      Drain it and wait for its jobs (playbooks/utilities/reboot.yml does both), or pass
      -e bmc_power_undrained=true to act anyway, losing its jobs.
  when: bmc_power_action not in ["status", "on"]

# ipmitool -E reads IPMI_PASSWORD; the shell sets it from stdin (a last line without a
# newline counts). Ansible's `environment:` would put it on the module's command line
# (VAR=value), readable in ps by every user (rule 9).
- name: "Chassis power {{ bmc_power_action }}"
  change_command:
    argv: >-
      {{ ['sh', '-c', 'IFS= read -r IPMI_PASSWORD || [ -n "$IPMI_PASSWORD" ] || exit 2; export IPMI_PASSWORD; exec "$@"', 'ipmitool',
          'ipmitool', '-I', 'lanplus', '-C', bmc_cipher_suite | string, '-H', bmc_ipaddr, '-U', bmc_user_name,
          '-E', 'chassis', 'power', bmc_power_action] }}
    stdin: "{{ bmc_password }}"
  no_log: true
  delegate_to: localhost
  become: false
  register: bmc_power_result
  changed_when: bmc_power_action != "status"
