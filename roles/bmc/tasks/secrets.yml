---
# The secret files this role reads, made on the controller when missing and never
# replaced (roles/site_secrets). playbooks/utilities/bmc.yml runs this first, on every
# targeted host, so the role reads the file the same run.
- name: Create the BMC's missing secret files
  ansible.builtin.include_role:
    name: site_secrets
  vars:
    site_secrets: "{{ bmc_site_secrets }}"
