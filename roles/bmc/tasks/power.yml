---
# Out-of-band, so it reaches a node whose OS is gone. Runs from the control node against
# the host's bmc_ipaddr; the password goes through the environment rather than argv.
# Anything but status acts on every BMC the play reaches, the controller and the NFS
# servers too: the hosts must be named.
- name: Require hostlist for a power action
  ansible.builtin.assert:
    that: hostlist is defined or bmc_power_action == 'status'
    fail_msg: "-e bmc_power_action={{ bmc_power_action }} needs -e hostlist=... naming the hosts."
    quiet: true
  run_once: true
  tags:
    - power

- name: Require a BMC address and credentials
  ansible.builtin.assert:
    that:
      - bmc_ipaddr | length > 0
      - bmc_password | length > 0
      - bmc_power_action in ["status", "on", "off", "cycle", "reset", "soft", "diag"]
    fail_msg: "Set bmc_ipaddr and bmc_password -- see docs/deepops/bmc.md"
  tags:
    - power

- name: "Chassis power {{ bmc_power_action }}"
  ansible.builtin.command:
    argv: ["ipmitool", "-I", "lanplus", "-C", "{{ bmc_cipher_suite }}", "-H", "{{ bmc_ipaddr }}", "-U", "{{ bmc_user_name }}", "-E", "chassis", "power", "{{ bmc_power_action }}"]
  environment:
    IPMI_PASSWORD: "{{ bmc_password }}"
  delegate_to: localhost
  become: false
  register: bmc_power_result
  changed_when: bmc_power_action != "status"
  tags:
    - power

- name: Report
  ansible.builtin.debug:
    msg: "{{ bmc_power_result.stdout | trim }}"
  tags:
    - power
