---
- name: Install ipmitool
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    name: ipmitool
    state: present
  when: ansible_facts.os_family == "Debian"
  tags:
    - bmc

- name: Install ipmitool
  ansible.builtin.dnf:
    name: ipmitool
    state: present
  when: ansible_facts.os_family == "RedHat"
  tags:
    - bmc

# ipmi_si drives the KCS interface; ipmi_devintf exports it as /dev/ipmi0. A board
# without a BMC refuses ipmi_si; the device check below decides what that means.
- name: Load the in-band IPMI modules
  ansible.builtin.include_role:
    name: kernel_modules
    apply:
      tags: [bmc]
  vars:
    kernel_modules: [ipmi_si, ipmi_devintf]
    kernel_modules_optional: true
  tags:
    - bmc

# systemd reads the directory but does not ship it: only packages that drop a hook
# make it (mdadm). Recorded as a dir: item, so a removal takes it only when empty.
- name: Create the directory of the shutdown hooks
  ansible.builtin.file:
    path: "{{ bmc_cold_reboot_hook | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: bmc_cold_reboot | bool
  tags:
    - bmc

- name: Install the cold reboot hook
  ansible.builtin.copy:
    src: bmc-cold-reboot
    dest: "{{ bmc_cold_reboot_hook }}"
    owner: root
    group: root
    mode: "0755"
  when: bmc_cold_reboot | bool
  tags:
    - bmc

# Resolved here, where this role's settings are in scope: an include argument is
# evaluated inside the included role.
- name: List what the BMC needs on the host
  ansible.builtin.set_fact:
    bmc_record_items: >-
      {{ kernel_modules_files | map('regex_replace', '^', 'file:') | list
         + (['file:' ~ bmc_cold_reboot_hook, 'dir:' ~ bmc_cold_reboot_hook | dirname]
            if bmc_cold_reboot | bool else []) }}
  tags:
    - bmc

# Recorded, so their boot-time files stay while this role needs them, whatever else
# (the IPMI exporter) that also loads them is removed; the hook goes once unwanted.
- name: Record what the BMC needs on the host
  ansible.builtin.include_role:
    name: component_record
    apply:
      tags: [bmc]
  vars:
    component_record_name: bmc
    component_record_action: present
    component_record_items: "{{ bmc_record_items }}"
  tags:
    - bmc

- name: Look for the in-band IPMI device
  ansible.builtin.stat:
    path: /dev/ipmi0
  register: bmc_device
  tags:
    - bmc

# A VM, a container, or a board without a BMC has no /dev/ipmi0. Such a host with no
# bmc_ipaddr of its own is skipped, so the role stays safe across a mixed inventory
# (bmc_password and the like are site-wide); one with a bmc_ipaddr fails, or its BMC
# would silently stay unconfigured. Under --check the modules are not loaded, so
# there it is only stated.
- name: Require the in-band IPMI device on a host with a BMC address
  ansible.builtin.fail:
    msg: >-
      bmc_ipaddr is {{ bmc_ipaddr }} for {{ inventory_hostname }}, but it has no /dev/ipmi0
      (`lsmod | grep ipmi`, `dmesg | grep -i ipmi`). Check that the board has a BMC and
      that its KCS interface is enabled, or remove bmc_ipaddr from this host's config.
  when:
    - bmc_ipaddr | length > 0
    - not bmc_device.stat.exists
    - not ansible_check_mode
  tags:
    - bmc

- name: State that the BMC is not configured under --check
  ansible.builtin.debug:
    msg: "{{ inventory_hostname }} has no /dev/ipmi0 yet; the run loads the IPMI modules first."
  when:
    - bmc_ipaddr | length > 0
    - not bmc_device.stat.exists
    - ansible_check_mode
  tags:
    - bmc

- name: Configure the BMC
  when: bmc_device.stat.exists
  tags:
    - bmc
  block:
    - name: Resolve the BMC user ID
      ansible.builtin.include_tasks: user_id.yml
      when: bmc_password | length > 0

    - name: Read the BMC LAN channel
      ansible.builtin.include_tasks: lan_facts.yml
      when: >-
        (bmc_ipaddr | length > 0) or (bmc_snmp_community | length > 0)
        or (bmc_auth_types is not none) or (bmc_cipher_suites is not none)

    - name: Configure the BMC LAN channel
      ansible.builtin.include_tasks: lan.yml
      when: bmc_ipaddr | length > 0

    - name: Set the BMC SNMP community
      ansible.builtin.include_tasks: snmp.yml
      when: bmc_snmp_community | length > 0

    - name: Set the IPMI 1.5 authentication types
      ansible.builtin.include_tasks: auth.yml
      when: bmc_auth_types is not none

    - name: Close the cipher suites not listed
      ansible.builtin.include_tasks: ciphers.yml
      when: bmc_cipher_suites is not none

    - name: Set the BMC password
      ansible.builtin.include_tasks: password.yml
      when: bmc_password | length > 0

- name: Configure this host's leg on the BMC network
  ansible.builtin.include_tasks:
    file: mgmt_network.yml
    apply:
      tags: [bmc]
  when: bmc_mgmt_address | length > 0
  tags:
    - bmc
