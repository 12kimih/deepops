---
# pyxis's node setup as a component (the plugin and its package are roles/slurm's):
# present, absent or kept (do nothing). A deploy sets it from deepops_components
# (slurm_install_enroot and slurm_install_pyxis); absent removes the enroot hooks it
# links, and the /run size entry while resize_run_partition put one in fstab.
pyxis_state: present

# pyxis itself (package, plugstack entry and options) is roles/slurm's: it is packaged,
# installed and configured with the Slurm it was built for. This role adds what pyxis
# needs around it: its job-time helpers, enroot's Slurm hooks and the /run size.

# Helpers pyxis runs at job time (column, hexdump).
pyxis_ubuntu_deps:
  - "bsdmainutils"

pyxis_el_deps:
  - "util-linux"

# /run is default partition of pyxis runtime_path: true sizes its tmpfs in fstab (from
# now on, and at every boot); false again takes that fstab entry out (the running /run
# keeps its size until the next boot: a live /run is never remounted).
resize_run_partition: false

# /run tmpfs size. ubuntu default is 10% of physical memory
pyxis_run_tmpfs_size: 50%
