---
# The plugin itself comes with the Slurm packages (roles/slurm installs
# slurm_pyxis_package with the Slurm it was built for); this configures it.
- name: Check for the pyxis SPANK plugin
  ansible.builtin.stat:
    path: "{{ slurm_plugin_dir }}/spank_pyxis.so"
  register: pyxis_plugin
  tags: pyxis

- name: Require the pyxis package
  ansible.builtin.assert:
    that: pyxis_plugin.stat.exists
    fail_msg: >-
      {{ slurm_plugin_dir }}/spank_pyxis.so is missing: the slurm play installs pyxis with
      the Slurm packages (slurm_pyxis_package); run it first.
    quiet: true
  when: not ansible_check_mode
  tags: pyxis

# Earlier versions of this role built the plugin on every host from a source tree
# under /usr/local/src, with a record of what it was built from.
- name: Find the source trees earlier versions built pyxis in
  ansible.builtin.find:
    paths: /usr/local/src
    patterns: "pyxis-*"
    file_type: directory
  register: pyxis_old_trees
  tags: pyxis

- name: Remove what the on-host builds left
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ pyxis_old_trees.files | map(attribute='path') | list + [slurm_plugin_dir ~ '/spank_pyxis.so.built-from'] }}"
  tags: pyxis

# Slurm reads only plugstack.conf; this include pulls in plugstack.conf.d/*.conf, which
# each node reads from its own disk (pyxis.conf is there only where the plugin loads).
# plugstack.conf itself lives on the controllers: slurmctld serves it to slurmd and
# sackd (configless), so the nodes are told to fetch it again when it changes.
# SPANK plugins are loaded by slurmd and slurmstepd and by the client commands, never
# by slurmctld.
- name: Copy top-level plugstack file
  ansible.builtin.template:
    src: etc/slurm/plugstack.conf
    dest: "{{ slurm_config_dir }}/"
    mode: "0644"
  when: is_controller
  notify:
    - Reconfigure slurmd
  tags: pyxis

- name: Remove a local plugstack file slurmctld now serves
  ansible.builtin.file:
    path: "{{ slurm_config_dir }}/plugstack.conf"
    state: absent
  when: not is_controller
  tags: pyxis

- name: Create plugstack.conf.d directory
  ansible.builtin.file:
    path: "{{ slurm_config_dir }}/plugstack.conf.d"
    state: directory
    mode: "0755"
  tags: pyxis

- name: Copy pyxis plugstack file
  ansible.builtin.template:
    src: etc/slurm/plugstack.conf.d/pyxis.conf
    dest: "{{ slurm_config_dir }}/plugstack.conf.d/"
    mode: "0644"
  notify:
    - Restart slurmd
  tags: pyxis
