---
- name: Create pyxis source dir
  ansible.builtin.file:
    path: /usr/local/src/pyxis
    state: directory
    mode: "0755"
  tags: pyxis

# Only (re)build+install when the plugin is missing, so re-runs are a no-op and do
# not bounce slurmd/slurmctld. Set slurm_pyxis_force_rebuild=true to force a rebuild
# (e.g. after bumping slurm_pyxis_version).
- name: Check for an installed pyxis plugin
  ansible.builtin.stat:
    path: "{{ slurm_install_prefix }}/lib/slurm/spank_pyxis.so"
  register: pyxis_installed
  tags: pyxis

- name: Fetch and unpack the Pyxis source
  ansible.builtin.include_role:
    name: download
    apply:
      tags: pyxis
  vars:
    download_url: "{{ slurm_pyxis_tarball_url }}"
    download_checksum: "{{ slurm_pyxis_checksums[slurm_pyxis_version] | default('') }}"
    download_dest: "/var/cache/deepops/pyxis-{{ slurm_pyxis_version }}.tar.gz"
    download_unpack: /usr/local/src/pyxis
    download_strip: 1
  when: (not pyxis_installed.stat.exists) or (slurm_pyxis_force_rebuild | default(false))
  tags: pyxis

- name: Clean pyxis source directory
  ansible.builtin.command:
    chdir: /usr/local/src/pyxis
    argv:
      - make
      - clean
  register: pyxis_make_clean
  failed_when: false
  changed_when: pyxis_make_clean.rc == 0
  when: (not pyxis_installed.stat.exists) or (slurm_pyxis_force_rebuild | default(false))
  tags: pyxis

- name: Build pyxis
  ansible.builtin.command:
    chdir: /usr/local/src/pyxis
    argv:
      - make
      - -j
  environment:
    CPPFLAGS: "-I {{ slurm_install_prefix }}/include"
  register: result
  changed_when: "result.stdout != \"make: Nothing to be done for 'all'.\""
  when: (not pyxis_installed.stat.exists) or (slurm_pyxis_force_rebuild | default(false))
  notify:
    - Restart slurmd
  tags: pyxis

# `make install` places the plugin at {{ slurm_install_prefix }}/lib/slurm/spank_pyxis.so
# (a consistent, owned location) instead of running it from the source tree.
- name: Install pyxis
  ansible.builtin.command:
    chdir: /usr/local/src/pyxis
    argv:
      - make
      - install
      - "prefix={{ slurm_install_prefix }}"
  environment:
    CPPFLAGS: "-I {{ slurm_install_prefix }}/include/slurm"
  changed_when: true
  when: (not pyxis_installed.stat.exists) or (slurm_pyxis_force_rebuild | default(false))
  notify:
    - Restart slurmd
  tags: pyxis

# Slurm reads only plugstack.conf; this include pulls in plugstack.conf.d/*.conf.
# SPANK plugins are loaded by slurmd and slurmstepd and by the client commands, never
# by slurmctld, so only slurmd restarts for them.
- name: Copy top-level plugstack file
  ansible.builtin.template:
    src: etc/slurm/plugstack.conf
    dest: "{{ slurm_config_dir }}/"
    mode: "0644"
  notify:
    - Restart slurmd
  tags: pyxis

- name: Create plugstack.conf.d directory
  ansible.builtin.file:
    path: "{{ slurm_config_dir }}/plugstack.conf.d"
    state: directory
    mode: "0755"
  tags: pyxis

- name: Copy pyxis plugstack file
  ansible.builtin.template:
    src: etc/slurm/plugstack.conf.d/pyxis.conf
    dest: "{{ slurm_config_dir }}/plugstack.conf.d/"
    mode: "0644"
  notify:
    - Restart slurmd
  tags: pyxis
