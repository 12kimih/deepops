---
- name: Check the component state
  ansible.builtin.assert:
    that: pyxis_state in ['present', 'absent', 'kept']
    fail_msg: "pyxis_state must be present, absent or kept, not {{ pyxis_state }}."
    quiet: true

- name: "Make pyxis {{ pyxis_state }}"
  ansible.builtin.include_tasks: "{{ pyxis_state }}.yml"
  when: pyxis_state != 'kept'
