---
# slurmd and sackd fetch plugstack.conf from slurmctld again (configless).
- name: Reconfigure slurmd
  ansible.builtin.command:
    argv: ["{{ slurm_install_prefix }}/bin/scontrol", reconfigure]
  changed_when: true
  when: is_controller

- name: Restart slurmd
  ansible.builtin.service:
    name: slurmd
    state: restarted
  when: is_compute
