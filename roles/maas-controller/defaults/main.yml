---
# The MAAS release series, one Launchpad PPA (ppa:maas/<series>) each, published per
# Ubuntu release: 3.8 for 26.04, 3.7 for 24.04 (the newest there), 3.5 for 22.04.
maas_series: >-
  {{ '3.8' if ansible_facts.distribution_version is version('26.04', '>=')
     else '3.7' if ansible_facts.distribution_version is version('24.04', '>=') else '3.5' }}
# Every MAAS PPA is signed by the same Launchpad key (its fingerprint from the Launchpad
# API, ~maas/+archive/ubuntu/<series>: signing_key_fingerprint). The key ships with the
# role (files/maas-ppa.asc), so no keyserver is asked; it is checked against this.
maas_ppa_key_fingerprint: "3AB6DCF1F234E78DAA9C104204E7FDC5684D4A1C"

# This role installs a single-node MAAS controller only. Multi-node
# region/rack topologies are site-owned; see docs/pxe/maas.md.
maas_single_node_install: true

# Admin accounts to create on first install. Define real credentials in
# config/group_vars; see config.example/group_vars/all.yml.
maas_adminusers: []

# URL the region controller advertises to nodes.
maas_region_controller_url: "http://{{ ansible_facts.default_ipv4.address }}:5240/MAAS"
