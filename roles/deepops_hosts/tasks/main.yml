---
# roles/deepops_hosts/tasks/main.yml -- in-tree copy of DeepOps.hosts (was the
# DeepOps/ansible-role-hosts galaxy role), with a configurable internal-subnet
# address preference in templates/etc_hosts.j2.
- name: Gather facts again
  ansible.builtin.setup:

# Every host the file lists needs its interface facts. Under --limit the others have
# none (or a stale cache), and dropping them would leave nodes unable to resolve the
# controller or the NFS server; so say which, rather than write a partial file.
- name: Require the facts of every host the file lists
  ansible.builtin.assert:
    that: hosts_missing_facts | length == 0
    fail_msg: >-
      No interface facts for {{ hosts_missing_facts | join(', ') }}: run without --limit
      (or gather their facts first), so /etc/hosts lists every host.
    quiet: true
  vars:
    hosts_missing_facts: >-
      {{ hosts_add_ansible_managed_hosts_groups | map('extract', groups) | flatten | unique
         | reject('in', hostvars | dict2items | selectattr('value.ansible_facts.interfaces', 'defined')
                        | map(attribute='key') | list) | list }}
  when: hosts_add_ansible_managed_hosts | bool and hosts_file_src | length == 0

- name: Make the directory of the hosts file's fragments
  ansible.builtin.file:
    path: "{{ hosts_fragments_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: hosts

- name: Install user-defined custom hosts file
  ansible.builtin.copy:
    src: "{{ hosts_file_src }}"
    dest: "{{ hosts_fragments_dir }}/00-deepops.hosts"
    owner: root
    group: root
    mode: "0644"
  tags: hosts
  when: hosts_file_src | length > 0

- name: Write this role's part of the hosts file
  ansible.builtin.template:
    src: etc_hosts.j2
    dest: "{{ hosts_fragments_dir }}/00-deepops.hosts"
    owner: root
    group: root
    mode: "0644"
  tags: hosts
  when: hosts_file_src | length == 0

- name: Assemble the hosts file
  ansible.builtin.include_tasks:
    file: assemble.yml
    apply:
      tags: hosts
  tags: hosts
