---
- name: Check the component state
  ansible.builtin.assert:
    that: gpu_operator_state in ['present', 'absent', 'kept']
    fail_msg: "gpu_operator_state must be present, absent or kept, not {{ gpu_operator_state }}."
    quiet: true

- name: "Make the GPU Operator {{ gpu_operator_state }}"
  ansible.builtin.include_tasks: "{{ gpu_operator_state }}.yml"
  when: gpu_operator_state != 'kept'
