---
# vGPU support
- name: Disable GPU Operator MIG Manager on NVIDIA AI Enterprise
  ansible.builtin.set_fact:
    gpu_operator_enable_migmanager: false

- name: Create namespace for GPU Operator resources
  ansible.builtin.shell: set -o pipefail && kubectl create namespace {{ gpu_operator_namespace }} -o yaml --dry-run=client | kubectl apply -f -
  changed_when: false

- name: Create local directory for gpu operator configuration
  ansible.builtin.file:
    path: "{{ gpu_operator_grid_config_dir }}"
    state: directory
    owner: "root"
    group: "root"
    mode: "0700"

- name: Add gridd.conf config file from template
  ansible.builtin.template:
    src: "gridd.conf"
    dest: "{{ gpu_operator_grid_config_dir }}/gridd.conf"
    owner: "root"
    group: "root"
    mode: "0600"

- name: Add client_configuration_token.tok token file from template
  diff: false  # the file holds a secret; --diff would print it
  ansible.builtin.template:
    src: "client_configuration_token.tok"
    dest: "{{ gpu_operator_grid_config_dir }}/client_configuration_token.tok"
    owner: "root"
    group: "root"
    mode: "0600"

- name: Create the licensing configmap (gridd.conf and NLS token)
  ansible.builtin.shell: set -o pipefail && kubectl create configmap licensing-config -n "{{ gpu_operator_namespace }}" --from-file="{{
    gpu_operator_grid_config_dir }}/gridd.conf" --from-file="{{ gpu_operator_grid_config_dir }}/client_configuration_token.tok" -o yaml --dry-run=client |
    kubectl apply -f -
  changed_when: false

# The secret is applied as a manifest on stdin, so the password is never on a command
# line (readable by every local user through ps) and needs no shell quoting.
- name: Create a docker secret for private GPU Operator containers
  change_command:
    argv: [kubectl, apply, -f, "-"]
    stdin: "{{ {'apiVersion': 'v1', 'kind': 'Secret', 'type': 'kubernetes.io/dockerconfigjson',
               'metadata': {'name': 'registry-secret', 'namespace': gpu_operator_namespace},
               'data': {'.dockerconfigjson': {'auths': {gpu_operator_driver_registry: {
                 'username': gpu_operator_registry_username, 'password': gpu_operator_registry_password,
                 'email': gpu_operator_registry_email,
                 'auth': (gpu_operator_registry_username ~ ':' ~ gpu_operator_registry_password) | b64encode}}}
                 | to_json | b64encode}} | to_json }}"
  register: gpu_operator_registry_secret
  changed_when: >-
    ansible_check_mode or ('unchanged' not in gpu_operator_registry_secret.stdout)
  no_log: true

# Installs into gpu_operator_namespace, from the NGC repository that needs the
# registry login (the helm_release role passes it on stdin, never on the command line).
# https://docs.nvidia.com/datacenter/cloud-native/gpu-operator/getting-started.html
- name: Install the NVIDIA GPU Operator (NVIDIA AI Enterprise)
  ansible.builtin.include_role:
    name: helm_release
  vars:
    helm_release:
      release: "{{ gpu_operator_release_name }}"
      namespace: "{{ gpu_operator_namespace }}"
      chart: "{{ gpu_operator_nvaie_chart_name }}"
      repo: "{{ gpu_operator_nvaie_helm_repo }}"
      repo_username: "{{ gpu_operator_registry_username }}"
      repo_password: "{{ gpu_operator_registry_password }}"
      version: "{{ gpu_operator_chart_version }}"
      helm_values:
        operator:
          imagePullSecrets: [registry-secret]
        driver:
          licensingConfig:
            configMapName: licensing-config
            nlsEnabled: "{{ gpu_operator_nvaie_nls_enabled | bool }}"
          imagePullSecrets: [registry-secret]
          repository: "{{ gpu_operator_driver_registry }}"
          version: "{{ gpu_operator_driver_version }}"
          enabled: "{{ gpu_operator_enable_driver | bool }}"
        mig:
          strategy: "{{ k8s_gpu_mig_strategy | lower }}"
        toolkit:
          enabled: "{{ gpu_operator_enable_toolkit | bool }}"
        dcgm:
          enabled: "{{ gpu_operator_enable_dcgm | bool }}"
        migManager:
          enabled: "{{ gpu_operator_enable_migmanager | bool }}"
