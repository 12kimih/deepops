---
# Builds easybuild_packages with `eb --robot` as the build account (roles/easy-build).
- name: Install the build host's compilers and system libraries (Debian family)
  become: true
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    name: [build-essential, libssl-dev, libibverbs-dev]
    state: present
  when:
    - easybuild_packages | length > 0
    - ansible_facts.os_family == "Debian"

- name: Install the build host's compilers and system libraries (RedHat family)
  become: true
  ansible.builtin.dnf:
    name: [gcc, gcc-c++, make, openssl-devel, rdma-core-devel]
    # rdma-core-devel is in CodeReady Builder: "powertools" on EL8, "crb" on EL9+.
    enablerepo: "{{ 'powertools' if ansible_facts.distribution_major_version == '8' else 'crb' }}"
    state: present
  when:
    - easybuild_packages | length > 0
    - ansible_facts.os_family == "RedHat"

# A login shell sets up Lmod (/etc/profile.d) for the module load.
- name: Build the easyconfigs and their dependencies
  become: true
  become_user: "{{ easybuild_user }}"
  ansible.builtin.command:
    argv: [bash, -l, -c, 'module load "EasyBuild/$1" && eb --robot "$2"', build, "{{ easybuild_version }}", "{{ item }}"]
    chdir: "{{ easybuild_home }}"
  loop: "{{ easybuild_packages }}"
  when: not ansible_check_mode  # a first --check has no account to become yet
  register: easybuild_build
  # eb prints this once per installation it completes, and nothing when all is built.
  changed_when: "'COMPLETED: Installation ended successfully' in easybuild_build.stdout"
