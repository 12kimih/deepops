---
- name: Install the locales package (Debian)
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    name: locales
    state: present
  when: ansible_facts.os_family == "Debian"
  tags:
    - locale

# C.UTF-8 is built in and needs no generation; a full locale (e.g. en_US.UTF-8) does.
- name: Generate the locale (Debian)
  community.general.locale_gen:
    name: "{{ locale_lang }}"
    state: present
  when:
    - ansible_facts.os_family == "Debian"
    - not locale_lang.startswith('C.')
  tags:
    - locale

- name: Install the matching glibc langpack (RHEL/Rocky)
  ansible.builtin.dnf:
    name: "glibc-langpack-{{ locale_lang.split('_')[0] | lower }}"
    state: present
  when:
    - ansible_facts.os_family == "RedHat"
    - not locale_lang.startswith('C.')
  tags:
    - locale

# The login default LANG lives in locale.conf(5), /etc/locale.conf, which PAM and
# systemd read; on Debian and Ubuntu up to 22.04 it is /etc/default/locale instead
# (since 24.04 that is a link to /etc/locale.conf, written through, never chmodded as
# a link). Takes effect on the next login.
- name: Find the locale file
  ansible.builtin.stat:
    path: /etc/default/locale
  register: locale_default_file
  tags:
    - locale

- name: Set the default LANG
  ansible.builtin.lineinfile:
    path: >-
      {{ '/etc/default/locale' if ansible_facts.os_family == 'Debian'
         and locale_default_file.stat.exists and not locale_default_file.stat.islnk
         else '/etc/locale.conf' }}
    regexp: "^LANG="
    line: "LANG={{ locale_lang }}"
    create: true
    mode: "0644"
  tags:
    - locale

- name: Install the time zone database
  ansible.builtin.package:
    name: tzdata
    state: present
  tags:
    - locale

- name: Set the time zone
  community.general.timezone:
    name: "{{ locale_timezone }}"
  tags:
    - locale
