---
- name: Find non-system users who need moving
  ansible.builtin.shell: set -o pipefail && awk '-F:' '($1!="nobody")&&($1!="{{ tmp_user }}")&&($3>=1000){print $6,$1}' /etc/passwd | grep -v "^{{
    move_home_dirs_new_root }}" | awk '{print $2}'
  args:
    executable: /bin/bash
  changed_when: false
  check_mode: false  # read-only; --check needs the result
  register: user_list

# The moves log in as a temporary user the run creates, with a key it makes: a preview
# has neither, so it names the homes that would move and stops there.
- name: Name the homes a run would move
  ansible.builtin.debug:
    msg: "Would move to {{ move_home_dirs_new_root }}: {{ user_list.stdout_lines | join(', ') }}"
  when:
    - ansible_check_mode
    - user_list.stdout | length > 0

- name: Skip if no work to do
  ansible.builtin.include_tasks: move_users.yml
  when:
    - not ansible_check_mode
    - user_list.stdout | length > 0
