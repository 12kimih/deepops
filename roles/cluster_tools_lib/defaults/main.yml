---
# cluster_tools_lib -- all of the cluster's own Python, as one package (cluster_tools):
# reading Slurm, its vocabulary, rendering, and every program built on them (sq, qos,
# the usage report). It is installed as one set, so a deploy of any role that depends on
# this one can never leave a program behind the library it imports. Roles only wire a
# program up: they list this role under meta dependencies and install its command with
# tasks_from: command, plus their own units and config.
#
# The package lives outside the interpreter's site-packages on purpose: a path there
# names the Python version, so an OS upgrade would silently drop the package from
# sys.path. Commands put this directory on sys.path themselves instead. Standard library
# only, so nothing is installed with pip (PEP 668).
#
# The same directory cluster_tools publishes its shell libraries to: one library
# directory for the cluster's tools, whichever language a library is written in.
cluster_tools_lib_dir: /usr/local/lib/cluster-tools
# The interpreter commands run under. The system Python, never a python3 found in a
# user's PATH (conda, a venv), which may be older or carry a different package.
cluster_tools_lib_python: /usr/bin/python3

# Site facts Slurm cannot know, for the cluster's commands, login banner and alerts.
# Rendered once to cluster_tools_lib_info_file and read through cluster_tools.site; a key
# left empty is left out, and every reader skips what is missing. Set the real values in
# config (they are private); derive a value from its own setting, never restate it.
cluster_info:
  name: ""  # system ID, e.g. <org>-<kind>
  docs_url: ""  # public user docs
  login_host: ""  # what users ssh to
  ssh_port: 22
# Facts derived from other settings, published with cluster_info (a key set there wins).
# Kept apart because a site's cluster_info replaces the whole dict: one listed there
# would silently go missing at every site that sets its own.
cluster_tools_lib_derived_info:
  dashboard_url: "{{ grafana_root_url }}"
  prometheus_url: "{{ prometheus_url }}"  # gpu-usage reads Prometheus here
# Where every cluster tool's configuration lives (<tool>.json), made by this role's
# main tasks, which every tool's role runs first as its meta dependency.
cluster_tools_lib_config_dir: /etc/cluster-tools
# Publish the package even though the recorded tool configs it was checked against refuse
# it (tasks/configs.yml): only to break a deadlock, then run the playbooks it named at once.
cluster_tools_lib_publish_refused: false
# cluster_tools.site.PATH reads the same file; tests/cluster-tools-lib keeps them equal.
cluster_tools_lib_info_file: "{{ cluster_tools_lib_config_dir }}/cluster.json"
