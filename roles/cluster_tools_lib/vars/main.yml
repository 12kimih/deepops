---
# Where each role records its tool's config (cluster_tools.config RECORDS).
cluster_tools_lib_config_records: "{{ cluster_tools_lib_config_dir }}/configs.d"
# cluster_tools.config's command line with the package at a given path first on sys.path
# (-I keeps PYTHONPATH and the user's site-packages out, as the commands do).
_cluster_tools_lib_config_code: >-
  import sys; sys.path.insert(0, sys.argv[1]); from cluster_tools.config import main; sys.exit(main(sys.argv[2:]))
# A role's validate for its tool's config: "{{ cluster_tools_lib_config_validate }} MODULE %s".
cluster_tools_lib_config_validate: >-
  {{ [cluster_tools_lib_python, '-I', '-c', _cluster_tools_lib_config_code, cluster_tools_lib_dir, 'check']
     | map('quote') | join(' ') }}
# The package's releases on each host (tasks/release.yml) and the tool that unpacks and
# switches them, kept beside them; the controller's built archives, named by content.
_cluster_tools_lib_releases: "{{ cluster_tools_lib_dir }}/releases"
_cluster_tools_lib_release_tool: "{{ cluster_tools_lib_dir }}/release.py"
_cluster_tools_lib_release_dir: "{{ _cluster_tools_lib_releases }}/{{ cluster_tools_lib_release.hash }}"
_cluster_tools_lib_build_dir: "{{ lookup('ansible.builtin.env', 'HOME') }}/.cache/deepops/cluster-tools"
