---
- name: Collect the clustertools modules
  ansible.builtin.set_fact:
    cluster_tools_lib_modules: "{{ query('ansible.builtin.fileglob', role_path ~ '/files/clustertools/*.py') | sort }}"

# The package is its modules, nothing else: a copy of the directory would also ship the
# controller's __pycache__, and a module dropped from the package would stay importable.
# The bytecode cache Python keeps on the host goes only when the package changed.
- name: Publish the clustertools package
  ansible.builtin.include_role:
    name: managed_dir
  vars:
    managed_dir_path: "{{ cluster_tools_lib_dir }}/clustertools"
    managed_dir_sources: "{{ cluster_tools_lib_modules }}"
    managed_dir_keep: [__pycache__]

- name: Create the site facts directory
  ansible.builtin.file:
    path: "{{ cluster_tools_lib_info_file | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# Empty values are left out, so a reader never mistakes "" for a value.
- name: Publish the site facts
  ansible.builtin.copy:
    content: "{{ cluster_info | dict2items | rejectattr('value', 'equalto', '') | items2dict | to_nice_json }}\n"
    dest: "{{ cluster_tools_lib_info_file }}"
    owner: root
    group: root
    mode: "0644"
