---
# Every package an OOD install consists of, removed together when a broken install is
# rebuilt.
open_ondemand_packages_all:
  - ondemand
  - ondemand-dex
  - ondemand-nginx
  - ondemand-passenger
  - ondemand-release-web
  - ondemand-release-web-latest
# Packages the role installs, pinned. nginx and passenger follow from ondemand's own
# version-bounded dependencies.
open_ondemand_packages:
  - "ondemand={{ open_ondemand_version }}"
  - "ondemand-dex={{ open_ondemand_dex_version }}"
  - "nodejs={{ open_ondemand_nodejs_version }}"
  - libapache2-mod-auth-openidc
# Apache modules the generated portal config and the proxied services need.
open_ondemand_apache_modules: [ssl, rewrite, headers, proxy, proxy_http, proxy_wstunnel, lua, auth_openidc]
open_ondemand_portal_generator: /opt/ood/ood-portal-generator/sbin/update_ood_portal
# The portal's top menu, beside the package's ondemand.yml.
open_ondemand_menu_file: /etc/ood/config/ondemand.d/deepops-menu.yml
# The overview page's widget (the dashboard's config root views/widgets, a partial).
open_ondemand_widget_file: /etc/ood/config/apps/dashboard/views/widgets/_cluster_overview.html.erb
# Apache's server-wide hardening, sorting after Ubuntu's conf-enabled/security.conf.
open_ondemand_apache_conf: /etc/apache2/conf-available/zz-deepops-open-ondemand.conf
# What this component installs, for its record (roles/component_record). apache2 comes
# with ondemand as a dependency and stays when the component goes (other sites may use
# it); /etc/ood and the generated Apache config go with the ondemand package's purge.
open_ondemand_items: >-
  {{ ['package:ondemand', 'package:ondemand-dex', 'package:ondemand-nginx', 'package:ondemand-passenger',
      'package:nodejs', 'package:libapache2-mod-auth-openidc',
      'file:/etc/apt/sources.list.d/ondemand-web.sources', 'file:/etc/apt/sources.list.d/nodesource.sources',
      'file:/etc/apt/keyrings/ondemand-web.asc', 'file:/etc/apt/keyrings/nodesource.asc',
      'file:{{ deepops_cache_dir }}/package-repos/ondemand-web.key', 'file:{{ deepops_cache_dir }}/package-repos/nodesource.key',
      'file:' ~ open_ondemand_tls_dir ~ '/fullchain.pem', 'file:' ~ open_ondemand_tls_dir ~ '/privkey.pem',
      'dir:' ~ open_ondemand_tls_dir, 'file:/usr/local/sbin/open-ondemand-dpkg-verify',
      'file:/etc/apache2/conf-enabled/' ~ (open_ondemand_apache_conf | basename), 'file:' ~ open_ondemand_apache_conf,
      'file:' ~ open_ondemand_menu_file, 'file:' ~ open_ondemand_widget_file]
     + (['unit:open-ondemand-tls-metrics.timer', 'unit:open-ondemand-tls-metrics.service',
         'file:/etc/systemd/system/open-ondemand-tls-metrics.timer',
         'file:/etc/systemd/system/open-ondemand-tls-metrics.service',
         'file:/usr/local/sbin/open-ondemand-tls-metrics',
         'file:' ~ open_ondemand_tls_metrics_textfile_dir ~ '/open_ondemand_tls.prom']
        if open_ondemand_tls_metrics | bool else []) }}
# Installed by OOD releases before this role (the jammy build's release package): adopted
# and removed when the component goes on a host deployed before the record existed.
open_ondemand_legacy_items:
  - package:ondemand-release-web
  - package:ondemand-release-web-latest
# The packages the per-run check verifies.
open_ondemand_verified_packages: [ondemand, ondemand-dex, ondemand-nginx, ondemand-passenger, nodejs]

# Dex's connector to the cluster's LDAP (roles/directory_defaults, docs/deepops/accounts.md;
# https://dexidp.io/docs/connectors/ldap/): StartTLS on 389 against the cluster's own CA,
# bound as the dex reader. The people tree gives the login (uid) as the email claim too:
# the portal maps that claim to the local account, and the directory has no mail. People
# who left have no password and an expired account, so their binds fail.
open_ondemand_dex_ldap_connector:
  type: ldap
  id: ldap
  name: "{{ open_ondemand_dex_ldap_name }}"
  config:
    host: "{{ ldap_server_names | first }}:389"
    startTLS: true
    rootCA: "{{ ldap_ca_file }}"
    bindDN: "{{ 'dex' | ldap_reader_dn(ldap_suffix) }}"
    bindPW: "{{ ldap_reader_passwords.dex }}"
    usernamePrompt: Username
    userSearch:
      baseDN: "ou=people,{{ ldap_suffix }}"
      filter: "(objectClass=posixAccount)"
      username: uid
      idAttr: uid
      emailAttr: uid
      nameAttr: cn
      preferredUsernameAttr: uid
    groupSearch:
      baseDN: "ou=groups,{{ ldap_suffix }}"
      filter: "(objectClass=posixGroup)"
      userMatchers:
        - userAttr: uid
          groupAttr: memberUid
      nameAttr: cn
