---
galaxy_info:
  namespace: deepops
  role_name: open_ondemand
  author: DeepOps
  description: Open OnDemand web portal for a Slurm cluster, with Dex login and TLS on one port
  license: BSD-3-Clause
  min_ansible_version: "2.17"
  platforms:
    - name: Ubuntu
      versions: [noble]
dependencies:
  - role: slurm_paths       # slurm_compute_group, slurm_install_prefix, slurm_config_dir
  - role: prometheus_paths  # node_exporter_prom_dir
  - role: directory_defaults  # the LDAP server, CA, suffix and dex reader for Dex
