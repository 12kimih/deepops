---
- name: Create the TLS directory
  ansible.builtin.file:
    path: "{{ open_ondemand_tls_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the certificate chain
  ansible.builtin.copy:
    src: "{{ open_ondemand_tls_cert_src }}"
    dest: "{{ open_ondemand_tls_dir }}/fullchain.pem"
    owner: root
    group: root
    mode: "0644"
  notify: Restart apache2

- name: Install the private key
  ansible.builtin.copy:
    src: "{{ open_ondemand_tls_key_src }}"
    dest: "{{ open_ondemand_tls_dir }}/privkey.pem"
    decrypt: true
    owner: root
    group: root
    mode: "0600"
  diff: false
  no_log: true
  notify: Restart apache2

# The portal's own Listen (listen_addr_port) is the only one: Debian's ports.conf
# would add 80 and 443.
- name: Leave Apache's other ports closed
  ansible.builtin.copy:
    dest: /etc/apache2/ports.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by DeepOps (roles/open_ondemand). Apache listens only where the Open
      # OnDemand portal config says (listen_addr_port in /etc/ood/config/ood_portal.yml).
  notify: Restart apache2

- name: Disable the stock sites
  ansible.builtin.file:
    path: "/etc/apache2/sites-enabled/{{ item }}"
    state: absent
  loop: [000-default.conf, default-ssl.conf]
  notify: Restart apache2

- name: Enable the Apache modules the portal needs
  community.general.apache2_module:
    name: "{{ item }}"
    state: present
  loop: "{{ open_ondemand_apache_modules }}"
  notify: Restart apache2

- name: Configure the portal
  ansible.builtin.template:
    src: ood_portal.yml.j2
    dest: /etc/ood/config/ood_portal.yml
    owner: root
    group: root
    mode: "0600"
  diff: false  # holds the OIDC passphrase and the LDAP bind password

- name: Configure the per-user servers
  ansible.builtin.template:
    src: nginx_stage.yml.j2
    dest: /etc/ood/config/nginx_stage.yml
    owner: root
    group: root
    mode: "0644"

- name: Find the cluster files
  find_present:
    paths: /etc/ood/config/clusters.d
    patterns: ["*.yml", "*.yaml"]
  register: open_ondemand_cluster_files

# OOD shows every file here as a cluster; only the managed one stays.
- name: Remove cluster files the role does not manage
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ open_ondemand_cluster_files.files }}"
  loop_control:
    label: "{{ item.path }}"
  when: item.path | basename != open_ondemand_cluster_name ~ '.yml'

- name: Check each proxied service keeps its path upstream
  ansible.builtin.assert:
    that: (item.upstream | urlsplit('path')) == item.path
    fail_msg: >-
      open_ondemand_proxied_services: {{ item.path }} goes to {{ item.upstream }}; the
      upstream must end in the same path ({{ item.path }}), or a service served from its
      sub path redirects every request back to it.
    quiet: true
  loop: "{{ open_ondemand_proxied_services }}"
  loop_control:
    label: "{{ item.path }}"

# The top menu (OOD merges every file in ondemand.d); per-user servers read it when
# they start.
- name: Write the portal's menu
  ansible.builtin.template:
    src: ondemand-menu.yml.j2
    dest: "{{ open_ondemand_menu_file }}"
    owner: root
    group: root
    mode: "0644"
  notify: Stop the per-user servers

- name: Describe the Slurm cluster
  ansible.builtin.template:
    src: cluster.yml.j2
    dest: "/etc/ood/config/clusters.d/{{ open_ondemand_cluster_name }}.yml"
    owner: root
    group: root
    mode: "0644"

# Apache's own pages (errors, listings) say no version or OS: Ubuntu's security.conf
# says both (ServerTokens OS, ServerSignature On). This file sorts after it in
# conf-enabled, and the last ServerTokens wins.
- name: Keep Apache's version and OS off its pages
  ansible.builtin.template:
    src: apache-hardening.conf.j2
    dest: "{{ open_ondemand_apache_conf }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart apache2

- name: Enable that Apache setting
  ansible.builtin.file:
    src: "{{ open_ondemand_apache_conf }}"
    dest: "/etc/apache2/conf-enabled/{{ open_ondemand_apache_conf | basename }}"
    state: link
  notify: Restart apache2

# ood-portal.conf is this role's: generated from the ood_portal.yml above, never edited
# by hand. The generator keeps the checksum of what it last wrote and, without --force,
# refuses a file that differs (exit 4: an earlier install's file, a hand edit), leaving
# the portal on the old one (ARA 212). Such a file is kept in the backup directory, then
# replaced.
- name: Read the portal's Apache config and the checksum the generator last wrote
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop: [/etc/apache2/sites-available/ood-portal.conf, /etc/ood/config/ood_portal.sha256sum]
  register: open_ondemand_portal_files
  failed_when: false  # either may not exist yet

- name: Keep a copy of a portal config the generator did not write
  vars:
    _conf: "{{ open_ondemand_portal_files.results[0] }}"
    _sum: "{{ open_ondemand_portal_files.results[1] }}"
  when:
    - _conf.content is defined
    # As the generator sums it: the file without its comment lines.
    - (_sum.content | default('') | b64decode | regex_search('[0-9a-f]{64}'))
      != (_conf.content | b64decode | regex_replace('(?m)^[ \t\r\f\v]*#.*(?:\n|$)', '') | hash('sha256'))
  block:
    - name: Create the backup directory for the portal config
      ansible.builtin.file:
        path: "{{ open_ondemand_backup_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Copy the portal config the generator did not write
      ansible.builtin.copy:
        src: /etc/apache2/sites-available/ood-portal.conf
        dest: "{{ open_ondemand_backup_dir }}/ood-portal.conf.foreign-{{ (_conf.content | b64decode | hash('sha256'))[:12] }}"
        remote_src: true
        owner: root
        group: root
        mode: "0600"

# Exit 3 means it changed them; anything but 0 or 3 stops the run (systemd's
# ExecStartPre ignores its failures, so a bad config would go unnoticed).
- name: Generate the Apache and Dex configuration
  change_command:
    argv: ["{{ open_ondemand_portal_generator }}", --force, --detailed-exitcodes]
  register: open_ondemand_generate
  changed_when: >-
    ansible_check_mode or (open_ondemand_generate.rc == 3)
  failed_when: >-
    not ansible_check_mode and (open_ondemand_generate.rc not in [0, 3])
  notify:
    - Restart apache2
    - Restart ondemand-dex

- name: Start the portal and Dex
  systemd_unit:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: [ondemand-dex, apache2]
