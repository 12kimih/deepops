---
# Every run: the installed OOD packages match what was shipped. Only the conffiles OOD
# rewrites may differ, and files dpkg was told not to install (path-exclude, as minimal
# images do for documentation) are not missing; any other difference (like the /opt/ood
# that once vanished while dpkg still listed the package) stops the run.
- name: Install the package check
  ansible.builtin.template:
    src: open-ondemand-dpkg-verify.j2
    dest: /usr/local/sbin/open-ondemand-dpkg-verify
    owner: root
    group: root
    mode: "0755"

- name: Verify the OOD packages' files
  ansible.builtin.command:
    argv: [/usr/local/sbin/open-ondemand-dpkg-verify]
  register: open_ondemand_verify
  changed_when: false
  failed_when: false
  check_mode: false  # read-only; --check needs the result
  when: not ansible_check_mode

- name: Check nothing else differs
  ansible.builtin.assert:
    that: open_ondemand_verify.rc == 0
    fail_msg: "Files of the OOD packages differ from the packages (dpkg -V): {{ open_ondemand_verify.stdout_lines | join('; ') }}"
    quiet: true
  when: not ansible_check_mode
