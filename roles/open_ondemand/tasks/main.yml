---
- name: Check the component state
  ansible.builtin.assert:
    that: open_ondemand_state in ['present', 'absent', 'kept']
    fail_msg: "open_ondemand_state must be present, absent or kept, not {{ open_ondemand_state }}."
    quiet: true

- name: "Make open_ondemand {{ open_ondemand_state }}"
  ansible.builtin.include_tasks: "{{ open_ondemand_state }}.yml"
  when: open_ondemand_state != 'kept'
