---
grafana_config_dir: /etc/grafana
grafana_config_template: templates/grafana.ini.j2
grafana_data_dir: /var/lib/grafana
grafana_user_id: 472
grafana_container: "grafana/grafana:13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f"
grafana_svc_name: "docker.grafana.service"
grafana_state: started
grafana_enabled: true
grafana_port: 3000
# The address Grafana listens on ("" every address). Behind a reverse proxy on the same
# host (Open OnDemand), 127.0.0.1, so the proxy is the only way in.
grafana_listen_address: ""
# Sign-in by a reverse proxy: the header carrying the user it authenticated
# (X-WEBAUTH-USER), trusted only from grafana_auth_proxy_whitelist. "" is off. When on,
# Grafana's own login form is off too; the admin password still serves the API.
grafana_auth_proxy_header: ""
grafana_auth_proxy_whitelist: 127.0.0.1

grafana_cfg_user: admin
# Enforced on every run, also on an existing database. Vault a real one per site.
grafana_cfg_pass: deepops
# Anonymous visitors can view dashboards but not edit them.
grafana_anonymous_enabled: true
grafana_anonymous_role: Viewer

grafana_cfg_dashboard_path: "{{ grafana_data_dir }}/dashboards"
grafana_dashboard_folder: Cluster
# The folder's identity: renaming grafana_dashboard_folder renames this folder in place.
grafana_dashboard_folder_uid: deepops
# Dashboards earlier deepops versions shipped under other UIDs (GPU Nodes, Node Exporter
# Full, SLURM Dashboard). Grafana keeps them as ordinary dashboards once their files are
# gone, so the role deletes them.
grafana_retired_dashboards: [syl6zhqkz, rYdddlPWk, slurm]
# Files under src/dashboards/ to provision (exporter roles may add their own).
grafana_dashboards:
  - gpu-nodes.json
  - node-exporter-hosts.json
