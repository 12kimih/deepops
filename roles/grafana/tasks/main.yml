---
- name: Check the component state
  ansible.builtin.assert:
    that: grafana_state in ['present', 'absent', 'kept']
    fail_msg: "grafana_state must be present, absent or kept, not {{ grafana_state }}."
    quiet: true

- name: "Make grafana {{ grafana_state }}"
  ansible.builtin.include_tasks: "{{ grafana_state }}.yml"
  when: grafana_state != 'kept'
