---
- name: Record what this component installs
  ansible.builtin.include_role:
    name: component_record
  vars:
    component_record_name: grafana
    component_record_action: begin
    component_record_items: "{{ grafana_items }}"

- name: Pull the image
  ansible.builtin.include_role:
    name: container_image
  vars:
    container_image: "{{ grafana_container }}"

- name: Create config dirs
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ grafana_config_dir }}"
    - "{{ grafana_config_dir }}/provisioning"
    - "{{ grafana_config_dir }}/provisioning/datasources"
    - "{{ grafana_config_dir }}/provisioning/dashboards"
    - "{{ grafana_dashboards_dir }}"

- name: Create data dirs
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ grafana_user_id }}"
    mode: "0755"
  loop:
    - "{{ grafana_data_dir }}"

# The provisioned dashboards were kept in the data directory before; they are
# configuration and live in grafana_dashboards_dir now (every role writes its own there).
- name: Remove the dashboards from the data directory
  ansible.builtin.file:
    path: "{{ grafana_data_dir }}/dashboards"
    state: absent

- name: Install datasource config
  ansible.builtin.template:
    src: prometheus-datasource.yml.j2
    dest: "{{ grafana_config_dir }}/provisioning/datasources/prometheus-datasource.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart grafana

- name: Install dashboard provider config
  ansible.builtin.template:
    src: prometheus-dashboard.yml.j2
    dest: "{{ grafana_config_dir }}/provisioning/dashboards/prometheus-dashboard.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart grafana

# Holds the admin password; the container runs as uid 472, gid 0.
- name: Install config file
  diff: false  # the file holds a secret; --diff would print it
  ansible.builtin.template:
    src: "{{ grafana_config_template }}"
    dest: "{{ grafana_config_dir }}/grafana.ini"
    owner: root
    group: root
    mode: "0640"
  notify: Restart grafana

- name: Install systemd unit file
  ansible.builtin.template:
    src: templates/docker.grafana.service.j2
    dest: "/etc/systemd/system/{{ grafana_svc_name }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart grafana

- name: Configure service
  ansible.builtin.systemd:
    name: "{{ grafana_svc_name }}"
    state: "{{ grafana_service_state }}"
    enabled: "{{ grafana_service_enabled }}"
    daemon_reload: true

- name: Apply pending restarts
  ansible.builtin.meta: flush_handlers

- name: Wait for grafana
  ansible.builtin.uri:
    url: "http://localhost:{{ grafana_port }}/api/health"
  register: grafana_health
  until: grafana_health.status == 200
  retries: 30
  delay: 2
  # Under --check nothing was started or changed, so there is nothing to wait for.
  when: grafana_service_state != "stopped" and not ansible_check_mode

# grafana.ini sets the password only when the database is first created.
- name: Check the admin password
  ansible.builtin.uri:
    url: "http://localhost:{{ grafana_port }}/api/user"
    user: "{{ grafana_cfg_user }}"
    password: "{{ grafana_cfg_pass }}"
    force_basic_auth: true
    status_code: [200, 401]
  register: grafana_login
  no_log: true
  when: grafana_service_state != "stopped" and not ansible_check_mode

# On stdin, not argv: every user on the host can read a process's arguments.
- name: Reset the admin password
  ansible.builtin.command:
    argv: [docker, exec, -i, "{{ grafana_svc_name }}", grafana, cli, admin, reset-admin-password, --password-from-stdin]
    stdin: "{{ grafana_cfg_pass }}"
  no_log: true
  changed_when: true
  when: grafana_service_state != "stopped" and (grafana_login.status | default(200)) == 401

# After the restart above: a dashboard provisioned while the old provider config was
# still loaded would land in the old folder.
- name: Install the deepops dashboards
  ansible.builtin.include_tasks: dashboards.yml
  vars:
    grafana_dashboard_set: "{{ grafana_dashboard_set_own }}"

# Provisioning never moves a dashboard to a changed folder, renames the folder or removes
# a dashboard it stopped managing; this converges those (see the script).
- name: Reconcile dashboards and folders
  ansible.builtin.script:
    cmd: >-
      grafana_reconcile.py
      --url http://localhost:{{ grafana_port }}
      --ini {{ (grafana_config_dir ~ '/grafana.ini') | quote }}
      --folder-uid {{ grafana_dashboard_folder_uid | quote }}
      --folder-title {{ grafana_dashboard_folder | quote }}
      --dashboards-path {{ grafana_dashboards_dir | quote }}
      --retire {{ grafana_retired_dashboards | map('quote') | join(' ') }}
      {{ '--check' if ansible_check_mode else '' }}
    executable: python3
  check_mode: false  # the script reports instead of acting under --check
  register: grafana_reconcile
  # A failed run's stderr is the failure; only a run that worked reports what it did.
  changed_when: grafana_reconcile.rc == 0 and (grafana_reconcile.stdout | from_json).changed and not ansible_check_mode
  when: grafana_service_state != "stopped"

- name: Show reconcile actions
  ansible.builtin.debug:
    var: (grafana_reconcile.stdout | from_json).actions
  when: grafana_reconcile is changed or (ansible_check_mode and grafana_reconcile.rc | default(1) == 0)

- name: Record the component as present
  ansible.builtin.include_role:
    name: component_record
  vars:
    component_record_name: grafana
    component_record_action: present
    component_record_items: "{{ grafana_items }}"
    component_record_version: "{{ grafana_container | regex_replace('@.*', '') }}"
