---
# What this component installs, for its record (roles/component_record): the files
# publish.yml writes under fixed names, and the manifests of the commands and libraries
# it publishes under the site's names (removed through those manifests, recorded_files).
cluster_tools_items:
  - "file:/etc/profile.d/{{ cluster_tools_profile_name }}.sh"
  - "file:/etc/profile.d/{{ cluster_tools_profile_name }}.csh"
  - "file:{{ cluster_tools_motd_dir }}/{{ cluster_tools_motd_file }}"
  - "file:{{ cluster_tools_user_slice_dir }}/{{ cluster_tools_user_slice_file }}"
  - "dir:{{ cluster_tools_user_slice_dir }}"
  - "file:{{ cluster_tools_manifest }}"
  - "file:{{ cluster_tools_lib_manifest }}"

# The users' environment entries a login gets (a job-only one is the task prolog's).
cluster_tools_profile_entries: "{{ user_environment_entries | rejectattr('login', 'equalto', '') | list }}"
