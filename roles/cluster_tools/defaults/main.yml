---
# cluster_tools -- publish the site's own commands, shell defaults and login banner.
# Opt-in: every setting below is empty, so the role is a no-op until config fills it in.
#
# Commands are installed into PATH as executables rather than declared as aliases in
# /etc/bash.bashrc. An alias exists only inside an interactive bash, so the same name
# behaves differently in a job script, over `ssh <node> <cmd>`, and under a non-bash
# login shell -- and /etc/bash.bashrc belongs to the bash package, so local edits there
# collide with every upgrade.
cluster_tools_bin_dir: /usr/local/bin

# Commands to publish: a list of {src, dest}. src is copied VERBATIM -- shell scripts
# routinely contain sequences Jinja would eat, `${#var}` opening a comment among them --
# so anything site-specific belongs in cluster_tools_environment, not in a template.
# dest is a bare command NAME (no extension) under cluster_tools_bin_dir; a name that
# already resolves elsewhere in PATH is refused rather than left to shadow it.
cluster_tools_scripts: []

# Environment published through /etc/profile.d. This is where a tool's own default
# belongs (SINFO_FORMAT, SQUEUE_FORMAT, ...): unlike an alias, the environment is
# inherited by job scripts and remote commands, so the output is the same everywhere.
# Each entry is a default -- a value the session already carries wins. Emptying it
# removes the file.
cluster_tools_environment: {}
cluster_tools_profile_file: z10-cluster-tools.sh

# Login banner: a title, the commands people should know about, and where to find
# things. Installed as an update-motd.d fragment so it prints once per login instead
# of on every interactive shell, and for every login shell rather than bash only. An
# empty title removes the fragment. Debian/Ubuntu mechanism -- a node without
# update-motd.d is skipped.
#
# Both lists take {name, text}. Keep each text to one short line: this is read at
# every login, and the detail belongs behind one of the commands it lists.
cluster_tools_motd_title: ""
cluster_tools_motd_commands: []
cluster_tools_motd_links: []

# Catppuccin flavour for the banner -- mocha, macchiato, frappe or latte, the same
# flavours sq ships with. Emitted as 24-bit colour; turn the colour off for a terminal
# that cannot render it.
cluster_tools_motd_flavour: mocha
cluster_tools_motd_color: true

# Directories published verbatim onto a shared filesystem -- worked examples, the
# usage docs, anything users read or copy from. A list of {src, dest}. Set it on the
# ONE host that owns the share, so a single node writes it instead of every node
# writing the same NFS path. Nothing is deleted from a destination: it also holds
# files this role did not put there.
cluster_tools_shared_dirs: []
cluster_tools_motd_dir: /etc/update-motd.d
cluster_tools_motd_file: 20-cluster-tools

# Per-user resource limits, written as a drop-in on systemd's user-.slice so they apply
# to every login session. Set it on the LOGIN nodes only: a shell that a user opens on
# a compute node is normally adopted into their job's cgroup, so a limit here would
# either do nothing or fight the job's own accounting.
#
# Keys are [Slice] directives (CPUQuota, MemoryMax, TasksMax, ...); see systemd.resource-control(5).
# Emptying it removes the drop-in, so a node dropped from the config is cleaned up.
cluster_tools_user_slice_limits: {}
cluster_tools_user_slice_dir: /etc/systemd/system/user-.slice.d
cluster_tools_user_slice_file: 50-limits.conf
