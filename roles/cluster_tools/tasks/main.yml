---
# Libraries first: a command must never reach a node ahead of what it sources.
- name: Create the cluster library directory
  ansible.builtin.file:
    path: "{{ cluster_tools_lib_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: cluster_tools_libs | length > 0

- name: Publish the cluster libraries
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ cluster_tools_lib_dir }}/{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ cluster_tools_libs }}"
  loop_control:
    label: "{{ cluster_tools_lib_dir }}/{{ item.dest }}"

- name: Assert the built-in commands are known and not also site scripts
  ansible.builtin.assert:
    that:
      - cluster_tools_commands | difference(cluster_tools_builtin) | length == 0
      - cluster_tools_commands | intersect(cluster_tools_scripts | map(attribute='dest')) | length == 0
    fail_msg: >-
      cluster_tools_commands takes names from {{ cluster_tools_builtin }}, each published
      once: {{ cluster_tools_commands | intersect(cluster_tools_scripts | map(attribute='dest')) }}
      is also in cluster_tools_scripts.

- name: Publish the built-in command modules
  ansible.builtin.copy:
    src: "{{ item }}.py"
    dest: "{{ cluster_tools_lib_dir }}/{{ item }}.py"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ cluster_tools_commands }}"

- name: Publish the built-in commands
  ansible.builtin.include_role:
    name: cluster_tools_lib
    tasks_from: command
  vars:
    cluster_tools_lib_command:
      dest: "{{ cluster_tools_bin_dir }}/{{ item }}"
      module: "{{ item }}"
  loop: "{{ cluster_tools_commands }}"

# bash-completion loads this on the first <TAB> after the command, and the command
# describes its own options, so the completion never lags behind an upgrade. A host
# without bash-completion has no such directory and gets none.
- name: Check for bash-completion
  ansible.builtin.stat:
    path: "{{ cluster_tools_completion_dir }}"
  register: cluster_tools_completion_dir_stat

- name: Publish bash completion for the built-in commands
  ansible.builtin.copy:
    content: |
      # Generated by the command itself: {{ item }} --completion bash
      eval "$({{ cluster_tools_bin_dir }}/{{ item }} --completion bash 2>/dev/null)"
    dest: "{{ cluster_tools_completion_dir }}/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ cluster_tools_commands }}"
  when: cluster_tools_completion_dir_stat.stat.isdir | default(false)

# A name a site script now publishes is left alone: that file is the script's.
- name: Remove built-in commands no longer published
  ansible.builtin.file:
    path: >-
      {{ {'command': cluster_tools_bin_dir ~ '/' ~ item.0,
          'completion': cluster_tools_completion_dir ~ '/' ~ item.0,
          'module': cluster_tools_lib_dir ~ '/' ~ item.0 ~ '.py'}[item.1] }}
    state: absent
  loop: >-
    {{ cluster_tools_builtin | difference(cluster_tools_commands)
       | difference(cluster_tools_scripts | map(attribute='dest'))
       | product(['command', 'completion', 'module']) | list }}
  loop_control:
    label: "{{ item.0 }} {{ item.1 }}"

# A published name that also resolves elsewhere in PATH would shadow the real command
# for every user, as an `alias squeue=/path/to/squeue.sh` does. Catch it
# here instead of at someone's prompt.
- name: Look for existing commands the published names would shadow
  ansible.builtin.shell:
    cmd: "type -aP {{ item.dest | quote }} | grep -v '^{{ cluster_tools_bin_dir }}/' || true"
    executable: /bin/bash
  loop: "{{ cluster_tools_scripts }}"
  register: cluster_tools_shadowed
  changed_when: false
  check_mode: false
  loop_control:
    label: "{{ item.dest }}"

- name: Assert no published command shadows an existing one
  ansible.builtin.assert:
    that:
      - (item.stdout | trim | length) == 0
    fail_msg: >-
      '{{ item.item.dest }}' already resolves to {{ item.stdout_lines | join(', ') }}
      on {{ inventory_hostname }}. Publishing it under {{ cluster_tools_bin_dir }}
      would shadow that command for every user -- give it a distinct name.
  loop: "{{ cluster_tools_shadowed.results | default([]) }}"
  loop_control:
    label: "{{ item.item.dest }}"

- name: Publish the cluster commands
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ cluster_tools_bin_dir }}/{{ item.dest }}"
    owner: root
    group: root
    mode: "0755"
  loop: "{{ cluster_tools_scripts }}"
  loop_control:
    label: "{{ cluster_tools_bin_dir }}/{{ item.dest }}"

- name: Publish the shell environment defaults
  ansible.builtin.template:
    src: profile.sh.j2
    dest: "/etc/profile.d/{{ cluster_tools_profile_file }}"
    owner: root
    group: root
    mode: "0644"
  when: cluster_tools_environment | length > 0

- name: Remove the shell environment defaults
  ansible.builtin.file:
    path: "/etc/profile.d/{{ cluster_tools_profile_file }}"
    state: absent
  when: cluster_tools_environment | length == 0

- name: Publish the shared directories
  ansible.builtin.copy:
    src: "{{ item.src }}/"
    dest: "{{ item.dest }}/"
    owner: root
    group: root
    mode: "0644"
    directory_mode: "0755"
  loop: "{{ cluster_tools_shared_dirs }}"
  loop_control:
    label: "{{ item.dest }}"

- name: Check for update-motd.d
  ansible.builtin.stat:
    path: "{{ cluster_tools_motd_dir }}"
  register: cluster_tools_motd_dir_stat

- name: Configure the login banner
  when: cluster_tools_motd_dir_stat.stat.isdir | default(false)
  block:
    - name: Publish the login banner
      ansible.builtin.template:
        src: motd.j2
        dest: "{{ cluster_tools_motd_dir }}/{{ cluster_tools_motd_file }}"
        owner: root
        group: root
        mode: "0755"
      when: (cluster_tools_motd_title | trim | length) > 0

    - name: Remove the login banner
      ansible.builtin.file:
        path: "{{ cluster_tools_motd_dir }}/{{ cluster_tools_motd_file }}"
        state: absent
      when: (cluster_tools_motd_title | trim | length) == 0

- name: Check for Ubuntu motd-news
  ansible.builtin.stat:
    path: /etc/default/motd-news
  register: cluster_tools_motd_news_stat

- name: Configure Ubuntu motd-news
  when: cluster_tools_motd_news_stat.stat.exists
  block:
    - name: Set whether the banner fragment shows motd-news
      ansible.builtin.lineinfile:
        path: /etc/default/motd-news
        regexp: "^ENABLED="
        line: "ENABLED={{ 1 if cluster_tools_motd_news else 0 }}"

    - name: Stop and mask the motd-news units
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: stopped
        enabled: false
        masked: true
      loop: [motd-news.timer, motd-news.service]
      when: not cluster_tools_motd_news

    # Masking leaves a unit's last failure on record, and the failure is what alerts.
    - name: Clear a failed motd-news run
      ansible.builtin.command: systemctl reset-failed motd-news.service
      changed_when: false
      failed_when: false
      when: not cluster_tools_motd_news

    - name: Restore the motd-news units
      ansible.builtin.systemd_service:
        name: "{{ item.name }}"
        masked: false
        enabled: "{{ item.enabled | default(omit) }}"
        state: "{{ item.state | default(omit) }}"
      loop:
        - { name: motd-news.service }
        - { name: motd-news.timer, enabled: true, state: started }
      loop_control:
        label: "{{ item.name }}"
      when: cluster_tools_motd_news

# systemd re-applies a slice's resource-control properties on daemon-reload, so a
# changed limit reaches sessions that are already open.
- name: Create the user slice drop-in directory
  ansible.builtin.file:
    path: "{{ cluster_tools_user_slice_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: cluster_tools_user_slice_limits | length > 0

- name: Publish the per-user resource limits
  ansible.builtin.template:
    src: user-slice-limits.conf.j2
    dest: "{{ cluster_tools_user_slice_dir }}/{{ cluster_tools_user_slice_file }}"
    owner: root
    group: root
    mode: "0644"
  when: cluster_tools_user_slice_limits | length > 0
  notify: Reload systemd

- name: Remove the per-user resource limits
  ansible.builtin.file:
    path: "{{ cluster_tools_user_slice_dir }}/{{ cluster_tools_user_slice_file }}"
    state: absent
  when: cluster_tools_user_slice_limits | length == 0
  notify: Reload systemd
