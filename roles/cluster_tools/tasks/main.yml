---
- name: Check the component state
  ansible.builtin.assert:
    that: cluster_tools_state in ['present', 'absent', 'kept']
    fail_msg: "cluster_tools_state must be present, absent or kept, not {{ cluster_tools_state }}."
    quiet: true

- name: "Make cluster_tools {{ cluster_tools_state }}"
  ansible.builtin.include_tasks: "{{ cluster_tools_state }}.yml"
  when: cluster_tools_state != 'kept'
