---
# Libraries first: a command must never reach a node ahead of what it sources. Their
# directory is cluster_tools_lib's (a dependency of this role), created there.
- name: Publish the cluster libraries
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ cluster_tools_lib_dir }}/{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ cluster_tools_libs }}"
  loop_control:
    label: "{{ cluster_tools_lib_dir }}/{{ item.dest }}"

# Recorded, so a library dropped from the config leaves the hosts.
- name: Remove libraries no longer published
  ansible.builtin.include_role:
    name: recorded_files
  vars:
    recorded_files_record: "{{ cluster_tools_lib_manifest }}"
    recorded_files_names: "{{ cluster_tools_libs | map(attribute='dest') | list }}"
    recorded_files_dirs: ["{{ cluster_tools_lib_dir }}"]
    recorded_files_retired: "{{ cluster_tools_retired_libs }}"

- name: Assert the built-in commands are known and not also site scripts
  ansible.builtin.assert:
    that:
      - cluster_tools_commands | difference(cluster_tools_builtin) | length == 0
      - cluster_tools_commands | intersect(cluster_tools_scripts | map(attribute='dest')) | length == 0
    fail_msg: >-
      cluster_tools_commands takes names from {{ cluster_tools_builtin }}, each published
      once: {{ cluster_tools_commands | intersect(cluster_tools_scripts | map(attribute='dest')) }}
      is also in cluster_tools_scripts.

- name: Publish the built-in commands
  ansible.builtin.include_role:
    name: cluster_tools_lib
    tasks_from: command
  vars:
    cluster_tools_lib_command:
      dest: "{{ cluster_tools_bin_dir }}/{{ item }}"
      module: "clustertools.{{ item }}"
  loop: "{{ cluster_tools_commands }}"

# bash-completion loads this on the first <TAB> after the command, and the command
# describes its own options, so the completion never lags behind an upgrade. A host
# without bash-completion has no such directory and gets none.
- name: Check for bash-completion
  ansible.builtin.stat:
    path: "{{ cluster_tools_completion_dir }}"
  register: cluster_tools_completion_dir_stat

- name: Publish bash completion for the built-in commands
  ansible.builtin.copy:
    content: |
      # Generated by the command itself: {{ item }} --completion bash
      eval "$({{ cluster_tools_bin_dir }}/{{ item }} --completion bash 2>/dev/null)"
    dest: "{{ cluster_tools_completion_dir }}/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ cluster_tools_commands }}"
  when: cluster_tools_completion_dir_stat.stat.isdir | default(false)

# The role records what it published, so a command dropped from the config leaves the
# hosts on the next run, as every other setting here does. Only names in that record, or
# named in cluster_tools_retired (published before the record existed), are removed:
# the command and its completion.
- name: Remove commands no longer published
  ansible.builtin.include_role:
    name: recorded_files
  vars:
    recorded_files_record: "{{ cluster_tools_manifest }}"
    recorded_files_names: "{{ cluster_tools_scripts | map(attribute='dest') | list + cluster_tools_commands }}"
    recorded_files_dirs: ["{{ cluster_tools_bin_dir }}", "{{ cluster_tools_completion_dir }}"]
    recorded_files_retired: "{{ cluster_tools_retired }}"

# A published name that also resolves elsewhere in PATH would shadow the real command
# for every user, as an `alias squeue=/path/to/squeue.sh` does. Catch it
# here instead of at someone's prompt.
- name: Look for existing commands the published names would shadow
  ansible.builtin.shell:
    cmd: "type -aP {{ item.dest | quote }} | grep -v '^{{ cluster_tools_bin_dir }}/' || true"
    executable: /bin/bash
  loop: "{{ cluster_tools_scripts }}"
  register: cluster_tools_shadowed
  changed_when: false
  check_mode: false
  loop_control:
    label: "{{ item.dest }}"

- name: Assert no published command shadows an existing one
  ansible.builtin.assert:
    that:
      - (item.stdout | trim | length) == 0
    fail_msg: >-
      '{{ item.item.dest }}' already resolves to {{ item.stdout_lines | join(', ') }}
      on {{ inventory_hostname }}. Publishing it under {{ cluster_tools_bin_dir }}
      would shadow that command for every user -- give it a distinct name.
  loop: "{{ cluster_tools_shadowed.results | default([]) }}"
  loop_control:
    label: "{{ item.item.dest }}"

- name: Publish the cluster commands
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ cluster_tools_bin_dir }}/{{ item.dest }}"
    owner: root
    group: root
    mode: "0755"
  loop: "{{ cluster_tools_scripts }}"
  loop_control:
    label: "{{ cluster_tools_bin_dir }}/{{ item.dest }}"

- name: Publish the shell environment defaults
  ansible.builtin.template:
    src: profile.sh.j2
    dest: "/etc/profile.d/{{ cluster_tools_profile_file }}"
    owner: root
    group: root
    mode: "0644"
  when: cluster_tools_environment | length > 0

- name: Remove the shell environment defaults
  ansible.builtin.file:
    path: "/etc/profile.d/{{ cluster_tools_profile_file }}"
    state: absent
  when: cluster_tools_environment | length == 0

# Each file keeps its mode from the source, so an example job script stays runnable;
# a fixed 0644 took the execute bit off every one.
- name: Publish the shared directories
  ansible.builtin.copy:
    src: "{{ item.src }}/"
    dest: "{{ item.dest }}/"
    owner: root
    group: root
    mode: preserve
    directory_mode: "0755"
  loop: "{{ cluster_tools_shared_dirs }}"
  loop_control:
    label: "{{ item.dest }}"

- name: Check for update-motd.d
  ansible.builtin.stat:
    path: "{{ cluster_tools_motd_dir }}"
  register: cluster_tools_motd_dir_stat

- name: Configure the login banner
  when: cluster_tools_motd_dir_stat.stat.isdir | default(false)
  block:
    # Drawn here, with the shared library and its palette, so a login only prints text.
    - name: Draw the login banner
      ansible.builtin.command:
        argv:
          - "{{ cluster_tools_lib_python }}"
          - -I
          - -c
          - "import sys; sys.path.insert(0, sys.argv[1]); from clustertools.banner import main; sys.exit(main())"
          - "{{ cluster_tools_lib_dir }}"
        stdin: >-
          {{ {'title': cluster_tools_motd_title, 'commands': cluster_tools_motd_commands,
              'links': cluster_tools_motd_links, 'flavour': cluster_tools_motd_flavour,
              'color': cluster_tools_motd_color | bool} | to_json }}
      register: cluster_tools_banner
      changed_when: false
      check_mode: false
      when: (cluster_tools_motd_title | trim | length) > 0

    - name: Publish the login banner
      ansible.builtin.copy:
        content: "{{ cluster_tools_banner.stdout }}\n"
        dest: "{{ cluster_tools_motd_dir }}/{{ cluster_tools_motd_file }}"
        owner: root
        group: root
        mode: "0755"
      when: (cluster_tools_motd_title | trim | length) > 0

    - name: Remove the login banner
      ansible.builtin.file:
        path: "{{ cluster_tools_motd_dir }}/{{ cluster_tools_motd_file }}"
        state: absent
      when: (cluster_tools_motd_title | trim | length) == 0

# The units decide whether motd-news runs; /etc/default/motd-news only feeds the banner
# fragment and is missing on some installs that still carry the units. So the units are
# looked for themselves, and the file is set only where it exists.
- name: Check for Ubuntu motd-news units
  ansible.builtin.command: systemctl list-unit-files --no-legend motd-news.timer motd-news.service
  register: cluster_tools_motd_news_units
  changed_when: false
  failed_when: false
  check_mode: false

- name: Check for the motd-news banner setting
  ansible.builtin.stat:
    path: /etc/default/motd-news
  register: cluster_tools_motd_news_stat

- name: Configure Ubuntu motd-news
  when: cluster_tools_motd_news_units.stdout | trim | length > 0 or cluster_tools_motd_news_stat.stat.exists
  vars:
    _cluster_tools_motd_news_units: [motd-news.timer, motd-news.service]
  block:
    - name: Set whether the banner fragment shows motd-news
      ansible.builtin.lineinfile:
        path: /etc/default/motd-news
        regexp: "^ENABLED="
        line: "ENABLED={{ 1 if cluster_tools_motd_news else 0 }}"
      when: cluster_tools_motd_news_stat.stat.exists

    - name: Stop and mask the motd-news units
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: stopped
        enabled: false
        masked: true
      loop: "{{ _cluster_tools_motd_news_units }}"
      when: not cluster_tools_motd_news

    # Masking leaves a unit's last failure on record, and the failure is what alerts.
    # Both units: the timer is left failed by the run it triggered.
    - name: Clear a failed motd-news run
      ansible.builtin.command: "systemctl reset-failed {{ _cluster_tools_motd_news_units | join(' ') }}"
      changed_when: false
      failed_when: false
      when: not cluster_tools_motd_news

    - name: Restore the motd-news units
      ansible.builtin.systemd_service:
        name: "{{ item.name }}"
        masked: false
        enabled: "{{ item.enabled | default(omit) }}"
        state: "{{ item.state | default(omit) }}"
      loop:
        - { name: motd-news.service }
        - { name: motd-news.timer, enabled: true, state: started }
      loop_control:
        label: "{{ item.name }}"
      when: cluster_tools_motd_news

# systemd re-applies a slice's resource-control properties on daemon-reload, so a
# changed limit reaches sessions that are already open.
- name: Create the user slice drop-in directory
  ansible.builtin.file:
    path: "{{ cluster_tools_user_slice_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: cluster_tools_user_slice_limits | length > 0

- name: Publish the per-user resource limits
  ansible.builtin.template:
    src: user-slice-limits.conf.j2
    dest: "{{ cluster_tools_user_slice_dir }}/{{ cluster_tools_user_slice_file }}"
    owner: root
    group: root
    mode: "0644"
  when: cluster_tools_user_slice_limits | length > 0
  notify: Reload systemd

- name: Remove the per-user resource limits
  ansible.builtin.file:
    path: "{{ cluster_tools_user_slice_dir }}/{{ cluster_tools_user_slice_file }}"
    state: absent
  when: cluster_tools_user_slice_limits | length == 0
  notify: Reload systemd

# cron's PAM stack has no pam_systemd, so a cron job runs in cron.service, outside
# every user's slice and its limits: a server started from @reboot ran unlimited
# there. With pam_systemd, each job gets a session in its owner's slice, like a login.
- name: Put cron jobs under their owner's slice and limits
  ansible.builtin.lineinfile:
    path: /etc/pam.d/cron
    regexp: '^session\s+optional\s+pam_systemd\.so'
    line: "session    optional   pam_systemd.so"
    insertafter: "^@include common-session-noninteractive"
    state: "{{ 'present' if cluster_tools_user_slice_limits | length > 0 else 'absent' }}"
  when: ansible_facts.os_family == 'Debian'
