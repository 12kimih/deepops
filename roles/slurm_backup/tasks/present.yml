---
- name: Record what this component installs
  ansible.builtin.include_role:
    name: component_record
  vars:
    component_record_name: slurm_backup
    component_record_action: begin
    component_record_items: "{{ slurm_backup_items }}"

# The program is clustertools.slurm_backup, shipped with the library it imports.
- name: Install the backup command
  ansible.builtin.include_role:
    name: cluster_tools_lib
    tasks_from: command
  vars:
    cluster_tools_lib_command:
      dest: "{{ slurm_backup_script }}"
      module: clustertools.slurm_backup

# A destination on an NFS export with root_squash cannot be created by this host's
# root, so its directory is made on the export's server, owned by the writer.
- name: Create each destination directory
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.owner | default('root') }}"
    mode: "0700"
  delegate_to: "{{ item.prepare_host | default(inventory_hostname) }}"
  loop: "{{ slurm_backup_destinations }}"
  loop_control:
    label: "{{ item.path }}"

# The kept metrics moved under the shared keep directory (roles/textfile_keep): the
# copy versions before kept in the work directory carries the last successes over.
- name: Move the kept metrics to the shared keep directory
  change_command:
    argv: [sh, -c, 'mkdir -p -- "$(dirname "$2")" && mv -n -- "$1" "$2"', move, "{{ slurm_backup_metrics_file_before }}", "{{ slurm_backup_metrics_file }}"]
    removes: "{{ slurm_backup_metrics_file_before }}"
  when: slurm_backup_metrics_file_before != slurm_backup_metrics_file

# The program's own check refuses what it could not run (a keep count below 1
# would delete the set just written), so the deploy fails, not the 3 a.m. run.
- name: Write the backup configuration
  ansible.builtin.copy:
    dest: "{{ slurm_backup_config }}"
    owner: root
    group: root
    mode: "0600"
    content: "{{ {'database': slurm_backup_database, 'state_dir': slurm_state_save_location,
                  'munge_key': slurm_backup_munge_key, 'weekly_day': slurm_backup_weekly_day,
                  'textfile_dir': slurm_backup_textfile_dir, 'textfile': slurm_backup_textfile,
                  'work_dir': slurm_backup_work_dir, 'metrics_file': slurm_backup_metrics_file,
                  'step_timeout': slurm_backup_step_timeout,
                  'destinations': slurm_backup_destinations} | to_nice_json }}\n"
    validate: "{{ cluster_tools_lib_config_validate }} clustertools.slurm_backup %s"
  register: slurm_backup_config_written

- name: Record the slurm backup configuration
  ansible.builtin.include_role:
    name: cluster_tools_lib
    tasks_from: config
  vars:
    cluster_tools_lib_config: {role: slurm_backup, module: clustertools.slurm_backup, file: "{{ slurm_backup_config }}", playbook: playbooks/slurm-cluster/slurm-backup.yml}

- name: Install the backup service
  ansible.builtin.template:
    src: slurm-backup@.service.j2
    dest: /etc/systemd/system/slurm-backup@.service
    mode: "0644"

- name: Install the backup and restore-test timers
  ansible.builtin.template:
    src: slurm-backup.timer.j2
    dest: "/etc/systemd/system/slurm-backup-{{ item.command }}.timer"
    mode: "0644"
  loop: "{{ slurm_backup_timers }}"
  loop_control:
    label: "{{ item.command }}"

# The textfile directory is a tmpfs: the kept metrics go back at every boot (one
# mechanism for every writer), so the series never go absent until the next backup.
- name: Restore the kept metrics at every boot
  ansible.builtin.include_role:
    name: textfile_keep
    tasks_from: restore
  vars:
    textfile_keep_name: "{{ slurm_backup_keep_name }}"

# Published when the destinations may have changed, so each configured one is known
# before its first backup (and a removed one's series go).
- name: Look for the kept metrics
  ansible.builtin.stat:
    path: "{{ slurm_backup_metrics_file }}"
    get_checksum: false
  register: slurm_backup_kept

- name: Publish the metrics for the configured destinations
  change_command:
    argv: ["{{ slurm_backup_script }}", publish, "{{ slurm_backup_config }}"]
  when: slurm_backup_config_written is changed or not slurm_backup_kept.stat.exists

- name: Enable the timers
  systemd_unit:
    name: "slurm-backup-{{ item.command }}.timer"
    enabled: true
    state: started
    daemon_reload: true
  loop: "{{ slurm_backup_timers }}"
  loop_control:
    label: "{{ item.command }}"

- name: Record the component as present
  ansible.builtin.include_role:
    name: component_record
  vars:
    component_record_name: slurm_backup
    component_record_action: present
    component_record_items: "{{ slurm_backup_items }}"
