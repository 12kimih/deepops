---
- name: Check the component state
  ansible.builtin.assert:
    that: slurm_backup_state in ['present', 'absent', 'kept']
    fail_msg: "slurm_backup_state must be present, absent or kept, not {{ slurm_backup_state }}."
    quiet: true

# Without a destination there is nothing to back up to: nothing of it stays installed.
- name: "Make slurm_backup {{ slurm_backup_state if slurm_backup_destinations | length > 0 else 'absent (no destinations)' }}"
  ansible.builtin.include_tasks: "{{ slurm_backup_state if slurm_backup_destinations | length > 0 else 'absent' }}.yml"
  when: slurm_backup_state != 'kept'
