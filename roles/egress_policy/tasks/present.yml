---
- name: Record what this component installs
  ansible.builtin.include_role:
    name: component_record
  vars:
    component_record_name: egress_policy
    component_record_action: begin
    component_record_items: "{{ egress_policy_items }}"

# Without the internal networks every job's traffic between nodes would be limited.
- name: Check the egress policy settings
  ansible.builtin.assert:
    that:
      - cluster_networks | length > 0
      - cluster_networks | networks_invalid | length == 0
      - egress_policy_restricted_uids | reject('match', '^[0-9]+(-[0-9]+)?$') | list | length == 0
      - egress_policy_exempt_uids | map('string') | reject('match', '^[0-9]+$') | list | length == 0
      - (egress_policy_allowed_tcp_ports + egress_policy_allowed_udp_ports + egress_policy_ssh_ports)
        | map('string') | reject('match', '^[0-9]+(-[0-9]+)?$') | list | length == 0
      - ([egress_policy_ssh_rate, egress_policy_ssh_node_rate, egress_policy_log_rate]
         | reject('match', '^[0-9]+/(second|minute|hour|day)$') | list | length == 0)
    fail_msg: >-
      cluster_networks must list the cluster's networks as CIDRs
      (invalid: {{ cluster_networks | networks_invalid }}); uids are
      numbers or "A-B", ports numbers or "A-B", rates N/second|minute|hour|day.

# Users' DNS may only go to a resolver on loopback: with another one first in
# resolv.conf they would have none.
- name: Read the resolvers this host uses
  ansible.builtin.slurp:
    src: /etc/resolv.conf
  register: egress_policy_resolv
  when: egress_policy_dns_local_only

- name: Refuse local-only DNS without a local resolver
  vars:
    egress_policy_nameservers: >-
      {{ egress_policy_resolv.content | b64decode | regex_findall('(?m)^\s*nameserver\s+(\S+)') }}
  ansible.builtin.assert:
    that:
      - egress_policy_nameservers | length > 0
      - egress_policy_nameservers[0] is match('127\\.|::1$')
    fail_msg: >-
      /etc/resolv.conf names {{ egress_policy_nameservers | join(', ') or 'no resolver' }}
      first, so users, who may send DNS only to this host's own resolver, would have
      none. Deploy roles/dns_resolver (slurm_enable_dns_resolver) first, or set
      egress_policy_dns_local_only: false.
  when: egress_policy_dns_local_only

- name: Render the ruleset
  ansible.builtin.set_fact:
    egress_policy_ruleset: "{{ lookup('ansible.builtin.template', 'egress-policy.nft.j2') }}"

- name: Install and load the egress policy table
  ansible.builtin.include_role:
    name: nft_table
  vars:
    nft_table_name: egress_policy
    nft_table_ruleset: "{{ egress_policy_ruleset }}"
    nft_table_description: Egress policy nftables table

- name: Install the client SSH settings
  ansible.builtin.template:
    src: ssh_config.conf.j2
    dest: "{{ egress_policy_ssh_client_file }}"
    owner: root
    group: root
    mode: "0644"
    validate: ssh -G -F %s egress-policy.invalid

- name: Publish listeners and tunnels as metrics
  when: egress_policy_metrics
  block:
    - name: Install the metrics command
      ansible.builtin.include_role:
        name: cluster_tools_lib
        tasks_from: command
      vars:
        cluster_tools_lib_command:
          dest: "{{ _egress_policy_metrics_command }}"
          module: cluster_tools.egress_metrics

    - name: Write the metrics configuration
      ansible.builtin.copy:
        dest: "{{ _egress_policy_metrics_config }}"
        owner: root
        group: root
        mode: "0644"
        content: "{{ {'table': 'egress_policy', 'inbound_table': 'ingress_policy', 'user_uids': egress_policy_restricted_uids,
                      'tunnel_programs': egress_policy_tunnel_programs} | to_nice_json }}\n"
        validate: "{{ cluster_tools_lib_config_validate }} cluster_tools.egress_metrics %s"

    - name: Record the egress policy configuration
      ansible.builtin.include_role:
        name: cluster_tools_lib
        tasks_from: config
      vars:
        cluster_tools_lib_config: {role: egress_policy, module: cluster_tools.egress_metrics, file: "{{ _egress_policy_metrics_config }}", playbook: playbooks/generic/egress-policy.yml}

    - name: Install the metrics units
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ _egress_policy_metrics_units }}"
      register: egress_policy_metrics_units

    - name: Enable the metrics timer
      systemd_unit:
        name: egress-policy-metrics.timer
        enabled: true
        state: "{{ 'restarted' if egress_policy_metrics_units is changed else 'started' }}"
        daemon_reload: true

# With the metrics off they are not in egress_policy_items, so the record removes them.
- name: Record the component as present
  ansible.builtin.include_role:
    name: component_record
  vars:
    component_record_name: egress_policy
    component_record_action: present
    component_record_items: "{{ egress_policy_items }}"
