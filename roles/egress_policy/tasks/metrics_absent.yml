---
- name: Check for the metrics timer
  ansible.builtin.stat:
    path: /etc/systemd/system/egress-policy-metrics.timer
  register: egress_policy_metrics_timer

- name: Stop and disable the metrics timer
  ansible.builtin.systemd:
    name: egress-policy-metrics.timer
    enabled: false
    state: stopped
  when: egress_policy_metrics_timer.stat.exists

- name: Remove the metrics command, units, configuration and metrics
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ _egress_policy_metrics_units | map('regex_replace', '^', '/etc/systemd/system/') | list
            + [_egress_policy_metrics_command, _egress_policy_metrics_config,
               egress_policy_metrics_textfile_dir ~ '/' ~ _egress_policy_textfile] }}"
