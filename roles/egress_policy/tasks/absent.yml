---
# Stopping the unit deletes the table; the record stops it, then removes the ruleset,
# the unit, the client SSH settings and the metrics. What it installed before the record
# existed is adopted: every item, the metrics included.
- name: Remove what this component installed
  ansible.builtin.include_role:
    name: component_record
  vars:
    component_record_name: egress_policy
    component_record_action: absent
    component_record_items: "{{ _egress_policy_base_items + _egress_policy_metrics_items }}"

- name: Delete the egress policy table
  ansible.builtin.include_role:
    name: nft_table
    tasks_from: absent
  vars:
    nft_table_name: egress_policy
