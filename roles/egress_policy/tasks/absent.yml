---
- name: Check for the egress policy unit
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ _egress_policy_unit }}"
  register: egress_policy_unit_file

# Stopping the unit deletes the table.
- name: Stop and disable the egress policy unit
  ansible.builtin.systemd:
    name: "{{ _egress_policy_unit }}"
    enabled: false
    state: stopped
  when: egress_policy_unit_file.stat.exists

# A table loaded by hand, or left by a unit already removed.
- name: Look for the egress policy table
  ansible.builtin.command:
    argv: [nft, list, table, inet, egress_policy]
  register: egress_policy_table
  changed_when: false
  failed_when: false
  check_mode: false  # read-only; --check needs the result

- name: Delete the egress policy table
  ansible.builtin.command:
    argv: [nft, delete, table, inet, egress_policy]
  changed_when: true
  when: egress_policy_table.rc == 0

- name: Remove the ruleset, its unit and the client SSH settings
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ _egress_policy_ruleset }}"
    - "/etc/systemd/system/{{ _egress_policy_unit }}"
    - "{{ egress_policy_ssh_client_file }}"
  register: egress_policy_removed

- name: Remove the metrics
  ansible.builtin.include_tasks: metrics_absent.yml

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
  when: egress_policy_removed is changed
