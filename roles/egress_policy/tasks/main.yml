---
- name: Check the component state
  ansible.builtin.assert:
    that: egress_policy_state in ['present', 'absent', 'kept']
    fail_msg: "egress_policy_state must be present, absent or kept, not {{ egress_policy_state }}."
    quiet: true

- name: "Make egress_policy {{ egress_policy_state }}"
  ansible.builtin.include_tasks: "{{ egress_policy_state }}.yml"
  when: egress_policy_state != 'kept'
