---
# The includes below are tagged always: an untagged include is skipped under --tags,
# and the tasks it holds (such as the `config` ones) would never be reached. Each
# included task still answers to its own tags.
- name: Setup role
  ansible.builtin.include_tasks: setup-role.yml
  tags: always

# The key first: every daemon and command authenticates with it.
- name: Setup munge
  ansible.builtin.include_tasks:
    file: munge.yml
    apply:
      tags: [munge]
  tags: munge

- name: Setup slurm user environment
  ansible.builtin.include_tasks: setup-user.yml

- name: Install the Slurm packages
  ansible.builtin.include_tasks:
    file: packages.yml
    apply:
      tags: [packages]
  tags: packages

- name: Setup slurm systemd services
  ansible.builtin.include_tasks: service-files.yml

- name: Setup slurm controller
  ansible.builtin.include_tasks: controller.yml
  when: is_controller
  tags: always

- name: Setup slurm on compute nodes
  ansible.builtin.include_tasks: compute.yml
  when: is_compute
  tags: always

- name: Setup slurm on other nodes
  ansible.builtin.include_tasks: misc-node.yml
  when: (not is_compute) and (not is_controller)
  tags: always

- name: Apply shm fix
  ansible.builtin.include_tasks: shmfix.yml
  when: is_compute and slurm_fix_shm

- name: Setup logging
  ansible.builtin.include_tasks:
    file: logging.yml
    apply:
      tags: [rsyslog, logging]
  tags:
    - rsyslog
    - logging

- name: Setup undrain
  ansible.builtin.include_tasks: undrain.yml
  when: is_compute
  tags: always
