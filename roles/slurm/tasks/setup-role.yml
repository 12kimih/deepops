---
# Slurm comes as SchedMD's Debian packages; there is no RPM path (yet).
- name: Require a Debian-family host
  ansible.builtin.assert:
    that: ansible_facts.os_family == 'Debian'
    fail_msg: >-
      roles/slurm installs SchedMD's Debian packages (slurm-smd); {{ ansible_facts.distribution }}
      is not Debian-family, and the RPM build is not implemented.
    quiet: true
  tags:
    - always

- name: Gather os specific variables
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - files:
        - "{{ ansible_facts.distribution | lower }}.yml"
        - "{{ ansible_facts.os_family | lower }}.yml"
      paths:
        - ../vars
      skip: true
  tags:
    - always
