---
# un-drain nodes that are down due to an unexpected reboot during install
# sudo scontrol update node=XXX state=idle
# where XXX are the nodes that have changed and are marked as *down*
- name: Set nodes to idle
  ansible.builtin.command: "scontrol update node={{ item }} state=idle"
  register: undrain_nodes_result
  # scontrol refuses a node that is already idle ("Invalid node state"); that is the
  # wanted state, not a failure. Anything else fails the task.
  failed_when:
    - undrain_nodes_result.rc != 0
    - "'Invalid node state' not in undrain_nodes_result.stderr"
  changed_when: undrain_nodes_result.rc == 0
  with_items:
    - "{{ groups[slurm_compute_group] }}"
  environment:
    PATH: "{{ slurm_install_prefix }}/bin:{{ ansible_facts.env.PATH }}"
  run_once: true
  tags:
    - never
    - undrain
