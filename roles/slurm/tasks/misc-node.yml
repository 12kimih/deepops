---
# Configure nodes that are neither running controller services, nor slurmd.
# Examples include login nodes or CI nodes.

# Root's, as on every node: Slurm only reads its config.
- name: Create the slurm config directory
  ansible.builtin.file:
    path: "{{ slurm_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure slurm.conf
  ansible.builtin.template:
    src: "{{ slurm_conf_template }}"
    dest: "{{ slurm_config_dir }}/slurm.conf"
    mode: "0644"
  tags:
    - config

- name: Ensure all slurm services are stopped
  ansible.builtin.service:
    name: "{{ item }}"
    state: stopped
    enabled: false
  with_items:
    - slurmctld
    - slurmd
    - slurmdbd
  failed_when: false
