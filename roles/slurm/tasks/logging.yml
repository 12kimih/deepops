---
- name: Import slurm logs into rsyslog
  ansible.builtin.template:
    src: "etc/rsyslog.d/99-slurm.conf"
    dest: "/etc/rsyslog.d/99-slurm.conf"
    owner: "root"
    group: "root"
    mode: "0644"
  notify:
    - Restart rsyslog

- name: Rotate the slurm logs
  ansible.builtin.template:
    src: "etc/logrotate.d/slurm"
    dest: "/etc/logrotate.d/slurm"
    owner: "root"
    group: "root"
    mode: "0644"
