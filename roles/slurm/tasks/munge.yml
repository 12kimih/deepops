---
- name: Install munge
  ansible.builtin.package:
    name: munge
    state: present
  notify:
    - Restart munge

- name: Require the site's MUNGE key
  ansible.builtin.assert:
    that: slurm_munge_key_file is file
    fail_msg: >-
      {{ slurm_munge_key_file }} does not exist; the site_secrets play creates it, or
      capture the running cluster's key: docs/slurm-cluster/munge-key.md.
    quiet: true
  run_once: true
  delegate_to: localhost

- name: Install the MUNGE key
  diff: false  # the file holds a secret; --diff would print it
  ansible.builtin.copy:
    src: "{{ slurm_munge_key_file }}"
    dest: /etc/munge/munge.key
    mode: "0400"
    owner: munge
    group: munge
  notify:
    - Restart munge

- name: Start munge
  systemd_unit:
    name: munge
    enabled: true
    state: started

- name: Flush handlers to ensure munge gets restarted now
  ansible.builtin.meta: flush_handlers

# A running munged proves nothing about the key: each host encodes and decodes with its
# own, then decodes a credential the first controller made, which only the same key
# can. A host with another key fails here, not as "Invalid credential" on every job.
- name: Check MUNGE on its key
  when: not ansible_check_mode  # nothing was installed or restarted
  block:
    - name: Encode and decode a credential here
      ansible.builtin.shell:
        cmd: set -o pipefail && munge -n | unmunge --metadata=/dev/null --output=/dev/null
        executable: /bin/bash
      changed_when: false

    - name: Make a credential on the first controller
      ansible.builtin.command:
        argv: [munge, -n]
      register: slurm_munge_credential
      changed_when: false
      check_mode: false  # read-only
      run_once: true
      delegate_to: "{{ groups['slurm-master'][0] }}"
      when: groups['slurm-master'] | default([]) | length > 0

    - name: Decode the controller's credential here
      ansible.builtin.command:
        argv: [unmunge, --metadata=/dev/null, --output=/dev/null]
        stdin: "{{ slurm_munge_credential.stdout }}"
      changed_when: false
      when: slurm_munge_credential.stdout is defined
