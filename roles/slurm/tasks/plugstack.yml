---
# A SPANK plugin marked `required` in plugstack.conf must exist, or slurmd aborts
# initialization and srun and sbatch fail ("cannot open spank_pyxis.so"), on every node
# that reads it. A slurm rebuild wipes {{ slurm_install_prefix }}/lib/slurm, deleting the
# plugin the later pyxis play installed on a prior run, and leaves a dangling entry. Drop
# it; the pyxis play (it runs after slurm) rebuilds the plugin against the new slurm and
# redeploys the conf. https://slurm.schedmd.com/spank.html
- name: Check for the pyxis SPANK plugin
  ansible.builtin.stat:
    path: "{{ slurm_install_prefix }}/lib/slurm/spank_pyxis.so"
  register: slurm_pyxis_plugin
  tags:
    - config

- name: Drop a dangling pyxis plugstack entry when its plugin is missing
  ansible.builtin.file:
    path: "{{ slurm_config_dir }}/plugstack.conf.d/pyxis.conf"
    state: absent
  when: not slurm_pyxis_plugin.stat.exists
  tags:
    - config
