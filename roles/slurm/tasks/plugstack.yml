---
# A SPANK plugin marked `required` in plugstack.conf must load, or slurmd aborts
# initialization and srun and sbatch fail, on every node that reads it. The pyxis
# package is installed with the Slurm it was built for (packages.yml), so the plugin
# matches whenever it is there; where it is not (pyxis switched off, or a host not
# converted yet), its entry goes. https://slurm.schedmd.com/spank.html
- name: Check for the pyxis SPANK plugin
  ansible.builtin.stat:
    path: "{{ slurm_plugin_dir }}/spank_pyxis.so"
  register: slurm_pyxis_plugin
  tags:
    - config

- name: Drop a pyxis plugstack entry without its plugin
  ansible.builtin.file:
    path: "{{ slurm_config_dir }}/plugstack.conf.d/pyxis.conf"
    state: absent
  when: not slurm_pyxis_plugin.stat.exists
  tags:
    - config
