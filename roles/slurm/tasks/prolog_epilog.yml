---
- name: Install dependencies (Debian)
  ansible.builtin.include_role:
    name: host_baseline
    tasks_from: kernel_packages
  vars:
    host_baseline_kernel_packages: [tools]  # for cpupower, used in prolog+epilog
  when: ansible_facts.os_family == "Debian"

- name: Install dependencies (RedHat)
  repo_package:
    use: dnf
    name: "{{ item }}"
  with_items:
    - kernel-tools # for cpupower, used in prolog+epilog
  when: ansible_facts.os_family == "RedHat"

- name: Delete old prolog files
  ansible.builtin.file:
    path: "{{ slurm_config_dir }}/{{ item }}"
    state: absent
  with_items:
    - prolog.sh
    - prolog.d
    - prolog-parts.d
    - prolog-exclusive.d
  tags: prolog
  when: slurm_clear_old_prolog_epilog

- name: Delete old epilog files
  ansible.builtin.file:
    path: "{{ slurm_config_dir }}/{{ item }}"
    state: absent
  with_items:
    - epilog.sh
    - epilog.d
    - epilog-parts.d
    - epilog-exclusive.d
    - epilog-last-user.d
  tags: epilog
  when: slurm_clear_old_prolog_epilog

- name: Copy prolog script
  ansible.builtin.template:
    src: etc/slurm/prolog.sh
    dest: "{{ slurm_config_dir }}/"
    mode: "0755"
  tags:
    - prolog

# Every job runs each part, so a part dropped from the sources must leave the node
# too. A relative glob is the role's own; resolve it here, not inside managed_dir.
# slurmd runs the parts as root, so they are root's (managed_dir's default owner): a
# part the slurm account could change would be root for whoever holds that account.
- name: Collect the prolog parts
  ansible.builtin.set_fact:
    slurm_prolog_parts: >-
      {{ query('ansible.builtin.fileglob', *(prolog_fileglob | map('regex_replace', '^(?!/)', role_path ~ '/')))
         | sort }}
  tags:
    - prolog

- name: Install the prolog parts
  ansible.builtin.include_role:
    name: managed_dir
    apply:
      tags: [prolog]
  vars:
    managed_dir_path: "{{ slurm_config_dir }}/prolog.d"
    managed_dir_sources: "{{ slurm_prolog_parts }}"
    managed_dir_allow_empty: true  # prolog_fileglob may name none
    managed_dir_template: true
    managed_dir_mode: "0755"
  tags:
    - prolog

- name: Copy epilog script
  ansible.builtin.template:
    src: etc/slurm/epilog.sh
    dest: "{{ slurm_config_dir }}/"
    mode: "0755"
  tags:
    - epilog

# Every job runs each part, so a part dropped from the sources must leave the node
# too. A relative glob is the role's own; resolve it here, not inside managed_dir.
- name: Collect the epilog parts
  ansible.builtin.set_fact:
    slurm_epilog_parts: >-
      {{ query('ansible.builtin.fileglob', *(epilog_fileglob | map('regex_replace', '^(?!/)', role_path ~ '/')))
         | sort }}
  tags:
    - epilog

- name: Install the epilog parts
  ansible.builtin.include_role:
    name: managed_dir
    apply:
      tags: [epilog]
  vars:
    managed_dir_path: "{{ slurm_config_dir }}/epilog.d"
    managed_dir_sources: "{{ slurm_epilog_parts }}"
    managed_dir_allow_empty: true  # epilog_fileglob may name none
    managed_dir_template: true
    managed_dir_mode: "0755"
  tags:
    - epilog

- name: Copy the task prolog
  ansible.builtin.template:
    src: etc/slurm/task-prolog.sh
    dest: "{{ slurm_config_dir }}/"
    mode: "0755"
  tags:
    - prolog

- name: Collect the task prolog parts
  ansible.builtin.set_fact:
    slurm_task_prolog_parts: >-
      {{ query('ansible.builtin.fileglob', *(task_prolog_fileglob | map('regex_replace', '^(?!/)', role_path ~ '/')))
         | sort }}
  tags:
    - prolog

- name: Install the task prolog parts
  ansible.builtin.include_role:
    name: managed_dir
    apply:
      tags: [prolog]
  vars:
    managed_dir_path: "{{ slurm_config_dir }}/task-prolog.d"
    managed_dir_sources: "{{ slurm_task_prolog_parts }}"
    managed_dir_allow_empty: true  # task_prolog_fileglob may name none
    managed_dir_template: true
    managed_dir_mode: "0755"
  tags:
    - prolog
