---
# The slurm account with the IDs and home roles/system_accounts gives it (the same on
# every host), through roles/local_accounts, which refuses to renumber an existing one.
- name: Create the slurm account's home
  ansible.builtin.file:
    path: "{{ _slurm_user_account.home }}"
    state: directory

# Resolved here: local_accounts evaluates its arguments in its own scope.
- name: Note the slurm account
  ansible.builtin.set_fact:
    _slurm_user_accounts: "{{ {slurm_username: _slurm_user_account} }}"

- name: Create the slurm account
  ansible.builtin.include_role:
    name: local_accounts
  vars:
    local_accounts: "{{ _slurm_user_accounts }}"
