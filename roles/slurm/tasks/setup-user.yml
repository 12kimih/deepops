---
- name: Create slurm user home
  ansible.builtin.file:
    path: "{{ slurm_user_home }}"
    recurse: true
    state: directory

# Pin the group's gid as well as the user's uid. Left to the OS, each node picks
# whatever number is free when the role first runs, so nodes provisioned at different
# times disagree -- see slurm_user_gid in defaults/main.yml for why numeric agreement
# matters.
- name: Create slurm group
  ansible.builtin.group:
    name: "{{ slurm_groupname }}"
    gid: "{{ slurm_user_gid }}"
    state: present
    system: true
  when: slurm_manage_user_gid | bool

- name: Create slurm user
  ansible.builtin.user:
    name: "{{ slurm_username }}"
    state: present
    system: true
    home: "{{ slurm_user_home }}"
    uid: "{{ slurm_user_uid }}"
    group: "{{ slurm_groupname if slurm_manage_user_gid | bool else omit }}"
