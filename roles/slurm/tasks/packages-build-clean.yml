---
# The build directory holds one build at a time. What a build leaves, its trees and its
# packages, goes before the next build and once the packages are published, so the
# directory never grows with the versions: the repository, not this directory, says what
# is built (packages-build.yml).
- name: Find what a build left in the build directory
  ansible.builtin.find:
    paths: "{{ _slurm_build_account.home }}"
    file_type: any
    hidden: true
  register: slurm_build_leftovers

- name: Empty the build directory
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ slurm_build_leftovers.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
