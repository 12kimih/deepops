---
- name: Default to building pmix
  ansible.builtin.set_fact:
    pmix_build: true

# Read the clean version (e.g. "5.0.10") from pmix_info instead of decoding the
# PMIX_NUMERIC_VERSION hex header, which the old `tr -d 'x0'` parsed incorrectly
# and so always rebuilt.
- name: Check installed pmix version
  ansible.builtin.shell: "{{ pmix_install_prefix }}/bin/pmix_info | grep PMIX: | awk '{print $2}'"
  register: pmix_info_version
  ignore_errors: true
  changed_when: pmix_info_version.rc != 0

- name: Don't build pmix if it's already installed, unless forced
  ansible.builtin.set_fact:
    pmix_build: false
  when: pmix_info_version.stdout == pmix_version and not pmix_force_rebuild

- name: Install pmix build dependencies
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    name: "{{ item }}"
  with_items: "{{ slurm_pmix_deps }}"
  when: ansible_facts.distribution == 'Ubuntu'

- name: Install pmix build dependencies
  ansible.builtin.dnf:
    name: "{{ item }}"
    state: present
  with_items: "{{ slurm_pmix_deps }}"
  when: ansible_facts.os_family == 'RedHat'

- name: Install pmix 'pandoc' build dependency
  ansible.builtin.dnf:
    name: pandoc
    state: present
    # CodeReady Builder repo: "powertools" on EL8, "crb" on EL9+ (Rocky/Alma).
    enablerepo: "{{ 'powertools' if ansible_facts.distribution_major_version == '8' else 'crb' }}"
  when: ansible_facts.os_family == 'RedHat'

- name: Remove the distribution's PMIx, which would shadow the build
  ansible.builtin.include_role:
    name: host_baseline
    tasks_from: absent
  vars:
    host_baseline_absent_packages: "{{ pmix_distro_packages[ansible_facts.os_family] }}"

- name: When building, try to uninstall first before downloading source
  when: pmix_build
  block:
    - name: Check that we have an old build dir
      ansible.builtin.stat:
        path: "{{ pmix_build_dir }}"
      register: pmix_old_build_dir

    - name: Uninstall old version
      ansible.builtin.command: make -j uninstall
      args:
        chdir: "{{ pmix_build_dir }}"
      ignore_errors: true
      when: pmix_old_build_dir.stat.exists

    - name: Remove old build dir
      ansible.builtin.file:
        path: "{{ pmix_build_dir }}"
        state: absent

- name: Make pmix build directory
  ansible.builtin.file:
    path: "{{ pmix_build_dir }}"
    state: directory
    mode: "0755"
  when: pmix_build

- name: Fetch and unpack the PMIx source
  ansible.builtin.include_role:
    name: download
  vars:
    download_url: "{{ pmix_src_url }}"
    download_checksum: "{{ pmix_checksums[pmix_version] | default('') }}"
    download_dest: "/var/cache/deepops/{{ pmix_src_url | basename }}"
    download_unpack: "{{ pmix_build_dir }}"
    download_strip: 1
  when: pmix_build

- name: Clean pmix src dir
  ansible.builtin.command: make distclean
  args:
    chdir: "{{ pmix_build_dir }}"
  failed_when: false
  when: pmix_build

- name: Configure pmix
  ansible.builtin.command: "{{ pmix_configure }}"
  args:
    chdir: "{{ pmix_build_dir }}"
  when: pmix_build

- name: Build pmix
  ansible.builtin.shell: "make -j$(nproc) > build.log 2>&1"
  args:
    chdir: "{{ pmix_build_dir }}"
  when: pmix_build

- name: Install pmix
  ansible.builtin.shell: "make -j$(nproc) install >> build.log 2>&1"
  args:
    chdir: "{{ pmix_build_dir }}"
  when: pmix_build
