---
# Build the slurm-smd packages of slurm_version once, on this host (slurm-master[0]),
# and publish them to the signed repository in slurm_repo_dir that every node installs
# from. SchedMD's procedure (quickstart_admin.html#debuild): unpack the release, install
# debian/control's build dependencies with mk-build-deps, build binary packages.
#
# The build runs in a throwaway container of this host's own release, never on the host:
# whatever the host has installed (an older Slurm under /usr/local, libraries of other
# software, its ld.so.conf) would otherwise be found before the build's own files. (Perl
# links its modules with -L/usr/local/lib first: on 2026-11-20 the Perl bindings linked
# the retired source build's libslurm.so.44, and dh_shlibdeps refused them.) The tree
# lives on the host, owned by slurm_deb_build_user, who builds; root in the container
# only installs the build dependencies, and root on the host publishes.
- name: Setup role
  ansible.builtin.include_tasks: setup-role.yml

- name: Require the repository signing key
  ansible.builtin.assert:
    that:
      - slurm_repo_signing_key_file is file
      - slurm_repo_signing_pubkey_file is file
    fail_msg: >-
      slurm_repo_signing_key_file (vaulted) and slurm_repo_signing_pubkey_file sign and
      verify the Slurm package repository; the site_secrets play creates the pair
      (docs/slurm-cluster/slurm-upgrade.md).
    quiet: true
  run_once: true
  delegate_to: localhost

- name: Read the package architecture
  ansible.builtin.command:
    argv: [dpkg, --print-architecture]
  register: slurm_deb_arch
  changed_when: false
  check_mode: false  # read-only; --check needs the result

# The build once ran on the host itself: its dependency package goes, and with it the
# packages only it pulled in (those it orphans, not every orphan the host has).
- name: Remove the build dependencies an earlier build installed on the host
  when: ansible_facts.os_family == 'Debian'
  block:
    - name: List what apt would remove before
      ansible.builtin.command:
        argv: [apt-get, --simulate, autoremove]
      register: slurm_deb_orphans_before
      changed_when: false
      check_mode: false  # read-only; --check needs the result

    - name: Remove the host build's dependency package
      ansible.builtin.include_role:
        name: host_baseline
        tasks_from: absent
      vars:
        host_baseline_absent_packages: [slurm-smd-build-deps]

    - name: List what apt would remove after
      ansible.builtin.command:
        argv: [apt-get, --simulate, autoremove]
      register: slurm_deb_orphans_after
      changed_when: false
      check_mode: false  # read-only; --check needs the result

    - name: Remove the packages only the host build needed
      ansible.builtin.include_role:
        name: host_baseline
        tasks_from: absent
      vars:
        # apt-get --simulate prints "Remv <package> [<version>]" per package.
        host_baseline_absent_packages: >-
          {{ slurm_deb_orphans_after.stdout | regex_findall('(?m)^Remv (\S+)')
             | difference(slurm_deb_orphans_before.stdout | regex_findall('(?m)^Remv (\S+)')) }}

- name: Look for this version in the repository
  ansible.builtin.stat:
    path: "{{ slurm_repo_dir }}/slurm-smd_{{ slurm_deb_version }}_{{ slurm_deb_arch.stdout }}.deb"
  register: slurm_repo_has_version

- name: Look for this pyxis in the repository
  ansible.builtin.stat:
    path: "{{ slurm_repo_dir }}/{{ slurm_pyxis_package }}_{{ slurm_pyxis_deb_version }}_{{ slurm_deb_arch.stdout }}.deb"
  register: slurm_repo_has_pyxis

- name: Decide what to build
  ansible.builtin.set_fact:
    slurm_deb_build_slurm: "{{ slurm_force_rebuild | bool or not slurm_repo_has_version.stat.exists }}"
    slurm_deb_build_pyxis: >-
      {{ slurm_pyxis_wanted_anywhere | bool
         and (slurm_force_rebuild | bool or not slurm_repo_has_version.stat.exists or not slurm_repo_has_pyxis.stat.exists) }}

- name: Build the packages
  when: slurm_deb_build_slurm or slurm_deb_build_pyxis
  vars:
    _tree: "{{ _slurm_build_account.home }}/slurm-{{ slurm_version }}"
    _pyxis_tree: "{{ _slurm_build_account.home }}/pyxis-{{ slurm_pyxis_version }}"
    _nvml: "/usr/local/cuda-{{ slurm_nvml_cuda_version }}/targets/{{ ansible_facts.architecture | cuda_architecture }}-linux"
    # pyxis builds against the slurm-smd-dev of this version: just built, or published.
    _pyxis_deb: "{{ _slurm_build_account.home }}/{{ slurm_pyxis_package }}_{{ slurm_pyxis_deb_version }}_{{ slurm_deb_arch.stdout }}.deb"
    _slurm_debs: >-
      {{ [_slurm_build_account.home if slurm_deb_build_slurm else slurm_repo_dir]
         | product(['slurm-smd', 'slurm-smd-dev'])
         | map('join', '/') | map('regex_replace', '$', '_' ~ slurm_deb_version ~ '_' ~ slurm_deb_arch.stdout ~ '.deb') | list }}
  block:
    # cuda-nvml-dev-<version> (the NVML header and link stub) comes from NVIDIA's
    # repository, which the build container reads through the host's source and keyring.
    - name: Add the CUDA repository
      ansible.builtin.include_role:
        name: package_repos
        tasks_from: cuda
        public: true  # its source and keyring paths, for the build container

    # Before the account had fixed IDs this role let the OS number it. It is local and
    # owns nothing but its build directory (its home), so it takes the registry's
    # numbers here, its directory with it; any other account of that name, with another
    # home, is left for local_accounts to refuse.
    - name: Read the build account as it is
      ansible.builtin.getent:
        database: passwd
        key: "{{ slurm_deb_build_user }}"
        service: files
        fail_key: false

    - name: Give the build account the registry's numbers
      change_shell:
        cmd: |
          set -e
          groupmod -g {{ _gid }} {{ slurm_deb_build_user | quote }}
          usermod -u {{ _slurm_build_account.uid }} -g {{ _gid }} {{ slurm_deb_build_user | quote }}
          chown -R {{ _slurm_build_account.uid }}:{{ _gid }} {{ _slurm_build_account.home | quote }}
      vars:
        _gid: "{{ _slurm_build_account.gid | default(_slurm_build_account.uid) }}"
        _now: "{{ ansible_facts.getent_passwd[slurm_deb_build_user] | default(none) }}"
      when:
        - _now is not none
        - _now[4] == _slurm_build_account.home
        - (_now[1] | int) != _slurm_build_account.uid or (_now[2] | int) != (_gid | int)

    # Resolved here: local_accounts evaluates its arguments in its own scope.
    - name: Note the build account
      ansible.builtin.set_fact:
        _slurm_build_accounts: "{{ {slurm_deb_build_user: system_accounts[slurm_deb_build_user] | combine({'create_home': false})} }}"
        _slurm_build_groups: "{{ system_groups }}"

    - name: Create the build account
      ansible.builtin.include_role:
        name: local_accounts
      vars:
        local_accounts: "{{ _slurm_build_accounts }}"
        local_accounts_groups: "{{ _slurm_build_groups }}"

    - name: Create the build directory
      ansible.builtin.file:
        path: "{{ _slurm_build_account.home }}"
        state: directory
        owner: "{{ slurm_deb_build_user }}"
        mode: "0755"

    - name: Start from an empty build directory
      ansible.builtin.include_tasks: packages-build-clean.yml

    - name: Prepare the Slurm tree
      when: slurm_deb_build_slurm
      block:
        # A fresh tree each build (the directory starts empty): the patches below apply
        # to the release as shipped.
        - name: Create the build directory
          ansible.builtin.file:
            path: "{{ _tree }}"
            state: directory
            owner: "{{ slurm_deb_build_user }}"
            mode: "0755"

        - name: Fetch and unpack the Slurm release
          ansible.builtin.include_role:
            name: download
          vars:
            download_url: "{{ slurm_src_url }}"
            download_checksum: "{{ slurm_checksums[slurm_version] | default('') }}"
            download_dest: "{{ deepops_cache_dir }}/{{ slurm_src_url | basename }}"
            download_unpack: "{{ _tree }}"
            download_strip: 1
            download_owner: "{{ slurm_deb_build_user }}"

        # The shipped debian/ directory, adjusted where this cluster needs more than it
        # declares: Lua 5.4 for 5.3, NVML and the other extra build dependencies, NVML from
        # its package path (never /usr/local/cuda), no dpkg dependency on the driver's
        # libnvidia-ml (gpu_nvml.so loads it from the driver on GPU nodes only), and no
        # daemon started or restarted by dpkg: the role restarts them in Slurm's order.
        - name: Version the packages {{ slurm_deb_version }}
          ansible.builtin.replace:
            path: "{{ _tree }}/debian/changelog"
            regexp: '\Aslurm-smd \([^)]*\)'
            replace: "slurm-smd ({{ slurm_deb_version }})"
          register: slurm_deb_patch_version

        - name: Build against Lua {{ slurm_deb_lua_dev }}
          ansible.builtin.replace:
            path: "{{ _tree }}/debian/control"
            regexp: '^ liblua5\.\d-dev,$'
            replace: " {{ slurm_deb_lua_dev }},"
          register: slurm_deb_patch_lua

        - name: Add the build dependencies debian/control lacks
          ansible.builtin.replace:
            path: "{{ _tree }}/debian/control"
            regexp: "^Build-Depends:$"
            # Put first in the field's value, leaving no line blank: an empty line ends the
            # paragraph, and dpkg reads the rest as one without a field.
            replace: "Build-Depends:{% for dep in _deps %}\n {{ dep }},{% endfor %}"
          vars:
            _deps: "{{ ['cuda-nvml-dev-' ~ slurm_nvml_cuda_version | replace('.', '-')] + slurm_deb_build_extra_deps }}"
          register: slurm_deb_patch_deps

        - name: Configure with NVML from its package
          ansible.builtin.replace:
            path: "{{ _tree }}/debian/rules"
            regexp: "dh_auto_configure -- "
            replace: "dh_auto_configure -- --with-nvml={{ _nvml }} "
          register: slurm_deb_patch_nvml

        - name: Leave the daemons to the role
          ansible.builtin.replace:
            path: "{{ _tree }}/debian/rules"
            regexp: "dh_installsystemd -p"
            replace: "dh_installsystemd --no-start --no-stop-on-upgrade -p"
          register: slurm_deb_patch_start

        - name: Keep the driver's libnvidia-ml out of the package dependencies
          ansible.builtin.blockinfile:
            path: "{{ _tree }}/debian/rules"
            # A make recipe line must start with a tab.
            block: "override_dh_shlibdeps:\n\tdh_shlibdeps -Xgpu_nvml.so"  # noqa: no-tabs
          register: slurm_deb_patch_shlibs

        # The contribs SchedMD's RPMs ship (slurm-contribs, and sgather in slurm) and its
        # debian/ leaves out: without them the move from the source build lost seff, which
        # the user guide teaches.
        - name: Install the contribs debian/rules leaves out
          ansible.builtin.blockinfile:
            path: "{{ _tree }}/debian/rules"
            marker: "# {mark} slurm-smd-contribs"
            # A make recipe line must start with a tab.
            block: "execute_after_dh_auto_install:\n{% for dir in slurm_deb_contribs.dirs %}\t$(MAKE) -C obj-$(DEB_BUILD_GNU_TYPE)/contribs/{{ dir }} install DESTDIR=$(CURDIR)/debian/tmp\n{% endfor %}\tinstall -D -m755 contribs/sjstat debian/tmp/usr/bin/sjstat"  # noqa: no-tabs yaml[line-length]
          register: slurm_deb_patch_contribs_rules

        - name: Package the contribs
          ansible.builtin.copy:
            dest: "{{ _tree }}/debian/{{ item.name }}"
            content: "{{ item.lines | join('\n') }}\n"
            owner: "{{ slurm_deb_build_user }}"
            mode: "0644"
          loop:
            - {name: slurm-smd-contribs.install, lines: "{{ slurm_deb_contribs.commands | map('regex_replace', '^', 'usr/bin/') }}"}
            - {name: slurm-smd-contribs.manpages, lines: "{{ slurm_deb_contribs.manpages | map('regex_replace', '^', 'debian/tmp/usr/share/man/') }}"}
          loop_control:
            label: "{{ item.name }}"

        - name: Declare the contribs package
          ansible.builtin.blockinfile:
            path: "{{ _tree }}/debian/control"
            marker: "# {mark} slurm-smd-contribs"
            # The empty line ends the paragraph before; a comment line does not.
            block: |-

              Package: slurm-smd-contribs
              Architecture: all
              Depends:
               slurm-smd-client (>= ${source:Version}),
               slurm-smd-libslurm-perl (>= ${source:Version}),
               ${perl:Depends},
               ${misc:Depends}
              Description: Contributed Slurm tools
                {{ slurm_deb_contribs.commands | join(', ') }}: what SchedMD's RPMs ship as
                slurm-contribs (and sgather in slurm).
          register: slurm_deb_patch_contribs_control

        - name: Check every packaging change applied
          ansible.builtin.assert:
            that: >-
              [slurm_deb_patch_version, slurm_deb_patch_lua, slurm_deb_patch_deps, slurm_deb_patch_nvml,
               slurm_deb_patch_start, slurm_deb_patch_shlibs, slurm_deb_patch_contribs_rules,
               slurm_deb_patch_contribs_control] | select('changed') | list | length == 8
            fail_msg: >-
              The debian/ directory of Slurm {{ slurm_version }} no longer has what the build
              adjusts (its changelog's first entry, liblua5.x-dev, Build-Depends:,
              dh_auto_configure, dh_installsystemd) or already has what it adds
              (slurm-smd-contribs); update roles/slurm/tasks/packages-build.yml for it.
            quiet: true
          when: not ansible_check_mode


    - name: Prepare the pyxis tree
      when: slurm_deb_build_pyxis
      block:
        - name: Create the pyxis tree
          ansible.builtin.file:
            path: "{{ _pyxis_tree }}"
            state: directory
            owner: "{{ slurm_deb_build_user }}"
            mode: "0755"

        - name: Fetch and unpack the pyxis release
          ansible.builtin.include_role:
            name: download
          vars:
            download_url: "{{ slurm_pyxis_tarball_url }}"
            download_checksum: "{{ slurm_pyxis_checksums[slurm_pyxis_version] | default('') }}"
            download_dest: "{{ deepops_cache_dir }}/pyxis-{{ slurm_pyxis_version }}.tar.gz"
            download_unpack: "{{ _pyxis_tree }}"
            download_strip: 1
            download_owner: "{{ slurm_deb_build_user }}"

        # NVIDIA's debian/ directory (https://github.com/NVIDIA/pyxis, "make deb"), with
        # a version naming the Slurm it is built for, and a dependency on exactly that
        # slurm-smd in place of enroot's: deepops installs enroot from NVIDIA's releases
        # (roles/enroot), which no apt repository has, and a SPANK plugin loads only in
        # the Slurm it was built against.
        - name: Version pyxis for this Slurm
          ansible.builtin.replace:
            path: "{{ _pyxis_tree }}/debian/changelog"
            regexp: '\A{{ slurm_pyxis_package }} \([^)]*\)'
            replace: "{{ slurm_pyxis_package }} ({{ slurm_pyxis_deb_version }})"
          register: slurm_pyxis_patch_version

        - name: Make pyxis depend on this Slurm
          ansible.builtin.replace:
            path: "{{ _pyxis_tree }}/debian/control"
            regexp: '^Depends: (\$\{shlibs:Depends\}, \$\{misc:Depends\}),.*$'
            replace: 'Depends: \1, slurm-smd (= {{ slurm_deb_version }})'
          register: slurm_pyxis_patch_depends

        - name: Check every pyxis packaging change applied
          ansible.builtin.assert:
            that: "[slurm_pyxis_patch_version, slurm_pyxis_patch_depends] | select('changed') | list | length == 2"
            fail_msg: >-
              The debian/ directory of pyxis {{ slurm_pyxis_version }} no longer has what the
              build adjusts (its changelog's first entry, Depends:); update
              roles/slurm/tasks/packages-build.yml for it.
            quiet: true
          when: not ansible_check_mode

    - name: Build in a clean container
      when: not ansible_check_mode
      vars:
        _in_container:
          container: "{{ slurm_deb_build_container }}"
          env: "{{ proxy_env | combine({'DEBIAN_FRONTEND': 'noninteractive'}) }}"
      block:
        # The container runs outside the operator's slice: capped at what this run may
        # use there, and the build runs that many jobs.
        - name: Count the CPUs the build may use
          ansible.builtin.include_role:
            name: cluster_tools_lib
            tasks_from: usable_cpus

        # The trees at the same path; the repository (for pyxis, the published Slurm) and
        # the CUDA repository (package_repos, for cuda-nvml-dev) read-only.
        - name: Start the build container
          community.docker.docker_container:
            name: "{{ slurm_deb_build_container }}"
            image: "{{ slurm_deb_build_image }}"
            pull: always
            command: [sleep, infinity]
            network_mode: host
            recreate: true
            state: started
            cpus: "{{ cluster_tools_lib_usable_cpus }}"
            env: "{{ proxy_env }}"
            mounts:
              - {type: bind, source: "{{ _slurm_build_account.home }}", target: "{{ _slurm_build_account.home }}"}
              - {type: bind, source: "{{ slurm_repo_dir }}", target: "{{ slurm_repo_dir }}", read_only: true}
              - {type: bind, source: "{{ package_repos_cuda_keyring_file }}", target: "{{ package_repos_cuda_keyring_file }}", read_only: true}
              - {type: bind, source: "{{ package_repos_cuda_source_file }}", target: "{{ package_repos_cuda_source_file }}", read_only: true}

        # A bare image has no CA certificates, so the HTTPS repositories (CUDA) are read
        # only after the first install.
        - name: Install the packaging tools in the container
          community.docker.docker_container_exec:
            container: "{{ _in_container.container }}"
            env: "{{ _in_container.env }}"
            argv:
              - bash
              - -ec
              - |
                apt-get update -q
                apt-get install -y -q --no-install-recommends ca-certificates
                apt-get update -q -o APT::Update::Error-Mode=any
                apt-get install -y -q --no-install-recommends build-essential fakeroot devscripts equivs
          changed_when: true

        - name: Install the build dependencies in the container
          community.docker.docker_container_exec:
            container: "{{ _in_container.container }}"
            env: "{{ _in_container.env }}"
            argv: [mk-build-deps, --install, --remove, --tool, apt-get -y -q --no-install-recommends, "{{ _tree }}/debian/control"]
            chdir: "{{ _slurm_build_account.home }}"
          changed_when: true
          when: slurm_deb_build_slurm

        - name: Build the packages
          community.docker.docker_container_exec:
            container: "{{ _in_container.container }}"
            user: "{{ _slurm_build_account.uid }}:{{ _slurm_build_account.gid | default(_slurm_build_account.uid) }}"
            env:
              HOME: "{{ _slurm_build_account.home }}"
              DEB_BUILD_OPTIONS: "parallel={{ cluster_tools_lib_usable_cpus }}"
            argv: [dpkg-buildpackage, -b, -uc, -us]
            chdir: "{{ _tree }}"
          changed_when: true
          when: slurm_deb_build_slurm

        - name: Install this Slurm and pyxis's build dependencies in the container
          community.docker.docker_container_exec:
            container: "{{ _in_container.container }}"
            env: "{{ _in_container.env }}"
            argv:
              - bash
              - -ec
              - |
                apt-get install -y -q --no-install-recommends {{ _slurm_debs | map('quote') | join(' ') }}
                mk-build-deps --install --remove --tool 'apt-get -y -q --no-install-recommends' {{ (_pyxis_tree ~ '/debian/control') | quote }}
            chdir: "{{ _slurm_build_account.home }}"
          changed_when: true
          when: slurm_deb_build_pyxis

        - name: Build the pyxis package
          community.docker.docker_container_exec:
            container: "{{ _in_container.container }}"
            user: "{{ _slurm_build_account.uid }}:{{ _slurm_build_account.gid | default(_slurm_build_account.uid) }}"
            env:
              HOME: "{{ _slurm_build_account.home }}"
              DEB_BUILD_OPTIONS: "parallel={{ cluster_tools_lib_usable_cpus }}"
            argv: [dpkg-buildpackage, -b, -uc, -us]
            chdir: "{{ _pyxis_tree }}"
          changed_when: true
          when: slurm_deb_build_pyxis

      always:
        - name: Remove the build container
          community.docker.docker_container:
            name: "{{ slurm_deb_build_container }}"
            state: absent

    - name: List what the main package holds
      ansible.builtin.command:
        argv: [dpkg-deb, --contents, "{{ _slurm_build_account.home }}/slurm-smd_{{ slurm_deb_version }}_{{ slurm_deb_arch.stdout }}.deb"]
      register: slurm_deb_contents
      changed_when: false
      when: not ansible_check_mode and slurm_deb_build_slurm

    - name: Read the main package's dependencies
      ansible.builtin.command:
        argv: [dpkg-deb, --field, "{{ _slurm_build_account.home }}/slurm-smd_{{ slurm_deb_version }}_{{ slurm_deb_arch.stdout }}.deb", Depends]
      register: slurm_deb_depends
      changed_when: false
      when: not ansible_check_mode and slurm_deb_build_slurm

    - name: Check the packages hold every required plugin
      ansible.builtin.assert:
        that:
          - _missing | length == 0
          - slurm_deb_lua_dev | regex_replace('-dev$', '') in slurm_deb_depends.stdout
          - "'libnvidia' not in slurm_deb_depends.stdout"
        fail_msg: >-
          The Slurm {{ slurm_version }} packages lack {{ _missing | join(', ') or 'nothing' }} or
          do not link {{ slurm_deb_lua_dev | regex_replace('-dev$', '') }} (Depends:
          {{ slurm_deb_depends.stdout }}): a build dependency was missing. See the configure
          output in the build tree {{ _tree }}.
        quiet: true
      vars:
        _missing: "{{ slurm_deb_required_plugins | reject('in', slurm_deb_contents.stdout) | list }}"
      when: not ansible_check_mode and slurm_deb_build_slurm

    - name: List what the contribs package holds
      ansible.builtin.command:
        argv: [dpkg-deb, --contents, "{{ _slurm_build_account.home }}/slurm-smd-contribs_{{ slurm_deb_version }}_all.deb"]
      register: slurm_deb_contribs_contents
      changed_when: false
      when: not ansible_check_mode and slurm_deb_build_slurm

    - name: Check the contribs package holds every contributed command
      ansible.builtin.assert:
        that: _missing | length == 0
        fail_msg: >-
          slurm-smd-contribs {{ slurm_deb_version }} lacks {{ _missing | join(', ') }}: the
          contribs/ Makefiles of Slurm {{ slurm_version }} install them elsewhere or no longer.
        quiet: true
      vars:
        _missing: >-
          {{ slurm_deb_contribs.commands | map('regex_replace', '^', './usr/bin/')
             | reject('in', slurm_deb_contribs_contents.stdout) | list }}
      when: not ansible_check_mode and slurm_deb_build_slurm

    - name: Read what the pyxis package holds and needs
      ansible.builtin.command:
        argv: [dpkg-deb, --info, "{{ _pyxis_deb }}"]
      register: slurm_pyxis_deb_info
      changed_when: false
      when: not ansible_check_mode and slurm_deb_build_pyxis

    - name: List what the pyxis package holds
      ansible.builtin.command:
        argv: [dpkg-deb, --contents, "{{ _pyxis_deb }}"]
      register: slurm_pyxis_deb_contents
      changed_when: false
      when: not ansible_check_mode and slurm_deb_build_pyxis

    - name: Check the pyxis package puts the plugin where Slurm loads it, for this Slurm
      ansible.builtin.assert:
        that:
          - ('.' ~ slurm_plugin_dir ~ '/spank_pyxis.so') in slurm_pyxis_deb_contents.stdout
          - ('slurm-smd (= ' ~ slurm_deb_version ~ ')') in slurm_pyxis_deb_info.stdout
        fail_msg: >-
          The pyxis package {{ _pyxis_deb | basename }} does not install
          {{ slurm_plugin_dir }}/spank_pyxis.so or does not depend on slurm-smd (= {{ slurm_deb_version }}).
        quiet: true
      when: not ansible_check_mode and slurm_deb_build_pyxis

- name: Find the built packages
  find_present:
    paths: "{{ _slurm_build_account.home }}"
    patterns: ["*_{{ slurm_deb_version }}_*.deb", "{{ slurm_pyxis_package }}_{{ slurm_pyxis_deb_version }}_*.deb"]
  register: slurm_deb_built

- name: Create the repository directory
  ansible.builtin.file:
    path: "{{ slurm_repo_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# Earlier versions stay: a node added mid-upgrade still installs the version it needs.
- name: Publish the packages
  ansible.builtin.copy:
    src: "{{ item.path }}"
    dest: "{{ slurm_repo_dir }}/"
    remote_src: true
    owner: root
    group: root
    mode: "0644"
  loop: "{{ slurm_deb_built.files }}"
  loop_control:
    label: "{{ item.path | basename }}"

- name: Empty the build directory once its packages are published
  ansible.builtin.include_tasks: packages-build-clean.yml

- name: Keep the public key to check the signature against
  ansible.builtin.copy:
    src: "{{ slurm_repo_signing_pubkey_file }}"
    dest: "{{ deepops_cache_dir }}/slurm-repo.asc"
    owner: root
    group: root
    mode: "0644"

# Whether the index lists exactly the packages there, hashed by an InRelease the key the
# nodes trust signed: decided by that evidence, not by this run having copied a package,
# so a run that failed between the copy and the signature is finished by the next one.
# The key comes from the site config on stdin, and a repository not there yet (a first
# preview made no directory) is stale: --check reads only what exists.
- name: Check the repository's index and signature
  ansible.builtin.shell:
    cmd: |
      set -eu
      [ -d {{ slurm_repo_dir | quote }} ] || { echo stale; exit 0; }
      work=$(mktemp -d)
      trap 'rm -rf "$work"' EXIT
      cd {{ slurm_repo_dir | quote }}
      apt-ftparchive packages . | cmp -s - Packages || { echo stale; exit 0; }
      gpg --homedir "$work" --batch --quiet --import
      gpg --homedir "$work" --batch --quiet --verify InRelease 2>/dev/null || { echo unsigned; exit 0; }
      grep -q "$(sha256sum Packages | cut -d' ' -f1)" InRelease || { echo stale; exit 0; }
      echo current
    executable: /bin/bash
    stdin: "{{ lookup('ansible.builtin.file', slurm_repo_signing_pubkey_file) }}"
  register: slurm_repo_index
  changed_when: false
  check_mode: false  # read-only; --check needs the result

# The index, then Release (its hashes) signed by the key from stdin, in a throwaway
# keyring; then the signature is checked against slurm_repo_signing_pubkey_file, the key
# the nodes trust, so a mismatched pair fails here and not on every node.
- name: Index and sign the repository
  change_shell:
    cmd: |
      set -eu
      work=$(mktemp -d {{ deepops_cache_dir }}/slurm-repo-sign.XXXXXX)
      trap 'rm -rf "$work"' EXIT
      mkdir -m 0700 "$work/sign" "$work/check" "$work/index"
      gpg --homedir "$work/sign" --batch --quiet --import
      cd {{ slurm_repo_dir | quote }}
      apt-ftparchive packages . > "$work/index/Packages"
      gzip -9n -c "$work/index/Packages" > "$work/index/Packages.gz"
      cd "$work/index"
      apt-ftparchive -o APT::FTPArchive::Release::Origin=deepops -o APT::FTPArchive::Release::Label=slurm release . > "$work/Release"
      gpg --homedir "$work/sign" --batch --yes --clearsign -o "$work/index/InRelease" "$work/Release"
      gpg --homedir "$work/check" --batch --quiet --import {{ deepops_cache_dir }}/slurm-repo.asc
      gpg --homedir "$work/check" --batch --verify "$work/index/InRelease"
      install -m 0644 "$work/index/Packages" "$work/index/Packages.gz" {{ slurm_repo_dir | quote }}/
      install -m 0644 "$work/index/InRelease" {{ slurm_repo_dir | quote }}/
    executable: /bin/bash
    stdin: "{{ lookup('ansible.builtin.file', slurm_repo_signing_key_file) }}"  # decrypts the vaulted file
  no_log: true
  when: slurm_repo_index.stdout != 'current'
