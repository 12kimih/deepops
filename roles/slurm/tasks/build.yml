---
###########################################
# Install dependencies
###########################################

- name: Setup role
  ansible.builtin.include_tasks: setup-role.yml
- name: Configure alternative library path
  ansible.builtin.template:
    src: etc/ld.so.conf.d/slurm.conf.j2
    dest: /etc/ld.so.conf.d/slurm.conf
    mode: "0644"
  register: updated_slurm_ld

- name: Update ld cache
  ansible.builtin.command: ldconfig
  when: updated_slurm_ld.changed # noqa no-handler

- name: Setup munge
  ansible.builtin.include_tasks: munge.yml
- name: Setup hwloc
  ansible.builtin.include_tasks: hwloc.yml
  tags: hwloc
  when: slurm_include_hwloc

- name: Setup pmix
  ansible.builtin.include_tasks: pmix.yml
  tags: pmix
  when: slurm_include_pmix

###########################################
# Build Slurm
###########################################
- name: Default to building slurm
  ansible.builtin.set_fact:
    slurm_build: true
    slurm_upgrade: false
    slurm_downgrade: false

- name: Check installed slurm version
  ansible.builtin.shell: "{{ slurm_install_prefix }}/sbin/slurmd --version | awk '{print $2}'"
  register: slurmd_reported_version
  ignore_errors: true
  changed_when: slurmd_reported_version.rc != 0

- name: Don't build slurm if it's already installed, unless forced
  ansible.builtin.set_fact:
    slurm_build: false
  when: slurmd_reported_version.stdout == slurm_version and not slurm_force_rebuild

- name: Upgrade?
  ansible.builtin.set_fact:
    slurm_upgrade: true
  when: slurmd_reported_version.stdout and slurmd_reported_version.stdout is version(slurm_version, '<')

- name: Downgrade?
  ansible.builtin.set_fact:
    slurm_downgrade: true
  when: slurmd_reported_version.stdout and slurmd_reported_version.stdout is version(slurm_version, '>')

- name: Going to rebuild slurm?
  ansible.builtin.debug:
    msg: "Rebuild Slurm? {{ slurm_build }}"

- name: Install build dependencies
  ansible.builtin.apt:
    name: "{{ item }}"
    state: present
    update_cache: true
  with_items: "{{ slurm_build_deps + (slurm_slurmrestd_deps if slurm_build_slurmrestd | default(false) else []) }}"
  when: ansible_facts.distribution == 'Ubuntu'

- name: Install build dependencies
  ansible.builtin.dnf:
    name: "{{ item }}"
    state: present
    # The CodeReady Builder repo is named "powertools" on EL8 but was renamed to
    # "crb" on EL9+ (Rocky/Alma/CentOS Stream). On RHEL proper, enable the
    # codeready-builder-for-rhel-<N> repo via subscription-manager beforehand.
    enablerepo: "{{ 'powertools' if ansible_facts.distribution_major_version == '8' else 'crb' }}"
  with_items: "{{ slurm_build_deps + (slurm_slurmrestd_deps if slurm_build_slurmrestd | default(false) else []) }}"
  when: ansible_facts.os_family == 'RedHat'

- name: Install lua build dependencies
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    name: "{{ slurm_lua_deps }}"
    state: present
  when:
    - slurm_build_lua | bool
    - ansible_facts.distribution == 'Ubuntu'

- name: Install lua build dependencies
  ansible.builtin.dnf:
    name: "{{ slurm_lua_deps }}"
    state: present
  when:
    - slurm_build_lua | bool
    - ansible_facts.os_family == 'RedHat'

- name: Remove the distribution's Slurm, which would shadow the build
  ansible.builtin.include_role:
    name: host_baseline
    tasks_from: absent
  vars:
    host_baseline_absent_packages: "{{ slurm_distro_packages[ansible_facts.os_family] }}"

- name: Gather service facts
  ansible.builtin.service_facts:

- name: When building, try to uninstall first before downloading source
  when: slurm_build
  block:
    # This service should be stopped before uninstalling slurm
    - name: Stop docker slurm exporter service to prevent subfolder creation
      ansible.builtin.service:
        name: "docker.slurm-exporter.service"
        state: stopped
      register: slurm_exporter_stopped
      when: (ansible_facts.distribution == 'Ubuntu') and
        ("docker.slurm-exporter.service" in ansible_facts.services) and
        (ansible_facts.services["docker.slurm-exporter.service"].state == "running")

    - name: Check that we have an old build dir
      ansible.builtin.stat:
        path: "{{ slurm_build_dir }}"
      register: slurm_old_build_dir

    - name: Uninstall old version
      ansible.builtin.command: make -j uninstall
      args:
        chdir: "{{ slurm_build_dir }}"
      ignore_errors: true
      when: slurm_old_build_dir.stat.exists

    - name: Remove old build dir
      ansible.builtin.file:
        path: "{{ slurm_build_dir }}"
        state: absent

    - name: Remove old lib dir
      ansible.builtin.file:
        path: "{{ slurm_install_prefix }}/lib/slurm"
        state: absent

- name: Make build directory
  ansible.builtin.file:
    path: "{{ slurm_build_dir }}"
    state: directory
    mode: "0755"
  when: slurm_build

- name: Fetch and unpack the Slurm source
  ansible.builtin.include_role:
    name: download
  vars:
    download_url: "{{ slurm_src_url }}"
    download_checksum: "{{ slurm_checksums[slurm_version] | default('') }}"
    download_dest: "/var/cache/deepops/{{ slurm_src_url | basename }}"
    download_unpack: "{{ slurm_build_dir }}"
    download_strip: 1
  when: slurm_build

- name: Clean src dir
  ansible.builtin.command: make distclean
  args:
    chdir: "{{ slurm_build_dir }}"
  failed_when: false
  when: slurm_build

# --with-lua is appended here rather than baked into slurm_configure so that
# sites overriding the configure line keep working and the flag stays opt-in.
- name: Configure
  ansible.builtin.command: "{{ slurm_configure }}{{ ' --with-lua' if slurm_build_lua | bool else '' }}"
  args:
    chdir: "{{ slurm_build_dir }}"
  when: slurm_build and (not slurm_autodetect_nvml)

- name: Configure
  ansible.builtin.command: "{{ slurm_configure_nvml }}{{ ' --with-lua' if slurm_build_lua | bool else '' }}"
  args:
    chdir: "{{ slurm_build_dir }}"
  when: slurm_build and slurm_autodetect_nvml

- name: Build
  ansible.builtin.shell: "make -j$(nproc) > build.log 2>&1"
  args:
    chdir: "{{ slurm_build_dir }}"
  when: slurm_build

- name: Build contrib
  ansible.builtin.shell: "make -j$(nproc) contrib >> build.log 2>&1"
  args:
    chdir: "{{ slurm_build_dir }}"
  when: slurm_build

- name: Install
  ansible.builtin.shell: "make -j$(nproc) install >> build.log 2>&1"
  args:
    chdir: "{{ slurm_build_dir }}"
  when: slurm_build
  notify:
    - Restart slurmd
    - Restart slurmdbd
    - Restart slurmctld

- name: Install contrib
  ansible.builtin.shell: "make -j$(nproc) install-contrib >> build.log 2>&1"
  args:
    chdir: "{{ slurm_build_dir }}"
  when: slurm_build
  notify:
    - Restart slurmd
    - Restart slurmdbd
    - Restart slurmctld

- name: Build pam_slurm_adopt
  ansible.builtin.shell: "make -j$(nproc) >> ../../build.log 2>&1"
  args:
    chdir: "{{ slurm_build_dir }}/contribs/pam_slurm_adopt"
  when: slurm_build

- name: Install pam_slurm_adopt
  ansible.builtin.shell: "make -j$(nproc) install >> ../../build.log 2>&1"
  args:
    chdir: "{{ slurm_build_dir }}/contribs/pam_slurm_adopt"
  when: slurm_build
  notify:
    - Restart slurmd
    - Restart slurmdbd
    - Restart slurmctld

- name: Fix library dir permissions
  ansible.builtin.file:
    path: "{{ slurm_install_prefix }}/lib/slurm"
    state: directory
    mode: "0775"

# The directory only: recursing would open everything under it to all, the HA state
# directory with every job's script and environment among them, and report a change
# on every run as new state files appear.
- name: Fix deepops dir permissions
  ansible.builtin.file:
    path: "{{ deepops_dir }}"
    state: directory
    mode: "0755"

- name: Start docker slurm exporter service again
  ansible.builtin.service:
    name: "docker.slurm-exporter.service"
    state: started
  when: slurm_exporter_stopped is changed
