---
- name: Install dependencies (Debian)
  repo_package:
    use: apt
    update_cache: true
    cache_valid_time: 3600
    name: "{{ item }}"
    state: present
  with_items:
    - mariadb-server
    - python3-pymysql
  when: ansible_facts.os_family == "Debian"

- name: Install dependencies (RedHat)
  repo_package:
    use: dnf
    name: "{{ item }}"
    state: present
  with_items:
    - mariadb-server
    - python3-PyMySQL
    - policycoreutils-python-utils
  when: ansible_facts.os_family == "RedHat"

# Earlier versions labelled all of /lib64 mysqld_db_t "so mysql reads libaio": every
# system library then carried a database type other confined services may be denied,
# and restorecon ran on every deploy. The distribution's policy already lets mysqld_t
# read lib_t; the rule goes, and the labels return to the policy's once.
- name: Retire the /lib64 file context earlier versions set
  community.general.sefcontext:
    target: "/lib64(/.*)?"
    setype: mysqld_db_t
    state: absent
  register: slurm_lib64_context
  when:
    - ansible_facts.os_family == "RedHat"
    - (ansible_facts.selinux is defined) and (ansible_facts.selinux.status != "disabled")

- name: Give /lib64 back the policy's labels
  change_command:
    argv: [restorecon, -iR, /lib64]
  when: slurm_lib64_context is changed

# Boot-enable MariaDB on both families (slurmdbd + the mysql_user task depend on it,
# and it must survive a reboot). On Debian the apt preset starts it but does not
# guarantee enablement.
- name: Start mariadb
  systemd_unit:
    name: mariadb
    state: started
    enabled: true
    daemon_reload: true

# The database is MariaDB, whose modules are ansible.mariadb's (ansible.mysql warns
# that it drops MariaDB in 6.0.0).
- name: Setup slurm db user
  ansible.mariadb.mariadb_user:
    name: "{{ slurm_db_username }}"
    password: "{{ slurm_db_password }}"
    host: localhost
    priv: "*.*:USAGE/slurm_acct_db.*:ALL"
    state: present
    # Authenticate over the local MariaDB unix socket -- on Debian/Ubuntu
    # root@localhost uses unix_socket auth by default. Path is OS-specific.
    login_user: root
    login_unix_socket: "{{ '/var/run/mysqld/mysqld.sock' if ansible_facts.os_family == 'Debian' else '/var/lib/mysql/mysql.sock' }}"
  become: true


# Config is root's and Slurm only reads it (slurmdbd.conf, a file, is the one Slurm
# must own). The state directory holds every job's script and environment, which can
# carry secrets, so only Slurm may read it.
- name: Create the slurm config directory
  ansible.builtin.file:
    path: "{{ slurm_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create slurm directories
  ansible.builtin.file:
    path: "{{ slurm_log_dir }}"
    state: directory
    owner: slurm
    mode: "0755"

- name: Create the slurm state directory
  ansible.builtin.file:
    path: "{{ slurm_state_save_location }}"
    state: directory
    owner: slurm
    mode: "0700"

# slurmctld refuses to start when ClusterName differs from the name its state was
# saved under (StateSaveLocation/clustername), and the accounting database keeps a
# cluster's history under its name. Renaming is its own playbook, never a side
# effect of a deploy.
- name: Read the name the controller's state belongs to
  ansible.builtin.slurp:
    src: "{{ slurm_state_save_location }}/clustername"
  register: slurm_state_clustername
  failed_when: false

- name: Refuse a ClusterName change
  vars:
    _saved: "{{ (slurm_state_clustername.content | b64decode).split('|') | first | trim }}"
  ansible.builtin.assert:
    that: _saved == slurm_cluster_name
    fail_msg: >-
      slurm_cluster_name is {{ slurm_cluster_name }} but this controller's state belongs to
      {{ _saved }}. Renaming a cluster empties its queue and starts a new accounting
      history: playbooks/slurm-cluster/slurm-cluster-rename.yml
      (docs/slurm-cluster/slurm-upgrade.md). To keep the name, set slurm_cluster_name: {{ _saved }}.
    quiet: true
  when: slurm_state_clustername.content is defined

# One place works out each node's TmpDisk, for the bundled template and a site's own:
# its job filesystem (roles/job_scratch, the local fact) in whole MiB rounded down to a
# GiB like RealMemory (never above what slurmd measures, which drains the node), only
# with per-job private directories on it; nodes without one are not listed.
- name: Work out each node's TmpDisk
  ansible.builtin.set_fact:
    slurm_tmp_disk: >-
      {%- set ns = namespace(out={}) -%}
      {%- for node in groups['slurm-node'] if slurm_job_private_dirs | length > 0 -%}
      {%- set mb = hostvars[node]['ansible_facts']['ansible_local']['job_scratch']['size_mb'] | default(0) | int // 1024 * 1024 -%}
      {%- if mb > 0 %}{% set ns.out = ns.out | combine({node: mb}) %}{% endif -%}
      {%- endfor -%}
      {{ ns.out }}
  tags:
    - config

# The nodes run on what this slurm.conf says (configless): it must serve them their
# configuration and carry the cluster's name, also when it is a site's own template.
- name: Check the slurm.conf template
  vars:
    _conf: "{{ lookup('ansible.builtin.template', slurm_conf_template) }}"
    _params: "{{ (_conf | regex_findall('(?m)^ *SlurmctldParameters *= *(.+)') | last | default('') | trim).split(',') }}"
    _prolog_flags: "{{ (_conf | regex_findall('(?m)^ *PrologFlags *= *(.+)') | last | default('') | trim).split(',') }}"
    _namespace: "{{ ['namespace/linux'] if slurm_job_private_dirs | length > 0 else [] }}"
    _notices: "{{ deepops_components.job_notice | default('absent') == 'present' }}"
    _health_timeout: "{{ _conf | regex_findall('(?m)^ *HealthCheckTimeout *= *([0-9]+)') | last | default(60) | int }}"
    _tmp_disk_set: "{{ _conf | regex_findall('(?m)^ *NodeName=(\\S+) .*\\bTmpDisk=([0-9]+)') | map('join', '=') | sort }}"
    _tmp_disk_wanted: "{{ slurm_tmp_disk | dict2items | map(attribute='key') | zip(slurm_tmp_disk | dict2items | map(attribute='value') | map('string')) | map('join', '=') | sort }}"
  ansible.builtin.assert:
    that:
      - _conf | regex_findall('(?m)^ *ClusterName *= *(.+)') | map('trim') | list == [slurm_cluster_name]
      - "'enable_configless' in _params"
      - _conf | regex_findall('(?m)^ *PluginDir *= *(.+)') | map('trim') | reject('eq', slurm_plugin_dir) | list | length == 0
      - _conf | regex_findall('(?m)^ *NamespaceType *= *(.+)') | map('trim') | list == _namespace
      - _conf | regex_findall('(?m)^ *JobContainerType *=') | length == 0
      - _namespace | length == 0 or 'Contain' in _prolog_flags
      - not _notices or _conf | regex_findall('(?m)^ *MailProg *= *(.+)') | map('trim') | list == [job_notice_command]
      - slurm_health_check_program != nhc_program or nhc_timeout | int < _health_timeout | int
      - _namespace | length == 0 or _conf | regex_findall('(?m)^ *TmpFS *= *(.+)') | map('trim') | list == [slurm_job_private_base]
      - _tmp_disk_set == _tmp_disk_wanted
    fail_msg: >-
      {{ slurm_conf_template }} must set ClusterName={{ '{{' }} slurm_cluster_name {{ '}}' }}
      and include enable_configless in SlurmctldParameters (the nodes fetch their
      configuration from slurmctld, slurmd --conf-server, and have no copy of their own),
      and set no PluginDir other than the packages' {{ slurm_plugin_dir }} (best: none).
      Per-job private directories follow slurm_job_private_dirs alone: NamespaceType=namespace/linux
      with Contain in PrologFlags when it lists any, else no NamespaceType, and never
      JobContainerType (deprecated: Slurm warns it was replaced with NamespaceType).
      With job notices on this host (slurm_enable_job_notices), MailProg={{ '{{' }} job_notice_command {{ '}}' }}
      ({{ job_notice_command }}): any other MailProg sends them as local mail.
      With NHC as the health check, HealthCheckTimeout (60 when unset) above NHC's own
      bound, nhc_timeout ({{ nhc_timeout }} s): slurmd kills it otherwise, mid-check.
      With per-job private directories, TmpFS={{ '{{' }} slurm_job_private_base {{ '}}' }}
      ({{ slurm_job_private_base }}), and on each node's line TmpDisk={{ '{{' }} slurm_tmp_disk[node] {{ '}}' }}
      where slurm_tmp_disk has the node, nowhere else (wanted {{ _tmp_disk_wanted }},
      found {{ _tmp_disk_set }}).
    quiet: true
  tags:
    - config

# The source build's PluginDir (/usr/local/lib/slurm) is gone after the move to the
# packages; slurmdbd would start without its plugins.
- name: Check the slurmdbd.conf template
  vars:
    _conf: "{{ lookup('ansible.builtin.template', slurm_dbd_conf_template) }}"
  ansible.builtin.assert:
    that: _conf | regex_findall('(?m)^ *PluginDir *= *(.+)') | map('trim') | reject('eq', slurm_plugin_dir) | list | length == 0
    fail_msg: >-
      {{ slurm_dbd_conf_template }} sets a PluginDir other than the packages'
      {{ slurm_plugin_dir }}; leave PluginDir out.
    quiet: true  # never prints the rendered file, which holds the database password
  tags:
    - config

# Kept to go back to when slurmctld refuses what this run writes (controller_restart.yml).
- name: Read the controller configuration this run may change
  ansible.builtin.slurp:
    src: "{{ slurm_config_dir }}/{{ item }}"
  loop: "{{ slurm_controller_conf_files }}"
  register: slurm_conf_before
  failed_when: false  # a file not written yet
  tags:
    - always

- name: Check slurm.conf's timers agree with each other
  ansible.builtin.assert:
    that: _problems | length == 0
    fail_msg: "slurm.conf: {{ _problems | join('; ') }} (plugins/filter/slurm_conf.py)"
    quiet: true
  vars:
    _problems: "{{ lookup('ansible.builtin.template', slurm_conf_template) | slurm_timer_problems }}"
  tags:
    - config

- name: Check the programs slurmctld runs are installed
  ansible.builtin.include_tasks:
    file: programs.yml
    apply:
      tags:
        - config
  vars:
    slurm_programs_daemon: slurmctld
    slurm_programs_keys: [MailProg, PrologSlurmctld, EpilogSlurmctld, ResumeProgram, SuspendProgram, ResumeFailProgram]
  tags:
    - config

- name: Configure slurm.conf
  ansible.builtin.template:
    src: "{{ slurm_conf_template }}"
    dest: "{{ slurm_config_dir }}/slurm.conf"
    mode: "0644"
  notify:
    - Restart slurmctld
    - Reconfigure slurmd
  tags:
    - config

# job_submit.lua when the lua plugin is enabled: the role's template rendered from
# slurm_job_submit_policy (only its [1] block is Jinja; the Lua is raw), or a site's own
# file installed as it is. Only slurmctld reads it. https://slurm.schedmd.com/job_submit_plugins.html
# The rendered one reads the submission holds where roles/submit_holds writes them.
- name: Configure job_submit.lua
  ansible.builtin.template:
    src: "{{ slurm_job_submit_template }}"
    dest: "{{ slurm_config_dir }}/job_submit.lua"
    mode: "0644"
  vars:
    job_submit_holds_file: "{{ slurm_submit_holds_file if deepops_components.submit_holds | default('absent') == 'present' else '' }}"
  when:
    - "'lua' in (slurm_job_submit_plugins)"
    - slurm_job_submit_template is match('.*[.]j2$')
  notify:
    - Restart slurmctld
  tags:
    - config

- name: Install the site's own job_submit.lua
  ansible.builtin.copy:
    src: "{{ slurm_job_submit_template }}"
    dest: "{{ slurm_config_dir }}/job_submit.lua"
    mode: "0644"
  when:
    - "'lua' in (slurm_job_submit_plugins)"
    - slurm_job_submit_template is not match('.*[.]j2$')
  notify:
    - Restart slurmctld
  tags:
    - config

- name: Configure the SPANK plugins (pyxis)
  ansible.builtin.include_tasks: plugstack.yml
  tags:
    - always

- name: Configure slurmdbd.conf
  diff: false  # the file holds a secret; --diff would print it
  ansible.builtin.template:
    src: "{{ slurm_dbd_conf_template }}"
    dest: "{{ slurm_config_dir }}/slurmdbd.conf"
    owner: "{{ slurm_username }}"
    mode: "0600"
  notify:
    - Restart slurmdbd
  tags:
    - config

# cgroup.conf and gres.conf live only here: slurmctld serves them to every slurmd with
# slurm.conf (configless).
- name: Configure cgroup.conf
  ansible.builtin.template:
    src: "{{ slurm_cgroup_conf_template }}"
    dest: "{{ slurm_config_dir }}/cgroup.conf"
    mode: "0644"
  notify:
    - Restart slurmctld
    - Reconfigure slurmd
  tags:
    - config

- name: Configure gres.conf
  ansible.builtin.template:
    src: "{{ slurm_gres_conf_template }}"
    dest: "{{ slurm_config_dir }}/gres.conf"
    mode: "0644"
  notify:
    - Restart slurmctld
    - Reconfigure slurmd
  tags:
    - config

# Per-job private directories (slurm_job_private_dirs); slurm.conf names the plugin.
# slurmd exits on a namespace.yaml it refuses (a duplicate path, a base among the
# directories), and pam_slurm_adopt then closes SSH to the node: refuse it here.
- name: Check the per-job private directories
  vars:
    _paths: "{{ slurm_job_private_dirs + [slurm_job_private_base] }}"
  ansible.builtin.assert:
    that:
      - _paths | select('match', '^/[^ ,]*[^/ ,]$') | list | length == _paths | length
      - slurm_job_private_dirs | unique | length == slurm_job_private_dirs | length
      - slurm_job_private_base is not match('^(' ~ slurm_job_private_dirs | map('regex_escape') | join('|') ~ ')(/|$)')
    fail_msg: >-
      slurm_job_private_dirs must list distinct absolute directories (no trailing slash,
      no commas or spaces), and slurm_job_private_base, an absolute directory on
      node-local disk, must be none of them and lie under none of them
      (got {{ slurm_job_private_dirs }} and {{ slurm_job_private_base }}).
    quiet: true
  when: slurm_job_private_dirs | length > 0
  tags:
    - config

- name: Configure namespace.yaml
  ansible.builtin.template:
    src: etc/slurm/namespace.yaml
    dest: "{{ slurm_config_dir }}/namespace.yaml"
    mode: "0644"
  when: slurm_job_private_dirs | length > 0
  notify:
    - Restart slurmctld
    - Reconfigure slurmd
  tags:
    - config

- name: Remove namespace.yaml
  ansible.builtin.file:
    path: "{{ slurm_config_dir }}/namespace.yaml"
    state: absent
  when: slurm_job_private_dirs | length == 0
  notify:
    - Restart slurmctld
    - Reconfigure slurmd
  tags:
    - config

# Restart only when its configuration or binaries changed (the handlers), then make
# sure it runs. An unconditional restart dropped every client connection on each run.
- name: Apply a pending slurmdbd restart
  ansible.builtin.meta: flush_handlers

- name: Start slurmdbd
  systemd_unit:
    name: slurmdbd
    state: started
    enabled: true
    daemon_reload: true

# The packaged unit is Type=simple: the start returns at once, and after an upgrade
# slurmdbd converts the database before it listens.
- name: Wait for slurmdbd to be available
  ansible.builtin.wait_for:
    port: 6819
    delay: 5
    timeout: "{{ slurm_dbd_wait_timeout }}"

# Each add runs only when sacctmgr does not list it yet (unless: a read that runs under
# --check too), so a preview shows only what a run adds.
- name: Create cluster
  change_command:
    argv: [sacctmgr, -i, add, cluster, "{{ slurm_cluster_name }}"]
    unless: [sh, -c, 'sacctmgr -nP show cluster format=cluster | grep -qxF -- "$1"', sh, "{{ slurm_cluster_name }}"]
  run_once: true

# Without an accounting file (slurm_accounting_file), one flat account holds the users
# named in slurm_acct_users. With a file, the slurm_accounting module below owns every
# account and association, and these two tasks would fight it. Both name this cluster:
# sacctmgr adds an account or a user to every cluster in the database by default, a
# name retired by a rename among them.
- name: Create account
  when: slurm_accounting_file | length == 0
  change_command:
    argv: [sacctmgr, -i, add, account, "{{ slurm_acct_account }}", "cluster={{ slurm_cluster_name }}",
           Description=Compute Accounts, "Organization={{ slurm_acct_organization }}"]
    unless: [sh, -c, 'sacctmgr -nP show account where name="$1" format=account | grep -qxF -- "$1"', sh,
             "{{ slurm_acct_account }}"]

- name: Create users
  when: slurm_accounting_file | length == 0
  change_command:
    argv: [sacctmgr, -i, create, user, "{{ item }}", "account={{ slurm_acct_account }}",
           "cluster={{ slurm_cluster_name }}", adminlevel=None]
    unless: [sh, -c, 'sacctmgr -nP show assoc where user="$1" account="$2" cluster="$3" format=user | grep -qxF -- "$1"',
             sh, "{{ item }}", "{{ slurm_acct_account }}", "{{ slurm_cluster_name }}"]
  loop: "{{ slurm_acct_users }}"

# Under any --tags: a restart the handlers noted must not be dropped.
- name: Run slurmctld on its configuration
  ansible.builtin.include_tasks:
    file: controller_restart.yml
    apply:
      tags: [always]
  tags:
    - always

# QoS, accounts and members from the site's declaration (slurm_accounting_file), for
# this cluster's associations (slurm_cluster_name), so a renamed cluster gets its own.
# The slurm.conf priority settings go along so the module can refuse a QoS layout in
# which association priority, fairshare and age could lift a job into the next tier.
- name: Converge Slurm accounting
  when: slurm_accounting_file | length > 0
  # Bounds the sacctmgr calls: a stuck slurmdbd would otherwise hang the play.
  timeout: 600
  tags:
    - accounting
    - people
  vars:
    _slurm_conf_rendered: "{{ lookup('ansible.builtin.template', slurm_conf_template) }}"
    _slurm_priority: "{{ _slurm_conf_rendered | regex_findall('(?m)^(Priority\\w+)=(\\S+)') | community.general.dict }}"
    _slurm_spec: "{{ lookup('ansible.builtin.file', slurm_accounting_file) | from_yaml }}"
  slurm_accounting:
    spec: "{{ _slurm_spec | combine({'users': (_slurm_spec.users | default({})) | combine(slurm_accounting_users, recursive=true)}) }}"
    sacctmgr: "{{ slurm_install_prefix }}/bin/sacctmgr"
    cluster: "{{ slurm_cluster_name }}"
    prune: "{{ slurm_accounting_prune }}"
    revoke: "{{ slurm_accounting_revoke }}"
    priority_flags: "{{ (_slurm_priority.PriorityFlags | default('')).split(',') | select | list }}"
    # A preempted job gets as long to stop as one at its time limit: slurm.conf's
    # KillWait (Slurm's default 30 s when unset), one value for both.
    preempted_grace_time: "{{ (_slurm_conf_rendered | regex_findall('(?m)^KillWait=(\\d+)') | first | default(30)) | int }}"
    priority_weights:
      qos: "{{ _slurm_priority.PriorityWeightQOS | default(0) }}"
      assoc: "{{ _slurm_priority.PriorityWeightAssoc | default(0) }}"
      fairshare: "{{ _slurm_priority.PriorityWeightFairshare | default(0) }}"
      age: "{{ _slurm_priority.PriorityWeightAge | default(0) }}"
