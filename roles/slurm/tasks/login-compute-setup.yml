---
- name: Hide GPUs for regular user logins via sshd.service.
  vars:
    ssh_unit: "{{ 'sshd.service' if ansible_os_family == 'RedHat' else 'ssh.service' }}"
  ansible.builtin.shell: |
    set -o pipefail
    deviceprop=$(systemctl show {{ ssh_unit }} -p DeviceAllow | grep -i nvidiactl)

    if [ -z "$deviceprop" ] ; then
      systemctl set-property {{ ssh_unit }} DeviceAllow="/dev/nvidiactl"
    fi
  args:
    executable: /bin/bash
    creates: "/etc/systemd/system.control/{{ ssh_unit }}.d/50-DeviceAllow.conf"
  when: is_controller
  tags:
    - config

- name: Patch lastuserjob epilog.
  ansible.builtin.blockinfile:
    path: "{{ slurm_config_dir }}/epilog.d/40-lastuserjob-processes"
    block: |2

      if grep -q -w "$SLURM_JOB_USER" {{ slurm_config_dir }}/localusers.backup ; then
          exit 0  # don't revoke access for these users
      fi

    insertafter: "^set -ex"
    marker: "# {mark} ANSIBLE MANAGED BLOCK (ansible-role-slurm)"
  when: is_controller
  notify: Restart slurmctld
  tags:
    - config
