---
# Retire the source build (make install under slurm_source_build_prefix, with its own
# hwloc and PMIx) before the packages go in: its daemons stop, make uninstall runs
# where the build tree is still there, and its library path and systemd units go.
# What make uninstall misses (contrib, the Perl API, other releases' files) is
# stale-files.yml's, on every run.
- name: Stop the source-built daemons
  systemd_unit:
    name: "{{ item }}"
    state: stopped
  loop: [slurmctld, slurmd, slurmdbd]
  failed_when: false

- name: Look for the source build trees
  ansible.builtin.stat:
    path: "{{ item }}/Makefile"
  register: slurm_source_makefiles
  loop:
    - "{{ slurm_source_build_dirs[0] }}"
    - "{{ slurm_source_build_dirs[0] }}/contribs/pam_slurm_adopt"

- name: Uninstall the source build
  change_command:
    argv: [make, uninstall]
    chdir: "{{ item.item }}"
  loop: "{{ slurm_source_makefiles.results | selectattr('stat.exists') | list }}"
  loop_control:
    label: "{{ item.item }}"
  register: slurm_source_uninstall
  failed_when: false

# Its library path in /etc/ld.so.conf.d goes with the other leftovers (stale-files.yml,
# by its text), which refreshes the library cache.
# The packages ship their units in /lib/systemd/system; copies here would shadow them.
# The drop-ins stay: service-files.yml removes the build's PATH one on every run.
- name: Remove the source build's systemd units
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}"
    state: absent
  loop:
    - slurmctld.service
    - slurmd.service
    - slurmdbd.service

- name: Reload systemd for the packaged units
  systemd_unit:
    daemon_reload: true
