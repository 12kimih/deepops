---
# Install the slurm-smd packages of slurm_version from the signed repository in
# slurm_repo_dir (built by packages-build.yml). The version check (version.yml) runs
# first: a change of version goes through the upgrade playbook, never a plain deploy.
- name: Check the installed Slurm version
  ansible.builtin.include_tasks: version.yml

- name: Require the repository public key
  ansible.builtin.assert:
    that: slurm_repo_signing_pubkey_file is file
    fail_msg: >-
      {{ slurm_repo_signing_pubkey_file }} does not exist; the site_secrets play creates
      it (docs/slurm-cluster/slurm-upgrade.md).
    quiet: true
  run_once: true
  delegate_to: localhost

# The flat repository on the shared filesystem, trusted through its own key only; apt
# picks slurm_deb_version over any other version of these packages, and an upgrade
# (unattended, or the maintenance role's) never moves them. Below 1000, so apt itself
# never installs it over a newer one either.
- name: Add the Slurm repository
  ansible.builtin.include_role:
    name: package_repos
    tasks_from: repo
  vars:
    package_repos_repo:
      name: deepops-slurm
      uris: "file:{{ slurm_repo_dir }}"
      suites: [./]
      key_src: "{{ slurm_repo_signing_pubkey_file }}"
      pin: {packages: slurm-smd slurm-smd-*, pin: "version {{ slurm_deb_version }}", priority: 990}
      # The one-line source and the extensionless hold this role wrote before.
      legacy_files: [/etc/apt/sources.list.d/deepops-slurm.list, /etc/apt/preferences.d/deepops-slurm]

- name: Remove the distribution's Slurm, which would conflict with the packages
  ansible.builtin.include_role:
    name: host_baseline
    tasks_from: absent
  vars:
    host_baseline_absent_packages: "{{ slurm_distro_packages[ansible_facts.os_family] }}"

# Only the upgrade playbook gets here with a source build (version.yml refuses it
# otherwise), its daemons stopped.
- name: Remove the retired source build
  ansible.builtin.include_tasks: migrate-source-build.yml
  when: slurm_source_build | bool

# dpkg starts and restarts no Slurm daemon (the packages are built that way); the
# handlers restart them in Slurm's order: slurmdbd, slurmctld, slurmd.
- name: Install the Slurm packages
  ansible.builtin.apt:
    name: "{{ _packages | map('regex_replace', '$', '=' ~ slurm_deb_version) | list + [slurm_pmix_runtime_package] }}"
    state: present
    update_cache: true
    allow_downgrade: false
    lock_timeout: 600
  vars:
    _packages: >-
      {{ slurm_packages_common
         + (slurm_packages_controller if is_controller else [])
         + (slurm_packages_compute if is_compute else [])
         + (slurm_packages_client if not (is_controller or is_compute) else []) }}
  notify:
    - Restart slurmdbd
    - Restart slurmctld
    - Restart slurmd
    - Restart sackd
