---
# The packages ship the units (/lib/systemd/system); only what this cluster needs on
# top of them is a drop-in here.

# On a major upgrade slurmdbd converts the accounting database before it is ready,
# which can take far longer than systemd's start timeout; killed part-way, the
# conversion is left half done. Its start is therefore never timed out (Slurm's upgrade
# guide), should the unit wait for readiness (the 26.05 one is Type=simple and does not).
- name: Let slurmdbd finish a database conversion
  when: is_controller
  block:
    - name: Create slurmdbd systemd override directory
      ansible.builtin.file:
        path: /etc/systemd/system/slurmdbd.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Do not time out the slurmdbd start
      ansible.builtin.copy:
        dest: /etc/systemd/system/slurmdbd.service.d/10-start-timeout.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          [Service]
          TimeoutStartSec=infinity
      register: slurmdbd_timeout

    # Only systemd reads it; slurmdbd needs no restart for this.
    - name: Reload systemd for the slurmdbd override
      ansible.builtin.systemd:
        daemon_reload: true
      when: slurmdbd_timeout is changed

# The packaged commands are in /usr/bin, on systemd's own PATH: the drop-in that put a
# custom prefix on slurmd's PATH is no longer needed.
- name: Remove the slurmd PATH drop-in
  ansible.builtin.file:
    path: /etc/systemd/system/slurmd.service.d/10-slurm-path.conf
    state: absent
  notify: Restart slurmd
