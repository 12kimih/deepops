---
- name: Restart munge
  ansible.builtin.service:
    name: munge
    state: restarted

# Handlers run in the order written here, not notified: slurmdbd, then slurmctld, then
# slurmd, the order Slurm requires on an upgrade (a daemon may talk only to one of the
# same or a newer release).
- name: Restart slurmdbd
  ansible.builtin.systemd:
    name: slurmdbd
    state: restarted
    daemon_reload: true
  when: is_controller

- name: Restart slurmctld
  ansible.builtin.systemd:
    name: slurmctld
    state: restarted
    daemon_reload: true
  when: is_controller

# The nodes keep the configuration slurmctld served them until told to fetch it again
# (configless); slurmctld must answer first, which it may not yet right after a restart.
- name: Reconfigure slurmd
  change_command:
    argv: ["{{ slurm_install_prefix }}/bin/scontrol", reconfigure]
  register: slurm_reconfigure
  until: slurm_reconfigure is succeeded
  retries: 12
  delay: 5
  when: is_controller

- name: Restart slurmd
  ansible.builtin.systemd:
    name: slurmd
    state: restarted
    daemon_reload: true
  when: is_compute

- name: Restart sackd
  ansible.builtin.systemd:
    name: sackd
    state: restarted
    daemon_reload: true
  when: not (is_compute or is_controller)

- name: Restart logind
  ansible.builtin.service:
    name: systemd-logind.service
    state: restarted
    enabled: true
  when: is_compute
