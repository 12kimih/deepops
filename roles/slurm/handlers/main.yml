---
- name: Restart munge
  ansible.builtin.service:
    name: munge
    state: restarted

# Handlers run in the order written here, not notified: slurmdbd, then slurmctld, then
# slurmd, the order Slurm requires on an upgrade (a daemon may talk only to one of the
# same or a newer release).
- name: Restart slurmdbd
  ansible.builtin.systemd:
    name: slurmdbd
    state: restarted
    daemon_reload: true
  when: is_controller

- name: Restart slurmctld
  ansible.builtin.systemd:
    name: slurmctld
    state: restarted
    daemon_reload: true
  when: is_controller

- name: Restart slurmd
  ansible.builtin.systemd:
    name: slurmd
    state: restarted
    daemon_reload: true
  when: is_compute

- name: Restart logind
  ansible.builtin.service:
    name: systemd-logind.service
    state: restarted
    enabled: true
  when: is_compute

- name: Restart rsyslog
  ansible.builtin.service:
    name: rsyslog
    state: restarted
