---
- name: Restart munge
  systemd_unit:
    name: munge
    state: restarted

# Handlers run in the order written here, not notified: slurmdbd, then slurmctld, then
# slurmd, the order Slurm requires on an upgrade (a daemon may talk only to one of the
# same or a newer release). slurmctld's restart and the nodes' reconfigure are only
# noted here and done by tasks/controller_restart.yml, after slurmdbd answers, where a
# configuration slurmctld refuses can still be put back: a handler cannot be undone.
- name: Restart slurmdbd
  systemd_unit:
    name: slurmdbd
    state: restarted
    daemon_reload: true
  when: is_controller

- name: Restart slurmctld
  ansible.builtin.set_fact:
    slurm_ctld_restart_pending: true
  when: is_controller

# The nodes keep the configuration slurmctld served them until told to fetch it again
# (configless).
- name: Reconfigure slurmd
  ansible.builtin.set_fact:
    slurm_reconfigure_pending: true
  when: is_controller

- name: Restart slurmd
  systemd_unit:
    name: slurmd
    state: restarted
    daemon_reload: true
  when: is_compute

- name: Restart sackd
  systemd_unit:
    name: sackd
    state: restarted
    daemon_reload: true
  when: not (is_compute or is_controller)

- name: Restart logind
  systemd_unit:
    name: systemd-logind.service
    state: restarted
    enabled: true
  when: is_compute
