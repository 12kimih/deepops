---
# Debian multiarch tuple for the PAM module directory. This is an explicit map
# because the tuple is not derivable from ansible_facts.architecture: armv7l maps to
# arm-linux-gnueabihf and ppc64le to powerpc64le-linux-gnu, neither of which
# follows the "<arch>-linux-gnu" shape. Add an entry here for a new architecture.
# 'arm64' matches existing practice in roles/nvidia-dgx/vars/ubuntu-24.04.yml.
slurm_pam_arch_map:
  x86_64: x86_64-linux-gnu
  aarch64: aarch64-linux-gnu
  arm64: aarch64-linux-gnu
  armv7l: arm-linux-gnueabihf
  ppc64le: powerpc64le-linux-gnu

slurm_pam_lib_dir: "/lib/{{ slurm_pam_arch_map.get(ansible_facts.architecture, ansible_facts.architecture + '-linux-gnu') }}/security"

# Build dependencies per the Slurm 25.11.x admin quickstart. libdbus-1-dev and
# libbpf-dev are needed for the cgroup/v2 plugin; libnuma-dev and libreadline-dev
# enable NUMA affinity and interactive scontrol (Lua comes from slurm_lua_deps). libmariadb-dev provides the MariaDB client dev headers (mysql-compatible,
# incl. mysql.h) for the accounting store -- it exists on 24.04 and coexists with an
# already-installed MariaDB. Do NOT use default-libmysqlclient-dev: it pulls
# libmysqlclient-dev (MySQL) which Conflicts/Breaks an installed libmariadb-dev. The old
# libmariadbclient-dev-compat transitional package was also removed on 24.04, so omit it.
# https://slurm.schedmd.com/archive/slurm-25.11.6/quickstart_admin.html
slurm_build_deps:
  - build-essential
  - libmunge-dev
  - libmariadb-dev
  - libpam0g-dev
  - libdbus-1-dev
  - libbpf-dev
  - libnuma-dev
  - libreadline-dev
  - python3
  - wget

# slurmrestd REST API only (installed when slurm_build_slurmrestd=true). libjwt is
# for slurmrestd's JWT token auth (rest_auth/jwt) and Slurm's auth/jwt plugin.
slurm_slurmrestd_deps:
  - libjson-c-dev
  - libhttp-parser-dev
  - libyaml-dev
  - libjwt-dev

slurm_pmix_deps:
  - build-essential
  - libev-dev
  - libevent-dev
  - zlib1g
  - zlib1g-dev
  - pandoc

slurm_hwloc_deps:
  - build-essential

# Installed only when slurm_build_lua is enabled. Lua 5.3 is available on
# every Ubuntu release DeepOps targets and is supported by Slurm's configure.
slurm_lua_deps:
  - liblua5.3-dev
