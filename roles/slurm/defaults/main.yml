---
# Shared Slurm and DeepOps paths (commands, plugin dir, config dir, host groups, state
# location, ClusterName): roles/slurm_paths and roles/deepops_paths.

# Slurm comes as SchedMD's Debian packages (slurm-smd*), built once per version from
# the checksummed release tarball with the debian/ directory it ships
# (https://slurm.schedmd.com/quickstart_admin.html#debuild), published to a signed
# apt repository on shared storage, and installed on every node at exactly this
# version. Changing the version of an installed cluster is the upgrade playbook's
# job (playbooks/slurm-cluster/slurm-upgrade.yml); the role refuses it otherwise.
# upstream: git https://github.com/SchedMD/slurm slurm-(\d+)-(\d+)-(\d+)-1
slurm_version: "26.05.6"
slurm_src_url: "https://download.schedmd.com/slurm/slurm-{{ slurm_version }}.tar.bz2"
# The release tarball per version (roles/download); add one when changing slurm_version.
# 26.05.6: sha256sum of the download, whose sha512 matches Fedora's sources file.
slurm_checksums:
  "26.05.6": "sha256:386a0d624fa7c730cf4dfa9171bf6dc66b6816b5683242c5271879999a54a9a7"
# The package version the shipped debian/changelog gives a release.
slurm_deb_version: "{{ slurm_version }}-1"
# Rebuild the packages even when the repository already holds this version.
slurm_force_rebuild: false
# The most major releases one upgrade may cross. SchedMD allows three from 24.11 on
# (https://slurm.schedmd.com/upgrades.html); two keeps each step well inside that.
slurm_upgrade_max_majors: 2

# The apt repository: a flat, signed repository on storage every node mounts, written
# only by the build host (slurm-master[0]) as root, so that host must be able to
# (the NFS server, or a local disk exported to the nodes). apt checks its signature
# against slurm_repo_signing_pubkey, so whoever can write the share cannot hand the
# nodes a package.
slurm_repo_dir: "{{ sm_prefix }}/.slurm-repo"
# ASCII-armored OpenPGP secret key that signs the repository, needed on the build host
# only (vault it); its public half is slurm_repo_signing_pubkey. Make the pair once
# (docs/slurm-cluster/slurm-upgrade.md); replacing it is a deliberate step.
slurm_repo_signing_key: ""
slurm_repo_signing_pubkey: ""

# The build: an unprivileged account unpacks and builds; root only installs the build
# dependencies and publishes the result. Never under a world-writable directory.
slurm_deb_build_dir: /var/cache/deepops/build/slurm-deb
slurm_deb_build_user: slurmbuild
# Build dependencies besides the Build-Depends of the shipped debian/control: NUMA,
# readline, eBPF (cgroup/v2 device constraint), InfiniBand counters
# (acct_gather_interconnect/ofed). Lua 5.4 replaces the control file's 5.3: the
# release Ubuntu ships as current, which job_submit.lua is tested with.
slurm_deb_build_extra_deps: [libbpf-dev, libibmad-dev, libibumad-dev, libnuma-dev, libreadline-dev]
slurm_deb_lua_dev: liblua5.4-dev
# NVML (AutoDetect=nvml) builds against NVIDIA's cuda-nvml-dev package (header and
# link stub, no driver) from the CUDA repository, of the CUDA release the driver branch
# ships with (roles/nvidia_versions): a newer header could call functions the driver
# lacks. The library itself comes from the driver on each GPU node.
slurm_nvml_cuda_version: "{{ nvidia_driver_cuda_release }}"
# Plugins the packages must contain: a missing build dependency drops its plugin
# without failing the build, so the build checks for these.
slurm_deb_required_plugins:
  - acct_gather_interconnect_ofed.so
  - auth_munge.so
  - cgroup_v2.so
  - gpu_nvml.so
  - job_submit_lua.so
  - metrics_openmetrics.so
  - mpi_pmix.so
  - task_cgroup.so

# Packages per kind of host, installed at slurm_deb_version. slurm-smd-dev is on
# every host: SPANK plugins (roles/pyxis) build against it where they load.
slurm_packages_common: [slurm-smd, slurm-smd-client, slurm-smd-dev]
slurm_packages_controller: [slurm-smd-slurmctld, slurm-smd-slurmdbd]
slurm_packages_compute: [slurm-smd-slurmd, slurm-smd-libpam-slurm-adopt, slurm-smd-libpmi2-0]
# Hosts with neither slurmd nor slurmctld (login nodes): sackd fetches the
# configuration from slurmctld for their commands.
slurm_packages_client: [slurm-smd-sackd]
# The PMIx library mpi/pmix loads at run time (the packages build against the
# distribution's libpmix-dev but do not depend on it), on every host srun runs on.
slurm_pmix_runtime_package: "{{ 'libpmix2t64' if ansible_facts.distribution_version is version('24.04', '>=') else 'libpmix2' }}"
# Set only by playbooks/slurm-cluster/slurm-upgrade.yml: lets the role change the
# installed Slurm version (or replace the source build), in the order the playbook runs it.
slurm_upgrade: false
# Seconds to wait for slurmdbd to listen after a start: the first start of a new major
# release converts the accounting database first, which can take tens of minutes.
slurm_dbd_wait_timeout: 3600
# Where slurmd and sackd fetch the configuration (configless): the controllers, in
# order (SlurmctldHost order in slurm.conf).
slurm_conf_servers: >-
  {{ (groups[slurm_controller_group] if slurm_enable_ha else groups[slurm_controller_group][:1])
     | map('regex_replace', '$', ':' ~ slurm_slurmctld_port) | join(',') }}
# Distribution packages removed first, per OS family, so none shadows the packages.
slurm_distro_packages:
  Debian: [slurm, slurm-wlm, slurmctld, slurmdbd, slurmd]
  RedHat: [slurm]

# The retired source build (make install under /usr/local, its own hwloc and PMIx),
# which the upgrade playbook removes from a host before installing the packages.
slurm_source_build_prefix: /usr/local
slurm_source_build_dirs: [/opt/deepops/build/slurm, /opt/deepops/build/hwloc, /opt/deepops/build/pmix]
slurm_source_build_trees: [/opt/deepops/hwloc, /opt/deepops/pmix]

slurm_sysconf_dir: /etc/sysconfig
slurm_contain_ssh: true

slurm_username: slurm
# The MUNGE key every Slurm host shares, a file in the site config kept vault-encrypted
# and copied verbatim. Create it with munge's own tool, or capture a running cluster's
# (docs/slurm-cluster/munge-key.md), then `ansible-vault encrypt` it. Never derived from
# a password: such a key is only as strong as the password, and the derivation followed
# Ansible's hashing internals, so another Ansible could produce a different key.
# https://github.com/dun/munge/wiki/Installation-Guide#creating-a-secret-key
slurm_munge_key_file: "{{ inventory_dir }}/files/munge/munge.key"
slurm_user_uid: 22078
slurm_user_home: /local/slurm

# The slurm user's primary group, pinned to a fixed gid for the same reason the uid
# is pinned. Leaving the gid to the OS makes each node pick the next free number, so
# the same name means a different number per node -- and numbers, not names, are what
# travel: Slurm ships the numeric gid list resolved on the submit node into every job
# (send_gids), and NFS with AUTH_SYS sends numeric uid/gid over the wire. Divergence
# then breaks ownership whenever state is shared or copied numerically
# (`tar --numeric-owner`, `rsync -a`, a spool directory moved onto NFS).
#
# NOTE: applying this to an EXISTING cluster changes the slurm user's primary group
# on nodes that drifted, so restart slurmd/slurmctld afterwards. Set
# slurm_manage_user_gid: false to keep the current behaviour and only pin new nodes
# by hand.
slurm_groupname: slurm
slurm_user_gid: 22078
slurm_manage_user_gid: true

# Users who may SSH to a compute node without a job there (pam_slurm_adopt with
# slurm_restrict_node_access), besides root: /etc/localusers. The list is the whole
# answer, the same whoever runs the play; the user Ansible connects as must be on it
# (or be root), or the next run could not log in, and the play stops to say so.
slurm_allow_ssh_user: []
slurm_db_username: slurm
slurm_db_password: AlsoReplaceWithASecurePasswordInTheVault

# sacctmgr accounting account new users are added to, and its Organization label.
slurm_acct_account: compute-account
slurm_acct_organization: deepops
# Users added to slurm_acct_account when no accounting file is used. It used to be
# whoever ran the play, which made Slurm membership depend on who deployed last.
slurm_acct_users: []


# Controls when a DOWN node will be returned to service. 2 lets nodes auto-recover
# after a clean RebootProgram cycle (driver/firmware updates); 1 leaves them DOWN
# on an unexpected reboot until manual review.
# https://slurm.schedmd.com/slurm.conf.html#OPT_ReturnToService
slurm_return_to_service: 2
slurm_reboot_program: "/bin/systemctl reboot"
slurm_resume_timeout: 900

# Sets: GresTypes=gpu
# Sets: Gres=gpu:{{ gpu_topology|count }}, and AutoDetect=nvml in gres.conf
slurm_manage_gpus: true

# Configuration file templates to use for configuring Slurm.
# The default values are relative paths that will point to files within the
# templates/ directory of this role, but we provide variables so that they
# can be overridden.
slurm_conf_template: "etc/slurm/slurm.conf"
slurm_cgroup_conf_template: "etc/slurm/cgroup.conf"
slurm_gres_conf_template: "etc/slurm/gres.conf"
slurm_dbd_conf_template: "etc/slurm/slurmdbd.conf"
# job_submit.lua is NOT generated by DeepOps -- supply your own and point this at it
# (config.example/files/slurm/job_submit.lua is a starting point). Empty = none.
slurm_job_submit_template: ""
# QoS, accounts and members declared in one YAML file (see
# config.example/files/slurm/accounting.yml); the controller converges the accounting
# database to it with the slurm_accounting module. Empty = accounting is not managed.
slurm_accounting_file: ""
# Also delete the QoS, accounts and associations the file does not list. Off by default:
# they are reported, and a run with -e slurm_accounting_prune=true --check --diff shows
# exactly what would go.
slurm_accounting_prune: false
# Per-user memberships merged into the file's `users`: login -> {accounts, default_account}.
# Lets them come from a people roster (the people_accounting filter) instead of being
# listed per account in the file.
slurm_accounting_users: {}

# job_submit plugin (empty = none; "lua" deploys the job_submit.lua you supply via
# slurm_job_submit_template). All other slurm.conf tuning belongs in your own complete
# template under config/files/slurm/ (slurm_conf_template), not in role variables.
slurm_job_submit_plugins: ""

# Partition OverSubscribe value used by the bundled slurm.conf template ("NO",
# "EXCLUSIVE", "YES" or "FORCE"; see OverSubscribe in slurm.conf(5)). Default: "NO"
# when slurm_manage_gpus is true, otherwise "EXCLUSIVE".
slurm_oversubscribe: "{{ (slurm_manage_gpus == true) | ternary('NO', 'EXCLUSIVE') }}"

# Maximum run time limit for jobs. Format is minutes, minutes:seconds, hours:minutes:seconds, days-hours, days-hours:minutes, days-hours:minutes:seconds or "UNLIMITED". Time resolution is one minute and second values are rounded up to the next minute. This limit does not apply to jobs executed by SlurmUser or user root.
# Sets: MaxTime={{ slurm_max_job_timelimit }}
slurm_max_job_timelimit: INFINITE

# Run time limit used for jobs that don't specify a value. If not set then MaxTime will be used. Format is the same as for MaxTime.
# Sets: DefaultTime={{ slurm_default_job_timelimit }} (empty: left out)
slurm_default_job_timelimit: ""

# The node health check slurmd runs on every node, allocated ones too (HealthCheckNodeState
# ANY,CYCLE): {{ nhc_program }} where playbooks/slurm-cluster/nhc.yml installs NHC;
# empty: none.
slurm_health_check_program: ""

# Set up prolog and epilog
slurm_enable_prolog_epilog: true

# Useful to delete old files (e.g. from previous versions of deepops)
slurm_clear_old_prolog_epilog: false

# How the epilog's "last job of the user" cleanup (scripts 40-lastuserjob-*
# through 50-lastuserjob-*) decides what to remove when a job ends.
#   job:  (default) job-scoped. The cleanup also checks the node's own cgroups
#         and never touches processes of another job of the same user; files and
#         enroot directories are removed only when the user has no other job on
#         the node. Requires cgroup process tracking (ProctrackType=proctrack/cgroup,
#         the default in this role); cgroup v1 and v2 are both understood.
#   user: DEPRECATED. The 26.09 behaviour, rendered byte-for-byte: the cleanup
#         is decided by squeue alone and kills every process the user owns.
#         Kept for one release train as an escape hatch; removed in 27.01.
# See docs/slurm-cluster/epilog-job-scoped-cleanup.md
slurm_epilog_cleanup_scope: job

# Fileglob patterns used to copy prolog, epilog and task prolog files. The task prolog
# runs as the job user before every task of every step; what its parts print as
# `export NAME=value` reaches the task's environment.
prolog_fileglob:
  - "templates/etc/slurm/prolog.d/*"
epilog_fileglob:
  - "templates/etc/slurm/epilog.d/*"
task_prolog_fileglob:
  - "templates/etc/slurm/task-prolog.d/*"

# Each job user's runtime directory on a node (<root>/<uid>, tmpfs), the job's
# XDG_RUNTIME_DIR: a job inherits the login node's, which does not exist on the
# compute node (rootless podman fails on it). The prolog creates it, the task prolog
# exports it, the epilog of the user's last job on the node removes it.
slurm_user_runtime_root: /run/slurm-users

# Disable clearing of shared memory when user login shell exits
slurm_fix_shm: true

# Configure pam_slurm_adopt to adopt processes from user SSH into a job cgroup
slurm_enable_pam_slurm_adopt: true
# Restrict user SSH access to only allow users with a running job
slurm_restrict_node_access: true
