# slurmdbd.conf, rendered by roles/slurm: slurm_dbd_conf_defaults under the site's
# slurm_dbd_conf, and what the role works out; slurmdbd.conf(5). It holds the database
# password: SlurmUser's, mode 0600.
{% for line in [slurm_dbd_conf_defaults, slurm_dbd_conf] | slurm_settings('slurmdbd.conf', fixed=_slurm_dbd_conf_computed) | slurm_lines('slurmdbd.conf') %}
{{ line }}
{% endfor %}
