# slurm.conf, rendered by roles/slurm (docs/slurm-cluster/slurm-conf.md): slurm_conf_defaults
# under the site's slurm_conf, and what the role works out; slurm.conf(5).
{% for line in [slurm_conf_defaults, slurm_conf] | slurm_settings('slurm.conf', fixed=_slurm_conf_computed) | slurm_lines('slurm.conf') %}
{{ line }}
{% endfor %}

# Nodes: what the role measures, slurm_node_policy, the host's slurm_node_conf
{% for node in groups['slurm-node'] %}
{{ [{'NodeName': node}, hostvars[node] | slurm_node_hardware(slurm_manage_gpus, slurm_tmp_disk[node] | default(none)), hostvars[node].slurm_node_policy | default({}), hostvars[node].slurm_node_conf | default({})]
   | slurm_settings('slurm.conf', 'node') | slurm_record('slurm.conf', 'node') }}
{% endfor %}

# Partitions: slurm_partitions over slurm_partition_defaults
{% for partition in slurm_partitions %}
{{ [slurm_partition_defaults, partition] | slurm_settings('slurm.conf', 'partition') | slurm_record('slurm.conf', 'partition') }}
{% endfor %}
