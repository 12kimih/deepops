#
# Example slurm.conf file generated by DeepOps. 
#
# Slurm provides configurator.html
# (in doc/html) to build a configuration file customized
# for your environment.
#
# See the slurm.conf man page for more information.

# Define a name for the cluster
ClusterName={{ slurm_cluster_name }}

# Configure the controllers
{% if slurm_enable_ha %}
{% for node_name in groups['slurm-master'] %}
SlurmctldHost={{ node_name }}
{% endfor %}
{% else %}
SlurmctldHost={{ groups['slurm-master'][0] }}
{% endif %}
StateSaveLocation={{ slurm_state_save_location }}
# The nodes fetch slurm.conf, gres.conf, cgroup.conf and plugstack.conf from slurmctld
# (slurmd --conf-server); none keeps a copy. https://slurm.schedmd.com/configless_slurm.html
SlurmctldParameters=enable_configless
# Scheduler, job, node and partition metrics on slurmctld's port, /metrics/<set>, for
# Prometheus. https://slurm.schedmd.com/metrics.html
MetricsType=metrics/openmetrics

# Basic configuration
SlurmUser={{ slurm_username }}
SlurmctldPort={{ slurm_slurmctld_port }}
SlurmdPort=6818
AuthType=auth/munge
#JobCredentialPrivateKey=
#JobCredentialPublicCertificate=
SlurmdSpoolDir=/var/spool/slurmd
SwitchType=switch/none
SlurmctldPidFile=/run/slurmctld/slurmctld.pid
SlurmdPidFile=/run/slurm/slurmd.pid
ProctrackType=proctrack/cgroup
#FirstJobId=
#MaxJobCount=
#PlugStackConfig=
#PropagatePrioProcess=
#PropagateResourceLimits=
#PropagateResourceLimitsExcept=
PropagateResourceLimitsExcept=MEMLOCK

# Basic job behavior
ReturnToService={{ slurm_return_to_service }}
RebootProgram="{{ slurm_reboot_program }}"
ResumeTimeout={{ slurm_resume_timeout }}

# Use PMIX (the distribution's libpmix) as our default MPI configuration
MpiDefault=pmix

# Prolog/epilog config
{% if slurm_contain_ssh | bool or slurm_job_private_dirs | length > 0 %}
PrologFlags=Alloc,Serial,Contain
{% else %}
PrologFlags=Alloc,Serial
{% endif %}
{% if slurm_job_private_dirs | length > 0 %}
# Per-job private directories: namespace.yaml (slurm_job_private_dirs).
NamespaceType=namespace/linux
{% endif %}
{% if slurm_enable_prolog_epilog %}
Prolog={{ slurm_config_dir }}/prolog.sh
Epilog={{ slurm_config_dir }}/epilog.sh
# Slurm waits for a prolog or epilog for ever by default; one stuck on a hung NFS
# server or controller would hold the node in COMPLETING. Past this it drains instead.
PrologEpilogTimeout=600
# Before every task of every step, as the job user: the job environment the parts in
# task-prolog.d export (XDG_RUNTIME_DIR).
TaskProlog={{ slurm_config_dir }}/task-prolog.sh
{% endif %}
#SrunProlog=
#SrunEpilog=
#TaskEpilog=

{% if slurm_health_check_program %}
# Health checking: every node, allocated ones too, spread over the interval rather than
# all at once (CYCLE), as NHC's README recommends. https://github.com/mej/nhc
HealthCheckProgram={{ slurm_health_check_program }}
HealthCheckInterval=300
HealthCheckNodeState=ANY,CYCLE
{% endif %}

{% if deepops_components.job_notice | default('absent') == 'present' %}
# Job notices (--mail-type) go to Slack, not mail (roles/job_notice)
MailProg={{ job_notice_command }}
{% endif %}

TaskPlugin=affinity,cgroup
#TrackWCKey=no
#TreeWidth=50
{% if slurm_job_private_dirs | length > 0 %}
# The per-job private directories' filesystem: slurmd reports its size, a job's --tmp
# asks for that much of it (roles/job_scratch gives it a filesystem of its own).
TmpFS={{ slurm_job_private_base }}
{% endif %}
#UsePAM=

# TIMERS
SlurmctldTimeout=120
SlurmdTimeout=300
InactiveLimit=0
MinJobAge=300
KillWait=120
Waittime=0

# SCHEDULING
SchedulerType=sched/backfill
#SchedulerAuth=
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory,CR_CORE_DEFAULT_DIST_BLOCK,CR_ONE_TASK_PER_CORE
#PriorityType=priority/multifactor
#PriorityDecayHalfLife=14-0
#PriorityUsageResetPeriod=14-0
#PriorityWeightFairshare=100000
#PriorityWeightAge=1000
#PriorityWeightPartition=10000
#PriorityWeightJobSize=1000
#PriorityMaxAge=1-0

# LOGGING
SlurmctldDebug=3
SlurmctldLogFile={{ slurm_log_files.slurmctld }}
SlurmdDebug=3
SlurmdLogFile={{ slurm_log_files.slurmd }}
JobCompType=jobcomp/none
#JobCompLoc=

# ACCOUNTING
JobAcctGatherType=jobacct_gather/cgroup
#JobAcctGatherFrequency=30
{% if slurm_manage_gpus %}
AccountingStorageTRES=gres/gpu
{% endif %}
#DebugFlags=CPU_Bind,gres
AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageHost={{ groups['slurm-master'][0] }}
#AccountingStorageLoc=
#AccountingStorageEnforce=associations,limits,qos
AccountingStorageUser={{ slurm_db_username }}
AccountingStoragePass=/var/run/munge/munge.socket.2

# COMPUTE NODES
{% if slurm_manage_gpus %}
GresTypes=gpu
{% endif %}
{% for node_name in groups['slurm-node'] %}
{% set memory =  hostvars[node_name]["ansible_facts"]["ansible_local"]["memory"] -%}
{# If the custom fact failed JSON parsing Ansible hands us a string;
   parse it here so a bad fact fails loudly instead of with an opaque
   attribute error on total_mb. -#}
{% if memory is string %}{% set memory = memory | from_json -%}{% endif -%}
{# RealMemory in whole GiB, rounded down: the measured total moves by a few MB with a
   kernel or firmware update, and every change rewrites slurm.conf and restarts every
   daemon. slurm_real_memory (MB) in host_vars fixes it outright. -#}
{% set cpu_topology =  hostvars[node_name]["ansible_facts"]["ansible_local"]["topology"]["cpu_topology"] -%}
{% set gpu_topology =  hostvars[node_name]["ansible_facts"]["ansible_local"]["topology"]["gpu_topology"] -%}
    NodeName={{ node_name }}{{ " " -}}
    {% if slurm_manage_gpus %} {%- if gpu_topology|count %} Gres=gpu:{{ gpu_topology|count }} {% endif -%} {% endif %}
    CPUs={{ cpu_topology.logical_cpus|int }}{{ " " -}}
    Sockets={{ cpu_topology.sockets|int }}{{ " " -}}
    CoresPerSocket={{ cpu_topology.cores_per_socket|int }}{{ " " -}}
    ThreadsPerCore={{ cpu_topology.threads_per_core }}{{ " " -}}
    Procs={{ cpu_topology.sockets|int * cpu_topology.cores_per_socket|int }}{{ " " -}}
    RealMemory={{ hostvars[node_name].slurm_real_memory | default((memory.total_mb | int) // 1024 * 1024) | int }}{{ " " -}}
{# TmpDisk, in whole GiB rounded down like RealMemory (never above what slurmd measures,
   which drains the node), only for a job filesystem of its own (roles/job_scratch). -#}
{% set tmp_disk = hostvars[node_name]["ansible_facts"]["ansible_local"]["job_scratch"]["size_mb"] | default(0) | int // 1024 * 1024 -%}
{% if slurm_job_private_dirs | length > 0 and tmp_disk > 0 %}    TmpDisk={{ tmp_disk }}{{ " " }}{% endif -%}
    State=UNKNOWN
{% endfor %}

# hardcoding the partitions and default memory per node
# TODO: automatically define the partitions by resource
# TODO: set DefMemPerCPU = TotalMemory / LogicalCPUs
PartitionName=batch Nodes=ALL Default=YES DefMemPerCPU=0 State=UP OverSubscribe={{ slurm_oversubscribe }} MaxTime={{ slurm_max_job_timelimit }} {%- if slurm_default_job_timelimit %} DefaultTime={{ slurm_default_job_timelimit }} {% endif -%}
