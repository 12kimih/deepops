# gres.conf, rendered by roles/slurm: slurm_gres_conf_defaults under the site's
# slurm_gres_conf, then each node's slurm_gres lines; gres.conf(5).
{% for line in [slurm_gres_conf_defaults, slurm_gres_conf] | slurm_settings('gres.conf', fixed=_slurm_gres_conf_computed) | slurm_lines('gres.conf') %}
{{ line }}
{% endfor %}
{% for node in groups['slurm-node'] %}
{% for gres in hostvars[node].slurm_gres | default([]) %}
NodeName={{ node }} {{ [gres] | slurm_settings('gres.conf', 'line') | slurm_record('gres.conf', 'line') }}
{% endfor %}
{% endfor %}
