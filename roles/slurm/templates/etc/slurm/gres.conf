{% if slurm_autodetect_nvml -%}
AutoDetect=nvml
{% else -%}
{% set cpu_topology = ansible_facts.local["topology"]["cpu_topology"] -%}
{% set gpu_topology = ansible_facts.local["topology"]["gpu_topology"] -%}
{% for affinity in gpu_topology %}
Name=gpu File=/dev/nvidia{{ loop.index0 }} Cores={{ affinity }}
{% endfor %}
{% endif -%}
