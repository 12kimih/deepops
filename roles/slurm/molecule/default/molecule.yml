---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: slurm-ubuntu-2204
    image: geerlingguy/docker-ubuntu2204-ansible
    cgroupns_mode: host
    pre_build_image: true
    privileged: true
    groups:
      - slurm-master
      - slurm-node

provisioner:
  name: ansible
  # The package build needs slurm_repo_signing_key/pubkey and slurm_munge_key;
  # supply test values here to run this scenario (it is not in CI).
  inventory:
    group_vars:
      all:
        slurm_upgrade: false
  ansible_args:
    - -vv
verifier:
  name: ansible
