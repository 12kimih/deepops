---
# The people's cluster commands, named once for every role that reads them:
# roles/cluster_tools (publishes them) and roles/open_ondemand (the overview page names
# them). Each is described by its own definition (cluster_tools.<name, - as _>.COMMAND).

# Every command deepops ships.
cluster_tools_builtin: [sq, qos, usage]
# The commands deepops shipped and retired since, removed wherever they were published
# (with their completion): `usage` took their place (owner, 2026-11-27). The one place
# that names them: tests/cluster-tools/test_retired_names.py holds the rest of the
# repository to it.
cluster_tools_retired_builtin: [gpu-usage, disk-usage, scratch-space]
# The ones this site publishes, by name, of cluster_tools_builtin. Empty publishes none and
# removes what was published.
cluster_tools_commands: []
