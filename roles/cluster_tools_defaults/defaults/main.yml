---
# The people's cluster commands, named once for every role that reads them:
# roles/cluster_tools (publishes them) and roles/open_ondemand (the overview page names
# them). Each is described by its own definition (cluster_tools.<name, - as _>.COMMAND).

# Every command deepops ships.
cluster_tools_builtin: [sq, qos, usage]
# The commands deepops shipped and retired since, each with what took its place (owner,
# 2026-11-27): removed wherever they were published (with their completion). The one
# place that names them: scripts/deepops/retired_names.py holds deepops to it (and the
# user docs and the site config through site.json commands_retired), and every refusal
# names the replacement from here.
cluster_tools_retired_builtin:
  gpu-usage: usage gpu
  disk-usage: usage disk
  scratch-space: usage disk
# The ones this site publishes, by name, of cluster_tools_builtin. Empty publishes none and
# removes what was published.
cluster_tools_commands: []
