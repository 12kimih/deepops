---
# The shells people log in with: by default every shell the people roster gives an
# active person (roles/people_defaults: people[*].shell, people_default_shell), and bash.
# Each is installed on every host, so a login or an interactive job works on any node
# (an account whose shell a node lacks cannot log in there), and its startup reads
# /etc/profile.d, the one place roles put the login environment (Lmod, the cluster
# tools, CUDA). Names: bash, zsh, tcsh, fish, ksh (sh and dash are always there).
login_shells: "{{ (['bash'] + people | people_shells(people_default_shell) | map('basename') | list) | unique | list }}"
