---
# The record of the units an owner masked (tasks_from: masked).
_host_baseline_masked_record: "{{ deepops_state_dir }}/masked-units/{{ host_baseline_masked_owner }}"
# The packages a host needs: host_baseline_protected_packages (shell-style patterns) and
# every package a component records. A removal never takes one (tasks_from: absent).
_host_baseline_recorded: >-
  {{ (ansible_facts.ansible_local.deepops_components['items'] | default({})).keys()
     | select('match', 'package:') | map('regex_replace', '^package:', '') | list }}
# apt's simulation of the host with $1's packages marked installed by name: against a copy
# of apt's extended_states without their paragraphs (absent means manual), so a preview,
# which marked nothing, plans what the run will do. "<name>+" instead asked apt to
# install each one's candidate, an upgrade the run never makes (a newer kernel shown
# as gained, 2026-11). Arguments: the names, the awk program, then apt-get's.
_host_baseline_simulate: >-
  tmp=$(mktemp) && trap 'rm -f "$tmp"' EXIT &&
  awk -v drop="$1" "$2" /var/lib/apt/extended_states > "$tmp" && shift 2 &&
  LC_ALL=C apt-get -s -q -o "Dir::State::extended_states=$tmp" "$@"
_host_baseline_without_awk: "{{ lookup('ansible.builtin.file', role_path ~ '/../../plugins/apt/paragraphs-without.awk') }}"
_host_baseline_simulation: >-
  {{ ['sh', '-c', _host_baseline_simulate, 'simulate', host_baseline_unmarked | default([]) | join(' '),
      _host_baseline_without_awk] }}
# The pin that keeps the site's absent packages out (tasks/main.yml).
_host_baseline_absent_pin: /etc/apt/preferences.d/deepops-absent
