---
- name: Prepare
  hosts: all
  become: true
  tasks:
    - name: Install cron, a unit enabled by its preset
      ansible.builtin.apt:
        name: cron
        state: present
        update_cache: true

    - name: Mask a unit by hand, which no owner listed
      ansible.builtin.command:
        argv: [systemctl, mask, e2scrub_reap.service]
      changed_when: true
