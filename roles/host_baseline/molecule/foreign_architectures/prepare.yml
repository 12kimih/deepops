---
- name: Prepare
  hosts: all
  become: true
  tasks:
    - name: Add i386, as a desktop driver's installer did
      ansible.builtin.command:
        argv: [dpkg, --add-architecture, i386]
      changed_when: true

    - name: Install a library in both architectures
      ansible.builtin.apt:
        name: [zlib1g, "zlib1g:i386"]
        state: present
        update_cache: true
