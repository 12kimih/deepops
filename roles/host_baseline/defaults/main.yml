---
# host_baseline -- what must NOT be on a host.
#
# Roles install what a host needs; nothing used to remove what someone installed by
# hand and stopped using, so it ran for years unmanaged: a database and a file server
# on a compute node, a web server on every node. This role removes the packages a site
# declares absent. A --check run lists every package apt would remove with them
# (reverse dependencies), so a preview shows the real change. Packages are purged and
# any system service still running a removed program is stopped. Other roles remove
# packages only through here (include_role: host_baseline, tasks_from: absent).
#
# Names may use apt wildcards ("mysql-server*"). Usually set per host role with an
# expression on inventory groups, e.g. a database package absent everywhere but the
# controller. Empty = nothing removed.
host_baseline_absent_packages: []

# What a removal may never take along (tasks_from: absent): a package named for removal
# goes, but one of these that apt would remove with it (a reverse dependency, a freed
# dependency) stops the run before anything is removed. Every package a component
# records (ansible_facts.ansible_local.deepops_components) is protected the same way,
# so removing a desktop never takes the NVIDIA driver that depends on
# xserver-xorg-core. Shell-style patterns.
host_baseline_protected_packages:
  - apt
  - dpkg
  - sudo
  - systemd
  - systemd-sysv
  - openssh-server
  - openssh-client
  - python3
  - netplan.io
  - ubuntu-minimal
  - ubuntu-server
  - ubuntu-standard
  - linux-generic*
  - linux-image-*
  - linux-modules-*
  - slurm-smd*
  - munge

# Units a site keeps off (tasks_from: masked, owner "site"): stopped, disabled and
# masked, so neither a dependency nor a socket starts them; for a service a metapackage
# brings and nothing here uses (multipathd without a SAN). Units not installed are left
# for the run after their package arrives. A unit dropped from the list is unmasked and
# set back to the distribution's preset. Empty = nothing masked by the site.
host_baseline_masked_units: []
# The one way roles mask units (tasks_from: masked): the including role passes an owner
# (names its record under deepops_state_dir) and its units; each owner unmasks only what
# it masked.
host_baseline_masked_owner: site

# Local filesystems' mount options, mount point: options (fstab(5) field 4), for the
# entries already in /etc/fstab (the installer's, by UUID): only the options are set,
# then the filesystem is remounted. A network filesystem is roles/nfs_client's. Usually
# set per host group, e.g. {"/": "defaults,noatime,errors=remount-ro"}. Empty = left as
# they are.
host_baseline_mount_options: {}

# Kernel settings (tasks_from: sysctl): the including role passes both.
host_baseline_sysctls: {}
host_baseline_sysctl_file: ""
# Kernel settings a role no longer sets, put back to the kernel's own values now
# (tasks_from: sysctl_reset), key: value.
host_baseline_sysctls_reset: {}

# Kernel command line and boot loader settings (tasks_from: kernel_args), the one way
# roles set them: a role's own file, never an edit of /etc/default/grub. The including
# role passes host_baseline_kernel_args_owner (names the file), the arguments it needs
# ([] removes them), any other GRUB_* settings (name: value), and why the running kernel
# must take them now (a reboot request; empty: at the next boot).
host_baseline_kernel_args_owner: ""
host_baseline_kernel_args: []
host_baseline_kernel_args_grub: {}
host_baseline_kernel_args_reason: ""

# Packages built per kernel (tasks_from: kernel_packages, Debian family): the kinds the
# including role needs (tools, headers), for the kernel flavour and the running kernel.
host_baseline_kernel_packages: []

# Files to take out of service and keep (tasks_from: set_aside): absolute paths, and the
# directory under /var/backups that holds them.
host_baseline_set_aside_paths: []
host_baseline_set_aside_dir: ""
