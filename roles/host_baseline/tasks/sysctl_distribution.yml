---
# The distribution's files in /etc/sysctl.d as their packages ship them. Roles once
# removed their keys' lines from them (now a role's file is applied last instead), which
# left dpkg conffiles changed: dpkg keeps a changed conffile at every upgrade, so the
# package's own updates to it never arrived. A changed one is written again from the
# installed version's package, checked against the checksum dpkg recorded; a file the
# administrator deleted stays deleted (dpkg's way to drop a conffile), which a reinstall
# with --force-confmiss would bring back with the rest of the package's.
- name: Find the distribution's sysctl.d files changed on the host
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      owners=$(dpkg-query -S /etc/sysctl.d | sed 's/: .*//; s/,//g');
      for package in $owners; do
      version=$(dpkg-query -W -f='${Version}' "$package");
      dpkg --verify "$package" | awk '$2 == "c" && substr($1, 3, 1) == "5" && $3 ~ "^/etc/sysctl[.]d/" { print $3 }' |
      while read -r file; do
      echo "$package $file $version $(dpkg-query -W -f='${Conffiles}' "$package" | awk -v f="$file" '$1 == f { print $2 }')";
      done;
      done
    executable: /bin/bash
  register: host_baseline_sysctl_changed
  changed_when: false
  check_mode: false  # read-only; --check needs the result

- name: Put back the distribution's sysctl.d files
  change_shell:
    cmd: >-
      set -euo pipefail;
      dir=$(mktemp -d); trap 'rm -rf "$dir"' EXIT; cd "$dir";
      apt-get download -q {{ (item.0 ~ '=' ~ item.2) | quote }};
      dpkg-deb --fsys-tarfile ./*.deb | tar -xO {{ ('.' ~ item.1) | quote }} > shipped;
      test "$(md5sum < shipped | cut -d' ' -f1)" = {{ item.3 | quote }};
      cat shipped > {{ item.1 | quote }}
    executable: /bin/bash
  loop: "{{ host_baseline_sysctl_changed.stdout_lines | map('split', ' ') | list }}"
  loop_control:
    label: "{{ item.1 }} ({{ item.0 }} {{ item.2 }})"
