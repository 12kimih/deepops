---
- name: Remove the packages declared absent
  ansible.builtin.include_tasks: absent.yml

# What the site declares absent stays out: apt refuses to install it again (Pin-Priority
# -1, every architecture), so a dependency or a later role that would bring one back
# (snapd by a transitional package, a desktop by a metapackage) fails loudly instead of
# reinstalling it unseen. Only the site's list: a role removing a package to replace it
# (another driver's) may want it back. An empty list removes the pin.
- name: Keep the packages declared absent out (Debian)
  ansible.builtin.copy:
    dest: "{{ _host_baseline_absent_pin }}"
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by roles/host_baseline (host_baseline_absent_packages): never installed again.
      Package: {{ host_baseline_absent_packages | apt_pin_packages }}
      Pin: version *
      Pin-Priority: -1
  when:
    - ansible_facts.os_family == 'Debian'
    - host_baseline_absent_packages | length > 0

- name: Remove the pin when nothing is declared absent (Debian)
  ansible.builtin.file:
    path: "{{ _host_baseline_absent_pin }}"
    state: absent
  when:
    - ansible_facts.os_family == 'Debian'
    - host_baseline_absent_packages | length == 0

- name: Keep only the declared foreign architectures
  ansible.builtin.include_tasks: foreign_architectures.yml

- name: Keep the distribution's sysctl.d files as shipped
  ansible.builtin.include_tasks: sysctl_distribution.yml
  when:
    - ansible_facts.os_family == "Debian"
    - not deepops_containerized | bool

- name: Keep the site's unused units off
  ansible.builtin.include_tasks: masked.yml
  vars:
    host_baseline_masked_owner: site

- name: Set the local filesystems' mount options
  ansible.builtin.include_tasks: mount_options.yml

# What a host keeps after its interpreters change (roles/stale_files): an OS release
# upgrade left python3.10's, ruby 3.0's and perl 5.34's trees and scripts behind.
- name: Remove what retired runtimes left
  ansible.builtin.include_role:
    name: stale_files
