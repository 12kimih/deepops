---
# The one way any role removes packages (include_role: host_baseline, tasks_from:
# absent, with host_baseline_absent_packages set): purged, so no conffile or init script
# is left to start the service again, with the dependencies they alone had pulled in,
# and followed by stopping a daemon that still runs from a removed program.
- name: Remove the packages declared absent
  when: host_baseline_absent_packages | length > 0
  block:
    - name: Make sure the package manager can work
      ansible.builtin.include_role:
        name: maintenance
        tasks_from: apt_health

    # dpkg-query resolves the wildcards; names this release lacks (a list serves several
    # releases) and packages not installed ("?n") drop out. One removed but not purged
    # ("rc": its conffiles and init scripts kept) counts as present: it is purged too.
    - name: Find which of them are on the host (Debian)
      ansible.builtin.command:
        argv: "{{ ['dpkg-query', '-W', '-f', '${db:Status-Abbrev} ${binary:Package}\\n'] + host_baseline_absent_packages }}"
      register: host_baseline_query
      changed_when: false
      failed_when: host_baseline_query.rc > 1
      check_mode: false  # read-only; --check needs the result
      when: ansible_facts.os_family == 'Debian'

    - name: Note the packages to remove
      ansible.builtin.set_fact:
        host_baseline_present: >-
          {{ host_baseline_query.stdout_lines | reject('match', '.n') | map('split') | map('last') | unique | list
          if ansible_facts.os_family == 'Debian' else host_baseline_absent_packages }}

    # What the host needs is marked installed by name before the plan, so no removal can
    # take it as a dependency nothing else holds, whichever role ran first: a desktop's
    # purge would have autoremoved libopengl0, which jobs load and which the driver role
    # installs by name only once it runs (2026-11-22). Only what is installed and marked
    # automatic, and only names given whole: a pattern (linux-image-*) also matches the
    # old kernels, which must stay automatic for apt to remove them; patterns are kept by
    # the refusal below. Nothing is installed.
    - name: Read which packages the host needs are installed (Debian)
      ansible.builtin.command:
        argv: >-
          {{ ['dpkg-query', '-W', '-f', '${db:Status-Abbrev} ${binary:Package}\n']
             + host_baseline_protected_packages | reject('search', '[*?\[]') | list
             + _host_baseline_recorded }}
      register: host_baseline_needed
      changed_when: false
      failed_when: host_baseline_needed.rc > 1
      check_mode: false  # read-only; --check needs the result
      when:
        - ansible_facts.os_family == 'Debian'
        - host_baseline_present | length > 0

    - name: Read which packages apt installed only as dependencies (Debian)
      ansible.builtin.command:
        argv: [apt-mark, showauto]
      register: host_baseline_auto
      changed_when: false
      check_mode: false  # read-only; --check needs the result
      when:
        - ansible_facts.os_family == 'Debian'
        - host_baseline_present | length > 0

    - name: Note the needed packages still marked automatic (Debian)
      ansible.builtin.set_fact:
        host_baseline_unmarked: >-
          {{ host_baseline_needed.stdout_lines | select('match', '.i ') | map('split') | map('last')
             | map('regex_replace', ':.*$', '') | unique | intersect(host_baseline_auto.stdout_lines) | list
             if ansible_facts.os_family == 'Debian' else [] }}
      when: host_baseline_present | length > 0

    - name: Mark them installed by name (Debian)
      change_command:
        argv: "{{ ['apt-mark', 'manual'] + host_baseline_unmarked }}"
      when:
        - host_baseline_present | length > 0
        - host_baseline_unmarked | length > 0

    # apt-get -s works out, without changing anything, what removing them takes with
    # them: their reverse dependencies, and with --autoremove the packages apt installed
    # only as their dependencies. What apt would autoremove already is not this
    # removal's: it stays. A package a person or a role installed by name is marked
    # manual and is never autoremoved; both simulations see the packages just marked as
    # such (_host_baseline_simulate), so a preview plans what the run will do.
    - name: Note what was already unneeded (Debian)
      ansible.builtin.command:
        argv: "{{ _host_baseline_simulation + ['autoremove'] }}"
      register: host_baseline_unneeded_before
      changed_when: false
      check_mode: false  # read-only; --check needs the result
      when:
        - ansible_facts.os_family == 'Debian'
        - host_baseline_present | length > 0

    - name: Work out what removing them would take with them (Debian)
      ansible.builtin.command:
        argv: "{{ _host_baseline_simulation + ['purge', '--autoremove'] + host_baseline_present }}"
      register: host_baseline_plan
      changed_when: false
      check_mode: false  # read-only; --check needs the result
      when:
        - ansible_facts.os_family == 'Debian'
        - host_baseline_present | length > 0

    - name: Note what the removal takes
      ansible.builtin.set_fact:
        host_baseline_removal: >-
          {{ (host_baseline_present
              + (host_baseline_plan.stdout | regex_findall('(?m)^(?:Purg|Remv) (\S+)')
                 | difference(host_baseline_unneeded_before.stdout | regex_findall('(?m)^Remv (\S+)'))))
             | unique | list
             if ansible_facts.os_family == 'Debian' else host_baseline_present }}
      when: host_baseline_present | length > 0

    # A removal of another architecture's packages alone (an i386 left by a desktop driver):
    # every name carries an architecture that is not the host's.
    - name: Note whether the removal is another architecture's alone (Debian)
      ansible.builtin.set_fact:
        host_baseline_removal_foreign: >-
          {{ ansible_facts.os_family == 'Debian' and host_baseline_removal | length > 0
             and host_baseline_removal | reject('search', ':(?!' ~ (ansible_facts.architecture | deb_architecture) ~ '$|all$)') | list | length == 0 }}
      when: host_baseline_present | length > 0

    # What apt would take beyond the packages named: none of it may be protected (a
    # setting's pattern, or a package a component records), checked before anything goes.
    - name: Refuse a removal that takes a protected package with it
      ansible.builtin.assert:
        that: host_baseline_taken | length == 0
        fail_msg: >-
          Removing {{ host_baseline_present | join(', ') }} would also remove
          {{ host_baseline_taken | join(', ') }}, which this host needs (a component
          records it, or host_baseline_protected_packages names it). Name fewer
          packages, or remove that component first.
        quiet: true
      vars:
        host_baseline_taken: >-
          {{ host_baseline_removal | difference(host_baseline_present)
             | map('regex_replace', ':.*$', '') | unique
             | select('in', _host_baseline_recorded)
             | union(host_baseline_removal | difference(host_baseline_present)
                     | map('regex_replace', ':.*$', '') | select('match', _host_baseline_protected_regex))
             | list }}
      when: host_baseline_present | length > 0

    # apt may also install a package to satisfy an alternative the removed one met
    # (removing a web server can pull in a text browser), so both are shown.
    - name: Report the packages that will be removed or installed in their place
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} will lose: {{ host_baseline_removal | join(', ') }}
          {{ '; will gain: ' ~ (host_baseline_plan.stdout | regex_findall('(?m)^Inst (\S+)') | join(', '))
          if host_baseline_plan.stdout is search('(?m)^Inst ') else '' }}
      when:
        - ansible_facts.os_family == 'Debian'
        - host_baseline_present | length > 0

    - name: Remove the packages declared absent
      ansible.builtin.package:
        name: "{{ host_baseline_removal }}"
        state: absent
        purge: "{{ true if ansible_facts.os_family == 'Debian' else omit }}"
      register: host_baseline_removed_native
      when:
        - host_baseline_present | length > 0
        - not host_baseline_removal_foreign

    # Every package another architecture's (tasks_from: foreign_architectures): its
    # Essential packages (libc6:i386) are essential to its own programs only, which go
    # with them, and apt refuses them without being told; the module cannot tell it.
    - name: Remove the packages of another architecture (Debian)
      change_command:
        argv: "{{ ['apt-get', 'purge', '-y', '-q', '--allow-remove-essential'] + host_baseline_removal }}"
      environment:
        DEBIAN_FRONTEND: noninteractive
      register: host_baseline_removed_foreign
      when:
        - host_baseline_present | length > 0
        - host_baseline_removal_foreign

    # A preview removes nothing, so an install later in the run that needs the removal
    # (another driver's packages in the way) would fail its own preview: what the run
    # would remove is noted for it (plugins/action/repo_package.py), as package_repos
    # notes a repository it would add.
    - name: Note what the preview leaves for the run to remove
      ansible.builtin.set_fact:
        host_baseline_unremoved: "{{ (host_baseline_unremoved | default([]) + host_baseline_removal) | unique }}"
      when:
        - ansible_check_mode
        - (host_baseline_removed_native is changed or host_baseline_removed_foreign is changed)

# Only after this run removed something, and only daemons whose own main process runs
# a removed program (files/orphan-services): stopped, never disabled.
- name: Stop the services still running a removed program
  when: (host_baseline_removed_native is changed or host_baseline_removed_foreign is changed)
  block:
    - name: Look for services still running a removed program
      ansible.builtin.script: orphan-services
      register: host_baseline_orphans
      changed_when: false
      check_mode: false  # read-only; --check needs the result

    # systemctl directly: the systemd module refuses a unit whose file went with the
    # package, which is exactly this case. The script module runs under a terminal, so
    # its output carries carriage returns and blank lines: only real lines count.
    - name: Stop the services still running a removed program
      change_command:
        argv: [systemctl, stop, "{{ item.split()[0] }}"]
      loop: "{{ host_baseline_orphans.stdout_lines | map('trim') | select | list }}"
      loop_control:
        label: "{{ item }}"
