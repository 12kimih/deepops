---
# Where Prometheus and its neighbours live, written once here for every role that
# talks to them (prometheus, alertmanager, grafana, the exporters and the textfile
# writers), which depend on this role.
prometheus_config_dir: /etc/prometheus
prometheus_cfg_endpoint_dir: "{{ prometheus_config_dir }}/endpoints"
prometheus_port: 9090
# Where other hosts reach Prometheus' HTTP API (the cluster's commands): the first host
# the prometheus component is on (deepops_components); empty without one.
prometheus_host: >-
  {{ deepops_component_registry | component_hosts(groups, 'prometheus', deepops_component_removals)
     | first | default('') }}
prometheus_url: "{{ 'http://' ~ prometheus_host ~ ':' ~ prometheus_port if prometheus_host else '' }}"
alertmanager_port: 9093
# The exporters' ports (host network), which they listen on and Prometheus scrapes.
node_exporter_port: 9100
ipmi_exporter_port: 9290
dcgm_exporter_port: 9400
# Every exporter Prometheus scrapes: its component (roles/deploy_defaults/vars/main.yml
# says on which hosts it is present), the port and the module label alerts name it by.
prometheus_exporters:
  - {component: node_exporter, port: "{{ node_exporter_port }}", module: node-exporter}
  - {component: ipmi_exporter, port: "{{ ipmi_exporter_port }}", module: ipmi-exporter}
  - {component: dcgm_exporter, port: "{{ dcgm_exporter_port }}", module: dcgm-exporter}
# Where node_exporter's container sees the host's root: its mount table shows every
# host mount under it (mountstats' mountpoint label), which the scrape strips again.
node_exporter_rootfs: /host
# How often Prometheus scrapes, which Grafana also needs to size its queries.
prometheus_cfg_scrape_interval: 15s
# How often the controller writes Slurm's GPU allocation (roles/slurm_metrics' timer), a
# systemd time span in seconds or minutes ("60s", "2min"): usage gpu reads it as the
# shortest window that holds a sample (cluster_tools_lib_derived_info).
slurm_metrics_interval: 60s
# node_exporter's textfile collector directory, which every textfile writer fills.
node_exporter_prom_dir: /run/prometheus
# On a Prometheus host, a second textfile directory: what each host should have of each
# component as the checkouts are now (scripts/deepops/component_expected.py), written by
# roles/prometheus at each run and by scripts/deepops/sync.py after each move of the
# checkouts. Persistent (it changes only then), and writable by component_expected_group,
# the controller user's primary group, so sync.py writes it without root; only when that
# group is the user's own private one (whoever writes it can silence or spoof the alerts
# that read it), root's otherwise (roles/textfile_keep, tasks_from: expected).
component_expected_dir: "{{ deepops_state_dir }}/expected"
# A third textfile directory, on every host: the textfiles of producers that do not run as
# root (the cluster bot, slurmctld's MailProg), which cannot write node_exporter_prom_dir.
# Persistent, root's and group node_exporter_unprivileged_group's, setgid and sticky
# (3775): a member writes its own <name>.prom (atomically, through a temporary file it
# renames), and no one renames over or deletes another's. A service account joins the
# group through its declaration in roles/system_accounts (groups), so the role that makes
# the account adds it (roles/textfile_keep, tasks_from: unprivileged). A producer's file
# goes with its component (its component record lists it).
node_exporter_unprivileged_dir: "{{ deepops_state_dir }}/textfile-unprivileged"
node_exporter_unprivileged_group: cluster-metrics
component_expected_file: component-expected.prom
component_expected_user: "{{ lookup('ansible.builtin.pipe', 'id -un') }}"
component_expected_group: "{{ lookup('ansible.builtin.pipe', 'id -gn') }}"
# A textfile that changes only when a role runs (a fact the deploy knows, roles/
# textfile_keep): kept here and copied into node_exporter_prom_dir at every boot,
# since that directory is a tmpfs.
node_exporter_prom_keep_dir: "{{ deepops_state_dir }}/textfile"
# The tmpfiles entry that makes node_exporter_prom_dir at every boot (roles/textfile_keep,
# tasks_from: directory; node_exporter owns it). Named to sort before each kept file's
# restore line.
node_exporter_prom_dir_tmpfiles: /etc/tmpfiles.d/deepops-textfile-directory.conf
# Grafana's configuration, mounted into its container at /etc/grafana, and in it the
# provisioned dashboards: configuration, so never in its data directory. Grafana and
# every role that ships a dashboard (one subdirectory each, roles/grafana tasks_from
# dashboards) write there.
grafana_config_dir: /etc/grafana
grafana_dashboards_dir: "{{ grafana_config_dir }}/dashboards"
# Every dashboard deepops ships: set (its directory under grafana_dashboards_dir, owned
# by one component) -> files in src/dashboards/. The roles install from here; the tests
# and scripts/validation/validate_monitoring.py read it too.
grafana_dashboard_sets:
  # roles/grafana; slurm-scheduler reads slurmctld's own metrics (prometheus_slurmctld_metrics)
  # storage-io reads io_usage's and io_fairness' metrics; storage-person disk_quota's and
  # io_usage's, through usage io's queries (cluster_tools.io_load)
  deepops: [gpu-nodes.json, node-exporter-hosts.json, slurm-scheduler.json, storage-io.json, storage-person.json]
  slurm_metrics: [slurm-gpu-allocation.json]  # roles/slurm_metrics
# Grafana's public URL (e.g. "http://cluster.example:3000/"): Grafana's own links, and
# the dashboard links alerts and the login banner carry.
grafana_root_url: ""
