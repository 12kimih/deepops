---
nvidia_dcgm_container_version: "4.5.3-4.8.2-distroless"
# The digest pins exactly what runs; change it together with the version.
nvidia_dcgm_container_digest: "sha256:60d3b00ac80b4ae77f94dae2f943685605585ad9e92fdccda3154d009ae317cc"
nvidia_dcgm_container: "nvcr.io/nvidia/k8s/dcgm-exporter:{{ nvidia_dcgm_container_version }}@{{ nvidia_dcgm_container_digest }}"
# Host port the dcgm-exporter is published on; single source of truth for the
# published port (-p) and its scrape target (the container listens on 9400).
nvidia_dcgm_exporter_port: 9400
nvidia_dcgm_container_config_dir: "/opt/deepops/nvidia-dcgm-exporter"
nvidia_dcgm_container_custom_metrics_file: "dcgm-custom-metrics.csv"
nvidia_dcgm_prom_dir: "/run/prometheus"
nvidia_dcgm_svc_name: "docker.dcgm-exporter.service"
nvidia_dcgm_state: started
nvidia_dcgm_enabled: true

nvidia_dcgm_exporter_conf_template: "dcgm-exporter.yml.j2"

has_gpus: false

nvidia_dcgm_max_cpu: "0.5"
