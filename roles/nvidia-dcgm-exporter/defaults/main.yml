---
# present or absent (docs/deepops/component-state.md); a deploy sets it from
# deepops_components.
dcgm_exporter_state: present

# Pinned by tag and digest, like every image (scripts/deepops/image_pins.py pin <tag>).
# The counters file (files/dcgm-custom-metrics.csv) is this release's default-counters.csv
# with deepops' rows enabled: a new release brings its own file to start from.
dcgm_exporter_container: "nvcr.io/nvidia/k8s/dcgm-exporter:4.7.0-4.9.0-distroless@sha256:2490e1dfb5baaee6765ef2841813af7d978bb459a566c22c326a8fc27c64eea9"
dcgm_exporter_config_dir: "/opt/deepops/nvidia-dcgm-exporter"
dcgm_exporter_counters_file: "dcgm-custom-metrics.csv"
dcgm_exporter_svc_name: "docker.dcgm-exporter.service"
dcgm_exporter_service_state: started
dcgm_exporter_service_enabled: true

has_gpus: false

# The container's CPUs and memory (Docker's --cpus and --memory, roles/container_service);
# "" for no limit.
dcgm_exporter_max_cpu: "0.5"
dcgm_exporter_max_memory: "1g"
