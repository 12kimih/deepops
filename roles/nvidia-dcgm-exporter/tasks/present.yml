---
- name: Record what this component installs
  ansible.builtin.include_role:
    name: component_record
  vars:
    component_record_name: dcgm_exporter
    component_record_action: begin
    component_record_items: "{{ dcgm_exporter_items }}"

# Prometheus generates every exporter's scrape targets (roles/prometheus); the file this
# role wrote on each host before goes. Not on a Prometheus host: there the prometheus
# role replaces it with the generated targets, and removing it first, by an exporter
# run ahead of that one, would stop the scrape until then.
- name: Remove the scrape target file this role wrote before
  ansible.builtin.file:
    path: "{{ prometheus_cfg_endpoint_dir }}/dcgm-exporter.yml"
    state: absent
  when: inventory_hostname not in deepops_component_registry | component_hosts(groups, 'prometheus', deepops_component_removals)

- name: Pull the image
  ansible.builtin.include_role:
    name: container_image
  vars:
    container_image: "{{ dcgm_exporter_container }}"

- name: Create dcgm-exporter config dir
  ansible.builtin.file:
    path: "{{ dcgm_exporter_config_dir }}"
    state: directory
    mode: "0755"
  when: has_gpus

- name: Copy metrics file
  ansible.builtin.copy:
    src: "{{ dcgm_exporter_counters_file }}"
    dest: "{{ dcgm_exporter_config_dir }}/{{ dcgm_exporter_counters_file }}"
    owner: "root"
    group: "root"
    mode: "0644"
  when: has_gpus
  notify: Restart dcgm

# The GPUs come through CDI (the toolkit's generated spec), not --gpus: a container
# given them by the legacy hook loses them on every systemd daemon-reload (NVIDIA's
# troubleshooting guide). Host network: the node's own name labels the series, and no
# Docker DNAT bypasses the host firewall. The collectors file is mounted read-only and
# named, as the exporter's docs show.
- name: Run dcgm-exporter
  ansible.builtin.include_role:
    name: container_service
  vars:
    container_service:
      unit: "{{ dcgm_exporter_svc_name }}"
      description: NVIDIA DCGM Exporter
      image: "{{ dcgm_exporter_container }}"
      options: [--device nvidia.com/gpu=all, --cap-add=SYS_ADMIN, "--cpus={{ dcgm_exporter_max_cpu }}", --network host]
      mounts:
        - src: "{{ dcgm_exporter_config_dir }}/{{ dcgm_exporter_counters_file }}"
          dst: /etc/dcgm-exporter/custom-counters.csv
          readonly: true
      args: [--collectors /etc/dcgm-exporter/custom-counters.csv, "--address :{{ dcgm_exporter_port }}"]
      state: "{{ dcgm_exporter_service_state }}"
      enabled: "{{ dcgm_exporter_service_enabled }}"
      notify: [Restart dcgm]
      health_url: "http://localhost:{{ dcgm_exporter_port }}/metrics"
  when: has_gpus

- name: Record the component as present
  ansible.builtin.include_role:
    name: component_record
  vars:
    component_record_name: dcgm_exporter
    component_record_action: present
    component_record_items: "{{ dcgm_exporter_items }}"
    component_record_version: "{{ dcgm_exporter_container | regex_replace('@.*', '') }}"
