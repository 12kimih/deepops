---
- name: Check the component state
  ansible.builtin.assert:
    that: dcgm_exporter_state in ['present', 'absent', 'kept']
    fail_msg: "dcgm_exporter_state must be present, absent or kept, not {{ dcgm_exporter_state }}."
    quiet: true

- name: "Make dcgm_exporter {{ dcgm_exporter_state }}"
  ansible.builtin.include_tasks: "{{ dcgm_exporter_state }}.yml"
  when: dcgm_exporter_state != 'kept'
