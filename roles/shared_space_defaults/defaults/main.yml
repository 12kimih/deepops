---
# The shared space, named once for every role that reads it: roles/shared_space (the
# directories on the home server), the directory roles (the projects' groups, through
# roles/directory_defaults) and roles/cluster_bot (project and shared data requests).
# docs/slurm-cluster/shared-space.md.

# The service account (roles/system_accounts) whose home the shared space is, and that
# alone writes the shared data: /home/shared for the account shared.
shared_space_writer: shared
shared_space_root: "{{ system_accounts[shared_space_writer].home }}"
# The shared data's directories under the root, the writer's alone to write.
shared_space_data: [datasets, models, containers]
# The shared data's one budget, all its directories together. Until /home has project
# quotas the daily disk report shows the usage against it (warned at
# cluster_user_warn_fraction); with them, it is the data's disk_quota project limit
# and shared_space_data_quota is true (docs/slurm-cluster/shared-space.md).
shared_space_data_budget: 20T
shared_space_data_quota: false
# The hosts the cluster bot's downloads may come from, each and any host below it; []
# takes any public https host (cluster_tools.shared_data).
shared_space_data_sources: []
# An entry nobody used for this long (its files' access or modification time) gets a
# notice to its requester, and goes this many days after it unless used meanwhile
# (cluster_bot.data): the cluster's one rule for unused files, as on /scratch.
shared_space_data_stale_days: "{{ cluster_user_stale_days }}"
shared_space_data_grace_days: "{{ cluster_user_grace_days }}"

# Collaboration folders (<shared_space_root>/projects/<name>): the people roster's
# `projects` (checked with the roster, edited by the cluster bot's project requests), each
# {gid, read_gid, owners, members, viewers, purpose}: group <name> for its owners and
# members (read and write), group <name>-read for its viewers (read).
#
#   shared_projects: "{{ people_roster.projects | default({}) }}"
shared_projects: {}
# Where a new project's two GIDs are looked for (the bot's project requests): the lowest
# free from here, never a person's UID or another group's.
shared_projects_gid_min: 50000
