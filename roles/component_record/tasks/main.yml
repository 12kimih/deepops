---
- name: Check the request
  ansible.builtin.assert:
    that:
      - component_record_name | length > 0
      - component_record_action in ['begin', 'present', 'absent']
    fail_msg: component_record needs a name and an action (begin, present or absent).
    quiet: true

# The record and its orphans, worked out without writing: the record is written after
# the orphans are gone (the last task), so a removal that fails midway leaves it as it
# was and the next run finds the same orphans again.
- name: "Work out the record of {{ component_record_name ~ ' (' ~ component_record_action ~ ')' }}"
  component_record:
    path: "{{ component_record_path }}"
    name: "{{ component_record_name }}"
    action: "{{ component_record_action }}"
    items: "{{ component_record_items }}"
    version: "{{ component_record_version | string }}"
    exclusive_packages: "{{ component_record_exclusive_packages }}"
    legacy: "{{ component_record_legacy }}"
    role: "{{ component_record_role }}"
    write: false
  register: component_record_result
  changed_when: false

# The calling role, removed, has nothing to run again after a pending reboot.
- name: Withdraw the removed component's reboot request
  ansible.builtin.file:
    path: "{{ maintenance_reboot_requests_dir }}/{{ component_record_role }}"
    state: absent
  when:
    - component_record_action == 'absent'
    - component_record_role | length > 0

# What this call removed, by kind: only what was there (an orphan adopted on a host that
# never had it removes nothing). Callers restart or rebuild on this, never on the orphans.
- name: Start the list of what was removed
  ansible.builtin.set_fact:
    component_record_removed: {mount: [], container: [], unit: [], file: [], dir: [], package: []}

- name: Remove what no component needs any longer
  when: component_record_result.orphans.values() | map('length') | sum > 0
  vars:
    component_record_orphans: "{{ component_record_result.orphans }}"
  block:
    # The fstab entry only: never an unmount (users' processes may live in it, and a
    # dead server hangs umount). The mount goes at the next boot.
    - name: Remove fstab entries
      ansible.posix.mount:
        path: "{{ item }}"
        state: absent_from_fstab
      loop: "{{ component_record_orphans.mount }}"
      register: component_record_mounts

    # The API is asked, not the socket file (a file with nothing behind it, or none while
    # dockerd runs on). No Docker on the host: no container to remove. Docker installed
    # but not answering: stop, the record kept, rather than lose the containers from it.
    - name: Ask the Docker API
      ansible.builtin.command:
        argv: [docker, info, --format, ok]
      register: component_record_docker
      changed_when: false
      failed_when: false
      check_mode: false  # read-only; --check needs the result
      when: component_record_orphans.container | length > 0

    - name: Stop when Docker is installed but does not answer
      ansible.builtin.assert:
        that: component_record_docker.rc in [0, 127]
        fail_msg: >-
          Containers {{ component_record_orphans.container | join(', ') }} are no longer
          wanted, but Docker does not answer on {{ inventory_hostname }}:
          {{ component_record_docker.stderr | default('') }}. Bring Docker back and run again.
        quiet: true
      when: component_record_orphans.container | length > 0

    - name: Remove containers
      community.docker.docker_container:
        name: "{{ item }}"
        state: absent
      loop: "{{ component_record_orphans.container }}"
      register: component_record_containers
      when: component_record_docker.rc | default(1) == 0

    - name: Look up units
      systemd_unit:
        name: "{{ item }}"
      loop: "{{ component_record_orphans.unit }}"
      register: component_record_units
      check_mode: true  # read-only; a unit not installed is LoadState not-found, no failure

    # A unit that refuses a manual stop does its work when stopped (it detaches the NFS
    # mounts): disabled only, it stops at the next shutdown.
    - name: Stop and disable units
      systemd_unit:
        name: "{{ item.item }}"
        state: "{{ omit if item.status.RefuseManualStop | default('no') == 'yes' else 'stopped' }}"
        enabled: false
      loop: "{{ component_record_units.results }}"
      loop_control:
        label: "{{ item.item }}"
      register: component_record_stopped
      when: item.status.LoadState | default('not-found') not in ['not-found', 'masked']

    - name: Remove files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ component_record_orphans.file }}"
      register: component_record_files

    - name: Reload systemd after unit files went
      systemd_unit:
        daemon_reload: true
      when: >-
        component_record_files.results | select('changed') | map(attribute='item')
        | select('match', '/(etc|usr/lib|lib)/systemd/') | list | length > 0

    # A directory goes only when empty: anything left in it is not ours to remove.
    - name: Remove empty directories
      change_command:
        argv:
          - python3
          - -c
          - |
            import os, sys
            try:
                os.rmdir(sys.argv[1])
                print("removed")
            except FileNotFoundError:
                print("gone")
            except OSError:
                print("kept")
          - "{{ item }}"
      register: component_record_rmdir
      changed_when: >-
        ansible_check_mode or (component_record_rmdir.stdout == 'removed')
      loop: "{{ component_record_orphans.dir | sort | reverse }}"

    - name: Remove packages
      ansible.builtin.include_role:
        name: host_baseline
        tasks_from: absent
      vars:
        host_baseline_absent_packages: "{{ component_record_orphans.package }}"
      when: component_record_orphans.package | length > 0

    - name: Note what was removed
      ansible.builtin.set_fact:
        component_record_removed:
          mount: "{{ component_record_mounts.results | default([]) | select('changed') | map(attribute='item') | list }}"
          container: >-
            {{ component_record_containers.results | default([]) | select('changed') | map(attribute='item') | list }}
          unit: >-
            {{ component_record_stopped.results | default([]) | select('changed') | map(attribute='item.item') | list }}
          file: "{{ component_record_files.results | default([]) | select('changed') | map(attribute='item') | list }}"
          dir: "{{ component_record_rmdir.results | default([]) | select('changed') | map(attribute='item') | list }}"
          package: >-
            {{ (host_baseline_present | default([])) if component_record_orphans.package | length > 0 else [] }}


# The source digest (what decides the component on the host) is no business of this
# call: the play that applied the component records it at its very end, after the
# handlers (tasks_from: sources), the one path every managed role records through.
- name: "Record the component {{ component_record_name ~ ' (' ~ component_record_action ~ ')' }}"
  component_record:
    path: "{{ component_record_path }}"
    name: "{{ component_record_name }}"
    action: "{{ component_record_action }}"
    items: "{{ component_record_items }}"
    version: "{{ component_record_version | string }}"
    exclusive_packages: "{{ component_record_exclusive_packages }}"
    legacy: "{{ component_record_legacy }}"
    role: "{{ component_record_role }}"
  register: component_record_recorded

# Exported once, at the play's end (tasks_from: sources), with everything the play wrote.
- name: Note that this play wrote the record
  ansible.builtin.set_fact:
    component_record_play_wrote: true
  when:
    - component_record_action != 'begin'  # what is there until the deploy ends stays shown
    - component_record_recorded.written | default(false)
