---
# component_record -- the host's record of what deepops installed for each component,
# and the removal of what no component needs any longer (docs/deepops/component-state.md).
#
#   - ansible.builtin.include_role:
#       name: component_record
#     vars:
#       component_record_name: rsyslog_server
#       component_record_action: begin      # begin, present or absent
#       component_record_version: ""        # begin and present
#       component_record_items:             # KIND:ID; kinds: package, unit, container,
#         - package:rsyslog                 # file, dir, mount (an fstab entry)
#         - file:/etc/rsyslog.d/01-deepops-listen.conf
#
# begin, before a component installs anything: it is recorded as installing with the
# items it will add. present, after: the items are the whole set it needs now; what only
# an earlier version needed is removed. absent: the component leaves every item's owner
# set; items is what it installed before the record existed (adopted; packages only
# those in component_record_exclusive_packages). Whatever no component needs any longer is
# removed: fstab entries first (never unmounted: a live mount stays until the next boot,
# since unmounting under logged-in users fails or, with a dead server, hangs), then
# containers, units (stopped and disabled), files, empty directories, and packages last
# (roles/host_baseline). Data is never an item, so it is never removed.
# component_record_removed lists, by kind, what this call actually removed: restart or
# rebuild on it, never on the orphans (an adopted orphan that was never there is one).
# absent also withdraws the calling role's pending reboot request (roles/maintenance).
component_record_name: ""
component_record_action: ""
component_record_version: ""
component_record_items: []
# absent adopts a package only when this names it: what only this component installs.
# A package other roles also install (python3-docker, nodejs) is freed by the record
# alone, when its last recorded owner goes.
component_record_exclusive_packages: []
# absent adopts a file an earlier deepops version wrote without a mark when its whole
# content fullmatches one of these, per file item: {path: [regex, ...]}, shaped on
# deepops' own text (<role>_legacy in the component's vars/main.yml), never a site value.
component_record_legacy: {}
component_record_path: /etc/ansible/facts.d/deepops_components.fact
# The calling role: its mark ("# Managed by roles/<role>") lets absent adopt a file it
# wrote; it also names the role's reboot request.
component_record_role: "{{ ansible_parent_role_names | default([]) | first | default('') }}"
