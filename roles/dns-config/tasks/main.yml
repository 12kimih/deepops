---
- name: Assert that the required variables are defined
  ansible.builtin.assert:
    that:
      - dns_config_servers | length > 0
    fail_msg: "Set dns_config_servers in config/group_vars."
    quiet: true

# The two ways to set a host's resolver exclude each other: this one stops
# systemd-resolved, which roles/dns_resolver points at its unbound.
- name: Refuse a host that resolves through roles/dns_resolver
  ansible.builtin.assert:
    that: "'dns_resolver' not in (ansible_facts.ansible_local.deepops_components.components | default({}))"
    fail_msg: >-
      {{ inventory_hostname }} resolves through unbound (roles/dns_resolver); this playbook
      would stop systemd-resolved under it. Remove that first (dns_resolver absent), or
      leave this host out.
    quiet: true

# systemd-resolved manages /etc/resolv.conf as a symlink to a stub resolver on
# Ubuntu 18.04+ (including 22.04/24.04/26.04). Disable it so a static
# /etc/resolv.conf can be written.
- name: Disable systemd-resolved (Ubuntu 18.04+)
  systemd_unit:
    name: systemd-resolved
    state: stopped
    enabled: false
  when: ansible_facts.distribution == 'Ubuntu' and ansible_facts.distribution_version is version('18.04', '>=')

- name: Check /etc/resolv.conf
  ansible.builtin.stat:
    path: /etc/resolv.conf
  register: dns_config_resolv

# Replace the systemd-resolved stub symlink with a real file before templating,
# otherwise the template writes through the stub (and is then overwritten).
- name: Remove the systemd-resolved stub symlink
  ansible.builtin.file:
    path: /etc/resolv.conf
    state: absent
  when: dns_config_resolv.stat.islnk | default(false)

- name: Install /etc/resolv.conf
  ansible.builtin.template:
    src: resolv.conf.j2
    dest: /etc/resolv.conf
    owner: root
    group: root
    mode: "0644"

# Its own token only (roles/nsswitch): a whole `hosts: files dns` line dropped what
# other clients put there.
- name: Look up host names in DNS
  ansible.builtin.include_role:
    name: nsswitch
  vars:
    nsswitch_source: dns
    nsswitch_databases: [hosts]
