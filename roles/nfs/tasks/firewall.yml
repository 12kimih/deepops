---
- name: Gather package facts
  ansible.builtin.package_facts:
    manager: rpm
  tags:
    - nfs
  when:
    - ansible_facts.os_family == "RedHat"

- name: Gather service facts
  ansible.builtin.service_facts:
  tags:
    - nfs
  when:
    - ansible_facts.os_family == "RedHat"

# Permanent, and also live when firewalld runs: nothing has to be restarted to load
# them, neither firewalld nor, behind it, rpcbind and nfsd.
- name: Configure firewall to allow NFS server
  ansible.posix.firewalld:
    service: "{{ item }}"
    permanent: true
    state: enabled
    immediate: "{{ ansible_facts.services.get('firewalld.service', {}).get('state') == 'running' }}"
  with_items:
    - mountd
    - rpc-bind
    - nfs
  tags:
    - nfs
  when:
    - ansible_facts.os_family == "RedHat"
    - "'firewalld' in ansible_facts.packages"
