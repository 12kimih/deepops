---
- name: Install ubuntu packages
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    name: nfs-kernel-server
    state: present
  when: ansible_facts.os_family == "Debian"
  tags:
    - nfs

- name: Ensure export path exists
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: "directory"
    mode: "0755"
  with_items: "{{ nfs_exports }}"
  register: nfs_export_dirs
  tags:
    - nfs

# A shared directory lives in a tree this host exports; anywhere else it would be made
# through another server's mount (root_squash) or on a disk nobody shares.
- name: Refuse a shared directory outside this server's exports
  ansible.builtin.assert:
    that:
      - _roots | length > 0
      - (item.path | regex_replace('/+$', '') ~ '/') is match('(' ~ (_roots | map('regex_escape') | join('|')) ~ ')')
    fail_msg: "{{ item.path }} is not inside an export of {{ inventory_hostname }} ({{ nfs_exports | map(attribute='path') | join(', ') }})."
    quiet: true
  vars:
    _roots: "{{ nfs_exports | map(attribute='path') | map('regex_replace', '/+$', '') | map('regex_replace', '$', '/') | list }}"
  loop: "{{ nfs_shared_dirs }}"
  loop_control:
    label: "{{ item.path }}"
  tags:
    - nfs

- name: Keep the shared directories at their owner and mode
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode }}"
  loop: "{{ nfs_shared_dirs }}"
  loop_control:
    label: "{{ item.path }} {{ item.mode }}"
  tags:
    - nfs

# Starting statd needs nothing else restarted, and a restart of nfs-server on a live
# server can hang nfsd and every client with it.
- name: Ensure statd is enabled
  systemd_unit:
    name: rpc-statd
    enabled: true
    state: started
  tags:
    - nfs

# Kept to go back to when the new file loses an export (below).
- name: Read the current exports
  ansible.builtin.slurp:
    src: /etc/exports
  register: nfs_exports_before
  failed_when: false  # none yet
  tags:
    - nfs

- name: Configure exports
  ansible.builtin.template:
    src: exports.j2
    dest: /etc/exports
    owner: root
    group: root
    mode: "0644"
  register: nfs_exports_copy
  tags:
    - nfs

# exports(5) changes take effect with exportfs -ra, without restarting nfsd: a restart
# drops every client's state and has hung nfsd before. A line exportfs cannot read is
# skipped, and the export it named stops at once under its clients; so what is exported
# afterwards is compared with nfs_exports, and a difference puts the previous file back.
- name: Load the exports
  when: nfs_exports_copy is changed or nfs_export_dirs is changed
  tags:
    - nfs
  block:
    - name: Load the exports
      change_command:
        argv: [exportfs, -ra]

    - name: Read what is exported
      ansible.builtin.command:
        argv: [exportfs, -s]
      register: nfs_exported
      changed_when: false
      when: not ansible_check_mode

    - name: Require every export to be exported
      ansible.builtin.assert:
        that: nfs_exports_missing | length == 0
        fail_msg: "exportfs did not export {{ nfs_exports_missing | join(', ') }}; see /etc/exports."
        quiet: true
      vars:
        nfs_exports_missing: >-
          {{ nfs_exports | map(attribute='path') | map('regex_replace', '/+$', '')
             | difference(nfs_exported.stdout_lines | map('split') | map('first') | list) }}
      when: not ansible_check_mode
  rescue:
    - name: Put the previous exports back
      ansible.builtin.copy:
        content: "{{ nfs_exports_before.content | b64decode }}"
        dest: /etc/exports
        mode: "0644"
      when: nfs_exports_before.content is defined

    - name: Load the previous exports
      change_command:
        argv: [exportfs, -ra]

    - name: Report the refused exports
      ansible.builtin.fail:
        msg: >-
          {{ ansible_failed_result.msg | default('exportfs failed') }}
          {{ 'The previous /etc/exports is back and loaded.' if nfs_exports_before.content is defined else '' }}

# The filesystem each export lives on: an export inside a larger filesystem (a
# directory under /) is watched as that filesystem.
- name: Find the filesystem of each export
  ansible.builtin.command:
    argv: [findmnt, --noheadings, --output, TARGET, --target, "{{ item.path }}"]
  loop: "{{ nfs_exports }}"
  loop_control:
    label: "{{ item.path }}"
  register: nfs_exports_mounts
  changed_when: false
  check_mode: false  # read-only; --check needs the result
  tags:
    - nfs

- name: Publish the exports for Prometheus
  ansible.builtin.include_role:
    name: textfile_keep
    apply:
      tags: [nfs]
  vars:
    textfile_keep_name: "{{ nfs_exports_textfile }}"
    textfile_keep_content: |
      # HELP nfs_export_info An NFS export of this host and the filesystem it lives on (roles/nfs).
      # TYPE nfs_export_info gauge
      {% for result in nfs_exports_mounts.results %}
      nfs_export_info{path="{{ result.item.path }}",mountpoint="{{ result.stdout | trim }}"} 1
      {% endfor %}
  when: nfs_exports | length > 0
  tags:
    - nfs

# threads= in the [nfsd] section of /etc/nfs.conf is the modern nfs-utils knob
# (equivalent to the legacy RPCNFSDCOUNT); boots read it. A running nfsd takes the new
# count from `rpc.nfsd N`, without a restart; verify with `cat /proc/fs/nfsd/threads`.
# https://man7.org/linux/man-pages/man8/rpc.nfsd.8.html
- name: Configure nfsd thread count
  community.general.ini_file:
    path: /etc/nfs.conf
    section: nfsd
    option: threads
    value: "{{ nfs_server_threads }}"
    mode: "0644"
  when: nfs_exports | length > 0
  notify: Apply nfsd thread count
  tags:
    - nfs

# nfs-server.service is Type=oneshot, so systemd ignores Restart=. To make a failed
# START self-heal (classically rpc.nfsd ENOMEM when a package upgrade bounces the NFS
# stack) we point nfs-server's OnFailure= at a small helper unit that retries the
# restart a bounded number of times. Tunables: nfs_server_autorestart* (defaults/main.yml).
- name: Validate nfsd auto-restart timing (interval must exceed retries*delay)
  ansible.builtin.assert:
    that:
      - (nfs_server_autorestart_interval | int) > (nfs_server_autorestart_retries | int) * (nfs_server_autorestart_delay | int)
    fail_msg: >-
      nfs_server_autorestart_interval ({{ nfs_server_autorestart_interval }}s) must exceed
      nfs_server_autorestart_retries * nfs_server_autorestart_delay
      ({{ nfs_server_autorestart_retries }} * {{ nfs_server_autorestart_delay }} =
      {{ (nfs_server_autorestart_retries | int) * (nfs_server_autorestart_delay | int) }}s),
      or the StartLimit window resets mid-sequence and the retry cap never applies.
  when:
    - nfs_exports | length > 0
    - nfs_server_autorestart | bool
  tags:
    - nfs

# The canonical unit is nfs-server.service on both Debian (nfs-kernel-server is an
# alias symlink to it) and RHEL, so the drop-in and helper target that name directly.
- name: Install the condition of the nfsd auto-restart
  ansible.builtin.copy:
    src: nfs-server-start-failed
    dest: "{{ nfs_server_start_failed_check }}"
    owner: root
    group: root
    mode: "0755"
  when:
    - nfs_exports | length > 0
    - nfs_server_autorestart | bool
  tags:
    - nfs

- name: Install the nfsd auto-restart helper unit
  ansible.builtin.template:
    src: nfs-server-restart.service.j2
    dest: /etc/systemd/system/nfs-server-restart.service
    owner: root
    group: root
    mode: "0644"
  register: nfs_autorestart_units
  when:
    - nfs_exports | length > 0
    - nfs_server_autorestart | bool
  tags:
    - nfs

- name: Make a failed nfs-server start call the helper
  systemd_dropin:
    path: "{{ _nfs_autorestart_dropin }}"
    content: "{{ lookup('ansible.builtin.template', 'nfs-server-autorestart.conf.j2') }}"
  when:
    - nfs_exports | length > 0
    - nfs_server_autorestart | bool
  tags:
    - nfs

- name: Remove the nfsd auto-restart drop-in when disabled
  systemd_dropin:
    path: "{{ _nfs_autorestart_dropin }}"
    state: absent
  when: not (nfs_server_autorestart | bool)
  tags:
    - nfs

- name: Remove nfsd auto-restart units when disabled
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/nfs-server-restart.service
    - "{{ nfs_server_start_failed_check }}"
  register: nfs_autorestart_removed
  when: not (nfs_server_autorestart | bool)
  tags:
    - nfs

# Read before the start, so a server started here already carries OnFailure= (a handler
# at the end of the run read the units only after it; systemd_dropin reloads for its own).
- name: Read the changed nfs-server units
  systemd_unit:
    daemon_reload: true
  when: nfs_autorestart_units is changed or nfs_autorestart_removed is changed
  tags:
    - nfs

- name: Ensure nfs server is running
  systemd_unit:
    name: "{{ nfs_server_daemon }}"
    state: started
    enabled: true
  when: nfs_exports | length > 0
  tags:
    - nfs
