---
- name: Gather OS specific variables
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - files:
        - "{{ ansible_facts.distribution | lower }}.yml"
        - "{{ ansible_facts.os_family | lower }}.yml"
      paths:
        - ../vars
      skip: true
  tags:
    - vars
    - nfs

# The server's exports are a component (docs/deepops/component-state.md), removed only
# explicitly: present where the deploy wants a server, kept elsewhere, absent where the
# site lists nfs in deepops_component_removals. The mounts are roles/nfs_client.
- name: Check the component state
  ansible.builtin.assert:
    that: nfs_state in ['present', 'absent', 'kept']
    fail_msg: "nfs_state must be present, absent or kept, not {{ nfs_state }}."
    quiet: true
  tags: always

- name: "Make the NFS server {{ nfs_state }}"
  ansible.builtin.include_tasks: "{{ nfs_state }}.yml"
  when: nfs_state != 'kept'
  tags: always
