---
- name: Gather OS specific variables
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - files:
        - "{{ ansible_facts.distribution | lower }}.yml"
        - "{{ ansible_facts.os_family | lower }}.yml"
      paths:
        - ../vars
      skip: true
  tags:
    - vars
    - nfs

- name: Install Ubuntu packages
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    name: nfs-common
    state: present
  when: ansible_facts.os_family == "Debian"
  tags:
    - nfs

- name: Install RHEL packages
  ansible.builtin.dnf:
    name: nfs-utils
    state: present
  when: ansible_facts.os_family == "RedHat"
  tags:
    - nfs

- name: Configure idmapd domain for nfsv4
  ansible.builtin.lineinfile:
    dest: /etc/idmapd.conf
    regexp: "^Domain"
    insertafter: "^# Domain"
    line: "Domain = {{ nfs_idmapd_domain }}"
    backup: true
  when: nfs_idmapd_domain is defined
  tags:
    - nfs

# Raise TCP/socket buffers for the NFS data path on fast cluster networks (applies on both
# NFS servers and clients). https://nfs.sourceforge.net/nfs-howto/ar01s05.html
# A container shares the host kernel, so setting these from inside one is either
# impossible (read-only /proc/sys) or would mutate the host - skip there (this
# also lets molecule's docker converge run cleanly). Bare metal and full VMs are
# still tuned.
- name: Tune the network buffers for NFS
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/30-nfs-tuning.conf
    sysctl_set: true
    state: present
    reload: true
  loop: "{{ nfs_network_sysctls | dict2items }}"
  when:
    - nfs_tune_network | bool
    - ansible_facts.virtualization_type | default('') not in ['docker', 'container', 'containerd', 'podman', 'lxc', 'systemd-nspawn']
  tags:
    - nfs
    - molecule-notest

- name: Setup server
  ansible.builtin.include_tasks: server.yml
  when: nfs_is_server
  tags: always

- name: Setup firewall
  ansible.builtin.include_tasks: firewall.yml
  when: nfs_is_server
  tags: always

- name: Setup client
  ansible.builtin.include_tasks: client.yml
  when: nfs_is_client
  tags: always

# A host that is not one of the declared NFS servers runs no NFS server: a server set
# up by hand once keeps exporting long after its use ends (data exports were found on
# compute nodes, offered to every host). Opt-in: only once nfs_servers names the
# servers. The exported data on disk is left alone; the client side stays.
- name: Retire the NFS server on hosts that are not NFS servers
  when:
    - nfs_servers | length > 0
    - inventory_hostname not in nfs_servers
  tags:
    - nfs
  block:
    - name: Read the service list
      ansible.builtin.service_facts:

    - name: Stop and disable the NFS server
      ansible.builtin.systemd:
        name: "{{ nfs_server_daemon }}"
        state: stopped
        enabled: false
      when: (nfs_server_daemon ~ '.service') in ansible_facts.services

    # On RHEL the server lives in nfs-utils with the client, so only the service goes.
    - name: Remove the NFS server package and its exports (Debian)
      ansible.builtin.include_role:
        name: host_baseline
        tasks_from: absent
      vars:
        host_baseline_absent_packages: [nfs-kernel-server]
      when: ansible_facts.os_family == 'Debian'
