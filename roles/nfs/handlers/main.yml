---
- name: Restart rpcbind
  ansible.builtin.service:
    name: rpcbind
    state: restarted

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart nfs
  ansible.builtin.service:
    name: "{{ nfs_server_daemon }}"
    state: restarted

# exports(5) changes take effect with exportfs -ra, without restarting nfsd: a restart
# drops every client's state and has hung nfsd before. Restart nfs is for nfsd's own
# settings (threads in nfs.conf).
- name: Reload NFS exports
  ansible.builtin.command:
    cmd: exportfs -ra
  changed_when: true
