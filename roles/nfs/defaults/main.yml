---
nfs_idmapd_domain: localdomain

nfs_is_server: false
nfs_is_client: false

nfs_exports: []
nfs_mounts: []

# Client mount options for any nfs_mounts entry that does not carry its own `options`,
# so a site tunes one string instead of repeating it per mount.
#
# x-systemd.automount is what makes the mount survive a reboot of the whole cluster.
# A plain fstab entry is attempted once, at boot: a client that reaches remote-fs.target
# before its server is serving fails the mount, and `nofail` then lets the boot continue
# with the share missing and nothing ever retrying it. An automount entry is instead
# established without contacting the server and mounted on first access, so the order
# nodes boot in stops mattering -- including the case where two nodes export to each
# other and neither can be "first". A failed attempt is retried on the next access.
#
# _netdev keeps the unit in remote-fs.target (and after the network), nofail keeps a
# dead server from holding up the boot. Sized for a 100GbE+ fabric; see
# docs/slurm-cluster/slurm-nfs.md for the tuning knobs and `man 5 nfs`.
nfs_mount_options: "rw,hard,vers=4.2,nconnect=16,rsize=1048576,wsize=1048576,proto=tcp,timeo=600,retrans=2,noatime,_netdev,nofail,x-systemd.automount"

# Install a unit that lazily detaches the NFS mounts at shutdown, so a server rebooting
# alongside its clients cannot stall them. Lets the mounts stay `hard`; `soft` would
# trade the hang for silent write corruption.
nfs_detach_on_shutdown: true

# Number of nfsd (kernel NFS server) threads. The Linux default is only 8, far too
# few for many concurrent clients under heavy random I/O: each nfsd thread serves
# one RPC at a time and blocks on disk, so too few threads serializes clients and
# the server bottlenecks while CPU/disk sit idle. The NFS-HOWTO rule of thumb is
# 4-8 threads per CPU core; busy servers run 64-256. We ship a fixed default of 128
# (a solid baseline for a multi-core server under concurrent client load) and let you
# set it explicitly in config/ - lower it on small or lightly-loaded servers, raise it
# toward 256 on large, busy ones. We deliberately do NOT auto-size to
# CPU count: on large hosts that yields very high counts (e.g. 4 x 48 vCPUs = 192)
# that can fail to start with ENOMEM on a busy/long-running server, because each
# thread reserves rsize/wsize-sized buffers that need contiguous pages under memory
# fragmentation. Tune empirically by watching `sockets-enqueued` in
# /proc/fs/nfsd/pool_stats under load (a growing value = too few threads); verify
# the live count with `cat /proc/fs/nfsd/threads`. Do NOT use the
# /proc/net/rpc/nfsd "th" histogram - it was removed in kernel 2.6.32 and always
# reads zero. (rpc.nfsd(8); NFS-HOWTO 5.6; kernel knfsd-stats)
nfs_server_threads: 128

# Auto-recovery for nfs-server.service. That unit is Type=oneshot, so systemd ignores
# Restart=; instead we install an OnFailure= drop-in pointing at a small helper unit
# (nfs-server-restart.service) that retries `systemctl restart nfs-server` a bounded
# number of times. This turns a transient FAILED start -- classically rpc.nfsd exiting
# ENOMEM when a package upgrade bounces the NFS stack -- from an indefinite outage into
# a brief, self-healing blip, while still giving up after a few tries so a persistent
# failure is surfaced instead of flapping. Behavior: on a failed start, retry every
# _delay seconds, up to _retries times (~_retries*_delay s total), then stop. The unit
# enforces _interval > _retries*_delay (else the StartLimit window resets mid-sequence
# and the cap never bites).
nfs_server_autorestart: true
nfs_server_autorestart_retries: 10     # StartLimitBurst on the helper (max retries)
nfs_server_autorestart_delay: 30       # seconds between retries (helper ExecStartPre sleep)
nfs_server_autorestart_interval: 600   # StartLimitIntervalSec window; must exceed retries*delay

# Network/socket-buffer tuning for the NFS data path, sized for a 100GbE+ cluster
# fabric as the GENERAL default. Lower these in config/ for slower
# fabrics if you prefer -- but the values are safe ceilings (TCP autotunes within
# them), so leaving them is fine on 10/25GbE too. Bigger buffers keep a single
# high-bandwidth flow's window full across the bandwidth-delay product; the old
# 16 MiB ceiling throttles single-stream throughput far below 100G line rate.
# Values follow ESnet's Fasterdata 100G host-tuning guide. Applied on both NFS
# servers and clients. Set nfs_tune_network=false to skip.
# https://fasterdata.es.net/host-tuning/linux/
nfs_tune_network: true
nfs_network_sysctls:
  net.core.rmem_max: "2147483647"               # 2 GiB-1 max recv buffer (ESnet 100G)
  net.core.wmem_max: "2147483647"               # 2 GiB-1 max send buffer
  net.core.rmem_default: "262144"               # per-socket default; TCP autotunes up
  net.core.wmem_default: "262144"
  net.core.optmem_max: "1048576"                # ancillary buffer (MSG_ZEROCOPY)
  net.ipv4.tcp_rmem: "4096 131072 1073741824"   # min/default/1 GiB autotune ceiling
  net.ipv4.tcp_wmem: "4096 16384 1073741824"
  net.core.netdev_max_backlog: "300000"         # default 1000 drops packets at 100G
  net.ipv4.tcp_mtu_probing: "1"                 # use with jumbo frames (MTU 9000)
  net.core.default_qdisc: "fq"                  # fair-queue pacing for fast flows
  net.core.somaxconn: "4096"                    # larger listen backlog for many clients
# For peak single-mount throughput also set sunrpc.tcp_slot_table_entries=128
# (and tcp_max_slot_table_entries=128). Not set here because the sunrpc module may
# not be loaded yet at provision time; add it on the client once NFS is in use.
