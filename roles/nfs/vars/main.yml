---
# What the server component installs, for its record (roles/component_record). The
# exported directories and nfs_shared_dirs are data and never items; the shared part
# (nfs_common_items) is recorded beside these.
nfs_items: >-
  {{ (['package:nfs-kernel-server'] if ansible_facts.os_family == 'Debian' else [])
     + ['unit:nfs-server.service', 'unit:nfs-server-restart.service',
        'file:/etc/systemd/system/nfs-server-restart.service',
        'file:/etc/systemd/system/nfs-server.service.d/auto-restart.conf',
        'dir:/etc/systemd/system/nfs-server.service.d',
        'file:' ~ node_exporter_prom_dir ~ '/' ~ nfs_exports_textfile ~ '.prom',
        'file:' ~ node_exporter_prom_keep_dir ~ '/' ~ nfs_exports_textfile ~ '.prom',
        'file:/etc/tmpfiles.d/deepops-textfile-' ~ nfs_exports_textfile ~ '.conf'] }}
# What this server exports and the filesystem each export lives on, for Prometheus
# (roles/textfile_keep): the shared-storage usage alert watches exactly these.
nfs_exports_textfile: nfs-exports
