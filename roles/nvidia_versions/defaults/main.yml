---
# The NVIDIA driver branch, written once for every role whose packages must match it
# (the driver itself, DCGM).

# Driver branch to install (e.g. "580", "575"). Open modules require Turing+.
nvidia_driver_branch: "580"

# The oldest driver branch each CUDA major runs on (CUDA toolkit release notes,
# "minimum required driver version"). A new CUDA major is one more line here.
# https://docs.nvidia.com/cuda/cuda-toolkit-release-notes/index.html
nvidia_cuda_min_driver_branch:
  11: 450
  12: 525
  13: 580
# The newest CUDA major the driver branch serves; packages built per CUDA major
# (DCGM 4) and the CUDA toolkits follow it.
nvidia_driver_cuda_major: >-
  {{ nvidia_cuda_min_driver_branch | dict2items
     | selectattr('value', 'le', nvidia_driver_branch | int)
     | map(attribute='key') | map('int') | max }}
