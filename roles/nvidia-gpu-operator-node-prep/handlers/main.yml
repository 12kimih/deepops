---
- name: Update-initramfs (Debian)
  change_command:
    cmd: update-initramfs -u
  when: ansible_facts.os_family == "Debian"
  listen: Update-initramfs

- name: Backup initramfs (RedHat)
  change_shell:
    cmd: mv /boot/initramfs-$(uname -r).img /boot/initramfs-$(uname -r).img.bak
  when: ansible_facts.os_family == "RedHat"
  listen: Update-initramfs

- name: Update-initramfs (RedHat)
  change_shell:
    cmd: dracut /boot/initramfs-$(uname -r).img $(uname -r)
  when: ansible_facts.os_family == "RedHat"
  listen: Update-initramfs
