---
# Mount the NFS entries in this host's fstab that are not mounted, waiting up to
# nfs_mount_wait_timeout for each server: the same script the retry timer runs
# (files/nfs-client-retry), shipped by the script module so it works on any host, set up
# by roles/nfs_client or not. It reads fstab, not nfs_mounts: what this host was actually
# set up to mount. Each line it prints is an attempt; a share left unmounted fails the host.
- name: Mount the NFS entries that are missing
  ansible.builtin.script:
    cmd: "nfs-client-retry --wait {{ nfs_mount_wait_timeout | int }}"
    executable: python3
  register: nfs_client_mount_result
  changed_when: "nfs_client_mount_result.stdout_lines | select('search', ': mounted$') | list | length > 0"
  failed_when: nfs_client_mount_result.rc != 0
  when: not ansible_check_mode  # it mounts; a preview has nothing to show
  tags:
    - nfs_mount

- name: Show what was attempted
  ansible.builtin.debug:
    msg: "{{ nfs_client_mount_result.stdout_lines | default([]) }}"
  when: not ansible_check_mode and nfs_client_mount_result.stdout_lines | default([]) | length > 0
  tags:
    - nfs_mount
