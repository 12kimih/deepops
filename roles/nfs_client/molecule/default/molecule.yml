---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: nfs-client-ubuntu-2404
    image: geerlingguy/docker-ubuntu2404-ansible
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  ansible_args:
    - -vv
  inventory:
    group_vars:
      all:
        # No mounts: a container has no server to mount from; the role's own files and
        # its record are what this checks. The host's network buffers are not ours.
        nfs_mounts: []
        nfs_tune_network: false
scenario:
  test_sequence: [destroy, syntax, create, prepare, converge, idempotence, side_effect, verify, destroy]
verifier:
  name: ansible
