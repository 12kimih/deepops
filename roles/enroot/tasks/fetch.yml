---
- name: Fetch an enroot release file
  ansible.builtin.include_role:
    name: download
  vars:
    download_url: "{{ enroot_release_base_url }}/{{ enroot_release_file }}"
    download_checksum: "{{ enroot_checksums[enroot_release_file] | default('') }}"
    download_dest: "{{ deepops_cache_dir }}/{{ enroot_release_file }}"
  loop: "{{ _enroot_files }}"
  loop_control:
    loop_var: enroot_release_file

# Under --check a file not fetched yet is not there to install.
- name: Note whether every release file is here
  ansible.builtin.stat:
    path: "{{ deepops_cache_dir }}/{{ item }}"
  loop: "{{ _enroot_files }}"
  register: enroot_fetched

- name: Remember it
  ansible.builtin.set_fact:
    enroot_fetched_all: "{{ enroot_fetched.results | rejectattr('stat.exists') | list | length == 0 }}"
