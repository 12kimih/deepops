---
- name: Check the component state
  ansible.builtin.assert:
    that: enroot_state in ['present', 'absent', 'kept']
    fail_msg: "enroot_state must be present, absent or kept, not {{ enroot_state }}."
    quiet: true

- name: "Make enroot {{ enroot_state }}"
  ansible.builtin.include_tasks: "{{ enroot_state }}.yml"
  when: enroot_state != 'kept'
