---
# The kernel settings it needs (roles/host_baseline tasks_from: sysctl).
enroot_sysctl_file: "{{ deepops_sysctl_prefix }}enroot.conf"
# What the component installs, for its record (roles/component_record). The files it
# writes in environ.d, hooks.d and mounts.d are recorded by roles/recorded_files.
enroot_items: >-
  {{ (enroot_packages | map('regex_replace', '^', 'package:') | list)
     + ['file:/etc/enroot/enroot.conf.d/90-deepops.conf', 'file:/etc/tmpfiles.d/enroot.conf',
        'file:' ~ enroot_sysctl_file, 'file:/etc/bash_completion.d/enroot.bash_completion'] }}
