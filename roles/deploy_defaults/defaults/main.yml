---
# What a deploy includes: the switches the deploy playbooks and their component plays
# read, defined once. A play reading one lists this role first in its roles, so the
# value is a role default (the lowest precedence) that config/ overrides; an import's
# `when` is evaluated in the imported plays and sees it there. config.example shows
# each switch commented at its default. Never write `| default(...)` for these.

# Both deploys
deepops_disable_cloud_init: true
deepops_set_hostname: true
chrony_install: true
docker_install: true
install_dcgm: true
nvidia_driver_force_install: false

# Slurm deploy (playbooks/slurm-cluster.yml)
slurm_configure_etc_hosts: true
slurm_enable_container_registry: true
slurm_enable_nginx_docker_cache: false
slurm_cluster_install_nvidia_driver: true
slurm_enable_nfs_server: true
slurm_enable_nfs_client_nodes: true
# Accounts (docs/deepops/accounts.md). Which directory each host reads accounts from:
# nis (roles/nis_client), ldap (roles/sssd_client) or none. A host moving from NIS to
# LDAP sets ldap in its host_vars first (a canary); the client it leaves stays until
# the site names it in deepops_component_removals (a directory goes only explicitly).
directory_service: "{{ 'nis' if nis_domain | length > 0 and nis_server | length > 0 else 'none' }}"
# The NIS domain and the server its clients bind to; the [nis-master] host serves it
# (roles/nis_server). Empty: no NIS.
nis_domain: ""
nis_server: ""
# The LDAP tree's suffix (dc=example,dc=internal); set, the [ldap-server] host serves it
# (roles/ldap_server). Empty: no LDAP.
ldap_suffix: ""
# The people role keeps the roster's homes, and their local accounts where no LDAP
# directory holds them, on the account source (the host with /home on its own disk)
people_manage_accounts: false
slurm_install_nhc: true
slurm_cluster_install_openmpi: false
slurm_install_lmod: true
slurm_install_hpcsdk: false
slurm_enable_monitoring: true
# The Open OnDemand web portal on the controller (needs its login and TLS settings)
slurm_install_open_ondemand: false
# The site's commands, shell defaults, login banner and per-user limits (roles/cluster_tools)
slurm_install_cluster_tools: true
slurm_enable_rsyslog_server: true
slurm_enable_rsyslog_client: true
slurm_login_on_compute: false
allow_user_set_gpu_clocks: false
slurm_cluster_configure_gpu_power_limit: true
slurm_install_enroot: true
slurm_install_pyxis: true
# Rootless Podman on compute nodes, for Dockerfile builds in CPU jobs (roles/podman)
slurm_install_podman: true
# The daily cleanup of users' podman storage and enroot cache (roles/container_storage_gc)
slurm_container_storage_gc: true
# Where users may connect outside the cluster (roles/egress_policy); needs
# egress_policy_internal_networks
slurm_enable_egress_policy: false
# A local resolver on every host that blocks tunnel services by name
# (roles/dns_resolver); the egress policy lets users send DNS to it alone
slurm_enable_dns_resolver: false

# Components whose removal is explicit only (removal: explicit in the registry,
# roles/deploy_defaults/vars/main.yml: the driver, authentication, Slurm, MUNGE, the NFS
# server). Turning their switch off, or a host leaving their group, leaves them as they
# are; listing one here removes it from the hosts where nothing wants it any more.
deepops_component_removals: []
# What a component play does (plugins/filter/components.py component_phase): converge
# when run alone; a deploy imports each one with install, then again with remove at
# its end, in reverse dependency order, so nothing is removed from under what needs it.
deepops_phase: converge

# Kubernetes deploy (playbooks/k8s-cluster.yml)
kube_enable_container_registry: false
kube_enable_rsyslog_server: true
kube_enable_rsyslog_client: true
deepops_gpu_operator_enabled: true
# Set to true for DGX and other systems with pre-installed drivers
gpu_operator_preinstalled_nvidia_software: true
k8s_nfs_client_provisioner: true
# The NFS server playbooks/k8s-cluster/nfs-client-provisioner.yml sets up on
# kube_control_plane[0] (false: use an existing one at k8s_nfs_server), whether it
# creates the export directory, and the directory the provisioner uses
k8s_deploy_nfs_server: true
k8s_nfs_mkdir: true
k8s_nfs_export_path: /export/deepops_nfs
# The in-cluster registry's name (playbooks/k8s-cluster/container-registry.yml): its
# ingress host and the name every node resolves to the control plane.
container_registry_hostname: registry.local
# Component playbooks run on their own
# NVIDIA MIG Manager (playbooks/nvidia-software/nvidia-mig.yml,
# https://github.com/NVIDIA/mig-parted): the profile; the site's mig-parted config
# (mig_manager_config_src) and where it lands on the node; and the hooks file. The
# hooks are what keeps a layout across reboots: the package's apply-start hook writes
# the config, hooks and profile into the service's override.conf, which reapplies
# them at boot. The package links hooks.yaml to the hooks that fit the GPU (minimal
# ones from Hopper on); they also stop and restart the GPU's services around a mode
# change.
mig_manager_profile: all-disabled
mig_manager_config_src: "{{ inventory_dir }}/nvidia-mig-config.yml"
mig_manager_config: /etc/nvidia-mig-manager/config.yml
mig_manager_hooks: /etc/nvidia-mig-manager/hooks.yaml
# The containers playbooks/ngc-ready-server.yml tests
ngc_ready_cuda_container: nvcr.io/nvidia/cuda:13.2.1-base-ubuntu24.04
ngc_ready_pytorch_container: nvcr.io/nvidia/pytorch:26.05-py3
ngc_ready_tensorflow_container: nvcr.io/nvidia/tensorflow:25.02-tf2-py3
# GPU clocks playbooks/utilities/nvidia-set-gpu-clocks.yml locks ("MIN,MAX" MHz), or
# resets with gpu_clock_reset: true
gpu_clock_lock: ""
gpu_clock_reset: false
# Packages playbooks/generic/software.yml adds on every host
software_extra_packages: []
# /etc/rc.local's managed block (playbooks/generic/rc-local.yml); empty leaves none
rc_local_contents: ""
