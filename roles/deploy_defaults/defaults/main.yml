---
# What a deploy includes: the switches the deploy playbooks and their component plays
# read, defined once. A play reading one lists this role first in its roles, so the
# value is a role default (the lowest precedence) that config/ overrides; an import's
# `when` is evaluated in the imported plays and sees it there. config.example shows
# each switch commented at its default. Never write `| default(...)` for these.

# Both deploys
deepops_disable_cloud_init: true
deepops_set_hostname: true
chrony_install: true
docker_install: true
install_dcgm: true
nvidia_driver_force_install: false

# Slurm deploy (playbooks/slurm-cluster.yml)
slurm_configure_etc_hosts: true
slurm_enable_container_registry: true
slurm_enable_nginx_docker_cache: false
slurm_cluster_install_nvidia_driver: true
slurm_enable_nfs_server: true
slurm_enable_nfs_client_nodes: true
# Accounts (docs/deepops/accounts.md). Which directory each host reads accounts from:
# nis (roles/nis_client), ldap (roles/sssd_client) or none. A host moving from NIS to
# LDAP sets ldap in its host_vars first (a canary); the client it leaves stays until
# the site names it in deepops_component_removals (a directory goes only explicitly).
directory_service: "{{ 'nis' if nis_domain | length > 0 and nis_server | length > 0 else 'none' }}"
# The NIS domain and the server its clients bind to; the [nis-master] host serves it
# (roles/nis_server). Empty: no NIS.
nis_domain: ""
nis_server: ""
# The LDAP tree's suffix (dc=example,dc=internal); set, the [ldap-server] host serves it
# (roles/ldap_server). Empty: no LDAP.
ldap_suffix: ""
# The people role keeps the roster's homes, and their local accounts where no LDAP
# directory holds them, on the account source (the host with /home on its own disk)
people_manage_accounts: false
slurm_install_nhc: true
slurm_cluster_install_openmpi: false
slurm_install_lmod: true
slurm_install_hpcsdk: false
# One system-wide CUDA toolkit from NVIDIA's repository on every host (roles/nvidia_cuda);
# leave off where CUDA is served per minor as modules (slurm_install_cuda_toolkit)
slurm_install_cuda: false
# EasyBuild and the easyconfigs in easybuild_packages, built into the shared software
# tree by the first slurm-master (roles/easy-build)
slurm_install_easybuild: false
# CUDA toolkits from NVIDIA's runfiles as `module load cuda/<minor>` (roles/
# nvidia_cuda_toolkit): about 8 GB of shared software tree per CUDA minor
slurm_install_cuda_toolkit: false
slurm_enable_monitoring: true
# Daily backups of the controller with a monthly restore test (roles/slurm_backup);
# nothing until slurm_backup_destinations is set
slurm_enable_backup: true
# Weekly DCGM diagnostics on the idle GPU nodes, from the first controller
# (roles/gpu_diag_idle); a node failing twice is drained. Needs DCGM on the nodes.
slurm_enable_gpu_diag_idle: true
# iocost on the NFS server's disks, by cgroup weight, from a measured model per mount
# (roles/io_fairness; needs io_fairness_models, docs/slurm-cluster/io-fairness.md)
slurm_enable_io_fairness: false
# The Open OnDemand web portal on the controller (needs its login and TLS settings)
slurm_install_open_ondemand: false
# The site's commands, shell defaults, login banner and per-user limits (roles/cluster_tools)
slurm_install_cluster_tools: true
slurm_enable_rsyslog_server: true
slurm_enable_rsyslog_client: true
# fail2ban on every host (roles/fail2ban): bans an address after repeated failed logins.
# Off leaves an installed fail2ban alone; deepops_component_removals: [fail2ban] removes it.
slurm_enable_fail2ban: false
slurm_login_on_compute: false
slurm_cluster_configure_gpu_power_limit: true
# PCIe ACS off on the compute nodes for GPU peer-to-peer (roles/pcie_acs): bare metal only
slurm_disable_pcie_acs: false
# Every host's power management at full performance (roles/power_policy): CPU governor,
# turbo, PCIe ASPM, SATA and NVMe link power, at boot and held on a timer
slurm_enable_power_policy: false
slurm_install_enroot: true
slurm_install_pyxis: true
# Rootless Podman on compute nodes, for Dockerfile builds in CPU jobs (roles/podman)
slurm_install_podman: true
# The daily cleanup of users' podman storage and enroot cache (roles/container_storage_gc)
slurm_enable_container_storage_gc: true
# Where users may connect outside the cluster (roles/egress_policy); needs
# cluster_networks
slurm_enable_egress_policy: false
# What may reach the hosts: the cluster's networks and each host's open ports
# (roles/ingress_policy); needs cluster_networks
slurm_enable_ingress_policy: false
# A local resolver on every host that blocks tunnel services by name
# (roles/dns_resolver); the egress policy lets users send DNS to it alone
slurm_enable_dns_resolver: false
# Crashes to systemd-coredump on every host, cores only within the crashing process's
# core size limit (roles/coredump), in place of apport's core handler
slurm_enable_coredump: true
# Per-user disk quotas on the login nodes' disks and the home server's /home
# (roles/disk_quota): off by default; needs the quota mount options in
# host_baseline_mount_options
slurm_enable_disk_quota: false
# The shared space on the home server (roles/shared_space, on the first slurm-nfs): shared
# datasets, models and container images one account writes for everyone, and the
# collaboration folders of shared_projects. Off by default.
slurm_enable_shared_space: false
# Submission holds (roles/submit_holds, on slurm-master): who cannot submit Slurm jobs
# for now, told why at submit time; their running jobs go on. A person past their roster
# `ends` is held from the next day, without a deploy; with submit_holds_disk, a person at
# a disk hard limit too, until they free space. Off by default; needs the rendered
# job_submit.lua (slurm_job_submit_plugins: lua with the role's template). Run slurm.yml
# after it.
slurm_enable_submit_holds: false
# Hold a person at a disk hard limit as well (needs the disk quota metrics). Off by default.
submit_holds_disk: false
# The date (YYYY-MM-DD) holds start, a grace for everyone already at a hard limit when they
# are turned on: before it no one is held, and the disk report says from when they will
# be. "" holds at once.
submit_holds_from: ""
# The per-job private directories on an XFS filesystem of their own, sized for Slurm's
# --tmp (roles/job_scratch), on slurm-node: off by default (it preallocates disk);
# deploy it while the nodes run no jobs
slurm_enable_job_scratch: false
# The fast scratch space, every active person's own directory on it, as under /home
# (roles/scratch_space), on [scratch-server]; each person's space there is their user
# quota (roles/disk_quota on the same host)
slurm_enable_scratch_space: false
# The cluster's Slack app for requests users make themselves (roles/cluster_bot), on the
# first slurm-master; needs slack_bot_token and slack_app_token
slurm_enable_cluster_bot: false
# Slurm job notices as Slack DMs (roles/job_notice), on slurm-master; sends nothing
# without slack_bot_token. On does not notify every job: only a job that asks gets one
# (sbatch --mail-type=END,FAIL, or SBATCH_MAIL_TYPE in a person's shell), as Slurm defines.
slurm_enable_job_notices: true

# How long users have to clean up what the cluster will otherwise remove: unused
# container stores (roles/container_storage_gc), unused files on /scratch, and every
# other user-facing cleanup reads this one value. Quotas have none: their warn level only
# notifies, and only the hard limit refuses a write.
cluster_user_grace_days: 14
# When a person's files count as unused: what the cluster removes once they have gone
# this long untouched (files on /scratch, a former member's files and login) and what
# the cleanup reports list. One value, so every cleanup agrees.
cluster_user_stale_days: 60
# Every personal warning comes at this fraction of the limit it warns about: a person's
# warn level of each hard limit (roles/disk_quota). Only hard limits refuse anything.
cluster_user_warn_fraction: 0.9
# How full a filesystem is before the daily disk report names its largest users with a
# mention (at most every slurm_usage_report_disk_repeat_days); below it they are listed
# without one. A filesystem's fill, unlike a person's warn level.
cluster_disk_fill_fraction: 0.8
# How many folders worth cleaning (unused past cluster_user_stale_days, the largest and
# longest unused first) each filesystem's scan names for the daily disk report.
cluster_cleanup_top: 20

# Components whose removal is explicit only (removal: explicit in the registry,
# roles/deploy_defaults/vars/main.yml: the driver, authentication, Slurm, MUNGE, the NFS
# server). Turning their switch off, or a host leaving their group, leaves them as they
# are; listing one here removes it from the hosts where nothing wants it any more.
deepops_component_removals: []
# What a component play does (plugins/filter/components.py component_phase): converge
# when run alone; a deploy imports each one with install, then again with remove at
# its end, in reverse dependency order, so nothing is removed from under what needs it.
deepops_phase: converge

# Kubernetes deploy (playbooks/k8s-cluster.yml)
kube_enable_container_registry: false
kube_enable_rsyslog_server: true
kube_enable_rsyslog_client: true
kube_enable_fail2ban: false
kube_enable_coredump: true
deepops_gpu_operator_enabled: true
# Set to true for DGX and other systems with pre-installed drivers
gpu_operator_preinstalled_nvidia_software: true
k8s_nfs_client_provisioner: true
# The NFS server playbooks/k8s-cluster/nfs-client-provisioner.yml sets up on
# kube_control_plane[0] (false: use an existing one at k8s_nfs_server), whether it
# creates the export directory, and the directory the provisioner uses
k8s_deploy_nfs_server: true
k8s_nfs_mkdir: true
k8s_nfs_export_path: /export/deepops_nfs
# The in-cluster registry's name (playbooks/k8s-cluster/container-registry.yml): its
# ingress host and the name every node resolves to the control plane.
container_registry_hostname: registry.local
# Component playbooks run on their own
# NVIDIA MIG Manager (playbooks/nvidia-software/nvidia-mig.yml,
# https://github.com/NVIDIA/mig-parted): the profile; the mig-parted configuration;
# and the hooks file. The configuration is the package's own unless the site names a
# reviewed file of its own (mig_manager_config_src, copied to mig_manager_config): the
# package generates it from the GPUs' MIG profiles at every boot
# (/etc/nvidia-mig-manager/config.yaml, service.sh), so its profile names fit the GPU.
# The hooks are what keeps a layout across reboots: the package's apply-start hook
# writes the config, hooks and profile into the service's override.conf, which
# reapplies them at boot. The package links hooks.yaml to the hooks that fit the GPU
# (minimal ones from Hopper on); they also stop and restart the GPU's services around
# a mode change.
mig_manager_profile: all-disabled
mig_manager_config_src: ""
mig_manager_config: /etc/nvidia-mig-manager/config.yml
mig_manager_hooks: /etc/nvidia-mig-manager/hooks.yaml
# The containers the GPU checks run: playbooks/ngc-ready-server.yml, the NCCL test of
# playbooks/slurm-cluster/slurm-validation.yml (PyTorch), and the validators'
# defaults (scripts/validation/validate_k8s.py --cuda-image, validate_runai.py --image
# and --memory-image read them here). CUDA on the nodes' Ubuntu release.
# upstream: registry \d+\.\d+\.\d+-base-ubuntu24\.04
ngc_ready_cuda_container: "nvcr.io/nvidia/cuda:13.5.0-base-ubuntu24.04@sha256:8c30b31b13a97ee353c21e666b227dea44f4331d38a221f257de70fc04b437d0"
ngc_ready_pytorch_container: "nvcr.io/nvidia/pytorch:26.11-py3@sha256:0d31ce7e80cda1b1f07357004530a2f41d6754a6ddae28af508134c63c59fe0b"
# upstream: hold 25.02 is NGC's last TensorFlow container (NVIDIA ended the series)
ngc_ready_tensorflow_container: "nvcr.io/nvidia/tensorflow:25.02-tf2-py3@sha256:c83b37d26f19ab00d8a13cf974edd079c3d099918ec3110c304a989d6e2f75d5"
# upstream: registry 3\.\d+-slim
validation_python_container: "python:3.15-slim@sha256:65a65fc7b30b06cb6df4930fd4650697cb23f4c2698ab81fc87e4b031bc36928"
# GPU clocks playbooks/utilities/nvidia-set-gpu-clocks.yml locks ("MIN,MAX" MHz), or
# resets with gpu_clock_reset: true
gpu_clock_lock: ""
gpu_clock_reset: false
# Packages playbooks/generic/software.yml adds on every host, without their
# recommendations (each one wanted is listed too)
software_extra_packages: []
# Vendor packages no repository carries (a RAID controller's CLI), each a .deb the site
# keeps (under config/files) with its sha256: {file, sha256}. The file is the pin: a run
# refuses one whose checksum differs, copies it to the host and installs it with apt,
# and no repository can move it. Per host, where the hardware is.
software_vendor_debs: []
