---
# The components a deploy converges, each with the switches and groups that make it
# present (docs/deepops/component-state.md, plugins/filter/components.py). Structure,
# not settings: sites turn the switches in roles/deploy_defaults/defaults/main.yml.
deepops_component_registry:
  # Time sync: present wherever a deploy runs while chrony_install is on; the site's own
  # with chrony_install false; removed only when named (a host must keep time).
  chrony:
    role: deepops_chrony
    removal: explicit
    managed: "{{ chrony_install }}"
    rules:
      - {switch: "{{ chrony_install }}", group: slurm-cluster}
      - {switch: "{{ chrony_install }}", group: k8s_cluster}
  # Accounts (docs/deepops/accounts.md): taking a directory away locks its users out, so
  # no switch or group does; the site retires one in deepops_component_removals (NIS,
  # after every host reads LDAP). Servers first, then the clients that bind to them.
  ldap_server:
    removal: explicit
    rules:
      - {switch: "{{ ldap_suffix | length > 0 }}", group: ldap-server, first: true}
  nis_server:
    removal: explicit
    rules:
      - {switch: "{{ nis_domain | length > 0 }}", group: nis-master, first: true}
  nis_client:
    removal: explicit
    rules:
      - {switch: "{{ directory_service == 'nis' }}", group: all}
  sssd_client:
    removal: explicit
    rules:
      - {switch: "{{ directory_service == 'ldap' }}", group: all}
  rsyslog_server:
    rules:
      - {switch: "{{ slurm_enable_rsyslog_server }}", group: slurm-master, first: true}
      - {switch: "{{ kube_enable_rsyslog_server }}", group: kube_control_plane, first: true}
  rsyslog_client:
    rules:
      - {switch: "{{ slurm_enable_rsyslog_client }}", group: slurm-node}
      - {switch: "{{ kube_enable_rsyslog_client }}", group: k8s_cluster}
  # Removing it lifts every ban, and a site often installed it by hand before deepops
  # managed it: a switch left off never takes it away; deepops_component_removals does.
  fail2ban:
    removal: explicit
    rules:
      - {switch: "{{ slurm_enable_fail2ban }}", group: slurm-cluster}
      - {switch: "{{ kube_enable_fail2ban }}", group: k8s_cluster}
  # The container engine: present where a component needs it, never removed by a switch
  # (stopping it stops every container on the host, users' too), left alone where the
  # site manages Docker itself (docker_install: false).
  docker:
    removal: explicit
    managed: "{{ docker_install }}"
    rules: []
  # One registry for the cluster (its image store stays when it goes).
  standalone_container_registry:
    role: standalone-container-registry
    rules:
      - {switch: "{{ slurm_enable_container_registry }}", group: slurm-master}
      - {switch: "{{ kube_enable_container_registry }}", group: kube_control_plane}
    needs: [docker]
  # The registry cache proxy, and the hosts whose Docker pulls through it.
  nginx_docker_cache:
    role: nginx-docker-registry-cache
    rules:
      - {switch: "{{ slurm_enable_nginx_docker_cache }}", group: slurm-cache}
    needs: [docker]
  nginx_docker_cache_client:
    role: nginx-docker-registry-cache-client
    rules:
      - {switch: "{{ slurm_enable_nginx_docker_cache }}", group: slurm-node}
    needs: [docker]
  # The Kubernetes GPU stack: the GPU Operator, or the device plugin and GPU Feature
  # Discovery without it (never both). Cluster releases, decided on the first control
  # plane host.
  gpu_operator:
    role: nvidia-gpu-operator
    rules:
      - {switch: "{{ deepops_gpu_operator_enabled }}", group: kube_control_plane, first: true}
  k8s_gpu_plugin:
    role: nvidia-k8s-gpu-device-plugin
    rules:
      - {switch: "{{ not deepops_gpu_operator_enabled | bool }}", group: kube_control_plane, first: true}
  k8s_gpu_feature_discovery:
    role: nvidia-k8s-gpu-feature-discovery
    rules:
      - {switch: "{{ not deepops_gpu_operator_enabled | bool }}", group: kube_control_plane, first: true}
  # The NFS client provisioner, a cluster release.
  k8s_nfs_client:
    role: nfs-client-provisioner
    rules:
      - {switch: "{{ k8s_nfs_client_provisioner }}", group: kube_control_plane, first: true}
  # Monitoring. An entry's key is its variable prefix (<key>_state); role names the
  # role where that differs. Prometheus scrapes each exporter where it is present.
  prometheus:
    rules:
      - {switch: "{{ slurm_enable_monitoring }}", group: slurm-metric}
    needs: [docker]
  alertmanager:
    rules:
      - {switch: "{{ slurm_enable_monitoring }}", group: slurm-metric}
    needs: [docker]
  grafana:
    rules:
      - {switch: "{{ slurm_enable_monitoring }}", group: slurm-metric}
    needs: [docker, prometheus]
  node_exporter:
    role: prometheus-node-exporter
    rules:
      - {switch: "{{ slurm_enable_monitoring }}", group: slurm-cluster}
    needs: [docker]
  ipmi_exporter:
    role: prometheus-ipmi-exporter
    rules:
      - {switch: "{{ slurm_enable_monitoring }}", group: slurm-cluster}
    needs: [docker]
  slurm_exporter:
    role: prometheus-slurm-exporter
    retired: "slurmctld serves its own metrics (MetricsType=metrics/openmetrics), 2026-11"
  dcgm_exporter:
    role: nvidia-dcgm-exporter
    rules:
      - {switch: "{{ slurm_enable_monitoring }}", group: slurm-node}
    needs: [docker, nvidia_container_toolkit]
  # Text files node_exporter publishes; the report reads Prometheus.
  # Each job's and login's I/O on every node, for the I/O notices and dashboards.
  io_usage:
    rules:
      - {switch: "{{ slurm_enable_monitoring }}", group: slurm-cluster}
    needs: [node_exporter]
  slurm_metrics:
    rules:
      - {switch: "{{ slurm_enable_monitoring }}", group: slurm-metric}
    needs: [node_exporter]
  # Daily controller backups with a monthly restore test, on the first controller; the
  # role is absent until slurm_backup_destinations names one. The backup sets stay.
  slurm_backup:
    rules:
      - {switch: "{{ slurm_enable_backup }}", group: slurm-master, first: true}
  # Weekly DCGM diagnostics on the idle GPU nodes, run from the first controller; only
  # where the nodes have DCGM. Each node's last result stays.
  gpu_diag_idle:
    rules:
      - {switch: "{{ slurm_enable_gpu_diag_idle and install_dcgm }}", group: slurm-master, first: true}
  # iocost on the NFS servers' disks, from the site's measured models.
  io_fairness:
    rules:
      - {switch: "{{ slurm_enable_io_fairness }}", group: slurm-nfs}
  # Slurm's MailProg as Slack DMs, on every controller (MailProg must be on each).
  job_notice:
    rules:
      - {switch: "{{ slurm_enable_job_notices }}", group: slurm-master}
  # Who may not submit for now, on every controller (job_submit.lua reads it there).
  submit_holds:
    rules:
      - {switch: "{{ slurm_enable_submit_holds }}", group: slurm-master}
  slurm_usage_report:
    rules:
      - {switch: "{{ slurm_enable_monitoring }}", group: slurm-metric}
    needs: [prometheus]
  open_ondemand:
    rules:
      - {switch: "{{ slurm_install_open_ondemand }}", group: slurm-master, first: true}
  # Lmod and the hooks that give every shell `module`; the module trees are data.
  lmod:
    rules:
      - {switch: "{{ slurm_install_lmod }}", group: slurm-cluster}
  cluster_tools:
    rules:
      - {switch: "{{ slurm_install_cluster_tools }}", group: slurm-cluster}
  # The NFS server's exports: every node's /home may hang on them, so never removed
  # implicitly (deepops_component_removals).
  nfs:
    removal: explicit
    rules:
      - {switch: "{{ slurm_enable_nfs_server }}", group: slurm-nfs}
      - {switch: "{{ k8s_deploy_nfs_server }}", group: kube_control_plane, first: true}
  # The mounts of those exports: unmounting /home under logged-in users fails or hangs,
  # so never removed implicitly either.
  nfs_client:
    removal: explicit
    rules:
      - {switch: "{{ slurm_enable_nfs_client_nodes }}", group: slurm-nfs-client}
  # The NVIDIA driver on GPU hosts (DGX OS keeps its own): on Slurm hosts with the
  # switch, on Kubernetes hosts unless the GPU Operator brings it. Removing it breaks
  # every GPU job and needs a reboot, so only deepops_component_removals does.
  nvidia_driver:
    removal: explicit
    rules:
      - {switch: "{{ slurm_cluster_install_nvidia_driver }}", group: slurm-cluster}
      - {switch: "{{ not deepops_gpu_operator_enabled | bool or gpu_operator_preinstalled_nvidia_software | bool }}", group: k8s_cluster}
  # The NVIDIA Container Toolkit on GPU hosts: what runs GPU containers needs it (enroot's
  # hook, the DCGM exporter under Docker), and Kubernetes hosts unless the GPU Operator
  # brings it with the driver.
  nvidia_container_toolkit:
    rules:
      - {switch: "{{ not deepops_gpu_operator_enabled | bool or gpu_operator_preinstalled_nvidia_software | bool }}", group: k8s_cluster}
  # The cap on GPU nodes; removing it resets each GPU to its default limit.
  nvidia_power_limit:
    rules:
      - {switch: "{{ slurm_cluster_configure_gpu_power_limit }}", group: slurm-node}
  pcie_acs:
    rules:
      - {switch: "{{ slurm_disable_pcie_acs }}", group: slurm-node}
  power_policy:
    rules:
      - {switch: "{{ slurm_enable_power_policy }}", group: slurm-cluster}
  # The NVIDIA HPC SDK, installed by the first login node into shared storage; it
  # registers with Lmod.
  hpcsdk:
    role: nvidia_hpc_sdk
    rules:
      - {switch: "{{ slurm_install_hpcsdk }}", group: slurm-login, first: true}
  # One system-wide CUDA toolkit from NVIDIA's repository.
  cuda:
    role: nvidia_cuda
    rules:
      - {switch: "{{ slurm_install_cuda }}", group: slurm-cluster}
  # CUDA toolkits as Lmod modules, installed by the first controller into the shared
  # software tree every node mounts.
  cuda_toolkit:
    role: nvidia_cuda_toolkit
    rules:
      - {switch: "{{ slurm_install_cuda_toolkit }}", group: slurm-master, first: true}
  # EasyBuild, installed by the first controller into the shared software tree; what it
  # built is data.
  easybuild:
    role: easy-build
    rules:
      - {switch: "{{ slurm_install_easybuild }}", group: slurm-master, first: true}
  # enroot on login and compute hosts (its GPU hook runs the container toolkit); pyxis's
  # node setup needs it (its Slurm plugin follows the same switches in roles/slurm).
  enroot:
    rules:
      - {switch: "{{ slurm_install_enroot }}", group: slurm-cluster}
    needs: [nvidia_container_toolkit]
  pyxis:
    rules:
      - {switch: "{{ slurm_install_enroot and slurm_install_pyxis }}", group: slurm-cluster}
    needs: [enroot]
  # Rootless Podman for image builds in CPU jobs (the users' stores stay when it goes).
  podman:
    rules:
      - {switch: "{{ slurm_install_podman }}", group: slurm-node}
  # The daily cleanup of users' podman storage and enroot cache; the stores themselves
  # are users' data and stay when it goes.
  container_storage_gc:
    rules:
      - {switch: "{{ slurm_enable_container_storage_gc }}", group: slurm-cluster}
  # Open MPI built from source, where users build and run MPI programs.
  openmpi:
    rules:
      - {switch: "{{ slurm_cluster_install_openmpi }}", group: slurm-cluster}
  # The job directories' own filesystem on the compute nodes, before slurmd uses it.
  job_scratch:
    rules:
      - {switch: "{{ slurm_enable_job_scratch }}", group: slurm-node}
  # Node Health Check on the compute nodes; slurmd's health check follows the switch.
  nhc:
    rules:
      - {switch: "{{ slurm_install_nhc }}", group: slurm-node}
  # NVIDIA DCGM on the GPU nodes (a node without GPUs gets nothing).
  dcgm:
    role: nvidia_dcgm
    rules:
      - {switch: "{{ install_dcgm }}", group: slurm-node}
  # Blocks tunnel services by name; absent hands DNS back to systemd-resolved's stub.
  dns_resolver:
    rules:
      - {switch: "{{ slurm_enable_dns_resolver }}", group: slurm-cluster}
  egress_policy:
    rules:
      - {switch: "{{ slurm_enable_egress_policy }}", group: slurm-cluster}
  ingress_policy:
    rules:
      - {switch: "{{ slurm_enable_ingress_policy }}", group: slurm-cluster}
  coredump:
    rules:
      - {switch: "{{ slurm_enable_coredump }}", group: slurm-cluster}
      - {switch: "{{ kube_enable_coredump }}", group: k8s_cluster}
  # The login nodes' disks, the home server's /home and the scratch server's /scratch
  # (disk_quota_filesystems per host).
  disk_quota:
    rules:
      - {switch: "{{ slurm_enable_disk_quota }}", group: slurm-login}
      - {switch: "{{ slurm_enable_disk_quota }}", group: slurm-nfs}
      - {switch: "{{ slurm_enable_disk_quota }}", group: scratch-server}
  # Each login's own /tmp and /var/tmp on the login nodes (pam_namespace).
  login_private_dirs:
    rules:
      - {switch: "{{ slurm_enable_login_private_dirs }}", group: slurm-login}
  # New SSH sessions per person on the login nodes (roles/ssh_rate): it only refuses,
  # so removing it takes nothing from anyone.
  ssh_rate:
    rules:
      - {switch: "{{ slurm_enable_ssh_rate }}", group: slurm-login}
  # Shared data and collaboration folders where /home is local; their data stays.
  shared_space:
    rules:
      - {switch: "{{ slurm_enable_shared_space }}", group: slurm-nfs, first: true}
  # The fast scratch space, every person's directory on it (roles/scratch_space), on the
  # host whose local filesystem holds it. The directories are data: never removed.
  scratch_space:
    rules:
      - {switch: "{{ slurm_enable_scratch_space }}", group: scratch-server}
  # The cluster's Slack app (roles/cluster_bot), on one host: the first slurm-master.
  cluster_bot:
    rules:
      - {switch: "{{ slurm_enable_cluster_bot }}", group: slurm-master, first: true}

# Every other role a play applies that changes a host, by role name, with its kind and
# the one playbook that brings its hosts level (docs/deepops/component-state.md, Not
# components). Never in the present/absent map above: a deploy records what each was
# deployed from at the end of its play (component_record tasks_from: sources), so
# ComponentNotDeployed and sync.py name a host a fix has not reached. Kinds:
#   policy     a value the role keeps (an enum or a mode): no absent, another value instead
#   oneshot    a migration or a setting made once (hosts, home directories, secrets)
#   permanent  converged on every run, with no removal path yet
#   operation  a step run on request (a drain, a window, a firmware update): registered,
#              never recorded, since its run is no desired state
deepops_managed_roles:
  ai_agent_rules: {kind: policy, playbook: playbooks/slurm-cluster/ai-agent-rules.yml}
  ara_server: {kind: permanent, playbook: playbooks/utilities/ara-server.yml}
  autofs: {kind: permanent, playbook: playbooks/generic/authentication.yml}
  # Records its boot files through component_record (owner sets), with no absent path.
  bmc: {kind: permanent, playbook: playbooks/utilities/bmc.yml}
  cachefilesd: {kind: permanent, playbook: playbooks/generic/cachefilesd.yml}
  cluster_sudoers: {kind: permanent, playbook: playbooks/generic/cluster-sudoers.yml}
  deepops_hosts: {kind: oneshot, playbook: playbooks/generic/hosts.yml}
  default_target: {kind: policy, playbook: playbooks/generic/default-target.yml}
  dns-config: {kind: permanent, playbook: playbooks/generic/dns-config.yml}
  docker-login: {kind: permanent, playbook: playbooks/container/docker-login.yml}
  docker_socket_group: {kind: permanent, playbook: playbooks/container/docker-socket-group.yml}
  facts: {kind: permanent, playbook: playbooks/slurm-cluster/nhc.yml}
  host_baseline: {kind: permanent, playbook: playbooks/generic/host-baseline.yml}
  k8s-internal-container-registry: {kind: permanent, playbook: playbooks/k8s-cluster/container-registry.yml}
  kerberos_client: {kind: permanent, playbook: playbooks/generic/authentication.yml}
  locale: {kind: policy, playbook: playbooks/generic/locale.yml}
  login_shells: {kind: permanent, playbook: playbooks/generic/software.yml}
  maas-controller: {kind: permanent, playbook: playbooks/provisioning/maas.yml}
  maintenance: {kind: operation}
  maintenance_window: {kind: operation}
  mofed: {kind: permanent, playbook: playbooks/utilities/mofed.yml}
  move-home-dirs: {kind: oneshot, playbook: playbooks/generic/authentication.yml}
  netapp-trident: {kind: permanent, playbook: playbooks/k8s-cluster/netapp-trident.yml}
  netplan: {kind: permanent, playbook: playbooks/generic/netplan.yml}
  node_user_policy: {kind: policy, playbook: playbooks/generic/node-user-policy.yml}
  nvidia-dgx: {kind: permanent, playbook: playbooks/nvidia-dgx/nvidia-dgx.yml}
  nvidia-dgx-firmware: {kind: operation}
  nvidia-mig-manager: {kind: permanent, playbook: playbooks/nvidia-software/nvidia-mig.yml}
  nvidia-network-operator: {kind: permanent, playbook: playbooks/k8s-cluster/nvidia-network-operator.yaml}
  nvidia-peer-memory: {kind: permanent, playbook: playbooks/nvidia-software/nvidia-peer-memory.yml}
  nvidia_ecc: {kind: policy, playbook: playbooks/nvidia-software/nvidia-ecc.yml}
  os_updates: {kind: policy, playbook: playbooks/generic/os-updates.yml}
  people: {kind: permanent, playbook: playbooks/generic/people.yml}
  root_access: {kind: permanent, playbook: playbooks/generic/root-access.yml}
  runai: {kind: policy, playbook: playbooks/k8s-cluster/runai.yml}
  serial_console: {kind: permanent, playbook: playbooks/generic/serial-console.yml}
  site_secrets: {kind: oneshot, playbook: playbooks/slurm-cluster/site-secrets.yml}
  # Slurm and MUNGE (one role): its absent path, which makes it a component with
  # removal: explicit, comes with the rework of its templates.
  slurm: {kind: permanent, playbook: playbooks/slurm-cluster/slurm.yml}
  sshd: {kind: permanent, playbook: playbooks/generic/sshd.yml}
  stale_files: {kind: permanent, playbook: playbooks/utilities/stale-files.yml}

# This host's desired state of each component: present or absent.
deepops_components: >-
  {{ deepops_component_registry | components_desired(groups, inventory_hostname, deepops_component_removals) }}

# submit_holds_from's local midnight as Unix time, 0 for "" (at once): one reading for
# the holds (roles/submit_holds) and the disk report that announces them. A day quoted
# or not (plugins/filter/days.py).
submit_holds_from_time: "{{ submit_holds_from | day_start }}"
