---
# The components a deploy converges, each with the switches and groups that make it
# present (docs/deepops/component-state.md, plugins/filter/components.py). Structure,
# not settings: sites turn the switches in roles/deploy_defaults/defaults/main.yml.
# Components move here batch by batch; one not listed is still installed by its switch.
deepops_component_registry:
  rsyslog_server:
    rules:
      - {switch: "{{ slurm_enable_rsyslog_server }}", group: slurm-master, first: true}
      - {switch: "{{ kube_enable_rsyslog_server }}", group: kube_control_plane, first: true}
  rsyslog_client:
    rules:
      - {switch: "{{ slurm_enable_rsyslog_client }}", group: slurm-node}
      - {switch: "{{ kube_enable_rsyslog_client }}", group: k8s_cluster}
  # Monitoring. An entry's key is its variable prefix (<key>_state); role names the
  # role where that differs. Prometheus scrapes each exporter where it is present.
  prometheus:
    rules:
      - {switch: "{{ slurm_enable_monitoring }}", group: slurm-metric}
  alertmanager:
    rules:
      - {switch: "{{ slurm_enable_monitoring }}", group: slurm-metric}
  grafana:
    rules:
      - {switch: "{{ slurm_enable_monitoring }}", group: slurm-metric}
    needs: [prometheus]
  node_exporter:
    role: prometheus-node-exporter
    rules:
      - {switch: "{{ slurm_enable_monitoring }}", group: slurm-cluster}
  ipmi_exporter:
    role: prometheus-ipmi-exporter
    rules:
      - {switch: "{{ slurm_enable_monitoring }}", group: slurm-cluster}
  slurm_exporter:
    role: prometheus-slurm-exporter
    rules:
      - {switch: "{{ slurm_enable_monitoring }}", group: slurm-metric}
  dcgm_exporter:
    role: nvidia-dcgm-exporter
    rules:
      - {switch: "{{ slurm_enable_monitoring }}", group: slurm-node}
  # Text files node_exporter publishes; the report reads Prometheus.
  slurm_metrics:
    rules:
      - {switch: "{{ slurm_enable_monitoring }}", group: slurm-metric}
    needs: [node_exporter]
  slurm_usage_report:
    rules:
      - {switch: "{{ slurm_enable_monitoring }}", group: slurm-metric}
    needs: [prometheus]

# This host's desired state of each component: present or absent.
deepops_components: >-
  {{ deepops_component_registry | components_desired(groups, inventory_hostname, deepops_component_removals) }}
